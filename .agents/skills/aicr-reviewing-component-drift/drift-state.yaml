#
# Carries context between invocations of aicr-reviewing-component-drift: what
# was reviewed at which candidate set, what verdict it got, and what would
# change a hold. The weekly Slack digest is stateless by design, so it repeats
# the same components until someone acts; this file is what keeps the review
# from repeating with it.
#
# `candidates` is the whole set the verdict was formed against, not just the
# pair: a new candidate can appear while `from` and `to` both stay put, and a
# verdict keyed on the pair alone would be reused without anyone seeing it.
# Entries below that predate this field carry none, which Step 1 treats as
# changed -- they are re-derived rather than confirmed.
#
# reviews:
#   - component: nvsentinel
#     from: v1.20.0
#     to: v1.23.0
#     candidates:            # verbatim from the report: latest + alternatives[] + predating[]
#       - minor v1.23.0
#       - patch v1.20.3
#       - predating major v2.0.0
#     recommends: v1.20.3    # omit when the row had no alternatives
#     verdict: hold          # take | hold | defer
#     reviewed: 2026-09-21
#     reason: CRD migration needs an ADR-021 record first
#     revisit_when: an upgrade record exists for v1.20 -> v1.23

reviews:
  # Report run 45129434286 (2026-11-23) reviewed against main 81480ae97;
  # tracked in #4009.
  - component: agentgateway
    from: v1.5.0
    to: v1.7.0
    candidates:
      - minor v1.7.0
    verdict: take
    reviewed: 2026-11-23
    reason: >-
      v1.6.0 and v1.7.0 are genuine agentgateway releases (the OCI source
      annotation points at agentgateway/agentgateway; no v2.x tags remain).
      Values paths and the 4 CRDs' served versions are unchanged, but the
      release changes behavior: Messages requests convert via Responses,
      provider base URLs without a path mean `/`, guards scan tool output by
      default, dynamic backends cannot reach loopback, and CRD defaults are
      no longer stored. Needs a manual record.
    revisit_when: "the v1.7.0 PR tracked in #4009 lands"
  - component: agentgateway-crds
    from: v1.5.0
    to: v1.7.0
    candidates:
      - minor v1.7.0
    verdict: take
    reviewed: 2026-11-23
    reason: Lockstep with agentgateway; same 4 CRDs and served versions.
    revisit_when: "the v1.7.0 PR tracked in #4009 lands"
