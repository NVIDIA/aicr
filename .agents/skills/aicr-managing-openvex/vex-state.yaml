# Carried state for the aicr-managing-openvex skill: the working notes one
# invocation has to hand the next. Read it at the start of an invocation, and
# update it at the end. It is NOT part of `.openvex.json`, which is signed,
# published on every release image, and consumed by scanners that need none of
# this. It is also not a changelog: what a revision changed belongs in that
# revision's PR description.
#
# Three kinds of entry, each with its own lifecycle. The lifecycle is the point
# of the file: state that is never removed is what turned the document's
# `tooling` field into 8,010 bytes of accumulated prose (NVIDIA/aicr#2706).
#
#   deferred_verifications  A check that cannot be completed in the session
#                           that wrote it, because it needs a later CI run.
#                           DELETE the entry once the check has been RUN and
#                           PASSED, recording the outcome in the PR that
#                           resolves it. `resolves_when` must name that outcome,
#                           never the event that merely makes the check
#                           runnable: "the release published" is not a result.
#                           Bind it to the specific run the check names, too: a
#                           later green run does not discharge an unexamined
#                           earlier failure.
#                           A failed check is not a resolution either -- it is
#                           the finding you are now triaging. Any caveat on
#                           the evidence that made the check necessary lives on
#                           the entry and goes with it.
#   known_negatives         Work already done that came back negative, recorded
#                           so nobody repeats it. Each carries `invalidated_by`:
#                           the upstream event that makes it worth re-checking.
#                           DELETE once that event happens, do not rewrite it as
#                           history.
#   deliberate_exclusions   A decision not to act, recorded so the next
#                           maintainer does not silently reverse it. Also
#                           carries `invalidated_by`. DELETE when the condition
#                           it rests on changes.
#
# Every entry states what would invalidate it. An entry that cannot say what
# would invalidate it is not state; it is prose, and it belongs in a PR
# description or nowhere.
---
# Entries here are one-off by design: the skill runs each check at the start of
# an invocation and deletes the entry once it passes. That is what makes this
# different from `known_negatives` and `deliberate_exclusions`, which persist
# until their `invalidated_by` condition fires.
#
# A post-merge check belongs here rather than only in a PR description, because
# the skill reads this file and does not read PR descriptions. A check recorded
# only in a PR is a check nobody runs.
deferred_verifications:
  - id: revision-16-tooling-not-published
    opened: 2026-09-10
    document_version: 16
    why_deferred: >-
      The projection is only produced during a release, so the published bytes
      cannot be inspected until the next release runs.
    check: >-
      The OpenVEX attestation on the next released image must carry `tooling`
      equal to the openvex-bind identifier and must contain none of the revision
      narrative removed at revision 16.
    how: |
      cosign verify-attestation --type openvex \
        --certificate-oidc-issuer https://token.actions.githubusercontent.com \
        --certificate-identity-regexp 'https://github.com/NVIDIA/aicr/.*' \
        ghcr.io/nvidia/aicr@<linux/amd64 digest> \
        | jq -rs '.[0].payload | @base64d | fromjson | .predicate.tooling'
    resolves_when: >-
      the command above has been run against THE FIRST release published after
      revision 16 AND returned the openvex-bind identifier. Three ways this does
      not resolve: the command has not been run; it returned anything else; or
      it passed against some later release while the first one was never
      checked. A release publishing is what makes the check runnable, not what
      resolves it, and a failure on the first release is the finding to triage
      rather than something a subsequent green release discharges.

  - id: aiperf-bench-base-v4-1-4-clears-glibc-and-sqlite
    opened: 2026-09-17
    document_version: 16
    why_deferred: >-
      The scan workflow builds the image from the head of main, so the rebuilt
      bytes this bump produces do not exist until the change merges.
    check: >-
      The first Weekly Image Vulnerability Scan run after the base bump merges
      must report aiperf-bench with 0 critical and 0 high, still at 11
      VEX-suppressed rows, and must name none of CVE-2026-5450, CVE-2026-5928,
      CVE-2026-11822, CVE-2026-11824.
    how: |
      gh run list -R NVIDIA/aicr --workflow vuln-scan-images.yaml --limit 1 \
        --json databaseId,headSha,createdAt
      gh run download <id> -R NVIDIA/aicr   # read aiperf-bench.txt
    evidence_caveat: >-
      The local validation behind this bump built and scanned linux/amd64 only.
      The arm64 leg rests on scanning the candidate BASE for both architectures
      (libc 2.41-12+deb13u4 and libsqlite3-0 3.46.1-7+deb13u2 on each), not on
      an arm64 aiperf-bench image, which was never built here. CI does not close
      that gap either: it scans the published manifest from an amd64 runner, so
      the arm64 image is never scanned end to end by anyone. The final stage
      only COPYs a venv, so no Debian package can enter after the base -- that
      is the reasoning this caveat qualifies, not a measurement.
    resolves_when: >-
      the run above has been read AND showed 0 critical / 0 high for
      aiperf-bench with 11 VEX-suppressed rows. A scheduled run merely firing
      does not resolve it, and a run that still lists any of the four CVEs is
      the finding to triage rather than a resolution.

known_negatives:
  - id: aiperf-pins-block-pillow-and-aiohttp-fixes
    checked: 2026-09-03
    finding: >-
      Neither surviving suppression can be remediated by a pin bump. aiperf
      pins pillow~=12.2.0 while the 10 pillow GHSAs are fixed in 12.3.0, and
      aiohttp~=3.13.3 (>=3.13.3,<3.14) while GHSA-cq5v-8q36-5273 is fixed in
      3.14.3. Both caps hold at aiperf 0.11.0 (installed) and 0.12.0 (newest
      upstream at the time of checking), so requiring a fixed version in
      validators/performance/requirements.txt would fail pip resolution rather
      than produce a fixed image.
    also: >-
      Both packages arrive through the copied virtualenv layer, not the
      distroless base, so no base-image bump can retire either statement.
    invalidated_by: >-
      an aiperf release later than 0.12.0 that relaxes either cap; re-check
      pyproject.toml before assuming the suppression is still unavoidable

deliberate_exclusions:
  - id: libexpat1-wont-fix-highs
    decided: 2026-08-27
    rechecked: 2026-09-17
    decision: >-
      The High findings on libexpat1 2.8.3-1~deb13u1 -- CVE-2026-66046, and
      CVE-2026-76956 / CVE-2026-76957 seen on the same package at the 2026-09-17
      recheck -- are deliberately NOT suppressed. Debian marks each wont-fix, so
      `--only-fixed` already withholds them from the reported counts, and
      pre-suppressing a wont-fix finding would hide it the moment a fix ships.
    invalidated_by: >-
      Debian shipping a fixed libexpat1; at that point the finding must surface
      and be remediated by the weekly image rebuild, not suppressed

  - id: object-monitor-go-cves-are-a-pin-bump
    decided: 2026-09-17
    decision: >-
      The 9 High findings on ghcr.io/nvidia/nvsentinel/kubernetes-object-monitor
      (8 Go stdlib advisories plus GHSA-2v4p-qf9q-27wj in grpc) get no VEX
      statement. AICR does not build that image -- the scan matrix pins it to
      nvsentinel's registry defaultVersion, currently v1.20.0 -- and the fix is
      reachable by bumping that pin: v1.21.0, v1.22.0 and v1.23.0 each scan with
      zero fixed-state findings at any severity. Remediation is tracked as the
      nvsentinel bump (#2596, drift verdict `take` for v1.20.0 -> v1.23.0), not
      here. A statement would also be a reachability claim about a third party's
      Go binary that this repo has no source to support.
    invalidated_by: >-
      the nvsentinel defaultVersion in recipes/registry.yaml advancing past
      v1.20.0, which removes the findings outright; or an object-monitor release
      carrying HIGH+ findings with no clean successor version, which would make
      the suppression question real for the first time
