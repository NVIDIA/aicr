apiVersion: batch/v1
kind: Job
metadata:
  name: gate
  namespace: 'gpu-operator'
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: gate
          image: ghcr.io/nvidia/aicr-gate:latest
