apiVersion: v1
kind: ServiceAccount
metadata:
  name: foo-readiness-gate
  namespace: foo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: foo-readiness-gate-foo
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces", "services", "configmaps", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["nvidia.com"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["operators.coreos.com"]
    resources: ["clusterserviceversions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: foo-readiness-gate-foo
subjects:
  - kind: ServiceAccount
    name: foo-readiness-gate
    namespace: foo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: foo-readiness-gate-foo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: foo-readiness-bundle
  namespace: foo
data:
  foo.yaml: |
    apiVersion: chainsaw.kyverno.io/v1alpha1
    kind: Test
---
apiVersion: batch/v1
kind: Job
metadata:
  name: foo-readiness-gate
  namespace: foo
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: foo-readiness-gate
      containers:
        - name: gate
          image: nvcr.io/nvidia/aicr:v1.0.0
          imagePullPolicy: IfNotPresent
          args:
            - --bundle-dir=/bundle
            - --namespace=foo
            - --timeout=2m0s
            - --poll-interval=10s
            - --stability-window=30s
            - --max-wait=1h30m0s
          volumeMounts:
            - name: bundle
              mountPath: /bundle
              readOnly: true
      volumes:
        - name: bundle
          configMap:
            name: foo-readiness-bundle
