repositories:
  - name: ghcr-io-nvidia-kai-scheduler
    url: ghcr.io/nvidia/kai-scheduler
    oci: true
helmDefaults:
  wait: true
  timeout: 600
  createNamespace: true
releases:
  - name: kai-scheduler
    namespace: kai-scheduler
    chart: ghcr-io-nvidia-kai-scheduler/kai-scheduler
    version: v0.13.0
    values:
      - ./001-kai-scheduler/values.yaml
    wait: false
    timeout: 1200
    disableValidation: true
