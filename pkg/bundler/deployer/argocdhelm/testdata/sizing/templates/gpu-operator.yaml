{{- $childName := printf "%s%s" ((.Values.deployer | default dict).namePrefix | default "") "gpu-operator" -}}
{{- if gt (len $childName) 53 }}{{ fail (printf "deployer.namePrefix produces child Application name %q (%d chars): child Application names are capped at 53 characters because Argo CD derives the Helm release name from the Application name for Helm-rendered children" $childName (len $childName)) }}{{ end -}}
{{- if eq $childName (.Values.appName | default "aicr-stack" | toString) }}{{ fail (printf "child Application name %q collides with the parent Application name: choose a different deployer.namePrefix or appName" $childName) }}{{ end -}}
{{- $aicrSizingNodeCount := int64 ((.Values.sizing | default dict).nodeCount | default 0) -}}
{{- if lt $aicrSizingNodeCount 0 }}{{ fail (printf "sizing.nodeCount must be zero or positive, got %d" $aicrSizingNodeCount) }}{{ end -}}
{{- $aicrSizingRow := dict -}}
{{- $aicrSizingTier := 0 -}}
{{- $aicrSizingFound := false -}}
{{- if gt $aicrSizingNodeCount 0 -}}
{{- range $row := ((.Files.Get "static/gpu-operator-sizing.yaml") | fromYaml | default dict).tiers -}}
{{- if and (not $aicrSizingFound) (le $aicrSizingNodeCount (int64 $row.maxNodes)) -}}
{{- $aicrSizingFound = true -}}
{{- if $row.values }}{{ $aicrSizingRow = $row.values }}{{ $aicrSizingTier = int64 $row.maxNodes }}{{ end -}}
{{- end -}}
{{- end -}}
{{- end -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    annotations:
        aicr.nvidia.com/sizing-node-count: '{{ $aicrSizingNodeCount }}'
{{- if $aicrSizingTier }}
        aicr.nvidia.com/sizing-tier: {{ $aicrSizingTier | quote }}
{{- end }}
        argocd.argoproj.io/sync-wave: "1"
    name: '{{ (.Values.deployer | default dict).namePrefix | default "" }}gpu-operator'
    namespace: argocd
spec:
    destination:
        namespace: gpu-operator
        server: '{{ (.Values.deployer | default dict).destinationServer | default "https://kubernetes.default.svc" }}'
    project: '{{ (.Values.deployer | default dict).project | default "default" }}'
    source:
        chart: gpu-operator
        helm:
            values: |-
                {{- $static := (.Files.Get "static/gpu-operator.yaml") | fromYaml | default dict -}}
                {{- $dynamic := index .Values "gpuoperator" | default dict -}}
                {{- mustMergeOverwrite $static $aicrSizingRow $dynamic | toYaml | nindent 16 }}
        repoURL: https://helm.ngc.nvidia.com/nvidia
        targetRevision: 25.3.3
    syncPolicy:
        automated:
            prune: true
            selfHeal: true
        syncOptions:
            - CreateNamespace=true
            - ServerSideApply=true
