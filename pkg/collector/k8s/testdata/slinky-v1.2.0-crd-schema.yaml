  name: controllers.slinky.slurm.net
spec:
  group: slinky.slurm.net
  names:
    kind: Controller
  versions:
    - name: v1beta1
      schema:
        openAPIV3Schema:
          properties:
            spec:
              properties:
                accountingRef:
                  properties:
                    name:
                      type: string
                  type: object
                clusterName:
                  type: string
                external:
                  type: boolean
              type: object
          type: object
