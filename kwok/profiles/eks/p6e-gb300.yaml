# EKS Accelerated Node Profile: p6e-gb300r.36xlarge (GB300 NVL72)
#
# NVIDIA GB300 Grace Blackwell Ultra node as the gb300 EKS overlays target it:
# - 4x NVIDIA GB300 GPUs per Kubernetes node
# - Grace CPU (ARM64) host
# - NVL72 MNNVL/IMEX fabric for scale-up, EFA for scale-out
#
# The per-node GPU count is 4, matching the `Gres: "gpu:gb300:4"` and
# `limits.nvidia.com/gpu: 4` the gb300 Slurm leaf declares. NVL72 refers to the
# rack-level domain, not the per-node count -- a profile advertising 72 (or the
# 8 that the older p6-gb200 profile carries) would let a recipe schedule in the
# simulator against a node shape that does not exist on the real instance.
#
# Driver matches the pin the gb300 chain ships (recipes/components/gpu-operator
# /values.yaml). R580 is deliberate: R595 is documented as backward
# incompatible with P6e EFA, see issues #2383 and #2459.

apiVersion: aicr.run/v1alpha2
kind: KWOKNodeProfile
metadata:
  name: p6e-gb300
  labels:
    provider: eks
    nodeType: accelerated
    accelerator: gb300

spec:
  # Instance specifications
  #
  # osImage diverges from the sibling EKS profiles, which all say "Amazon Linux
  # 2023". Five of the seven gb300 EKS overlays this profile backs are
  # `os: ubuntu` leaves, and GB300 was hardware-qualified on Ubuntu 24.04. The
  # value is surfaced as status.nodeInfo.osImage and captured verbatim into
  # CNCF evidence (pkg/evidence/cncf/scripts/collect-evidence.sh), so an
  # Amazon-Linux string here would misreport the OS of an Ubuntu recipe.
  instanceType: p6e-gb300r.36xlarge
  arch: arm64  # Grace CPU is ARM-based
  osImage: Ubuntu 24.04

  # Resource capacity
  #
  # AWS publishes no p6e-gb300r.36xlarge specification, so these are NOT
  # datasheet values: cpu/memory/storage are carried over from the sibling
  # accelerated profiles as simulator headroom, not as a hardware claim. KWOK
  # exposes them as node allocatable, so treat them as an upper bound only.
  # They are safe at this magnitude because the largest memory request in any
  # component values file is 8Gi -- no bundle can schedule here but fail on
  # real hardware for lack of CPU or RAM. The two fields that DO carry
  # hardware meaning and are load-bearing for scheduling are gpu.count and
  # arch, both verified against the gb300 overlays below.
  resources:
    cpu: "144"
    memory: 2048Gi
    storage: 7600Gi

  # GPU specifications
  gpu:
    product: NVIDIA-GB300-288GB-HBM3e
    count: 4
    memory: 294912  # MiB per GPU (288GB)
    driver: "580.173.02"
    driverMajor: "580"
    driverMinor: "173"
