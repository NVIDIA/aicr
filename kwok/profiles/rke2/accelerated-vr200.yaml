# RKE2 Accelerated Node Profile: VR200 (Vera Rubin) NVL72 compute tray
#
# Bare-metal Vera Rubin NVL72 GPU worker:
# - 4x NVIDIA VR200 GPUs (matches the 2-node x 4-GPU topology measured on
#   the reference cluster)
# - Vera CPU (arm64), Ubuntu 26.04 reference image
# - Memory: 288GB HBM4 per GPU, NVIDIA's published Rubin specification
#   (developer.nvidia.com/blog/inside-the-nvidia-rubin-platform-six-new-chips-one-ai-supercomputer,
#   2026-08). 294912 MiB, following this repo's existing GiB*1024 MiB
#   convention (see kwok/profiles/eks/p6-gb200.yaml).
# - gpu.product is a provisional placeholder: the pre-release driver
#   reports the generic "NVIDIA Graphics Device" string rather than a
#   stable Vera Rubin marketing name (see
#   vr200-rke2-ubuntu-training.yaml), so no recipe or validator keys
#   scheduling on this exact value today — it exists only to keep this
#   profile's shape consistent with the other accelerated profiles.

apiVersion: aicr.run/v1alpha2
kind: KWOKNodeProfile
metadata:
  name: accelerated-vr200
  labels:
    provider: rke2
    nodeType: accelerated
    accelerator: vr200

spec:
  # Instance specifications
  instanceType: vr200-nvl72-tray
  arch: arm64  # Vera CPU is ARM-based
  osImage: Ubuntu 26.04

  # Resource capacity (provisional — pending confirmed GA hardware specs)
  resources:
    cpu: "144"
    memory: 1536Gi
    storage: 3800Gi

  # GPU specifications
  gpu:
    product: NVIDIA-VR200-288GB
    count: 4
    memory: 294912  # MiB per GPU (288GB HBM4, NVIDIA's published spec)
    driver: "615.0.0"
    driverMajor: "615"
    driverMinor: "0"
