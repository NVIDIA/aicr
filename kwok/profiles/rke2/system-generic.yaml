# RKE2 System Node Profile: generic amd64 control-plane / system worker
#
# Bare-metal system node for control-plane and non-GPU AICR components
# (cert-manager, Prometheus, GPU Operator controller):
# - No GPU resources

apiVersion: aicr.run/v1alpha2
kind: KWOKNodeProfile
metadata:
  name: system-generic
  labels:
    provider: rke2
    nodeType: system

spec:
  # Instance specifications
  instanceType: rke2-system-generic
  arch: amd64
  osImage: Ubuntu 24.04

  # Resource capacity
  resources:
    cpu: "16"
    memory: 64Gi
    storage: 100Gi
