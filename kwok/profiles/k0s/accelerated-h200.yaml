# Mirrors the reference cluster the h200-k0s-ubuntu-training recipe was
# validated on (single-node k0s v1.36.3+k0s.0, 2x H200 NVL via PCIe
# passthrough, Ubuntu 24.04, driver 610.57.04): one node that is both
# control plane and worker, with full GPU devices owned by the node
# rather than a cloud instance type.
apiVersion: aicr.run/v1alpha2
kind: KWOKNodeProfile
metadata:
  name: accelerated-h200
  labels:
    provider: k0s
    nodeType: accelerated
    accelerator: h200

spec:
  instanceType: k0s-h200-nvl
  arch: amd64
  osImage: Ubuntu 24.04

  resources:
    cpu: "46"
    memory: 440Gi
    storage: 1345Gi

  gpu:
    product: NVIDIA-H200-NVL
    count: 2
    memory: 143771  # MiB per GPU, as reported by nvidia-smi on the reference node
    driver: "610.57.04"
    driverMajor: "610"
    driverMinor: "57"
