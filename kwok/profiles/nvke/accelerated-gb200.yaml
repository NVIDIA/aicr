# NVKE GB200 NVL tray as observed on a reference NVKE tenant: 4 GB200
# per tray (PCI 10de:2941), Grace arm64, Ubuntu 24.04, allocatable cpu 143
# and ~938Gi. Driver matches the gpu-operator component default.
apiVersion: aicr.run/v1beta1
kind: KWOKNodeProfile
metadata:
  name: accelerated-gb200
  labels:
    provider: nvke
    nodeType: accelerated
    accelerator: gb200

spec:
  instanceType: gb200-nvl-tray
  arch: arm64
  osImage: Ubuntu 24.04

  resources:
    cpu: "143"
    memory: 938Gi
    storage: 800Gi

  gpu:
    product: NVIDIA-GB200
    count: 4
    memory: 196608  # MiB per GPU (192GB)
    driver: "580.173.02"
    driverMajor: "580"
    driverMinor: "173"
