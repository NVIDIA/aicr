# NVKE GB300 NVL tray: 4 GB300 per tray, Grace arm64, Ubuntu 24.04. CPU and
# memory are carried over from the NVKE GB200 tray profile (same Grace board
# class) pending an observed node; nothing schedules against them at this
# magnitude. GPU memory is the GB300 288GB HBM3e part. Driver matches the
# gpu-operator component default.
apiVersion: aicr.run/v1beta1
kind: KWOKNodeProfile
metadata:
  name: accelerated-gb300
  labels:
    provider: nvke
    nodeType: accelerated
    accelerator: gb300

spec:
  instanceType: gb300-nvl-tray
  arch: arm64
  osImage: Ubuntu 24.04

  resources:
    cpu: "143"
    memory: 938Gi
    storage: 800Gi

  gpu:
    product: NVIDIA-GB300-288GB-HBM3e
    count: 4
    memory: 294912  # MiB per GPU (288GB)
    driver: "580.173.02"
    driverMajor: "580"
    driverMinor: "173"
