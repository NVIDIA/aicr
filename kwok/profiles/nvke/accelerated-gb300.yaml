# NVKE GB300 tray as observed on a reference NVKE tenant (Supermicro
# ARS-121GL-NB3-LCC-FG001): 4 GB300 per tray, 144 Grace arm64 cores, Ubuntu
# 24.04, driver 580.173.02 (matches the gpu-operator component default).
# Memory is carried over from the NVKE GB200 tray profile pending an observed
# allocatable; nothing schedules against it at this magnitude.
apiVersion: aicr.run/v1beta1
kind: KWOKNodeProfile
metadata:
  name: accelerated-gb300
  labels:
    provider: nvke
    nodeType: accelerated
    accelerator: gb300

spec:
  instanceType: gb300-nvl-tray
  arch: arm64
  osImage: Ubuntu 24.04

  resources:
    cpu: "144"
    memory: 938Gi
    storage: 800Gi

  gpu:
    product: NVIDIA-GB300-288GB-HBM3e
    count: 4
    memory: 294912  # MiB per GPU (288GB)
    driver: "580.173.02"
    driverMajor: "580"
    driverMinor: "173"
