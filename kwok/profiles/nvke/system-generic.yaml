# NVKE control-plane/system tray: the same Grace board as the GPU trays with
# the GPUs unused, so arm64 and the same CPU/memory envelope.
apiVersion: aicr.run/v1beta1
kind: KWOKNodeProfile
metadata:
  name: system-generic
  labels:
    provider: nvke
    nodeType: system
spec:
  instanceType: gb200-nvl-tray
  arch: arm64
  osImage: Ubuntu 24.04
  resources:
    cpu: '143'
    memory: 938Gi
    storage: 800Gi
