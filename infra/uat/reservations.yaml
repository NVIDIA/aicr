# UAT reservation registry (#1274, DC1).
#
# Each row enumerates one reserved-capacity GPU pool the day/night UAT
# broker arbitrates. The "name" is the lease key: the shared dispatch
# surface (uat-run.yaml) holds a GitHub Actions concurrency group
# "uat-<name>" so contending runs on the same reservation QUEUE instead of
# racing the hardware. New infrastructure is onboarded by adding a row
# here — no broker code change.
#
# NOTE — these values are identifiers, NOT secrets. A reservation-id (and the
# GCP project path it embeds) grants no access on its own: access to the
# reserved capacity — and to anything running on it — is governed by cloud
# IAM/ACLs bound to the CI federation identity (see infra/uat-aws-account/,
# infra/uat-gcp-account/, and infra/uat-azure-account/), not by knowledge of
# the ID. They are safe to commit; disclosure reveals only internal infra
# naming, not a way in.
#
# Fields:
#   name                human-facing reservation / lease key (must be unique)
#   slug                short 2-4 char discovery key (^[a-z][a-z0-9]{1,3}$),
#                       UNIQUE across rows. It is the account-stable, slot-ready
#                       key the daytime cluster name embeds
#                       (aicr-uat-day-<slug>-<slot>-<run_id>, ADR-017); the guard
#                       and evening teardown scan the (slug, slot) prefix to find
#                       a held daytime cluster. Shorter and account-unique where
#                       the reservation name is long and only cloud-unique, and it
#                       keeps the daytime name inside GKE's 40-char cluster-name
#                       cap. Even the kind row (no cloud cluster, no daytime name)
#                       carries one for field uniformity.
#   cloud               aws | gcp | azure | kind. "kind" is not a cloud but the
#                       self-hosted GPU-runner lane (nvkind on real silicon,
#                       DC5 #1278): it rides the same reservation → uat-run →
#                       uat-<cloud> dispatch model and nightly batch as the
#                       cloud lanes, but provisions a single-node nvkind cluster
#                       on the runner (no actuator) instead of a cloud cluster.
#                       Its lease is the single self-hosted GPU runner. Scope is
#                       honestly H100 x1, single-GPU — whatever the runner has.
#   reservation-id      the cloud capacity-reservation identifier; GCP uses
#                       the fully-qualified resource path (matches the value
#                       embedded in cluster-config-path verbatim); OPTIONAL —
#                       omitted for quota-backed capacity (azure), where
#                       subscription quota, not a reservation, backs the nodes
#   accelerator         GPU accelerator family on the reservation
#   gpu-count           GPUs per reserved node (forward-looking metadata)
#   cluster-config-path the github.com/mchmarny/cluster Cluster config the
#                       actuator provisions from
#   test-config-dir     directory holding the per-cloud AICRConfig test
#                       files (the ./tests/uat/<cloud>/run phase runner roots
#                       one level up, at the cluster-config)
#   nightly-intents     (optional) the recipe intents the NIGHTLY version-matrix
#                       batch (#1274, DC1) runs on this reservation, as a YAML
#                       list — [training], [inference], or [training,
#                       inference]. Absent defaults to [training] (the
#                       pre-DC3 behavior); an explicit empty list ([]) opts the
#                       reservation out of the nightly batch (bring-up mode —
#                       manual dispatch only). DC3 (#1276) sets it to [training,
#                       inference] on BOTH reservations so training and inference
#                       both run nightly on both clouds. The batch runs the
#                       intents SEQUENTIALLY within each version cell, through
#                       the same per-reservation lease (intent inner-loop,
#                       version outer-loop) — no second cron, no contention, and
#                       `main` lands both intents before any release cell. Each
#                       (version × intent) is a full provision→CUJ→teardown cell,
#                       so listing both intents roughly doubles a reservation's
#                       nightly cell count; the batch time-box drops the oldest
#                       cells first if the budget is exceeded (tune previous_n /
#                       deadline_offset_hours). Entries must be recognized and
#                       unique. Not one-per-cloud (unlike daytime-intent).
#   daytime-intent      (optional) opts this reservation into the daytime
#                       human-access rotation (#1281, DC8) and picks the
#                       flavor stood up during the working day: training |
#                       inference. Empty/absent = nightly batch only. This is
#                       the configurable cloud→flavor split — a data choice,
#                       not hardcoded in a workflow — defaulting to
#                       AWS=training, GCP=inference. Only ONE reservation per
#                       cloud may carry a daytime-intent today: a single
#                       reservation cannot hold both a long-lived daytime
#                       cluster and the nightly batch at once.
reservations:
  - name: aws-h100
    slug: ah1
    cloud: aws
    reservation-id: cr-0e16ad417f9a5bf69
    accelerator: h100
    gpu-count: 8
    cluster-config-path: tests/uat/aws/cluster-config.yaml
    test-config-dir: tests/uat/aws/tests
    nightly-intents: [training, inference]
    daytime-intent: training
  - name: gcp-h100
    slug: gh1
    cloud: gcp
    reservation-id: projects/nv-dgxcloudprod-20240108/reservations/h100-a3-mega-phase-1-general-pool-384-us-c1-reservation
    accelerator: h100
    gpu-count: 8
    cluster-config-path: tests/uat/gcp/cluster-config.yaml
    test-config-dir: tests/uat/gcp/tests
    nightly-intents: [training, inference]
    daytime-intent: inference
  - name: azure-h100
    slug: zh1
    cloud: azure
    # No reservation-id: capacity is Azure subscription QUOTA (westus
    # NDSH100v5), not a capacity reservation. The name is still the lease
    # key, so contending runs queue exactly as on the reserved clouds; a
    # quota-exhausted provision fails loudly at actuator apply time (the
    # same posture as GCP — no pre-flight capacity assertion).
    accelerator: h100
    gpu-count: 8
    cluster-config-path: tests/uat/azure/cluster-config.yaml
    test-config-dir: tests/uat/azure/tests
    # Enrolled with [training] after the green manual acceptance run
    # (29125390442: full provision → CUJ → evidence → teardown). Inference
    # joined after a green manual intent=inference dispatch, matching the
    # AWS/GCP rows which run both.
    nightly-intents: [training, inference]
    # The AKS ND H100 v5 inference perf fix (nvidia-tuned 0.3.2, #1767) is on
    # main but not in any release tag yet — v0.17.0 and older pin 0.3.1 and
    # fail inference-perf. Gate release inference cells to the first release
    # that will carry the fix, so today only `main` runs Azure inference
    # nightly (green); older releases are skipped instead of running red, and
    # the gated release enrolls automatically once it ships. Bump this when the
    # actual first-fixed tag differs.
    #
    # Training is gated to the same release for a different reason: the AKS
    # azure-managed default flip changed cluster-config.yaml to
    # gpuDriverInstall: true, and release cells provision from main's config
    # while running the released binary. v0.17.0 and older embed the
    # pre-flip AKS profile (GPU-Operator-managed driver + toolkit), so on a
    # pool with the Azure-managed driver they would deploy a second driver
    # stack on top — an invalid compatibility cell, not a real regression
    # signal. v0.18.0 is the first release that carries the flipped profile.
    nightly-intent-min-versions:
      inference: v0.18.0
      training: v0.18.0
  - name: aws-gb200
    slug: ag2
    cloud: aws
    # CROSS-ACCOUNT: the GB200 Capacity Block lives in a SEPARATE tenancy
    # (dgx-cloud-runai-prod-22, account 897722687756), not the standard UAT
    # account. The account is NOT a field here: the AWS pipeline derives the
    # tenancy it assumes the OIDC role into from the target cluster-config's
    # .deployment.tenancy (cluster-config-gb200.yaml sets it to 897722687756),
    # the single source of truth. Prereq: apply infra/uat-aws-account in
    # 897722687756 (GitHub OIDC provider + github-actions-role-aicr).
    # GB200 reservations are Capacity Blocks (marketType: capacity-block in
    # cluster-config-gb200.yaml), not standing on-demand CRs like the h100 rows,
    # so a run must fall inside the block's active window or actuator apply
    # fails to acquire capacity. This particular block (cr-0e2f3833a602809a6,
    # CapacityBlockId cbr-0a6a5543dd5c74727) is booked long: State=active,
    # StartDate 2025-11-15, EndDate 2029-08-22 (TotalInstanceCount 18). A 04:00
    # UTC nightly cron therefore always falls inside the window today, which is
    # why nightly enrollment below is safe without broker window-awareness. If
    # the block is ever re-booked to a shorter window, add a scheduling gate to
    # the broker (or revert to `nightly-intents: []`) before it lapses.
    reservation-id: cr-0e2f3833a602809a6
    accelerator: gb200
    # 4 Blackwell GPUs per p6e-gb200.36xlarge node; the cluster-config runs 2
    # nodes (activates the multi-node NCCL East-West fabric check).
    gpu-count: 4
    cluster-config-path: tests/uat/aws/cluster-config-gb200.yaml
    test-config-dir: tests/uat/aws/tests
    # Enrolled in the nightly batch with both intents, matching the aws-h100
    # row. Training runs the Kubeflow TrainJob CUJ; inference stands up and
    # validates the served inference stack (the vLLM serve run itself stays
    # disabled repo-wide, #1644). Each (version × intent) is a full
    # provision→CUJ→teardown cell dispatched through the shared per-reservation
    # lease, so the two intents serialize with no contention. Safe to enroll
    # because the Capacity Block is booked active through 2029 (see the block
    # note above) and the GB200 EKS UAT config first shipped in v0.18.0.
    nightly-intents: [training, inference]
    # Gate release cells to v0.18.0: cluster-config-gb200.yaml and the GB200 EKS
    # UAT lane first shipped in v0.18.0 (absent in v0.17.0 and earlier), so a
    # release cell below that tag has no GB200 config to run and would fail
    # closed. `main` always runs both intents (built from source); older
    # releases are skipped until v0.18.0 is the oldest cell in the window. Bump
    # if the actual first-supported tag differs.
    nightly-intent-min-versions:
      training: v0.18.0
      inference: v0.18.0
  - name: kind-h100
    slug: kh1
    cloud: kind
    # No reservation-id: capacity is the self-hosted GPU runner
    # (linux-amd64-gpu-h100-latest-1), not a cloud capacity reservation. The
    # name is still the lease key, so contending runs queue exactly as on the
    # cloud rows (and the runner's own concurrency is the physical single-slot
    # backstop).
    accelerator: h100
    # Single-GPU: the runner exposes one H100. Activates neither the multi-node
    # NCCL fabric check nor a 2-node TrainJob; the signed evidence is scoped to
    # H100 x1 (DC5 #1278).
    gpu-count: 1
    # nvkind provisions from the runner directly (gpu-cluster-setup action), not
    # a github.com/mchmarny/cluster actuator config — this path is an
    # informational descriptor of the nvkind cluster shape and keeps the row's
    # required cluster-config-path non-empty; uat-kind.yaml does not feed it to
    # an actuator.
    cluster-config-path: tests/uat/kind/cluster-config.yaml
    test-config-dir: tests/uat/kind/tests
    # Enrolled with both intents after green manual acceptance runs on the H100
    # runner: training (run 29954092703) and inference (run 29965464868) — each
    # a full install → --phase all validate → CUJ → signed evidence emitted +
    # verified. (An earlier inference run failed on a degraded runner instance;
    # the build-on-GPU-runner variance behind that is tracked in #1869.)
    nightly-intents: [training, inference]
    # Gate release cells to v0.18.0: the uat-kind lane and the os-agnostic
    # coordinate mapping (#1851, which lets a service:kind recipe — os=any —
    # produce a valid dashboard coordinate) landed AFTER v0.17.0. A release cell
    # running a v0.17.0 aicr would reject `os: any` in CoordinateFor and emit no
    # ingestable evidence, so today only `main` runs nvkind nightly; the release
    # cells auto-enroll once v0.18.0 ships with the fix. Bump this if the actual
    # first-fixed tag differs. (Same mechanism azure-h100 uses.)
    nightly-intent-min-versions:
      training: v0.18.0
      inference: v0.18.0
