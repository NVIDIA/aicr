# Language Versions
# Go toolchain version is owned by .go-version (single source of truth).
# Makefile, CI workflows, and validator Dockerfiles all read from there.

# Build Tools
build_tools:
  # renovate: datasource=github-releases depName=goreleaser/goreleaser depType=build_tools
  goreleaser: 'v2.18.2'
  # renovate: datasource=github-releases depName=ko-build/ko depType=build_tools
  ko: 'v0.19.1'
  # renovate: datasource=github-releases depName=google/go-containerregistry depType=build_tools
  crane: 'v0.22.1'
  # renovate: datasource=github-releases depName=orhun/git-cliff depType=build_tools
  git_cliff: '2.14.1'

# Linting
linting:
  # The annotation must stay on the line directly above the value: the
  # customManagers regexes in .github/renovate.json5 match `# renovate: ...`
  # followed immediately by `key: 'value'`, so any comment between them silently
  # drops this pin from Renovate's scan (#2657).
  # renovate: datasource=github-releases depName=oasdiff/oasdiff depType=linting
  oasdiff: 'v1.32.1'
  # Refreshed automatically by tools/update-oasdiff-checksums via Renovate
  # postUpgradeTasks whenever the version above is bumped. Same reasoning as the
  # oras pin in security_tools: the checksums.txt served beside the tarball
  # comes from the same release, so it detects corruption but not a compromise
  # of the release itself. A digest committed and reviewed at this SHA does.
  #
  # This one matters specifically because #2663 moved oasdiff off `go install`,
  # which authenticated every dependency against sum.golang.org -- a public
  # transparency log. Dropping to an unpinned binary would have traded that for
  # nothing; the pin is what keeps the integrity story from regressing.
  #
  # Flat, uniquely-named key rather than a nested `<tool>_checksums:` mapping,
  # for the reason spelled out on oras_sha256_linux_amd64: the nested blocks all
  # share sub-key names and the refresh scripts rewrite by sub-key.
  #
  # linux/amd64 only: this feeds the setup-build-tools action, which runs on
  # ubuntu runners. tools/setup-tools handles local dev on other platforms.
  oasdiff_sha256_linux_amd64: '7c8939fc49b75ee11fec66a5b83b37a2fca6aee109fed85013b1ba2ac2a1ee7f'
  # renovate: datasource=github-releases depName=golangci/golangci-lint depType=linting
  golangci_lint: 'v2.13.2'
  # renovate: datasource=pypi depName=yamllint depType=linting
  yamllint: '1.38.0'
  # renovate: datasource=github-releases depName=google/addlicense depType=linting
  addlicense: 'v1.2.0'
  # Same move off `go install` as setup_envtest in testing_tools (#2667).
  # addlicense does publish a checksums.txt and this value was cross-checked
  # against it, but the pin is still what the install step verifies: a manifest
  # served beside the archive comes from the same release, so it catches
  # corruption in transit and not a compromise of the release itself.
  #
  # A version bump must refresh this or the install step fails closed on the
  # mismatch. tools/update-addlicense-checksums does it, wired to Renovate's
  # postUpgradeTasks. That matters more here than elsewhere: addlicense is on
  # the auto-merge list, so a stale pin would leave a PR that can never merge.
  #
  # Note the asset name is version-specific -- v1.1.1 published
  # addlicense_1.1.1_..., v1.2.0 publishes addlicense_v1.2.0_... -- so a bump
  # that changes the naming shows up as a refresher failure, not a silent skip.
  addlicense_sha256_linux_amd64: '6924296771234b1ba6c969e109b4459cff75e15b259676b61df874a92734b242'
  # The shared MDX and fenced-YAML documentation parser toolchain is owned by
  # tools/mdx/package.json + package-lock.json, not listed here. The lockfile
  # freezes the full transitive tree, which a version string cannot; these gates
  # decide which docs merge, so their verdicts must be reproducible. Renovate
  # updates it natively via the npm manager. Same single-source-of-truth split as
  # the Go toolchain living in .go-version.

# Security Tools
security_tools:
  # renovate: datasource=github-releases depName=anchore/grype depType=security_tools
  grype: 'v0.119.0'
  # renovate: datasource=github-releases depName=sigstore/cosign depType=security_tools
  cosign: 'v3.1.3'
  # renovate: datasource=github-releases depName=anchore/syft depType=security_tools
  syft: 'v1.52.0'
  # Attaches the aiperf-bench third-party source archive as an OCI 1.1 referrer
  # (tools/generate-aiperf-source). Cosign cannot attach arbitrary artifacts, so
  # this is a separate dependency from the signing/attestation path.
  #
  # Stored WITHOUT the leading 'v', unlike cosign/syft/grype above. Both
  # consumers — tools/setup-tools and the setup-build-tools action — re-add the
  # prefix for the download URL, and the bare form is what the release asset
  # names embed (oras_1.3.4_linux_amd64.tar.gz).
  #
  # This is the only oras pin. It was previously paired with a separately pinned
  # oras-project/setup-oras action that validated it against a bundled release
  # list, which meant two bots owned two artifacts that had to stay compatible
  # and nothing checked that they did (#2648).
  #
  # The annotation below must stay on the line directly above the value: the
  # customManagers regexes in .github/renovate.json5 match `# renovate: ...`
  # followed immediately by `key: 'value'`, so any comment between them silently
  # drops this pin from Renovate's scan.
  # renovate: datasource=github-releases depName=oras-project/oras depType=security_tools
  oras: '1.3.4'
  # Refreshed automatically by tools/update-oras-checksums via Renovate
  # postUpgradeTasks whenever the version above is bumped. Pinning the digest
  # here — rather than trusting the checksums.txt served beside the tarball —
  # is what makes a later compromise of the upstream release assets detectable:
  # an attacker who replaces both the archive and its checksum still fails
  # against a value committed and reviewed at this SHA.
  #
  # Deliberately a flat, uniquely-named key rather than the nested
  # `<tool>_checksums:` mapping the other pinned tools use. Those blocks all
  # share the sub-keys linux_amd64/linux_arm64/..., and the existing refresh
  # scripts rewrite by sub-key with no block scoping, so a nested block here
  # would be corrupted by every sibling tool's script (#2658).
  #
  # linux/amd64 only: this pin feeds the setup-build-tools action, which runs on
  # ubuntu runners. tools/setup-tools handles local dev on other platforms.
  oras_sha256_linux_amd64: 'f27adb935022d94df8dc77719c322dda592c78a0d57a6f7dcdd8d900b248c454'

# E2E Testing Tools
testing_tools:
  # renovate: datasource=github-releases depName=kubernetes/kubernetes depType=testing_tools
  kubectl: 'v1.37.0'
  # kubelogin: Entra exec-plugin for AKS kubeconfigs, installed by uat-azure.yaml
  # via `az aks install-cli` (which defaults to latest without an explicit pin).
  # renovate: datasource=github-releases depName=Azure/kubelogin depType=testing_tools
  kubelogin: 'v0.2.19'
  # renovate: datasource=github-releases depName=kubernetes-sigs/kind depType=testing_tools
  kind: '0.33.0'
  # renovate-digest: datasource=git-refs depName=nvkind packageName=https://github.com/NVIDIA/nvkind branch=main depType=testing_tools
  nvkind: 'c57050497cffee36f10c8b918d2727c4f26d886e'
  # renovate: datasource=github-releases depName=tilt-dev/ctlptl depType=testing_tools
  ctlptl: '0.9.6'
  # renovate: datasource=github-releases depName=tilt-dev/tilt depType=testing_tools
  tilt: '0.37.7'
  # Keep in step with sigs.k8s.io/controller-runtime in go.mod: setup-envtest is
  # released from that repo under the tools/setup-envtest/vX.Y.Z tag series, and
  # the envtest control-plane binaries it fetches are matched to the
  # controller-runtime the tests link against.
  # renovate: datasource=go depName=sigs.k8s.io/controller-runtime/tools/setup-envtest depType=testing_tools
  setup_envtest: 'v0.25.1'
  # CI installs the released linux/amd64 binary rather than `go install`ing the
  # module, so the gate no longer depends on sum.golang.org being up (#2667).
  # The two are the same code: `tools/setup-envtest/v0.25.0` and `v0.25.0` are
  # the same commit (e8f9455), and the release asset is built from it.
  #
  # controller-runtime publishes no checksums.txt beside the binary, so unlike
  # oasdiff and oras there is nothing to cross-check this against -- it is the
  # only integrity check on the download, computed from the asset and reviewed
  # at this SHA. A version bump must refresh it or the install step fails
  # closed on the mismatch; tools/update-setup-envtest-checksums does that,
  # wired to Renovate's postUpgradeTasks. Because there is no upstream manifest,
  # that script hashes whatever the release serves at refresh time -- review the
  # resulting diff as a new trust-on-first-use record, not a corroboration.
  #
  # linux/amd64 only, for the reason on oasdiff_sha256_linux_amd64: this feeds
  # the setup-build-tools action, which runs on ubuntu runners, while
  # tools/setup-tools covers local dev on other platforms.
  setup_envtest_sha256_linux_amd64: '531726d9a1d9e4c5661e22ab90186e186f5dbebbc109b13333fa7e237068f06d'
  # renovate: datasource=github-releases depName=helm/helm depType=testing_tools
  helm: 'v4.3.0'
  # renovate: datasource=github-releases depName=databus23/helm-diff depType=testing_tools
  helm_diff: 'v3.15.13'
  # helm_diff_checksums are refreshed automatically by tools/update-helm-diff-checksums
  # via Renovate postUpgradeTasks whenever the helm-diff version above is bumped.
  # The darwin_* keys name GOOS (matching the sibling blocks); upstream labels
  # those release assets "macos".
  helm_diff_checksums:
    linux_amd64: 'c004219c405e5be665e0b573378cf07f0182f2da7466a4c5a580a3c7162e7ae8'
    linux_arm64: 'b8a4d992eea22fad9edcadcbc457b894a3c8f441f420bd5433bfd9362ee7c10e'
    darwin_amd64: '4d57ed1a114214a1e6c488827f823d1be013b0c32d6bee4f330de8227d0d35d8'
    darwin_arm64: '44ae40d1ca86d589666783c03696c66a2c56af19ffbcc54baf96b1fb3d2658e3'
  # renovate: datasource=github-releases depName=helmfile/helmfile depType=testing_tools
  helmfile: 'v1.8.0'
  # helmfile_checksums are refreshed automatically by tools/update-helmfile-checksums
  # via Renovate postUpgradeTasks whenever the helmfile version above is bumped.
  helmfile_checksums:
    linux_amd64: '35d5d39fc608342b23fc7ce1dd0c3bf0c96cc07ec3796507ab6894a5d172bf20'
    linux_arm64: '01037dc187840a778ec65eae66b549b63d619a853540c8983f90d73ccbce5033'
    darwin_amd64: 'd367d72d035985b69863f0e0a6e1815c23a546a1bcdae3cdbb9c17893303e6f3'
    darwin_arm64: 'b377e295940018fb0e49ca9e0aabdabb00fc612af3d9e12003f01635dc87e1ef'
  # renovate: datasource=github-releases depName=kubernetes-sigs/kwok depType=testing_tools
  kwok: 'v0.8.0'
  # renovate: datasource=github-releases depName=kyverno/chainsaw depType=testing_tools
  chainsaw: 'v0.2.15'
  # chainsaw_checksums are refreshed automatically by tools/update-chainsaw-checksums
  # via Renovate postUpgradeTasks whenever the chainsaw version above is bumped.
  chainsaw_checksums:
    linux_amd64: '295d226c89f126c0a97775d364be149f47a810c8a3f9829ee410583d0c1abe3c'
    linux_arm64: 'fecf5f3ea74d11da2cd5d95a4c016d5d2543cbc4844ce21adf5e727e7ffd9e44'
    darwin_amd64: 'ddb56002ff8c6265f55ec40c82eb0ef0dddec5127dd12d4fc5e7953453481f4b'
    darwin_arm64: '502bef17dd822217e82590e9ccf01c1e26a56b3fa34a835789b9af73e82a169a'
  # renovate: datasource=github-releases depName=mikefarah/yq depType=testing_tools
  yq: 'v4.53.6'
  # AWS CLI used by the KMS e2e to provision keys against the MiniStack emulator.
  # renovate: datasource=pypi depName=awscli depType=testing_tools
  awscli: '1.46.1'
  # MiniStack: MIT-licensed, token-free AWS emulator (https://ministack.org) used
  # by the KMS e2e in place of LocalStack, whose latest/stable images now refuse
  # to boot without a paid license token. Pinned (never :latest) for reproducibility.
  # Run with USE_SSL=1: sigstore's awskms signer hardcodes https://, so the e2e
  # serves TLS with a mkcert cert (see mkcert below).
  # renovate: datasource=docker depName=ministackorg/ministack depType=testing_tools
  ministack_image: 'ministackorg/ministack:1.5.15'
  # OpenBAO: the Linux Foundation Apache-2.0 fork of HashiCorp Vault, used by the
  # Vault KMS e2e to exercise the hashivault:// signing/verification path against
  # a real Transit secrets engine. API-identical to Vault; the sigstore hashivault
  # provider drives it over plain HTTP in dev mode (no TLS needed). Pinned (never
  # :latest) for reproducibility.
  # renovate: datasource=docker depName=openbao/openbao depType=testing_tools
  openbao_image: 'openbao/openbao:2.6.2'
  # mkcert issues a trusted localhost cert for MiniStack's TLS and installs its CA
  # into the system trust store, so the Go AWS SDK accepts the awskms:// endpoint.
  # renovate: datasource=github-releases depName=FiloSottile/mkcert depType=testing_tools
  mkcert: 'v1.4.4'
  # SHA256 of the mkcert release binaries (Linux only; macOS installs via brew).
  # Update alongside the mkcert version above.
  mkcert_checksums:
    linux_amd64: '6d31c65b03972c6dc4a14ab429f2928300518b26503f58723e532d1b0a3bbb52'
    linux_arm64: 'b98f2cc69fd9147fe4d405d859c57504571adec0d3611c3eefd04107c7ac00d0'
  # renovate: datasource=github-releases depName=kubernetes-sigs/karpenter depType=testing_tools
  karpenter: 'v1.14.1'
  # In-cluster OCI registry for KWOK deployer-matrix CI (issue #843).
  # Pulled from ECR Public (AWS's first-party mirror of Docker official
  # images): anonymous Docker Hub pulls rate-limit on shared CI runners
  # (main red 4 consecutive KWOK runs, 2026-07-09). Do not regress to a
  # bare Docker Hub pin on bump.
  # renovate: datasource=docker depName=public.ecr.aws/docker/library/registry depType=testing_tools
  registry_image: 'public.ecr.aws/docker/library/registry:3.1.1'
  # Argo CD Helm chart for KWOK deployer-matrix CI. v9.5.x pins app v3.4.x,
  # the first stable line with native OCI artifact source (issue #843).
  # renovate: datasource=helm depName=argo-cd registryUrl=https://argoproj.github.io/argo-helm depType=testing_tools
  argocd_chart: '9.5.14'
  # sigstore scaffold umbrella chart for the private-Sigstore signing e2e
  # (Fulcio + Rekor + CTLog + Trillian). Deploys plain Deployment + ClusterIP
  # Services reachable via port-forward on macOS and Linux (issue #1215).
  # renovate: datasource=helm depName=scaffold registryUrl=https://sigstore.github.io/helm-charts depType=testing_tools
  scaffold_chart: '0.6.109'
  # Flux 2 release for KWOK deployer-matrix CI flux-oci lane (issue #843).
  # install.yaml is downloaded from the GitHub release; source-controller,
  # kustomize-controller and helm-controller are the only controllers the
  # bundle consumes (OCIRepository -> Kustomization -> HelmRelease).
  # renovate: datasource=github-releases depName=fluxcd/flux2 depType=testing_tools
  flux_version: 'v2.9.5'
  # In-cluster Git server for the KWOK flux-git deployer lane (issue #963).
  # Rootless variant so the admin-user bootstrap can `kubectl exec gitea
  # admin user create` directly without su gymnastics.
  # Pulled from docker.gitea.com (Gitea's first-party registry): anonymous
  # Docker Hub pulls rate-limit on shared CI runners. Do not regress to a
  # Docker Hub pin on bump.
  # renovate: datasource=docker depName=docker.gitea.com/gitea depType=testing_tools
  gitea_image: 'docker.gitea.com/gitea:1.27.0-rootless'
  # renovate: datasource=github-releases depName=hauler-dev/hauler depType=testing_tools
  hauler: 'v2.1.1'
  # renovate: datasource=github-releases depName=zarf-dev/zarf depType=testing_tools
  zarf: 'v0.86.0'
# Quality Thresholds
quality:
  coverage_threshold: '83'
  lint_timeout: '10m'
  test_timeout: '10m'

# Build Configuration
build:
  image_registry: 'ghcr.io/nvidia'

# Testing Configuration
testing:
  # renovate: datasource=docker depName=kindest/node depType=testing
  kind_node_image: 'kindest/node:v1.37.0'
  # renovate: datasource=docker depName=kindest/node depType=testing
  h100_kind_node_image: 'kindest/node:v1.37.0'

  # GPU CI runtime pins consumed through .github/actions/load-versions.
  # renovate: datasource=helm depName=gpu-operator depType=testing
  gpu_operator_chart_version: 'v26.7.0'
  # Base image for the CI smoke-test snapshot-agent image. The agent binary is
  # static Go and detects GPUs driver-free via NFD/PCI, so it no longer needs a
  # CUDA base / nvidia-smi. Matches the NVIDIA static distroless base used for
  # the aicr image (see .ko.yaml).
  snapshot_agent_base_image: 'nvcr.io/nvidia/distroless/static:v4.1.3@sha256:ec947edce045116008a8aeab38c5da643fbf110990b133bad200dbf5e4b6e296'

  # Component test harness configuration
  # Used by tools/component-test/ scripts to validate individual components
  component_test:
    nvml_mock_version: '0.1.0'
    nvml_mock_image: 'ghcr.io/nvidia/nvml-mock'
    default_gpu_profile: 'a100'
    default_gpu_count: 8
    cluster_name: 'aicr-component-test'
    helm_timeout: '300s'
    health_check_timeout: '5m'
