{{/*
Namespaces with their Pod Security labels, kept on uninstall so removing the
chart never removes the GPU stack or operator state. The
operator namespace is the release namespace and is not created here.
*/}}
{{- $namespaces := list
  (dict "name" .Values.namespaces.jobs "podSecurity" "restricted")
  (dict "name" .Values.namespaces.discovery "podSecurity" "privileged") }}
{{- if .Values.validation.enabled }}
{{- /* AICR's validators run cluster-admin-equivalent checks; the
  namespace admits them until the H100 lane measures the profile they need. */}}
{{- $namespaces = append $namespaces (dict "name" .Values.namespaces.validation "podSecurity" "privileged") }}
{{- end }}
{{- range .Values.namespaces.components }}
{{- if ne .create false }}
{{- $namespaces = append $namespaces (dict "name" .name "podSecurity" .podSecurity) }}
{{- end }}
{{- end }}
{{- range $namespaces }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .name }}
  labels:
    {{- include "aicr-operator.labels" $ | nindent 4 }}
    {{- include "aicr-operator.podSecurity" .podSecurity | nindent 4 }}
  annotations:
    {{- include "aicr-operator.keep" $ | nindent 4 }}
{{- end }}
