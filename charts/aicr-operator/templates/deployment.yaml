{{/*
The operator under the restricted Pod Security profile. Every
installation value reaches it as a flag (pkg/operator/config).
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aicr-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aicr-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.operator.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: aicr-operator
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aicr-operator
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: aicr-operator
      # Above the operator's 30-second graceful shutdown.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: {{ .Values.operator.image }}
          imagePullPolicy: {{ .Values.operator.imagePullPolicy }}
          args:
            - --aicr-version={{ .Values.aicr.version }}
            - --aicr-image={{ .Values.aicr.image }}
            - --operator-namespace={{ .Release.Namespace }}
            - --jobs-namespace={{ .Values.namespaces.jobs }}
            - --discovery-namespace={{ .Values.namespaces.discovery }}
            - --validation-namespace={{ .Values.namespaces.validation }}
            - --engine={{ .Values.engine.type }}
            - --engine-namespace={{ .Values.engine.namespace }}
            - --engine-project={{ .Values.engine.project }}
            {{- $inCluster := eq .Values.registry.mode "inCluster" }}
            - --registry-repository={{ include "aicr-operator.registry" . }}
            - --registry-plain-http={{ or $inCluster .Values.registry.plainHTTP }}
            - --registry-auth-provider={{ ternary "static" .Values.registry.auth.provider $inCluster }}
            - --registry-credentials-secret={{ include "aicr-operator.credentialsSecret" . }}
            - --engine-repo-creds-secret={{ .Values.registry.auth.repoCredsSecret }}
            - --snapshot-agent-requests={{ .Values.discovery.agentRequests }}
            - --job-node-selector={{ .Values.aicr.jobs.nodeSelector | default dict | toJson }}
            - --job-tolerations={{ .Values.aicr.jobs.tolerations | default list | toJson }}
            - --development-bypass-approvals={{ .Values.development.bypassApprovals }}
            - --development-skip-discovery={{ .Values.development.skipDiscovery }}
            - --component-namespaces={{ include "aicr-operator.componentNames" . }}
            - --validation-enabled={{ .Values.validation.enabled }}
            - --validator-images={{ join "," .Values.aicr.validatorImages }}
            - --validation-signing-key={{ .Values.validation.signingKey }}
            - --validation-transparency-log={{ .Values.validation.transparencyLog }}
            - --log-level={{ .Values.operator.logLevel }}
          env:
            # Evidence binds the digest the operator runs as, read from its
            # own pod.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # The Go runtime collects harder as the heap nears the memory
            # limit. A divisor only changes the unit, so this is the full
            # limit, with no headroom.
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  containerName: manager
                  resource: limits.memory
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- with .Values.operator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
