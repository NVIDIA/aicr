{{/*
The in-cluster registry (registry.mode inCluster): CNCF Distribution
(cmd/aicr-registry) behind an htpasswd login. The operator pins everything it stores by digest, so the
registry is storage, not something it trusts: a lost or altered artifact
fails a pull instead of deploying other content. Only pods use it, through
the Service; nodes never pull from it.

Every credential derives from one login, generated on install and read back
with lookup on upgrade, so it is computed once here. The registry keeps
serving through helm uninstall, with its login, volume and Argo CD
repo-creds, so owned Applications stay valid and a reinstall adopts it; only
the operator's and the Jobs' copies of the login go.
*/}}
{{- if eq .Values.registry.mode "inCluster" }}
{{- $host := include "aicr-operator.registryHost" . }}
{{- $login := dict }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "aicr-registry-login" }}
{{- if $existing }}
{{- range $key := list "username" "password" "htpasswd" }}
{{- if not (index ($existing.data | default dict) $key) }}
{{- fail (printf "Secret %s/aicr-registry-login has no %s; delete it to generate a new login" $.Release.Namespace $key) }}
{{- end }}
{{- $_ := set $login $key (index $existing.data $key | b64dec) }}
{{- end }}
{{- else }}
{{- $password := randAlphaNum 40 }}
{{- $login = dict "username" "aicr" "password" $password "htpasswd" (htpasswd "aicr" $password) }}
{{- end }}
{{- $dockerConfig := dict "auths" (dict $host (dict "auth" (printf "%s:%s" $login.username $login.password | b64enc))) | toJson }}
{{- $config := dict
  "version" "0.1"
  "log" (dict "level" "info")
  "storage" (dict "filesystem" (dict "rootdirectory" "/var/lib/registry"))
  "http" (dict "addr" ":5000" "headers" (dict "X-Content-Type-Options" (list "nosniff")))
  "auth" (dict "htpasswd" (dict "realm" "aicr-registry" "path" "/auth/htpasswd")) | toYaml }}
{{- $pushers := list .Release.Namespace .Values.namespaces.jobs }}
{{- if .Values.validation.enabled }}
{{- $pushers = append $pushers .Values.namespaces.validation }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: aicr-registry-login
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aicr-operator.labels" . | nindent 4 }}
  annotations:
    {{- include "aicr-operator.keep" . | nindent 4 }}
type: Opaque
data:
  username: {{ $login.username | b64enc }}
  password: {{ $login.password | b64enc }}
  htpasswd: {{ $login.htpasswd | b64enc }}
{{- range $pushers }}
---
# The operator's and the pushing Jobs' login, as the static provider reads it.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aicr-operator.credentialsSecret" $ }}
  namespace: {{ . }}
  labels:
    {{- include "aicr-operator.labels" $ | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ $dockerConfig | b64enc }}
{{- end }}
---
# Argo CD's repo server pulls owned Applications' charts with this login,
# over plain HTTP to this host only.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.registry.auth.repoCredsSecret }}
  namespace: {{ .Values.engine.namespace }}
  labels:
    {{- include "aicr-operator.labels" . | nindent 4 }}
    argocd.argoproj.io/secret-type: repo-creds
  annotations:
    {{- include "aicr-operator.keep" . | nindent 4 }}
type: Opaque
data:
  type: {{ "oci" | b64enc }}
  url: {{ include "aicr-operator.registry" . | b64enc }}
  username: {{ $login.username | b64enc }}
  password: {{ $login.password | b64enc }}
  insecureOCIForceHttp: {{ "true" | b64enc }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aicr-registry
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aicr-operator.labels" . | nindent 4 }}
  annotations:
    {{- include "aicr-operator.keep" . | nindent 4 }}
data:
  config.yml: |
    {{- $config | trimSuffix "\n" | nindent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aicr-registry
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aicr-operator.labels" . | nindent 4 }}
  annotations:
    {{- include "aicr-operator.keep" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.registry.inCluster.storage.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.registry.inCluster.storage.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aicr-registry
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aicr-operator.labels" . | nindent 4 }}
  annotations:
    {{- include "aicr-operator.keep" . | nindent 4 }}
spec:
  replicas: 1
  # The volume is ReadWriteOnce: the old pod stops before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "aicr-operator.registrySelector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aicr-operator.registrySelector" . | nindent 8 }}
      annotations:
        # The registry reads its configuration and htpasswd file at startup.
        checksum/config: {{ $config | sha256sum }}
        checksum/login: {{ $login.htpasswd | sha256sum }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        # The volume only grows; relabeling every file on each restart would
        # slow every start.
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: registry
          image: {{ .Values.registry.inCluster.image }}
          imagePullPolicy: IfNotPresent
          args: [serve, /etc/aicr-registry/config.yml]
          env:
            # Distribution exports OpenTelemetry signals by default; nothing
            # collects them here.
            - name: OTEL_TRACES_EXPORTER
              value: none
            - name: OTEL_METRICS_EXPORTER
              value: none
            - name: OTEL_LOGS_EXPORTER
              value: none
          ports:
            - name: registry
              containerPort: 5000
          # Every registry path but the health check needs the login.
          readinessProbe:
            tcpSocket:
              port: registry
          livenessProbe:
            tcpSocket:
              port: registry
            initialDelaySeconds: 10
          resources:
            {{- toYaml .Values.registry.inCluster.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /etc/aicr-registry
              readOnly: true
            - name: storage
              mountPath: /var/lib/registry
            - name: login
              mountPath: /auth
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: aicr-registry
        - name: storage
          persistentVolumeClaim:
            claimName: aicr-registry
        - name: login
          secret:
            secretName: aicr-registry-login
            items:
              - key: htpasswd
                path: htpasswd
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- with .Values.operator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* Pod (anti-)affinity aims at the operator's pods, not this one. */}}
      {{- with (.Values.operator.affinity | default dict).nodeAffinity }}
      affinity:
        nodeAffinity:
          {{- toYaml . | nindent 10 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: aicr-registry
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aicr-operator.labels" . | nindent 4 }}
  annotations:
    {{- include "aicr-operator.keep" . | nindent 4 }}
spec:
  selector:
    {{- include "aicr-operator.registrySelector" . | nindent 4 }}
  ports:
    - name: registry
      port: 5000
      targetPort: registry
---
# Only the operator, the pushing Jobs and Argo CD's repo server reach the
# registry, where the CNI enforces NetworkPolicy. kubectl port-forward
# bypasses it, so there the login is the only control.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aicr-registry
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aicr-operator.labels" . | nindent 4 }}
  annotations:
    {{- include "aicr-operator.keep" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aicr-operator.registrySelector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - protocol: TCP
          port: 5000
      from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: aicr-operator
              app.kubernetes.io/instance: {{ .Release.Name }}
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  {{- range (without $pushers .Release.Namespace) }}
                  - {{ . }}
                  {{- end }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.engine.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.registry.inCluster.repoServerLabels | nindent 14 }}
{{- end }}
