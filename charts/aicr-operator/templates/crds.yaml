{{- include "aicr-operator.validate" . -}}
{{/*
CRDs are templates, not crds/ files, so helm upgrade updates them; they are
kept on uninstall because deleting a CRD deletes every object of its kind.
The files are generated by make generate.
*/}}
{{- range $path, $_ := .Files.Glob "files/crds/*.yaml" }}
{{- $crd := $.Files.Get $path | fromYaml }}
{{- $metadata := $crd.metadata }}
{{- $_ := set $metadata "annotations" (merge (dict "helm.sh/resource-policy" "keep") ($metadata.annotations | default dict)) }}
{{- $_ := set $metadata "labels" (merge (include "aicr-operator.labels" $ | fromYaml) ($metadata.labels | default dict)) }}
---
{{ toYaml $crd }}
{{- end }}
