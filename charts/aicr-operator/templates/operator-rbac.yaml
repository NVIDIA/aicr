{{/*
The operator's identity: its own kinds and their status (never
spec.approval), Node reads, its labeled state, AICR Jobs and their run
objects in the Job namespaces, and Applications in the engine namespace. No
escalate, bind, impersonate, pods/exec, Namespace writes, or Secret list,
watch or cluster-wide access. No role aggregates into admin, edit or view.
*/}}
{{- $jobNamespaces := list .Values.namespaces.jobs .Values.namespaces.discovery }}
{{- if .Values.validation.enabled }}
{{- $jobNamespaces = append $jobNamespaces .Values.namespaces.validation }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aicr-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aicr-operator.labels" . | nindent 4 }}
  {{- with .Values.operator.serviceAccountAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aicr-operator
  labels:
    {{- include "aicr-operator.labels" . | nindent 4 }}
rules:
  # patch: the cleanup finalizer only (policy aicr-operator-runtime).
  - apiGroups: [operator.aicr.run]
    resources: [clusterruntimes]
    verbs: [get, list, watch, patch]
  - apiGroups: [operator.aicr.run]
    resources: [clusterruntimes/status]
    verbs: [get, patch, update]
  # delete: retention.
  - apiGroups: [operator.aicr.run]
    resources: [runtimerollouts]
    verbs: [get, list, watch, create, patch, update, delete]
  - apiGroups: [operator.aicr.run]
    resources: [runtimerollouts/status]
    verbs: [get, patch, update]
  # Discovery reads Nodes and never writes them.
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aicr-operator
  labels:
    {{- include "aicr-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aicr-operator
subjects:
  - kind: ServiceAccount
    name: aicr-operator
    namespace: {{ .Release.Namespace }}
---
# Plans, recipes, values, snapshots and assessments, the leader-election
# Lease and Events, in the operator namespace, and the operator's own pod,
# whose image digest evidence binds.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aicr-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aicr-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: ["", events.k8s.io]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get]
  {{- with include "aicr-operator.credentialsSecret" . }}
  # The registry credentials, read by name only.
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ . | quote }}]
    verbs: [get]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aicr-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aicr-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aicr-operator
subjects:
  - kind: ServiceAccount
    name: aicr-operator
    namespace: {{ .Release.Namespace }}
{{- range $jobNamespaces }}
---
# AICR Jobs, created suspended and resumed with a patch, and their Job-owned
# run objects: input and output ConfigMaps and per-run credential Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aicr-operator
  namespace: {{ . }}
  labels:
    {{- include "aicr-operator.labels" $ | nindent 4 }}
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create]
  {{- if ne . $.Values.namespaces.discovery }}
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aicr-operator
  namespace: {{ . }}
  labels:
    {{- include "aicr-operator.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aicr-operator
subjects:
  - kind: ServiceAccount
    name: aicr-operator
    namespace: {{ $.Release.Namespace }}
{{- end }}
---
# Events about the cluster-scoped runtime and rollouts land in default.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aicr-operator-events
  namespace: default
  labels:
    {{- include "aicr-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["", events.k8s.io]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aicr-operator-events
  namespace: default
  labels:
    {{- include "aicr-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aicr-operator-events
subjects:
  - kind: ServiceAccount
    name: aicr-operator
    namespace: {{ .Release.Namespace }}
---
# Owned Applications, the project check and, with the aws provider, the
# repo-creds token, by name. No access to argocd-cm.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aicr-operator
  namespace: {{ .Values.engine.namespace }}
  labels:
    {{- include "aicr-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list, watch, create, patch, update, delete]
  - apiGroups: [argoproj.io]
    resources: [appprojects]
    resourceNames: [{{ .Values.engine.project | quote }}]
    verbs: [get]
  {{- if eq (include "aicr-operator.ecr" .) "true" }}
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ .Values.registry.auth.repoCredsSecret | quote }}]
    verbs: [get, update]
  {{- end }}
  # Drift Events on Applications.
  - apiGroups: ["", events.k8s.io]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aicr-operator
  namespace: {{ .Values.engine.namespace }}
  labels:
    {{- include "aicr-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aicr-operator
subjects:
  - kind: ServiceAccount
    name: aicr-operator
    namespace: {{ .Release.Namespace }}
