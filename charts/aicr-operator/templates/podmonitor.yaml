{{/*
Scrapes the operator's metrics port without a Service. Rendered only while
the PodMonitor kind is served: applying it before the CRD exists would fail
the install. NOTES.txt says when it was skipped.
*/}}
{{- $podMonitor := .Values.operator.podMonitor | default dict }}
{{- if and $podMonitor.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1/PodMonitor") }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: aicr-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- merge (include "aicr-operator.labels" . | fromYaml) ($podMonitor.labels | default dict) | toYaml | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: aicr-operator
      app.kubernetes.io/instance: {{ .Release.Name }}
  podMetricsEndpoints:
    - port: metrics
      {{- with $podMonitor.interval }}
      interval: {{ . }}
      {{- end }}
{{- end }}
