apiVersion: apps/v1
kind: Deployment
metadata:
  name: aicr-aibom-fixture
  namespace: aicr-aibom-test
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: aicr-aibom-fixture
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aicr-aibom-fixture
    spec:
      containers:
        - name: triton
          image: nvcr.io/nvidia/tritonserver@sha256:a28ad116eeb5502c34d3b9be95715430c03674898cd78fda1f139d505f77b81d
          env:
            - name: HF_MODEL_ID
              value: nvidia/aicr-aibom-fixture
