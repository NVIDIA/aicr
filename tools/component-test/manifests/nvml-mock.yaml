# nvml-mock fallback for setup-gpu-mock.sh, applied when Helm is missing or
# the chart install fails.
#
# Rendered from the pinned chart rather than written by hand, so the fallback
# runs the pod the Helm path runs: label app.kubernetes.io/name=nvml-mock,
# container node-agent, and the same host mounts, NFD features directory
# included. The hand-written manifest this replaces had drifted from all
# three, and started /scripts/entrypoint.sh, which the pinned image does not
# ship.
#
# The ConfigMap is one GPU profile, verbatim, so the fallback serves that
# profile alone. setup-gpu-mock.sh reads the lines below and refuses a
# different profile or chart pin instead of deploying a mismatched mock. The
# image placeholders are filled from the same pins as the Helm path, so the
# image is pulled by digest here too.
#
# nvml-mock-chart-version: 0.4.0-rc2
# nvml-mock-chart-digest: sha256:341389c379afea8dfe53e7af46ad8199a6588d3629d2005985ccbdcde35511ce
# nvml-mock-profile: a100
#
# To regenerate after a chart pin bump, render from the new nvml_mock_chart_digest
# in .settings.yaml with the same arguments:
#   helm template nvml-mock oci://ghcr.io/nvidia/k8s-test-infra/chart/nvml-mock@<digest> \
#     --namespace nvml-mock --set gpu.profile=a100 \
#     --set gpu.count=8 --set image.repository=NVML_MOCK_IMAGE_PLACEHOLDER \
#     --set image.tag=NVML_MOCK_VERSION_PLACEHOLDER \
#     --set driverVersion=DRIVER_VERSION_PLACEHOLDER
# then prepend the `Namespace nvml-mock` document below (helm template emits
# none, and setup-gpu-mock.sh applies into nvml-mock without creating it),
# set the GPU_COUNT env value to "GPU_COUNT_PLACEHOLDER" (the only line
# gpu.count reaches), delete the helm.sh/chart and managed-by labels, the
# integrations-fgo comment block and trailing whitespace, and update the
# chart version and digest above.
---
apiVersion: v1
kind: Namespace
metadata:
  name: nvml-mock
---
# Source: nvml-mock/templates/network-policy-ibping.yaml
# The fabric relay listens on 0.0.0.0:18515 without
# authentication. Admitting only peer nvml-mock pods keeps that surface
# reachable by its real clients alone.
# Egress stays open so DNS peer discovery and registration still work.
#
# kindnetd enforces NetworkPolicy on current Kind releases, so this is
# load-bearing in local e2e, not only on Calico/Cilium.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nvml-mock-ibping
  labels:
    app.kubernetes.io/name: nvml-mock
    app.kubernetes.io/instance: nvml-mock
    app.kubernetes.io/version: "550.163.01"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nvml-mock
      app.kubernetes.io/instance: nvml-mock
      app.kubernetes.io/component: daemon
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Name + component, not instance: the fabric spans every daemon pod
        # cluster-wide and ibping-multinode deploys one release per node, so
        # instance scoping would drop cross-release REGISTER. The component
        # label keeps the NRI sidecar out.
        #
        # namespaceSelector {} is load-bearing, not redundant: a bare
        # podSelector matches only this policy's own namespace, silently
        # dropping REGISTER from a fleet split across namespaces.
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: nvml-mock
              app.kubernetes.io/component: daemon
      ports:
        - port: ibping
          protocol: TCP

---
