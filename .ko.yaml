# The aicr CLI/agent is a pure-Go binary that discovers the GPU SKU driver-free
# via NFD/PCI, so it needs neither nvidia-smi nor the CUDA base (and its
# recurring CVE surface). It runs on NVIDIA's own static distroless base rather
# than ko's default (cgr.dev/chainguard/static). This defaultBaseImage applies
# to `ko build` CLI invocations (e.g. the vuln-scan workflow); goreleaser's kos
# entries pin the same image explicitly via base_image.
#
# ko has no user default of its own, so images built through this file run as
# the base's nvs (UID 1000) unless the invocation passes --image-user. The
# published images do not come from here — goreleaser pins user 65532 directly.
# The base declares WorkingDir=/app and ko has no override for it, so that
# value reaches every image built FROM it. v4.1.3 is the first tag that also
# ships an /app directory; on anything older, runtimes that refuse to create a
# missing working directory (Cloud Run, Knative) cannot start the image, so
# never pin this below v4.1.3 (#2652).
defaultBaseImage: nvcr.io/nvidia/distroless/static:v4.1.3@sha256:ec947edce045116008a8aeab38c5da643fbf110990b133bad200dbf5e4b6e296
