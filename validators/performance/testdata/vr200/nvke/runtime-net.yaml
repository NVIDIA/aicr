# NCCL all-reduce TrainingRuntime for VR200 on NVKE, NET/RoCE-transport variant.
#
# Measures the east-west fabric the vr200-nvke leaf builds: eight ConnectX-9
# rails, each exposed as SR-IOV VFs (nvidia.com/sriov_resource_rail_<n>) and
# attached through the roce-network-rail-<n> SriovNetworks, whose
# NetworkAttachmentDefinitions live in the default namespace
# (recipes/components/sriov-ib-networks/manifests/nvke-vr200.yaml). NVLS and
# MNNVL are forced off so NCCL uses its built-in verbs transport over the VFs
# rather than the NVLink fabric the NVLS variant measures.
#
# NO RUN HAS COMPLETED. The rails themselves are deployed and attachable --
# a pod on the reference cluster took all eight VFs, each with an RDMA device
# and a RoCE v2 GID at index 1, and the precheck below was run against it
# unchanged and passed. What has not happened is a collective: the spare
# ConnectX-9 ports have no path between workers, so NCCL has nothing to carry
# traffic over. The floor in the overlay is a placeholder until that changes.
#
# The GID index measured there was 1, not 0, which is exactly why
# NCCL_IB_GID_INDEX has to be set: index 0 holds the RoCE v1 GID.
#
# Differences from the GB200 NET runtime, all forced by the hardware:
#
#   Eight rails, not four. GB200 trays carry four ConnectX-7 rails; these carry
#   eight ConnectX-9 ports. Each supplies one VF (sriov_totalvfs is 1 on this
#   firmware), so a worker takes all eight.
#
#   RoCE, not IPoIB. The VF netdevs are plain Ethernet, so the precheck looks
#   for an IPv4 address rather than an IPoIB one.
#
#   NCCL_IB_GID_INDEX, not NCCL_IB_PKEY. P_Key partitions are an InfiniBand
#   concept; on RoCE the equivalent selection is the GID table index carrying
#   the RoCE v2 entry. NCCL defaults to index 0, which on these ports holds the
#   RoCE v1 GID, so leaving it unset silently selects the wrong transport.
#
# As on GB200, a rank that fails any precheck exits with an AICR_PRECHECK_FAILED
# line naming the rail, which the validator reports as the failure reason, so
# the check never passes on a pod-network fallback.

apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainingRuntime
metadata:
  name: nccl-all-reduce-runtime
  namespace: ${NAMESPACE}
  labels:
    trainer.kubeflow.org/framework: mpi
spec:
  mlPolicy:
    mpi:
      mpiImplementation: OpenMPI
      numProcPerNode: ${GPU_COUNT_PER_NODE}
      runLauncherAsNode: false
      sshAuthMountPath: /tmp/mpi-keys
  template:
    spec:
      network:
        enableDNSHostnames: true
        publishNotReadyAddresses: true
      replicatedJobs:
      - name: node
        template:
          spec:
            template:
              metadata:
                annotations:
                  k8s.v1.cni.cncf.io/networks: default/roce-network-rail-0,default/roce-network-rail-1,default/roce-network-rail-2,default/roce-network-rail-3,default/roce-network-rail-4,default/roce-network-rail-5,default/roce-network-rail-6,default/roce-network-rail-7
              spec:
                tolerations:
                - operator: Exists
                initContainers:
                - name: fix-ssh-perms
                  image: nvcr.io/nvidia/pytorch:25.06-py3
                  command:
                  - /bin/sh
                  - -c
                  - |
                    mkdir -p /root/.ssh &&
                    cp /tmp/mpi-keys/authorized_keys /root/.ssh/authorized_keys &&
                    chmod 700 /root/.ssh &&
                    chmod 600 /root/.ssh/authorized_keys
                  volumeMounts:
                  - name: mpi-ssh-auth
                    mountPath: /tmp/mpi-keys
                    readOnly: true
                  - name: ssh-config
                    mountPath: /root/.ssh
                containers:
                - name: node
                  image: nvcr.io/nvidia/pytorch:25.06-py3
                  command: ["sh", "-c"]
                  args:
                  # sshd is installed at runtime, with iproute2 for the rank
                  # attachment check. HTTPS and the main component only: plain-HTTP
                  # fetches from ports.ubuntu.com were observed to stall for
                  # minutes (#3109). ca-certificates ships in the image. Skipped for
                  # an AICR_NCCL_RUNTIME_IMAGE override without a deb822 sources file.
                  - |
                    if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
                      sed -i -e 's|http://ports.ubuntu.com|https://ports.ubuntu.com|g' \
                             -e 's|^Components:.*|Components: main|' /etc/apt/sources.list.d/ubuntu.sources
                    fi &&
                    apt-get update &&
                    apt-get install -y --no-install-recommends openssh-server iproute2 &&
                    mkdir -p /var/run/sshd &&
                    chmod 0755 /var/run/sshd &&
                    mkdir -p /root/.ssh &&
                    cp /tmp/mpi-keys/* /root/.ssh/ &&
                    chmod 700 /root/.ssh &&
                    chmod 600 /root/.ssh/authorized_keys &&
                    /usr/sbin/sshd -De
                  # Ready only once sshd listens; the launcher's dependsOn
                  # waits on it, so mpirun never races the install.
                  readinessProbe:
                    tcpSocket:
                      port: 22
                    periodSeconds: 5
                    failureThreshold: 120
                  resources:
                    limits:
                      nvidia.com/gpu: ${GPU_COUNT_PER_NODE}
                      nvidia.com/sriov_resource_rail_0: "1"
                      nvidia.com/sriov_resource_rail_1: "1"
                      nvidia.com/sriov_resource_rail_2: "1"
                      nvidia.com/sriov_resource_rail_3: "1"
                      nvidia.com/sriov_resource_rail_4: "1"
                      nvidia.com/sriov_resource_rail_5: "1"
                      nvidia.com/sriov_resource_rail_6: "1"
                      nvidia.com/sriov_resource_rail_7: "1"
                    requests:
                      nvidia.com/gpu: ${GPU_COUNT_PER_NODE}
                      nvidia.com/sriov_resource_rail_0: "1"
                      nvidia.com/sriov_resource_rail_1: "1"
                      nvidia.com/sriov_resource_rail_2: "1"
                      nvidia.com/sriov_resource_rail_3: "1"
                      nvidia.com/sriov_resource_rail_4: "1"
                      nvidia.com/sriov_resource_rail_5: "1"
                      nvidia.com/sriov_resource_rail_6: "1"
                      nvidia.com/sriov_resource_rail_7: "1"
                  securityContext:
                    capabilities:
                      add: ["IPC_LOCK"]
                  volumeMounts:
                  - name: ssh-config
                    mountPath: /root/.ssh
                  - name: dshm
                    mountPath: /dev/shm
                volumes:
                - name: ssh-config
                  emptyDir: {}
                - name: dshm
                  emptyDir:
                    medium: Memory
      # Listed after "node": JobSet requires a dependsOn target to precede
      # the job that depends on it.
      - name: launcher
        replicas: 1
        dependsOn:
        - name: node
          status: Ready
        template:
          spec:
            template:
              spec:
                # A failed rank precheck is a cluster condition a restart cannot
                # fix. Fail the pod once so the validator reads its logs and the
                # AICR_PRECHECK_FAILED reason, instead of waiting through
                # restart backoff until the pod is deleted.
                restartPolicy: Never
                tolerations:
                - operator: Exists
                initContainers:
                - name: fix-ssh-perms
                  image: nvcr.io/nvidia/pytorch:25.06-py3
                  command:
                  - /bin/sh
                  - -c
                  - |
                    mkdir -p /root/.ssh
                    cp /tmp/mpi-keys/id_rsa /root/.ssh/id_rsa
                    cp /tmp/mpi-keys/authorized_keys /root/.ssh/authorized_keys
                    chmod 700 /root/.ssh
                    chmod 600 /root/.ssh/id_rsa /root/.ssh/authorized_keys
                  volumeMounts:
                  - name: mpi-ssh-auth
                    mountPath: /tmp/mpi-keys
                    readOnly: true
                  - name: ssh-config
                    mountPath: /root/.ssh
                containers:
                - name: node
                  image: nvcr.io/nvidia/pytorch:25.06-py3
                  # Keeps the log tail, including any AICR_PRECHECK_FAILED line,
                  # in pod status for the validator's fallback when the launcher
                  # logs are already gone.
                  terminationMessagePolicy: FallbackToLogsOnError
                  env:
                  - name: LD_LIBRARY_PATH
                    value: "/usr/local/nvidia/lib64:/usr/local/cuda/lib64"
                  command:
                  - /usr/local/mpi/bin/mpirun
                  args:
                  - -np
                  - "${GPU_COUNT}"
                  - --allow-run-as-root
                  - --mca
                  - plm_rsh_args
                  - -o StrictHostKeyChecking=no -o ConnectionAttempts=10
                  # Keep MPI's own traffic on eth0. UCX would otherwise run MPI
                  # over the pod's rail VFs and, where the IB partition is
                  # limited, fail in MPI startup before NCCL starts.
                  - --mca
                  - pml
                  - ob1
                  - --mca
                  - btl
                  - self,tcp
                  - --mca
                  - coll
                  - ^ucc,hcoll
                  - --mca
                  - btl_tcp_if_include
                  - eth0
                  - --mca
                  - oob_tcp_if_include
                  - eth0
                  - -x
                  - LD_LIBRARY_PATH
                  - -x
                  - NCCL_DEBUG=INFO
                  # Force NCCL onto the NET/RoCE transport: disable NVLS (NVLink
                  # SHARP) and MNNVL (multi-node NVLink) so traffic crosses the
                  # RoCE fabric; NCCL_NET_PLUGIN=none selects the built-in IB
                  # verbs transport. NCCL_IB_HCA and NCCL_IB_GID_INDEX are set per rank below.
                  - -x
                  - NCCL_NVLS_ENABLE=0
                  - -x
                  - NCCL_MNNVL_ENABLE=0
                  - -x
                  - NCCL_NET_PLUGIN=none
                  - -x
                  - NCCL_SOCKET_IFNAME=eth0
                  - -x
                  - NCCL_IGNORE_DISABLED_P2P=1
                  # Per rank: require an IPv4 address, an RDMA device and a
                  # RoCE v2 GID (one table index across all rails) on each of
                  # net1..net8, then pin NCCL to those VF HCAs and that index.
                  - /bin/sh
                  - -c
                  - |
                    hcas=""
                    gidx=""
                    for i in 1 2 3 4 5 6 7 8; do
                      if ! ip -o -4 addr show dev "net$i" 2>/dev/null | grep -q inet; then
                        echo "AICR_PRECHECK_FAILED: rail attachment net$i has no IPv4 address on $(hostname); check the roce-network-rail-$((i-1)) NetworkAttachmentDefinition and multus" >&2
                        exit 1
                      fi
                      hca=$(ls "/sys/class/net/net$i/device/infiniband" 2>/dev/null | head -n 1)
                      if [ -z "$hca" ]; then
                        echo "AICR_PRECHECK_FAILED: rail attachment net$i has no RDMA device on $(hostname)" >&2
                        exit 1
                      fi
                      # Lowest GID table index whose type is RoCE v2 and whose
                      # GID is not the all-zero placeholder.
                      idx=""
                      for t in /sys/class/infiniband/$hca/ports/1/gid_attrs/types/*; do
                        n=${t##*/}
                        ty=$(cat "$t" 2>/dev/null)
                        case "$ty" in *"RoCE v2"*) ;; *) continue ;; esac
                        g=$(cat "/sys/class/infiniband/$hca/ports/1/gids/$n" 2>/dev/null)
                        case "$g" in ""|0000:0000:0000:0000:0000:0000:0000:0000) continue ;; esac
                        if [ -z "$idx" ] || [ "$n" -lt "$idx" ]; then idx=$n; fi
                      done
                      if [ -z "$idx" ]; then
                        echo "AICR_PRECHECK_FAILED: rail attachment net$i ($hca) exposes no RoCE v2 GID on $(hostname); the VF must carry one for the verbs transport" >&2
                        exit 1
                      fi
                      if [ -n "$gidx" ] && [ "$idx" != "$gidx" ]; then
                        echo "AICR_PRECHECK_FAILED: rail attachment net$i ($hca) has its RoCE v2 GID at index $idx, other rails at $gidx, on $(hostname); NCCL_IB_GID_INDEX takes one index" >&2
                        exit 1
                      fi
                      gidx=$idx
                      hcas="$hcas,$hca"
                    done
                    export NCCL_IB_HCA="=${hcas#,}"
                    # NCCL uses GID index 0 unless told otherwise, and index 0
                    # on these ports is the RoCE v1 GID; point it at the v2 one.
                    export NCCL_IB_GID_INDEX="$gidx"
                    exec "$@"
                  - nccl-rank
                  - /usr/local/bin/${TEST_TYPE}_mpi
                  - -b
                  - ${MIN_MESSAGE_SIZE}
                  - -e
                  - ${MAX_MESSAGE_SIZE}
                  - -f
                  - "2"
                  - -g
                  - "1"
                  resources:
                    limits:
                      cpu: "2"
                      memory: 128Mi
                  volumeMounts:
                  - name: ssh-config
                    mountPath: /root/.ssh
                volumes:
                - name: ssh-config
                  emptyDir: {}
      successPolicy:
        operator: All
        targetReplicatedJobs:
        - launcher
