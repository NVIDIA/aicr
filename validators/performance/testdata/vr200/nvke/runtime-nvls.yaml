# NCCL all-reduce TrainingRuntime for VR200 on NVKE, NVLS variant.
# Selected by supportedNCCLCombinations[variantNVLS][nvke] = [vr200]; the
# nccl-all-reduce-bw-nvls check resolves this path via templatePath().
#
# Measures MNNVL (multi-node NVLink) across the VR NVL72 IMEX domain.
# Measured 2026-11-03 on a 2-node NVKE tenant cluster (2 x 4 VR200, operator
# driver 615.71.09, nvidia-dra-driver-gpu 25.8.1): 996.5 and 996.1 GB/s busbw
# averaged over 1 GiB..16 GiB across two runs, 1040 GB/s peak at 16 GiB, zero
# mismatches at every size. NCCL reported `NVLS comm ... nvlsRanks 8`, so one
# NVLS communicator spanned both trays.
#
# THIS FILE IS CURRENTLY IDENTICAL TO testdata/vr200/rke2/runtime-nvls.yaml.
# Nothing in the manifest is service-specific -- the RKE2 variant carries no
# RKE2 tolerations, node selectors or resource names, only `operator: Exists`
# and nvidia.com/gpu. templatePath() joins testdata/{accelerator}/{service}
# with no fallback, so the pairing needs its own file to be selectable. If a
# per-accelerator fallback is ever added, these two collapse into one.
#
# What differs is the PLATFORM, not the manifest, and it is a recipe concern:
# the NVKE node image ships no GPU driver, so gpu-operator installs it and the
# driver lives at /run/nvidia/driver -- which is already what
# components/nvidia-dra-driver-gpu/values.yaml sets, so no override is
# required for the kubelet-plugin to find it. The NVKE node image does need
# the nvidia-bos kernel line; on the generic nvidia-64k kernel no driver
# brings the GPUs up at all.
#
# The validator provisions the ComputeDomain and waits for the IMEX
# ResourceClaimTemplate in the per-run benchmark namespace, exactly as it does
# for rke2 and gb200/eks|oke -- this runtime declares no fabric wiring of its
# own and needs no operator setup before a run.
#
# NODE SELECTION: as for rke2, VR pre-GA nodes report a placeholder
# nvidia.com/gpu.product, so acceleratorProductMatchers has no vr200 entry and
# the product filter is skipped. Correct on a homogeneous VR pool; on a
# heterogeneous cluster pass --node-selector with a label that distinguishes it.

apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainingRuntime
metadata:
  name: nccl-all-reduce-runtime
  namespace: ${NAMESPACE}
  labels:
    trainer.kubeflow.org/framework: mpi
spec:
  mlPolicy:
    mpi:
      mpiImplementation: OpenMPI
      numProcPerNode: ${GPU_COUNT_PER_NODE}
      runLauncherAsNode: false
      sshAuthMountPath: /tmp/mpi-keys
  template:
    spec:
      network:
        enableDNSHostnames: true
        publishNotReadyAddresses: true
      replicatedJobs:
      - name: node
        template:
          spec:
            template:
              spec:
                # IMEX channel claim. The validator provisions the
                # ComputeDomain and waits for this ResourceClaimTemplate in
                # the per-run benchmark namespace before the TrainJob fires —
                # nothing is operator-precreated.
                resourceClaims:
                - name: imex-channel
                  resourceClaimTemplateName: nccl-all-reduce-imex
                initContainers:
                - name: fix-ssh-perms
                  image: nvcr.io/nvidia/pytorch:25.06-py3
                  command:
                  - /bin/sh
                  - -c
                  - |
                    mkdir -p /root/.ssh &&
                    cp /tmp/mpi-keys/authorized_keys /root/.ssh/authorized_keys &&
                    chmod 700 /root/.ssh &&
                    chmod 600 /root/.ssh/authorized_keys
                  volumeMounts:
                  - name: mpi-ssh-auth
                    mountPath: /tmp/mpi-keys
                    readOnly: true
                  - name: ssh-config
                    mountPath: /root/.ssh
                containers:
                - name: node
                  image: nvcr.io/nvidia/pytorch:25.06-py3
                  command: ["sh", "-c"]
                  args:
                  # sshd is installed at runtime. HTTPS and the main component
                  # only (35 MB of indexes down to ~6 MB): plain-HTTP fetches
                  # from ports.ubuntu.com were observed to stall for minutes
                  # (#3109). ca-certificates ships in the image. Skipped for an
                  # AICR_NCCL_RUNTIME_IMAGE override without a deb822 sources file.
                  - |
                    if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
                      sed -i -e 's|http://ports.ubuntu.com|https://ports.ubuntu.com|g' \
                             -e 's|^Components:.*|Components: main|' /etc/apt/sources.list.d/ubuntu.sources
                    fi &&
                    apt-get update &&
                    apt-get install -y --no-install-recommends openssh-server &&
                    mkdir -p /var/run/sshd &&
                    chmod 0755 /var/run/sshd &&
                    mkdir -p /root/.ssh &&
                    cp /tmp/mpi-keys/* /root/.ssh/ &&
                    chmod 700 /root/.ssh &&
                    chmod 600 /root/.ssh/authorized_keys &&
                    /usr/sbin/sshd -De
                  # Ready only once sshd listens; the launcher's dependsOn
                  # waits on it, so mpirun never races the install.
                  readinessProbe:
                    tcpSocket:
                      port: 22
                    periodSeconds: 5
                    failureThreshold: 120
                  resources:
                    claims:
                    - name: imex-channel
                    limits:
                      nvidia.com/gpu: ${GPU_COUNT_PER_NODE}
                    requests:
                      nvidia.com/gpu: ${GPU_COUNT_PER_NODE}
                  securityContext:
                    capabilities:
                      add: ["IPC_LOCK"]
                  volumeMounts:
                  - name: ssh-config
                    mountPath: /root/.ssh
                  - name: dshm
                    mountPath: /dev/shm
                volumes:
                - name: ssh-config
                  emptyDir: {}
                - name: dshm
                  emptyDir:
                    medium: Memory
      # Listed after "node": JobSet requires a dependsOn target to precede
      # the job that depends on it.
      - name: launcher
        replicas: 1
        dependsOn:
        - name: node
          status: Ready
        template:
          spec:
            template:
              spec:
                tolerations:
                - operator: Exists
                initContainers:
                - name: fix-ssh-perms
                  image: nvcr.io/nvidia/pytorch:25.06-py3
                  command:
                  - /bin/sh
                  - -c
                  - |
                    mkdir -p /root/.ssh
                    cp /tmp/mpi-keys/id_rsa /root/.ssh/id_rsa
                    cp /tmp/mpi-keys/authorized_keys /root/.ssh/authorized_keys
                    chmod 700 /root/.ssh
                    chmod 600 /root/.ssh/id_rsa /root/.ssh/authorized_keys
                  volumeMounts:
                  - name: mpi-ssh-auth
                    mountPath: /tmp/mpi-keys
                    readOnly: true
                  - name: ssh-config
                    mountPath: /root/.ssh
                containers:
                - name: node
                  image: nvcr.io/nvidia/pytorch:25.06-py3
                  env:
                  - name: LD_LIBRARY_PATH
                    value: "/usr/local/nvidia/lib64:/usr/local/cuda/lib64"
                  command:
                  - /usr/local/mpi/bin/mpirun
                  args:
                  - -np
                  - "${GPU_COUNT}"
                  - --allow-run-as-root
                  - --mca
                  - plm_rsh_args
                  - -o StrictHostKeyChecking=no -o ConnectionAttempts=10
                  - --mca
                  - btl
                  - ^openib
                  - --mca
                  - btl_tcp_if_include
                  - eth0
                  - --mca
                  - oob_tcp_if_include
                  - eth0
                  - -x
                  - LD_LIBRARY_PATH
                  - -x
                  - NCCL_DEBUG=INFO
                  - -x
                  - NCCL_NVLS_ENABLE=1
                  - -x
                  - NCCL_IGNORE_DISABLED_P2P=1
                  - -x
                  - NCCL_SOCKET_IFNAME=eth0
                  - /usr/local/bin/${TEST_TYPE}_mpi
                  - -b
                  - ${MIN_MESSAGE_SIZE}
                  - -e
                  - ${MAX_MESSAGE_SIZE}
                  - -f
                  - "2"
                  - -g
                  - "1"
                  resources:
                    limits:
                      cpu: "2"
                      memory: 128Mi
                  volumeMounts:
                  - name: ssh-config
                    mountPath: /root/.ssh
                volumes:
                - name: ssh-config
                  emptyDir: {}
      successPolicy:
        operator: All
        targetReplicatedJobs:
        - launcher
