# NCCL all-reduce TrainingRuntime for GB300 on OKE, NET/RoCE-transport variant.
#
# Measures the RoCE east-west fabric instead of NVLink: NVLS and MNNVL are
# forced off so NCCL uses its built-in IB verbs transport over the four
# ConnectX SR-IOV VFs (rdma_vf_rail0-3, one per GPU). NCCL_DEBUG stays INFO —
# verifyTransportFromLogs confirms the transport by parsing the
# "NCCL INFO Using network" banner from launcher logs.
#
# Composition: the gb200/oke runtime-net.yaml scaffold, with the VFs attached
# per pod instead of shared HCAs: node pods request four nvidia.com/mlnxnics
# (the SR-IOV device plugin's VF resource) and name the recipe's rdma-net
# NetworkAttachmentDefinition once per VF, which moves each VF into the pod:
# host-device alone in shared RDMA netns mode (the recipe default), chained
# with the rdma CNI in exclusive mode (rdmaCni.enabled=true). The VFs carry only
# IPv6 SLAAC addresses; NCCL uses their RoCEv2 GID (index 3). NCCL
# reads the node's GB300 topology from /etc/nccl/topo.xml, which the recipe's
# nvidia-tuned package writes on every GPU node.
#
# Cluster prerequisites: the gb300-oke-ubuntu-training network-operator
# manifests (SR-IOV device plugin, Multus, and the rdma-net
# NetworkAttachmentDefinition, which the annotation below expects in the
# default nvidia-network-operator namespace) and Flannel pod networking, which leaves IPv6 enabled in pods.
# No NVreg_GrdmaPciTopoCheckOverride: see the leaf's gpu-operator comment.

apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainingRuntime
metadata:
  name: nccl-all-reduce-runtime
  namespace: ${NAMESPACE}
  labels:
    trainer.kubeflow.org/framework: mpi
spec:
  mlPolicy:
    mpi:
      mpiImplementation: OpenMPI
      numProcPerNode: ${GPU_COUNT_PER_NODE}
      runLauncherAsNode: false
      sshAuthMountPath: /tmp/mpi-keys
  template:
    spec:
      network:
        enableDNSHostnames: true
        publishNotReadyAddresses: true
      replicatedJobs:
      - name: node
        template:
          spec:
            template:
              metadata:
                annotations:
                  k8s.v1.cni.cncf.io/networks: nvidia-network-operator/rdma-net,nvidia-network-operator/rdma-net,nvidia-network-operator/rdma-net,nvidia-network-operator/rdma-net
              spec:
                tolerations:
                - operator: Exists
                initContainers:
                - name: fix-ssh-perms
                  image: nvcr.io/nvidia/pytorch:26.01-py3
                  command:
                  - /bin/sh
                  - -c
                  - |
                    mkdir -p /root/.ssh &&
                    cp /tmp/mpi-keys/authorized_keys /root/.ssh/authorized_keys &&
                    chmod 700 /root/.ssh &&
                    chmod 600 /root/.ssh/authorized_keys
                  volumeMounts:
                  - name: mpi-ssh-auth
                    mountPath: /tmp/mpi-keys
                    readOnly: true
                  - name: ssh-config
                    mountPath: /root/.ssh
                containers:
                - name: node
                  image: nvcr.io/nvidia/pytorch:26.01-py3
                  command: ["sh", "-c"]
                  args:
                  # sshd is installed at runtime. HTTPS and the main component
                  # only (35 MB of indexes down to ~6 MB): plain-HTTP fetches
                  # from ports.ubuntu.com were observed to stall for minutes
                  # (#3109). ca-certificates ships in the image. Skipped for an
                  # AICR_NCCL_RUNTIME_IMAGE override without a deb822 sources file.
                  - |
                    if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
                      sed -i -e 's|http://ports.ubuntu.com|https://ports.ubuntu.com|g' \
                             -e 's|^Components:.*|Components: main|' /etc/apt/sources.list.d/ubuntu.sources
                    fi &&
                    apt-get update &&
                    apt-get install -y --no-install-recommends openssh-server &&
                    mkdir -p /var/run/sshd &&
                    chmod 0755 /var/run/sshd &&
                    mkdir -p /root/.ssh &&
                    cp /tmp/mpi-keys/* /root/.ssh/ &&
                    chmod 700 /root/.ssh &&
                    chmod 600 /root/.ssh/authorized_keys &&
                    /usr/sbin/sshd -De
                  # Ready only once sshd listens; the launcher's dependsOn
                  # waits on it, so mpirun never races the install.
                  readinessProbe:
                    tcpSocket:
                      port: 22
                    periodSeconds: 5
                    failureThreshold: 120
                  resources:
                    limits:
                      nvidia.com/gpu: ${GPU_COUNT_PER_NODE}
                      nvidia.com/mlnxnics: "4"
                    requests:
                      nvidia.com/gpu: ${GPU_COUNT_PER_NODE}
                      nvidia.com/mlnxnics: "4"
                  securityContext:
                    capabilities:
                      add: ["IPC_LOCK"]
                  volumeMounts:
                  - name: ssh-config
                    mountPath: /root/.ssh
                  - name: dshm
                    mountPath: /dev/shm
                  - name: nccl-topo
                    mountPath: /etc/nccl/topo.xml
                    readOnly: true
                volumes:
                - name: ssh-config
                  emptyDir: {}
                - name: dshm
                  emptyDir:
                    medium: Memory
                # The GB300 NCCL topology nvidia-tuned writes on every node
                # (tuning-oke-gb300.yaml, TOPO_PATH). Type File fails the pod
                # at start if it is missing instead of letting NCCL run
                # without it.
                - name: nccl-topo
                  hostPath:
                    path: /etc/nccl/topo.xml
                    type: File
      # Listed after "node": JobSet requires a dependsOn target to precede
      # the job that depends on it.
      - name: launcher
        replicas: 1
        dependsOn:
        - name: node
          status: Ready
        template:
          spec:
            template:
              spec:
                tolerations:
                - operator: Exists
                initContainers:
                - name: fix-ssh-perms
                  image: nvcr.io/nvidia/pytorch:26.01-py3
                  command:
                  - /bin/sh
                  - -c
                  - |
                    mkdir -p /root/.ssh
                    cp /tmp/mpi-keys/id_rsa /root/.ssh/id_rsa
                    cp /tmp/mpi-keys/authorized_keys /root/.ssh/authorized_keys
                    chmod 700 /root/.ssh
                    chmod 600 /root/.ssh/id_rsa /root/.ssh/authorized_keys
                  volumeMounts:
                  - name: mpi-ssh-auth
                    mountPath: /tmp/mpi-keys
                    readOnly: true
                  - name: ssh-config
                    mountPath: /root/.ssh
                containers:
                - name: node
                  image: nvcr.io/nvidia/pytorch:26.01-py3
                  env:
                  - name: LD_LIBRARY_PATH
                    value: "/usr/local/nvidia/lib64:/usr/local/cuda/lib64"
                  # The launcher initializes UCX from its own environment, not
                  # from the -x arguments it forwards to the ranks. OCI RoCEv2
                  # is GID index 3; UCX's default (0) fails with
                  # IBV_WC_REM_ACCESS_ERR.
                  - name: UCX_IB_GID_INDEX
                    value: "3"
                  command:
                  - /usr/local/mpi/bin/mpirun
                  args:
                  - -np
                  - "${GPU_COUNT}"
                  - --allow-run-as-root
                  - --mca
                  - plm_rsh_args
                  - -o StrictHostKeyChecking=no -o ConnectionAttempts=10
                  # MPI coordinates over TCP only (NCCL drives RDMA itself),
                  # with UCC and HCOLL off: their RDMA paths crash on OCI's
                  # RoCE GID layout.
                  - --mca
                  - pml
                  - ob1
                  - --mca
                  - btl
                  - tcp,self
                  - --mca
                  - btl_tcp_if_include
                  - eth0
                  - --mca
                  - oob
                  - tcp
                  - --mca
                  - oob_tcp_if_include
                  - eth0
                  - --mca
                  - coll_ucc_enable
                  - "0"
                  - --mca
                  - coll_hcoll_enable
                  - "0"
                  - -x
                  - LD_LIBRARY_PATH
                  - -x
                  - NCCL_DEBUG=INFO
                  - -x
                  - NCCL_TOPO_FILE=/etc/nccl/topo.xml
                  # Force NCCL onto the NET transport: disable NVLS (NVLink
                  # SHARP) and MNNVL (multi-node NVLink) so traffic crosses the
                  # RoCE fabric; NCCL_NET_PLUGIN=none selects the built-in IB
                  # verbs transport over the attached VFs.
                  - -x
                  - NCCL_NVLS_ENABLE=0
                  - -x
                  - NCCL_MNNVL_ENABLE=0
                  - -x
                  - NCCL_NET_PLUGIN=none
                  # OCI RoCE: RoCEv2 GID index 3; spread traffic across the
                  # four rails (adaptive routing, data split across QPs).
                  - -x
                  - NCCL_IB_GID_INDEX=3
                  - -x
                  - NCCL_IB_ADAPTIVE_ROUTING=1
                  - -x
                  - NCCL_IB_SPLIT_DATA_ON_QPS=1
                  - -x
                  - NCCL_IB_QPS_PER_CONNECTION=4
                  - -x
                  - NCCL_IB_PCI_RELAXED_ORDERING=1
                  - -x
                  - NCCL_IB_TC=41
                  - -x
                  - NCCL_IB_SL=0
                  - -x
                  - NCCL_SOCKET_IFNAME=eth0
                  - -x
                  - NCCL_IGNORE_DISABLED_P2P=1
                  - /usr/local/bin/${TEST_TYPE}_mpi
                  - -b
                  - ${MIN_MESSAGE_SIZE}
                  - -e
                  - ${MAX_MESSAGE_SIZE}
                  - -f
                  - "2"
                  - -g
                  - "1"
                  resources:
                    limits:
                      cpu: "2"
                      memory: 128Mi
                  volumeMounts:
                  - name: ssh-config
                    mountPath: /root/.ssh
                volumes:
                - name: ssh-config
                  emptyDir: {}
      successPolicy:
        operator: All
        targetReplicatedJobs:
        - launcher
