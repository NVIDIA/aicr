# NCCL all-reduce TrainingRuntime for GB200 on NVKE, NET/IB-transport variant.
#
# Measures the InfiniBand east-west fabric the gb200-nvke leaves build: four
# ConnectX-7 rails, each exposed as SR-IOV VFs (nvidia.com/sriov_resource_rail_<n>)
# and attached through the sriov-network-rail-<n> SriovIBNetworks, whose
# NetworkAttachmentDefinitions live in the default namespace
# (recipes/components/sriov-ib-networks/manifests/nvke-gb200.yaml). NVLS and
# MNNVL are forced off so NCCL uses its built-in IB verbs transport over the VFs.
#
# Each worker requests one VF per rail and the four attachments, which multus
# exposes as net1..net4. Before NCCL starts, every rank checks that each netN
# carries an IPoIB address and an RDMA device, and pins NCCL_IB_HCA to exactly
# those four VF HCAs. A rank missing an attachment exits with an
# AICR_PRECHECK_FAILED line naming it, which the validator reports as the
# failure reason, so the check never passes on a pod-network fallback.
#
# Traffic needs every PF and VF GUID to be a full member of a common IB
# partition (P_Key 0x8000 bit set). A tenant with only limited membership
# (0x7fff) schedules and attaches, then fails in NCCL with retry-exceeded
# (docs/integrator/nvke-gb200-setup.md).
#
# Must stay in sync with ncclTrainingRuntimeName in nccl_all_reduce_bw_constraint.go.

apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainingRuntime
metadata:
  name: nccl-all-reduce-runtime
  namespace: ${NAMESPACE}
  labels:
    trainer.kubeflow.org/framework: mpi
spec:
  mlPolicy:
    mpi:
      mpiImplementation: OpenMPI
      numProcPerNode: ${GPU_COUNT_PER_NODE}
      runLauncherAsNode: false
      sshAuthMountPath: /tmp/mpi-keys
  template:
    spec:
      network:
        enableDNSHostnames: true
        publishNotReadyAddresses: true
      replicatedJobs:
      - name: node
        template:
          spec:
            template:
              metadata:
                annotations:
                  k8s.v1.cni.cncf.io/networks: default/sriov-network-rail-0,default/sriov-network-rail-1,default/sriov-network-rail-2,default/sriov-network-rail-3
              spec:
                tolerations:
                - operator: Exists
                initContainers:
                - name: fix-ssh-perms
                  image: nvcr.io/nvidia/pytorch:25.06-py3
                  command:
                  - /bin/sh
                  - -c
                  - |
                    mkdir -p /root/.ssh &&
                    cp /tmp/mpi-keys/authorized_keys /root/.ssh/authorized_keys &&
                    chmod 700 /root/.ssh &&
                    chmod 600 /root/.ssh/authorized_keys
                  volumeMounts:
                  - name: mpi-ssh-auth
                    mountPath: /tmp/mpi-keys
                    readOnly: true
                  - name: ssh-config
                    mountPath: /root/.ssh
                containers:
                - name: node
                  image: nvcr.io/nvidia/pytorch:25.06-py3
                  command: ["sh", "-c"]
                  args:
                  # sshd is installed at runtime, with iproute2 for the rank
                  # attachment check. HTTPS and the main component only: plain-HTTP
                  # fetches from ports.ubuntu.com were observed to stall for
                  # minutes (#3109). ca-certificates ships in the image. Skipped for
                  # an AICR_NCCL_RUNTIME_IMAGE override without a deb822 sources file.
                  - |
                    if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
                      sed -i -e 's|http://ports.ubuntu.com|https://ports.ubuntu.com|g' \
                             -e 's|^Components:.*|Components: main|' /etc/apt/sources.list.d/ubuntu.sources
                    fi &&
                    apt-get update &&
                    apt-get install -y --no-install-recommends openssh-server iproute2 &&
                    mkdir -p /var/run/sshd &&
                    chmod 0755 /var/run/sshd &&
                    mkdir -p /root/.ssh &&
                    cp /tmp/mpi-keys/* /root/.ssh/ &&
                    chmod 700 /root/.ssh &&
                    chmod 600 /root/.ssh/authorized_keys &&
                    /usr/sbin/sshd -De
                  # Ready only once sshd listens; the launcher's dependsOn
                  # waits on it, so mpirun never races the install.
                  readinessProbe:
                    tcpSocket:
                      port: 22
                    periodSeconds: 5
                    failureThreshold: 120
                  resources:
                    limits:
                      nvidia.com/gpu: ${GPU_COUNT_PER_NODE}
                      nvidia.com/sriov_resource_rail_0: "1"
                      nvidia.com/sriov_resource_rail_1: "1"
                      nvidia.com/sriov_resource_rail_2: "1"
                      nvidia.com/sriov_resource_rail_3: "1"
                    requests:
                      nvidia.com/gpu: ${GPU_COUNT_PER_NODE}
                      nvidia.com/sriov_resource_rail_0: "1"
                      nvidia.com/sriov_resource_rail_1: "1"
                      nvidia.com/sriov_resource_rail_2: "1"
                      nvidia.com/sriov_resource_rail_3: "1"
                  securityContext:
                    capabilities:
                      add: ["IPC_LOCK"]
                  volumeMounts:
                  - name: ssh-config
                    mountPath: /root/.ssh
                  - name: dshm
                    mountPath: /dev/shm
                volumes:
                - name: ssh-config
                  emptyDir: {}
                - name: dshm
                  emptyDir:
                    medium: Memory
      # Listed after "node": JobSet requires a dependsOn target to precede
      # the job that depends on it.
      - name: launcher
        replicas: 1
        dependsOn:
        - name: node
          status: Ready
        template:
          spec:
            template:
              spec:
                tolerations:
                - operator: Exists
                initContainers:
                - name: fix-ssh-perms
                  image: nvcr.io/nvidia/pytorch:25.06-py3
                  command:
                  - /bin/sh
                  - -c
                  - |
                    mkdir -p /root/.ssh
                    cp /tmp/mpi-keys/id_rsa /root/.ssh/id_rsa
                    cp /tmp/mpi-keys/authorized_keys /root/.ssh/authorized_keys
                    chmod 700 /root/.ssh
                    chmod 600 /root/.ssh/id_rsa /root/.ssh/authorized_keys
                  volumeMounts:
                  - name: mpi-ssh-auth
                    mountPath: /tmp/mpi-keys
                    readOnly: true
                  - name: ssh-config
                    mountPath: /root/.ssh
                containers:
                - name: node
                  image: nvcr.io/nvidia/pytorch:25.06-py3
                  env:
                  - name: LD_LIBRARY_PATH
                    value: "/usr/local/nvidia/lib64:/usr/local/cuda/lib64"
                  command:
                  - /usr/local/mpi/bin/mpirun
                  args:
                  - -np
                  - "${GPU_COUNT}"
                  - --allow-run-as-root
                  - --mca
                  - plm_rsh_args
                  - -o StrictHostKeyChecking=no -o ConnectionAttempts=10
                  # Keep MPI's own traffic on eth0. The pods see every HCA on the
                  # host (shared RDMA namespace), so UCX would otherwise try the
                  # rail VFs and fail where the IB partition is limited, before
                  # NCCL starts.
                  - --mca
                  - pml
                  - ob1
                  - --mca
                  - btl
                  - self,tcp
                  - --mca
                  - coll
                  - ^ucc,hcoll
                  - --mca
                  - btl_tcp_if_include
                  - eth0
                  - --mca
                  - oob_tcp_if_include
                  - eth0
                  - -x
                  - LD_LIBRARY_PATH
                  - -x
                  - NCCL_DEBUG=INFO
                  # Force NCCL onto the NET/IB transport: disable NVLS (NVLink
                  # SHARP) and MNNVL (multi-node NVLink) so traffic crosses the
                  # IB fabric; NCCL_NET_PLUGIN=none selects the built-in IB
                  # verbs transport. NCCL_IB_HCA is set per rank below.
                  - -x
                  - NCCL_NVLS_ENABLE=0
                  - -x
                  - NCCL_MNNVL_ENABLE=0
                  - -x
                  - NCCL_NET_PLUGIN=none
                  - -x
                  - NCCL_SOCKET_IFNAME=eth0
                  - -x
                  - NCCL_IGNORE_DISABLED_P2P=1
                  # Per rank: require an IPoIB address and an RDMA device on each
                  # of net1..net4, then pin NCCL to exactly those VF HCAs.
                  - /bin/sh
                  - -c
                  - |
                    hcas=""
                    for i in 1 2 3 4; do
                      if ! ip -o -4 addr show dev "net$i" 2>/dev/null | grep -q inet; then
                        echo "AICR_PRECHECK_FAILED: rail attachment net$i has no IPoIB address on $(hostname); check the sriov-network-rail-$((i-1)) NetworkAttachmentDefinition and multus" >&2
                        exit 1
                      fi
                      hca=$(ls "/sys/class/net/net$i/device/infiniband" 2>/dev/null | head -n 1)
                      if [ -z "$hca" ]; then
                        echo "AICR_PRECHECK_FAILED: rail attachment net$i has no RDMA device on $(hostname)" >&2
                        exit 1
                      fi
                      hcas="$hcas,$hca"
                    done
                    export NCCL_IB_HCA="=${hcas#,}"
                    exec "$@"
                  - nccl-rank
                  - /usr/local/bin/${TEST_TYPE}_mpi
                  - -b
                  - ${MIN_MESSAGE_SIZE}
                  - -e
                  - ${MAX_MESSAGE_SIZE}
                  - -f
                  - "2"
                  - -g
                  - "1"
                  resources:
                    limits:
                      cpu: "2"
                      memory: 128Mi
                  volumeMounts:
                  - name: ssh-config
                    mountPath: /root/.ssh
                volumes:
                - name: ssh-config
                  emptyDir: {}
      successPolicy:
        operator: All
        targetReplicatedJobs:
        - launcher
