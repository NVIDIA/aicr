# NCCL all-reduce TrainingRuntime for GB200 on OKE, NET/IB-transport variant.
#
# Measures the InfiniBand east-west fabric (rdma0-3, served by the
# rdmaSharedDevicePlugin from the gb200-oke NicClusterPolicy) instead of
# NVLink: NVLS and MNNVL are forced off so NCCL falls back to its built-in
# IB transport over the nvidia.com/mlnxnics shared HCAs. NCCL_DEBUG stays
# INFO — verifyTransportFromLogs confirms the transport by parsing the
# "NCCL INFO Using network" banner from launcher logs.
#
# Composition: the gb200/oke runtime-nvls.yaml scaffold (pytorch image,
# mpirun ssh wiring) with the IMEX resource claims removed and the
# net-variant env from gb200/eks runtime-net.yaml, minus the EFA provider
# knobs. Node pods request nvidia.com/mlnxnics alongside GPUs.
#
# Cluster prerequisites: rdmaSharedDevicePlugin healthy (nvidia.com/mlnxnics
# allocatable on every GPU node — the gb200-oke leaves' NicClusterPolicy),
# and NVreg_GrdmaPciTopoCheckOverride=1 from the leaf's kernel-module-params
# ConfigMap (dma-buf attach over the IB fabric).

apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainingRuntime
metadata:
  name: nccl-all-reduce-runtime
  namespace: ${NAMESPACE}
  labels:
    trainer.kubeflow.org/framework: mpi
spec:
  mlPolicy:
    mpi:
      mpiImplementation: OpenMPI
      numProcPerNode: ${GPU_COUNT_PER_NODE}
      runLauncherAsNode: false
      sshAuthMountPath: /tmp/mpi-keys
  template:
    spec:
      network:
        enableDNSHostnames: true
        publishNotReadyAddresses: true
      replicatedJobs:
      - name: launcher
        replicas: 1
        template:
          spec:
            template:
              spec:
                tolerations:
                - operator: Exists
                initContainers:
                - name: fix-ssh-perms
                  image: nvcr.io/nvidia/pytorch:25.06-py3
                  command:
                  - /bin/sh
                  - -c
                  - |
                    mkdir -p /root/.ssh
                    cp /tmp/mpi-keys/id_rsa /root/.ssh/id_rsa
                    cp /tmp/mpi-keys/authorized_keys /root/.ssh/authorized_keys
                    chmod 700 /root/.ssh
                    chmod 600 /root/.ssh/id_rsa /root/.ssh/authorized_keys
                  volumeMounts:
                  - name: mpi-ssh-auth
                    mountPath: /tmp/mpi-keys
                    readOnly: true
                  - name: ssh-config
                    mountPath: /root/.ssh
                containers:
                - name: node
                  image: nvcr.io/nvidia/pytorch:25.06-py3
                  env:
                  - name: LD_LIBRARY_PATH
                    value: "/usr/local/nvidia/lib64:/usr/local/cuda/lib64"
                  command:
                  - /usr/local/mpi/bin/mpirun
                  args:
                  - -np
                  - "${GPU_COUNT}"
                  - --allow-run-as-root
                  - --mca
                  - plm_rsh_args
                  - -o StrictHostKeyChecking=no -o ConnectionAttempts=10
                  - --mca
                  - btl
                  - ^openib
                  - --mca
                  - btl_tcp_if_include
                  - eth0
                  - --mca
                  - oob_tcp_if_include
                  - eth0
                  - -x
                  - LD_LIBRARY_PATH
                  - -x
                  - NCCL_DEBUG=INFO
                  # Force NCCL onto the NET/IB transport: disable NVLS (NVLink
                  # SHARP) and MNNVL (multi-node NVLink) so traffic crosses the
                  # IB fabric; NCCL_NET_PLUGIN=none selects the built-in IB
                  # verbs transport over the shared mlx5 HCAs.
                  - -x
                  - NCCL_NVLS_ENABLE=0
                  - -x
                  - NCCL_MNNVL_ENABLE=0
                  - -x
                  - NCCL_NET_PLUGIN=none
                  - -x
                  - NCCL_SOCKET_IFNAME=eth0
                  - -x
                  - NCCL_IGNORE_DISABLED_P2P=1
                  - /usr/local/bin/${TEST_TYPE}_mpi
                  - -b
                  - ${MIN_MESSAGE_SIZE}
                  - -e
                  - ${MAX_MESSAGE_SIZE}
                  - -f
                  - "2"
                  - -g
                  - "1"
                  resources:
                    limits:
                      cpu: "2"
                      memory: 128Mi
                  volumeMounts:
                  - name: ssh-config
                    mountPath: /root/.ssh
                volumes:
                - name: ssh-config
                  emptyDir: {}
      - name: node
        template:
          spec:
            template:
              spec:
                tolerations:
                - operator: Exists
                initContainers:
                - name: fix-ssh-perms
                  image: nvcr.io/nvidia/pytorch:25.06-py3
                  command:
                  - /bin/sh
                  - -c
                  - |
                    apt-get update &&
                    apt-get install -y --no-install-recommends openssh-server &&
                    mkdir -p /var/run/sshd &&
                    chmod 0755 /var/run/sshd &&
                    mkdir -p /root/.ssh &&
                    cp /tmp/mpi-keys/authorized_keys /root/.ssh/authorized_keys &&
                    chmod 700 /root/.ssh &&
                    chmod 600 /root/.ssh/authorized_keys
                  volumeMounts:
                  - name: mpi-ssh-auth
                    mountPath: /tmp/mpi-keys
                    readOnly: true
                  - name: ssh-config
                    mountPath: /root/.ssh
                containers:
                - name: node
                  image: nvcr.io/nvidia/pytorch:25.06-py3
                  command: ["sh", "-c"]
                  args:
                  - |
                    apt-get update &&
                    apt-get install -y --no-install-recommends openssh-server &&
                    mkdir -p /var/run/sshd &&
                    chmod 0755 /var/run/sshd &&
                    mkdir -p /root/.ssh &&
                    cp /tmp/mpi-keys/* /root/.ssh/ &&
                    chmod 700 /root/.ssh &&
                    chmod 600 /root/.ssh/authorized_keys &&
                    /usr/sbin/sshd -De
                  resources:
                    limits:
                      nvidia.com/gpu: ${GPU_COUNT_PER_NODE}
                      nvidia.com/mlnxnics: "1"
                    requests:
                      nvidia.com/gpu: ${GPU_COUNT_PER_NODE}
                      nvidia.com/mlnxnics: "1"
                  securityContext:
                    capabilities:
                      add: ["IPC_LOCK"]
                  volumeMounts:
                  - name: ssh-config
                    mountPath: /root/.ssh
                  - name: dshm
                    mountPath: /dev/shm
                volumes:
                - name: ssh-config
                  emptyDir: {}
                - name: dshm
                  emptyDir:
                    medium: Memory
      successPolicy:
        operator: All
        targetReplicatedJobs:
        - launcher
