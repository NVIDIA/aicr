# Dynamo inference workload for performance benchmarking.
# Deploys a vLLM aggregated backend with a small model for smoke testing.
# Worker replicas scale to match available GPUs (1 GPU per replica).
# Frontend-to-worker traffic uses Dynamo's request plane default (TCP). The
# local vLLM ZMQ KV-event publisher feeds the worker runtime, which relays
# KV-cache events onto the NATS-backed Dynamo event plane.
#
# Worker GPU wiring is MODE-DISPATCHED (capability-driven, issue #1327): on
# nodes with usable full-GPU DRA the workers bind a DRA ResourceClaimTemplate
# (kai-scheduler rejects scalar GPU requests on nodes bearing raw node-local GPU ResourceSlices);
# elsewhere they carry device-plugin nvidia.com/gpu limits, which need no
# gpu.nvidia.com DeviceClass.
#
# Pod scheduling (nodeSelector / tolerations / GPU wiring) is injected
# programmatically from Go (see applyInferenceWorkerScheduling in
# inference_perf_constraint.go) so taint values with YAML-special characters
# cannot break the template.

apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: ${DEPLOYMENT_NAME}
  namespace: ${NAMESPACE}
spec:
  backendFramework: vllm
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.2.1
              env:
                - name: SERVED_MODEL_NAME
                  # Quoted so a scalar-looking model ID (e.g. a pure-numeric or
                  # boolean-like name that passes validateModelID) parses as a
                  # string, not int/bool/null, after ${MODEL} substitution.
                  value: "${MODEL}"
                # Routing strategy for the Dynamo frontend, substituted from
                # AICR_INFERENCE_PERF_ROUTER_MODE (default least-loaded, enum
                # validated by resolveRouterMode; issue #1374). Least-loaded
                # balances by each worker's active in-flight load rather than
                # KV-overlap, so a transiently-slow worker stops receiving its
                # full share. This mitigates the stochastic EKS H100
                # worker-stall / throughput degradation at the saturation knee
                # (see issue #1197): capacity-blind and KV-overlap routing both
                # let a backed-up worker accumulate requests, spiking TTFT p99
                # to 4-77s.
                - name: DYN_ROUTER_MODE
                  value: ${ROUTER_MODE}
                - name: HF_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: aicr-hf-token
                      key: token
                      optional: true
                - name: HUGGING_FACE_HUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: aicr-hf-token
                      key: token
                      optional: true
    - name: VllmDecodeWorker
      type: worker
      replicas: ${GPU_COUNT}
      sharedMemorySize: 2Gi
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.2.1
              workingDir: /workspace/examples/backends/vllm
              # GKE's managed device plugin (the gke-default gpuStack value)
              # mounts the node's driver tree at /usr/local/nvidia via its
              # device-plugin Allocate response WITHOUT touching the container
              # environment, so libcuda.so.1 is invisible to the dynamic
              # loader and vLLM dies with "RuntimeError: Failed to infer
              # device type" (observed live: gke-default qualification, every
              # worker in CrashLoopBackOff; A/B on the worker showed
              # LD_LIBRARY_PATH=/usr/local/nvidia/lib64 alone flips torch CUDA
              # to available — the mount is runtime-injected, only the env is
              # missing). A pod-level LD_LIBRARY_PATH env cannot fix this: it
              # would CLOBBER the image's own LD_LIBRARY_PATH (nixl/ucx/cuda
              # entries), so the command wraps in a shell that APPENDS the
              # path instead. The ${VAR:+} guard avoids a leading empty ld.so
              # entry (= CWD) when the image ships no LD_LIBRARY_PATH, and
              # appending keeps image entries in precedence. Under the GPU
              # Operator's toolkit flow (EKS/AKS/operator-managed gpuStack)
              # /usr/local/nvidia/lib64 does not exist and the append is a
              # harmless no-op — no platform branching needed. Mirrors the
              # secure-accelerator-access probe prologue and the NCCL GKE
              # runtime template (testdata/h100/gke/runtime.yaml).
              command:
                - /bin/bash
                - -c
                - export LD_LIBRARY_PATH="${LD_LIBRARY_PATH:+${LD_LIBRARY_PATH}:}/usr/local/nvidia/lib64"; exec python3 -m dynamo.vllm "$@"
                - dynamo.vllm
              args:
                - --model
                - "${MODEL}"
                - --kv-events-config
                - '{"enable_kv_cache_events":true,"publisher":"zmq","endpoint":"tcp://*:5557"}'
              env:
                - name: HF_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: aicr-hf-token
                      key: token
                      optional: true
                - name: HUGGING_FACE_HUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: aicr-hf-token
                      key: token
                      optional: true
