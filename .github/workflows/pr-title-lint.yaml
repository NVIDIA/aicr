# The repo merges with squash_merge_commit_title: PR_TITLE and
# squash_merge_commit_message: BLANK, so the PR title plus trailers is the
# entire commit that lands on main -- branch commit bodies are discarded.
# The title is therefore the only durable record of a change in `git log`,
# and it cannot be corrected after merge. This gate is the one point where
# a malformed title can be caught.
#
# Format is enforced; length is advisory. See the job comments for why.

name: PR Title Lint

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  title:
    name: Check PR Title
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target'
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - name: Validate Conventional Commit Format
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            // Types observed across merged history: fix, chore, docs, feat,
            // ci, test, refactor. build/perf/style/revert are permitted as
            // standard Conventional Commits types not yet used here.
            const TYPES = [
              'build', 'chore', 'ci', 'docs', 'feat', 'fix',
              'perf', 'refactor', 'revert', 'style', 'test',
            ];

            // type(scope)!: subject  -- scope and the breaking-change "!"
            // are both optional; subject must be non-empty.
            const PATTERN = new RegExp(
              `^(${TYPES.join('|')})(\\([a-z0-9][a-z0-9._/-]*\\))?(!)?: .+$`
            );

            // Advisory only. CONTRIBUTING.md and AGENTS.md ask for titles
            // under this length, but ~12% of merged titles exceed it and
            // renovate/dependabot titles embed pseudo-versions that cannot
            // be shortened. Failing on length would break dependency
            // automation for a style preference, so this warns instead.
            const SOFT_MAX = 70;

            const title = context.payload.pull_request.title;

            if (!PATTERN.test(title)) {
              core.summary.addHeading('PR title does not follow Conventional Commits', 3);
              core.summary.addRaw(
                'The repo squash-merges with `squash_merge_commit_message: BLANK`, so this ' +
                'title becomes the entire commit message on `main` and cannot be fixed after merge.\n\n'
              );
              core.summary.addRaw(`Received: \`${title}\`\n\n`);
              core.summary.addRaw(`Expected: \`type(scope): subject\` or \`type: subject\`\n\n`);
              core.summary.addRaw(`Valid types: ${TYPES.map((t) => `\`${t}\``).join(', ')}\n\n`);
              core.summary.addRaw('Examples: `fix(bundler): reject conflicting gpu-operator variants`, `docs: add ADR-019`\n');
              await core.summary.write();
              core.setFailed(`PR title does not match Conventional Commits format: "${title}"`);
              return;
            }

            if (title.length > SOFT_MAX) {
              core.warning(
                `PR title is ${title.length} characters; CONTRIBUTING.md asks for under ${SOFT_MAX}. ` +
                'Not blocking, but this is the whole commit message on `main`.'
              );
            }

            core.info(`PR title OK (${title.length} chars): ${title}`);
