# Validates the gpu-operator slice of the Kind recipe with no GPU present.
#
# Every other lane that runs gpu-operator holds a physical GPU: the two
# gpu-h100-* callers and uat-kind lease the single self-hosted
# linux-amd64-gpu-h100-latest-1 runner, and gpu-smoke-test leases the L40G.
# This lane runs on a GitHub-hosted CPU runner. GPU capacity comes from Mokka
# (github.com/NVIDIA/k8s-test-infra), whose node image registers the nvidia
# containerd runtime handler and whose nvml-mock DaemonSet stages a mock
# libnvidia-ml.so the real device plugin, GFD, DCGM exporter and
# operator-validator read, plus the mock IMEX surface the DRA driver's
# compute-domain kubelet plugin reads.
#
# What it proves: the recipe's gpu-operator and DRA driver values deploy,
# every gpu-operator operand and the DRA kubelet plugin reach Ready, and the
# advertised nvidia.com/gpu capacity is real to the scheduler.
#
# What it does NOT prove, and no mocked lane can: CUDA execution, NCCL,
# GPUDirect/RDMA data paths, driver and firmware lifecycle, MIG, IMEX daemons
# or ComputeDomain allocation, or anything timing- or throughput-sensitive.
# The cuda validator workload and the DRA feature gates that need a 570+
# driver are disabled by the bundle overrides below for exactly this reason.
# Those keep needing the hardware lanes, which this lane does not replace.
#
# To reproduce it outside CI, the steps below are the whole procedure:
#   1. Create a Kind cluster from the Mokka node image
#      (testing.mokka_kind_node_image in .settings.yaml) with at least one
#      worker. A stock kindest/node has no nvidia containerd runtime handler,
#      which every GPU Operator operand requests, so its operands cannot start.
#      The recipe keeps GPU operands off the control plane.
#   2. Install the nvml-mock chart as "Install Mokka nvml-mock" does: chart and
#      image by the digests in testing.component_test, and
#      imex.mockChannels.enabled=true, which the DRA kubelet plugin needs.
#   3. Generate the Kind recipe and bundle it with the overrides in "Generate
#      the Kind recipe and bundle it for Mokka". Without them the bundle points
#      every operand at the host driver root that nvkind provides and a Mokka
#      node does not have.
#   4. Run install.sh in the bundle's NFD, gpu-operator and DRA driver
#      folders, in that order, as "Deploy NFD, gpu-operator and the DRA
#      driver from the bundle" does. The lane installs only those three, not
#      the whole bundle.
name: GPU Operator on Mokka (GPU-free)

on:
  pull_request:
    branches:
      - main
    paths:
      # The overlays `aicr recipe --service kind --accelerator h100
      # --intent training` applies (metadata.appliedOverlays), and the
      # components the lane deploys from the bundle.
      - 'recipes/overlays/base.yaml'
      - 'recipes/overlays/monitoring-hpa.yaml'
      - 'recipes/overlays/h100-any.yaml'
      - 'recipes/overlays/kind.yaml'
      - 'recipes/overlays/h100-kind-training.yaml'
      - 'recipes/components/nfd/**'
      - 'recipes/components/gpu-operator/**'
      - 'recipes/components/nvidia-dra-driver-gpu/**'
      - 'recipes/registry.yaml'
      - 'recipes/data.go'
      - 'pkg/recipe/**'
      - 'pkg/bundler/**'
      - 'pkg/client/**'
      - 'pkg/cli/**'
      - 'cmd/aicr/**'
      - 'go.mod'
      - 'go.sum'
      - '.go-version'
      - '.settings.yaml'
      - '.github/actions/load-versions/**'
      - '.github/actions/setup-build-tools/**'
      - '.github/workflows/gpu-operator-mokka-test.yaml'
      - '!**.md'
      - '!**.mdx'
  workflow_dispatch: {}
  schedule:
    # Daily, so drift in the upstream chart or the Mokka image surfaces here
    # rather than on the leased hardware lanes.
    - cron: '30 3 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gpu-operator-mokka:
    name: gpu-operator on mocked GPUs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLUSTER_NAME: aicr-mokka
      GPU_PROFILE: h100
      GPU_COUNT: '8'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Load pinned versions
        id: versions
        uses: ./.github/actions/load-versions

      - name: Set up build tools
        uses: ./.github/actions/setup-build-tools
        with:
          install_kind: 'true'
          kind_version: ${{ steps.versions.outputs.kind }}
          install_helm: 'true'
          helm_version: ${{ steps.versions.outputs.helm }}
          install_kubectl: 'true'
          kubectl_version: ${{ steps.versions.outputs.kubectl }}

      - name: Verify the toolchain matches the .settings.yaml pins
        env:
          WANT_KIND: ${{ steps.versions.outputs.kind }}
          WANT_HELM: ${{ steps.versions.outputs.helm }}
          WANT_KUBECTL: ${{ steps.versions.outputs.kubectl }}
        run: |
          set -euo pipefail
          # setup-build-tools replaces a runner helm that differs from the pin,
          # but keeps any kind or kubectl already at /usr/local/bin without
          # comparing versions. ubuntu-latest ships kind there, so a runner
          # image update would otherwise change the toolchain under the lane.
          fail=0
          check() {
            local name="$1" want="${2#v}" got="${3#v}"
            echo "$name: installed ${got:-<unreadable>}, pinned $want"
            if [ "$got" != "$want" ]; then
              echo "::error::$name ${got:-<unreadable>} does not match the .settings.yaml pin $want"
              fail=1
            fi
          }
          check kind "$WANT_KIND" "$(kind version | awk '{print $2}')"
          check helm "$WANT_HELM" "$(helm version --template '{{.Version}}')"
          check kubectl "$WANT_KUBECTL" "$(kubectl version --client -o json | jq -r .clientVersion.gitVersion)"
          [ "$fail" -eq 0 ]

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: .go-version
          cache: true

      - name: Resolve Mokka pins from .settings.yaml
        id: mokka
        run: |
          set -euo pipefail
          # Node image: ghcr.io/nvidia/mokka-kind-node, pinned by digest.
          node_image=$(yq -r '.testing.mokka_kind_node_image' .settings.yaml)
          # Chart and image install by digest; the versions only label them.
          chart=$(yq -r '.testing.component_test.nvml_mock_chart' .settings.yaml)
          chart_version=$(yq -r '.testing.component_test.nvml_mock_chart_version' .settings.yaml)
          chart_digest=$(yq -r '.testing.component_test.nvml_mock_chart_digest' .settings.yaml)
          # The chart's image.tag defaults to a floating `latest`, so the image
          # is pinned separately or the lane's cluster changes under it.
          image=$(yq -r '.testing.component_test.nvml_mock_image' .settings.yaml)
          image_version=$(yq -r '.testing.component_test.nvml_mock_version' .settings.yaml)
          image_digest=$(yq -r '.testing.component_test.nvml_mock_image_digest' .settings.yaml)
          for v in node_image chart chart_version chart_digest image image_version image_digest; do
            if [ -z "${!v}" ] || [ "${!v}" = "null" ]; then
              echo "::error::.settings.yaml is missing $v" && exit 1
            fi
          done
          for v in chart_digest image_digest; do
            if ! [[ "${!v}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::.settings.yaml $v is not a sha256 digest: ${!v}" && exit 1
            fi
          done
          {
            echo "node_image=$node_image"
            echo "chart=$chart"
            echo "chart_version=$chart_version"
            echo "chart_digest=$chart_digest"
            echo "image=$image"
            echo "image_version=$image_version"
            echo "image_digest=$image_digest"
          } >> "$GITHUB_OUTPUT"

      - name: Build aicr
        run: go build -o ./bin/aicr ./cmd/aicr

      - name: Create Kind cluster on the Mokka node image
        run: |
          set -euo pipefail
          cat > /tmp/kind-mokka.yaml <<'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
            - role: control-plane
            - role: worker
          EOF
          kind create cluster --name "$CLUSTER_NAME" \
            --image "${{ steps.mokka.outputs.node_image }}" \
            --config /tmp/kind-mokka.yaml --wait 180s

      - name: Assert the node image provides the nvidia runtime handler
        run: |
          set -euo pipefail
          # The reason a stock kindest/node cannot host gpu-operator: its
          # containerd knows only runc and test-handler, so every operand
          # (all set runtimeClassName: nvidia) fails to create a sandbox.
          missing=0
          for node in $(kubectl get nodes -o jsonpath='{.items[*].metadata.name}'); do
            if ! docker exec "$node" grep -q 'containerd.runtimes.nvidia' /etc/containerd/config.toml; then
              echo "::error::node $node has no nvidia containerd runtime handler"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Install Mokka nvml-mock
        run: |
          set -euo pipefail
          # imex.mockChannels is off in the chart by default. The bundle
          # points the DRA driver's altProcDevices at the proc-devices file it
          # stages, a hostPath of type File, so without it the kubelet plugin
          # stays in Init on a failed mount.
          #
          # The chart is pulled by digest with no --version: helm would
          # re-resolve the tag and fail the lane on an upstream re-tag. The
          # chart renders the image as "<repository>:<tag>", so a tag of
          # "<version>@<digest>" yields a reference the runtime pulls by digest.
          echo "nvml-mock chart ${{ steps.mokka.outputs.chart_version }} (${{ steps.mokka.outputs.chart_digest }})," \
            "image ${{ steps.mokka.outputs.image }}:${{ steps.mokka.outputs.image_version }}@${{ steps.mokka.outputs.image_digest }}"
          helm install nvml-mock "oci://${{ steps.mokka.outputs.chart }}@${{ steps.mokka.outputs.chart_digest }}" \
            --namespace mokka --create-namespace \
            --set gpu.profile="$GPU_PROFILE" \
            --set gpu.count="$GPU_COUNT" \
            --set image.repository="${{ steps.mokka.outputs.image }}" \
            --set image.tag="${{ steps.mokka.outputs.image_version }}@${{ steps.mokka.outputs.image_digest }}" \
            --set imex.mockChannels.enabled=true \
            --wait --timeout 300s
          kubectl rollout status daemonset/nvml-mock -n mokka --timeout=300s

      - name: Generate the Kind recipe and bundle it for Mokka
        run: |
          set -euo pipefail
          # The Kind recipe targets nvkind: a driver installed on the host, read
          # by every operand from the host root. Mokka stages a mock driver
          # userspace from a DaemonSet instead, with no host driver, no kernel
          # module and no GPU, so each operand is pointed at that staged root.
          #
          # These are bundle-time overrides, not a recipe profile. A profile
          # value must carry a constraint that tells it apart from its siblings
          # (ADR-015), and a Kind node carries no GPU-identifying reading until
          # NFD and the operands run, after the point a constraint is
          # evaluated, so a Kind profile could not be checked against the
          # cluster.
          #
          # COUPLED to the nvml-mock pin in .settings.yaml
          # (testing.component_test), which publishes the tree at
          # /var/lib/nvml-mock/driver. A later Mokka bind-mounts it onto
          # /run/nvidia/driver instead, at which point the three
          # NVIDIA_DRIVER_ROOT entries should be dropped rather than
          # repointed. Revisit them with any bump of that pin.
          root=/var/lib/nvml-mock/driver
          env_json() { printf '[{"name":"%s","value":"%s"}]' "$1" "$2"; }
          overrides=(
            --set-json "gpuoperator:devicePlugin.env=$(env_json NVIDIA_DRIVER_ROOT "$root")"
            --set-json "gpuoperator:gfd.env=$(env_json NVIDIA_DRIVER_ROOT "$root")"
            --set-json "gpuoperator:dcgmExporter.env=$(env_json NVIDIA_DRIVER_ROOT "$root")"
            # No kernel module exists to load, so symlink creation aborts
            # driver-validation with "failed to load module nvidia: chroot:
            # can't execute '/sbin/modprobe'". gpu-operator names this exact
            # opt-out in that error.
            --set-json "gpuoperator:validator.driver.env=$(env_json DISABLE_DEV_CHAR_SYMLINK_CREATION true)"
            # Mokka simulates the NVML contract, not CUDA execution. Left on,
            # the validator's vectorAdd fails with "CUDA driver version is
            # insufficient for CUDA runtime version" and holds
            # operator-validator at Init:2/4. This is the boundary of what a
            # mocked lane can claim: scheduling and discovery are exercised,
            # kernel execution is not.
            --set-json "gpuoperator:validator.cuda.env=$(env_json WITH_WORKLOAD false)"
            --set "dradriver:nvidiaDriverRoot=$root"
            # computeDomains stays enabled, as everywhere in the catalog. Its
            # kubelet plugin reads the nvidia-caps-imex-channels major from
            # /proc/devices, which has no such entry without a kernel module,
            # and crash-loops on "error parsing '/proc/devices'". nvml-mock
            # stages a substitute there when installed with
            # imex.mockChannels.enabled=true.
            --set "dradriver:altProcDevices=/var/lib/nvml-mock/imex/proc-devices"
            # IMEXDaemonsWithDNSNames refuses to start below driver 570.158.01,
            # and every nvml-mock GPU profile except gb200 reports an older one
            # (h100: 550.163.01). ComputeDomainCliques refuses to start without
            # it, so both go off.
            --set-json 'dradriver:featureGates={"ComputeDomainCliques":false,"IMEXDaemonsWithDNSNames":false}'
          )
          ./bin/aicr recipe --service kind --accelerator "$GPU_PROFILE" --intent training \
            --output /tmp/recipe.yaml
          ./bin/aicr bundle --recipe /tmp/recipe.yaml --output /tmp/bundle "${overrides[@]}"
          # Fail loudly if the overrides did not take: the whole lane is
          # meaningless if the rendered values still point at the host root.
          grep -q '/var/lib/nvml-mock/driver' /tmp/bundle/*gpu-operator/values.yaml
          grep -q 'altProcDevices: /var/lib/nvml-mock/imex/proc-devices' /tmp/bundle/*nvidia-dra-driver-gpu/values.yaml

      - name: Deploy NFD, gpu-operator and the DRA driver from the bundle
        run: |
          set -euo pipefail
          # NFD first: gpu-operator gates its operands on the labels NFD
          # derives from the feature file nvml-mock stages. Without it the
          # ClusterPolicy reports ready with zero operands and zero GPUs. The
          # DRA kubelet plugin's node affinity reads the same NFD labels.
          nfd_dir=$(find /tmp/bundle -maxdepth 1 -type d -name '*-nfd' | head -1)
          gpu_dir=$(find /tmp/bundle -maxdepth 1 -type d -name '*-gpu-operator' | head -1)
          dra_dir=$(find /tmp/bundle -maxdepth 1 -type d -name '*-nvidia-dra-driver-gpu' | head -1)
          [ -n "$nfd_dir" ] && [ -n "$gpu_dir" ] && [ -n "$dra_dir" ]
          ( cd "$nfd_dir" && bash install.sh )
          ( cd "$gpu_dir" && bash install.sh )
          ( cd "$dra_dir" && bash install.sh )

      - name: Wait for the GPU stack to converge
        run: |
          set -euo pipefail
          # Not `kubectl wait --all`: that matches only the pods that exist when
          # it is invoked, and at this point the operator has created none of
          # its operands yet, so it returns satisfied against the controller
          # alone and the assertions below race the stack.
          #
          # The recipe keeps operands off the control plane
          # (daemonsets.tolerations: [] in recipes/overlays/kind.yaml), so the
          # GPU nodes are exactly the workers. Converged means: every worker
          # advertises the mocked capacity, and nothing in the namespace is
          # still settling.
          workers=$(kubectl get nodes \
            -l '!node-role.kubernetes.io/control-plane' \
            -o jsonpath='{.items[*].metadata.name}' | wc -w | tr -d ' ')
          [ "$workers" -gt 0 ] || { echo "::error::no worker nodes"; exit 1; }
          echo "expecting $workers worker(s) at nvidia.com/gpu=$GPU_COUNT"

          # Named, not counted. Counting only the pods that happen to exist
          # lets an operand the operator never created contribute zero to the
          # unready tally, so the lane would pass with the device plugin and
          # GFD up and no validator or exporter at all. Each of these must
          # exist with a non-zero desired count and all of it Ready.
          REQUIRED_OPERANDS="nvidia-device-plugin-daemonset gpu-feature-discovery nvidia-dcgm-exporter nvidia-operator-validator"

          operands_ready() {
            local missing="" ds desired ready
            for ds in $REQUIRED_OPERANDS; do
              desired=$(kubectl get ds "$ds" -n gpu-operator \
                -o jsonpath='{.status.desiredNumberScheduled}' 2>/dev/null || true)
              ready=$(kubectl get ds "$ds" -n gpu-operator \
                -o jsonpath='{.status.numberReady}' 2>/dev/null || true)
              if [ -z "$desired" ]; then
                missing="$missing $ds(absent)"
              elif [ "$desired" -eq 0 ]; then
                missing="$missing $ds(desired=0)"
              elif [ "${ready:-0}" != "$desired" ]; then
                missing="$missing $ds(${ready:-0}/$desired)"
              fi
            done
            OPERAND_GAP="$missing"
            [ -z "$missing" ]
          }

          deadline=$((SECONDS + 600))
          while [ "$SECONDS" -lt "$deadline" ]; do
            # A failed read is "not converged yet", not the end of the wait:
            # under set -e it would skip the diagnostics below. Unread values
            # compare as strings so they never equal the converged state.
            ready=$(kubectl get nodes -l '!node-role.kubernetes.io/control-plane' -o json \
              | jq --arg n "$GPU_COUNT" '[.items[] | select((.status.allocatable["nvidia.com/gpu"] // "0") == $n)] | length' \
              || true)
            # Readiness, not phase. A pod sitting Running with 0/1 containers
            # ready passes a phase check while its probe is still failing, so
            # the assertions below would run against a half-converged stack.
            # dcgm-exporter alone has initialDelaySeconds: 45.
            settling=$(kubectl get pods -n gpu-operator -o json 2>/dev/null | jq '
              [ .items[]
                | select(.status.phase != "Succeeded")
                | select( ((.status.containerStatuses // []) | length) == 0
                          or ((.status.containerStatuses // []) | map(.ready) | index(false) != null) )
              ] | length' || true)
            ready=${ready:-unread} settling=${settling:-unread}
            OPERAND_GAP=""
            if operands_ready; then operands="all"; else operands="gap:$OPERAND_GAP"; fi
            echo "  workers_at_capacity=$ready/$workers pods_settling=$settling operands=$operands"
            if [ "$ready" = "$workers" ] && [ "$settling" = "0" ] && [ "$operands" = "all" ]; then
              echo "converged"; exit 0
            fi
            sleep 15
          done
          echo "::error::GPU stack did not converge within 600s (operand gap:${OPERAND_GAP:-none})"
          kubectl get ds -n gpu-operator
          kubectl get pods -n gpu-operator -o wide
          exit 1

      - name: Wait for the DRA driver to converge
        run: |
          set -euo pipefail
          # The controller alone is not convergence: without the mock IMEX
          # surface it stays Ready while every kubelet plugin crash-loops on
          # "error parsing '/proc/devices'". Same four conditions as
          # recipes/checks/nvidia-dra-driver-gpu/health-check.yaml, so a
          # DaemonSet that schedules nowhere or is mid-rollout does not pass.
          ns=nvidia-dra-driver
          ds=nvidia-dra-driver-gpu-kubelet-plugin
          controller=nvidia-dra-driver-gpu-controller
          deadline=$((SECONDS + 300))
          while [ "$SECONDS" -lt "$deadline" ]; do
            state=$(kubectl get ds "$ds" -n "$ns" -o json 2>/dev/null | jq -r '
              [ (.status.desiredNumberScheduled // 0), (.status.numberReady // 0),
                (.status.updatedNumberScheduled // 0),
                (if (.status.observedGeneration // 0) == .metadata.generation then 1 else 0 end)
              ] | map(tostring) | join(" ")' || true)
            read -r desired ready updated current <<<"${state:-0 0 0 0}"
            available=$(kubectl get deploy "$controller" -n "$ns" \
              -o jsonpath='{.status.availableReplicas}' 2>/dev/null || true)
            echo "  kubelet-plugin ready=$ready/$desired updated=$updated current_gen=$current controller_available=${available:-0}"
            if [ "$desired" -gt 0 ] && [ "$ready" = "$desired" ] && [ "$updated" = "$desired" ] \
              && [ "$current" = "1" ] && [ "${available:-0}" -ge 1 ]; then
              echo "converged"; exit 0
            fi
            sleep 10
          done
          echo "::error::DRA driver did not converge within 300s"
          kubectl get ds,deploy,pods -n "$ns" -o wide
          kubectl logs -n "$ns" -l nvidia-dra-driver-gpu-component=kubelet-plugin \
            -c compute-domains --tail=20 || true
          exit 1

      - name: Assert the mocked GPUs are allocatable
        run: |
          set -euo pipefail
          kubectl get pods -n gpu-operator -o wide
          # Assert per GPU node, and assert that GPU nodes exist at all: a
          # cluster where the device plugin never landed has zero of them and
          # would vacuously satisfy a loop over an empty set.
          gpu_nodes=$(kubectl get nodes -o json \
            | jq -r '.items[] | select(.status.allocatable["nvidia.com/gpu"] != null) | .metadata.name')
          [ -n "$gpu_nodes" ] || { echo "::error::no node advertises nvidia.com/gpu"; exit 1; }
          fail=0
          for node in $gpu_nodes; do
            got=$(kubectl get node "$node" -o jsonpath='{.status.allocatable.nvidia\.com/gpu}')
            echo "$node: nvidia.com/gpu=$got (expected $GPU_COUNT)"
            [ "$got" = "$GPU_COUNT" ] || { echo "::error::$node advertises $got"; fail=1; }
          done
          [ "$fail" -eq 0 ]

      - name: Assert GFD derived the accelerator identity from mocked NVML
        run: |
          set -euo pipefail
          # Read from a node that actually runs GFD. The control plane carries
          # no operands here, so indexing items[0] blindly reads an empty label
          # and turns this into a check that can only fail by accident.
          node=$(kubectl get nodes -o json \
            | jq -r '[.items[] | select(.status.allocatable["nvidia.com/gpu"] != null)][0].metadata.name')
          product=$(kubectl get node "$node" -o jsonpath='{.metadata.labels.nvidia\.com/gpu\.product}')
          count=$(kubectl get node "$node" -o jsonpath='{.metadata.labels.nvidia\.com/gpu\.count}')
          echo "$node: gpu.product=${product:-<empty>} gpu.count=${count:-<empty>}"
          case "$product" in
            *H100*) echo "GFD read the mocked H100 identity through NVML" ;;
            *) echo "::error::expected an H100 product label, got '${product:-<empty>}'" && exit 1 ;;
          esac
          [ "$count" = "$GPU_COUNT" ] || { echo "::error::gpu.count=${count:-<empty>}, expected $GPU_COUNT"; exit 1; }

      - name: Negative control - capacity must be enforced, not cosmetic
        run: |
          set -euo pipefail
          # Labels and allocatable numbers can both be present while the
          # scheduler ignores them. Request one more GPU than any node has and
          # require the scheduler to refuse it for the right reason.
          over=$((GPU_COUNT + 1))
          kubectl apply -f - <<EOF
          apiVersion: v1
          kind: Pod
          metadata:
            name: gpu-over-capacity
          spec:
            restartPolicy: Never
            tolerations: [{operator: Exists}]
            containers:
              - name: c
                image: busybox:1.36
                command: ["sh","-c","echo should-not-run"]
                resources:
                  limits:
                    nvidia.com/gpu: $over
          EOF
          # Wait on the scheduler's DECISION, not on Pending. Every pod is
          # Pending the instant it is created, before the scheduler has looked
          # at it, so breaking on that races the decision and then reads events
          # that do not exist yet. PodScheduled=False with reason Unschedulable
          # is written by the scheduler itself, and carries the reason in its
          # message, so it is both the right synchronisation point and the
          # evidence.
          scheduled_reason() {
            kubectl get pod gpu-over-capacity \
              -o jsonpath='{.status.conditions[?(@.type=="PodScheduled")].reason}' 2>/dev/null || true
          }
          for _ in $(seq 1 24); do
            [ "$(scheduled_reason)" = "Unschedulable" ] && break
            sleep 5
          done

          reason=$(scheduled_reason)
          if [ "$reason" != "Unschedulable" ]; then
            phase=$(kubectl get pod gpu-over-capacity -o jsonpath='{.status.phase}' 2>/dev/null || true)
            echo "::error::pod requesting $over GPUs was not rejected (PodScheduled reason='${reason:-none}', phase='${phase:-none}')"
            kubectl describe pod gpu-over-capacity | tail -20
            exit 1
          fi

          # Rejected, but the cause must be GPU capacity. Rejection for an
          # unrelated reason would satisfy a reason-only check while proving
          # nothing about the mocked devices.
          msg=$(kubectl get pod gpu-over-capacity \
            -o jsonpath='{.status.conditions[?(@.type=="PodScheduled")].message}')
          echo "  scheduler said: $msg"
          case "$msg" in
            *"Insufficient nvidia.com/gpu"*) echo "  capacity is enforced by the scheduler" ;;
            *) echo "::error::rejected, but not for insufficient GPU capacity"; exit 1 ;;
          esac
          kubectl delete pod gpu-over-capacity --ignore-not-found

      - name: Collect debug artifacts
        if: failure()
        run: |
          mkdir -p /tmp/debug
          kubectl get pods -A -o wide > /tmp/debug/pods.txt 2>&1 || true
          kubectl get nodes -o yaml > /tmp/debug/nodes.yaml 2>&1 || true
          kubectl describe clusterpolicy > /tmp/debug/clusterpolicy.txt 2>&1 || true
          kubectl logs -n gpu-operator --all-containers --tail=200 -l app=nvidia-operator-validator \
            > /tmp/debug/operator-validator.log 2>&1 || true
          kubectl logs -n mokka --all-containers --tail=200 -l app.kubernetes.io/name=nvml-mock \
            > /tmp/debug/nvml-mock.log 2>&1 || true
          kubectl logs -n nvidia-dra-driver --all-containers --tail=200 \
            -l nvidia-dra-driver-gpu-component=kubelet-plugin \
            > /tmp/debug/dra-kubelet-plugin.log 2>&1 || true

      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: gpu-operator-mokka-debug
          path: /tmp/debug
          retention-days: 7

      - name: Tear down
        if: always()
        run: kind delete cluster --name "$CLUSTER_NAME" || true
