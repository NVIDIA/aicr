name: Qualification

on:
  workflow_call:
    inputs:
      coverage_report:
        description: 'Whether to generate coverage report'
        type: boolean
        required: false
        default: false
      privileged_ci:
        description: 'Whether jobs that require elevated permissions should run'
        type: boolean
        required: false
        default: true
      ref:
        description: 'Git ref to checkout (defaults to triggering ref)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:

  test:
    name: Race + coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [recipe, a, b]
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Load versions
        id: versions
        uses: ./.github/actions/load-versions

      - name: Run Race + coverage
        uses: ./.github/actions/go-test
        with:
          task: shard
          shard: ${{ matrix.shard }}
          go_version: ${{ steps.versions.outputs.go }}
          setup_envtest_version: ${{ steps.versions.outputs.setup_envtest }}
          setup_envtest_sha256: ${{ steps.versions.outputs.setup_envtest_sha256_linux_amd64 }}
          helm_version: ${{ steps.versions.outputs.helm }}
          apidiff_version: ${{ steps.versions.outputs.apidiff }}
          oasdiff_version: ${{ steps.versions.outputs.oasdiff }}
          oasdiff_sha256: ${{ steps.versions.outputs.oasdiff_sha256_linux_amd64 }}
          privileged_ci: ${{ inputs.privileged_ci }}

  shell:
    name: Shell and tool pins
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Load versions
        id: versions
        uses: ./.github/actions/load-versions

      - name: Run Shell and tool pins
        uses: ./.github/actions/go-test
        with:
          task: shell
          go_version: ${{ steps.versions.outputs.go }}
          setup_envtest_version: ${{ steps.versions.outputs.setup_envtest }}
          setup_envtest_sha256: ${{ steps.versions.outputs.setup_envtest_sha256_linux_amd64 }}
          helm_version: ${{ steps.versions.outputs.helm }}
          apidiff_version: ${{ steps.versions.outputs.apidiff }}
          oasdiff_version: ${{ steps.versions.outputs.oasdiff }}
          oasdiff_sha256: ${{ steps.versions.outputs.oasdiff_sha256_linux_amd64 }}
          privileged_ci: ${{ inputs.privileged_ci }}

  compatibility:
    name: Compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Load versions
        id: versions
        uses: ./.github/actions/load-versions

      - name: Run Compatibility
        uses: ./.github/actions/go-test
        with:
          task: compatibility
          go_version: ${{ steps.versions.outputs.go }}
          setup_envtest_version: ${{ steps.versions.outputs.setup_envtest }}
          setup_envtest_sha256: ${{ steps.versions.outputs.setup_envtest_sha256_linux_amd64 }}
          helm_version: ${{ steps.versions.outputs.helm }}
          apidiff_version: ${{ steps.versions.outputs.apidiff }}
          oasdiff_version: ${{ steps.versions.outputs.oasdiff }}
          oasdiff_sha256: ${{ steps.versions.outputs.oasdiff_sha256_linux_amd64 }}
          privileged_ci: ${{ inputs.privileged_ci }}

      - name: Check Upgrade Record Coverage
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          AICR_UPGRADE_BASE_REF: origin/${{ github.base_ref }}
        run: ./tools/check-upgrade-records

  coverage:
    name: Test
    needs: [test]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require all shards to succeed
        env:
          SHARD_RESULT: ${{ needs.test.result }}
        run: test "$SHARD_RESULT" = success

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Load versions
        id: versions
        uses: ./.github/actions/load-versions

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ steps.versions.outputs.go }}
          cache: false

      - name: Resolve Go cache paths
        id: gocache
        run: |
          echo "modcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "buildcache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"

      - name: Restore Go modules and build output
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ${{ steps.gocache.outputs.modcache }}
            ${{ steps.gocache.outputs.buildcache }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.go }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.go }}-

      - name: Download recipe shard
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: test-shard-recipe
          path: ${{ runner.temp }}/test-results/recipe

      - name: Download a shard
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: test-shard-a
          path: ${{ runner.temp }}/test-results/a

      - name: Download b shard
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: test-shard-b
          path: ${{ runner.temp }}/test-results/b

      - name: Verify package manifest and merge coverage
        env:
          TEST_RESULTS: ${{ runner.temp }}/test-results
        run: |
          set -euo pipefail
          make --no-print-directory test-packages > "$RUNNER_TEMP/all-packages.txt"
          python3 tools/ci-tests/suite.py merge "$RUNNER_TEMP/all-packages.txt" "$TEST_RESULTS" coverage.out

      - name: Enforce merged coverage threshold
        if: inputs.coverage_report
        uses: ./.github/actions/go-coverage
        with:
          coverage_file: ./coverage.out
          threshold: ${{ steps.versions.outputs.coverage_threshold }}

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false

      - name: Load versions
        id: versions
        uses: ./.github/actions/load-versions

      - name: Run Linters
        uses: ./.github/actions/go-lint
        with:
          go_version: ${{ steps.versions.outputs.go }}
          golangci_lint_version: ${{ steps.versions.outputs.golangci_lint }}
          addlicense_version: ${{ steps.versions.outputs.addlicense }}
          addlicense_sha256: ${{ steps.versions.outputs.addlicense_sha256_linux_amd64 }}
          lint_timeout: ${{ steps.versions.outputs.lint_timeout }}
          privileged_ci: ${{ inputs.privileged_ci }}

  cli-e2e:
    name: CLI E2E
    if: inputs.privileged_ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false

      - name: Load versions
        id: versions
        uses: ./.github/actions/load-versions

      - name: Run CLI E2E Tests
        uses: ./.github/actions/cli-e2e
        with:
          go_version: ${{ steps.versions.outputs.go }}
          goreleaser_version: ${{ steps.versions.outputs.goreleaser }}
          chainsaw_version: ${{ steps.versions.outputs.chainsaw }}
          chainsaw_sha256: ${{ steps.versions.outputs.chainsaw_sha256_linux_amd64 }}
          helmfile_version: ${{ steps.versions.outputs.helmfile }}
          helmfile_sha256: ${{ steps.versions.outputs.helmfile_sha256_linux_amd64 }}
          cosign_version: ${{ steps.versions.outputs.cosign }}

  e2e:
    name: E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false

      - name: Load versions
        id: versions
        uses: ./.github/actions/load-versions

      - name: Run E2E Tests
        uses: ./.github/actions/e2e
        with:
          go_version: ${{ steps.versions.outputs.go }}
          dockerhub_mirror: ${{ steps.versions.outputs.dockerhub_mirror }}
          privileged_ci: ${{ inputs.privileged_ci }}

  security-scan:
    name: Security Scan
    # Intentional: unprivileged fork runs skip this job entirely so fork-derived
    # SARIF is never uploaded under the base repository's identity.
    if: inputs.privileged_ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false

      - name: Security Scan
        uses: ./.github/actions/security-scan
        with:
          severity-cutoff: 'medium'
          category: 'anchore-fs'
