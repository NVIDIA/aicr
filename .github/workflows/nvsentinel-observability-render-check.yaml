# Weekly live-render checks for the opt-in nvsentinel mixins.
#
# These tests (pkg/bundler/validations) render the real, live-pulled nvsentinel
# chart with a mixin's actual values: the observability one asserts the
# audit-logging mount shape, the object-monitor one asserts both policies
# reach the generated config with every namespace the catalog deploys the
# watched components into, the slurm-drain-monitor one asserts the
# workload, its read-only RBAC and its config, and the remediation ones
# assert each step's Deployments, --dry-run, images, the full remediation
# action map, the quarantine rule sets and the drain mode, the slinky-drainer
# one asserts node-drainer's customDrain wiring to the plugin, the
# health-events-analyzer one asserts the workload, its datastore wiring and
# that the mixin names every rule the chart ships, the event-exporter one
# asserts the workload, its OIDC Secret and datastore wiring and its config,
# the log-collector one asserts the collector Job, the file server it uploads
# to and that server's volume and images, the system-namespaces one asserts
# the chart's default list still matches the one the drain scope keeps, and
# the CRD exclusion one asserts every component's ownsCRDsExcludeSubcharts
# (nvsentinel's and nktp's) still matches its pinned chart. One more test
# (pkg/bundler) renders kube-prometheus-stack with a stock bundle's values and
# asserts the Prometheus CR carries the bundler's PromQL scrape scope.
# All are gated on testing.Short() -- `make
# test`/`make qualify`/every other CI job run with -short, so this is the only
# place they execute. There is no PR-blocking trigger here on purpose: these
# components are opt-in and off by default, so a transient upstream chart
# hiccup should never block an unrelated PR's merge. Modeled on
# bom-refresh.yaml's scheduled-only pattern.

name: NVSentinel Mixin Render Checks

on:
  schedule:
    # Mondays 06:00 UTC, same cadence as bom-refresh.yaml.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  render-check:
    name: Render the opt-in nvsentinel mixins against the live chart
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Load versions
        id: versions
        uses: ./.github/actions/load-versions

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ steps.versions.outputs.go }}
          cache: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v4.3.1
        with:
          version: ${{ steps.versions.outputs.helm }}

      - name: Render nvsentinel-observability mixin
        run: go test ./pkg/bundler/validations/... -run '^TestNVSentinelObservabilityChartRender$' -v -count=1

      # Runs even when the step above fails: the mixins are independent, and
      # an upstream break in one should not hide the other's status.
      - name: Render nvsentinel-object-monitor mixin
        if: ${{ !cancelled() }}
        run: go test ./pkg/bundler/validations/... -run '^TestNVSentinelObjectMonitorChartRender$' -v -count=1

      # A -run pattern that matches nothing exits 0, so the PASS line is
      # asserted: a renamed test must fail this step, not skip it.
      - name: Render nvsentinel-slurm-drain-monitor mixin
        if: ${{ !cancelled() }}
        run: |
          go test ./pkg/bundler/validations/... -run '^TestNVSentinelSlurmDrainMonitorChartRender$' -v -count=1 | tee "${RUNNER_TEMP}/sdm-render.log"
          grep -q -- '--- PASS: TestNVSentinelSlurmDrainMonitorChartRender' "${RUNNER_TEMP}/sdm-render.log"
      # -run exits 0 with "no tests to run" after a rename, and -short skips
      # these everywhere else, so assert each PASS line.
      - name: Render nvsentinel remediation mixins
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          tests=(
            TestNVSentinelRemediationChartRender
            TestNVSentinelRemediationAbsentWithoutMixin
            TestNVSentinelMongoDBChartRender
            TestCRDExclusionsMatchChart
            TestNVSentinelSlinkyDrainerChartRender
            TestNVSentinelHealthEventsAnalyzerChartRender
            TestNVSentinelEventExporterChartRender
            TestNVSentinelLogCollectorChartRender
            TestNVSentinelChartSystemNamespacesDefault
          )
          pattern="^($(IFS='|'; echo "${tests[*]}"))$"
          out=$(go test ./pkg/bundler/validations/... -run "$pattern" -v -count=1 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi
          for t in "${tests[@]}"; do
            if ! grep -qE "^--- PASS: ${t} \(" <<<"$out"; then
              echo "::error::$t did not execute (renamed or removed?); update this job to match."
              exit 1
            fi
          done

      - name: Render kube-prometheus-stack with the PromQL scope
        if: ${{ !cancelled() }}
        run: |
          go test ./pkg/bundler/ -run '^TestPromQLScrapeScopeRendersOnChart$' -v -count=1 | tee "${RUNNER_TEMP}/promql-render.log"
          grep -q -- '--- PASS: TestPromQLScrapeScopeRendersOnChart' "${RUNNER_TEMP}/promql-render.log"
