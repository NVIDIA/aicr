# Weekly live-render check for the nvsentinel-preflight mixin.
#
# TestNVSentinelPreflightChartRender and TestNVSentinelPreflightAbsentWithoutMixin
# (pkg/bundler/validations) render the real, live-pulled nvsentinel chart with
# the mixin's actual values and assert the webhook configuration, the
# controller's own config.yaml, the injected check images and the
# chart-generated gang-discovery RBAC. Both are gated on testing.Short() --
# `make test`/`make qualify`/every other CI job run with -short, so this is the
# only place they execute. There is no PR-blocking trigger here on purpose:
# this component is opt-in and off by default, so a transient upstream chart
# hiccup should never block an unrelated PR's merge. Same scheduled-only
# pattern as nvsentinel-observability-render-check.yaml.

name: NVSentinel Preflight Render Check

on:
  schedule:
    # Mondays 06:20 UTC. Offset from the observability render check so two
    # jobs pulling the same chart do not collide on a cold registry.
    - cron: "20 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  render-check:
    name: Render nvsentinel-preflight mixin against the live chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Load versions
        id: versions
        uses: ./.github/actions/load-versions

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ steps.versions.outputs.go }}
          cache: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v4.3.1
        with:
          version: ${{ steps.versions.outputs.helm }}

      - name: Render nvsentinel-preflight mixin
        run: go test ./pkg/bundler/validations/... -run '^TestNVSentinelPreflight' -v -count=1
