# KWOK lane for the opt-in NVSentinel remediation steps. No shipped recipe
# composes them, so the tiered matrix in kwok-recipes.yaml never bundles or
# deploys them; this lane composes each step onto one EKS leaf on helm, and
# the widest step on one Argo CD and one Flux deployer as well.

name: KWOK NVSentinel Remediation

on:
  push:
    branches: [main]
    paths: &paths
      # Every leaf parent, mixin, check and component the composed bundle can
      # pull in lives under recipes/, and the binary that resolves and bundles
      # it is built from Go source, so this mirrors kwok-recipes.yaml.
      - 'recipes/**'
      - 'kwok/**'
      - 'tests/chainsaw/kwok/**'
      - 'pkg/recipe/**'
      - 'pkg/bundler/**'
      - 'pkg/cli/**'
      - 'cmd/aicr/**'
      - 'go.mod'
      - 'go.sum'
      - '.settings.yaml'
      - '.github/workflows/kwok-nvsentinel-remediation.yaml'
      - '.github/actions/kwok-test/**'
      - '.github/actions/aicr-build/**'
      - '.github/actions/load-versions/**'
      - '!**.md'
  pull_request:
    branches: [main]
    paths: *paths
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The kwok-test action downloads this artifact by name.
  build-aicr:
    name: Build aicr
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Load versions
        id: versions
        uses: ./.github/actions/load-versions

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ steps.versions.outputs.go }}

      - name: Build aicr binary
        run: bash .github/actions/aicr-build/build-cli.sh

      - name: Upload aicr binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: kwok-aicr-bin
          path: dist/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  test:
    name: 'h100-eks-ubuntu-training + ${{ matrix.mixin }} (${{ matrix.deployer }})'
    needs: [build-aicr]
    runs-on: ubuntu-latest
    # Matches kwok-test-run.yaml: the flux-oci readiness check alone takes ~7min.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mixin: [nvsentinel-observe, nvsentinel-quarantine, nvsentinel-remediation]
        deployer: [helm]
        # The widest step adds the Percona operator, its CRDs and a -post
        # Certificate that depends on the operator's Issuer, so it is the one
        # whose ordering the GitOps deployers can get wrong.
        include:
          - mixin: nvsentinel-remediation
            deployer: argocd-oci
          - mixin: nvsentinel-remediation
            deployer: flux-oci
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Load versions
        id: versions
        uses: ./.github/actions/load-versions

      - name: Run KWOK test
        uses: ./.github/actions/kwok-test
        with:
          recipe: h100-eks-ubuntu-training
          deployer: ${{ matrix.deployer }}
          mixins: ${{ matrix.mixin }}
          kind_version: ${{ steps.versions.outputs.kind }}
          helm_version: ${{ steps.versions.outputs.helm }}
          kwok_version: ${{ steps.versions.outputs.kwok }}
          kubectl_version: ${{ steps.versions.outputs.kubectl }}
          yq_version: ${{ steps.versions.outputs.yq }}
          flux_version: ${{ steps.versions.outputs.flux }}
          chainsaw_version: ${{ steps.versions.outputs.chainsaw }}
          chainsaw_sha256: ${{ steps.versions.outputs.chainsaw_sha256_linux_amd64 }}
          kind_node_image: ${{ steps.versions.outputs.kind_node_image }}
          job_timeout_minutes: '20'
