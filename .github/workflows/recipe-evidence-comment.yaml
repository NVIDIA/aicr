# Workflow 2 of 2 for the warning-only recipe-evidence gate.
#
# Triggered by workflow_run after "Recipe Evidence: Verify" completes.
# Downloads the report artifact and posts a sticky PR comment. This
# workflow never checks out the PR branch directly, keeping any future
# secrets (none today) isolated from untrusted code on fork PRs.
#
# Fork-PR safety notes:
#   * The pr_number written by workflow 1 into the artifact is attacker-
#     controllable on fork PRs (the fork can modify the workflow it runs
#     under). We do NOT trust it: the PR association is re-derived here
#     from the trusted workflow_run.head_sha via the commits/<sha>/pulls
#     API, and cross-checked against workflow_run.head_repository.
#   * report.md is also attacker-controlled, but we only post it (no
#     parsing). GitHub renders it as Markdown under the bot identity;
#     keep that in mind when interpreting the comment's content.

name: "Recipe Evidence: Comment"

on:
  workflow_run:
    workflows: ["Recipe Evidence: Verify"]
    types: [completed]

permissions:
  pull-requests: write
  actions: read

concurrency:
  # Include head repository identity so fork branches with the same name
  # don't share a group key and cancel unrelated runs.
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name || github.repository }}-${{ github.event.workflow_run.head_branch || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  comment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Run on completed verify regardless of conclusion: workflow 1
    # uploads with `if: always()` so partial reports (build failed,
    # discovery errored) still reach the contributor. The report.md
    # existence check below is the real gate.
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    steps:
      - name: Download evidence report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: recipe-evidence-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve PR number from trusted workflow_run metadata
        id: metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Ask the GitHub API which PR(s) contain this head SHA. This is
          # the trusted source — the artifact's pr_number file is fork-
          # writable and not used here.
          pulls=$(gh api "repos/${BASE_REPO}/commits/${HEAD_SHA}/pulls" \
            --jq '[.[] | select(.state == "open")]')

          # Cross-check that the PR's head repo owner matches the
          # workflow_run's head_repository owner. This blocks the case
          # where two PRs share a head SHA across forks.
          pr_number=$(echo "$pulls" | jq -r --arg owner "$HEAD_OWNER" \
            '.[] | select(.head.repo.owner.login == $owner) | .number' | head -1)

          if ! [[ "$pr_number" =~ ^[0-9]+$ ]]; then
            echo "::warning::could not resolve a unique open PR for head ${HEAD_SHA} from ${HEAD_OWNER}; skipping comment"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "pr_number=${pr_number}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Post or update PR comment
        if: ${{ steps.metadata.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.metadata.outputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          MARKER="<!-- recipe-evidence-gate -->"

          if [[ ! -s report.md ]]; then
            echo "No report.md produced; skipping comment."
            exit 0
          fi

          BODY=$(printf '%s\n\n%s\n' "$(cat report.md)" "$MARKER")

          # GitHub caps issue-comment bodies at ~65536 characters. Truncate
          # defensively so the API call doesn't 422 on broad-impact runs.
          # The build workflow already truncates the per-row table; this is
          # belt-and-braces for the trailer + any future report growth.
          max=65000
          if (( ${#BODY} > max )); then
            BODY=$(printf '%s\n\n_(comment truncated to fit GitHub 65KB cap)_\n\n%s\n' \
              "${BODY:0:max}" "$MARKER")
          fi

          # --paginate scans every page of the comments list so the marker
          # is found even on long-running PRs (default page size is 30).
          COMMENT_ID=$(gh api --paginate "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" | tr -d '\r' | head -1)

          if [[ -n "$COMMENT_ID" ]]; then
            gh api "repos/${REPO}/issues/comments/${COMMENT_ID}" \
              -X PATCH -f body="$BODY"
          else
            gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
              -f body="$BODY"
          fi
