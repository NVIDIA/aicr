# Runtime Kind test for the nvsentinel-log-collector mixin.
#
# Installs the remediation step with the log collector, and the health events
# analyzer that live remediation requires, via the bundle's own install.sh,
# sends one synthetic GPU fault into platform-connectors, and checks
# that fault-remediation runs the collector Job on the node, that the bug report
# it uploads is listed by the in-cluster file server, that the file server's
# volume took the --storage-class value, and that the GPU reset is requested
# only after collection. The collector runs in its MOCK_MODE: a Kind node has no
# GPU driver. Not wired into `make qualify`: it needs a Kind cluster.
#
# Path filter kept narrow for the same reason as nvsentinel-preflight-e2e.yaml.

name: NVSentinel Log Collector E2E

on:
  push:
    branches: [main]
    paths: &paths
      - 'recipes/mixins/nvsentinel-remediation.yaml'
      - 'recipes/mixins/nvsentinel-health-events-analyzer.yaml'
      - 'recipes/mixins/nvsentinel-log-collector.yaml'
      - 'pkg/bundler/validations/nvsentinel_log_collector.go'
      - 'pkg/bundler/validations/checks.go'
      - 'recipes/registry.yaml'
      - 'recipes/components/nvsentinel/**'
      - 'recipes/components/nvsentinel-mongodb/**'
      - 'recipes/components/psmdb-operator/**'
      # The tested overlay inherits kind.yaml, which inherits base.yaml, and
      # base.yaml is where nvsentinel enters the chain at all.
      - 'recipes/overlays/h100-kind-training.yaml'
      - 'recipes/overlays/kind.yaml'
      - 'recipes/overlays/base.yaml'
      # The run installs cert-manager, for the Percona cluster's certificates,
      # and prometheus-operator-crds from the bundle.
      - 'recipes/components/cert-manager/**'
      - 'recipes/components/prometheus-operator-crds/**'
      - 'tests/e2e/nvsentinel-log-collector/**'
      - 'pkg/bundler/deployer/localformat/templates/**'
      # run.sh sources tools/common and is invoked through a make target.
      - 'tools/common'
      - 'Makefile'
      - '.github/workflows/nvsentinel-log-collector-e2e.yaml'
      - '.github/actions/setup-build-tools/**'
      - '.github/actions/prep-kind-runner/**'
      - '.github/actions/load-versions/**'
      - '.settings.yaml'
  pull_request:
    branches: [main]
    paths: *paths
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: NVSentinel Log Collector E2E
    # mongod 8.0 before 8.0.35 exits at startup on the ubuntu-24.04 image's
    # 7.0 kernel (https://jira.mongodb.org/browse/SERVER-131779). Return to
    # ubuntu-24.04 once the Percona MongoDB pin is 8.0.35 or newer.
    runs-on: ubuntu-22.04
    # The script's bounded waits sum to ~70 minutes worst case (node Ready 2,
    # cert-manager 10, Percona datastore 15, nvsentinel rollout 15, event
    # delivery 3, collection 15, reset request 5, proto fetch 1, port-forward
    # and fetches 4), before kind create, go build and the installs' own helm
    # waits. A healthy run takes a fraction of that.
    timeout-minutes: 100
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Load versions
        id: versions
        uses: ./.github/actions/load-versions

      - name: Prep Kind runner
        uses: ./.github/actions/prep-kind-runner

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ steps.versions.outputs.go }}
          cache: false

      # run.sh's has_tools gate also needs jq and curl, which the runner image
      # already ships; installing only some of the rest fails the lane before
      # it exercises anything.
      - name: Install Kind, kubectl, Helm and yq
        uses: ./.github/actions/setup-build-tools
        with:
          install_kind: 'true'
          kind_version: '${{ steps.versions.outputs.kind }}'
          install_kubectl: 'true'
          kubectl_version: '${{ steps.versions.outputs.kubectl }}'
          install_helm: 'true'
          helm_version: '${{ steps.versions.outputs.helm }}'
          install_yq: 'true'
          yq_version: '${{ steps.versions.outputs.yq }}'

      # KEEP_CLUSTER so the cluster survives for the diagnostics below; the
      # script's own EXIT trap would otherwise delete it before they run,
      # leaving a failure with nothing to inspect. The always() step after
      # diagnostics does the teardown instead.
      - name: Run nvsentinel-log-collector e2e
        env:
          KEEP_CLUSTER: 'true'
        run: make nvsentinel-log-collector-e2e

      # run.sh writes its kubeconfig inside a mktemp dir and removes that dir on
      # exit, so KEEP_CLUSTER leaves the cluster running but no credentials to
      # reach it. Re-export before querying anything. cancelled() because a
      # job timeout cancels rather than fails.
      - name: Collect diagnostics on failure
        if: ${{ failure() || cancelled() }}
        run: |
          set +e
          cluster=aicr-nvsentinel-lc-e2e
          export KUBECONFIG="${RUNNER_TEMP}/lc-diag.kubeconfig"
          kind export kubeconfig --name "$cluster" --kubeconfig "$KUBECONFIG" || exit 0
          kubectl get pods -A
          kubectl get node -o yaml
          kubectl -n nvsentinel get pvc,statefulset,deployment,job,perconaservermongodb,certificate
          kubectl -n nvsentinel get events --sort-by=.lastTimestamp
          kubectl -n nvsentinel describe pods --selector='!job-name'
          kubectl get gpuresets.janitor.dgxc.nvidia.com -A -o yaml
          kubectl -n nvsentinel logs -l app=log-collector --tail=200
          for d in fault-quarantine node-drainer fault-remediation janitor nvsentinel-incluster-file-server; do
            kubectl -n nvsentinel logs "deployment/$d" --tail=200
          done
          kubectl -n nvsentinel logs daemonset/platform-connectors --tail=200
          kubectl -n nvsentinel logs deployment/psmdb-operator --tail=200
          kubectl -n nvsentinel logs statefulset/nvsentinel-mongodb-rs0 -c mongod --tail=100

      - name: Delete Kind cluster
        if: ${{ always() }}
        run: kind delete cluster --name aicr-nvsentinel-lc-e2e || true
