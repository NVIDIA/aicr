# Throwaway workflow to test manifest publishing changes.
# DELETE THIS FILE before opening the PR.
name: Test Manifest Publishing
on: workflow_dispatch

env:
  VALIDATOR_IMAGE_PREFIX: ghcr.io/njhensley/aicr-validators
  VALIDATOR_PHASES: "deployment performance conformance"
  EXPECTED_PLATFORMS: "linux/amd64 linux/arm64"

permissions:
  contents: read
  packages: write

jobs:
  build-docker:
    name: Build (${{ matrix.phase }}/${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        phase: [deployment, performance, conformance]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0

      - name: Authenticate to registry
        uses: ./.github/actions/ghcr-login

      - name: Build and push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        with:
          context: .
          file: validators/${{ matrix.phase }}/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.VALIDATOR_IMAGE_PREFIX }}/${{ matrix.phase }}:test-${{ matrix.arch }}
          provenance: false

  docker-manifest:
    name: Manifest
    runs-on: ubuntu-latest
    needs: [build-docker]
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Authenticate to registry
        uses: ./.github/actions/ghcr-login

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0

      - name: Create manifests
        run: |
          set -euo pipefail
          for phase in ${VALIDATOR_PHASES}; do
            IMAGE="${VALIDATOR_IMAGE_PREFIX}/${phase}"
            docker buildx imagetools create \
              -t "${IMAGE}:test" \
              "${IMAGE}:test-amd64" \
              "${IMAGE}:test-arm64"
          done

      - name: Verify manifests
        run: |
          set -euo pipefail
          for phase in ${VALIDATOR_PHASES}; do
            IMAGE="${VALIDATOR_IMAGE_PREFIX}/${phase}"
            MANIFEST=$(docker buildx imagetools inspect --raw "${IMAGE}:test")

            PLATFORMS=$(echo "${MANIFEST}" | jq -r \
              '[.manifests[] | select(.platform.os != "unknown") | "\(.platform.os)/\(.platform.architecture)"] | sort | .[]')

            for expected in ${EXPECTED_PLATFORMS}; do
              if ! echo "${PLATFORMS}" | grep -qx "${expected}"; then
                echo "::error::${IMAGE}:test missing ${expected}"
                exit 1
              fi
            done

            if echo "${MANIFEST}" | jq -e '.manifests[] | select(.platform.os == "unknown")' >/dev/null 2>&1; then
              echo "::error::${IMAGE}:test contains unknown/unknown descriptor"
              exit 1
            fi

            echo "${IMAGE}:test OK: $(echo "${PLATFORMS}" | tr '\n' ' ')"
          done
