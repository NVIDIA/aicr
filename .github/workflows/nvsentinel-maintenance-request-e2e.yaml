# Runtime Kind test for the nvsentinel-maintenance-request mixin (#3092).
#
# Checks the bundle gate's refusals, then installs the quarantine step with
# nvsentinel-node-validation and the mixin via the bundle's own install.sh, and
# asserts that the webhook rejects a request for a missing node or a past
# startTime, that a request cordons and drains its node, that a second request
# for the node is rejected, and that deleting it uncordons the node. Not wired
# into `make qualify`: it needs a Kind cluster.
#
# Path filter kept narrow for the same reason as nvsentinel-preflight-e2e.yaml.

name: NVSentinel Maintenance Request E2E

on:
  push:
    branches: [main]
    paths: &paths
      - 'recipes/mixins/nvsentinel-maintenance-request.yaml'
      - 'recipes/mixins/nvsentinel-node-validation.yaml'
      # The run composes the quarantine step for the cordon and drain; the
      # observe case bundles the observe step.
      - 'recipes/mixins/nvsentinel-quarantine.yaml'
      - 'recipes/mixins/nvsentinel-observe.yaml'
      - 'recipes/components/nvsentinel-mongodb/**'
      - 'recipes/components/psmdb-operator/**'
      - 'recipes/registry.yaml'
      - 'recipes/components/nvsentinel/**'
      # The tested overlay inherits kind.yaml, which inherits base.yaml, and
      # base.yaml is where nvsentinel enters the chain at all.
      - 'recipes/overlays/h100-kind-training.yaml'
      - 'recipes/overlays/kind.yaml'
      - 'recipes/overlays/base.yaml'
      # The run installs cert-manager, for lifecycle-manager's webhook
      # certificate and the datastore's TLS, and prometheus-operator-crds from
      # the bundle.
      - 'recipes/components/cert-manager/**'
      - 'recipes/components/prometheus-operator-crds/**'
      - 'pkg/bundler/validations/nvsentinel_maintenance_request.go'
      - 'pkg/bundler/validations/nvsentinel_node_validation.go'
      - 'pkg/bundler/validations/checks.go'
      - 'tests/e2e/nvsentinel-maintenance-request/**'
      - 'pkg/bundler/deployer/localformat/templates/**'
      # run.sh sources tools/common and is invoked through a make target.
      - 'tools/common'
      - 'Makefile'
      - '.github/workflows/nvsentinel-maintenance-request-e2e.yaml'
      - '.github/actions/setup-build-tools/**'
      - '.github/actions/prep-kind-runner/**'
      - '.github/actions/load-versions/**'
      - '.settings.yaml'
  pull_request:
    branches: [main]
    paths: *paths
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: NVSentinel Maintenance Request E2E
    runs-on: ubuntu-22.04
    # The script's bounded waits sum to ~74 minutes worst case (node Ready 2,
    # cert-manager 10, Percona datastore 15, nvsentinel rollout 15, workload
    # start 2, emission, cordon and drain 13, release and uncordon 16), before
    # kind create, go build, three bundles and the installs. A healthy run
    # takes a fraction of that.
    timeout-minutes: 90
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Load versions
        id: versions
        uses: ./.github/actions/load-versions

      - name: Prep Kind runner
        uses: ./.github/actions/prep-kind-runner

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ steps.versions.outputs.go }}
          cache: false

      # run.sh's has_tools gate also needs jq, which the runner image already
      # ships; installing only some of the rest fails the lane before it
      # exercises anything.
      - name: Install Kind, kubectl, Helm and yq
        uses: ./.github/actions/setup-build-tools
        with:
          install_kind: 'true'
          kind_version: '${{ steps.versions.outputs.kind }}'
          install_kubectl: 'true'
          kubectl_version: '${{ steps.versions.outputs.kubectl }}'
          install_helm: 'true'
          helm_version: '${{ steps.versions.outputs.helm }}'
          install_yq: 'true'
          yq_version: '${{ steps.versions.outputs.yq }}'

      # KEEP_CLUSTER so the cluster survives for the diagnostics below; the
      # script's own EXIT trap would otherwise delete it before they run.
      - name: Run nvsentinel-maintenance-request e2e
        env:
          KEEP_CLUSTER: 'true'
        run: make nvsentinel-maintenance-request-e2e

      # run.sh writes its kubeconfig inside a mktemp dir and removes that dir on
      # exit, so re-export before querying anything. cancelled() because a job
      # timeout cancels rather than fails.
      - name: Collect diagnostics on failure
        if: ${{ failure() || cancelled() }}
        run: |
          set +e
          cluster=aicr-3092-kind
          export KUBECONFIG="${RUNNER_TEMP}/maintenance-request-diag.kubeconfig"
          kind export kubeconfig --name "$cluster" --kubeconfig "$KUBECONFIG" || exit 0
          kubectl get pods -A
          kubectl get node -o yaml
          kubectl get maintenancerequests.nvsentinel.dgxc.nvidia.com -o yaml
          kubectl -n nvsentinel get events --sort-by=.lastTimestamp
          kubectl -n nvsentinel get deployment,daemonset,certificate
          kubectl -n nvsentinel describe pods -l app.kubernetes.io/name=lifecycle-manager
          kubectl -n nvsentinel logs deployment/lifecycle-manager --tail=300
          kubectl -n nvsentinel logs deployment/fault-quarantine --tail=200
          kubectl -n nvsentinel logs deployment/node-drainer --tail=200

      - name: Delete Kind cluster
        if: ${{ always() }}
        run: kind delete cluster --name aicr-3092-kind || true
