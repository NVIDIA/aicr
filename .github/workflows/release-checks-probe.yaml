# TEMPORARY, reverted before #3962 is ready for review. Runs the release image
# checks against the v1.3.0 release images, and the tag's CodeQL gate on this
# branch, under the category the tag job uploads with: a branch push analyzes
# the whole code base, where a pull request analysis covers only changed lines.
name: Release Checks Probe

on:
  push:
    branches: [ci/release-artifact-checks]

permissions: {}

jobs:
  image-checks:
    name: Image Checks
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    uses: ./.github/workflows/check-images.yaml
    with:
      digest_map: '{"aicr":"sha256:4c7ac0f9461c14b7d9a4e86d7742b968a25149ed83bcbc52cd87e11d22871304","aicrd":"sha256:752ff33c347c1238b0b98c8d69e4fed836441579fa954479112da488b5f494f7","aiperf-bench":"sha256:c2404877e6c94b127f47b325a7e46b1fc98588d885a6f25c5eff681208f251ea","conformance":"sha256:1f40feb5e8be3f86dd9cf21cdda7701cf552bb915b8687c952de7604c9446e5a","deployment":"sha256:46f13d013f73280f216c531d6cb758ec15442aa832310635a0d62f81c7c50b51","gate":"sha256:861a8d290f964f785ddfa9d237eee83211c996c1e9bbd5d216b8a2fc5badefbf","performance":"sha256:3e6377cffd2f640c7e201cadd1f18d6a87bcdcb38b1672c4626a89e0dacef98e"}'

  codeql:
    name: CodeQL (Go)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Load versions
        id: versions
        uses: ./.github/actions/load-versions

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version: ${{ steps.versions.outputs.go }}
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          languages: go

      - name: Build
        run: go build ./...

      - name: Analyze
        id: analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          category: .github/workflows/on-tag.yaml:codeql

      # analyze stops waiting for processing after a few minutes, or on a
      # status-request error, and still succeeds. Until this upload is
      # processed the tag ref has no CodeQL alerts at all, so an empty list
      # proves nothing: wait for "complete" first and fail on anything else.
      - name: Block on open High or Critical alerts
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
          SARIF_ID: ${{ steps.analyze.outputs.sarif-id }}
          PROCESSING_TIMEOUT_SECONDS: '900'
          POLL_SECONDS: '15'
        run: |
          set -euo pipefail
          if [[ -z "${SARIF_ID}" ]]; then
            echo "::error::analyze reported no SARIF upload to wait for"
            exit 1
          fi
          deadline=$((SECONDS + PROCESSING_TIMEOUT_SECONDS))
          while :; do
            status="$(gh api "repos/${REPO}/code-scanning/sarifs/${SARIF_ID}" --jq .processing_status)"
            case "${status}" in
              complete) break ;;
              pending) ;;
              *)
                echo "::error::CodeQL upload ${SARIF_ID} processing status is '${status}'"
                exit 1
                ;;
            esac
            if (( SECONDS >= deadline )); then
              echo "::error::CodeQL upload ${SARIF_ID} still pending after ${PROCESSING_TIMEOUT_SECONDS}s"
              exit 1
            fi
            sleep "${POLL_SECONDS}"
          done
          alerts="$(gh api -X GET "repos/${REPO}/code-scanning/alerts" \
            -f ref="${REF}" -f state=open -f tool_name=CodeQL -f per_page=100 --paginate \
            --jq '.[] | select(.rule.security_severity_level == "high" or .rule.security_severity_level == "critical")
              | "#\(.number) \(.rule.security_severity_level) \(.rule.id) \(.most_recent_instance.location.path):\(.most_recent_instance.location.start_line)"')"
          if [[ -n "${alerts}" ]]; then
            echo "::error::Open CodeQL alerts of High or Critical security severity on ${REF}:"
            printf '%s\n' "${alerts}"
            exit 1
          fi
          echo "No open High or Critical CodeQL alerts on ${REF}"
