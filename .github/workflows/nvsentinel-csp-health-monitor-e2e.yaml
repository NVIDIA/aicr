# Runtime Kind test for the nvsentinel-csp-health-monitor mixins.
#
# Bundles the EKS H100 leaf with the observe step and the aws mixin, checks the
# bundle gate refuses incomplete or mismatched bundles, installs the datastore
# and nvsentinel via the bundle's own install.sh, and asserts the monitor rolls
# out STORE_ONLY with its IRSA role annotation and keeps running without a
# cloud identity. Kind has no maintenance API, so the script writes maintenance
# events into the datastore in place of the AWS poller and checks an event and
# its completion are recorded without quarantining the node. The execution
# scenarios (CSP_EXECUTION_SCENARIOS=true) are not run here: two of them fail
# at NVSentinel v1.28.0 by design, documenting why the gate refuses
# EXECUTE_REMEDIATION.
# Not wired into `make qualify`: it needs a Kind cluster.
#
# Path filter kept narrow for the same reason as nvsentinel-preflight-e2e.yaml.

name: NVSentinel CSP Health Monitor E2E

on:
  push:
    branches: [main]
    paths: &paths
      - 'recipes/mixins/nvsentinel-observe.yaml'
      - 'recipes/mixins/nvsentinel-quarantine.yaml'
      - 'recipes/mixins/nvsentinel-csp-health-monitor-aws.yaml'
      - 'recipes/mixins/nvsentinel-csp-health-monitor-gcp.yaml'
      - 'recipes/registry.yaml'
      - 'recipes/components/nvsentinel/**'
      - 'recipes/components/nvsentinel-mongodb/**'
      - 'recipes/components/psmdb-operator/**'
      # Every overlay the bundled EKS leaf and the refusal case's Kind leaf
      # resolve through; nvsentinel enters the chain at base.yaml.
      - 'recipes/overlays/h100-eks-ubuntu-training.yaml'
      - 'recipes/overlays/h100-eks-training.yaml'
      - 'recipes/overlays/eks-training.yaml'
      - 'recipes/overlays/eks-ubuntu.yaml'
      - 'recipes/overlays/eks.yaml'
      - 'recipes/overlays/h100-kind-training.yaml'
      - 'recipes/overlays/kind.yaml'
      - 'recipes/overlays/h100-any.yaml'
      - 'recipes/overlays/monitoring-hpa.yaml'
      - 'recipes/overlays/base.yaml'
      - 'recipes/mixins/os-ubuntu.yaml'
      - 'recipes/components/cert-manager/**'
      - 'recipes/components/prometheus-operator-crds/**'
      # The gates the script's bundles exercise: the monitor's own, the
      # remediation pipeline and shared NVSentinel helpers in checks.go, and
      # the drain scope, which shapes the nvsentinel values the quarantine
      # step installs.
      - 'pkg/bundler/validations/nvsentinel_csp_health_monitor.go'
      - 'pkg/bundler/validations/checks.go'
      - 'pkg/bundler/validations/nvsentinel_drain_scope.go'
      - 'pkg/bundler/drainscope/**'
      - 'pkg/bundler/nvsentinel_drain_scope.go'
      - 'tests/e2e/nvsentinel-csp-health-monitor/**'
      - 'pkg/bundler/deployer/localformat/templates/**'
      # run.sh sources tools/common and is invoked through a make target.
      - 'tools/common'
      - 'Makefile'
      - '.github/workflows/nvsentinel-csp-health-monitor-e2e.yaml'
      - '.github/actions/setup-build-tools/**'
      - '.github/actions/prep-kind-runner/**'
      - '.github/actions/load-versions/**'
      - '.settings.yaml'
  pull_request:
    branches: [main]
    paths: *paths
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: NVSentinel CSP Health Monitor E2E
    # mongod 8.0 before 8.0.35 exits at startup on the ubuntu-24.04 image's
    # 7.0 kernel (https://jira.mongodb.org/browse/SERVER-131779). Return to
    # ubuntu-24.04 once the Percona MongoDB pin is 8.0.35 or newer.
    runs-on: ubuntu-22.04
    # The script's bounded waits sum to ~65 minutes worst case (node Ready 2,
    # cert-manager 10, Percona datastore 15, nvsentinel rollout 15, monitor
    # rollout 15, settle 1.5, STORE_ONLY event 4, its completion 3), before
    # kind create, go build and the installs.
    timeout-minutes: 80
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Load versions
        id: versions
        uses: ./.github/actions/load-versions

      - name: Prep Kind runner
        uses: ./.github/actions/prep-kind-runner

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ steps.versions.outputs.go }}
          cache: false

      # jq ships on the runner image.
      - name: Install Kind, kubectl, Helm and yq
        uses: ./.github/actions/setup-build-tools
        with:
          install_kind: 'true'
          kind_version: '${{ steps.versions.outputs.kind }}'
          install_kubectl: 'true'
          kubectl_version: '${{ steps.versions.outputs.kubectl }}'
          install_helm: 'true'
          helm_version: '${{ steps.versions.outputs.helm }}'
          install_yq: 'true'
          yq_version: '${{ steps.versions.outputs.yq }}'

      # KEEP_CLUSTER so the cluster survives for the diagnostics below; the
      # script's own EXIT trap would otherwise delete it before they run.
      - name: Run nvsentinel-csp-health-monitor e2e
        env:
          KEEP_CLUSTER: 'true'
        run: make nvsentinel-csp-health-monitor-e2e

      # run.sh writes its kubeconfig inside a mktemp dir and removes that dir on
      # exit, so re-export before querying anything. cancelled() because a job
      # timeout cancels rather than fails.
      - name: Collect diagnostics on failure
        if: ${{ failure() || cancelled() }}
        run: |
          set +e
          cluster=aicr-nvsentinel-csp-e2e
          export KUBECONFIG="${RUNNER_TEMP}/csp-diag.kubeconfig"
          kind export kubeconfig --name "$cluster" --kubeconfig "$KUBECONFIG" || exit 0
          kubectl get pods -A
          kubectl -n nvsentinel get events --sort-by=.lastTimestamp
          kubectl -n nvsentinel get pvc,statefulset,deployment,perconaservermongodb,certificate
          kubectl -n nvsentinel describe pods -l app.kubernetes.io/name=csp-health-monitor
          for c in csp-health-monitor maintenance-notifier; do
            kubectl -n nvsentinel logs deployment/csp-health-monitor -c "$c" --tail=200
          done
          kubectl -n nvsentinel logs daemonset/platform-connectors --tail=200
          kubectl -n nvsentinel logs statefulset/nvsentinel-mongodb-rs0 -c mongod --tail=100

      - name: Delete Kind cluster
        if: ${{ always() }}
        run: kind delete cluster --name aicr-nvsentinel-csp-e2e || true
