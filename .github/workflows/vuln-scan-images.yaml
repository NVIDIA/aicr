name: Daily Image Vulnerability Scan

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6:00 AM UTC
  workflow_dispatch:
    inputs:
      notify_slack:
        description: 'Post results to Slack (scheduled runs always post; manual runs skip by default)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  VALIDATOR_IMAGE_PREFIX: ghcr.io/nvidia/aicr-validators
  VALIDATOR_PHASES: "deployment performance conformance aiperf-bench"
  GATE_IMAGE: ghcr.io/nvidia/aicr-gate
  SCAN_TAG: scan-${{ github.sha }}

jobs:

  # =============================================================================
  # Build Ko Images (aicr, aicrd)
  # =============================================================================

  build-ko:
    name: Build Ko Images
    if: github.repository == 'nvidia/aicr'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Load versions
        id: versions
        uses: ./.github/actions/load-versions

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: ${{ steps.versions.outputs.go }}
          cache: true

      - name: Setup build tools
        uses: ./.github/actions/setup-build-tools
        with:
          install_ko: 'true'
          ko_version: ${{ steps.versions.outputs.ko }}

      - name: Authenticate to registry
        uses: ./.github/actions/ghcr-login

      - name: Build and push aicr
        env:
          GOFLAGS: -mod=vendor
          KO_DOCKER_REPO: ghcr.io/nvidia/aicr
        run: |
          set -euo pipefail
          ko build ./cmd/aicr \
            --bare \
            --platform=linux/amd64,linux/arm64 \
            --image-label="org.opencontainers.image.revision=${{ github.sha }}" \
            --tags="${SCAN_TAG}"

      - name: Build and push aicrd
        env:
          GOFLAGS: -mod=vendor
          KO_DOCKER_REPO: ghcr.io/nvidia/aicrd
          KO_DEFAULTBASEIMAGE: gcr.io/distroless/static:nonroot
        run: |
          set -euo pipefail
          ko build ./cmd/aicrd \
            --bare \
            --platform=linux/amd64,linux/arm64 \
            --image-label="org.opencontainers.image.revision=${{ github.sha }}" \
            --tags="${SCAN_TAG}"

  # =============================================================================
  # Build Docker Validator Images
  # =============================================================================

  build-docker:
    name: Docker Validator (${{ matrix.phase }}/${{ matrix.arch }})
    if: github.repository == 'nvidia/aicr'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        phase: [deployment, performance, conformance, aiperf-bench]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
          - phase: aiperf-bench
            dockerfile: validators/performance/aiperf-bench.Dockerfile
            image_title: aicr-aiperf-bench
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Authenticate to registry
        uses: ./.github/actions/ghcr-login

      - name: Read Go version
        id: go
        shell: bash
        run: echo "version=$(cat .go-version)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          file: ${{ matrix.dockerfile || format('validators/{0}/Dockerfile', matrix.phase) }}
          platforms: ${{ matrix.platform }}
          push: true
          # CHAINSAW_* args were dropped in #1236 — the deployment validator
          # no longer ships /usr/local/bin/chainsaw; it executes Chainsaw
          # Test format in-process via validators/chainsaw/inprocess.go.
          build-args: |
            GO_VERSION=${{ steps.go.outputs.version }}
          tags: ${{ env.VALIDATOR_IMAGE_PREFIX }}/${{ matrix.phase }}:${{ env.SCAN_TAG }}-${{ matrix.arch }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=${{ matrix.image_title || format('aicr-validator-{0}', matrix.phase) }}
            org.opencontainers.image.revision=${{ github.sha }}

  # =============================================================================
  # Build Gate Image (aicr-gate)
  # =============================================================================
  # The in-cluster readiness gate image (cmd/gate/Dockerfile) is published only
  # on release tags by on-tag.yaml, so without this it is never vuln-scanned and
  # never refreshed on main. Mirror on-tag's build-args exactly (GO_VERSION +
  # CHAINSAW_VERSION + VERSION) so the scanned image matches what ships.

  build-gate:
    name: Docker Gate (${{ matrix.arch }})
    if: github.repository == 'nvidia/aicr'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      # packages: write — pushes the per-arch aicr-gate image to GHCR so the
      # manifest + scan jobs can pull it (mirrors build-docker/build-ko).
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Authenticate to registry
        uses: ./.github/actions/ghcr-login

      - name: Load versions
        id: versions
        uses: ./.github/actions/load-versions

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          file: cmd/gate/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            GO_VERSION=${{ steps.versions.outputs.go }}
            CHAINSAW_VERSION=${{ steps.versions.outputs.chainsaw }}
            VERSION=${{ env.SCAN_TAG }}
          tags: ${{ env.GATE_IMAGE }}:${{ env.SCAN_TAG }}-${{ matrix.arch }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=aicr-gate
            org.opencontainers.image.revision=${{ github.sha }}

  # =============================================================================
  # Docker Manifest: Combine per-arch images into multi-arch manifests
  # =============================================================================

  docker-manifest:
    name: Docker Manifest
    runs-on: ubuntu-latest
    needs: [build-docker, build-gate]
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Authenticate to registry
        uses: ./.github/actions/ghcr-login

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Create multi-arch manifests
        run: |
          set -euo pipefail
          for phase in ${VALIDATOR_PHASES}; do
            IMAGE="${VALIDATOR_IMAGE_PREFIX}/${phase}"
            docker buildx imagetools create \
              -t "${IMAGE}:${SCAN_TAG}" \
              "${IMAGE}:${SCAN_TAG}-amd64" \
              "${IMAGE}:${SCAN_TAG}-arm64"
          done
          docker buildx imagetools create \
            -t "${GATE_IMAGE}:${SCAN_TAG}" \
            "${GATE_IMAGE}:${SCAN_TAG}-amd64" \
            "${GATE_IMAGE}:${SCAN_TAG}-arm64"

  # =============================================================================
  # Scan: Vulnerability scan all images
  # =============================================================================

  scan:
    name: Scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [build-ko, docker-manifest]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        image:
          - ghcr.io/nvidia/aicr
          - ghcr.io/nvidia/aicrd
          - ghcr.io/nvidia/aicr-validators/deployment
          - ghcr.io/nvidia/aicr-validators/performance
          - ghcr.io/nvidia/aicr-validators/conformance
          - ghcr.io/nvidia/aicr-validators/aiperf-bench
          - ghcr.io/nvidia/aicr-gate
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Authenticate to registry
        uses: ./.github/actions/ghcr-login

      - name: Scan container image
        id: scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2  # v7.4.0
        with:
          image: '${{ matrix.image }}:${{ env.SCAN_TAG }}'
          severity-cutoff: 'high'
          output-format: json
          only-fixed: true
          fail-build: false
          config: .grype.yaml
          # OpenVEX statements with per-CVE reachability evidence for
          # aiperf-bench suppressions. Grype applies statements only to
          # products whose PURL matches, so this is a no-op for the other
          # images in the matrix.
          vex: .openvex.json

      - name: Extract severity counts and IDs
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          JSON_FILE="${{ steps.scan.outputs.json }}"
          SHORT_NAME="${IMAGE##*/}"
          mkdir -p scan-results
          OUT="scan-results/${SHORT_NAME}.txt"

          if [[ ! -f "${JSON_FILE}" ]]; then
            echo "${SHORT_NAME}: scan output missing" > "${OUT}"
            exit 0
          fi

          # Severity counts from non-suppressed matches.
          CRITICAL=$(jq '[.matches[] | select(.vulnerability.severity == "Critical")] | length' "${JSON_FILE}")
          HIGH=$(jq '[.matches[] | select(.vulnerability.severity == "High")] | length' "${JSON_FILE}")
          MEDIUM=$(jq '[.matches[] | select(.vulnerability.severity == "Medium")] | length' "${JSON_FILE}")
          LOW=$(jq '[.matches[] | select(.vulnerability.severity == "Low")] | length' "${JSON_FILE}")
          NEGLIGIBLE=$(jq '[.matches[] | select(.vulnerability.severity == "Negligible")] | length' "${JSON_FILE}")
          # ignoredMatches conflates grype's internal filters with VEX
          # suppressions, so report VEX hits separately to make it
          # obvious when a statement actually applied.
          VEX_APPLIED=$(jq '[.ignoredMatches[]? | select((.appliedIgnoreRules // []) | any(.namespace == "vex"))] | length' "${JSON_FILE}")

          # HIGH+ identifiers for triage. Emits primary ID (often a GHSA)
          # plus any related CVE aliases so reviewers can cross-reference
          # NVD without re-running the scan.
          HIGH_IDS=$(jq -r '
            [ .matches[]
              | select(.vulnerability.severity == "High" or .vulnerability.severity == "Critical")
              | (.artifact.name + " " + .vulnerability.id
                 + ( (.relatedVulnerabilities // [] | map(.id) | join(","))
                     | if . == "" then "" else " (" + . + ")" end )) ]
            | join(", ")' "${JSON_FILE}")

          {
            echo "${SHORT_NAME}: ${CRITICAL} critical, ${HIGH} high, ${MEDIUM} medium, ${LOW} low, ${NEGLIGIBLE} negligible (${VEX_APPLIED} VEX-suppressed)"
            if [[ "${CRITICAL}" -gt 0 || "${HIGH}" -gt 0 ]]; then
              echo "  HIGH+: ${HIGH_IDS}"
            fi
          } > "${OUT}"
          cat "${OUT}"

      - name: Upload scan result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: scan-${{ strategy.job-index }}
          path: scan-results/
          retention-days: 1

  # =============================================================================
  # BOM Image List: generate from make bom (independent of build chain)
  # =============================================================================

  bom-list:
    name: Generate BOM Image List
    if: github.repository == 'nvidia/aicr'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      images: ${{ steps.extract.outputs.images }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Load versions
        id: versions
        uses: ./.github/actions/load-versions

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: ${{ steps.versions.outputs.go }}
          # Avoid cache contention with build-ko; bom generation is not the hot path.
          cache: false

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v4.3.1
        with:
          version: ${{ steps.versions.outputs.helm }}

      - name: Generate BOM
        run: |
          set -euo pipefail
          GOFLAGS="-mod=vendor" go run ./tools/bom \
            -repo-root "." \
            -out-dir "dist/bom" \
            -aicr-version "scan-${{ github.sha }}"

      - name: Extract image list
        id: extract
        run: |
          set -euo pipefail
          # Container BOM entries carry bom-ref "img:<full-image-ref>".
          # Strip the prefix to recover the raw scannable reference.
          IMAGES=$(jq -c '[
            .components[]
            | select(.type == "container")
            | .["bom-ref"]
            | ltrimstr("img:")
          ]' dist/bom/bom.cdx.json)
          echo "images=${IMAGES}" >> "${GITHUB_OUTPUT}"
          IMAGE_COUNT=$(echo "${IMAGES}" | jq 'length')
          echo "Extracted ${IMAGE_COUNT} images from BOM"

  # =============================================================================
  # BOM Scan: vulnerability scan the full upstream image set at Medium+ severity
  # =============================================================================

  scan-bom:
    name: BOM Scan (${{ matrix.image }})
    # Skip the whole job when bom-list failed or produced an empty list.
    if: |
      github.repository == 'nvidia/aicr' &&
      needs.bom-list.result == 'success' &&
      needs.bom-list.outputs.images != '[]' &&
      needs.bom-list.outputs.images != ''
    needs: [bom-list]
    runs-on: ubuntu-latest
    # Large upstream images (e.g. gpu-operator CUDA) can take time to pull.
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # Cap concurrency to avoid saturating network bandwidth and registry rate limits.
      max-parallel: 10
      matrix:
        image: ${{ fromJSON(needs.bom-list.outputs.images) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Scan BOM image
        id: scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2  # v7.4.0
        with:
          image: '${{ matrix.image }}'
          severity-cutoff: 'medium'
          output-format: json
          # Upstream images: we cannot fix them in-tree; scan all findings so
          # they feed escalation and VEX triage rather than in-tree code changes.
          only-fixed: false
          fail-build: false
          config: .grype.yaml
          # Apply existing VEX statements so re-runs surface only new/changed
          # findings rather than the full standing backlog.
          vex: .openvex.json

      - name: Extract severity counts and IDs
        if: always()
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          JSON_FILE="${{ steps.scan.outputs.json }}"
          # Derive a filesystem-safe short name from the image reference:
          # strip registry prefix, then tag and digest suffixes.
          SHORT_NAME="${IMAGE##*/}"
          SHORT_NAME="${SHORT_NAME%%:*}"
          SHORT_NAME="${SHORT_NAME%%@*}"
          mkdir -p bom-scan-results
          OUT="bom-scan-results/${SHORT_NAME}.txt"
          JSON_OUT="bom-scan-results/${SHORT_NAME}.json"

          # Persist the raw image reference so the vex-draft job can reconstruct
          # the product PURL without re-parsing Grype internals.
          echo "${IMAGE}" > "bom-scan-results/${SHORT_NAME}.ref"

          if [[ -z "${JSON_FILE}" || ! -f "${JSON_FILE}" ]]; then
            echo "${SHORT_NAME}: scan output missing" > "${OUT}"
            exit 0
          fi

          cp "${JSON_FILE}" "${JSON_OUT}"

          CRITICAL=$(jq '[.matches[] | select(.vulnerability.severity == "Critical")] | length' "${JSON_OUT}")
          HIGH=$(jq '[.matches[] | select(.vulnerability.severity == "High")] | length' "${JSON_OUT}")
          MEDIUM=$(jq '[.matches[] | select(.vulnerability.severity == "Medium")] | length' "${JSON_OUT}")
          LOW=$(jq '[.matches[] | select(.vulnerability.severity == "Low")] | length' "${JSON_OUT}")
          NEGLIGIBLE=$(jq '[.matches[] | select(.vulnerability.severity == "Negligible")] | length' "${JSON_OUT}")
          VEX_APPLIED=$(jq '[.ignoredMatches[]? | select((.appliedIgnoreRules // []) | any(.namespace == "vex"))] | length' "${JSON_OUT}")

          HIGH_IDS=$(jq -r '
            [ .matches[]
              | select(.vulnerability.severity == "High" or .vulnerability.severity == "Critical")
              | (.artifact.name + " " + .vulnerability.id
                  ( (.relatedVulnerabilities // [] | map(.id) | join(","))
                     | if . == "" then "" else " (" + . + ")" end )) ]
            | join(", ")' "${JSON_OUT}")

          {
            echo "${SHORT_NAME}: ${CRITICAL} critical, ${HIGH} high, ${MEDIUM} medium, ${LOW} low, ${NEGLIGIBLE} negligible (${VEX_APPLIED} VEX-suppressed)"
            if [[ "${CRITICAL}" -gt 0 || "${HIGH}" -gt 0 ]]; then
              echo "  HIGH+: ${HIGH_IDS}"
            fi
          } > "${OUT}"
          cat "${OUT}"

      - name: Upload BOM scan result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: bom-scan-${{ strategy.job-index }}
          path: bom-scan-results/
          retention-days: 1

  # =============================================================================
  # VEX Draft: auto-generate under_investigation statements for new findings
  # =============================================================================

  vex-draft:
    name: VEX Draft Generation
    runs-on: ubuntu-latest
    needs: [scan-bom]
    # Run whenever scan-bom completed (success or partial failure); skip only
    # when it was never scheduled (bom-list failed or produced an empty list).
    if: |
      always() &&
      !cancelled() &&
      needs.scan-bom.result != 'skipped'
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Download BOM scan results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: bom-scan-*
          merge-multiple: true
          path: bom-scan-results

      - name: Generate VEX draft statements
        id: vex
        run: python3 .github/scripts/gen-vex-drafts.py

      - name: Open VEX draft PR
        # Only open a PR when the generator found genuinely new (vuln, product) pairs.
        if: steps.vex.outputs.new_count > 0
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          commit-message: "chore(vex): add under_investigation drafts for new BOM scan findings"
          title: "chore(vex): ${{ steps.vex.outputs.new_count }} new VEX draft statement(s) from BOM scan"
          body: |
            Automated VEX draft from the daily BOM vulnerability scan (run #${{ github.run_number }}).

            `gen-vex-drafts.py` detected Medium+ findings with no existing OpenVEX
            coverage and appended `under_investigation` statements to `.openvex.json`.

            **These statements do NOT suppress findings.** Status `under_investigation`
            leaves Grype reporting them in every subsequent scan. A human must review
            each entry and update the status to `not_affected` / `affected` / `fixed`
            with a justification and evidence before any suppression takes effect.

            **Review checklist per statement:**
            - [ ] Confirm the vulnerability applies to this image (not a false positive)
            - [ ] Verify the vulnerable code path is reachable in production
            - [ ] Check upstream advisory and fix availability / timeline
            - [ ] Update status and add `impact_statement` / `justification` evidence
            - [ ] For `not_affected`: use one of the CISA VEX justification codes

            See the `.openvex.json` diff for the full list of new statements.
          branch: chore/vex-draft-${{ github.run_number }}
          delete-branch: true
          labels: |
            area/infra
            theme/supply-chain

  # =============================================================================
  # Notify: Post scan results to Slack (only on critical/high findings)
  # =============================================================================

  notify:
    name: Slack Notification
    runs-on: ubuntu-latest
    needs: [scan, scan-bom]
    # Run when the NVIDIA scan has a definite outcome. Allow scan-bom to be
    # skipped (e.g. bom-list failure) without blocking the notification.
    if: |
      always() &&
      needs.scan.result != 'cancelled' &&
      (needs.scan-bom.result == 'success' ||
       needs.scan-bom.result == 'failure' ||
       needs.scan-bom.result == 'skipped')
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Download NVIDIA image scan results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          # Pattern is intentionally anchored with [0-9] to exclude bom-scan-* artifacts.
          pattern: scan-[0-9]*
          merge-multiple: true
          path: scan-results

      - name: Download BOM image scan results
        # Non-fatal: bom-scan-* artifacts are absent when scan-bom was skipped.
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: bom-scan-*
          merge-multiple: true
          path: bom-scan-results

      - name: Post to Slack
        env:
          SLACK_SERVICE: ${{ secrets.SLACK_SERVICE }}
          # Scheduled runs always post; manual runs post only when the
          # notify_slack input is set. The message is echoed to the logs
          # either way, so manual runs can validate findings without Slack.
          POST_SLACK: ${{ github.event_name == 'schedule' || inputs.notify_slack }}
          SHA: ${{ github.sha }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          SHORT_SHA="${SHA:0:7}"
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M')
          RUN_URL="${SERVER}/${REPO}/actions/runs/${RUN_ID}"

          TOTAL_CRITICAL=0
          TOTAL_HIGH=0
          NVIDIA_RESULTS=""
          BOM_CRIT_HIGH_RESULTS=""
          BOM_TOTAL_MEDIUM=0

          # --- NVIDIA built images: Critical/High alert (unchanged threshold) ---
          for f in scan-results/*.txt; do
            [[ -f "$f" ]] || continue
            # First line: summary counts. Subsequent lines (when present):
            # HIGH+ CVE/GHSA IDs for triage. Both flow into the Slack message.
            HEADER=$(head -1 "$f")
            BODY=$(cat "$f")
            NVIDIA_RESULTS="${NVIDIA_RESULTS}\\n• ${BODY//$'\n'/\\n  }"
            # Parse counts from the header line only so trailing ID lines
            # never contaminate the totals.
            C=$(echo "${HEADER}" | grep -oP '\d+(?= critical)' || echo 0)
            H=$(echo "${HEADER}" | grep -oP '\d+(?= high)' || echo 0)
            TOTAL_CRITICAL=$((TOTAL_CRITICAL + C))
            TOTAL_HIGH=$((TOTAL_HIGH + H))
          done

          # --- BOM upstream images: Critical/High alert; Medium as digest ---
          # Medium findings are summarised as a count rather than a full ID list
          # to keep the Slack channel actionable. The VEX draft PR carries the
          # per-finding detail.
          for f in bom-scan-results/*.txt; do
            [[ -f "$f" ]] || continue
            HEADER=$(head -1 "$f")
            BODY=$(cat "$f")
            C=$(echo "${HEADER}" | grep -oP '\d+(?= critical)' || echo 0)
            H=$(echo "${HEADER}" | grep -oP '\d+(?= high)' || echo 0)
            M=$(echo "${HEADER}" | grep -oP '\d+(?= medium)' || echo 0)
            TOTAL_CRITICAL=$((TOTAL_CRITICAL + C))
            TOTAL_HIGH=$((TOTAL_HIGH + H))
            BOM_TOTAL_MEDIUM=$((BOM_TOTAL_MEDIUM + M))
            if [[ "${C}" -gt 0 || "${H}" -gt 0 ]]; then
              BOM_CRIT_HIGH_RESULTS="${BOM_CRIT_HIGH_RESULTS}\\n• ${BODY//$'\n'/\\n  }"
            fi
          done

          # Append the medium digest line when upstream medium findings exist.
          BOM_MEDIUM_LINE=""
          if [[ "${BOM_TOTAL_MEDIUM}" -gt 0 ]]; then
            BOM_MEDIUM_LINE="\\nBOM medium total: ${BOM_TOTAL_MEDIUM} (upstream; VEX draft job opens a PR only for newly uncovered findings)"
          fi

          # Only notify when critical or high vulnerabilities are found
          if [[ "${TOTAL_CRITICAL}" -eq 0 && "${TOTAL_HIGH}" -eq 0 ]]; then
            echo "No critical or high vulnerabilities found, skipping Slack notification"
            echo -e "Vulnerability Scan: ${TIMESTAMP} (${SHORT_SHA})${NVIDIA_RESULTS}${BOM_MEDIUM_LINE}"
            exit 0
          fi

          RESULTS="${NVIDIA_RESULTS}${BOM_CRIT_HIGH_RESULTS}${BOM_MEDIUM_LINE}"
          MESSAGE="Vulnerability Scan: ${TIMESTAMP} (${SHORT_SHA})${RESULTS}\\n<${RUN_URL}|View run>"

          # Always echo the message so the run logs carry the findings,
          # then post to Slack only when enabled for this trigger.
          echo -e "${MESSAGE}"

          if [[ "${POST_SLACK}" != "true" ]]; then
            echo "Slack notification disabled for this run (POST_SLACK=${POST_SLACK}); skipping post"
          elif [[ -n "${SLACK_SERVICE}" ]]; then
            curl -sSf -X POST \
              -H 'Content-type: application/json' \
              --data "{\"text\":\"${MESSAGE}\"}" \
              "https://hooks.slack.com/services/${SLACK_SERVICE}"
          else
            echo "SLACK_SERVICE not set, skipping notification"
          fi

  # =============================================================================
  # Cleanup: Delete all scan-* images from GHCR (always runs)
  # =============================================================================

  cleanup:
    name: Cleanup Scan Images
    runs-on: ubuntu-latest
    # Wait for both notify and vex-draft so the PR is opened before images are
    # deleted. vex-draft may be skipped (bom-list failure) which is acceptable.
    needs: [notify, vex-draft]
    if: always()
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Delete scan images
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # All image paths to clean up (org-level packages)
          IMAGES=(
            "nvidia/aicr"
            "nvidia/aicrd"
            "nvidia/aicr-validators/deployment"
            "nvidia/aicr-validators/performance"
            "nvidia/aicr-validators/conformance"
            "nvidia/aicr-validators/aiperf-bench"
            "nvidia/aicr-gate"
          )

          for IMAGE in "${IMAGES[@]}"; do
            # URL-encode the package name (slashes become %2F)
            PKG_NAME=$(echo "${IMAGE}" | sed 's|/|%2F|g')

            echo "Cleaning ${IMAGE}..."

            # List versions matching the scan tag
            VERSIONS=$(gh api \
              "orgs/NVIDIA/packages/container/${PKG_NAME}/versions?per_page=100" \
              --jq ".[] | select(.metadata.container.tags | any(startswith(\"${SCAN_TAG}\"))) | .id" \
              2>/dev/null || true)

            for VID in ${VERSIONS}; do
              echo "  Deleting version ${VID}"
              gh api \
                --method DELETE \
                "orgs/NVIDIA/packages/container/${PKG_NAME}/versions/${VID}" \
                2>/dev/null || true
            done
          done
