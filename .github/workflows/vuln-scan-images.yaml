# TEMPORARY DIAGNOSTIC for #3249 -- never merged. Replaces the weekly scan on
# this branch only, so it can be dispatched with --ref. Scans the two NCCL
# preflight images through the docker daemon (what scan-action does today)
# and straight from the registry, sampling memory/disk inline so the numbers
# survive the runner being killed.
name: Weekly Image Vulnerability Scan

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose (${{ matrix.name }}, ${{ matrix.source }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        name: [preflight-nccl-loopback, preflight-nccl-allreduce]
        source: [docker, registry]
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space for large upstream images
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          docker system prune -f
          sudo fallocate -l 48G /swapfile-scan
          sudo chmod 600 /swapfile-scan
          sudo mkswap /swapfile-scan
          sudo swapon /swapfile-scan
          swapon --show
          df -h /
          free -m
          nproc
          docker info --format 'driver={{.Driver}} images={{json .DriverStatus}}'

      - name: Install grype (same version scan-action uses)
        id: grype
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2

      - name: Scan with resource sampling
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
          IMAGE: ghcr.io/nvidia/nvsentinel/${{ matrix.name }}:v1.28.0
          SOURCE: ${{ matrix.source }}
        run: |
          set -uo pipefail
          sudo dmesg -w | grep --line-buffered -iE 'oom|killed process|out of memory|no space' \
            | sed -u 's/^/[dmesg] /' &
          (
            while :; do
              read -r _ _ used _ _ _ avail < <(free -m | awk '/^Mem:/')
              swap=$(free -m | awk '/^Swap:/{print $3"/"$2}')
              disk=$(df -BG --output=avail / | tail -1 | tr -d ' ')
              grss=$(ps -o rss= -C grype | awk '{s+=$1} END{printf "%d", s/1024}')
              drss=$(ps -o rss= -C dockerd,containerd | awk '{s+=$1} END{printf "%d", s/1024}')
              echo "[mon $(date -u +%T)] mem_used=${used}M avail=${avail}M swap=${swap}M disk_avail=${disk} grype_rss=${grss}M docker_rss=${drss}M"
              sleep 15
            done
          ) &
          src="${IMAGE}"
          [[ "${SOURCE}" == registry ]] && src="registry:${IMAGE}"
          /usr/bin/time -v "${GRYPE}" -v -o json --file out.json --only-fixed \
            --vex .openvex.json -c .grype.yaml "${src}"
          echo "grype exit=$?"
          jq '{matches: (.matches|length), highPlus: ([.matches[] | select(.vulnerability.severity=="High" or .vulnerability.severity=="Critical")] | length)}' out.json || true
          df -h /
          free -m
