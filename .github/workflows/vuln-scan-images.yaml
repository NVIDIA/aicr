name: Weekly Image Vulnerability Scan

on:
  schedule:
    # Weekly on Thursday at 6:00 AM UTC. Every run reports the full HIGH+
    # set in its scan-* artifacts, carried-over findings included -- an open
    # vulnerability keeps being reported until it is fixed or VEX-suppressed.
    # The Slack message summarizes it (tools/vuln-scan-summary).
    - cron: '0 6 * * 4'
  workflow_dispatch:
    inputs:
      notify_slack:
        description: 'Post results to Slack (scheduled runs always post; manual runs skip by default)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  VALIDATOR_IMAGE_PREFIX: ghcr.io/nvidia/aicr-validators
  VALIDATOR_PHASES: "deployment performance conformance aiperf-bench"
  GATE_IMAGE: ghcr.io/nvidia/aicr-gate
  SCAN_TAG: scan-${{ github.sha }}

jobs:

  # =============================================================================
  # Build Ko Images (aicr, aicrd)
  # =============================================================================

  build-ko:
    name: Build Ko Images
    if: github.repository == 'nvidia/aicr'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Load versions
        id: versions
        uses: ./.github/actions/load-versions

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ steps.versions.outputs.go }}
          cache: true

      - name: Setup build tools
        uses: ./.github/actions/setup-build-tools
        with:
          install_ko: 'true'
          ko_version: ${{ steps.versions.outputs.ko }}

      - name: Authenticate to registry
        uses: ./.github/actions/ghcr-login

      - name: Build and push aicr
        env:
          KO_DOCKER_REPO: ghcr.io/nvidia/aicr
        run: |
          set -euo pipefail
          ko build ./cmd/aicr \
            --bare \
            --platform=linux/amd64,linux/arm64 \
            --image-label="org.opencontainers.image.revision=${{ github.sha }}" \
            --tags="${SCAN_TAG}"

      - name: Build and push aicrd
        env:
          KO_DOCKER_REPO: ghcr.io/nvidia/aicrd
          # Base image inherited from .ko.yaml (nvcr.io/nvidia/distroless/static),
          # same as the aicr build above.
        run: |
          set -euo pipefail
          ko build ./cmd/aicrd \
            --bare \
            --platform=linux/amd64,linux/arm64 \
            --image-label="org.opencontainers.image.revision=${{ github.sha }}" \
            --tags="${SCAN_TAG}"

  # =============================================================================
  # Build Docker Validator Images
  # =============================================================================

  build-docker:
    name: Docker Validator (${{ matrix.phase }}/${{ matrix.arch }})
    if: github.repository == 'nvidia/aicr'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        phase: [deployment, performance, conformance, aiperf-bench]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
          - phase: aiperf-bench
            dockerfile: validators/performance/aiperf-bench.Dockerfile
            image_title: aicr-aiperf-bench
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003  # v4.4.0

      - name: Authenticate to registry
        uses: ./.github/actions/ghcr-login

      - name: Load versions
        id: versions
        uses: ./.github/actions/load-versions

      - name: Setup Go
        if: matrix.phase != 'aiperf-bench'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ steps.versions.outputs.go }}
          cache: true

      - name: Build validator binary
        if: matrix.phase != 'aiperf-bench'
        shell: bash
        env:
          VALIDATOR_ARCHES: ${{ matrix.arch }}
          VALIDATOR_PHASES: ${{ matrix.phase }}
        run: ./tools/build-validator-binaries

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile || format('validators/{0}/Dockerfile', matrix.phase) }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.VALIDATOR_IMAGE_PREFIX }}/${{ matrix.phase }}:${{ env.SCAN_TAG }}-${{ matrix.arch }}
          provenance: false
          # aiperf-bench builds without the layer cache on purpose (#2086).
          # Its requirements.txt is deliberately unpinned so each rebuild
          # resolves patched transitive versions, but `pip install` is opaque
          # to BuildKit: neither the base image nor the COPY'd requirements.txt
          # changes between releases, so a cache hit replays the old closure
          # verbatim. Without this the weekly scan reports on a stale closure
          # that a freshly built image would not contain. The Go validators
          # have no resolution step, so they keep the cache.
          cache-from: ${{ matrix.phase != 'aiperf-bench' && 'type=gha' || '' }}
          cache-to: ${{ matrix.phase != 'aiperf-bench' && 'type=gha,mode=max' || '' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image_title || format('aicr-validator-{0}', matrix.phase) }}
            org.opencontainers.image.revision=${{ github.sha }}

  # =============================================================================
  # Build Gate Image (aicr-gate)
  # =============================================================================
  # The in-cluster readiness gate image (cmd/gate/Dockerfile) is published only
  # on release tags by on-tag.yaml, so without this it is never vuln-scanned and
  # never refreshed on main. Mirror on-tag's runner-side compilation so the
  # scanned image matches what ships.

  build-gate:
    name: Docker Gate (${{ matrix.arch }})
    if: github.repository == 'nvidia/aicr'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      # packages: write — pushes the per-arch aicr-gate image to GHCR so the
      # manifest + scan jobs can pull it (mirrors build-docker/build-ko).
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003  # v4.4.0

      - name: Authenticate to registry
        uses: ./.github/actions/ghcr-login

      - name: Load versions
        id: versions
        uses: ./.github/actions/load-versions

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ steps.versions.outputs.go }}
          cache: true

      - name: Build gate binary
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          VERSION: ${{ env.SCAN_TAG }}
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=linux GOARCH="${TARGET_ARCH}" GOFLAGS="-mod=readonly" \
            go build -trimpath \
            -ldflags="-s -w -extldflags '-static' -X main.version=${VERSION}" \
            -o dist/gate ./cmd/gate
          file dist/gate

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: cmd/gate/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.GATE_IMAGE }}:${{ env.SCAN_TAG }}-${{ matrix.arch }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=aicr-gate
            org.opencontainers.image.revision=${{ github.sha }}

  # =============================================================================
  # Docker Manifest: Combine per-arch images into multi-arch manifests
  # =============================================================================

  docker-manifest:
    name: Docker Manifest
    runs-on: ubuntu-24.04
    needs: [build-docker, build-gate]
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to registry
        uses: ./.github/actions/ghcr-login

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003  # v4.4.0

      - name: Create multi-arch manifests
        run: |
          set -euo pipefail
          for phase in ${VALIDATOR_PHASES}; do
            IMAGE="${VALIDATOR_IMAGE_PREFIX}/${phase}"
            docker buildx imagetools create \
              -t "${IMAGE}:${SCAN_TAG}" \
              "${IMAGE}:${SCAN_TAG}-amd64" \
              "${IMAGE}:${SCAN_TAG}-arm64"
          done
          docker buildx imagetools create \
            -t "${GATE_IMAGE}:${SCAN_TAG}" \
            "${GATE_IMAGE}:${SCAN_TAG}-amd64" \
            "${GATE_IMAGE}:${SCAN_TAG}-arm64"

  # =============================================================================
  # Scan: Vulnerability scan all images
  # =============================================================================

  scan:
    name: Scan (${{ matrix.image }})
    # The two NVSentinel NCCL check images (matrix.large) need about 28 GiB
    # while grype catalogs them (#3249). A 16 GiB ubuntu-24.04 runner runs out
    # of memory and gets killed with a shutdown signal; linux-amd64-cpu16
    # (NVIDIA self-hosted, 61 GiB) holds it in RAM.
    runs-on: ${{ matrix.large && 'linux-amd64-cpu16' || 'ubuntu-24.04' }}
    needs: [build-ko, docker-manifest]
    # 30, not 15: the NCCL check images take about five minutes on cpu16 but
    # ten or more wherever they get less memory, and a slow registry pull
    # adds to either. Matrix jobs get their own runner, so the larger budget
    # costs nothing for the images that finish in two.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        image:
          - ghcr.io/nvidia/aicr
          - ghcr.io/nvidia/aicrd
          - ghcr.io/nvidia/aicr-validators/deployment
          - ghcr.io/nvidia/aicr-validators/performance
          - ghcr.io/nvidia/aicr-validators/conformance
          - ghcr.io/nvidia/aicr-validators/aiperf-bench
          - ghcr.io/nvidia/aicr-gate
          # AICR does not build the images below. They ship only with the
          # opt-in nvsentinel-object-monitor (#2612), nvsentinel-preflight
          # (#2610), nvsentinel-nic-health-monitor, nvsentinel-slurm-drain-monitor
          # (#2611), remediation, nvsentinel-slinky-drainer (#2615),
          # nvsentinel-health-events-analyzer (#2618), nvsentinel-event-exporter
          # (#2621) and nvsentinel-log-collector (#2619) mixins, and no other job
          # scans a mixin-gated image, so nothing else would surface a CVE in
          # them.
          # Because they are not built by this workflow they carry their
          # upstream tag rather than SCAN_TAG -- see the overrides below.
          - ghcr.io/nvidia/nvsentinel/kubernetes-object-monitor
          - ghcr.io/nvidia/nvsentinel/preflight
          - ghcr.io/nvidia/nvsentinel/preflight-dcgm-diag
          - ghcr.io/nvidia/nvsentinel/preflight-nccl-loopback
          - ghcr.io/nvidia/nvsentinel/preflight-nccl-allreduce
          - ghcr.io/nvidia/nvsentinel/nic-health-monitor
          - ghcr.io/nvidia/nvsentinel/slurm-drain-monitor
          - ghcr.io/nvidia/nvsentinel/fault-quarantine
          - ghcr.io/nvidia/nvsentinel/node-drainer
          - ghcr.io/nvidia/nvsentinel/fault-remediation
          - ghcr.io/nvidia/nvsentinel/janitor
          - ghcr.io/nvidia/nvsentinel/janitor-provider
          - ghcr.io/nvidia/nvsentinel/gpu-reset
          - ghcr.io/nvidia/nvsentinel/slinky-drainer
          - ghcr.io/nvidia/nvsentinel/health-events-analyzer
          - ghcr.io/nvidia/nvsentinel/event-exporter
          - ghcr.io/nvidia/nvsentinel/log-collector
          - ghcr.io/nvidia/nvsentinel/file-server-cleanup
          # The nvsentinel-log-collector mixin's file server, at the nvsentinel
          # chart's own pins; its init container's busybox is the AICR pin
          # below. bitnamilegacy is Bitnami's frozen archive and is never
          # patched, so expect findings here.
          - docker.io/bitnamilegacy/nginx
          - quay.io/martinhelmich/prometheus-nginxlog-exporter
          # Percona, from the remediation mixins' separately bundled datastore
          # (psmdb-operator, nvsentinel-mongodb). Pinned by AICR, by digest.
          - docker.io/percona/percona-server-mongodb-operator
          - docker.io/percona/percona-server-mongodb
          - docker.io/percona/mongodb_exporter
          - docker.io/percona/percona-backup-mongodb
          - docker.io/percona/fluentbit
          - docker.io/percona/pmm-client
          # Third-party, pinned by AICR rather than the chart:
          # global.initContainerImage, used by chown/permission init
          # containers in the nic-health-monitor and audit-logging paths,
          # janitor-provider's generic reboot Job image, and the in-cluster
          # file server's init container. AICR overrides the chart's defaults
          # for all three -- the first in
          # recipes/components/nvsentinel/values.yaml, the second
          # (janitor-provider.csp.generic.rebootImage) in
          # recipes/mixins/nvsentinel-remediation.yaml, the third
          # (incluster-file-server.initImage) in
          # recipes/mixins/nvsentinel-log-collector.yaml -- so what is scanned
          # here is the override; keep them in step.
          - docker.io/library/busybox
        include:
          # Keep in lockstep with nvsentinel's defaultVersion in
          # recipes/registry.yaml; TestObjectMonitorImagePinnedEverywhere,
          # TestPreflightImagesPinnedEverywhere,
          # TestNICHealthMonitorImagePinnedEverywhere,
          # TestSlurmDrainMonitorImagePinnedEverywhere,
          # TestRemediationImagesPinnedEverywhere,
          # TestSlinkyDrainerImagePinnedEverywhere,
          # TestHealthEventsAnalyzerImagePinnedEverywhere,
          # TestEventExporterImagePinnedEverywhere and
          # TestLogCollectorImagesPinnedEverywhere fail if these drift apart.
          - image: ghcr.io/nvidia/nvsentinel/kubernetes-object-monitor
            tag: v1.28.0
          - image: ghcr.io/nvidia/nvsentinel/preflight
            tag: v1.28.0
          - image: ghcr.io/nvidia/nvsentinel/preflight-dcgm-diag
            tag: v1.28.0
          - image: ghcr.io/nvidia/nvsentinel/preflight-nccl-loopback
            tag: v1.28.0
            large: true
          - image: ghcr.io/nvidia/nvsentinel/preflight-nccl-allreduce
            tag: v1.28.0
            large: true
          - image: ghcr.io/nvidia/nvsentinel/nic-health-monitor
            tag: v1.28.0
          - image: ghcr.io/nvidia/nvsentinel/slurm-drain-monitor
            tag: v1.28.0
          - image: ghcr.io/nvidia/nvsentinel/fault-quarantine
            tag: v1.28.0
          - image: ghcr.io/nvidia/nvsentinel/node-drainer
            tag: v1.28.0
          - image: ghcr.io/nvidia/nvsentinel/fault-remediation
            tag: v1.28.0
          - image: ghcr.io/nvidia/nvsentinel/janitor
            tag: v1.28.0
          - image: ghcr.io/nvidia/nvsentinel/janitor-provider
            tag: v1.28.0
          - image: ghcr.io/nvidia/nvsentinel/gpu-reset
            tag: v1.28.0
          # Pinned by digest in recipes/components/slinky-drainer/manifests.
          - image: ghcr.io/nvidia/nvsentinel/slinky-drainer
            tag: v1.28.0@sha256:bf6ccaf1d6c035aa5f86e70a929dc6d9a18c5c05b10104d23c69aacff35bcb14
          - image: ghcr.io/nvidia/nvsentinel/health-events-analyzer
            tag: v1.28.0
          - image: ghcr.io/nvidia/nvsentinel/event-exporter
            tag: v1.28.0
          - image: ghcr.io/nvidia/nvsentinel/log-collector
            tag: v1.28.0
          - image: ghcr.io/nvidia/nvsentinel/file-server-cleanup
            tag: v1.28.0
          # The nvsentinel chart's own pins for the file server's third-party
          # images. The weekly TestNVSentinelLogCollectorChartRender fails if a
          # chart bump moves them; TestLogCollectorImagesPinnedEverywhere then
          # keeps this list, the mirror lane and the docs on the new tags.
          - image: docker.io/bitnamilegacy/nginx
            tag: 1.27.2-debian-12-r2
          - image: quay.io/martinhelmich/prometheus-nginxlog-exporter
            tag: v1.10.0
          # AICR's own pins in recipes/components/{psmdb-operator,nvsentinel-mongodb};
          # TestRemediationImagesPinnedEverywhere fails if these drift apart.
          - image: docker.io/percona/percona-server-mongodb-operator
            tag: 1.23.1@sha256:78c87b933e184b9af36dbb0078751862c75934c1521c33d3be4d0a38aa58dd0a
          - image: docker.io/percona/percona-server-mongodb
            tag: 8.0.32-14@sha256:5ba5f240d2dc98bc6236ab1d79c0862c4b62dba9d98cd0ffdf716c30473d2d11
          - image: docker.io/percona/mongodb_exporter
            tag: 0.54.0@sha256:934e9db87e85e0fa63654e73c3504845993a254e898783ca905e65a68848b5a4
          - image: docker.io/percona/percona-backup-mongodb
            tag: 2.15.0@sha256:12dcba7f1b55e00eb1b49dac51427d942c221b826d621d6bfad926a9d959a7c5
          - image: docker.io/percona/fluentbit
            tag: 5.1.2-1@sha256:4926d7d003ca09c826a3dea5d9ccd0ba158296880471bcec82ef38f95617b913
          - image: docker.io/percona/pmm-client
            tag: 3.9.1@sha256:298e731652e2be172a2505596edaee1e0c014609035347599048f62efae78e5b
          # Versioned independently of the nvsentinel chart -- this comes from
          # AICR's values override, not the chart's appVersion, so it does
          # not move with defaultVersion. Digest-pinned, so the tag is only
          # there to read; grype resolves the digest.
          - image: docker.io/library/busybox
            tag: 1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to registry
        uses: ./.github/actions/ghcr-login

      - name: Scan container image
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        with:
          # matrix.tag is set only for images this workflow does not build,
          # which carry their upstream version instead of SCAN_TAG.
          # Large images are read straight from the registry, which halves
          # the scan time: through the docker daemon they land on disk three
          # times (pull, save, extract).
          image: '${{ matrix.large && ''registry:'' || '''' }}${{ matrix.image }}:${{ matrix.tag || env.SCAN_TAG }}'
          severity-cutoff: 'high'
          output-format: json
          only-fixed: true
          fail-build: false
          config: .grype.yaml
          # OpenVEX statements with per-CVE reachability evidence for
          # aiperf-bench suppressions. Grype applies statements only to
          # products whose PURL matches, so this is a no-op for the other
          # images in the matrix.
          vex: .openvex.json

      - name: Extract severity counts and IDs
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          JSON_FILE="${{ steps.scan.outputs.json }}"
          SHORT_NAME="${IMAGE##*/}"
          mkdir -p scan-results
          OUT="scan-results/${SHORT_NAME}.txt"

          # grype killed by a signal can leave the scan step green with no
          # output. Fail the leg so the summary reports it as incomplete
          # instead of counting the image as clean.
          if [[ ! -f "${JSON_FILE}" ]]; then
            echo "::error::${SHORT_NAME}: scan output missing"
            exit 1
          fi

          # Severity counts from non-suppressed matches.
          CRITICAL=$(jq '[.matches[] | select(.vulnerability.severity == "Critical")] | length' "${JSON_FILE}")
          HIGH=$(jq '[.matches[] | select(.vulnerability.severity == "High")] | length' "${JSON_FILE}")
          MEDIUM=$(jq '[.matches[] | select(.vulnerability.severity == "Medium")] | length' "${JSON_FILE}")
          LOW=$(jq '[.matches[] | select(.vulnerability.severity == "Low")] | length' "${JSON_FILE}")
          NEGLIGIBLE=$(jq '[.matches[] | select(.vulnerability.severity == "Negligible")] | length' "${JSON_FILE}")
          # ignoredMatches conflates grype's internal filters with VEX
          # suppressions, so report VEX hits separately to make it
          # obvious when a statement actually applied.
          VEX_APPLIED=$(jq '[.ignoredMatches[]? | select((.appliedIgnoreRules // []) | any(.namespace == "vex"))] | length' "${JSON_FILE}")

          # HIGH+ identifiers for triage. Emits primary ID (often a GHSA)
          # plus any related CVE aliases so reviewers can cross-reference
          # NVD without re-running the scan.
          HIGH_IDS=$(jq -r '
            [ .matches[]
              | select(.vulnerability.severity == "High" or .vulnerability.severity == "Critical")
              | (.artifact.name + " " + .vulnerability.id
                 + ( (.relatedVulnerabilities // [] | map(.id) | join(","))
                     | if . == "" then "" else " (" + . + ")" end )) ]
            | join(", ")' "${JSON_FILE}")

          {
            echo "${SHORT_NAME}: ${CRITICAL} critical, ${HIGH} high, ${MEDIUM} medium, ${LOW} low, ${NEGLIGIBLE} negligible (${VEX_APPLIED} VEX-suppressed)"
            if [[ "${CRITICAL}" -gt 0 || "${HIGH}" -gt 0 ]]; then
              echo "  HIGH+: ${HIGH_IDS}"
            fi
          } > "${OUT}"
          cat "${OUT}"

      - name: Upload scan result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: scan-${{ strategy.job-index }}
          path: scan-results/
          retention-days: 1

  # =============================================================================
  # Notify: Post scan results to Slack (on critical/high findings or incomplete scans)
  # =============================================================================

  notify:
    name: Slack Notification
    runs-on: ubuntu-24.04
    needs: [scan]
    # !cancelled(), not needs.scan.result: a single leg that hits its
    # timeout concludes as cancelled and would otherwise skip the summary.
    if: ${{ !cancelled() }}
    timeout-minutes: 5
    permissions:
      contents: read
      # actions: read -- lists this run's scan jobs so a leg that died
      # before uploading its artifact is reported instead of omitted.
      actions: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download all scan results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: scan-*
          merge-multiple: true
          path: scan-results

      - name: Post to Slack
        env:
          GH_TOKEN: ${{ github.token }}
          SLACK_SERVICE: ${{ secrets.SLACK_SERVICE }}
          # Scheduled runs always post; manual runs post only when the
          # notify_slack input is set. The message is echoed to the logs
          # either way, so manual runs can validate findings without Slack.
          POST_SLACK: ${{ github.event_name == 'schedule' || inputs.notify_slack }}
          SHA: ${{ github.sha }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SCAN_RESULT: ${{ needs.scan.result }}
        run: |
          set -euo pipefail
          SHORT_SHA="${SHA:0:7}"
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M')
          RUN_URL="${SERVER}/${REPO}/actions/runs/${RUN_ID}"

          # Aggregate critical and high counts across all images
          TOTAL_CRITICAL=0
          TOTAL_HIGH=0
          for f in scan-results/*.txt; do
            [[ -f "$f" ]] || continue
            HEADER=$(head -1 "$f")
            # Parse counts from the header line only so trailing ID lines
            # never contaminate the totals.
            C=$(echo "${HEADER}" | grep -oP '\d+(?= critical)' || echo 0)
            H=$(echo "${HEADER}" | grep -oP '\d+(?= high)' || echo 0)
            TOTAL_CRITICAL=$((TOTAL_CRITICAL + C))
            TOTAL_HIGH=$((TOTAL_HIGH + H))
          done

          # A leg that dies before its upload step leaves no artifact, so
          # the loop above cannot see it. Ask the API which scan jobs in this
          # attempt did not succeed and report each one as incomplete. A
          # failed lookup is reported too, rather than ending the step before
          # the findings above are posted.
          if ! INCOMPLETE=$(gh api --paginate \
            "repos/${REPO}/actions/runs/${RUN_ID}/attempts/${RUN_ATTEMPT}/jobs?per_page=100" \
            --jq '.jobs[]
              | select(.name | startswith("Scan ("))
              | select(.conclusion != "success" and .conclusion != "skipped")
              | "\(.name | ltrimstr("Scan (") | rtrimstr(")") | split("/") | last): scan did not complete (\(.conclusion))"'); then
            INCOMPLETE="scan completion status unavailable (jobs API lookup failed)"
          fi
          # A failed build or manifest job skips the whole scan matrix. No
          # leg is skipped on its own, so the lookup above leaves skipped
          # jobs out and this reports the matrix once.
          if [[ "${SCAN_RESULT}" == "skipped" ]]; then
            INCOMPLETE="${INCOMPLETE}"$'\n'"no image was scanned: an image build or manifest job failed"
          fi
          INCOMPLETE_COUNT=0
          while IFS= read -r line; do
            [[ -n "${line}" ]] || continue
            INCOMPLETE_COUNT=$((INCOMPLETE_COUNT + 1))
          done <<< "${INCOMPLETE}"

          # One line per image with findings, naming its first five distinct
          # advisory IDs; the clean images collapse into one line. The full
          # lists stay in the run's scan-* artifacts.
          RESULTS=$(tools/vuln-scan-summary scan-results <<< "${INCOMPLETE}")

          # Notify when critical or high vulnerabilities are found, or when
          # a scan did not complete and its image went unchecked.
          if [[ "${TOTAL_CRITICAL}" -eq 0 && "${TOTAL_HIGH}" -eq 0 && "${INCOMPLETE_COUNT}" -eq 0 ]]; then
            echo "No critical or high vulnerabilities found, skipping Slack notification"
            printf 'Vulnerability Scan: %s (%s)\n%s\n' "${TIMESTAMP}" "${SHORT_SHA}" "${RESULTS}"
            exit 0
          fi

          MESSAGE=$(printf 'Vulnerability Scan: %s (%s)\n%s\n<%s|Full findings in the run>' \
            "${TIMESTAMP}" "${SHORT_SHA}" "${RESULTS}" "${RUN_URL}")

          # Always echo the message so the run logs carry the findings,
          # then post to Slack only when enabled for this trigger.
          echo "${MESSAGE}"

          if [[ "${POST_SLACK}" != "true" ]]; then
            echo "Slack notification disabled for this run (POST_SLACK=${POST_SLACK}); skipping post"
          elif [[ -n "${SLACK_SERVICE}" ]]; then
            jq -n --arg text "${MESSAGE}" '{text: $text}' | curl -sSf -X POST \
              -H 'Content-type: application/json' \
              --data @- \
              "https://hooks.slack.com/services/${SLACK_SERVICE}"
          else
            echo "SLACK_SERVICE not set, skipping notification"
          fi

  # =============================================================================
  # Cleanup: Delete all scan-* images from GHCR (always runs)
  # =============================================================================

  cleanup:
    name: Cleanup Scan Images
    runs-on: ubuntu-24.04
    needs: [notify]
    if: always()
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Delete scan images
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # All image paths to clean up (org-level packages)
          IMAGES=(
            "nvidia/aicr"
            "nvidia/aicrd"
            "nvidia/aicr-validators/deployment"
            "nvidia/aicr-validators/performance"
            "nvidia/aicr-validators/conformance"
            "nvidia/aicr-validators/aiperf-bench"
            "nvidia/aicr-gate"
          )

          for IMAGE in "${IMAGES[@]}"; do
            # URL-encode the package name (slashes become %2F)
            PKG_NAME=$(echo "${IMAGE}" | sed 's|/|%2F|g')

            echo "Cleaning ${IMAGE}..."

            # List versions matching the scan tag
            VERSIONS=$(gh api \
              "orgs/NVIDIA/packages/container/${PKG_NAME}/versions?per_page=100" \
              --jq ".[] | select(.metadata.container.tags | any(startswith(\"${SCAN_TAG}\"))) | .id" \
              2>/dev/null || true)

            for VID in ${VERSIONS}; do
              echo "  Deleting version ${VID}"
              gh api \
                --method DELETE \
                "orgs/NVIDIA/packages/container/${PKG_NAME}/versions/${VID}" \
                2>/dev/null || true
            done
          done
