name: On Tag Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'  # Semantic versioning with optional pre-release suffix (e.g., v1.2.3-rc1)

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  VALIDATOR_IMAGE_PREFIX: ghcr.io/nvidia/aicr-validators
  # Keep in sync with build-docker matrix.phase. `aiperf-bench` is an ancillary
  # benchmark runner image (not a Go validator binary) used by the
  # inference-perf check.
  VALIDATOR_PHASES: "deployment performance conformance aiperf-bench"
  # Readiness-gate image (gate CLI only; assertions run in-process via
  # pkg/chainsaw since #2038 dropped the embedded chainsaw binary). Built like a validator
  # — native per-arch Dockerfile build, multi-arch manifest, scan, attest — but
  # under its own repo path, not aicr-validators/. See #904.
  GATE_IMAGE: ghcr.io/nvidia/aicr-gate
  EXPECTED_PLATFORMS: "linux/amd64 linux/arm64"

jobs:

  # =============================================================================
  # Detect: Determine if this is a pre-release tag
  # =============================================================================

  detect:
    name: Detect Release Type
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions:
      contents: read
    outputs:
      is_prerelease: ${{ steps.check.outputs.is_prerelease }}
      candidate_tag: ${{ steps.check.outputs.candidate_tag }}
    steps:
      - name: Check tag for pre-release suffix
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The operator's release builds accept only these tags
          # (pkg/operator/version), and a failing operator blocks the release.
          SEMVER_TAG_PATTERN='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.?(0|[1-9][0-9]*))?$'
          if [[ ! "${TAG}" =~ ${SEMVER_TAG_PATTERN} ]]; then
            echo "::error::release tag is not vX.Y.Z or vX.Y.Z-(alpha|beta|rc)N: ${TAG}"
            exit 1
          fi
          CANDIDATE_TAG="candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ ! "${CANDIDATE_TAG}" =~ ^candidate-[0-9]+-[0-9]+$ ]]; then
            echo "::error::generated candidate tag is invalid"
            exit 1
          fi
          echo "candidate_tag=${CANDIDATE_TAG}" >> "$GITHUB_OUTPUT"
          if [[ "${TAG}" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Pre-release detected: ${TAG}"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Stable release: ${TAG}"
          fi

  # =============================================================================
  # Test Jobs (reusable workflow — same suite as on-push.yaml)
  # =============================================================================

  tests:
    uses: ./.github/workflows/qualification.yaml
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write

  # =============================================================================
  # Build Job: GoReleaser (binaries, ko images, draft GitHub release)
  # =============================================================================

  build-ko:
    name: Build and Release (Draft)
    runs-on: ubuntu-24.04
    needs: [detect, tests]
    timeout-minutes: 30
    outputs:
      homebrew_artifact_name: ${{ steps.homebrew-artifact.outputs.name }}
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # Full history for changelog generation
          persist-credentials: false

      - name: Initialize release module cache
        shell: bash
        run: echo "GOMODCACHE=${RUNNER_TEMP}/aicr-release-modcache" >> "$GITHUB_ENV"

      - name: Load versions
        id: versions
        uses: ./.github/actions/load-versions

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ steps.versions.outputs.go }}
          # This download is the release's proxy-coverage measurement. Restoring
          # GOMODCACHE here would let it pass without contacting Artifactory.
          cache: false

      # This is the step that makes "release dependencies flow through
      # Artifactory" literally true. Before #2374 it could not be: the release
      # built from committed vendor/ and contacted no proxy at all.
      #
      # Placement is deliberate and is the whole ballgame. It must precede the
      # FIRST `go` command that touches application dependencies, which is the
      # `go run ./cmd/aicr` inside generate-slsa-predicate below — not just the
      # goreleaser build. Configure it any later and that earlier command warms
      # the module cache from the public proxy, the release build then finds
      # everything cached, and a green run proves nothing about coverage. That
      # is the same zero-fetch false pass the retired probe workflow existed to
      # catch.
      #
      # The cost of ordering it here used to be that the `go install` in
      # install-go-licenses (inside go-build-release) resolved a module the warm
      # cache did not cover. #2667 removed that: go-licenses is now built from
      # the main module, so `go mod download` above covers it and the build needs
      # no fetch at all. Every other release tool — ko, syft, goreleaser, crane,
      # helm — comes from a GitHub release over curl and never touches GOPROXY.
      - name: Configure the DGXC Go proxy
        uses: ./.github/actions/setup-dgxc-goproxy
        with:
          mode: enforced

      # Carried over from the probe workflow, which #2374 deleted. It is the one
      # assertion a real build cannot replace: if the action silently no-ops, or
      # someone reverts it to `routed`, every build below still goes green while
      # resolving from the public internet. GOPROXY is an ordered list consulted
      # left to right on 404/410, so a second entry of any kind is a fallthrough.
      - name: Assert the proxy is actually in front
        shell: bash
        run: |
          set -euo pipefail
          proxy="$(go env GOPROXY)"
          echo "GOPROXY=${proxy}"
          expected="https://edge.urm.nvidia.com/artifactory/api/go/dgxc-go-virtual"
          [ "${proxy}" = "${expected}" ] \
            || { echo "::error::GOPROXY is '${proxy}', expected exactly '${expected}'"; exit 1; }
          case "${proxy}" in
            *,*|*"|"*) echo "::error::GOPROXY has a fallback entry ('${proxy}'); this is not enforced"; exit 1 ;;
          esac
          [ "$(go env GOSUMDB)" != off ] \
            || { echo "::error::GOSUMDB=off; modules would not be verified against the transparency log"; exit 1; }
          echo "OK: Artifactory is the only GOPROXY entry and GOSUMDB is intact"

      # Deliberately immediate, and the reason is the credential's lifetime.
      #
      # The OIDC-minted Artifactory token is good for ~15 minutes. This job has a
      # 30-minute budget and does a lot between here and the goreleaser build:
      # install cosign, run the SLSA predicate generator, download six release
      # tools, then cross-build six binaries with cosign attestation hooks that
      # retry with backoff. A module fetch that lands late in that sequence would
      # meet an expired token and fail the release with a 401 — intermittently,
      # which is the worst way to find out.
      #
      # Pulling the whole graph here removes the dependency on timing entirely:
      # every later `go` command in this job resolves from a warm module cache
      # and needs no credential at all. Everything that MUST happen inside the
      # 15-minute window is therefore this one step.
      #
      # It doubles as the coverage measurement. With a single-entry GOPROXY,
      # completing this download means every application dependency came from
      # Artifactory — there is nowhere else it could have come from.
      #
      # The action logs the real `expires_in` from the exchange, so the window is
      # observable in the run log rather than assumed.
      - name: Warm the module cache through the proxy
        shell: bash
        run: |
          set -euo pipefail
          go mod download
          echo "OK: application dependency graph resolved through Artifactory"

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3
        with:
          # Pin from .settings.yaml (>= v3.1.0) so cosign logs DSSE attestations
          # to Rekor v2 as hashedrekord/PAE. The installer default (v3.0.6) writes
          # the legacy dsse entry type, which sigstore-go cannot verify. See #1650.
          cosign-release: ${{ steps.versions.outputs.cosign }}

      - name: Generate SLSA predicate
        uses: ./.github/actions/generate-slsa-predicate
        with:
          workflow_file: on-tag.yaml

      # Re-mint rather than reuse. The straggler this was originally added for
      # is gone: #2667 moved go-licenses from `go install` -- which resolved its
      # own module outside the warm cache -- to a `go build` from the main
      # module, whose graph the `go mod download` above already covers. Measured
      # on a cold module cache, `go mod download` followed by `go build` of both
      # go-licenses and apidiff succeeds with GOPROXY=off.
      #
      # Kept because the step below still resolves through the proxy under
      # `enforced` mode on any cache miss -- goreleaser cross-builds six
      # binaries here -- and by this point the original token may be past its
      # ~15-minute lifetime, where a 401 would fail the release intermittently.
      #
      # This is safe and cheap. GitHub's OIDC request credential
      # (ACTIONS_ID_TOKEN_REQUEST_URL/_TOKEN) is available for the life of the
      # job, so the action can exchange for a fresh Artifactory token as often as
      # needed — no extra permission, no stored secret. Re-running it just
      # rewrites the same GITHUB_ENV entries and overwrites the helper file, so
      # it is idempotent; the teardown step at the end of the job still removes
      # exactly one credential.
      - name: Refresh the proxy credential
        uses: ./.github/actions/setup-dgxc-goproxy
        with:
          mode: enforced

      # Stable tags only: pin the tag GoReleaser releases, and start the release
      # notes at the previous STABLE tag.
      #
      # Current tag (#3289). GoReleaser reads it from GORELEASER_CURRENT_TAG and,
      # when that is unset, takes the first line of
      # `git tag --points-at HEAD --sort -version:refname`. After
      # `make bump-promote` the GA tag and its RC tag point at the same commit,
      # and git version-sorts v1.3.0-rc2 ahead of v1.3.0, so an unpinned GA run
      # would be built, versioned, and published as the RC. Pin it to the tag
      # that triggered this run. The `detect` job has already required it to be
      # valid SemVer. This is written first so no early exit below can skip it.
      #
      # Previous tag. GoReleaser picks it with
      # `git describe --tags --abbrev=0 tags/<tag>^`, which counts pre-release
      # tags. With an RC of this version still on the remote, the RC on an
      # earlier commit becomes the base of the `changelog.use: github` compare
      # and the GA notes list only the changes since that RC.
      # GORELEASER_PREVIOUS_TAG overrides that lookup. The exclusion matches
      # tools/changelog, which also skips pre-release tags (any tag with a
      # hyphen).
      #
      # Pre-releases are left alone: an RC's notes still cover the changes since
      # the previous tag of any kind, so rc2 lists what landed after rc1.
      #
      # GITHUB_ENV is inherited by the steps of the composite action below,
      # which is where `make release` runs goreleaser.
      - name: Pin the release tag and the previous stable tag
        if: needs.detect.outputs.is_prerelease == 'false'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "GORELEASER_CURRENT_TAG=${TAG}" >> "${GITHUB_ENV}"
          if ! previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' "refs/tags/${TAG}^")"; then
            echo "::notice::no stable tag precedes ${TAG}; leaving the previous tag to GoReleaser"
            exit 0
          fi
          if [[ ! "${previous}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::previous stable tag is not a plain SemVer tag: ${previous}"
            exit 1
          fi
          echo "GORELEASER_PREVIOUS_TAG=${previous}" >> "${GITHUB_ENV}"
          echo "Releasing ${TAG}; release notes start at ${previous}"

      - name: Build and Release
        id: release
        uses: ./.github/actions/go-build-release
        with:
          ko_version: ${{ steps.versions.outputs.ko }}
          goreleaser_version: ${{ steps.versions.outputs.goreleaser }}
          go_licenses_version: ${{ steps.versions.outputs.go_licenses }}
          candidate_tag: ${{ needs.detect.outputs.candidate_tag }}

      - name: Malware Scan Release Binaries
        if: steps.release.outcome == 'success'
        uses: ./.github/actions/malware-scan
        with:
          scan_path: dist/
          category: 'clamav-release-binaries'

      # Inline by design: these single-use steps bridge GoReleaser's local
      # formula into a rerun-safe artifact for the post-publication job.
      - name: Name Homebrew artifact
        id: homebrew-artifact
        if: steps.release.outcome == 'success' && needs.detect.outputs.is_prerelease == 'false'
        shell: bash
        env:
          CANDIDATE_TAG: ${{ needs.detect.outputs.candidate_tag }}
        run: |
          set -euo pipefail
          if [[ ! "${CANDIDATE_TAG}" =~ ^candidate-[0-9]+-[0-9]+$ || \
            ! "${GITHUB_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::invalid Homebrew artifact identity"
            exit 1
          fi
          echo "name=aicr-homebrew-formula-${CANDIDATE_TAG}-attempt-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Stage Homebrew formula
        if: steps.release.outcome == 'success' && needs.detect.outputs.is_prerelease == 'false'
        shell: bash
        run: |
          set -euo pipefail
          formula="$(jq -er \
            '[.[] | select(.type == "Homebrew Formula")] |
             if length == 1 then .[0].path else error("expected exactly one Homebrew Formula artifact") end' \
            dist/artifacts.json)"
          if [[ "${formula}" == *$'\n'* || "${formula}" == *$'\r'* || ! -f "${formula}" || -L "${formula}" ]]; then
            echo "::error::Homebrew formula artifact path is malformed"
            exit 1
          fi
          formula_path="$(realpath -e -- "${formula}")"
          dist_path="$(realpath -e -- dist)"
          case "${formula_path}" in
            "${dist_path}"/*) ;;
            *)
              echo "::error::refusing Homebrew formula outside dist"
              exit 1
              ;;
          esac
          install -m 0600 "${formula_path}" /tmp/aicr.rb

      - name: Upload Homebrew formula
        if: steps.release.outcome == 'success' && needs.detect.outputs.is_prerelease == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ steps.homebrew-artifact.outputs.name }}
          path: /tmp/aicr.rb
          if-no-files-found: error
          # GitHub permits rerunning a workflow for 30 days. Keep the only
          # generated formula available for that full recovery window.
          retention-days: 30

      # Required, not tidy, and deliberately last. setup-dgxc-goproxy writes a
      # GOAUTH helper holding a live Artifactory bearer token to $RUNNER_TEMP,
      # and composite actions get no teardown hook — so until this runs, every
      # later step in this job can read a valid credential. `if: always()` so a
      # failed release still cleans up.
      - name: Remove the proxy credential
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/dgxc-goauth"

  # =============================================================================
  # Docker Jobs: Native per-arch validator builds (parallel with GoReleaser)
  # =============================================================================

  build-docker:
    name: Docker Validator (${{ matrix.phase }}/${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [detect, tests]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        phase: [deployment, performance, conformance, aiperf-bench]  # keep in sync with VALIDATOR_PHASES
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
          # Ancillary (non-Go-validator) images override the default
          # validators/<phase>/Dockerfile path and image title.
          - phase: aiperf-bench
            dockerfile: validators/performance/aiperf-bench.Dockerfile
            image_title: aicr-aiperf-bench
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize release module cache
        shell: bash
        run: echo "GOMODCACHE=${RUNNER_TEMP}/aicr-release-modcache" >> "$GITHUB_ENV"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003  # v4.4.0

      - name: Authenticate to registry
        uses: ./.github/actions/ghcr-login

      - name: Load versions
        id: versions
        uses: ./.github/actions/load-versions

      - name: Setup Go
        if: matrix.phase != 'aiperf-bench'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ steps.versions.outputs.go }}
          # A restored public-proxy module cache would put this release image
          # outside the enforced Artifactory path without any visible failure.
          cache: false

      - name: Configure the DGXC Go proxy
        if: matrix.phase != 'aiperf-bench'
        uses: ./.github/actions/setup-dgxc-goproxy
        with:
          mode: enforced

      - name: Assert the proxy is actually in front
        if: matrix.phase != 'aiperf-bench'
        shell: bash
        run: |
          set -euo pipefail
          proxy="$(go env GOPROXY)"
          expected="https://edge.urm.nvidia.com/artifactory/api/go/dgxc-go-virtual"
          if [[ "${proxy}" != "${expected}" || "$(go env GOSUMDB)" == off ]]; then
            echo "::error::release validator dependencies are not using the enforced proxy"
            exit 1
          fi

      - name: Build validator binary
        if: matrix.phase != 'aiperf-bench'
        shell: bash
        env:
          VALIDATOR_ARCHES: ${{ matrix.arch }}
          VALIDATOR_PHASES: ${{ matrix.phase }}
        run: ./tools/build-validator-binaries

      - name: Remove the proxy credential
        if: always() && matrix.phase != 'aiperf-bench'
        shell: bash
        run: rm -f "${RUNNER_TEMP}/dgxc-goauth"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile || format('validators/{0}/Dockerfile', matrix.phase) }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.VALIDATOR_IMAGE_PREFIX }}/${{ matrix.phase }}:${{ needs.detect.outputs.candidate_tag }}-${{ matrix.arch }}
          provenance: false
          # aiperf-bench builds without the layer cache on purpose (#2086).
          # Its requirements.txt is deliberately unpinned so each rebuild
          # resolves patched transitive versions, but `pip install` is opaque
          # to BuildKit: neither the base image nor the COPY'd requirements.txt
          # changes between releases, so a cache hit replays the old closure
          # verbatim and the image silently stops picking up CVE fixes. The Go
          # validators have no resolution step, so they keep the cache.
          cache-from: ${{ matrix.phase != 'aiperf-bench' && 'type=gha' || '' }}
          cache-to: ${{ matrix.phase != 'aiperf-bench' && 'type=gha,mode=max' || '' }}
          labels: |
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.title=${{ matrix.image_title || format('aicr-validator-{0}', matrix.phase) }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  # =============================================================================
  # Gate Job: native per-arch readiness-gate image (gate CLI only)
  # =============================================================================

  build-gate:
    name: Docker Gate (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [detect, tests]
    timeout-minutes: 15
    # contents: read to checkout the source for the docker build; packages:
    # write to push the per-arch aicr-gate image to GHCR (ghcr.io/nvidia/aicr-gate).
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize release module cache
        shell: bash
        run: echo "GOMODCACHE=${RUNNER_TEMP}/aicr-release-modcache" >> "$GITHUB_ENV"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003  # v4.4.0

      - name: Authenticate to registry
        uses: ./.github/actions/ghcr-login

      # Go version comes from the repo's single source of truth
      # (.go-version / .settings.yaml). The gate image embeds no chainsaw
      # binary since #2038 — assertions run in-process via pkg/chainsaw.
      - name: Load versions
        id: versions
        uses: ./.github/actions/load-versions

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ steps.versions.outputs.go }}
          # Compilation itself is the proxy-coverage measurement for this image.
          cache: false

      # The gate binary is compiled here rather than in a Dockerfile builder
      # stage, because a BuildKit stage cannot reach this proxy — see the header
      # of cmd/gate/Dockerfile for why. Compiling on the runner is what makes the
      # gate image's dependencies actually flow through Artifactory.
      - name: Configure the DGXC Go proxy
        uses: ./.github/actions/setup-dgxc-goproxy
        with:
          mode: enforced

      - name: Assert the proxy is actually in front
        shell: bash
        run: |
          set -euo pipefail
          proxy="$(go env GOPROXY)"
          echo "GOPROXY=${proxy}"
          expected="https://edge.urm.nvidia.com/artifactory/api/go/dgxc-go-virtual"
          [ "${proxy}" = "${expected}" ] \
            || { echo "::error::GOPROXY is '${proxy}', expected exactly '${expected}'"; exit 1; }
          case "${proxy}" in
            *,*|*"|"*) echo "::error::GOPROXY has a fallback entry ('${proxy}'); this is not enforced"; exit 1 ;;
          esac
          [ "$(go env GOSUMDB)" != off ] \
            || { echo "::error::GOSUMDB=off; modules would not be verified against the transparency log"; exit 1; }
          echo "OK: Artifactory is the only GOPROXY entry and GOSUMDB is intact"

      # GOARCH is set explicitly even though each matrix leg runs on a native
      # runner. It costs nothing and keeps the artifact correct if the runner
      # mapping above is ever changed to cross-build.
      - name: Build the gate binary
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=linux GOARCH="${TARGET_ARCH}" go build -trimpath \
            -ldflags="-s -w -extldflags '-static' -X main.version=${VERSION}" \
            -o dist/gate ./cmd/gate
          file dist/gate

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: cmd/gate/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.GATE_IMAGE }}:${{ needs.detect.outputs.candidate_tag }}-${{ matrix.arch }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.title=aicr-gate
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # See the matching step in build-ko: the GOAUTH helper holds a live
      # Artifactory bearer token and composite actions get no teardown hook, so
      # this has to be explicit and last.
      - name: Remove the proxy credential
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/dgxc-goauth"

  # =============================================================================
  # Docker Manifest: Combine per-arch images into multi-arch manifests
  # =============================================================================

  docker-manifest:
    name: Docker Manifest
    runs-on: ubuntu-24.04
    needs: [detect, build-docker, build-gate]
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to registry
        uses: ./.github/actions/ghcr-login

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003  # v4.4.0

      # Inline by design: this job creates only run-unique candidate manifests.
      # The shared docker-manifest action also writes public aliases, which must
      # remain behind the scan and attestation gates.
      - name: Create candidate manifests
        env:
          CANDIDATE_TAG: ${{ needs.detect.outputs.candidate_tag }}
        run: |
          set -euo pipefail
          IMAGES=()
          for phase in ${VALIDATOR_PHASES}; do IMAGES+=("${VALIDATOR_IMAGE_PREFIX}/${phase}"); done
          IMAGES+=("${GATE_IMAGE}")
          for IMAGE in "${IMAGES[@]}"; do
            docker buildx imagetools create \
              -t "${IMAGE}:${CANDIDATE_TAG}" \
              "${IMAGE}:${CANDIDATE_TAG}-amd64" \
              "${IMAGE}:${CANDIDATE_TAG}-arm64"
          done

      - name: Verify multi-arch manifests
        env:
          CANDIDATE_TAG: ${{ needs.detect.outputs.candidate_tag }}
        run: |
          set -euo pipefail
          IMAGES=()
          for phase in ${VALIDATOR_PHASES}; do IMAGES+=("${VALIDATOR_IMAGE_PREFIX}/${phase}"); done
          IMAGES+=("${GATE_IMAGE}")
          for IMAGE in "${IMAGES[@]}"; do
            MANIFEST=$(docker buildx imagetools inspect --raw "${IMAGE}:${CANDIDATE_TAG}")

            PLATFORMS=$(echo "${MANIFEST}" | jq -r \
              '[.manifests[] | select(.platform.os != "unknown") | "\(.platform.os)/\(.platform.architecture)"] | sort | .[]')

            for expected in ${EXPECTED_PLATFORMS}; do
              if ! echo "${PLATFORMS}" | grep -qx "${expected}"; then
                echo "::error::${IMAGE}:${CANDIDATE_TAG} missing platform ${expected}"
                exit 1
              fi
            done

            if echo "${MANIFEST}" | jq -e '.manifests[] | select(.platform.os == "unknown")' >/dev/null 2>&1; then
              echo "::error::${IMAGE}:${CANDIDATE_TAG} contains unknown/unknown descriptor"
              exit 1
            fi
          done

  # =============================================================================
  # Resolve Candidates: one authoritative digest map for every downstream gate
  # =============================================================================

  resolve-candidates:
    name: Resolve Candidate Digests
    runs-on: ubuntu-24.04
    needs: [detect, build-ko, docker-manifest]
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      digest_map: ${{ steps.resolve.outputs.digest_map }}
      aicr_image: ${{ steps.aicr.outputs.image }}
      aicr_validator_images: ${{ steps.aicr.outputs.validator_images }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Load versions
        id: versions
        uses: ./.github/actions/load-versions

      - name: Authenticate to registry
        uses: ./.github/actions/ghcr-login

      - name: Setup crane
        uses: ./.github/actions/setup-build-tools
        with:
          install_crane: 'true'
          crane_version: ${{ steps.versions.outputs.crane }}

      - name: Resolve and validate candidates
        id: resolve
        env:
          CANDIDATE_TAG: ${{ needs.detect.outputs.candidate_tag }}
          RELEASE_TAG: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          AICR_NETWORK_TIMEOUT_SECONDS: '120'
        run: |
          set -euo pipefail
          .github/scripts/release-images.sh resolve candidate-digests.json
          digest_map="$(jq -cS . candidate-digests.json)"
          echo "digest_map=${digest_map}" >> "$GITHUB_OUTPUT"

      # The operator chart defaults to this tag's AICR (#3560), pinned by the
      # digests resolved above rather than by reading the tags again.
      - name: Pin the operator's AICR images
        id: aicr
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          pin() {
            local digest
            digest="$(jq -er --arg key "$1" '.[$key]' candidate-digests.json)"
            [[ "${digest}" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error::no digest for $1 in the digest map" >&2; return 1; }
            printf '%s:%s@%s' "$2" "${RELEASE_TAG}" "${digest}"
          }
          image="$(pin aicr ghcr.io/nvidia/aicr)"
          deployment="$(pin deployment ghcr.io/nvidia/aicr-validators/deployment)"
          conformance="$(pin conformance ghcr.io/nvidia/aicr-validators/conformance)"
          performance="$(pin performance ghcr.io/nvidia/aicr-validators/performance)"
          {
            echo "image=${image}"
            echo "validator_images=${deployment},${conformance},${performance}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload candidate digest map
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-candidate-digests-${{ needs.detect.outputs.candidate_tag }}-attempt-${{ github.run_attempt }}
          path: candidate-digests.json
          if-no-files-found: error
          retention-days: 14

  # =============================================================================
  # Container Image Vulnerability Scan (runs after all images are built)
  # =============================================================================

  image-vuln-scan:
    name: Image Vuln Scan (${{ matrix.image.key }}/${{ matrix.platform.arch }})
    runs-on: ubuntu-24.04
    needs: [resolve-candidates]
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - key: aicr
            ref: ghcr.io/nvidia/aicr
          - key: aicrd
            ref: ghcr.io/nvidia/aicrd
          - key: deployment
            ref: ghcr.io/nvidia/aicr-validators/deployment
          - key: performance
            ref: ghcr.io/nvidia/aicr-validators/performance
          - key: conformance
            ref: ghcr.io/nvidia/aicr-validators/conformance
          - key: aiperf-bench
            ref: ghcr.io/nvidia/aicr-validators/aiperf-bench
          - key: gate
            ref: ghcr.io/nvidia/aicr-gate
        platform:
          - name: linux/amd64
            arch: amd64
          - name: linux/arm64
            arch: arm64
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to registry
        uses: ./.github/actions/ghcr-login

      - name: Scan container image
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        env:
          GRYPE_PLATFORM: ${{ matrix.platform.name }}
        with:
          image: '${{ matrix.image.ref }}@${{ fromJSON(needs.resolve-candidates.outputs.digest_map)[matrix.image.key] }}'
          severity-cutoff: 'high'
          output-format: sarif
          only-fixed: true
          fail-build: true
          config: .grype.yaml
          # OpenVEX statements with per-CVE reachability evidence for
          # aiperf-bench suppressions. Grype applies statements only to
          # products whose PURL matches, so this is a no-op for the other
          # images in the matrix. Must mirror the input in
          # vuln-scan-images.yaml or the release scan re-flags CVEs that
          # the dedicated scan already suppressed.
          vex: .openvex.json
        continue-on-error: true

      - name: Upload SARIF to GitHub Security
        if: hashFiles('results.sarif') != '' || steps.scan.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: 'anchore-image-${{ matrix.image.key }}-${{ matrix.platform.arch }}'
        continue-on-error: true

      - name: Fail on vulnerabilities
        if: steps.scan.outcome == 'failure'
        shell: bash
        env:
          IMAGE_REF: '${{ matrix.image.ref }}@${{ fromJSON(needs.resolve-candidates.outputs.digest_map)[matrix.image.key] }}'
        run: |
          set -euo pipefail
          echo "::error::Vulnerability scan found issues in ${IMAGE_REF}"
          echo "Check the Security tab for details."
          exit 1

  # =============================================================================
  # Attestation Job (runs after all images are pushed and scanned)
  # =============================================================================

  # Attestation is generated from a REUSABLE workflow on purpose: that is what
  # makes the image provenance SLSA Build Level 3 (the builder identity becomes
  # attest-images.yaml, verifiable via `gh attestation verify --signer-workflow`).
  # Generating it inline in this caller workflow would only be Build Level 2.
  # See #1536.
  attest:
    name: Attest Images
    needs: [detect, image-vuln-scan, resolve-candidates]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/attest-images.yaml
    with:
      candidate_tag: ${{ needs.detect.outputs.candidate_tag }}
      digest_map: ${{ needs.resolve-candidates.outputs.digest_map }}


  # =============================================================================
  # AICR integrity: require resolution, scan, and attestation to all succeed
  # before the immutable version aliases are published
  # =============================================================================

  aicr-check:
    name: AICR Integrity Check
    runs-on: ubuntu-24.04
    needs: [resolve-candidates, image-vuln-scan, attest]
    if: always()
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check AICR security gates
        env:
          RESOLVE_RESULT: ${{ needs.resolve-candidates.result }}
          SCAN_RESULT: ${{ needs.image-vuln-scan.result }}
          ATTEST_RESULT: ${{ needs.attest.result }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "${RESOLVE_RESULT}" != "success" || \
            "${SCAN_RESULT}" != "success" || \
            "${ATTEST_RESULT}" != "success" ]]; then
            echo "::error::AICR security gates did not all succeed for ${TAG}."
            echo "::error::Candidate aliases remain non-public; repair the failure and rerun this tag."
            exit 1
          fi

          echo "AICR integrity check passed."

  # The operator qualifies against this tag's AICR, which resolves its
  # validator and gate images by the release tag at run time, so the immutable
  # version aliases exist before the operator gate. :latest and the GitHub
  # release still wait for it (promote-images, publish). A failed operator
  # gate leaves version aliases without a release; a fix needs a new tag.
  promote-versions:
    name: Promote Version Aliases
    runs-on: ubuntu-24.04
    needs: [detect, resolve-candidates, aicr-check]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      attestations: read
    concurrency:
      group: aicr-release-image-alias-promotion
      cancel-in-progress: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Load versions
        id: versions
        uses: ./.github/actions/load-versions

      - name: Authenticate to registry
        uses: ./.github/actions/ghcr-login

      - name: Setup crane
        uses: ./.github/actions/setup-build-tools
        with:
          install_crane: 'true'
          crane_version: ${{ steps.versions.outputs.crane }}

      - name: Preflight image promotion
        env:
          CANDIDATE_TAG: ${{ needs.detect.outputs.candidate_tag }}
          RELEASE_TAG: ${{ github.ref_name }}
          IS_PRERELEASE: ${{ needs.detect.outputs.is_prerelease }}
          GITHUB_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          DIGEST_MAP: ${{ needs.resolve-candidates.outputs.digest_map }}
          AICR_NETWORK_TIMEOUT_SECONDS: '120'
        run: |
          set -euo pipefail
          printf '%s\n' "${DIGEST_MAP}" > candidate-digests.json
          .github/scripts/release-images.sh preflight \
            candidate-digests.json validated-digests.json

      - name: Promote version aliases
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          IS_PRERELEASE: ${{ needs.detect.outputs.is_prerelease }}
          GH_TOKEN: ${{ github.token }}
          AICR_NETWORK_TIMEOUT_SECONDS: '120'
        run: |
          set -euo pipefail
          .github/scripts/release-images.sh promote validated-digests.json versions

  # =============================================================================
  # Integrity: require the AICR gates, the version aliases and every operator
  # check to succeed before :latest, the operator and the GitHub release
  # =============================================================================

  release-check:
    name: Release Integrity Check
    runs-on: ubuntu-24.04
    needs: [resolve-candidates, image-vuln-scan, attest, promote-versions, operator-candidate, operator-scan, operator-reproducible, operator-lifecycle, operator-validation]
    if: always()
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check release security gates
        env:
          RESOLVE_RESULT: ${{ needs.resolve-candidates.result }}
          SCAN_RESULT: ${{ needs.image-vuln-scan.result }}
          ATTEST_RESULT: ${{ needs.attest.result }}
          PROMOTE_VERSIONS_RESULT: ${{ needs.promote-versions.result }}
          OPERATOR_CANDIDATE_RESULT: ${{ needs.operator-candidate.result }}
          OPERATOR_SCAN_RESULT: ${{ needs.operator-scan.result }}
          OPERATOR_REPRODUCIBLE_RESULT: ${{ needs.operator-reproducible.result }}
          OPERATOR_LIFECYCLE_RESULT: ${{ needs.operator-lifecycle.result }}
          OPERATOR_VALIDATION_RESULT: ${{ needs.operator-validation.result }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "${RESOLVE_RESULT}" != "success" || \
            "${SCAN_RESULT}" != "success" || \
            "${ATTEST_RESULT}" != "success" || \
            "${PROMOTE_VERSIONS_RESULT}" != "success" || \
            "${OPERATOR_CANDIDATE_RESULT}" != "success" || \
            "${OPERATOR_SCAN_RESULT}" != "success" || \
            "${OPERATOR_REPRODUCIBLE_RESULT}" != "success" || \
            "${OPERATOR_LIFECYCLE_RESULT}" != "success" || \
            "${OPERATOR_VALIDATION_RESULT}" != "success" ]]; then
            echo "::error::Release security gates did not all succeed for ${TAG}."
            echo "::error::latest, the operator and the GitHub release stay unpublished; repair the failure and rerun this tag."
            exit 1
          fi

          echo "Release integrity check passed."

  # =============================================================================
  # AICR Operator (preview, ADR-027): one candidate of the tagged source, built
  # as OCI layouts, the deterministically packaged chart and the
  # kubectl-aicr binaries (tools/operator-candidate). Its chart defaults to
  # this tag's AICR images, by the digests resolve-candidates pinned; once
  # promote-versions has published their version aliases, the lifecycle check
  # runs the operator with them and the validation check runs the validator
  # images. It is scanned like every release image; release-check fails closed
  # on its build, scan, reproducibility, lifecycle and validation checks, so
  # they gate :latest too. It is published and attested only after
  # promote-images, and publish waits for it, so a failing operator blocks the
  # release.
  # =============================================================================

  operator-candidate:
    name: Operator Candidate
    runs-on: ubuntu-24.04
    needs: [detect, tests, resolve-candidates]
    timeout-minutes: 30
    outputs:
      artifact: ${{ steps.name.outputs.name }}
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Load versions
        id: versions
        uses: ./.github/actions/load-versions

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ steps.versions.outputs.go }}
          cache: false

      # The candidate build runs ko and the operator through `go run`, so its
      # modules come through Artifactory like the rest of the release.
      - name: Configure the DGXC Go proxy
        uses: ./.github/actions/setup-dgxc-goproxy
        with:
          mode: enforced

      - name: Assert the proxy is actually in front
        shell: bash
        run: |
          set -euo pipefail
          proxy="$(go env GOPROXY)"
          expected="https://edge.urm.nvidia.com/artifactory/api/go/dgxc-go-virtual"
          [ "${proxy}" = "${expected}" ] \
            || { echo "::error::GOPROXY is '${proxy}', expected exactly '${expected}'"; exit 1; }
          [ "$(go env GOSUMDB)" != off ] \
            || { echo "::error::GOSUMDB=off; modules would not be verified against the transparency log"; exit 1; }

      - name: Warm the module cache through the proxy
        shell: bash
        run: go mod download

      - name: Install Helm and yq
        uses: ./.github/actions/setup-build-tools
        with:
          install_helm: 'true'
          helm_version: ${{ steps.versions.outputs.helm }}
          install_yq: 'true'
          yq_version: ${{ steps.versions.outputs.yq }}

      # Also checks the candidate for credential material and that its
      # linux/amd64 operator refuses development settings.
      - name: Build the operator candidate
        env:
          CANDIDATE_VERSION: ${{ github.ref_name }}
          CANDIDATE_REPOSITORY: ghcr.io/nvidia/aicr-operator
          CANDIDATE_REGISTRY_REPOSITORY: ghcr.io/nvidia/aicr-registry
          CANDIDATE_AICR_VERSION: ${{ github.ref_name }}
          CANDIDATE_AICR_IMAGE: ${{ needs.resolve-candidates.outputs.aicr_image }}
          CANDIDATE_AICR_VALIDATOR_IMAGES: ${{ needs.resolve-candidates.outputs.aicr_validator_images }}
        run: make operator-candidate

      # Before release-check, so a finding stops promotion and every push.
      - name: Malware scan the kubectl-aicr binaries
        uses: ./.github/actions/malware-scan
        with:
          scan_path: dist/candidate/plugin/
          category: 'clamav-operator-plugin'

      - name: Name the candidate artifact
        id: name
        env:
          CANDIDATE_TAG: ${{ needs.detect.outputs.candidate_tag }}
        run: echo "name=aicr-operator-candidate-${CANDIDATE_TAG}-attempt-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload the candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ steps.name.outputs.name }}
          path: dist/candidate
          retention-days: 30
          if-no-files-found: error

      # setup-dgxc-goproxy left a live Artifactory token in $RUNNER_TEMP
      # (see build-ko).
      - name: Remove the proxy credential
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/dgxc-goauth"

  # The tagged source builds the operator candidate byte for byte twice, the
  # second time with an empty Go build cache (tools/operator-candidate verify).
  # It runs beside operator-candidate and gates publishing.
  operator-reproducible:
    name: Operator Reproducibility
    runs-on: ubuntu-24.04
    needs: [detect, tests, resolve-candidates]
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Load versions
        id: versions
        uses: ./.github/actions/load-versions

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ steps.versions.outputs.go }}
          cache: false

      - name: Configure the DGXC Go proxy
        uses: ./.github/actions/setup-dgxc-goproxy
        with:
          mode: enforced

      - name: Assert the proxy is actually in front
        shell: bash
        run: |
          set -euo pipefail
          proxy="$(go env GOPROXY)"
          expected="https://edge.urm.nvidia.com/artifactory/api/go/dgxc-go-virtual"
          [ "${proxy}" = "${expected}" ] \
            || { echo "::error::GOPROXY is '${proxy}', expected exactly '${expected}'"; exit 1; }
          [ "$(go env GOSUMDB)" != off ] \
            || { echo "::error::GOSUMDB=off; modules would not be verified against the transparency log"; exit 1; }

      - name: Warm the module cache through the proxy
        shell: bash
        run: go mod download

      - name: Install Helm and yq
        uses: ./.github/actions/setup-build-tools
        with:
          install_helm: 'true'
          helm_version: ${{ steps.versions.outputs.helm }}
          install_yq: 'true'
          yq_version: ${{ steps.versions.outputs.yq }}

      - name: Build the candidate twice and compare
        env:
          CANDIDATE_VERSION: ${{ github.ref_name }}
          CANDIDATE_REPOSITORY: ghcr.io/nvidia/aicr-operator
          CANDIDATE_REGISTRY_REPOSITORY: ghcr.io/nvidia/aicr-registry
          CANDIDATE_AICR_VERSION: ${{ github.ref_name }}
          CANDIDATE_AICR_IMAGE: ${{ needs.resolve-candidates.outputs.aicr_image }}
          CANDIDATE_AICR_VALIDATOR_IMAGES: ${{ needs.resolve-candidates.outputs.aicr_validator_images }}
        run: make operator-candidate-verify

      - name: Remove the proxy credential
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/dgxc-goauth"

  # The lifecycle scenarios from the newest published release older than this
  # tag, attestations verified, upgraded to this candidate, run through a
  # rollout with deployment validation required, rolled back and uninstalled
  # in the documented order (make operator-qualify-published). A failure
  # blocks :latest and publishing, as ADR-027 requires of an operator gate;
  # the version aliases it runs against are already promoted. It runs
  # third-party images on privileged kind nodes, so it holds neither the
  # release's OIDC identity nor the Go proxy's
  # credential; its modules come from the default proxy, as the PR lanes'
  # do, and it publishes nothing.
  operator-lifecycle:
    name: Operator Lifecycle from the Published Release
    runs-on: ubuntu-24.04
    needs: [detect, operator-candidate, promote-versions]
    timeout-minutes: 75
    permissions:
      contents: read
      attestations: read
      packages: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the kind cluster
        uses: ./.github/actions/operator-kind
        with:
          kubernetes: newest

      - name: Download the candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ needs.operator-candidate.outputs.artifact }}
          path: dist/candidate

      - name: Qualify the upgrade from the published release
        env:
          OPERATOR_E2E_REQUIRED: '1'
          OPERATOR_KIND_IMAGE_CACHE: ${{ runner.temp }}/kind-images
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_BELOW: ${{ github.ref_name }}
        run: make operator-qualify-published

      - name: Operator logs
        if: ${{ failure() || cancelled() }}
        run: |
          kubectl --kubeconfig .operator-e2e/kubeconfig -n aicr-system logs deployment/aicr-operator --tail=300 || true
          kubectl --kubeconfig .operator-e2e/kubeconfig get clusterruntimes,runtimerollouts -o yaml || true

      - name: Delete kind cluster
        if: ${{ always() }}
        run: make operator-kind-down

  # Deployment validation with this tag's AICR (#3560). The operator e2e
  # suite runs this tag's AICR image as operator-built Jobs, recipe through
  # validation, with the stamped validator images; each validator runs by the
  # version alias promote-versions published, its evidence names the pinned
  # tags, each tag resolves to its pinned digest, and the operator's evidence
  # binding reads back. operator-lifecycle covers install, upgrade and
  # rollout, and the candidate operator's own validation stage (#3646). Like
  # it, this runs third-party images on privileged kind nodes, holds no
  # release identity and publishes nothing.
  operator-validation:
    name: Operator Validation with the Tag's AICR
    runs-on: ubuntu-24.04
    needs: [detect, resolve-candidates, promote-versions]
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the kind cluster
        uses: ./.github/actions/operator-kind
        with:
          kubernetes: newest

      - name: Run the operator e2e suite with this tag's AICR
        env:
          OPERATOR_E2E_REQUIRED: '1'
          AICR_E2E_VERSION: ${{ github.ref_name }}
          AICR_E2E_IMAGE: ${{ needs.resolve-candidates.outputs.aicr_image }}
          AICR_E2E_VALIDATOR_IMAGES: ${{ needs.resolve-candidates.outputs.aicr_validator_images }}
        run: make operator-e2e

      - name: Delete kind cluster
        if: ${{ always() }}
        run: make operator-kind-down

  operator-scan:
    name: Operator Vuln Scan (${{ matrix.platform.arch }})
    runs-on: ubuntu-24.04
    needs: [operator-candidate]
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux/amd64
            arch: amd64
          - name: linux/arm64
            arch: arm64
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download the candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ needs.operator-candidate.outputs.artifact }}
          path: dist/candidate

      - name: Scan the operator image
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        env:
          GRYPE_PLATFORM: ${{ matrix.platform.name }}
        with:
          image: 'oci-dir:dist/candidate/image'
          severity-cutoff: 'high'
          output-format: sarif
          only-fixed: true
          fail-build: true
          config: .grype.yaml
          vex: .openvex.json
        continue-on-error: true

      - name: Upload SARIF to GitHub Security
        if: hashFiles('results.sarif') != '' || steps.scan.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: 'anchore-image-aicr-operator-${{ matrix.platform.arch }}'
        continue-on-error: true

      # The chart's in-cluster registry (cmd/aicr-registry), built with the
      # operator and held to the same bar.
      - name: Scan the in-cluster registry image
        id: registry-scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        env:
          GRYPE_PLATFORM: ${{ matrix.platform.name }}
        with:
          image: 'oci-dir:dist/candidate/registry-image'
          severity-cutoff: 'high'
          output-format: sarif
          only-fixed: true
          fail-build: true
          config: .grype.yaml
          vex: .openvex.json
        continue-on-error: true

      - name: Upload the registry SARIF to GitHub Security
        if: steps.registry-scan.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          sarif_file: ${{ steps.registry-scan.outputs.sarif }}
          category: 'anchore-image-aicr-registry-${{ matrix.platform.arch }}'
        continue-on-error: true

      - name: Fail on vulnerabilities
        if: steps.scan.outcome == 'failure' || steps.registry-scan.outcome == 'failure'
        env:
          OPERATOR_SCAN: ${{ steps.scan.outcome }}
          REGISTRY_SCAN: ${{ steps.registry-scan.outcome }}
          PLATFORM: ${{ matrix.platform.name }}
        run: |
          [[ "${OPERATOR_SCAN}" == failure ]] && echo "::error::Vulnerability scan found issues in the operator image for ${PLATFORM}"
          [[ "${REGISTRY_SCAN}" == failure ]] && echo "::error::Vulnerability scan found issues in the in-cluster registry image for ${PLATFORM}"
          exit 1

  operator-publish:
    name: Publish Operator Artifacts
    runs-on: ubuntu-24.04
    needs: [detect, release-check, promote-images, operator-candidate, operator-scan, operator-reproducible, operator-lifecycle]
    timeout-minutes: 20
    outputs:
      digests: ${{ steps.digests.outputs.digests }}
    permissions:
      contents: write
      # setup-dgxc-goproxy mints its Artifactory credential through OIDC.
      id-token: write
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Load versions
        id: versions
        uses: ./.github/actions/load-versions

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ steps.versions.outputs.go }}
          cache: false

      - name: Configure the DGXC Go proxy
        uses: ./.github/actions/setup-dgxc-goproxy
        with:
          mode: enforced

      - name: Assert the proxy is actually in front
        shell: bash
        run: |
          set -euo pipefail
          proxy="$(go env GOPROXY)"
          expected="https://edge.urm.nvidia.com/artifactory/api/go/dgxc-go-virtual"
          [ "${proxy}" = "${expected}" ] \
            || { echo "::error::GOPROXY is '${proxy}', expected exactly '${expected}'"; exit 1; }
          [ "$(go env GOSUMDB)" != off ] \
            || { echo "::error::GOSUMDB=off; modules would not be verified against the transparency log"; exit 1; }

      - name: Warm the module cache through the proxy
        shell: bash
        run: go mod download

      - name: Download the candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ needs.operator-candidate.outputs.artifact }}
          path: dist/candidate

      - name: Check the candidate is this tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(jq -r '.version' dist/candidate/candidate.json)"
          commit="$(jq -r '.source.commit' dist/candidate/candidate.json)"
          if [[ "${version}" != "${TAG}" || "${commit}" != "${GITHUB_SHA}" ]]; then
            echo "::error::the candidate is ${version} at ${commit}, not ${TAG} at ${GITHUB_SHA}"
            exit 1
          fi

      # Publishing the same candidate again is a no-op, so a rerun converges;
      # a tag that already names other content is refused.
      - name: Push the operator and registry images and the chart
        id: push
        env:
          CANDIDATE_REGISTRY_USERNAME: ${{ github.actor }}
          CANDIDATE_REGISTRY_PASSWORD: ${{ github.token }}
        run: |
          set -euo pipefail
          go run ./tools/operator-release push -dir dist/candidate -chart-registry ghcr.io/nvidia/charts | tee -a "$GITHUB_OUTPUT"

      # attest-operator.yaml attests these exact digests: each image index
      # and platform manifest from the candidate, and the chart as pushed.
      - name: Record the published digests
        id: digests
        env:
          IMAGE_DIGEST: ${{ steps.push.outputs.image-digest }}
          REGISTRY_DIGEST: ${{ steps.push.outputs.registry-digest }}
          CHART_DIGEST: ${{ steps.push.outputs.chart-digest }}
        run: |
          set -euo pipefail
          digests="$(jq -cS -e \
            --arg operator "${IMAGE_DIGEST}" --arg registry "${REGISTRY_DIGEST}" --arg chart "${CHART_DIGEST}" '{
              operator: $operator,
              "operator-amd64": .operator.platforms["linux/amd64"],
              "operator-arm64": .operator.platforms["linux/arm64/v8"],
              registry: $registry,
              "registry-amd64": .registry.platforms["linux/amd64"],
              "registry-arm64": .registry.platforms["linux/arm64/v8"],
              chart: $chart
            }' dist/candidate/candidate.json)"
          echo "digests=${digests}" >> "$GITHUB_OUTPUT"
      # The draft release build-ko created; publish requires these names
      # (expected_release_asset_names in release-images.sh).
      - name: Attach the kubectl-aicr binaries to the release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${TAG}" dist/candidate/plugin/kubectl-aicr-* --clobber --repo "${GITHUB_REPOSITORY}"

      # setup-dgxc-goproxy left a live Artifactory token in $RUNNER_TEMP
      # (see build-ko).
      - name: Remove the proxy credential
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/dgxc-goauth"

  # CycloneDX SBOM, OpenVEX and provenance for the operator's images, and
  # provenance for its chart and plugin, from the reusable workflow so the
  # provenance is SLSA Build Level 3, like AICR's images.
  operator-attest:
    name: Attest Operator Artifacts
    needs: [operator-publish, operator-candidate]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/attest-operator.yaml
    with:
      digests: ${{ needs.operator-publish.outputs.digests }}
      plugin_artifact: ${{ needs.operator-candidate.outputs.artifact }}

  # =============================================================================
  # Promote: after the operator gate, preflight all public aliases again, then
  # converge them to exact digests. promote-versions already published the
  # version aliases, so this converges :latest for a stable release.
  # =============================================================================

  promote-images:
    name: Promote Image Aliases
    runs-on: ubuntu-24.04
    needs: [detect, resolve-candidates, release-check]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      attestations: read
    concurrency:
      group: aicr-release-image-alias-promotion
      cancel-in-progress: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Load versions
        id: versions
        uses: ./.github/actions/load-versions

      - name: Authenticate to registry
        uses: ./.github/actions/ghcr-login

      - name: Setup crane
        uses: ./.github/actions/setup-build-tools
        with:
          install_crane: 'true'
          crane_version: ${{ steps.versions.outputs.crane }}

      - name: Preflight image promotion
        env:
          CANDIDATE_TAG: ${{ needs.detect.outputs.candidate_tag }}
          RELEASE_TAG: ${{ github.ref_name }}
          IS_PRERELEASE: ${{ needs.detect.outputs.is_prerelease }}
          GITHUB_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          DIGEST_MAP: ${{ needs.resolve-candidates.outputs.digest_map }}
          AICR_NETWORK_TIMEOUT_SECONDS: '120'
        run: |
          set -euo pipefail
          printf '%s\n' "${DIGEST_MAP}" > candidate-digests.json
          .github/scripts/release-images.sh preflight \
            candidate-digests.json validated-digests.json

      - name: Promote image aliases
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          IS_PRERELEASE: ${{ needs.detect.outputs.is_prerelease }}
          GH_TOKEN: ${{ github.token }}
          AICR_NETWORK_TIMEOUT_SECONDS: '120'
        run: |
          set -euo pipefail
          .github/scripts/release-images.sh promote validated-digests.json

  # =============================================================================
  # Publish: Flip draft release to public after attestation succeeds
  # =============================================================================

  publish:
    name: Publish Release
    runs-on: ubuntu-24.04
    needs: [detect, promote-images, operator-publish, operator-attest]
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Publish validated GitHub release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          IS_PRERELEASE: ${{ needs.detect.outputs.is_prerelease }}
          GH_TOKEN: ${{ github.token }}
          AICR_NETWORK_TIMEOUT_SECONDS: '120'
        run: |
          set -euo pipefail
          .github/scripts/release-images.sh publish-release

  # =============================================================================
  # Homebrew: publish only after the stable GitHub release is public
  # =============================================================================

  publish-homebrew:
    name: Publish Homebrew Formula
    runs-on: ubuntu-24.04
    needs: [detect, build-ko, publish]
    if: needs.detect.outputs.is_prerelease == 'false'
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    concurrency:
      group: aicr-homebrew-publication
      cancel-in-progress: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download Homebrew formula
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ needs.build-ko.outputs.homebrew_artifact_name }}
          path: /tmp/aicr-homebrew-formula

      # Inline by design: this is the only post-publication consumer and the
      # only job that receives the deploy key; formula validation and mutation
      # live in the independently tested publish-homebrew.sh script.
      - name: Validate Homebrew artifact content
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find /tmp/aicr-homebrew-formula -mindepth 1 -maxdepth 1 -type f -print0)
          if [[ "${#files[@]}" -ne 1 || "$(basename -- "${files[0]}")" != "aicr.rb" ]]; then
            echo "::error::Homebrew artifact must contain exactly aicr.rb"
            exit 1
          fi
          if find /tmp/aicr-homebrew-formula -mindepth 1 -maxdepth 1 ! -type f -print -quit | grep -q .; then
            echo "::error::Homebrew artifact contains an unexpected entry"
            exit 1
          fi

      - name: Validate and publish Homebrew formula
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_DEPLOY_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
          AICR_NETWORK_TIMEOUT_SECONDS: '120'
        run: |
          set -euo pipefail
          umask 077
          work_dir="$(mktemp -d)"
          key_file="${work_dir}/deploy-key"
          known_hosts="${work_dir}/known-hosts"
          tap_dir="${work_dir}/tap"
          cleanup() {
            rm -rf -- "${work_dir}"
          }
          trap cleanup EXIT
          if [[ -z "${DEPLOY_KEY}" || "${DEPLOY_KEY}" == *$'\r'* ]]; then
            echo "::error::Homebrew deploy key is missing or malformed"
            exit 1
          fi
          printf '%s\n' "${DEPLOY_KEY}" > "${key_file}"
          chmod 0600 "${key_file}"
          timeout 30s ssh-keyscan -t rsa github.com > "${known_hosts}"
          fingerprints="$(ssh-keygen -lf "${known_hosts}" -E sha256 | awk '{print $2}' | sort -u)"
          if [[ "${fingerprints}" != "SHA256:uNiVztksCsDhcc0u9e8BujQXVUpKZIDTMczCvj3tD2s" ]]; then
            echo "::error::GitHub RSA host-key fingerprint mismatch"
            exit 1
          fi
          export GIT_SSH_COMMAND="ssh -i ${key_file} -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${known_hosts}"
          timeout 2m git clone --depth 1 git@github.com:NVIDIA/homebrew-aicr.git "${tap_dir}"
          result="$(.github/scripts/publish-homebrew.sh /tmp/aicr-homebrew-formula/aicr.rb "${tap_dir}")"
          case "${result}" in
            changed=false)
              exit 0
              ;;
            changed=true)
              ;;
            *)
              echo "::error::unexpected Homebrew publication result"
              exit 1
              ;;
          esac
          git -C "${tap_dir}" config user.name github-actions
          git -C "${tap_dir}" config user.email github-actions@github.com
          git -C "${tap_dir}" add Formula/aicr.rb
          if [[ "$(git -C "${tap_dir}" diff --cached --name-only)" != "Formula/aicr.rb" ]]; then
            echo "::error::Homebrew update changed files outside Formula/aicr.rb"
            exit 1
          fi
          git -C "${tap_dir}" commit -m "Brew formula update for aicr version ${RELEASE_TAG}"
          timeout 2m git -C "${tap_dir}" push origin HEAD:main

  # =============================================================================
  # Notify: Post release announcement to Slack
  # =============================================================================
  # Source: attach the aiperf-bench third-party source as an OCI 1.1 referrer
  # =============================================================================
  #
  # NVIDIA's container policy requires the source of every third-party
  # open-source component added on top of an approved base image to be
  # retrievable by whoever pulls that image, regardless of license. This is a
  # separate obligation from attribution (THIRD_PARTY_NOTICES.md) and is not
  # satisfied by it.
  #
  # Only aiperf-bench needs a source referrer. The six Go images name every
  # dependency at an immutable version in go.mod/go.sum in the release source
  # archive, and those exact sources are retrievable from the public Go module
  # proxy. The Python image installs wheels, which do not carry their source.
  #
  # A referrer rather than a layer in the image: the sdists are ~250 MB, which
  # would otherwise be paid on every benchmark pod pull forever for data nothing
  # reads at runtime. OSRB confirmed the referrers API is acceptable provided
  # retrieval is documented (docs/integrator/supply-chain-verification.md).
  #
  # Runs against the resolved candidate digest, not a tag: a referrer binds to
  # one digest, so attaching to a moving tag would leave later builds
  # unreferenced.
  #
  # Deliberately NOT part of release-check, and deliberately after publish.
  # Attaching depends on PyPI serving 129 sdists, which is an uncontrolled
  # third party on the critical path of a release. Gating on it converts a PyPI
  # blip, or a yanked package version, into a failed release and a release-day
  # fire drill. Nothing is lost by attaching afterwards: a referrer binds to the
  # image digest, and promotion does not change the digest, so the artifact
  # lands on exactly the same subject either way. A failure here is re-runnable
  # as a single job rather than requiring the tag to be recut.
  #
  # Gated on resolve-candidates and publish succeeding: there is no image to
  # attach to otherwise. The job itself fails loudly if the attach, the
  # signature, or the discoverability check does not succeed.
  attach-source:
    name: Attach Third-Party Source
    runs-on: ubuntu-24.04
    needs: [detect, resolve-candidates, publish]
    if: needs.resolve-candidates.result == 'success' && needs.publish.result == 'success'
    timeout-minutes: 20
    permissions:
      contents: read
      # packages: write to push the referrer to ghcr.io alongside the image.
      packages: write
      # id-token: write for keyless cosign signing of the referrer. oras attach
      # produces an unsigned artifact, and anyone with push access could attach a
      # second one carrying the same artifactType; signing lets a consumer tell
      # ours apart rather than trusting whatever the type filter returns.
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Load versions
        id: versions
        uses: ./.github/actions/load-versions

      - name: Authenticate to registry
        uses: ./.github/actions/ghcr-login

      - name: Setup ORAS
        uses: ./.github/actions/setup-build-tools
        with:
          install_oras: 'true'
          oras_version: ${{ steps.versions.outputs.oras }}
          oras_sha256: ${{ steps.versions.outputs.oras_sha256_linux_amd64 }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3
        with:
          cosign-release: ${{ steps.versions.outputs.cosign }}

      - name: Build and attach source archive
        id: attach
        env:
          DIGEST_MAP: ${{ needs.resolve-candidates.outputs.digest_map }}
        run: |
          set -euo pipefail
          digest="$(jq -er '."aiperf-bench"' <<<"${DIGEST_MAP}")"
          image="ghcr.io/nvidia/aicr-validators/aiperf-bench@${digest}"
          # Skip if a source referrer is already attached to this digest.
          # `oras attach` stamps org.opencontainers.image.created into the
          # manifest, so re-running would push a NEW manifest digest and leave
          # two referrers of the same artifactType on one image. A consumer
          # selecting by type could then not tell which is ours -- reintroducing,
          # on the deliberately re-runnable path, exactly the ambiguity the
          # signature exists to remove.
          # Reuse an existing referrer rather than attaching a second one:
          # `oras attach` stamps org.opencontainers.image.created, so a re-run
          # would push a new manifest digest and leave two referrers of the same
          # artifactType on one image, which a consumer could not disambiguate.
          #
          # Crucially this does NOT skip signing. If a previous run attached and
          # then failed before signing, the digest carries an unsigned referrer;
          # skipping here would make every re-run skip the signature too and
          # fail verification forever, contradicting this job's re-runnable
          # recovery. Reusing the digest lets a re-run finish the interrupted
          # attach-then-sign sequence instead of wedging on it.
          existing="$(oras discover --format json "${image}" \
            | jq -r '[.referrers[]? | select(.artifactType
                     == "application/vnd.nvidia.aicr.source.v1+tar")
                     | .digest] | first // ""')"
          if [[ -n "${existing}" ]]; then
            echo "Source referrer already attached (${existing}); reusing it and re-signing."
            echo "referrer=${existing}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Attaching third-party source to ${image}"
          # The tool prints the referrer manifest digest on stdout; everything
          # else goes to stderr.
          referrer="$(python3 tools/generate-aiperf-source --attach "${image}")"
          if [[ ! "${referrer}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::did not receive a referrer digest from the attach step"
            exit 1
          fi
          echo "referrer=${referrer}" >> "$GITHUB_OUTPUT"

      - name: Sign the source referrer
        env:
          REFERRER: ${{ steps.attach.outputs.referrer }}
        # Signed for the same reason every other referrer AICR publishes is:
        # the artifact is otherwise unauthenticated, and a consumer selecting by
        # artifactType alone cannot distinguish ours from one an attacker with
        # push access attached beside it (CWE-345). Signing the referrer's own
        # digest is what makes the documented retrieval verifiable.
        run: |
          set -euo pipefail
          cosign sign --yes \
            "ghcr.io/nvidia/aicr-validators/aiperf-bench@${REFERRER}"

      - name: Verify the referrer is retrievable
        env:
          DIGEST_MAP: ${{ needs.resolve-candidates.outputs.digest_map }}
        # Attaching is not the same as being findable. ghcr.io has no referrers
        # API and serves these through the spec's tag fallback, so confirm a
        # client can actually discover the artifact before the release proceeds.
        run: |
          set -euo pipefail
          digest="$(jq -er '."aiperf-bench"' <<<"${DIGEST_MAP}")"
          image="ghcr.io/nvidia/aicr-validators/aiperf-bench@${digest}"
          found="$(oras discover --format json "${image}" \
            | jq -r '[.referrers[]? | select(.artifactType
                     == "application/vnd.nvidia.aicr.source.v1+tar")] | length')"
          # Exactly one, not at least one. Two referrers of the same type leave
          # a consumer unable to tell which is authoritative, and `>= 1` would
          # hide that rather than catch it.
          if [[ "${found}" -ne 1 ]]; then
            echo "::error::expected exactly 1 source referrer on ${image}, found ${found}"
            exit 1
          fi

          # Discoverable is not the same as verifiable. Confirm the signature we
          # just created actually resolves, so a silently-failed sign cannot ship
          # an artifact the documented retrieval will then reject.
          referrer="$(oras discover --format json "${image}" \
            | jq -r '.referrers[] | select(.artifactType
                     == "application/vnd.nvidia.aicr.source.v1+tar") | .digest')"
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity \
              "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/on-tag.yaml@${GITHUB_REF}" \
            "ghcr.io/nvidia/aicr-validators/aiperf-bench@${referrer}" >/dev/null

          echo "Source referrer discoverable and signature verified on ${image}"

  # =============================================================================

  notify:
    name: Slack Notification
    runs-on: ubuntu-24.04
    needs: [detect, publish]
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Post to Slack
        env:
          SLACK_SERVICE: ${{ secrets.SLACK_SERVICE }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
          IS_PRERELEASE: ${{ needs.detect.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          RELEASE_TYPE="stable"
          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            RELEASE_TYPE="pre-release"
          fi
          RELEASE_URL="${SERVER}/${REPO}/releases/tag/${TAG}"
          curl -sSf -X POST \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"AICR ${TAG} has been released (${RELEASE_TYPE}): ${RELEASE_URL}\"}" \
            "https://hooks.slack.com/services/${SLACK_SERVICE}"

  # =============================================================================
  # Summary: Release pipeline report (always runs, even on failure)
  # =============================================================================

  summary:
    name: Release Summary
    runs-on: ubuntu-24.04
    needs:
      - detect
      - tests
      - build-ko
      - build-docker
      - build-gate
      - docker-manifest
      - resolve-candidates
      - image-vuln-scan
      - attest
      - attach-source
      - aicr-check
      - promote-versions
      - release-check
      - promote-images
      - operator-candidate
      - operator-scan
      - operator-reproducible
      - operator-lifecycle
      - operator-validation
      - operator-publish
      - operator-attest
      - publish
      - publish-homebrew
      - notify
    if: always()
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Release Summary
        env:
          TESTS: ${{ needs.tests.result }}
          BUILD_KO: ${{ needs.build-ko.result }}
          BUILD_DOCKER: ${{ needs.build-docker.result }}
          BUILD_GATE: ${{ needs.build-gate.result }}
          MANIFEST: ${{ needs.docker-manifest.result }}
          RESOLVE: ${{ needs.resolve-candidates.result }}
          VULN_SCAN: ${{ needs.image-vuln-scan.result }}
          ATTEST: ${{ needs.attest.result }}
          AICR_CHECK: ${{ needs.aicr-check.result }}
          PROMOTE_VERSIONS: ${{ needs.promote-versions.result }}
          RELEASE_CHECK: ${{ needs.release-check.result }}
          PROMOTE: ${{ needs.promote-images.result }}
          OPERATOR_CANDIDATE: ${{ needs.operator-candidate.result }}
          OPERATOR_SCAN: ${{ needs.operator-scan.result }}
          OPERATOR_REPRODUCIBLE: ${{ needs.operator-reproducible.result }}
          OPERATOR_LIFECYCLE: ${{ needs.operator-lifecycle.result }}
          OPERATOR_VALIDATION: ${{ needs.operator-validation.result }}
          OPERATOR_PUBLISH: ${{ needs.operator-publish.result }}
          OPERATOR_ATTEST: ${{ needs.operator-attest.result }}
          PUBLISH: ${{ needs.publish.result }}
          HOMEBREW: ${{ needs.publish-homebrew.result }}
          NOTIFY: ${{ needs.notify.result }}
          # Non-gating by design (see the attach-source job), so a failure here
          # does not red the release. It still reds its own job, but the summary
          # is where the release outcome is read as a whole, and a missing row
          # would leave "did the source publish?" unanswered there.
          ATTACH_SOURCE: ${{ needs.attach-source.result }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          IS_PRERELEASE: ${{ needs.detect.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          {
            echo "## Release Summary"
            echo ""
            RELEASE_TYPE="stable"; [[ "${IS_PRERELEASE}" == "true" ]] && RELEASE_TYPE="pre-release"
            echo "**Tag:** \`${TAG}\`  **Commit:** \`${COMMIT}\`  **Type:** ${RELEASE_TYPE}"
            echo ""
            echo "| Phase | Result |"
            echo "|-------|--------|"
            echo "| Tests | ${TESTS} |"
            echo "| Build (Ko) | ${BUILD_KO} |"
            echo "| Build (Docker) | ${BUILD_DOCKER} |"
            echo "| Build (Gate) | ${BUILD_GATE} |"
            echo "| Docker Manifest | ${MANIFEST} |"
            echo "| Resolve Candidate Digests | ${RESOLVE} |"
            echo "| Vulnerability Scan | ${VULN_SCAN} |"
            echo "| Attestation | ${ATTEST} |"
            echo "| AICR Check | ${AICR_CHECK} |"
            echo "| Version Alias Promotion | ${PROMOTE_VERSIONS} |"
            echo "| Release Check | ${RELEASE_CHECK} |"
            echo "| latest Promotion | ${PROMOTE} |"
            echo "| Operator Candidate | ${OPERATOR_CANDIDATE} |"
            echo "| Operator Vulnerability Scan | ${OPERATOR_SCAN} |"
            echo "| Operator Reproducibility | ${OPERATOR_REPRODUCIBLE} |"
            echo "| Operator Lifecycle | ${OPERATOR_LIFECYCLE} |"
            echo "| Operator Validation | ${OPERATOR_VALIDATION} |"
            echo "| Operator Publish | ${OPERATOR_PUBLISH} |"
            echo "| Operator Attestation | ${OPERATOR_ATTEST} |"
            echo "| Publish | ${PUBLISH} |"
            echo "| Third-Party Source | ${ATTACH_SOURCE} |"
            echo "| Homebrew | ${HOMEBREW} |"
            echo "| Slack Notification | ${NOTIFY} |"
          } >> "$GITHUB_STEP_SUMMARY"
