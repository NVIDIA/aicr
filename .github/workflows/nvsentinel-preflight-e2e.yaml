# Runtime Kind test for the nvsentinel-preflight mixin (#2610).
#
# Installs the mixin-enabled bundle via its own generated install.sh and
# asserts what the webhook actually does to a pod at admission time: a GPU pod
# in an opted-in namespace gets the check init containers appended, and pods
# that should be left alone come back untouched. The render test proves the
# webhook is configured correctly and the chainsaw health check proves it is
# deployed; neither can observe the injection decision itself. Not wired into
# `make qualify`: it needs a Kind cluster and pulls the NVSentinel image set,
# which `qualify` neither provides nor should pay for on every run.
#
# The path filter is deliberately narrow. This lane costs a cluster spin-up and
# a full image pull, and pkg/recipe/** or pkg/bundler/** would drag it onto
# most core PRs; the allowlist machinery those packages own is already covered
# by unit tests that run everywhere. The localformat template directory is the
# one carve-out: this lane installs through the scripts those templates render.
# Unit tests cover those scripts as rendered text, against golden files and
# stub binaries; what they cannot cover is the script driving a real apiserver,
# which is the part that broke last time.

name: NVSentinel Preflight E2E

on:
  push:
    branches: [main]
    paths: &paths
      - 'recipes/mixins/nvsentinel-preflight.yaml'
      - 'recipes/registry.yaml'
      - 'recipes/components/nvsentinel/**'
      # The tested overlay inherits kind.yaml, which inherits base.yaml, and
      # base.yaml is where nvsentinel enters the chain at all.
      - 'recipes/overlays/h100-kind-training.yaml'
      - 'recipes/overlays/kind.yaml'
      - 'recipes/overlays/base.yaml'
      # The mixin adds a dependency edge to kai-scheduler, and the run
      # installs cert-manager for the webhook's certificates.
      - 'recipes/components/kai-scheduler/**'
      - 'recipes/components/cert-manager/**'
      - 'tests/e2e/nvsentinel-preflight/**'
      - 'pkg/bundler/deployer/localformat/templates/**'
      # run.sh sources tools/common and is invoked through a make target.
      - 'tools/common'
      - 'Makefile'
      - '.github/workflows/nvsentinel-preflight-e2e.yaml'
      - '.github/actions/setup-build-tools/**'
      - '.github/actions/prep-kind-runner/**'
      - '.github/actions/load-versions/**'
      - '.settings.yaml'
  pull_request:
    branches: [main]
    paths: *paths
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: NVSentinel Preflight E2E
    runs-on: ubuntu-latest
    # The script's bounded waits alone sum to ~20 minutes worst case (node
    # ready + cert-manager + kai-scheduler + a cold pull of the whole
    # NVSentinel image set), before kind create and go build.
    timeout-minutes: 35
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Load versions
        id: versions
        uses: ./.github/actions/load-versions

      - name: Prep Kind runner
        uses: ./.github/actions/prep-kind-runner

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ steps.versions.outputs.go }}
          cache: false

      # run.sh's has_tools gate needs all four; installing only some of them
      # fails the lane before it exercises anything.
      - name: Install Kind, kubectl, Helm and yq
        uses: ./.github/actions/setup-build-tools
        with:
          install_kind: 'true'
          kind_version: '${{ steps.versions.outputs.kind }}'
          install_kubectl: 'true'
          kubectl_version: '${{ steps.versions.outputs.kubectl }}'
          install_helm: 'true'
          helm_version: '${{ steps.versions.outputs.helm }}'
          install_yq: 'true'
          yq_version: '${{ steps.versions.outputs.yq }}'

      # KEEP_CLUSTER so the cluster survives for the diagnostics below; the
      # script's own EXIT trap would otherwise delete it before they run,
      # leaving a failure with nothing to inspect. The always() step after
      # diagnostics does the teardown instead.
      - name: Run nvsentinel-preflight e2e
        env:
          KEEP_CLUSTER: 'true'
        run: make nvsentinel-preflight-e2e

      # run.sh writes its kubeconfig inside a mktemp dir and removes that dir on
      # exit, so KEEP_CLUSTER leaves the cluster running but no credentials to
      # reach it. Re-export before querying anything.
      - name: Collect diagnostics on failure
        if: ${{ failure() }}
        run: |
          set +e
          cluster=aicr-nvsentinel-preflight-e2e
          export KUBECONFIG="${RUNNER_TEMP}/preflight-diag.kubeconfig"
          kind export kubeconfig --name "$cluster" --kubeconfig "$KUBECONFIG" || exit 0
          kubectl get pods -A
          kubectl get mutatingwebhookconfiguration preflight -o yaml
          kubectl -n cert-manager get certificates,certificaterequests -A
          kubectl -n nvsentinel logs -l app.kubernetes.io/name=preflight --tail=200
          for ns in preflight-optin-e2e preflight-no-optin-e2e; do
            kubectl -n "$ns" get pods -o yaml
          done

      - name: Delete Kind cluster
        if: ${{ always() }}
        run: kind delete cluster --name aicr-nvsentinel-preflight-e2e || true
