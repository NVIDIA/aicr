# Allows maintainers to run the full qualification suite on fork PRs by
# commenting "/ok-to-test" on the PR.
#
# Running this command vouches for the whole diff, its `.github/` portion
# included. The suite executes `./.github/actions/*` from the fork's checkout
# in a run whose `github.ref` is the default branch, so a crafted PR can write
# into main's cache scope and the `privileged_ci` inputs inside those actions
# cannot stop it. That exposure is accepted (#2681); `.github/actions/README.md`
# records which controls are boundaries and which are not.
#
# The job-level `if: inputs.privileged_ci` in qualification.yaml IS a boundary,
# because it lives in the trusted file — but it guards only `cli-e2e` and
# `security-scan`, keeping elevated tokens away from fork code. It does not
# guard the cache: `test`, `lint` and `e2e` carry no job-level gate and run
# whatever the fork's action files say. Hence `privileged_ci: false` below,
# which narrows the default-on writes without closing the hole.
#
# Because the vouch is the control, the authorize job refuses a bare
# "/ok-to-test" when the PR touches `.github/**` and requires
# "/ok-to-test confirm-ci" instead.
#
# What that gate does not close: the author can push between the comment and
# the run, so the head this qualifies may not be the head the maintainer read.
# The gate binds its own file check to the SHA it hands the tests job, so it
# never reports on a commit other than the one tested — but binding the
# maintainer's reading to a commit would take naming the SHA in the comment,
# which is not worth the friction for a command that already rests on a vouch.
#
# We must still declare id-token: write and security-events: write on
# the reusable-workflow call: GitHub validates the union of permissions
# requested by every job in the called workflow at startup — before
# `if:` conditions evaluate — and rejects the run with startup_failure
# if any declared permission is missing here. The grants are declarative
# only; the gated jobs never consume them on the fork path.

name: OK to Test

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:

  authorize:
    name: Authorize
    if: >-
      github.event.issue.pull_request &&
      (github.event.comment.body == '/ok-to-test' ||
       github.event.comment.body == '/ok-to-test confirm-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Added for the compare call below; the workflow-level block grants only
      # contents: read, which does not cover it.
      pull-requests: read
    outputs:
      ref: ${{ steps.pr.outputs.ref }}
    steps:

      - name: Check maintainer permission
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.payload.comment.user.login,
            });
            const allowed = ['admin', 'write', 'maintain'];
            if (!allowed.includes(data.permission)) {
              core.setFailed(`User ${context.payload.comment.user.login} does not have write permission`);
            }

      - name: Get PR head ref
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('ref', pr.head.sha);
            core.setOutput('base', pr.base.sha);
            core.info(`PR #${context.issue.number} head SHA: ${pr.head.sha}`);

      # A PR touching `.github/**` asks the maintainer to vouch for the CI
      # definition itself, which this command then executes from the fork.
      #
      # Deliberately scoped to the SHA resolved above rather than to the live
      # PR. The tests job checks out that same SHA, so listing the live diff
      # instead would leave a gap: a push landing between the two reads would
      # run CI files this gate never looked at.
      #
      # Fails closed: a listing error fails the step and nothing qualifies.
      - name: Require explicit confirmation for CI-path changes
        if: github.event.comment.body == '/ok-to-test'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          BASE_SHA: ${{ steps.pr.outputs.base }}
          HEAD_SHA: ${{ steps.pr.outputs.ref }}
        with:
          script: |
            const files = await github.paginate(
              github.rest.repos.compareCommitsWithBasehead,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                basehead: `${process.env.BASE_SHA}...${process.env.HEAD_SHA}`,
              },
              (response) => response.data.files ?? [],
            );
            const ci = files.map((f) => f.filename).filter((f) => f.startsWith('.github/'));
            if (ci.length) {
              core.setFailed(
                `This PR changes .github/, which /ok-to-test runs from the fork's checkout:\n` +
                ci.map((f) => `  - ${f}`).join('\n') +
                `\n\nRe-read those files at ${process.env.HEAD_SHA}, ` +
                `then comment exactly: /ok-to-test confirm-ci`
              );
            }

  tests:
    needs: authorize
    uses: ./.github/workflows/qualification.yaml
    permissions:
      actions: read
      contents: read
      # Declarative-only: required because qualification.yaml's cli-e2e and
      # security-scan jobs declare these permissions and GitHub validates the
      # union at startup. Those jobs are skipped via `if: inputs.privileged_ci`
      # when privileged_ci=false (set below), so the grants are never consumed.
      id-token: write
      security-events: write
    with:
      privileged_ci: false
      ref: ${{ needs.authorize.outputs.ref }}
