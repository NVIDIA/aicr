name: 'GPU Validate Cluster Autoscaling'
description: 'Install Karpenter + KWOK and run the cluster-autoscaling conformance check alone on a GPU Kind test cluster.'

inputs:
  cluster_name:
    description: 'Kind cluster name'
    required: true

# Runs after gpu-validate-conformance, which has already built the conformance
# validator image into the cluster. Karpenter + KWOK are installed only here,
# so no other check runs while KWOK simulated nodes can exist (#3818).
runs:
  using: 'composite'
  steps:
    - name: Install Karpenter + KWOK
      uses: ./.github/actions/install-karpenter-kwok
      with:
        cluster_name: ${{ inputs.cluster_name }}
        kwok_helm_timeout: 600s
        ko_build_timeout: 1200s
        karpenter_helm_timeout: 600s
    - name: Validate cluster autoscaling
      shell: bash
      env:
        KIND_CLUSTER_NAME: ${{ inputs.cluster_name }}
      run: bash "${{ github.workspace }}/.github/scripts/gpu-validate-cluster-autoscaling.sh"
