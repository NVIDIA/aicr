name: 'Generate SBOM and Attest'
description: 'Generates SBOM, OpenVEX and build provenance attestations for container images'

# Attestation subject policy (see NVIDIA/aicr#1957):
#
#   SPDX SBOM  -> the PER-PLATFORM manifest digest. An SBOM describes one
#                 root filesystem, so attaching both platform SBOMs to the
#                 shared index digest made them indistinguishable without
#                 parsing the predicate body.
#   OpenVEX    -> the INDEX digest. `.openvex.json` is a single, platform
#                 independent document whose statements are keyed by product
#                 PURL (`pkg:oci/<image>`), not by architecture, so one copy
#                 per released image is the correct cardinality. Consumers
#                 resolve a tag with `crane digest` (which returns the index
#                 digest) and query VEX there.
#   Provenance -> the INDEX digest, via actions/attest-build-provenance. It
#                 describes the build that produced the whole release image.
#
# ghcr.io does not implement the OCI 1.1 `/v2/<name>/referrers/<digest>`
# endpoint (it answers 404 MANIFEST_UNKNOWN), so every one of these lands
# through the spec's referrers *tag fallback* (`sha256-<hex>`). That is
# transparent to cosign/oras clients but is why the retrieval commands in
# docs/integrator/supply-chain-verification.md use cosign rather than a raw
# referrers API call.

inputs:
  image_name:
    description: 'Full image name (without tag or digest)'
    required: true
  image_digest:
    description: 'Multi-platform index digest (sha256:...); subject for VEX and provenance'
    required: true
  amd64_digest:
    description: 'linux/amd64 manifest digest (sha256:...); subject for the amd64 SBOM'
    required: true
  arm64_digest:
    description: 'linux/arm64 manifest digest (sha256:...); subject for the arm64 SBOM'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Validate inputs
      id: validate
      shell: bash
      env:
        INPUT_IMAGE_NAME: ${{ inputs.image_name }}
        INPUT_IMAGE_DIGEST: ${{ inputs.image_digest }}
        INPUT_AMD64_DIGEST: ${{ inputs.amd64_digest }}
        INPUT_ARM64_DIGEST: ${{ inputs.arm64_digest }}
      run: |
        set -euo pipefail
        # shellcheck source=.github/actions/release-input-validation.sh
        source "${GITHUB_ACTION_PATH}/../release-input-validation.sh"
        reject_newline image_name "${INPUT_IMAGE_NAME}"
        reject_newline image_digest "${INPUT_IMAGE_DIGEST}"
        reject_newline amd64_digest "${INPUT_AMD64_DIGEST}"
        reject_newline arm64_digest "${INPUT_ARM64_DIGEST}"
        require_release_image "${INPUT_IMAGE_NAME}"
        for pair in \
          "image_digest=${INPUT_IMAGE_DIGEST}" \
          "amd64_digest=${INPUT_AMD64_DIGEST}" \
          "arm64_digest=${INPUT_ARM64_DIGEST}"; do
          if [[ ! "${pair#*=}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::${pair%%=*} must be in the form sha256:<64 hex>"
            exit 1
          fi
        done
        # A platform digest that equals the index digest means the caller
        # passed the index through instead of resolving its child manifest,
        # which would attach a per-platform SBOM to the multi-platform index.
        # The caller in attest-image-from-tag already rejects this, but a
        # direct caller could set only one platform to the index digest and
        # slip past the distinctness check below, so re-check both here.
        for platform_pair in \
          "amd64_digest=${INPUT_AMD64_DIGEST}" \
          "arm64_digest=${INPUT_ARM64_DIGEST}"; do
          if [[ "${platform_pair#*=}" == "${INPUT_IMAGE_DIGEST}" ]]; then
            echo "::error::${platform_pair%%=*} must not equal the multi-platform index digest"
            exit 1
          fi
        done
        # A multi-platform release image must yield two distinct child
        # manifests. Equal digests mean the caller resolved the index instead
        # of a platform, or the image lost a platform. Fail closed either way.
        if [[ "${INPUT_AMD64_DIGEST}" == "${INPUT_ARM64_DIGEST}" ]]; then
          echo "::error::amd64_digest and arm64_digest are identical; the image is not a multi-platform index"
          exit 1
        fi
        {
          echo "image_name=${INPUT_IMAGE_NAME}"
          echo "image_digest=${INPUT_IMAGE_DIGEST}"
          echo "amd64_digest=${INPUT_AMD64_DIGEST}"
          echo "arm64_digest=${INPUT_ARM64_DIGEST}"
        } >> "$GITHUB_OUTPUT"

    - name: Authenticate to registry
      uses: ./.github/actions/ghcr-login

    - name: Derive safe filename
      id: name
      shell: bash
      env:
        IMAGE: ${{ steps.validate.outputs.image_name }}
      run: |
        set -euo pipefail
        SAFE="$(basename "${IMAGE%%:*}")"  # strip tag if present, then basename
        echo "safe=$SAFE" >> "$GITHUB_OUTPUT"

    - name: Generate amd64 SBOM
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
      env:
        SYFT_PLATFORM: linux/amd64
      with:
        image: "${{ steps.validate.outputs.image_name }}@${{ steps.validate.outputs.amd64_digest }}"
        format: spdx-json
        artifact-name: sbom-${{ steps.name.outputs.safe }}-linux-amd64-attempt-${{ github.run_attempt }}.spdx.json
        output-file: sbom-${{ steps.name.outputs.safe }}-linux-amd64.spdx.json
        upload-artifact: true
        upload-release-assets: false

    - name: Generate arm64 SBOM
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
      env:
        SYFT_PLATFORM: linux/arm64
      with:
        image: "${{ steps.validate.outputs.image_name }}@${{ steps.validate.outputs.arm64_digest }}"
        format: spdx-json
        artifact-name: sbom-${{ steps.name.outputs.safe }}-linux-arm64-attempt-${{ github.run_attempt }}.spdx.json
        output-file: sbom-${{ steps.name.outputs.safe }}-linux-arm64.spdx.json
        upload-artifact: true
        upload-release-assets: false

    - name: Verify platform SBOM files
      shell: bash
      env:
        SAFE_NAME: ${{ steps.name.outputs.safe }}
      run: |
        set -euo pipefail
        for platform in amd64 arm64; do
          sbom_file="sbom-${SAFE_NAME}-linux-${platform}.spdx.json"
          if [[ ! -s "${sbom_file}" ]]; then
            echo "::error::SBOM file not found or empty: ${sbom_file}"
            exit 1
          fi
        done

    - name: Load versions
      id: versions
      uses: ./.github/actions/load-versions

    - name: Install Cosign
      uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad  # v4.0.0
      with:
        # Pin from .settings.yaml (>= v3.1.0) so cosign logs DSSE attestations
        # to Rekor v2 as hashedrekord/PAE, matching the binary-attestation path
        # in on-tag.yaml. Leaving this unset let the installer's own default
        # decide both the cosign version and, with it, the on-registry bundle
        # format, an implicit dependency this action must not carry (#1957).
        cosign-release: ${{ steps.versions.outputs.cosign }}

    # Fail closed on a malformed document rather than publishing a VEX
    # attestation that no scanner can apply. The rules below are the OpenVEX
    # v0.2.0 contract:
    #
    #   document   -> @context, @id, author, timestamp, version, statements
    #   statement  -> vulnerability.name, status from the four-label enum, and
    #                 at least one identifiable product. The spec marks
    #                 `products` optional only because it can cascade from an
    #                 encapsulating format; this document defines no such
    #                 product tree, and grype/trivy match statements by
    #                 products[].purl, so a statement without products is
    #                 unusable here.
    #   not_affected -> MUST carry a justification or an impact_statement, and
    #                 a justification present at all MUST be one of the five
    #                 v0.2.0 labels.
    #   affected   -> MUST carry an action_statement.
    #
    # The @context equality check is what pins the version: it is a local,
    # network-free way to assert the enums below still describe the document.
    # This step runs after image promotion, so fetching a schema or installing
    # a validator here would add a new failure mode at the point in the release
    # where a failure is most expensive. jq is already a dependency.
    - name: Verify OpenVEX document
      id: vex
      shell: bash
      env:
        VEX_CONTEXT: https://openvex.dev/ns/v0.2.0
      run: |
        set -euo pipefail
        vex_file="${GITHUB_WORKSPACE}/.openvex.json"
        if [[ ! -s "${vex_file}" ]]; then
          echo "::error::OpenVEX document not found or empty: ${vex_file}"
          exit 1
        fi
        if ! problems="$(jq -r --arg context "${VEX_CONTEXT}" '
          def statuses: ["not_affected", "affected", "fixed", "under_investigation"];
          def justifications: [
            "component_not_present",
            "vulnerable_code_not_present",
            "vulnerable_code_not_in_execute_path",
            "vulnerable_code_cannot_be_controlled_by_adversary",
            "inline_mitigations_already_exist"
          ];
          def field($object; $key): if ($object | type) == "object" then $object[$key] else null end;
          def filled($value): ($value | type) == "string" and ($value | test("[^[:space:]]"));
          def listing($value): if ($value | type) == "array" then $value else [] end;
          def statement($index; $s):
            if ($s | type) != "object" then ["statement \($index) must be a JSON object"]
            else
              [ (if filled(field(field($s; "vulnerability"); "name")) then empty
                 else "statement \($index) must set vulnerability.name to a non-empty string" end),
                (if (field($s; "products") | type) == "array" and (listing(field($s; "products")) | length) > 0 then empty
                 else "statement \($index) must list at least one product" end),
                (if listing(field($s; "products"))
                    | all(filled(field(.; "@id")) or filled(field(field(.; "identifiers"); "purl"))) then empty
                 else "statement \($index) has a product with neither @id nor identifiers.purl" end),
                (if (statuses | index(field($s; "status"))) != null then empty
                 else "statement \($index) status \(field($s; "status") | tojson) is not one of \(statuses | join(", "))" end),
                (if field($s; "status") == "not_affected"
                    and (filled(field($s; "justification")) | not)
                    and (filled(field($s; "impact_statement")) | not)
                 then "statement \($index) is not_affected and must carry a justification or an impact_statement"
                 else empty end),
                (if field($s; "justification") != null
                    and (justifications | index(field($s; "justification"))) == null
                 then "statement \($index) justification \(field($s; "justification") | tojson) is not one of \(justifications | join(", "))"
                 else empty end),
                (if field($s; "status") == "affected" and (filled(field($s; "action_statement")) | not)
                 then "statement \($index) is affected and must carry an action_statement"
                 else empty end)
              ]
            end;
          [ (if field(.; "@context") == $context then empty
             else "@context must be \($context), got \(field(.; "@context") | tojson)" end),
            (if filled(field(.; "@id")) then empty else "@id must be a non-empty string" end),
            (if filled(field(.; "author")) then empty else "author must be a non-empty string" end),
            (if filled(field(.; "timestamp")) then empty else "timestamp must be a non-empty string" end),
            (if (field(.; "version") | type) == "number" then empty else "version must be a number" end),
            (if (field(.; "statements") | type) != "array" then "statements must be an array"
             elif (listing(field(.; "statements")) | length) == 0 then "statements must not be empty"
             else empty end)
          ]
          + (listing(field(.; "statements")) | to_entries | map(statement(.key; .value)) | add // [])
          | .[]
        ' "${vex_file}")"; then
          echo "::error::OpenVEX document is not valid JSON: ${vex_file}"
          exit 1
        fi
        if [[ -n "${problems}" ]]; then
          while IFS= read -r problem; do
            echo "::error::OpenVEX document violates the v0.2.0 contract: ${problem}"
          done <<< "${problems}"
          exit 1
        fi
        echo "file=${vex_file}" >> "$GITHUB_OUTPUT"

    # --new-bundle-format is set explicitly on every attest call: it is what
    # publishes the attestation through the OCI referrers API (tag fallback on
    # ghcr.io) instead of a legacy `.att` tag, and it must be our decision, not
    # an inherited installer default that can move between cosign releases.
    - name: Cosign amd64 SBOM attestation
      shell: bash
      env:
        IMAGE_NAME: ${{ steps.validate.outputs.image_name }}
        PLATFORM_DIGEST: ${{ steps.validate.outputs.amd64_digest }}
        SAFE_NAME: ${{ steps.name.outputs.safe }}
      run: |
        set -euo pipefail
        timeout --foreground 120s cosign attest \
          --yes \
          --new-bundle-format=true \
          --predicate "sbom-${SAFE_NAME}-linux-amd64.spdx.json" \
          --type spdxjson \
          "${IMAGE_NAME}@${PLATFORM_DIGEST}"

    - name: Cosign arm64 SBOM attestation
      shell: bash
      env:
        IMAGE_NAME: ${{ steps.validate.outputs.image_name }}
        PLATFORM_DIGEST: ${{ steps.validate.outputs.arm64_digest }}
        SAFE_NAME: ${{ steps.name.outputs.safe }}
      run: |
        set -euo pipefail
        timeout --foreground 120s cosign attest \
          --yes \
          --new-bundle-format=true \
          --predicate "sbom-${SAFE_NAME}-linux-arm64.spdx.json" \
          --type spdxjson \
          "${IMAGE_NAME}@${PLATFORM_DIGEST}"

    # Publish the triaged vulnerability posture alongside the SBOM. `openvex`
    # is a natively supported cosign predicate type (predicateType
    # https://openvex.dev/ns), so no custom URI is needed. The same document is
    # still fed to Grype as scanner input in on-tag.yaml and
    # vuln-scan-images.yaml; this step only publishes it.
    - name: Cosign OpenVEX attestation
      shell: bash
      env:
        IMAGE_NAME: ${{ steps.validate.outputs.image_name }}
        IMAGE_DIGEST: ${{ steps.validate.outputs.image_digest }}
        VEX_FILE: ${{ steps.vex.outputs.file }}
      run: |
        set -euo pipefail
        timeout --foreground 120s cosign attest \
          --yes \
          --new-bundle-format=true \
          --predicate "${VEX_FILE}" \
          --type openvex \
          "${IMAGE_NAME}@${IMAGE_DIGEST}"

    - name: Attest build provenance
      uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f  # v3.2.0
      with:
        subject-name: ${{ steps.validate.outputs.image_name }}
        subject-digest: ${{ steps.validate.outputs.image_digest }}
        push-to-registry: true
