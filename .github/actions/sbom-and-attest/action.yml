name: 'Generate SBOM and Attest'
description: 'Generates CycloneDX SBOM, OpenVEX and build provenance attestations for container images'

# Attestation subject policy (see NVIDIA/aicr#1957 and #2426):
#
#   CycloneDX SBOM -> the PER-PLATFORM manifest digest. An SBOM describes one
#                 root filesystem, so attaching both platform SBOMs to the
#                 shared index digest made them indistinguishable without
#                 parsing the predicate body.
#   OpenVEX    -> the PER-PLATFORM manifest digest, alongside the SBOM. VEX
#                 is only verifiable when its product identifier binds to the
#                 manifest the claim covers, and a consumer that resolved
#                 linux/amd64 enumerates referrers *there*, so the index copy
#                 we used to publish was invisible from that vantage point.
#                 `.openvex.json` carries bare `pkg:oci/<image>` products, so
#                 tools/openvex-bind rewrites them to
#                 `pkg:oci/<image>@<platform-digest>` per platform. That
#                 projection exists only at release time; the committed
#                 document stays the reviewed source of truth and is not
#                 modified.
#   Provenance -> the INDEX digest, via actions/attest-build-provenance. It
#                 describes the build that produced the whole release image.
#
# The two per-platform documents are deliberately in different formats.
# `cosign attest --type cyclonedx` stamps predicate type
# https://cyclonedx.org/bom on whatever it is handed, and a referrer descriptor
# has no name field (only digest, mediaType, size, artifactType, annotations),
# so two CycloneDX documents on one manifest are indistinguishable in a
# referrers listing without pulling every payload. OpenVEX gets
# https://openvex.dev/ns, which makes the listing self-describing and is also
# the type Trivy's `--vex oci` path documents. Do not unify them.
#
# No vulnerability report is published: scan results are derivable by anyone
# holding the image, go stale the moment a vulnerability database updates, and
# would put signed evidence on a republish treadmill. Grype stays where it is,
# gating releases with `.openvex.json` as `--vex` input (on-tag.yaml,
# vuln-scan-images.yaml).
#
# ghcr.io does not implement the OCI 1.1 `/v2/<name>/referrers/<digest>`
# endpoint (it answers 404 MANIFEST_UNKNOWN), so every one of these lands
# through the spec's referrers *tag fallback* (`sha256-<hex>`). That is
# transparent to cosign/oras clients but is why the retrieval commands in
# docs/integrator/supply-chain-verification.md use cosign rather than a raw
# referrers API call.

inputs:
  image_name:
    description: 'Full image name (without tag or digest)'
    required: true
  image_digest:
    description: 'Multi-platform index digest (sha256:...); subject for provenance'
    required: true
  amd64_digest:
    description: 'linux/amd64 manifest digest (sha256:...); subject for the amd64 SBOM and VEX'
    required: true
  arm64_digest:
    description: 'linux/arm64 manifest digest (sha256:...); subject for the arm64 SBOM and VEX'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Validate inputs
      id: validate
      shell: bash
      env:
        INPUT_IMAGE_NAME: ${{ inputs.image_name }}
        INPUT_IMAGE_DIGEST: ${{ inputs.image_digest }}
        INPUT_AMD64_DIGEST: ${{ inputs.amd64_digest }}
        INPUT_ARM64_DIGEST: ${{ inputs.arm64_digest }}
      run: |
        set -euo pipefail
        # shellcheck source=.github/actions/release-input-validation.sh
        source "${GITHUB_ACTION_PATH}/../release-input-validation.sh"
        reject_newline image_name "${INPUT_IMAGE_NAME}"
        reject_newline image_digest "${INPUT_IMAGE_DIGEST}"
        reject_newline amd64_digest "${INPUT_AMD64_DIGEST}"
        reject_newline arm64_digest "${INPUT_ARM64_DIGEST}"
        require_release_image "${INPUT_IMAGE_NAME}"
        for pair in \
          "image_digest=${INPUT_IMAGE_DIGEST}" \
          "amd64_digest=${INPUT_AMD64_DIGEST}" \
          "arm64_digest=${INPUT_ARM64_DIGEST}"; do
          if [[ ! "${pair#*=}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::${pair%%=*} must be in the form sha256:<64 hex>"
            exit 1
          fi
        done
        # A platform digest that equals the index digest means the caller
        # passed the index through instead of resolving its child manifest,
        # which would attach a per-platform SBOM to the multi-platform index.
        # The caller in attest-image-from-tag already rejects this, but a
        # direct caller could set only one platform to the index digest and
        # slip past the distinctness check below, so re-check both here.
        for platform_pair in \
          "amd64_digest=${INPUT_AMD64_DIGEST}" \
          "arm64_digest=${INPUT_ARM64_DIGEST}"; do
          if [[ "${platform_pair#*=}" == "${INPUT_IMAGE_DIGEST}" ]]; then
            echo "::error::${platform_pair%%=*} must not equal the multi-platform index digest"
            exit 1
          fi
        done
        # A multi-platform release image must yield two distinct child
        # manifests. Equal digests mean the caller resolved the index instead
        # of a platform, or the image lost a platform. Fail closed either way.
        if [[ "${INPUT_AMD64_DIGEST}" == "${INPUT_ARM64_DIGEST}" ]]; then
          echo "::error::amd64_digest and arm64_digest are identical; the image is not a multi-platform index"
          exit 1
        fi
        {
          echo "image_name=${INPUT_IMAGE_NAME}"
          echo "image_digest=${INPUT_IMAGE_DIGEST}"
          echo "amd64_digest=${INPUT_AMD64_DIGEST}"
          echo "arm64_digest=${INPUT_ARM64_DIGEST}"
        } >> "$GITHUB_OUTPUT"

    - name: Authenticate to registry
      uses: ./.github/actions/ghcr-login

    - name: Derive safe filename
      id: name
      shell: bash
      env:
        IMAGE: ${{ steps.validate.outputs.image_name }}
      run: |
        set -euo pipefail
        SAFE="$(basename "${IMAGE%%:*}")"  # strip tag if present, then basename
        echo "safe=$SAFE" >> "$GITHUB_OUTPUT"

    # Syft's cyclonedx-json output defaults to CycloneDX spec 1.6 and emits no
    # `vulnerabilities` key, so the SBOM needs no post-processing: what syft
    # writes is what gets attested.
    - name: Generate amd64 SBOM
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
      env:
        SYFT_PLATFORM: linux/amd64
      with:
        image: "${{ steps.validate.outputs.image_name }}@${{ steps.validate.outputs.amd64_digest }}"
        format: cyclonedx-json
        artifact-name: sbom-${{ steps.name.outputs.safe }}-linux-amd64-attempt-${{ github.run_attempt }}.cdx.json
        output-file: sbom-${{ steps.name.outputs.safe }}-linux-amd64.cdx.json
        upload-artifact: true
        upload-release-assets: false

    - name: Generate arm64 SBOM
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
      env:
        SYFT_PLATFORM: linux/arm64
      with:
        image: "${{ steps.validate.outputs.image_name }}@${{ steps.validate.outputs.arm64_digest }}"
        format: cyclonedx-json
        artifact-name: sbom-${{ steps.name.outputs.safe }}-linux-arm64-attempt-${{ github.run_attempt }}.cdx.json
        output-file: sbom-${{ steps.name.outputs.safe }}-linux-arm64.cdx.json
        upload-artifact: true
        upload-release-assets: false

    # A silently-wrong SBOM format is worse than a missing one: cosign would
    # still stamp https://cyclonedx.org/bom on it and the referrers listing
    # would read as correct. Assert bomFormat before anything is signed.
    - name: Verify platform SBOM files
      shell: bash
      env:
        SAFE_NAME: ${{ steps.name.outputs.safe }}
      run: |
        set -euo pipefail
        for platform in amd64 arm64; do
          sbom_file="sbom-${SAFE_NAME}-linux-${platform}.cdx.json"
          if [[ ! -s "${sbom_file}" ]]; then
            echo "::error::SBOM file not found or empty: ${sbom_file}"
            exit 1
          fi
          bom_format="$(jq -r '.bomFormat // ""' "${sbom_file}")"
          if [[ "${bom_format}" != "CycloneDX" ]]; then
            echo "::error::${sbom_file} has bomFormat ${bom_format:-<absent>}, want CycloneDX"
            exit 1
          fi
        done

    - name: Load versions
      id: versions
      uses: ./.github/actions/load-versions

    # tools/openvex-bind is a Go program in this module with no third-party
    # dependencies, so this only needs a toolchain, not a module download.
    - name: Setup Go
      uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5  # v6.2.0
      with:
        go-version: '${{ steps.versions.outputs.go }}'
        cache: true
        cache-dependency-path: |
          go.sum

    - name: Install Cosign
      uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad  # v4.0.0
      with:
        # Pin from .settings.yaml (>= v3.1.0) so cosign logs DSSE attestations
        # to Rekor v2 as hashedrekord/PAE, matching the binary-attestation path
        # in on-tag.yaml. Leaving this unset let the installer's own default
        # decide both the cosign version and, with it, the on-registry bundle
        # format, an implicit dependency this action must not carry (#1957).
        cosign-release: ${{ steps.versions.outputs.cosign }}

    # Fail closed on a malformed document rather than publishing a VEX
    # attestation that no scanner can apply. The rules, the pinned v0.2.0
    # @context, and the one rule that differs between the committed source and
    # a generated projection all live in openvex-guard.sh, so the two callers
    # cannot drift apart. Only the source is checked here; each projection is
    # checked in the binding step below, before it can reach `cosign attest`.
    - name: Verify OpenVEX document
      id: vex
      shell: bash
      run: |
        set -euo pipefail
        # shellcheck source=.github/actions/sbom-and-attest/openvex-guard.sh
        source "${GITHUB_ACTION_PATH}/openvex-guard.sh"
        vex_file="${GITHUB_WORKSPACE}/.openvex.json"
        validate_openvex source "${vex_file}"
        echo "file=${vex_file}" >> "$GITHUB_OUTPUT"

    # Bind the validated document to each platform manifest, then validate what
    # came out. Binding rewrites `products` on every statement it keeps, so the
    # source check does not cover the bytes that get signed; each projection is
    # re-validated here, before any `cosign attest` call can reach it.
    #
    # Projection mode relaxes one rule and adds another. An empty `statements`
    # array is accepted, because an image with no triaged CVE projects to `[]`
    # and that is the truthful answer for most of the released set. In exchange,
    # every product identifier must end in the platform digest, which is the one
    # failure this whole change exists to prevent.
    #
    # The generator is deterministic (no wall clock, no UUID: the source
    # timestamp and version pass through), so re-running a release reproduces
    # byte-identical evidence. It also drops statements scoped to a different
    # image rather than re-pointing them at this digest. Publishing a signed
    # claim about a product we never triaged here would be worse than
    # publishing none.
    - name: Bind OpenVEX to platform manifests
      shell: bash
      env:
        IMAGE_NAME: ${{ steps.validate.outputs.image_name }}
        AMD64_DIGEST: ${{ steps.validate.outputs.amd64_digest }}
        ARM64_DIGEST: ${{ steps.validate.outputs.arm64_digest }}
        VEX_FILE: ${{ steps.vex.outputs.file }}
        SAFE_NAME: ${{ steps.name.outputs.safe }}
        GOFLAGS: -mod=readonly
      run: |
        set -euo pipefail
        # shellcheck source=.github/actions/sbom-and-attest/openvex-guard.sh
        source "${GITHUB_ACTION_PATH}/openvex-guard.sh"
        for platform in amd64 arm64; do
          case "${platform}" in
            amd64) platform_digest="${AMD64_DIGEST}" ;;
            arm64) platform_digest="${ARM64_DIGEST}" ;;
          esac
          out="vex-${SAFE_NAME}-linux-${platform}.openvex.json"
          go run ./tools/openvex-bind \
            -in "${VEX_FILE}" \
            -out "${out}" \
            -image "${IMAGE_NAME}" \
            -digest "${platform_digest}"
          validate_openvex projection "${out}" "${platform_digest}"
        done

    # --new-bundle-format is set explicitly on every attest call: it is what
    # publishes the attestation through the OCI referrers API (tag fallback on
    # ghcr.io) instead of a legacy `.att` tag, and it must be our decision, not
    # an inherited installer default that can move between cosign releases.
    - name: Cosign amd64 SBOM attestation
      shell: bash
      env:
        IMAGE_NAME: ${{ steps.validate.outputs.image_name }}
        PLATFORM_DIGEST: ${{ steps.validate.outputs.amd64_digest }}
        SAFE_NAME: ${{ steps.name.outputs.safe }}
      run: |
        set -euo pipefail
        timeout --foreground 120s cosign attest \
          --yes \
          --new-bundle-format=true \
          --predicate "sbom-${SAFE_NAME}-linux-amd64.cdx.json" \
          --type cyclonedx \
          "${IMAGE_NAME}@${PLATFORM_DIGEST}"

    - name: Cosign arm64 SBOM attestation
      shell: bash
      env:
        IMAGE_NAME: ${{ steps.validate.outputs.image_name }}
        PLATFORM_DIGEST: ${{ steps.validate.outputs.arm64_digest }}
        SAFE_NAME: ${{ steps.name.outputs.safe }}
      run: |
        set -euo pipefail
        timeout --foreground 120s cosign attest \
          --yes \
          --new-bundle-format=true \
          --predicate "sbom-${SAFE_NAME}-linux-arm64.cdx.json" \
          --type cyclonedx \
          "${IMAGE_NAME}@${PLATFORM_DIGEST}"

    # Publish the triaged vulnerability posture alongside the SBOM, on the same
    # subject. `openvex` is a natively supported cosign predicate type
    # (predicateType https://openvex.dev/ns), so no custom URI is needed. The
    # committed document is still fed to Grype as scanner input in on-tag.yaml
    # and vuln-scan-images.yaml; these steps only publish its digest-bound
    # projection.
    - name: Cosign amd64 OpenVEX attestation
      shell: bash
      env:
        IMAGE_NAME: ${{ steps.validate.outputs.image_name }}
        PLATFORM_DIGEST: ${{ steps.validate.outputs.amd64_digest }}
        SAFE_NAME: ${{ steps.name.outputs.safe }}
      run: |
        set -euo pipefail
        timeout --foreground 120s cosign attest \
          --yes \
          --new-bundle-format=true \
          --predicate "vex-${SAFE_NAME}-linux-amd64.openvex.json" \
          --type openvex \
          "${IMAGE_NAME}@${PLATFORM_DIGEST}"

    - name: Cosign arm64 OpenVEX attestation
      shell: bash
      env:
        IMAGE_NAME: ${{ steps.validate.outputs.image_name }}
        PLATFORM_DIGEST: ${{ steps.validate.outputs.arm64_digest }}
        SAFE_NAME: ${{ steps.name.outputs.safe }}
      run: |
        set -euo pipefail
        timeout --foreground 120s cosign attest \
          --yes \
          --new-bundle-format=true \
          --predicate "vex-${SAFE_NAME}-linux-arm64.openvex.json" \
          --type openvex \
          "${IMAGE_NAME}@${PLATFORM_DIGEST}"

    - name: Attest build provenance
      uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f  # v3.2.0
      with:
        subject-name: ${{ steps.validate.outputs.image_name }}
        subject-digest: ${{ steps.validate.outputs.image_digest }}
        push-to-registry: true
