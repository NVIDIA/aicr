# Sets up Go, the pinned kind, kubectl, helm and yq, and the AICR Operator's
# two-node kind cluster with its in-cluster registry, for the operator's kind
# suites. Run after checkout.

name: 'Operator kind cluster'
description: 'Installs the pinned tools and creates the AICR Operator kind cluster'

inputs:
  kubernetes:
    description: 'floor (operator.kind_node_image_floor) or newest (testing.kind_node_image)'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Load versions
      id: versions
      uses: ./.github/actions/load-versions

    # Two kind nodes each run a kubelet; prep-kind-runner raises the inotify
    # instance limit the second one needs, and frees the disk the kind, Argo CD
    # and operator images take.
    - name: Prep Kind runner
      uses: ./.github/actions/prep-kind-runner

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
      with:
        go-version: ${{ steps.versions.outputs.go }}
        cache: false

    - name: Install Kind, kubectl, Helm and yq
      uses: ./.github/actions/setup-build-tools
      with:
        install_kind: 'true'
        kind_version: '${{ steps.versions.outputs.kind }}'
        install_kubectl: 'true'
        kubectl_version: '${{ steps.versions.outputs.kubectl }}'
        install_helm: 'true'
        helm_version: '${{ steps.versions.outputs.helm }}'
        install_yq: 'true'
        yq_version: '${{ steps.versions.outputs.yq }}'

    - name: Install envsubst
      shell: bash
      run: |
        set -euo pipefail
        command -v envsubst >/dev/null || sudo apt-get install -y --no-install-recommends gettext-base

    # The in-cluster registry's and Argo CD's redis images come from ECR
    # Public, whose anonymous pulls are throttled; keep the pinned images
    # between runs.
    - name: Cache the registry and Argo CD images
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ${{ runner.temp }}/kind-images
        key: operator-kind-images-${{ steps.versions.outputs.registry_image }}-argo-cd-${{ steps.versions.outputs.argocd_chart }}

    - name: Create kind cluster
      env:
        KUBERNETES: ${{ inputs.kubernetes }}
        OPERATOR_KIND_IMAGE_CACHE: ${{ runner.temp }}/kind-images
      shell: bash
      run: |
        set -euo pipefail
        if [[ "${KUBERNETES}" == "floor" ]]; then
          make operator-kind-up-floor
        else
          make operator-kind-up
        fi
