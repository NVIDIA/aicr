name: 'Go Test'
description: 'Setup Go, verify manifests are tidy, run unit tests with race detector and coverage'

inputs:
  go_version:
    description: 'Go version to install (e.g., 1.25)'
    required: true
  coverage_report:
    description: 'Whether to generate coverage report (true/false)'
    required: false
    default: 'false'
  coverage_threshold:
    description: 'Minimum coverage percentage required'
    required: false
    default: ''
  helm_version:
    description: 'Helm version pinned in .settings.yaml (testing_tools.helm, via load-versions) — required by the argocd-helm live-render tests, which fail (not skip) in CI when helm is missing'
    required: true
  apidiff_version:
    description: 'Optional apidiff version pinned in .settings.yaml (linting.apidiff, via load-versions); leave empty to skip the SDK API compatibility check'
    required: false
    default: ''
  oasdiff_version:
    # Required rather than optional: make test runs tools/openapi-diff_test.sh,
    # which fails in CI when oasdiff is absent rather than skipping, so the REST
    # contract gate cannot be left silently unverified.
    description: 'oasdiff version pinned in .settings.yaml (linting.oasdiff, via load-versions)'
    required: true
  setup_envtest_version:
    description: 'setup-envtest version pinned in .settings.yaml (testing_tools.setup_envtest, via load-versions)'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Setup Go
      uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5  # v6.2.0
      with:
        go-version: '${{ inputs.go_version }}'
        cache: true
        cache-dependency-path: |
          go.sum
        check-latest: true

    # `go mod tidy -diff` asks whether go.mod/go.sum are correct for the source:
    # no requirement the code does not import, none missing, no stale go.sum
    # entries. It prints the needed changes and exits non-zero without writing.
    # Nothing checked this before, so a requirement could be added to go.mod
    # that nothing imports and CI stayed green.
    #
    # This used to be paired with a `go mod vendor` + `git diff --exit-code`
    # check. Its subject was vendor/, which #2374 removed, and it never covered
    # for this one: `go mod vendor` regenerates from whatever go.mod says, so a
    # wrong manifest yields a vendor tree matching it perfectly. go.mod was that
    # check's input, not its subject.
    #
    # Nothing is lost on integrity either. Vendored source was never hashed
    # against go.sum at build time; resolution from the module cache is, against
    # go.sum and sum.golang.org, on every build.
    - name: Verify go.mod and go.sum are tidy
      shell: bash
      run: |
        go mod tidy -diff \
          || { echo "go.mod/go.sum are not tidy; run 'make tidy' and commit the result" >&2; exit 1; }

    # The ubuntu-latest runner image bundles Helm 3; the unit tests that
    # shell out to helm (pkg/bundler/deployer/argocdhelm live-render tests)
    # must run against the Helm major pinned in .settings.yaml. The
    # setup-build-tools step replaces any preinstalled binary that does not
    # match the pin and fails the job if the install fails.
    - name: Install Helm
      uses: ./.github/actions/setup-build-tools
      with:
        install_helm: 'true'
        helm_version: '${{ inputs.helm_version }}'

    # Pinned, not @latest: this runs in the merge gate, so an unpinned install
    # lets an upstream release change what every PR is tested against with no
    # commit here. Kept in step with sigs.k8s.io/controller-runtime in go.mod.
    - name: Install envtest binaries
      shell: bash
      env:
        SETUP_ENVTEST_VERSION: ${{ inputs.setup_envtest_version }}
      run: |
        [ -n "${SETUP_ENVTEST_VERSION}" ] \
          || { echo "setup_envtest_version input is required" >&2; exit 1; }
        go install "sigs.k8s.io/controller-runtime/tools/setup-envtest@${SETUP_ENVTEST_VERSION}"
        setup-envtest use --print path >/dev/null 2>&1

    - name: Install API-diff tool
      if: inputs.apidiff_version != ''
      shell: bash
      env:
        APIDIFF_VERSION: ${{ inputs.apidiff_version }}
      run: |
        set -euo pipefail
        GOFLAGS= go install "golang.org/x/exp/cmd/apidiff@${APIDIFF_VERSION}"

    # Installed before `make test`, not after: test-shell runs
    # tools/openapi-diff_test.sh, which exercises the real oasdiff rather than a
    # stub and fails in CI when it is missing.
    - name: Install OpenAPI-diff tool
      shell: bash
      env:
        OASDIFF_VERSION: ${{ inputs.oasdiff_version }}
      run: |
        set -euo pipefail
        [ -n "${OASDIFF_VERSION}" ] \
          || { echo "oasdiff_version input is required" >&2; exit 1; }
        GOFLAGS= go install "github.com/oasdiff/oasdiff@${OASDIFF_VERSION}"

    - name: Run Tests with Coverage
      shell: bash
      run: make test

    - name: Coverage Report
      if: inputs.coverage_report == 'true'
      uses: ./.github/actions/go-coverage
      with:
        coverage_file: ./coverage.out
        threshold: ${{ inputs.coverage_threshold }}

    - name: Check SDK API compatibility
      if: inputs.apidiff_version != ''
      shell: bash
      run: make api-diff

    - name: Check REST contract compatibility
      shell: bash
      run: make openapi-diff
