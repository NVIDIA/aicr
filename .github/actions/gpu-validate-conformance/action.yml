name: 'GPU Validate Conformance'
description: 'Run CNCF AI Conformance validation for a GPU Kind test cluster.'

inputs:
  cluster_name:
    description: 'Kind cluster name'
    required: true

# No Karpenter/KWOK on this real-GPU cluster. Validator pods tolerate every
# taint, so they schedule onto KWOK simulated nodes, where KWOK fakes a
# successful exit without running them and serves no logs (#3818). Without
# Karpenter, cluster-autoscaling records a skip here; it runs alone afterwards
# in gpu-validate-cluster-autoscaling.
runs:
  using: 'composite'
  steps:
    - name: Build conformance validator image
      uses: ./.github/actions/aicr-build
      env:
        KIND_CLUSTER_NAME: ${{ inputs.cluster_name }}
      with:
        build_cli: 'false'
        build_snapshot_agent: 'false'
        validator_phases: 'conformance'
    - name: Validate CNCF AI Conformance
      shell: bash
      env:
        KIND_CLUSTER_NAME: ${{ inputs.cluster_name }}
      run: bash "${{ github.workspace }}/.github/scripts/gpu-validate-conformance.sh"
