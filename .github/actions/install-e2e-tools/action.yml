name: 'Install E2E Testing Tools'
description: 'Installs development tools for E2E testing using the shared setup script'

# This action uses tools/setup-tools to ensure consistency between
# local development and CI environments. The same script, same versions,
# same installation logic - no more "works on my machine" issues.

runs:
  using: "composite"
  steps:
    - name: Cache development tools
      uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306  # v5.0.3
      with:
        path: |
          /usr/local/bin/ctlptl
          /usr/local/bin/kind
          /usr/local/bin/kubectl
          /usr/local/bin/tilt
          /usr/local/bin/ko
          /usr/local/bin/helm
          /usr/local/bin/yq
        # Cache key based on .settings.yaml - invalidates when versions change
        # yamllint disable-line rule:line-length
        key: e2e-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.settings.yaml') }}
        restore-keys: |
          e2e-tools-${{ runner.os }}-${{ runner.arch }}-

    - name: Install tools via setup-tools script
      shell: bash
      run: |
        # Use the shared setup script for consistency with local development
        # --auto: Non-interactive mode (auto-yes to all prompts)
        # --skip-go: Go is set up by actions/setup-go
        # --skip-docker: Docker is pre-installed on GitHub runners
        # --upgrade: CI must run the versions pinned in .settings.yaml, not
        #   whatever binary happens to be on the box. Without it, setup-tools'
        #   guards are presence-only (`command_exists kind`) and keep any
        #   existing binary regardless of version. Two sources feed those
        #   stale binaries: the runner image, and the `restore-keys:` prefix
        #   fallback above, which restores tools from an older cache whenever
        #   .settings.yaml changes the exact key. That silently pinned E2E to
        #   kind v0.31.0 against a v0.33.0 pin, and v0.31.0 emits a
        #   kubeadm.k8s.io/v1beta3 ClusterConfiguration that kubeadm 1.37 (in
        #   kindest/node:v1.37.0) rejects -- breaking cluster-create on main.
        #   Six other pins were being ignored the same way, including helm
        #   v3.20.0 against the v4.2.4 pin.
        chmod +x tools/setup-tools
        AUTO_MODE=true ./tools/setup-tools --skip-go --skip-docker --upgrade

    - name: Report tool installations
      shell: bash
      run: |
        echo "=== Installed Tools ==="
        # This action reports the shared development-tool state, but E2E owns
        # its required-tool contract. Do not make future strict_exact tools
        # outside that contract a prerequisite for every E2E workflow.
        if make tools-check; then
          tools_check_rc=0
        else
          tools_check_rc=$?
          printf '%s\n' "::warning title=Non-gating tool check failed::make tools-check exited with status ${tools_check_rc}; E2E continues because its required-tool contract is narrower."
        fi
