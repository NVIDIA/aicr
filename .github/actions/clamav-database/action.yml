name: 'ClamAV Signature Database'
description: >-
  Install the ClamAV pinned in .settings.yaml and download its signature
  database into a directory, reporting the engine and database versions.

inputs:
  directory:
    description: 'Directory to download the database into; created if absent'
    required: true

outputs:
  directory:
    description: 'The database directory'
    value: ${{ steps.update.outputs.directory }}
  version:
    description: 'Engine and database versions as clamscan reports them, e.g. ClamAV 1.5.5/28189/<date>'
    value: ${{ steps.update.outputs.version }}

runs:
  using: 'composite'
  steps:
    - name: Load versions
      id: versions
      uses: ./.github/actions/load-versions

    - name: Install ClamAV
      uses: ./.github/actions/setup-build-tools
      with:
        install_clamav: 'true'
        clamav_version: ${{ steps.versions.outputs.clamav }}
        clamav_sha256: ${{ steps.versions.outputs.clamav_sha256_linux_amd64 }}

    # freshclam retries a failed mirror on its own; a database it cannot fully
    # download fails the step rather than leaving a partial set behind.
    - name: Download the signature database
      id: update
      shell: bash
      env:
        DB_DIR: ${{ inputs.directory }}
      run: |
        set -euo pipefail
        mkdir -p "${DB_DIR}"
        config="$(mktemp)"
        printf 'DatabaseDirectory %s\nDatabaseMirror database.clamav.net\n' "${DB_DIR}" > "${config}"
        freshclam --config-file="${config}" --stdout
        for db in main daily bytecode; do
          if ! compgen -G "${DB_DIR}/${db}.c[vl]d" >/dev/null; then
            echo "::error::freshclam left no ${db} database in ${DB_DIR}"
            exit 1
          fi
        done
        version="$(clamscan --version --database="${DB_DIR}")"
        if [[ ! "${version}" =~ ^ClamAV\ [0-9.]+/[0-9]+/ ]]; then
          echo "::error::clamscan does not report a database version: '${version}'"
          exit 1
        fi
        echo "Signature database: ${version}"
        {
          echo "directory=${DB_DIR}"
          echo "version=${version}"
        } >> "$GITHUB_OUTPUT"
