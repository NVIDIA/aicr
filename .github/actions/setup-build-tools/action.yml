name: 'Setup Build Tools'
description: >-
  Install build, release, and testing tools (ko, syft, crane, oras, oasdiff, setup-envtest,
  addlicense, goreleaser, chainsaw, helm, helmfile, kubectl, kind, yq, flux, hauler, zarf, ctlptl)

inputs:
  install_ko:
    description: 'Install ko (true/false)'
    required: false
    default: 'false'
  ko_version:
    description: 'ko version (e.g. v0.18.0)'
    required: false
    default: 'v0.18.0'
  install_syft:
    description: 'Install syft (true/false)'
    required: false
    default: 'false'
  install_crane:
    description: 'Install crane (true/false)'
    required: false
    default: 'false'
  crane_version:
    description: 'crane version (e.g. v0.21.0)'
    required: false
    default: 'v0.21.0'
  install_oras:
    description: 'Install oras (true/false)'
    required: false
    default: 'false'
  oras_version:
    description: 'oras version, without the leading v (from .settings.yaml via load-versions; required when install_oras=true)'
    required: false
    default: ''
  oras_sha256:
    description: 'oras SHA256 checksum for linux/amd64 (from .settings.yaml via load-versions; required when install_oras=true)'
    required: false
    default: ''
  install_oasdiff:
    description: 'Install oasdiff (true/false)'
    required: false
    default: 'false'
  oasdiff_version:
    description: 'oasdiff version (from .settings.yaml via load-versions; required when install_oasdiff=true)'
    required: false
    default: ''
  oasdiff_sha256:
    description: 'oasdiff SHA256 checksum for linux/amd64 (from .settings.yaml via load-versions; required when install_oasdiff=true)'
    required: false
    default: ''
  install_setup_envtest:
    description: 'Install setup-envtest (true/false)'
    required: false
    default: 'false'
  setup_envtest_version:
    description: 'setup-envtest version, matching a controller-runtime release tag (from .settings.yaml via load-versions; required when install_setup_envtest=true)'
    required: false
    default: ''
  setup_envtest_sha256:
    description: 'setup-envtest SHA256 checksum for linux/amd64 (from .settings.yaml via load-versions; required when install_setup_envtest=true)'
    required: false
    default: ''
  install_addlicense:
    description: 'Install addlicense (true/false)'
    required: false
    default: 'false'
  addlicense_version:
    description: 'addlicense version (from .settings.yaml via load-versions; required when install_addlicense=true)'
    required: false
    default: ''
  addlicense_sha256:
    description: 'addlicense SHA256 checksum for linux/amd64 (from .settings.yaml via load-versions; required when install_addlicense=true)'
    required: false
    default: ''
  install_goreleaser:
    description: 'Install goreleaser (true/false)'
    required: false
    default: 'false'
  goreleaser_version:
    description: 'GoReleaser version (from .settings.yaml)'
    required: false
    default: ''
  install_chainsaw:
    description: 'Install chainsaw (true/false)'
    required: false
    default: 'false'
  chainsaw_version:
    description: 'Chainsaw version (from .settings.yaml via load-versions; required when install_chainsaw=true)'
    required: false
    default: ''
  chainsaw_sha256:
    description: 'Chainsaw SHA256 checksum for linux/amd64 (from .settings.yaml via load-versions; required when install_chainsaw=true)'
    required: false
    default: ''
  install_helm:
    description: 'Install helm (true/false)'
    required: false
    default: 'false'
  helm_version:
    description: 'Helm version (e.g. v4.1.1)'
    required: false
    default: 'v4.1.1'
  install_helmfile:
    description: 'Install helmfile (true/false)'
    required: false
    default: 'false'
  helmfile_version:
    description: 'Helmfile version (e.g. v1.5.1)'
    required: false
    default: 'v1.5.1'
  helmfile_sha256:
    description: 'Helmfile SHA256 checksum for linux/amd64 (from .settings.yaml, refreshed by tools/update-helmfile-checksums)'
    required: false
    default: ''
  install_kubectl:
    description: 'Install kubectl (true/false)'
    required: false
    default: 'false'
  kubectl_version:
    description: 'kubectl version (e.g. v1.35.0)'
    required: false
    default: 'v1.35.0'
  install_kind:
    description: 'Install kind (true/false)'
    required: false
    default: 'false'
  kind_version:
    description: 'Kind version (e.g. 0.31.0)'
    required: false
    default: '0.31.0'
  install_yq:
    description: 'Install yq (true/false)'
    required: false
    default: 'false'
  yq_version:
    description: 'yq version (e.g. v4.52.4)'
    required: false
    default: 'v4.52.4'
  install_hauler:
    description: 'Install hauler (true/false)'
    required: false
    default: 'false'
  hauler_version:
    description: 'Hauler version (e.g. v1.4.3)'
    required: false
    default: ''
  install_zarf:
    description: 'Install zarf (true/false)'
    required: false
    default: 'false'
  zarf_version:
    description: 'Zarf version (e.g. v0.76.0)'
    required: false
    default: ''
  install_flux:
    description: 'Install flux CLI (true/false)'
    required: false
    default: 'false'
  flux_version:
    description: 'Flux CLI version (e.g. v2.8.7)'
    required: false
    default: ''
  install_ctlptl:
    description: 'Install ctlptl (true/false)'
    required: false
    default: 'false'
  ctlptl_version:
    description: 'ctlptl version (e.g. 0.9.3)'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Install ko
      if: inputs.install_ko == 'true'
      shell: bash
      run: |
        set -euo pipefail
        # Install ko from binary release (go install puts in GOPATH which isn't in PATH)
        # Strip 'v' prefix for URL construction
        KO_VERSION="${{ inputs.ko_version }}"
        KO_VERSION="${KO_VERSION#v}"
        KO_BASE="https://github.com/ko-build/ko/releases/download/v${KO_VERSION}"
        KO_TAR="ko_${KO_VERSION}_Linux_x86_64.tar.gz"
        KO_TMP="$(mktemp -d)"
        curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors --retry-max-time 60 -o "${KO_TMP}/${KO_TAR}" "${KO_BASE}/${KO_TAR}"
        curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors --retry-max-time 60 -o "${KO_TMP}/checksums.txt" "${KO_BASE}/checksums.txt"
        EXPECTED=$(grep "${KO_TAR}" "${KO_TMP}/checksums.txt" | head -1 | awk '{print $1}')
        ACTUAL=$(sha256sum "${KO_TMP}/${KO_TAR}" | awk '{print $1}')
        if [[ "${ACTUAL}" != "${EXPECTED}" ]]; then
          echo "::error::ko checksum mismatch: expected ${EXPECTED}, got ${ACTUAL}"
          exit 1
        fi
        tar -xzf "${KO_TMP}/${KO_TAR}" -C "${KO_TMP}"
        sudo mv "$KO_TMP/ko" /usr/local/bin/ko
        sudo chmod +x /usr/local/bin/ko
        rm -rf "$KO_TMP"
        echo "ko installed: $(ko version)"

    - name: Install Syft
      if: inputs.install_syft == 'true'
      uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0

    - name: Install crane
      if: inputs.install_crane == 'true'
      shell: bash
      run: |
        set -euo pipefail
        # Install crane from binary release (go install puts in GOPATH which isn't in PATH)
        # Strip 'v' prefix for URL construction
        CRANE_VERSION="${{ inputs.crane_version }}"
        CRANE_VERSION="${CRANE_VERSION#v}"
        CRANE_BASE="https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}"
        CRANE_TAR="go-containerregistry_Linux_x86_64.tar.gz"
        CRANE_TMP="$(mktemp -d)"
        curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors --retry-max-time 60 -o "${CRANE_TMP}/${CRANE_TAR}" "${CRANE_BASE}/${CRANE_TAR}"
        curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors --retry-max-time 60 -o "${CRANE_TMP}/checksums.txt" "${CRANE_BASE}/checksums.txt"
        EXPECTED=$(grep "${CRANE_TAR}" "${CRANE_TMP}/checksums.txt" | head -1 | awk '{print $1}')
        ACTUAL=$(sha256sum "${CRANE_TMP}/${CRANE_TAR}" | awk '{print $1}')
        if [[ "${ACTUAL}" != "${EXPECTED}" ]]; then
          echo "::error::crane checksum mismatch: expected ${EXPECTED}, got ${ACTUAL}"
          exit 1
        fi
        tar -xzf "${CRANE_TMP}/${CRANE_TAR}" -C "${CRANE_TMP}"
        sudo mv "$CRANE_TMP/crane" /usr/local/bin/crane
        sudo chmod +x /usr/local/bin/crane
        rm -rf "$CRANE_TMP"
        echo "crane installed: $(crane version 2>&1 || echo '${{ inputs.crane_version }}')"

    # Installed here rather than via oras-project/setup-oras, which resolves the
    # requested version against a statically bundled releases.json and throws on
    # anything newer than the action's last release. That made the CLI pin in
    # .settings.yaml (Renovate) and the action pin (Dependabot) a compatibility
    # pair nothing enforced, and #2648 is what it looks like when they diverge.
    #
    # The checksum is the pin from .settings.yaml, not the checksums.txt served
    # beside the tarball: verifying an artifact against a digest from the same
    # origin catches corruption but not a compromised release, and this runs in
    # a job holding packages: write and id-token: write. Renovate refreshes the
    # pin with the version (tools/update-oras-checksums), so the pair cannot
    # drift the way the setup-oras pairing did.
    - name: Install oras
      if: inputs.install_oras == 'true'
      shell: bash
      run: |
        set -euo pipefail
        ORAS_VERSION="${{ inputs.oras_version }}"
        ORAS_VERSION="${ORAS_VERSION#v}"
        EXPECTED="${{ inputs.oras_sha256 }}"
        if [[ -z "${ORAS_VERSION}" || -z "${EXPECTED}" ]]; then
          echo "::error::install_oras=true requires oras_version and oras_sha256 (pass from load-versions outputs to keep .settings.yaml as the single source of truth)"
          exit 1
        fi
        ORAS_TAR="oras_${ORAS_VERSION}_linux_amd64.tar.gz"
        ORAS_URL="https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/${ORAS_TAR}"
        ORAS_TMP="$(mktemp -d)"
        curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors --retry-max-time 60 -o "${ORAS_TMP}/${ORAS_TAR}" "${ORAS_URL}"
        ACTUAL=$(sha256sum "${ORAS_TMP}/${ORAS_TAR}" | awk '{print $1}')
        if [[ "${ACTUAL}" != "${EXPECTED}" ]]; then
          echo "::error::oras checksum mismatch: expected ${EXPECTED}, got ${ACTUAL}"
          exit 1
        fi
        tar -xzf "${ORAS_TMP}/${ORAS_TAR}" -C "${ORAS_TMP}"
        sudo mv "${ORAS_TMP}/oras" /usr/local/bin/oras
        sudo chmod +x /usr/local/bin/oras
        rm -rf "${ORAS_TMP}"
        echo "oras installed: $(oras version 2>&1 | grep -E '^Version:' || echo "${ORAS_VERSION}")"

    # Binary release rather than `go install`, for the same reason as #2664:
    # `go install pkg@version` builds outside the main module, so go.sum covers
    # none of the tool's dependencies and each is authenticated against
    # sum.golang.org live. A checksum-database outage then fails the job, which
    # is what took down tests / E2E on the v0.21.1 release.
    #
    # The digest is pinned in .settings.yaml rather than read from the
    # checksums.txt served beside the tarball, matching the oras block above.
    # A fetched manifest comes from the same release as the archive, so it
    # detects corruption in transit but not a compromise of the release itself;
    # a value committed and reviewed at this SHA does.
    #
    # That matters here specifically because this replaced `go install`, which
    # authenticated every dependency against sum.golang.org -- a public
    # transparency log with independent witnesses. Swapping that for an unpinned
    # binary would have traded a real integrity guarantee for none. The pin is
    # what keeps this a move from one check to another rather than a regression.
    #
    # tools/update-oasdiff-checksums refreshes it, wired to Renovate's
    # postUpgradeTasks, so a version bump that forgets the digest fails this
    # step on the Renovate PR itself.
    - name: Install oasdiff
      if: inputs.install_oasdiff == 'true'
      shell: bash
      # Routed through env rather than interpolated into the script body: the
      # value comes from a checked-out .settings.yaml, which is fork-controlled
      # on the ok-to-test path. Matches the kubectl/kind/yq/flux blocks below.
      env:
        OASDIFF_INPUT_VERSION: ${{ inputs.oasdiff_version }}
        OASDIFF_INPUT_SHA256: ${{ inputs.oasdiff_sha256 }}
      run: |
        set -euo pipefail
        OASDIFF_VERSION="${OASDIFF_INPUT_VERSION#v}"
        if [[ -z "${OASDIFF_VERSION}" ]]; then
          echo "::error::install_oasdiff=true requires oasdiff_version"
          exit 1
        fi
        # Fail closed on a missing or malformed pin rather than falling back to
        # the release's own checksums.txt: a silent fallback would make the
        # pin's absence indistinguishable from its presence.
        if [[ ! "${OASDIFF_INPUT_SHA256}" =~ ^[0-9a-f]{64}$ ]]; then
          echo "::error::install_oasdiff=true requires oasdiff_sha256 to be a 64-character lowercase sha256 (got '${OASDIFF_INPUT_SHA256}')"
          exit 1
        fi
        OASDIFF_BASE="https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}"
        OASDIFF_TAR="oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
        OASDIFF_TMP="$(mktemp -d)"
        curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors --retry-max-time 60 -o "${OASDIFF_TMP}/${OASDIFF_TAR}" "${OASDIFF_BASE}/${OASDIFF_TAR}"
        ACTUAL=$(sha256sum "${OASDIFF_TMP}/${OASDIFF_TAR}" | awk '{print $1}')
        if [[ "${ACTUAL}" != "${OASDIFF_INPUT_SHA256}" ]]; then
          echo "::error::oasdiff checksum mismatch: expected '${OASDIFF_INPUT_SHA256}', got '${ACTUAL}'"
          exit 1
        fi
        tar -xzf "${OASDIFF_TMP}/${OASDIFF_TAR}" -C "${OASDIFF_TMP}"
        sudo mv "${OASDIFF_TMP}/oasdiff" /usr/local/bin/oasdiff
        sudo chmod +x /usr/local/bin/oasdiff
        rm -rf "${OASDIFF_TMP}"
        echo "oasdiff installed: $(oasdiff --version 2>&1 | head -1 || echo "${OASDIFF_VERSION}")"

    # setup-envtest and addlicense follow the oasdiff block above, for the same
    # reason and with the same integrity story: both replaced a `go install`,
    # which resolves outside the main module and so authenticates every
    # transitive dependency against sum.golang.org live. A checksum-database
    # outage therefore failed the qualification gate on every PR (#2667), the
    # same way it failed tests / E2E on the v0.21.1 release (#2664).
    #
    # Routing through the DGXC Artifactory proxy was the other candidate and is
    # not usable here: it authenticates via GitHub OIDC, which a fork PR cannot
    # mint. The gate has to pass from a fork, so the fix has to work without a
    # credential.
    #
    # controller-runtime publishes setup-envtest as a bare binary with no
    # checksums.txt, so the digest below is the only integrity check on it --
    # computed from the released asset and reviewed at this SHA. addlicense does
    # publish checksums.txt, and its pin was cross-checked against it; the pin is
    # still what the step verifies, because a manifest fetched from the same
    # release detects corruption in transit but not a compromise of the release.
    - name: Install setup-envtest
      if: inputs.install_setup_envtest == 'true'
      shell: bash
      env:
        SETUP_ENVTEST_INPUT_VERSION: ${{ inputs.setup_envtest_version }}
        SETUP_ENVTEST_INPUT_SHA256: ${{ inputs.setup_envtest_sha256 }}
      run: |
        set -euo pipefail
        if [[ -z "${SETUP_ENVTEST_INPUT_VERSION}" ]]; then
          echo "::error::install_setup_envtest=true requires setup_envtest_version"
          exit 1
        fi
        # Normalised to exactly one leading v: the asset lives under a
        # controller-runtime release tag, which carries one.
        SETUP_ENVTEST_VERSION="v${SETUP_ENVTEST_INPUT_VERSION#v}"
        if [[ ! "${SETUP_ENVTEST_INPUT_SHA256}" =~ ^[0-9a-f]{64}$ ]]; then
          echo "::error::install_setup_envtest=true requires setup_envtest_sha256 to be a 64-character lowercase sha256 (got '${SETUP_ENVTEST_INPUT_SHA256}')"
          exit 1
        fi
        SETUP_ENVTEST_URL="https://github.com/kubernetes-sigs/controller-runtime/releases/download/${SETUP_ENVTEST_VERSION}/setup-envtest-linux-amd64"
        SETUP_ENVTEST_TMP="$(mktemp -d)"
        curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors --retry-max-time 60 \
          -o "${SETUP_ENVTEST_TMP}/setup-envtest" "${SETUP_ENVTEST_URL}"
        ACTUAL=$(sha256sum "${SETUP_ENVTEST_TMP}/setup-envtest" | awk '{print $1}')
        if [[ "${ACTUAL}" != "${SETUP_ENVTEST_INPUT_SHA256}" ]]; then
          echo "::error::setup-envtest checksum mismatch: expected '${SETUP_ENVTEST_INPUT_SHA256}', got '${ACTUAL}'."
          echo "::error::Refresh testing_tools.setup_envtest_sha256_linux_amd64 in .settings.yaml: tools/update-setup-envtest-checksums ${SETUP_ENVTEST_VERSION}"
          exit 1
        fi
        sudo mv "${SETUP_ENVTEST_TMP}/setup-envtest" /usr/local/bin/setup-envtest
        sudo chmod +x /usr/local/bin/setup-envtest
        rm -rf "${SETUP_ENVTEST_TMP}"
        echo "setup-envtest installed: ${SETUP_ENVTEST_VERSION}"

    - name: Install addlicense
      if: inputs.install_addlicense == 'true'
      shell: bash
      env:
        ADDLICENSE_INPUT_VERSION: ${{ inputs.addlicense_version }}
        ADDLICENSE_INPUT_SHA256: ${{ inputs.addlicense_sha256 }}
      run: |
        set -euo pipefail
        if [[ -z "${ADDLICENSE_INPUT_VERSION}" ]]; then
          echo "::error::install_addlicense=true requires addlicense_version"
          exit 1
        fi
        ADDLICENSE_VERSION="v${ADDLICENSE_INPUT_VERSION#v}"
        if [[ ! "${ADDLICENSE_INPUT_SHA256}" =~ ^[0-9a-f]{64}$ ]]; then
          echo "::error::install_addlicense=true requires addlicense_sha256 to be a 64-character lowercase sha256 (got '${ADDLICENSE_INPUT_SHA256}')"
          exit 1
        fi
        ADDLICENSE_BASE="https://github.com/google/addlicense/releases/download/${ADDLICENSE_VERSION}"
        ADDLICENSE_TAR="addlicense_${ADDLICENSE_VERSION}_Linux_x86_64.tar.gz"
        ADDLICENSE_TMP="$(mktemp -d)"
        curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors --retry-max-time 60 \
          -o "${ADDLICENSE_TMP}/${ADDLICENSE_TAR}" "${ADDLICENSE_BASE}/${ADDLICENSE_TAR}"
        ACTUAL=$(sha256sum "${ADDLICENSE_TMP}/${ADDLICENSE_TAR}" | awk '{print $1}')
        if [[ "${ACTUAL}" != "${ADDLICENSE_INPUT_SHA256}" ]]; then
          echo "::error::addlicense checksum mismatch: expected '${ADDLICENSE_INPUT_SHA256}', got '${ACTUAL}'."
          echo "::error::Refresh linting.addlicense_sha256_linux_amd64 in .settings.yaml: tools/update-addlicense-checksums ${ADDLICENSE_VERSION}"
          exit 1
        fi
        tar -xzf "${ADDLICENSE_TMP}/${ADDLICENSE_TAR}" -C "${ADDLICENSE_TMP}"
        sudo mv "${ADDLICENSE_TMP}/addlicense" /usr/local/bin/addlicense
        sudo chmod +x /usr/local/bin/addlicense
        rm -rf "${ADDLICENSE_TMP}"
        echo "addlicense installed: $(addlicense -version 2>&1 | head -1 || echo "${ADDLICENSE_VERSION}")"

    - name: Validate GoReleaser version input
      if: inputs.install_goreleaser == 'true'
      shell: bash
      env:
        GORELEASER_VERSION: ${{ inputs.goreleaser_version }}
      run: |
        set -euo pipefail
        if [[ -z "${GORELEASER_VERSION}" ]]; then
          echo "::error::goreleaser_version is required when install_goreleaser=true"
          exit 1
        fi

    - name: Install GoReleaser
      if: inputs.install_goreleaser == 'true'
      uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29  # v7.0.0
      with:
        version: ${{ inputs.goreleaser_version }}
        install-only: true

    - name: Install Chainsaw
      if: inputs.install_chainsaw == 'true'
      shell: bash
      run: |
        set -euo pipefail
        if [[ -x /usr/local/bin/chainsaw ]]; then echo "chainsaw already installed"; chainsaw version; exit 0; fi
        VERSION="${{ inputs.chainsaw_version }}"
        EXPECTED="${{ inputs.chainsaw_sha256 }}"
        if [[ -z "${VERSION}" || -z "${EXPECTED}" ]]; then
          echo "::error::install_chainsaw=true requires chainsaw_version and chainsaw_sha256 (pass from load-versions outputs to keep .settings.yaml as the single source of truth)"
          exit 1
        fi
        VERSION="${VERSION#v}"
        TAR="chainsaw_linux_amd64.tar.gz"
        URL="https://github.com/kyverno/chainsaw/releases/download/v${VERSION}/${TAR}"
        TMP="$(mktemp -d)"
        curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors --retry-max-time 60 -o "${TMP}/${TAR}" "${URL}"
        ACTUAL=$(sha256sum "${TMP}/${TAR}" | awk '{print $1}')
        if [[ "${ACTUAL}" != "${EXPECTED}" ]]; then
          echo "::error::chainsaw checksum mismatch: expected ${EXPECTED}, got ${ACTUAL}"
          exit 1
        fi
        tar -xzf "${TMP}/${TAR}" -C "${TMP}"
        sudo mv "${TMP}/chainsaw" /usr/local/bin/chainsaw
        sudo chmod +x /usr/local/bin/chainsaw
        rm -rf "${TMP}"
        chainsaw version

    - name: Install Helm
      if: inputs.install_helm == 'true'
      shell: bash
      run: |
        set -euo pipefail
        HELM_VERSION="${{ inputs.helm_version }}"
        HELM_VERSION="${HELM_VERSION#v}"
        # The runner image may ship a preinstalled helm (ubuntu-latest bundles
        # Helm 3 at /usr/local/bin/helm). Only skip installation when the
        # existing binary already matches the pinned version; a bare presence
        # check silently ignores the .settings.yaml pin and leaves jobs running
        # the runner's stock Helm 3 instead of the pinned Helm 4.
        if [[ -x /usr/local/bin/helm ]]; then
          INSTALLED="$(/usr/local/bin/helm version --template '{{.Version}}' 2>/dev/null || true)"
          INSTALLED="${INSTALLED#v}"
          if [[ "${INSTALLED}" == "${HELM_VERSION}" ]]; then
            echo "helm ${HELM_VERSION} already installed"
            helm version
            exit 0
          fi
          echo "helm ${INSTALLED:-unknown} present; replacing with pinned ${HELM_VERSION}"
        fi
        HELM_BASE="https://get.helm.sh"
        HELM_TAR="helm-v${HELM_VERSION}-linux-amd64.tar.gz"
        HELM_TMP="$(mktemp -d)"
        curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors --retry-max-time 60 -o "${HELM_TMP}/${HELM_TAR}" "${HELM_BASE}/${HELM_TAR}"
        curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors --retry-max-time 60 -o "${HELM_TMP}/${HELM_TAR}.sha256sum" "${HELM_BASE}/${HELM_TAR}.sha256sum"
        EXPECTED=$(awk '{print $1}' "${HELM_TMP}/${HELM_TAR}.sha256sum")
        ACTUAL=$(sha256sum "${HELM_TMP}/${HELM_TAR}" | awk '{print $1}')
        if [[ "${ACTUAL}" != "${EXPECTED}" ]]; then
          echo "::error::helm checksum mismatch: expected ${EXPECTED}, got ${ACTUAL}"
          exit 1
        fi
        tar -xzf "${HELM_TMP}/${HELM_TAR}" -C "${HELM_TMP}"
        sudo mv "${HELM_TMP}/linux-amd64/helm" /usr/local/bin/helm
        sudo chmod +x /usr/local/bin/helm
        rm -rf "${HELM_TMP}"
        helm version

    - name: Install Helmfile
      if: inputs.install_helmfile == 'true'
      shell: bash
      run: |
        set -euo pipefail
        if [[ -x /usr/local/bin/helmfile ]]; then echo "helmfile already installed"; helmfile --version; exit 0; fi
        HELMFILE_VERSION="${{ inputs.helmfile_version }}"
        HELMFILE_VERSION="${HELMFILE_VERSION#v}"
        EXPECTED="${{ inputs.helmfile_sha256 }}"
        if [[ -z "${EXPECTED}" ]]; then
          echo "::error::helmfile_sha256 input is empty — must be pinned via .settings.yaml testing_tools.helmfile_checksums.linux_amd64 (refresh with tools/update-helmfile-checksums)"
          exit 1
        fi
        HELMFILE_TAR="helmfile_${HELMFILE_VERSION}_linux_amd64.tar.gz"
        HELMFILE_URL="https://github.com/helmfile/helmfile/releases/download/v${HELMFILE_VERSION}/${HELMFILE_TAR}"
        HELMFILE_TMP="$(mktemp -d)"
        curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors --retry-max-time 60 -o "${HELMFILE_TMP}/${HELMFILE_TAR}" "${HELMFILE_URL}"
        ACTUAL=$(sha256sum "${HELMFILE_TMP}/${HELMFILE_TAR}" | awk '{print $1}')
        if [[ "${ACTUAL}" != "${EXPECTED}" ]]; then
          echo "::error::helmfile checksum mismatch: expected ${EXPECTED}, got ${ACTUAL} (if upstream rotated, refresh with tools/update-helmfile-checksums v${HELMFILE_VERSION})"
          exit 1
        fi
        tar -xzf "${HELMFILE_TMP}/${HELMFILE_TAR}" -C "${HELMFILE_TMP}"
        sudo mv "${HELMFILE_TMP}/helmfile" /usr/local/bin/helmfile
        sudo chmod +x /usr/local/bin/helmfile
        rm -rf "${HELMFILE_TMP}"
        helmfile --version

