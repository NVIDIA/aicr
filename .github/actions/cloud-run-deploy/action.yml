name: 'Deploy to Cloud Run'
description: 'Copy image to Artifact Registry and deploy to Cloud Run'

inputs:
  project_id:
    description: 'GCP project id'
    required: true
  workload_identity_provider:
    description: 'Workload Identity Provider resource name'
    required: true
  service_account:
    description: 'GCP service account email (or name@project.iam.gserviceaccount.com)'
    required: true
  region:
    description: 'Cloud Run region'
    required: true
  service:
    description: 'Cloud Run service name'
    required: true
  source_image:
    description: 'Source container image to copy (e.g., ghcr.io/nvidia/aicrd:v1.0.0)'
    required: true
  target_registry:
    description: 'Target Artifact Registry path (e.g., us-west1-docker.pkg.dev/project/repo)'
    required: true
  image_name:
    description: 'Image name in target registry (e.g., aicrd)'
    required: false
    default: 'aicrd'
  ghcr_token:
    description: 'GitHub token for GHCR authentication (use github.token)'
    required: true
  crane_version:
    description: 'crane version (e.g. v0.20.6)'
    required: false
    default: 'v0.21.0'

runs:
  using: 'composite'
  steps:
    - name: Validate inputs
      shell: bash
      env:
        PROJECT_ID: ${{ inputs.project_id }}
        WORKLOAD_IDENTITY_PROVIDER: ${{ inputs.workload_identity_provider }}
        SERVICE_ACCOUNT: ${{ inputs.service_account }}
        REGION: ${{ inputs.region }}
        SERVICE: ${{ inputs.service }}
        SOURCE_IMAGE: ${{ inputs.source_image }}
        TARGET_REGISTRY: ${{ inputs.target_registry }}
      run: |
        set -euo pipefail
        [[ -n "$PROJECT_ID" ]] || { echo "::error::project_id is required"; exit 1; }
        [[ -n "$WORKLOAD_IDENTITY_PROVIDER" ]] || { echo "::error::workload_identity_provider is required"; exit 1; }
        [[ -n "$SERVICE_ACCOUNT" ]] || { echo "::error::service_account is required"; exit 1; }
        [[ -n "$REGION" ]] || { echo "::error::region is required"; exit 1; }
        [[ -n "$SERVICE" ]] || { echo "::error::service is required"; exit 1; }
        [[ -n "$SOURCE_IMAGE" ]] || { echo "::error::source_image is required"; exit 1; }
        [[ -n "$TARGET_REGISTRY" ]] || { echo "::error::target_registry is required"; exit 1; }

    - name: Get Auth Token
      id: auth
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3
      with:
        token_format: access_token
        project_id: ${{ inputs.project_id }}
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        service_account: ${{ inputs.service_account }}

    - name: Setup gcloud CLI
      uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db  # v3.0.1

    - name: Configure Docker for Artifact Registry
      shell: bash
      env:
        TARGET_REGISTRY: ${{ inputs.target_registry }}
      run: |
        # Extract hostname from target registry (e.g., us-docker.pkg.dev/project/repo -> us-docker.pkg.dev)
        REGISTRY_HOST="${TARGET_REGISTRY%%/*}"
        gcloud auth configure-docker "${REGISTRY_HOST}" --quiet

    - name: Install crane
      uses: ./.github/actions/setup-build-tools
      with:
        install_crane: 'true'
        crane_version: ${{ inputs.crane_version }}

    - name: Authenticate to GHCR
      shell: bash
      env:
        GHCR_TOKEN: ${{ inputs.ghcr_token }}
      run: |
        echo "${GHCR_TOKEN}" | crane auth login ghcr.io -u oauth2accesstoken --password-stdin

    - name: Copy image to Artifact Registry
      id: copy
      shell: bash
      env:
        SOURCE_IMAGE: ${{ inputs.source_image }}
        TARGET_REGISTRY: ${{ inputs.target_registry }}
        IMAGE_NAME: ${{ inputs.image_name }}
      run: |
        set -euo pipefail

        # Extract tag from source image
        TAG="${SOURCE_IMAGE##*:}"
        TARGET_IMAGE="${TARGET_REGISTRY}/${IMAGE_NAME}:${TAG}"

        echo "Copying image..."
        echo "  Source: ${SOURCE_IMAGE}"
        echo "  Target: ${TARGET_IMAGE}"

        crane copy "${SOURCE_IMAGE}" "${TARGET_IMAGE}"

        echo "Image copied successfully"
        echo "target_image=${TARGET_IMAGE}" >> "$GITHUB_OUTPUT"

    - name: Update Cloud Run service image
      shell: bash
      run: |
        set -euo pipefail
        echo "Deploying to Cloud Run..."
        gcloud run services update "${{ inputs.service }}" \
          --image "${{ steps.copy.outputs.target_image }}" \
          --region "${{ inputs.region }}" \
          --project "${{ inputs.project_id }}"
        echo "Deploy complete."

    - name: Smoke check deployed service
      shell: bash
      env:
        SERVICE: ${{ inputs.service }}
        REGION: ${{ inputs.region }}
        PROJECT_ID: ${{ inputs.project_id }}
        SOURCE_IMAGE: ${{ inputs.source_image }}
      run: |
        set -euo pipefail

        # A successful `services update` only means the revision was created.
        # Cloud Run keeps serving the last healthy revision when a rollout
        # fails, and /health answers 200 from whichever revision holds traffic
        # — so a liveness probe cannot tell a stale deploy from a fresh one.
        # The demo served v0.17.0 across four releases that way (#2652). Assert
        # the build that answers is the one just deployed.
        expected="${SOURCE_IMAGE##*:}"
        expected="${expected#v}"

        url="$(gcloud run services describe "${SERVICE}" \
          --region "${REGION}" --project "${PROJECT_ID}" \
          --format='value(status.url)')"
        if [[ -z "${url}" ]]; then
          echo "::error::could not resolve URL for service ${SERVICE}"
          exit 1
        fi

        attempts=10
        delay=6
        got=""
        for i in $(seq 1 "${attempts}"); do
          body="$(curl -fsS --max-time 15 "${url}/" || true)"
          got="$(jq -r '.version // empty' <<<"${body}" 2>/dev/null || true)"
          if [[ "${got}" == "${expected}" ]]; then
            echo "Smoke check passed: ${url} reports version ${got}"
            exit 0
          fi
          echo "attempt ${i}/${attempts}: want ${expected}, got '${got:-<no response>}'"
          if [[ "${i}" -lt "${attempts}" ]]; then
            sleep "${delay}"
          fi
        done

        echo "::error::${url} reports '${got:-<no response>}', expected ${expected}"
        exit 1
