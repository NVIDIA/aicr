# Intentional breaking changes to the frozen artifact schemas, checked by
# TestArtifactSchemasAreCompatible against api/aicr/v1/schemas/baseline/.
#
# Each entry needs:
#   rule    one of: field-removed, field-became-required, type-changed,
#           enum-value-removed, enum-restriction-added
#   kind    artifact kind, e.g. RecipeResult. Omit only when the break genuinely
#           applies to every kind.
#   path    dotted field path, e.g. metadata.selectedProfile, or "(root)".
#           Omit only when it genuinely applies to every path -- an unnarrowed
#           entry pre-approves the same break anywhere in the artifact.
#   reason  why this break is acceptable, and when it goes away.
#
# An entry matching no reported break FAILS the gate. That is deliberate: a
# stale acknowledgement silently pre-approves the break returning. Same contract
# as pkg/client/v1/api-diff-exceptions.yaml and
# api/aicr/v1/openapi-diff-exceptions.yaml.
#
# The scheduled ADR-022 apiVersion removals in v0.22 (#2416) and v0.23 (#2417)
# are the expected occupants: retiring an alpha value is an enum-value-removed
# break, planned and dated.
acknowledgements: []
