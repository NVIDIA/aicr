# Intentional breaking changes to the frozen REST contract, checked by
# `make openapi-diff` against api/aicr/v1/server.baseline.yaml.
#
# Each entry needs:
#   id      oasdiff rule id, e.g. api-path-removed-without-deprecation
#   path    optional operation path to narrow the entry to one endpoint.
#           Omit only when the break genuinely applies to every path -- an
#           unnarrowed entry pre-approves the same class of break anywhere.
#   reason  why this break is acceptable, and when it goes away.
#
# An entry that matches no reported breaking change FAILS the gate. That is
# deliberate: a stale acknowledgement silently pre-approves the break coming
# back, which is the failure this file exists to prevent. Same contract as
# pkg/client/v1/api-diff-exceptions.yaml.
#
# The scheduled ADR-022 apiVersion removal in v1.0.0 (#2417) landed and is
# recorded below: a planned narrowing of an enum, represented explicitly rather
# than by disabling the gate.
acknowledgements:
  - id: request-property-enum-value-removed
    path: /v1/bundle
    reason: >-
      ADR-022 §3 Release N+2 (#2417): the alpha `apiVersion` values
      `aicr.run/v1alpha2` and `aicr.run/v1alpha3`, and the legacy empty-string
      member, leave every request enum on this route in v1.0.0. Breaking by
      construction -- a client still sending an alpha value is rejected rather
      than warned, which is the point of the transition: shipping v1.0.0 while
      the readers still accepted alpha would have made alpha acceptance part of
      the frozen v1 surface. Alpha versions owe no deprecation window
      (RELEASE.md, Artifact Compatibility) and v0.22 shipped the emitter switch
      a full release earlier, so no artifact generated by a supported binary
      carries a retired value. Goes away when the baseline next moves.
  - id: response-property-enum-value-added
    path: /v1/recipe
    reason: >-
      Additive `generic` service criteria value (#2566); no existing value
      changed or removed, so only clients strictly validating the response
      enum are affected. Goes away when the baseline next moves.
