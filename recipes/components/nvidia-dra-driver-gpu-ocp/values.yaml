# NVIDIA DRA Driver GPU OCP values
#
# "Inherit the generic helm repo" integration (issue #1818, option 2): no
# certified OLM operator exists for the DRA driver, so this pulls the
# EXACT same upstream chart/version as components/nvidia-dra-driver-gpu/
# values.yaml, unmodified. The only OCP-specific addition is
# manifests/scc-rolebinding.yaml, which grants the kubelet-plugin
# DaemonSet's ServiceAccount the "privileged" SCC it needs for host GPU
# device access — on every other supported platform this access is
# implicit; on OCP it must be granted explicitly via SCC.
#
# fullnameOverride/nameOverride are DELIBERATELY kept identical to the
# base component (not e.g. "nvidia-dra-driver-gpu-ocp"). This is load
# bearing:
#   - the rendered resource names, namespace, and DaemonSet name are
#     therefore byte-identical to base regardless of which one is
#     enabled, so checks/nvidia-dra-driver-gpu/health-check.yaml is
#     reused as-is (see registry.yaml healthCheck.assertFile below) —
#     no duplicate/drifting health-check file to maintain.
#   - validators/conformance/dra_support_check.go and
#     tests/chainsaw/ai-conformance/common/assert-dra-driver.yaml
#     hardcode nvidia-dra-driver-gpu-* names per the base component's
#     own comment; keeping the override identical means those generic
#     conformance checks work unmodified on OCP too.
# ocp.yaml enforces the two component refs stay mutually exclusive
# within a recipe (only one release named accordingly is ever installed
# at a time), so there's no collision risk despite the shared naming.
#
# Everything below this line is an intentional, unmodified copy of
# components/nvidia-dra-driver-gpu/values.yaml — see that file for the
# full GPU allocation mode rationale (issue #1327). Keep the two in sync
# by hand until/unless the registry schema grows a values-inheritance
# mechanism (there isn't one today — see docs/contributor/component.md).

nameOverride: nvidia-dra-driver-gpu
fullnameOverride: nvidia-dra-driver-gpu

nvidiaDriverRoot: /run/nvidia/driver

gpuResourcesEnabledOverride: false
resources:
  gpus:
    enabled: false
  computeDomains:
    enabled: true

controller:
  priorityClassName: ""
kubeletPlugin:
  priorityClassName: ""
