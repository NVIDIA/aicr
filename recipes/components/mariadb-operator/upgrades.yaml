apiVersion: aicr.run/v1beta1
kind: ComponentUpgrades
component: mariadb-operator
transitions:
  # from opens below the pin rather than at 26.6.0: upstream uses CalVer and
  # the only 26.x releases are 26.3.0, 26.6.0 and 26.10.0, so an operator
  # arriving from any of them crosses the same boundary. Naming 26.6.0 as the
  # floor would leave every earlier pin matching nothing.
  #
  # verdict is manual, not safe, and carries no verifiedBy: no UAT lane or
  # KWOK run has exercised this transition. The procedure below is transcribed
  # from upstream's own upgrade guide, not vouched for by a run here.
  - from: "<26.10.0"
    to: "26.10.0"
    verdict: manual
    summary: >-
      26.10.0 changes the replication configuration rendered by the MariaDB
      init container and the replication liveness probe served by the agent,
      so the data plane must move with the operator. autoUpdateDataPlane
      defaults to false, so an operator upgraded without setting it first runs
      26.10.0 against init and agent containers left at the prior version.
      The release also changes the operator's default server image to
      mariadb:12.3.3; AICR pins mariadb:11.8.8 in the slurm-accounting-mariadb
      values, so a cluster bundled from this recipe is unaffected, but any
      MariaDB CR that omits spec.image will come up on a new MariaDB major
      version. The init container and agent are the HA data plane, so they
      exist only where Galera or replication is enabled; the data-plane steps
      below are inert on a single-instance non-HA MariaDB, which is what the
      accounting database AICR ships is by default.
    precondition: >-
      Know which MariaDB resources the operator manages and whether any omits
      spec.image. Check with
      `kubectl get mariadb -A -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name,IMAGE:.spec.image,GALERA:.spec.galera.enabled,REPLICATION:.spec.replication.enabled`;
      a blank IMAGE column means that cluster takes the operator default and
      will move to mariadb:12.3.3 on its next reconcile. Rows where both
      GALERA and REPLICATION are absent or false have no data plane, so only
      the CRD and operator upgrades apply to them.
    affectedResources:
      - group: k8s.mariadb.com
        kinds:
          - MariaDB
    stepsByDeployer:
      - deployers: [helm, helmfile]
        steps:
          - id: enable-dataplane-autoupdate
            description: >-
              kubectl patch mariadb mariadb -n slurm --type merge -p
              '{"spec":{"updateStrategy":{"autoUpdateDataPlane":true}}}'
            reason: >-
              Upstream requires this before the operator moves, so the operator
              updates the init and agent containers instead of leaving them
              behind at the prior version. Repeat for every HA MariaDB the
              precondition listed. On a non-HA instance the field is accepted
              and does nothing, because there is no agent or init container to
              update.
          - id: upgrade-crds
            description: >-
              Confirm the namespace the existing release lives in with
              `helm list -A | grep mariadb-operator-crds`, then upgrade in
              place: `helm upgrade --install mariadb-operator-crds
              oci://ghcr.io/mariadb-operator/charts/mariadb-operator-crds
              --version 26.10.0 --namespace mariadb-system`, substituting the
              namespace the previous command reported.
            reason: >-
              CRDs go first, and in place. helm uninstall on the CRD chart
              deletes the CRDs and cascade-deletes every MariaDB, User,
              Database and Grant with them. --namespace is not optional here:
              Helm scopes a release by namespace, so without it the request
              lands in whatever namespace the kubeconfig context points at,
              --install does not find the existing release, and Helm installs
              a second one that then fights the first for ownership of
              cluster-scoped CRDs. mariadb-system is the registry default and
              no overlay overrides it, but an inherited bundle may differ,
              which is what the helm list confirms.
          - id: upgrade-operator
            description: >-
              Re-run install.sh (helm) or helmfile apply (helmfile).
            reason: >-
              Moves the operator to 26.10.0 once the new CRD schema is
              Established.
          - id: await-dataplane-update
            description: >-
              For each HA MariaDB patched in the first step, wait for the roll
              to finish before continuing:
              `kubectl wait mariadb <name> -n <namespace>
              --for=condition=Updated=True --timeout=15m`, then the same with
              `--for=condition=Ready=True`.
            reason: >-
              The operator applies the new init and agent images
              asynchronously, so reverting the flag while a resource is still
              updating strands it on the old data-plane version against a
              26.10.0 operator, which is the skew this record exists to
              prevent. Name each resource rather than passing --all: the
              Updated condition is absent until an update is triggered, and
              kubectl wait does not return early on an absent condition, so a
              blanket wait burns the full timeout on every instance that had
              no roll to do.
          - id: revert-dataplane-autoupdate
            description: >-
              kubectl patch mariadb mariadb -n slurm --type merge -p
              '{"spec":{"updateStrategy":{"autoUpdateDataPlane":false}}}'
            reason: >-
              Upstream recommends returning it to false so a later operator
              bump does not update the data plane unattended.
      - steps:
          - id: enable-dataplane-autoupdate
            description: >-
              kubectl patch mariadb mariadb -n slurm --type merge -p
              '{"spec":{"updateStrategy":{"autoUpdateDataPlane":true}}}'
            reason: >-
              Same upstream requirement, applied out of band before the sync so
              it lands ahead of the operator. Repeat for every HA MariaDB the
              precondition listed; on a non-HA instance the field is accepted
              and does nothing. A pruning Argo CD or Flux configuration will
              revert this field on the next sync, so run the sync below
              promptly after patching.
          - id: sync-crds
            description: >-
              Sync or reconcile the mariadb-operator-crds release to 26.10.0
              before the operator release.
            reason: >-
              Neither Flux nor Argo CD applies a changed crds/ directory on
              upgrade, and the CRD chart must never be pruned or deleted to
              achieve the version change: that cascade-deletes every MariaDB.
          - id: sync-operator
            description: >-
              Sync or reconcile the mariadb-operator release.
            reason: >-
              Moves the operator to 26.10.0 once the new CRD schema is
              Established.
          - id: await-dataplane-update
            description: >-
              For each HA MariaDB patched in the first step, wait for the roll
              to finish before continuing:
              `kubectl wait mariadb <name> -n <namespace>
              --for=condition=Updated=True --timeout=15m`, then the same with
              `--for=condition=Ready=True`.
            reason: >-
              The operator applies the new init and agent images
              asynchronously, so reverting the flag while a resource is still
              updating strands it on the old data-plane version against a
              26.10.0 operator, which is the skew this record exists to
              prevent. Name each resource rather than passing --all: the
              Updated condition is absent until an update is triggered, and
              kubectl wait does not return early on an absent condition, so a
              blanket wait burns the full timeout on every instance that had
              no roll to do.
          - id: revert-dataplane-autoupdate
            description: >-
              kubectl patch mariadb mariadb -n slurm --type merge -p
              '{"spec":{"updateStrategy":{"autoUpdateDataPlane":false}}}'
            reason: >-
              Upstream recommends returning it to false. If the field is
              managed in git, set it there instead so the next sync does not
              reintroduce true.
    references:
      - https://github.com/mariadb-operator/mariadb-operator/blob/main/docs/releases/UPGRADE_26.10.0.md
      - https://github.com/mariadb-operator/mariadb-operator/releases/tag/26.10.0
