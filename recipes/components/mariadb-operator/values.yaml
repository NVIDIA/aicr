# AICR deployment gate; consumed before Helm rendering.
install: false

# CRDs are a separate dependency so upgrades do not couple their lifecycle to
# the operator release.
crds:
  enabled: false

ha:
  enabled: false

metrics:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1
    memory: 512Mi

webhook:
  ha:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

certController:
  ha:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
