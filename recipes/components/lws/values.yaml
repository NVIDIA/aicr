# LeaderWorkerSet (LWS) Helm values
# Kubernetes SIGs API for deploying a group of pods as a single unit of
# replication — leader/worker pod groups for multi-node inference
# serving (e.g. vLLM or Dynamo multi-host).
#
# Upstream chart v0.8.0 defaults are sufficient for security context
# (runAsNonRoot, readOnlyRootFilesystem, drop ALL capabilities) and
# controller resources (1 CPU / 1Gi requests). The chart self-manages
# its webhook certificate (enableCertManager: false), so this component
# carries no cert-manager dependency.
#
# MAINTENANCE: on every chart version bump, re-diff against
#   helm show values oci://registry.k8s.io/lws/charts/lws --version <new>
# and re-verify the top-level nodeSelector/tolerations paths pinned in
# recipes/registry.yaml nodeScheduling.

# Match the kueue convention for system controllers: tolerate all taints
# so the controller schedules on tainted system pools; bundle-time
# --system-node-selector/--system-toleration flags inject into the same
# top-level paths.
tolerations:
  - operator: Exists
