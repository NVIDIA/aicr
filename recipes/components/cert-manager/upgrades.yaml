apiVersion: aicr.run/v1beta1
kind: ComponentUpgrades
component: cert-manager
transitions:
  # from starts at 1.20.2, the release AICR pinned before 1.20.5 and the only
  # one assessed here; an origin below it resolves to blocked.
  - from: ">=1.20.2 <1.20.5"
    to: "1.20.5"
    verdict: safe
    verifiedBy: >-
      Upstream release notes v1.20.3, v1.20.4 and v1.20.5
      (cert-manager/cert-manager): security and dependency fixes on the
      supported 1.20 line, with no action required. The 1.20.5 chart differs
      from 1.20.2 only in Chart.yaml, the README and templates/rbac.yaml
      (diff -r of the two pulled charts); its CRDs and values.yaml are
      byte-identical.
    summary: >-
      Patch releases with security fixes. The cert-manager-edit aggregate
      ClusterRole no longer grants creating Challenges or creating and
      modifying Orders (GHSA-8rvj-mm4h-c258), objects the controller manages
      itself. Nothing to change on upgrade.
    references:
      - https://github.com/cert-manager/cert-manager/releases/tag/v1.20.3
      - https://github.com/cert-manager/cert-manager/releases/tag/v1.20.5
