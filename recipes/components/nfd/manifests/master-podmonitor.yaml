# Scrapes nfd-master only. The chart's own PodMonitor (prometheus.enable)
# selects every pod in the release, so on a large cluster it adds one
# scrape target per node for the worker DaemonSet to obtain the one
# master target whose memory grows with node count (#3038, #3265).
#
# Temporary until the chart can scope its PodMonitor to a component:
# kubernetes-sigs/node-feature-discovery#2638. When the pinned chart
# carries that, delete this file, drop it from the nfd componentRef in
# overlays/base.yaml, and set the chart value instead.
#
# The selector omits app.kubernetes.io/instance because the Helm release
# name differs by deployer (helm uses the component name, Argo CD derives
# it from the Application name). role=master is set by the chart's
# master.yaml template; it is not a documented chart value.
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: nfd-master
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: before-hook-creation
  labels:
    app.kubernetes.io/name: node-feature-discovery
    app.kubernetes.io/component: master
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      app.kubernetes.io/name: node-feature-discovery
      role: master
  podMetricsEndpoints:
    - port: http
      path: /metrics
      scheme: http
      honorLabels: true
      interval: 60s
