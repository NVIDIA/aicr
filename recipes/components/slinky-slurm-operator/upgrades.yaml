apiVersion: aicr.run/v1beta1
kind: ComponentUpgrades
component: slinky-slurm-operator
transitions:
  # from starts at 1.2.0, the release AICR pinned before 1.2.2 and the only
  # one assessed here; an origin below it resolves to blocked.
  - from: ">=1.2.0 <1.2.2"
    to: "1.2.2"
    verdict: safe
    verifiedBy: >-
      Upstream changelog CHANGELOG-1.2.md (SlinkyProject/slurm-operator) at
      v1.2.2: the v1.2.1 and v1.2.2 entries are fixes, one added Chart
      annotation and a dependency update, with no CRD change and no action
      required. helm template of 1.2.0 and 1.2.2 with AICR's values differs
      only in the operator and webhook image tags, the version labels,
      opt-in metricsSecure plumbing that renders nothing at its false
      default, an explicit --metrics-addr "0" on the webhook that matches the
      webhook binary's own 1.2.0 default, added token-review,
      subject-access-review and secrets/finalizers grants, the webhook
      ClusterRole and ClusterRoleBinding renamed to the release-scoped
      slinky-slurm-operator-webhook, and the pods/binding webhook's
      sideEffects moving from None to NoneOnDryRun.
    summary: >-
      Patch releases of fixes. The webhook's ClusterRole and ClusterRoleBinding
      are replaced under the release-scoped name slinky-slurm-operator-webhook,
      which Helm and Flux do in place; an Argo CD application without pruning
      leaves the old slurm-operator-webhook pair behind, redundant: every
      grant it carries is also in the new role. Nothing to change on upgrade.
    references:
      - https://github.com/SlinkyProject/slurm-operator/blob/v1.2.2/CHANGELOG/CHANGELOG-1.2.md
  - from: ">=1.2.2 <1.2.4"
    to: "1.2.4"
    verdict: manual
    summary: >-
      From 1.2.3 a preStop handler set on a NodeSet's slurmd replaces the
      operator's default one instead of merging with it. The default marks
      the Slurm node down (and from 1.2.4 drained) as its pod terminates, so
      a NodeSet with its own preStop stops doing that unless the handler
      runs those commands itself. The operator also builds slurmd pods with
      CAP_SYS_RESOURCE and an emptyDir spool volume, so worker pods are
      replaced on upgrade.
    precondition: >-
      Know whether any NodeSet sets spec.slurmd.lifecycle.preStop. AICR's
      slinky-slurm values set none, so a default install needs only the
      rollout window.
    stepsByDeployer:
      - steps:
          - id: carry-prestop-commands
            description: >-
              Only if a NodeSet sets spec.slurmd.lifecycle.preStop: add
              `scontrol update nodename=$(hostname) state=down reason='slurm-operator: Pod is terminating'`
              and `scontrol update nodename=$(hostname) state=drain reason='slurm-operator: Pod is terminating'`
              to that handler, keeping the `slurm-operator: ` prefix on the
              reason.
            reason: >-
              Your handler now replaces the operator's default rather than
              running alongside it, so without these commands the Slurm
              controller keeps scheduling onto a node whose pod is going
              away. The operator clears only drains whose reason carries its
              `slurm-operator: ` prefix; a drain with any other reason stays
              until an administrator clears it in Slurm.
          - id: apply
            description: >-
              Apply the regenerated bundle with your deployer in a window
              where slurmd worker pods may be replaced.
            reason: >-
              The pod template the operator builds changes (an added
              SYS_RESOURCE capability, an emptyDir spool volume and the new
              preStop), so the NodeSet controller replaces worker pods
              according to its updateStrategy.
          - id: watch-worker-rollout
            description: >-
              Watch the NodeSet rollout until every pod is ready.
    references:
      - https://github.com/SlinkyProject/slurm-operator/blob/v1.2.4/CHANGELOG/CHANGELOG-1.2.md
  - from: ">=1.2.4 <1.2.5"
    to: "1.2.5"
    verdict: safe
    verifiedBy: >-
      Upstream changelog CHANGELOG-1.2.md (SlinkyProject/slurm-operator) at
      v1.2.5: fixes only (Slurm node status now syncs for unhealthy pods,
      accounting pod template metadata is respected) plus Go CVE updates,
      with no action required. helm template of 1.2.4 and 1.2.5 with AICR's
      values renders the same 16 objects, differing only in the operator and
      webhook image tags and the version labels. The accounting builder now
      merges the Accounting object's spec.template.metadata into the
      slurmdbd pod (internal/builder/accountingbuilder/accounting_app.go,
      v1.2.4..v1.2.5).
    summary: >-
      Patch release of fixes. When accounting is enabled, the slurm chart
      fills the Accounting template's metadata with its own labels, which the
      operator now copies onto the slurmdbd pod, so that pod is replaced once
      on upgrade. Nothing to change on upgrade.
    references:
      - https://github.com/SlinkyProject/slurm-operator/blob/v1.2.5/CHANGELOG/CHANGELOG-1.2.md
      - https://github.com/SlinkyProject/slurm-operator/compare/v1.2.4...v1.2.5
