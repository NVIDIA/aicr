# dra-node-labeler values.
#
# The bundler owns labelKey and labelValue: when --dra-eviction-node-label
# (scheduling.draEvictionNodeLabel) is set they are overwritten with the
# configured pair so the labeler, the DRA kubelet plugin's nodeSelector and
# the GPU Operator Driver Manager's NODE_LABEL_FOR_GPU_POD_EVICTION agree.
# Without the flag the bundler removes this component from the bundle
# entirely; see docs/user/cli-reference.md, "DRA Driver Upgrade Eviction".
labelKey: nvidia.com/dra-kubelet-plugin
labelValue: "true"

# enabled gates whether the manifest renders any objects (ADR-015: the manifest
# renders NOTHING unless enabled is true). It is default-off and opt-in: the
# bundler sets it true in the same --dra-eviction-node-label path that keeps
# this component in the bundle (pkg/bundler injectDRAEvictionLabel), both in
# the Helm values and as an `enabled: true` override on the component ref, so
# the recipe.yaml written into the bundle renders the labeler and the
# deployment validator checks it (#2848). It is the same key as the
# ComponentRef `enabled` override IsEnabled reads: overrides merge into these
# values, and `--set dra-node-labeler:enabled=false` drops the component. The
# default fails closed for a recipe without the opt-in: it renders no objects,
# so the deployment validator suppresses the health check instead of asserting
# a DaemonSet the bundle never carried (issue #2846).
enabled: false
