# dra-node-labeler values.
#
# The bundler owns labelKey and labelValue: when --dra-eviction-node-label
# (scheduling.draEvictionNodeLabel) is set they are overwritten with the
# configured pair so the labeler, the DRA kubelet plugin's nodeSelector and
# the GPU Operator Driver Manager's NODE_LABEL_FOR_GPU_POD_EVICTION agree.
# Without the flag the bundler removes this component from the bundle
# entirely; see docs/user/cli-reference.md, "DRA Driver Upgrade Eviction".
labelKey: nvidia.com/dra-kubelet-plugin
labelValue: "true"

# Must carry a shell (the command is `/bin/sh -c`) and pull anonymously.
# registry.k8s.io/kubectl is distroless and fails with RunContainerError;
# alpine/kubectl is public, multi-arch, and ships busybox sh with kubectl.
# Same tag and digest as nodewright-operator's webhook.removalImage so the
# catalog carries one kubectl image. The script only reads and labels a
# core/v1 Node, an API unchanged across the supported Kubernetes range, so
# kubectl's one-minor skew policy is a warning here, not a failure.
image: docker.io/alpine/kubectl:1.36.2@sha256:01d138ce994b684abc62d9cfdff44de42a4c8996dcc12626dd0193afc3fb5a95
