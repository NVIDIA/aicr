# Fake GPU Operator Helm values
#
# Chart: oci://ghcr.io/run-ai/fake-gpu-operator/fake-gpu-operator
# Namespace: gpu-operator (mutually exclusive with the real gpu-operator)
#
# Simulates GPU resources on nodes for development/testing without real
# hardware. Used by Run:ai dev environments — the runai-installer's
# fake-GPU mode runs this chart instead of the NVIDIA GPU Operator.
#
# Required pre-deploy step: every worker node that should advertise
# simulated GPUs must carry the label
#   run.ai/simulated-gpu-node-pool=<pool-name>
#
# topology-server only emits per-node ConfigMaps for pools listed under
# topology.nodePools, so the label and the pool name MUST match. We declare
# the two conventions we see in the wild so both work without per-cluster
# tweaks:
#   * default     — manually-labeled kind/k3s clusters (the runai-installer
#                   default)
#   * nodepool-0  — kwok-simulated clusters, where the kwok provisioner
#                   pre-labels every worker with run.ai/simulated-gpu-node-pool
#                   =nodepool-0 (and run.ai/fake.gpu=true, nvidia.com/gpu.*).
#
# To label a node manually:
#   kubectl label nodes -l '!node-role.kubernetes.io/control-plane' \
#     run.ai/simulated-gpu-node-pool=default --overwrite

topology:
  nodePools:
    # Per-node simulated GPU count. 8 matches the runai-installer default;
    # bump per-pool if a particular pool should advertise more.
    default:
      gpuCount: 8
    nodepool-0:
      gpuCount: 8
