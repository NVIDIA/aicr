# cert-manager OCP CertManager CR values
#
# Resource requests/limits mirror cert-manager/values.yaml for side-by-side
# comparison. The template maps these flat keys into the
# operator.openshift.io/v1alpha1 CertManager CR spec.
#
# The operator auto-creates a default "cluster" CertManager object if none
# is applied; we apply one explicitly so the operand resource requests
# match every other platform instead of silently falling back to the
# operator's own defaults.
#
# NOTE: this CR is cluster-scoped (no metadata.namespace). The operand
# Deployments it controls (cert-manager, cert-manager-cainjector,
# cert-manager-webhook) always land in a hardcoded "cert-manager"
# namespace regardless of where this CR or the Subscription live — see
# checks/cert-manager-ocp/health-check.yaml.

name: cluster

controllerConfig:
  overrideResources:
    requests:
      memory: "90Mi"
      cpu: "50m"
    limits:
      memory: "90Mi"
      cpu: "50m"

webhookConfig:
  overrideResources:
    requests:
      memory: "40Mi"
      cpu: "50m"
    limits:
      memory: "40Mi"
      cpu: "50m"

cainjectorConfig:
  overrideResources:
    requests:
      memory: "320Mi"
      cpu: "50m"
    limits:
      memory: "320Mi"
      cpu: "50m"
