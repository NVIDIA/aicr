# Images this component deploys that no rendered `image:` field names. See
# "Declared Images" in docs/contributor/component.md.
component: kubeflow-training-operator
manifests:
  - operatorImage: ghcr.io/kubeflow/training-v1/training-operator:v1-93c5489@sha256:45aa299d92c21a1abc0e9731694f01be637ab5c6c9681a687aedf142b0468d45
    images:
      - image: docker.io/library/alpine:3.10
        source: >-
          init-pytorch init container the operator adds to the workers of a
          PyTorchJob with a Master replica. The reference is
          PyTorchInitContainerImageDefault, compiled into v1.9.4, and the
          vendored Deployment does not set --pytorch-init-container-image.
