---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app: training-operator
  name: training-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: training-operator
subjects:
  - kind: ServiceAccount
    name: training-operator
    namespace: {{ .Release.Namespace }}
---
# Shipped empty, as upstream's secretGenerator ships it; the operator fills it
# at startup. Every deployer applies with a three-way merge, so the filled data
# survives a re-apply of this empty spec.
apiVersion: v1
kind: Secret
metadata:
  name: training-operator-webhook-cert
  namespace: {{ .Release.Namespace }}
type: Opaque
data: {}
---
# The app label and the monitoring-port name are what the ServiceMonitor the
# Run:ai operator creates for an external training operator selects on
# (operands.trainingOperator.enabled); keep both when re-vendoring.
apiVersion: v1
kind: Service
metadata:
  annotations:
    prometheus.io/path: /metrics
    prometheus.io/port: "8080"
    prometheus.io/scrape: "true"
  labels:
    app: training-operator
  name: training-operator
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - name: monitoring-port
      port: 8080
      targetPort: 8080
    - name: webhook-server
      port: 443
      protocol: TCP
      targetPort: 9443
  selector:
    control-plane: kubeflow-training-operator
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    control-plane: kubeflow-training-operator
  name: training-operator
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: kubeflow-training-operator
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
      labels:
        control-plane: kubeflow-training-operator
    spec:
      {{- if $vals.systemNodeSelector }}
      nodeSelector:
        {{- toYaml $vals.systemNodeSelector | nindent 8 }}
      {{- end }}
      {{- if $vals.systemTolerations }}
      tolerations:
        {{- toYaml $vals.systemTolerations | nindent 8 }}
      {{- end }}
      containers:
        - command:
            - /manager
          env:
            - name: MY_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          # Literal, not templated from values: tools/bom and aicr mirror read
          # embedded manifests without rendering them. The tag is the key the
          # Run:ai operator maps to a version through runai-cluster's
          # trainingOperatorImageTags (components/runai-cluster/values.yaml);
          # TestKubeflowTrainingOperatorTagMappedForRunai keeps the two equal.
          image: ghcr.io/kubeflow/training-v1/training-operator:v1-93c5489@sha256:45aa299d92c21a1abc0e9731694f01be637ab5c6c9681a687aedf142b0468d45
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          name: training-operator
          ports:
            - containerPort: 8080
            - containerPort: 9443
              name: webhook-server
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - mountPath: /tmp/k8s-webhook-server/serving-certs
              name: cert
              readOnly: true
      serviceAccountName: training-operator
      terminationGracePeriodSeconds: 10
      volumes:
        - name: cert
          secret:
            defaultMode: 420
            secretName: training-operator-webhook-cert
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  labels:
    control-plane: kubeflow-training-operator
  name: validator.training-operator.kubeflow.org
webhooks:
  - admissionReviewVersions:
    - v1
    clientConfig:
      service:
        name: training-operator
        namespace: {{ .Release.Namespace }}
        path: /validate-kubeflow-org-v1-jaxjob
    failurePolicy: Fail
    name: validator.jaxjob.training-operator.kubeflow.org
    rules:
    - apiGroups:
      - kubeflow.org
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - jaxjobs
    sideEffects: None
  - admissionReviewVersions:
    - v1
    clientConfig:
      service:
        name: training-operator
        namespace: {{ .Release.Namespace }}
        path: /validate-kubeflow-org-v1-paddlejob
    failurePolicy: Fail
    name: validator.paddlejob.training-operator.kubeflow.org
    rules:
    - apiGroups:
      - kubeflow.org
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - paddlejobs
    sideEffects: None
  - admissionReviewVersions:
    - v1
    clientConfig:
      service:
        name: training-operator
        namespace: {{ .Release.Namespace }}
        path: /validate-kubeflow-org-v1-pytorchjob
    failurePolicy: Fail
    name: validator.pytorchjob.training-operator.kubeflow.org
    rules:
    - apiGroups:
      - kubeflow.org
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pytorchjobs
    sideEffects: None
  - admissionReviewVersions:
    - v1
    clientConfig:
      service:
        name: training-operator
        namespace: {{ .Release.Namespace }}
        path: /validate-kubeflow-org-v1-tfjob
    failurePolicy: Fail
    name: validator.tfjob.training-operator.kubeflow.org
    rules:
    - apiGroups:
      - kubeflow.org
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - tfjobs
    sideEffects: None
  - admissionReviewVersions:
    - v1
    clientConfig:
      service:
        name: training-operator
        namespace: {{ .Release.Namespace }}
        path: /validate-kubeflow-org-v1-xgboostjob
    failurePolicy: Fail
    name: validator.xgboostjob.training-operator.kubeflow.org
    rules:
    - apiGroups:
      - kubeflow.org
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - xgboostjobs
    sideEffects: None
