# Kubeflow Training Operator v1 (the kubeflow.org/v1 PyTorchJob, TFJob,
# XGBoostJob, PaddleJob, JAXJob and MPIJob v1 controller), as a vendored
# manifest-only component: upstream ships v1 only as Kustomize, with no chart.
# Rendered from github.com/kubeflow/training-operator tag v1.9.4 (commit
# 4445c12aa62e4345b0c2c6ac9b215a70eca46ed7) with
#
#   kubectl kustomize manifests/overlays/standalone
#
# The six CRDs that render alongside are the kubeflow.org_*.yaml files in this
# directory, with their description fields removed (see their headers for why).
# Differences from the render in this file:
#
#   - the Namespace object is dropped: every deployer creates the release
#     namespace itself, and a second owner of the kubeflow namespace would
#     fail the install where Kubeflow Trainer already created it.
#   - namespaced objects and the webhook's service reference use the release
#     namespace, which the registry pins to kubeflow: the Run:ai operator
#     looks the Deployment up by name there (TrainingOperatorNamespace and
#     TrainingOperatorDeploymentName in runai-cluster 3.0.20's go-operator
#     consts), so neither the name nor the namespace may change.
#   - the image carries its digest, and the pod takes the system node
#     placement from values. Nothing else about the pod spec is changed; in
#     particular no --enable-scheme argument is added, because the Run:ai
#     operator reads that list to decide which frameworks are usable and an
#     absent list means all of them.
#
# This is the v1 API, not Kubeflow Trainer v2 (AICR's kubeflow-trainer):
# Run:ai 3.0 submits distributed training as kubeflow.org/v1 jobs and does not
# speak trainer.kubeflow.org. The two operators install different CRD groups
# and differently named objects, so nothing here collides with
# kubeflow-trainer in the same namespace, but no AICR recipe installs both and
# the combination is not qualified (--platform takes one value).
#
# The webhook's serving certificate is self-managed: the operator's
# cert-controller writes a CA and serving pair into the (shipped empty)
# training-operator-webhook-cert Secret and injects the CA into the
# ValidatingWebhookConfiguration at runtime, which is why neither the Secret
# data nor the caBundle appears here and why cert-manager is not a dependency.
# failurePolicy is Fail upstream and is left so: a kubeflow.org job created
# while the webhook is unreachable is rejected rather than admitted unchecked.
{{- $vals := index .Values "kubeflow-training-operator" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app: training-operator
  name: training-operator
  namespace: {{ .Release.Namespace }}
