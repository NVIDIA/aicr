# NKTP (NVKE Telemetry Pipeline) Helm values, ADR-026. Collector resources are
# NKTP's to tune and are not overridden here. Images are the chart's defaults
# at the pinned chart version (ADR-006).

# Collectors schedule ahead of workloads but never evict a running pod. The
# field is immutable: changing it on an installed cluster means deleting the
# class.
priorityClass:
  preemptionPolicy: Never

# Evaluation only: one pod with every signal on emptyDir, anonymous Grafana
# Admin, running as root, no alerting. CheckNKTPExportersHaveBackend requires
# all five backend exporter endpoints to be set when this is disabled.
otel-lgtm:
  enabled: true

opentelemetry-kube-stack:
  crds:
    # prometheus-operator-crds owns the monitoring.coreos.com CRDs. Left on,
    # Argo CD would reapply this chart's copies on every sync and Flux would
    # replace them.
    installPrometheus: false
  opentelemetry-operator:
    manager:
      # The operator's NetworkPolicy allows egress only to the API server's
      # endpoint IPs, but the operator dials the Service ClusterIP, so on EKS
      # with VPC CNI network policy it crash-looped. Off by default since
      # operator 0.160; pinned so a chart bump cannot re-enable it.
      featureGatesMap:
        operator.networkpolicy: false

# Binds host port 9100 on every node. The chart default tolerates only
# NoSchedule taints, which misses GPU nodes with NoExecute taints.
node-exporter:
  tolerations:
    - operator: Exists

# NKTP's autoscalers need a resource metrics API; an overlay enables this
# only on a platform that ships none.
metrics-server:
  enabled: false

# Persistent sending queues are off: the gateways and watchdog keep their
# queues in memory, as in 0.1.1-rc.3. NKTP's queue claims sit in a
# volumeClaimTemplates list that storageClassPaths cannot address, so
# --storage-class cannot reach them, and on a cluster with no default
# StorageClass the collectors would stay Pending. An overlay that turns them
# on restores each collector's queue extension, storage, mount, and
# volumeClaimTemplates, with its own storageClassName. volumeMounts is NKTP's
# list without the queue mount, so re-copy it on a chart bump.
gateway_metrics:
  kubernetes:
    volumeClaimTemplates: []
    volumeMounts:
      - name: internal-tls-server
        mountPath: /etc/nktp/internal-tls/server
        readOnly: true
  otelcol:
    config:
      extensions:
        file_storage/queue: null
      exporters:
        otlp_grpc:
          sending_queue:
            storage: null
      service:
        extensions: [health_check]

gateway_logs:
  kubernetes:
    volumeClaimTemplates: []
    volumeMounts:
      - name: internal-tls-server
        mountPath: /etc/nktp/internal-tls/server
        readOnly: true
  otelcol:
    config:
      extensions:
        file_storage/queue: null
      exporters:
        otlp_grpc:
          sending_queue:
            storage: null
      service:
        extensions: [health_check]

gateway_traces:
  kubernetes:
    volumeClaimTemplates: []
    volumeMounts:
      - name: internal-tls-server
        mountPath: /etc/nktp/internal-tls/server
        readOnly: true
  otelcol:
    config:
      extensions:
        file_storage/queue: null
      exporters:
        otlp_grpc:
          sending_queue:
            storage: null
      service:
        extensions: [health_check]

watchdog:
  kubernetes:
    volumeClaimTemplates: []
    volumeMounts:
      - name: internal-tls-server
        mountPath: /etc/nktp/internal-tls/server
        readOnly: true
  otelcol:
    config:
      extensions:
        file_storage/queue: null
      exporters:
        otlp_grpc:
          sending_queue:
            storage: null
            # NKTP's persistent default is 82MiB per signal; in memory, keep
            # rc.3's 8MiB, sized against the watchdog's 1Gi limit.
            queue_size: 8388608
      service:
        extensions: [health_check]
