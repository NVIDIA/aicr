apiVersion: aicr.run/v1beta1
kind: ComponentUpgrades
component: aws-ebs-csi-driver
transitions:
  # from starts at 2.59.0, the release AICR pinned before 2.68.0 and the only
  # one assessed here; an origin below it resolves to blocked.
  - from: ">=2.59.0 <2.68.0"
    # The ceiling reaches 2.68.1, a rebuild patch assessed by the record
    # below, so a jump from before 2.68.0 straight to the pin keeps these steps.
    to: ">=2.68.0 <=2.68.1"
    skips: ["2.68.1"]
    verdict: manual
    summary: >-
      Three changes in this span can break a customized install. Driver 1.63
      stops publishing -fips images, so a values override pointing at one
      fails to pull. Driver 1.67 rejects StorageClass topologies that name no
      valid zone or zone ID. Chart 2.68 adds a ValidatingAdmissionPolicy, on
      by default on Kubernetes 1.30 and later, that lets the node service
      account update only its own Node, identified by the node-name claim in
      its token, so a node pod without that claim cannot clear its
      agent-not-ready taint.
    precondition: >-
      Know whether your values override the driver image with a -fips tag,
      whether any StorageClass for ebs.csi.aws.com sets allowedTopologies,
      and whether node service-account tokens carry the
      authentication.kubernetes.io/node-name claim (the default since
      Kubernetes 1.30). AICR's values set no image override and its default
      StorageClass names no topology.
    stepsByDeployer:
      - steps:
          - id: drop-fips-image
            description: >-
              Only if your values set a -fips image tag: remove the override
              and set the chart's fips value to true instead.
            reason: >-
              The -fips images are no longer published from 1.63; FIPS mode
              is now a runtime switch on the single image.
          - id: check-storageclass-topology
            description: >-
              For each StorageClass with provisioner ebs.csi.aws.com and
              allowedTopologies, confirm every value names an availability
              zone or zone ID that exists in the region.
            reason: >-
              From 1.67 the driver rejects create and clone requests whose
              topology names neither, which it used to accept.
          - id: apply
            description: >-
              Apply the regenerated bundle with your deployer.
            reason: >-
              Moves aws-ebs-csi-driver to the new version.
          - id: verify-taint
            description: >-
              Wait for every ebs-csi-node pod to be ready and its Node to drop
              the ebs.csi.aws.com/agent-not-ready taint. Only if a ready pod's
              ebs-plugin container keeps logging "Failed to remove
              agent-not-ready taint" with an error naming the
              ValidatingAdmissionPolicy ebs-csi-node, set
              node.validatingAdmissionPolicy.enabled to false and re-apply.
            reason: >-
              Upstream recommends that taint on every node while it starts, so
              its presence alone is not a failure. The policy denies its
              removal only when the token lacks the node-name claim, which
              would leave the node unschedulable for EBS volumes.
    references:
      - https://github.com/kubernetes-sigs/aws-ebs-csi-driver/blob/master/CHANGELOG.md
      - https://github.com/kubernetes-sigs/aws-ebs-csi-driver/pull/3092
      - https://github.com/kubernetes-sigs/aws-ebs-csi-driver/blob/v1.68.0/docs/install.md
  - from: ">=2.68.0 <2.68.1"
    to: "2.68.1"
    verdict: safe
    verifiedBy: >-
      The v1.68.1 entry of CHANGELOG.md (kubernetes-sigs/aws-ebs-csi-driver)
      at tag helm-chart-aws-ebs-csi-driver-2.68.1: a fix for alpha Windows
      hostprocess support when deployed with Helm, and image rebuilds for
      glibc, xfsprogs and Go net/http CVEs, with no CRD change. helm template
      of 2.68.0 and 2.68.1 with AICR's values renders the same 33 objects,
      differing only in image tags (the driver at v1.68.1, each sidecar one
      eksbuild revision up) and the chart and version labels.
    summary: >-
      Patch release of rebuilt images. Nothing to change on upgrade.
    references:
      - https://github.com/kubernetes-sigs/aws-ebs-csi-driver/blob/helm-chart-aws-ebs-csi-driver-2.68.1/CHANGELOG.md
