apiVersion: aicr.run/v1beta1
kind: ComponentUpgrades
component: kai-scheduler
transitions:
  # from starts at v0.16.9, the release AICR pinned before v0.17.2 and the
  # only origin assessed. v0.17.0 and v0.17.1 origins match too: they lack
  # the same fix, so the same steps apply.
  #
  # v0.16.9 was cut after v0.17.0 and carries a podgrouper fix (#2078, the
  # v0.16 backport of #2067) that no v0.17.x release has; v0.18.0 restores it.
  # verdict is manual and carries no verifiedBy: no UAT lane or KWOK run has
  # exercised this transition.
  - from: ">=0.16.9 <0.17.2"
    to: "0.17.2"
    verdict: manual
    summary: >-
      v0.17.x does not carry v0.16.9's podgrouper fix. Its kai-podgrouper
      ClusterRole drops read access to nvidia.com dynamographdeployments, so
      the owner walk is refused at the DynamoGraphDeployment and stops at the
      PodCliqueSet: Dynamo gangs still form, but labels and annotations set
      on the DynamoGraphDeployment, and KAI's per-kind defaults for it, no
      longer reach the PodGroup. A workload wrapped in a run.ai
      WorkloadRunner falls back to one flat PodGroup with minMember 1
      instead of per-clique gangs, and no setting restores that.
    precondition: >-
      No workload is wrapped in a run.ai WorkloadRunner:
      `kubectl get workloadrunners.run.ai -A` returns nothing or reports that
      the resource type does not exist. If any are returned, stay on v0.16.9
      until AICR pins a release that carries the fix.
    affectedResources:
      - group: scheduling.run.ai
        kinds:
          - PodGroup
    stepsByDeployer:
      - deployers: [helm, helmfile]
        steps:
          - id: grant-dgd-read
            description: >-
              Where the DynamoGraphDeployment CRD is installed
              (`kubectl get crd dynamographdeployments.nvidia.com`), grant the
              podgrouper the read access the chart dropped:
              `kubectl create clusterrole kai-podgrouper-dynamo
              --verb=get,list,watch
              --resource=dynamographdeployments.nvidia.com`, then
              `kubectl create clusterrolebinding kai-podgrouper-dynamo
              --clusterrole=kai-podgrouper-dynamo
              --serviceaccount=kai-scheduler:pod-grouper`, replacing the
              second kai-scheduler with the release namespace if yours
              differs.
            reason: >-
              Restores the v0.16.9 behavior for Dynamo workloads. The chart
              does not own these objects, so the upgrade leaves them in
              place; they become redundant once AICR pins a release whose
              chart grants the access itself.
          - id: upgrade-kai-scheduler
            description: >-
              Re-run install.sh (helm) or helmfile apply (helmfile).
            reason: >-
              The chart's pre-upgrade crd-upgrader hook Job applies the
              v0.17.2 CRDs. They add optional fields, drop PodGroup status
              counters upstream never populated (KAI-Scheduler#1670), and
              relax the Topology levels immutability rule to the nodeLabel
              structure.
      - steps:
          - id: grant-dgd-read
            description: >-
              Where the DynamoGraphDeployment CRD is installed
              (`kubectl get crd dynamographdeployments.nvidia.com`), grant the
              podgrouper the read access the chart dropped:
              `kubectl create clusterrole kai-podgrouper-dynamo
              --verb=get,list,watch
              --resource=dynamographdeployments.nvidia.com`, then
              `kubectl create clusterrolebinding kai-podgrouper-dynamo
              --clusterrole=kai-podgrouper-dynamo
              --serviceaccount=kai-scheduler:pod-grouper`, replacing the
              second kai-scheduler with the release namespace if yours
              differs. To keep them in git instead, commit the same two
              objects to a configuration your Argo CD or Flux application
              syncs.
            reason: >-
              Restores the v0.16.9 behavior for Dynamo workloads. The
              kai-scheduler application does not own these objects, so its
              sync neither prunes nor reverts them; they become redundant
              once AICR pins a release whose chart grants the access itself.
          - id: sync-kai-scheduler
            description: >-
              Sync or reconcile the kai-scheduler release.
            reason: >-
              Moves the operator and its operands to v0.17.2. The v0.17.2
              CRDs add optional fields, drop PodGroup status counters
              upstream never populated (KAI-Scheduler#1670), and relax the
              Topology levels immutability rule to the nodeLabel structure.
    references:
      - https://github.com/kai-scheduler/KAI-Scheduler/releases/tag/v0.17.0
      - https://github.com/kai-scheduler/KAI-Scheduler/releases/tag/v0.17.1
      - https://github.com/kai-scheduler/KAI-Scheduler/releases/tag/v0.17.2
      - https://github.com/kai-scheduler/KAI-Scheduler/pull/2067
      - https://github.com/kai-scheduler/KAI-Scheduler/pull/2078
