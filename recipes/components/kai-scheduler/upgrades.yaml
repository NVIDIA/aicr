apiVersion: aicr.run/v1beta1
kind: ComponentUpgrades
component: kai-scheduler
transitions:
  - from: "<0.17.1"
    to: "=0.17.1"
    verdict: blocked
    summary: >-
      In-place migration to KAI Scheduler 0.17.1 has not been qualified for existing
      queues and scheduling workloads. A recipe pin describes a deployment baseline,
      not an upgrade path for an existing installation.
    precondition: >-
      Keep the existing release and its resources intact until a migration
      plan has been verified against the installed version and configuration.
    reversible: false
    reversibleNotes: >-
      A Helm rollback alone has not been verified to restore custom resources
      and their controller behavior across this boundary.
    stepsByDeployer:
      - steps:
          - id: qualify-migration
            description: >-
              Do not apply or sync this version change in place. Export the
              existing release values, CRDs and custom resources; test the
              target version in an isolated cluster using copies of that
              configuration. Establish and verify a migration and recovery
              procedure before scheduling the production transition.
            reason: >-
              Baseline deployment checks do not establish compatibility of
              existing custom resources, active workloads or rollback behavior.
