apiVersion: aicr.run/v1beta1
kind: ComponentUpgrades
component: gatekeeper
transitions:
  # from starts at 3.22.2, the release AICR pinned before 3.23.1 and the only
  # one assessed here; an origin below it resolves to blocked.
  - from: ">=3.22.2 <3.23.1"
    to: "3.23.1"
    verdict: safe
    verifiedBy: >-
      Upstream release notes v3.23.0 and v3.23.1
      (open-policy-agent/gatekeeper), which list no breaking change. helm
      template of 3.22.2 and 3.23.1 with AICR's values differs outside the
      CRDs only in image tags and the quoting of an exempt namespace. The 17
      CRDs keep their served and storage versions and only gain an optional
      applyTo[].operations field on the mutation kinds; none uses webhook
      conversion and no other registry component ships them (the ownsCRDs
      re-audit in pkg/recipe/ownscrds_audit_test.go).
    summary: >-
      Minor release with no breaking change; CRD versions are unchanged.
      Nothing to change on upgrade.
    references:
      - https://github.com/open-policy-agent/gatekeeper/releases/tag/v3.23.0
      - https://github.com/open-policy-agent/gatekeeper/releases/tag/v3.23.1
