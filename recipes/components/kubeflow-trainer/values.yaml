# Kubeflow Training Operator (kubeflow-trainer) Helm values
# Enables distributed training with TrainJob API
# Ref: https://www.kubeflow.org/docs/components/trainer/
#
# Set only keys the pinned chart reads. The chart has no values schema, so Helm
# accepts unknown keys silently and they change nothing in the rendered
# manifests. Settings that look missing here live elsewhere in the chart:
#   - leader election: manager.config.leaderElection.leaderElect
#   - webhook port:    manager.config.webhook.port
#   - CRDs:            shipped in the chart's crds/ directory
#   - service account: always created by the chart
# Chart defaults: https://github.com/kubeflow/trainer/blob/v2.2.0/charts/kubeflow-trainer/values.yaml

# Override release name prefix
fullnameOverride: kubeflow-trainer

# manager configuration
manager:
  # Resource requests and limits for the controller
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Container security context, merged over the chart default, which already
  # sets runAsNonRoot: true and seccompProfile: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true

# JobSet integration (required for TrainJob)
# JobSet provides the underlying primitive for multi-replica training jobs
# Upstream v2.2.0 dependency contract:
# https://github.com/kubeflow/trainer/blob/v2.2.0/charts/kubeflow-trainer/Chart.yaml#L28-L31
# https://github.com/kubeflow/trainer/blob/v2.2.0/charts/kubeflow-trainer/values.yaml#L27-L32
jobset:
  # Install the JobSet dependency managed by Kubeflow Trainer
  # Set to false if a JobSet controller/webhook is already installed in the cluster
  install: true
  prometheus:
    enable: true
