# torch-distributed-rdma carries the GPUDirect-RDMA wiring for a4x-highgpu-4g
# (GB200) GKE clusters that a TrainJob cannot express at the TrainJob level.
#
# gvnic-1 and rdma-0 through rdma-3 are fixed object names on every
# GB200/GKE cluster, so this manifest needs no recipe-recorded configuration
# and renders unconditionally.
#
# NCCL_NET=gIB selects the fabric. It does not apply the gIB installer's
# tuning profile, which a workload sources from its own spec.trainer.command.
# See docs/integrator/gke-gb200-networking.md for that and for the
# cluster-provisioning prerequisites these names depend on.
{{- $kft := index .Values "kubeflow-trainer" }}
apiVersion: trainer.kubeflow.org/v1alpha1
kind: ClusterTrainingRuntime
metadata:
  name: torch-distributed-rdma
  labels:
    trainer.kubeflow.org/framework: torch
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  mlPolicy:
    # numNodes: 2 is deliberate. A single-node default for a multi-node
    # fabric runtime would exercise nothing. TrainJobs override via
    # spec.trainer.numNodes.
    numNodes: 2
    # numProcPerNode was removed from mlPolicy.torch in kubeflow-trainer
    # v2.2.0. Torch now infers parallelism from the container's
    # nvidia.com/gpu resource limit.
    torch: {}
  template:
    spec:
      replicatedJobs:
        - name: node
          template:
            metadata:
              labels:
                trainer.kubeflow.org/trainjob-ancestor-step: trainer
            spec:
              template:
                metadata:
                  annotations:
                    networking.gke.io/default-interface: eth0
                    networking.gke.io/interfaces: '[{"interfaceName":"eth0","network":"default"},{"interfaceName":"eth1","network":"gvnic-1"},{"interfaceName":"eth2","network":"rdma-0"},{"interfaceName":"eth3","network":"rdma-1"},{"interfaceName":"eth4","network":"rdma-2"},{"interfaceName":"eth5","network":"rdma-3"}]'
                spec:
                  # nodeSelector and tolerations are injected by the AICR bundler
                  # from --accelerated-node-selector / --accelerated-node-toleration
                  # flags via the registry's nodeScheduling.accelerated paths
                  # (see recipes/registry.yaml).
                  {{- with $kft.acceleratedNodeSelector }}
                  nodeSelector:
                    {{- toYaml . | nindent 20 }}
                  {{- end }}
                  {{- with $kft.acceleratedTolerations }}
                  tolerations:
                    {{- toYaml . | nindent 20 }}
                  {{- end }}
                  containers:
                    - name: node
                      image: pytorch/pytorch:2.11.0-cuda12.8-cudnn9-runtime@sha256:eee11b3b3872a8c838e35ef48f08b2d5def2080902c7f666831310ca1a0ef2be
                      resources:
                        # a4x-highgpu-4g nodes carry 4 GPUs each. RDMA can't
                        # be shared between Pods on the same node, so this
                        # runtime always requests the whole node.
                        limits:
                          nvidia.com/gpu: "4"
                        requests:
                          nvidia.com/gpu: "4"
                      securityContext:
                        capabilities:
                          # NCCL registers/pins GPU and NIC memory regions.
                          add: ["IPC_LOCK"]
                      env:
                        - name: LD_LIBRARY_PATH
                          value: "/home/kubernetes/bin/nvidia/lib64:/home/kubernetes/bin/gib"
                        - name: NCCL_NET
                          value: gIB
                        - name: NCCL_SOCKET_IFNAME
                          value: eth0
                      volumeMounts:
                        - name: dshm
                          mountPath: /dev/shm
                        - name: nvidia-host
                          mountPath: /home/kubernetes/bin/nvidia
                          readOnly: true
                        - name: gib-host
                          mountPath: /home/kubernetes/bin/gib
                          readOnly: true
                  volumes:
                    - name: dshm
                      emptyDir:
                        medium: Memory
                    - name: nvidia-host
                      hostPath:
                        path: /home/kubernetes/bin/nvidia
                    - name: gib-host
                      hostPath:
                        path: /home/kubernetes/bin/gib
