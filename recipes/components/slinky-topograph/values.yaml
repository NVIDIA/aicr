# slinky-topograph Helm values
# Slinky/Slurm-scoped instance of Topograph — the topology utility that
# generates Slurm topology.conf by querying cloud provider topology APIs
# (GCP, AWS, OCI …). Feeds topology data to the Slinky-managed Slurm
# scheduler so it can make topology-aware placement decisions.
# Not valuable standalone — scheduled by a componentRef on the consuming
# Slurm leaf overlay (dependencyRefs only orders it relative to its peers);
# it deploys after slinky-slurm so that chart owns the config-extra
# ConfigMap before Topograph patches it.
#
# provider.name is the REQUIRED per-overlay override — set it in the
# consuming overlay's overrides: block. engine.name already defaults to
# slinky below: the chart schema requires engine, but this shared values
# file already satisfies it, so overlays do not need to repeat it (the
# slurm leaves still set it explicitly, which is harmless).
#   Valid providers (chart values.schema.json @ v1.0.0): aws, aws-sim, dra,
#   dsx-sim, gcp, gcp-sim, infiniband-bm, infiniband-k8s, lambdai,
#   lambdai-sim, nebius, nebius-sim, netq, nscale, nscale-sim, oci,
#   oci-imds, oci-sim, test
#   Valid engines: graph, k8s, nfd, slinky, slurm
# Example (GKE + Slinky):
#   overrides:
#     provider:
#       name: gcp

# Stabilize the Deployment name to "slinky-topograph"; health-check assertions
# and dependencyRef consumers rely on it. nodeObserver and nodeDataBroker
# Deployment/DaemonSet names derive from this fullname (no separate
# fullnameOverride for those components — they are rendered from the same
# chart, not standalone sub-charts).
fullnameOverride: slinky-topograph

# TEMPORARY — remove once upstream publishes the release image to the new
# package. Tracked on #2793, which stays open until this override is gone.
# Upstream: dsx-ai-factory/topograph#545.
#
# The topograph repository moved from NVIDIA to dsx-ai-factory. The chart
# published as 1.0.0 at the new index was built from `main`, where
# image.repository already points at ghcr.io/dsx-ai-factory/topograph — but
# no release image has been pushed there yet (only three dev tags), so a
# default install renders ghcr.io/dsx-ai-factory/topograph:v1.0.0 and lands
# in ImagePullBackOff.
#
# ghcr.io/nvidia/topograph is still public and serves the genuine multi-arch
# v1.0.0 release image (created 2026-08-18, matching the v1.0.0 release), and
# the chart's appVersion is still v1.0.0, so this override pulls exactly the
# image the release intended. It pairs that image with a chart cut from
# `main`, whose only runtime deltas are CPU values and a narrowed
# ClusterRole: `nodes` drops `get` (keeping `list`), and `nodes/patch` and
# `apps/daemonsets/get` are removed entirely. The v1.0.0 image reaches none
# of those on our paths -- `nodes/patch` is behind `useDynamicNodes`, which
# we leave unset; `nodes/get` is used only by the k8s/lambdai engines and
# the node-data-broker's own role; and `daemonsets/get` only by the
# infiniband-k8s provider. We run engine `slinky` with provider `gcp` or
# `test`. Every other packaged template is unchanged between the two.
image:
  repository: ghcr.io/nvidia/topograph

service:
  type: ClusterIP
  port: 49021
engine:
  name: slinky
  params:
    plugin: topology/tree
    podSelector:
      matchLabels:
        app.kubernetes.io/name: slurmd
    # Chart-owned ConfigMap rendered by the slurm chart from .Values.configFiles
    # (<fullname>-config-extra) and mounted into slurmctld via the Controller
    # CR's configFileRefs. Topograph patches ONLY the topology.conf key
    # (create-or-update with key-level merge), preserving cgroup.conf/gres.conf.
    topologyConfigmapName: slinky-slurm-config-extra
    topologyConfigPath: topology.conf
    namespace: slurm

# Topology request batching delay. Topograph waits this long after the first
# request before querying the provider API, collecting parallel requests into
# a single batch. 15 s is sufficient for typical cluster sizes; reduce for
# latency-sensitive deployments.
config:
  requestAggregationDelay: 15s

serviceAccount:
  create: true
  name: slinky-topograph

# Node Observer — watches the Topograph API pod and triggers topology
# regeneration on API restarts or selected node/pod changes. Rendered from
# the same chart as topograph (not a sub-chart); always deployed alongside it.
nodeObserver:
  topograph:
    trigger:
      podSelector:
        matchLabels:
          app.kubernetes.io/name: slurmd

# Node Data Broker — rendered from the same chart as topograph (not a
# sub-chart). Enabled by default; leaves that don't need it set
# nodeDataBroker.enabled: false in their overlay overrides.
nodeDataBroker: {}
