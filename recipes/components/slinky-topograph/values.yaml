# slinky-topograph Helm values
# Slinky/Slurm-scoped instance of Topograph — the topology utility that
# generates Slurm topology.conf by querying cloud provider topology APIs
# (GCP, AWS, OCI …). Feeds topology data to the Slinky-managed Slurm
# scheduler so it can make topology-aware placement decisions.
# Not valuable standalone — deployed via dependencyRefs in Slurm leaf
# overlays, after Slinky CRDs/operator and before the Slurm cluster instance.
#
# global.provider.name and global.engine.name are REQUIRED per-overlay overrides.
# Set them in the consuming overlay's overrides: block.
#   Valid providers: gcp, aws, oci, nebius, nscale, netq, infiniband-k8s, dra, test
#   Valid engines:   slinky, slurm, k8s, graph
# Example (GKE + Slinky):
#   overrides:
#     global:
#       provider:
#         name: gcp
#       engine:
#         name: slinky

# Stabilize the Deployment name to "slinky-topograph"; health-check assertions
# and dependencyRef consumers rely on it.
fullnameOverride: slinky-topograph

global:
  service:
    type: ClusterIP
    port: 49021
  engine:
    name: slinky
    params:
      plugin: topology/block
      podSelector:
        matchLabels:
          app.kubernetes.io/name: slurmd
      topologyConfigmapName: slinky-slurm-config
      topologyConfigPath: topology.conf
      namespace: slurm

# Topology request batching delay. Topograph waits this long after the first
# request before querying the provider API, collecting parallel requests into
# a single batch. 15 s is sufficient for typical cluster sizes; reduce for
# latency-sensitive deployments.
config:
  requestAggregationDelay: 15s

tolerations:
  - operator: Exists

# node-observer sub-chart — watches the Topograph API pod and triggers
# topology regeneration on API restarts or selected node/pod changes.
# Bundled as a local chart dependency; always deployed alongside topograph.
node-observer:
  # Stabilize the Deployment name for health-check assertions.
  fullnameOverride: slinky-topograph-node-observer
  tolerations:
    - operator: Exists
  topograph:
    trigger:
      podSelector:
        matchLabels:
          app.kubernetes.io/name: slurmd

# node-data-broker sub-chart
# Bundled as a local chart dependency.
node-data-broker:
  enabled: false