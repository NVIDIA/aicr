# cert-manager OCP OLM values
# Controls the OLM Subscription that installs the cert-manager Operator
# for Red Hat OpenShift (github.com/openshift/cert-manager-operator).
#
# AllNamespaces install mode (targetNamespaces: []) — cert-manager issues
# certificates cluster-wide (e.g. for k8s-nim-operator's admission webhook
# in nvidia-nim), so it cannot be scoped to a single consuming namespace
# the way gpu-operator/nfd are.
#
# NOTE: the operator itself runs in this "cert-manager-operator" namespace,
# but its operand Deployments (cert-manager, cert-manager-cainjector,
# cert-manager-webhook) always land in a separate, hardcoded "cert-manager"
# namespace — the operator does not allow this to be changed. See
# components/cert-manager-ocp/values.yaml.

namespace: cert-manager-operator
subscription:
  name: openshift-cert-manager-operator
  channel: stable-v1
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
operatorGroup:
  name: cert-manager-operator-group
  targetNamespaces: []
