clusterPolicy:
  deployCR: true
gpuCluster:
  deployCR: false
driver:
  enabled: true
  version: "595.91.07"
  nvidiaDriverCRD:
    enabled: true
    deployDefaultCR: true
  useOpenKernelModules: true
devicePlugin:
  enabled: true
cdi:
  enabled: true
  nriPluginEnabled: true
nfd:
  enabled: false
migManager:
  enabled: false
fullnameOverride: gpu-operator

# Monitoring is optional and not installed by this reference recipe.
dcgmExporter:
  serviceMonitor:
    enabled: false
