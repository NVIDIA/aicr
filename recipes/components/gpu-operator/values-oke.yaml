# GPU Operator Helm values
# OKE base configuration overrides
#
# Driver, toolkit, and device-plugin ownership is selected by the gpuStack
# configuration profile declared on recipes/overlays/oke-ol.yaml (ADR-015):
# oci-managed (Oracle image driver + OKE's NvidiaGpuPlugin add-on) and
# operator-managed (bring-your-own driverless image, add-on removed; the
# operator installs all three and the DRA root moves to /run/nvidia/driver
# in lockstep). Those paths are
# profile-owned and locked — select the mode at recipe generation
# (--profile gpuStack=<value>), never with bundle-time --set overrides.

# hostPaths.driverInstallDir is intentionally left at the gpu-operator base
# default /run/nvidia/driver: it is the host path the operator-validator
# bind-mounts as the driver-validation container's rootfs target, and "/" is
# rejected by runc ("mountpoint is on the top of rootfs"), crash-looping
# nvidia-operator-validator. nvidia-dra-driver-gpu/values-oke.yaml keeps
# nvidiaDriverRoot: / (host-installed driver userspace at the host root); the
# two are independent here because gpu-operator manages no driver
# (driver.enabled: false below). See TestDriverRootLockstep (#1087).

cdi:
  enabled: true
  default: false

# driver.enabled / toolkit.enabled / devicePlugin.enabled are profile-owned
# (see header) and deliberately absent here — the selected gpuStack value's
# fragment is authoritative.

# Universal OKE bare-metal device-plugin env (independent of the gpuStack
# value; consumed only when the operator's plugin runs):
# - DEVICE_LIST_STRATEGY lists cdi-annotations FIRST: with cri-o + CDI on
#   OKE bare metal, CDI device IDs must flow via pod annotations — the
#   cdi-cri-first default routes them differently and breaks NCCL on
#   SR-IOV clusters.
# - MOFED_ENABLED=false: OKE nodes carry host MOFED, and k8s-device-plugin
#   >= 0.19.0 defaults MOFED_ENABLED=true when CDI is enabled, flooding
#   every host RDMA uverb into every GPU pod and breaking NCCL.
# Helm REPLACES lists: an overlay overriding devicePlugin.env must restate
# these entries.
devicePlugin:
  env:
    # Restated from the base values.yaml (Helm replaces lists).
    - name: DP_DISABLE_HEALTHCHECKS
      value: "109"
    - name: DEVICE_LIST_STRATEGY
      value: cdi-annotations,cdi-cri,volume-mounts
    - name: MOFED_ENABLED
      value: "false"
