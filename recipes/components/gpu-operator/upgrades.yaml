apiVersion: aicr.run/v1beta1
kind: ComponentUpgrades
component: gpu-operator
transitions:
  # Coverage starts at v26.7.0: moves from older releases cross the v26.7.0
  # boundary (DRA driver 0.5.0, driverInstallDir) that no record assesses, so
  # they report unknown rather than borrowing this verdict.
  - from: ">=26.7.0 <26.7.1"
    to: "=26.7.1"
    verdict: safe
    verifiedBy: >-
      Live Helm upgrade on an EKS GB300 cluster (2 GPU nodes,
      k8s 1.35.6), 2026-09-28: v26.7.0 to v26.7.1 with DRA driver 0.5.0;
      ClusterPolicy ready, all operand DaemonSets on the new images, driver
      reloaded cleanly on both nodes. Upstream v26.7.1 release notes.
    summary: >-
      Patch release. The operand image bumps include k8s-driver-manager, which
      changes the driver DaemonSet, so with driver.upgradePolicy.autoUpgrade
      the operator cycles the driver pod node by node and evicts GPU workloads
      on each node in turn; the driver version itself is unchanged. The
      computedomains CRD now matches the DRA driver's, but AICR's Helm and
      Flux deployments leave an installed copy unchanged (gpu-operator is not
      ownsCRDs, and the chart's CRD upgrade hook skips computedomains), so a
      cluster first installed with v26.7.0 keeps the copy that requires
      spec.numNodes.
    references:
      - https://docs.nvidia.com/datacenter/cloud-native/gpu-operator/26.7/release-notes.html#v26-7-1
      - https://github.com/NVIDIA/gpu-operator/pull/2863
      - https://github.com/NVIDIA/aicr/blob/main/docs/user/component-catalog.md#gpu-operator-and-nvidia-dra-driver-gpu-shared-computedomain-crd
  - from: ">=26.7.1 <26.7.2"
    to: "=26.7.2"
    verdict: safe
    verifiedBy: >-
      Live Helm upgrade on an EKS GB300 cluster (2 GPU nodes,
      k8s 1.35.6), 2026-10-13: v26.7.1 to v26.7.2 with DRA driver 0.5.0.
      Both nodes went from upgrade-required straight to pod-restart-required,
      the driver manager kept the loaded driver and the driver container did
      a userspace-only install; a GPU pod on each node kept running with no
      restart, and ClusterPolicy returned to ready. A two-node ComputeDomain
      then came up Ready with IMEX channels injected. Upstream v26.7.2
      milestone and chart diff: no ClusterPolicy or computedomains CRD
      change.
    summary: >-
      Patch release. The chart stamps its version (helm.sh/chart) on every
      operand pod template, so the driver DaemonSet changes. Its install
      config digest does not, so with driver.upgradePolicy.autoUpgrade the
      operator cordons each node in turn and restarts the driver pod in place
      without draining or evicting GPU workloads; a node missing the digest or
      waiting for safe driver load takes the full, evicting flow.
    references:
      - https://github.com/NVIDIA/gpu-operator/milestone/7?closed=1
      - https://github.com/NVIDIA/gpu-operator/compare/v26.7.1...v26.7.2
  - from: ">=26.7.2 <26.7.3"
    to: "=26.7.3"
    verdict: safe
    verifiedBy: >-
      Upstream v26.7.3 release notes and the v26.7.2 to v26.7.3 chart and
      source diff: driver and k8s-driver-manager (v0.12.1) defaults are
      unchanged, the only CRD change is descriptions in the bundled NFD
      subchart's CRDs, which AICR disables, and every DCGM field name in
      AICR's dcgm-exporter metrics CSV still resolves in DCGM 4.7 as a
      deprecated alias.
    summary: >-
      Patch release. As in v26.7.2, the chart version label changes the driver
      DaemonSet while its install config digest does not, so with
      driver.upgradePolicy.autoUpgrade each node is cordoned and its driver pod
      restarted in place without evicting GPU workloads. DCGM Exporter moves to
      4.9.0, which renames its default metrics and changes some units; AICR
      ships its own metrics CSV, so the metric names it exports are unchanged,
      but a cluster that overrides the CSV with the chart default gets the new
      names. Upstream lists k8s-driver-manager v0.13.0 as needed with the DRA
      driver; the chart keeps v0.12.1, and overriding it restarts the driver on
      each node and can evict GPU workloads.
    references:
      - https://docs.nvidia.com/datacenter/cloud-native/gpu-operator/latest/release-notes.html#v26-7-3
      - https://github.com/NVIDIA/gpu-operator/compare/v26.7.2...v26.7.3
      - https://github.com/NVIDIA/dcgm-exporter/releases/tag/4.9.0
