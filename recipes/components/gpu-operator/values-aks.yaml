# GPU Operator Helm values
# AKS base configuration overrides
#
# By default AICR follows the AKS azure-managed install profile — the CSP
# default (`--enable-managed-gpu=false`, no `--gpu-driver none`): the AKS
# node image preinstalls the NVIDIA driver and container toolkit, so the
# GPU Operator runs with driver.enabled=false, toolkit.enabled=false, and
# operator.runtimeClass=nvidia-container-runtime — always the three
# together, never just one of them.
# To let the GPU Operator manage the driver instead (nodepools created
# with `--gpu-driver none`), select the operator profile value at recipe
# time:
#   aicr recipe --service aks ... --profile gpuStack=operator-managed
# The gpuStack profile declaration on the aks overlay owns these paths
# (plus nvidia-dra-driver-gpu's nvidiaDriverRoot), so flipping them via
# per-path --set overrides diverging from the selected value is rejected
# at bundle time.
# See docs/integrator/aks-gpu-setup.md and
# https://learn.microsoft.com/en-us/azure/aks/nvidia-gpu-operator
#
# Reference: https://github.com/Azure/aks-rdma-infiniband/blob/main/configs/values/gpu-operator/values.yaml

# NFD is deployed as a standalone shared component from the base recipe.
# Both network-operator and gpu-operator disable their sub-chart copies
# to avoid running duplicate NFD DaemonSets.
nfd:
  enabled: false

# Network Operator supplies MOFED through its OFED driver container
# (doca-driver, see network-operator/manifests/nic-cluster-policy-aks.yaml).
# Although that container loads modules into the host kernel, this is NOT
# host-preinstalled MOFED — useHostMofed describes how MOFED is installed
# and coordinated, not where its modules execute. Keep useHostMofed false
# so the GPU Operator driver container builds nvidia_peermem against the
# containerized MOFED stack; true can cause an ib_core symbol mismatch
# (modprobe nvidia-peermem: Invalid argument, observed on aicr-test1).
# This stays false regardless of driver ownership mode: with
# driver.enabled=false it is inert, but the correct value prevents a
# future ownership-mode change from reviving the bug.
driver:
  # AKS azure-managed profile: the node image preinstalls the driver.
  enabled: false
  rdma:
    enabled: true
    useHostMofed: false

# The operator deploys gdrcopy as a sidecar container in the operator-managed
# driver pod, so it is inert under driver.enabled=false; to enable it,
# select the operator profile (aicr recipe ... --profile gpuStack=operator-managed)
# and add --set gpuoperator:gdrcopy.enabled=true at bundle time — the path
# is not profile-owned (see docs/integrator/aks-gpu-setup.md).
gdrcopy:
  enabled: false

# The AKS node image preconfigures containerd with the
# nvidia-container-runtime handler; the operator's operands must use it.
# The chart default (`nvidia`) only exists when the container-toolkit
# DaemonSet configures containerd — i.e. in GPU-Operator-managed mode.
operator:
  runtimeClass: nvidia-container-runtime

# The following flags are set in the aks-rdma-infiniband reference configuration
# but are not required for RDMA functionality. They suppress DaemonSets that
# serve no purpose on AKS ND-H100 nodes. Uncomment if your deployment needs them.
# Reference: https://github.com/Azure/aks-rdma-infiniband/blob/main/configs/values/gpu-operator/values.yaml

# migManager:
#   enabled: false  # Multi-Instance GPU not required on ND-H100 inference nodes

# vgpuDeviceManager:
#   enabled: false  # vGPU support not needed

# vfioManager:
#   enabled: false  # VFIO-PCI passthrough not used

# sandboxDevicePlugin:
#   enabled: false  # Sandboxed workloads not enabled

# dcgmExporter:
#   serviceMonitor:
#     additionalLabels:
#       release: kube-prometheus  # Must match kube-prometheus-stack Helm release name

# AKS azure-managed profile: the node image preinstalls the container
# toolkit and preconfigures containerd, so the operator's toolkit
# DaemonSet stays off. The RUNTIME_CONFIG_SOURCE env is inert while
# enabled=false but kept correct for a GPU-Operator-managed flip:
# AKS Ubuntu 24.04 GPU nodes run containerd 2.x (2.3 on current node
# images) with a version=2 root config at /etc/containerd/config.toml.
# The container-toolkit's default config source ("command" =
# `containerd config dump`) returns the MIGRATED effective config
# (version=4), so the generated /etc/containerd/conf.d/99-nvidia.toml
# declares a higher version than the root file and containerd refuses
# to start ("drop-in config version 4 higher than root config
# version 2"), taking the node NotReady. Reading the on-disk file
# instead emits a matching version=2 drop-in. See issue #1688.
toolkit:
  enabled: false
  # Device-isolation hardening for the operator-managed toolkit (the
  # GPU-Operator-managed fallback profile, --gpu-driver none + toolkit.enabled
  # =true). Inert while toolkit.enabled=false (the azure-managed default — there
  # the node-image toolkit is hardened by the nvidia-toolkit-hardening
  # DaemonSet instead). The toolkit installer reads these uppercase env names
  # and writes the lowercase config.toml keys; RUNTIME_CONFIG_SOURCE=file does
  # not suppress them.
  env:
    - name: RUNTIME_CONFIG_SOURCE
      value: file
    - name: ACCEPT_NVIDIA_VISIBLE_DEVICES_ENVVAR_WHEN_UNPRIVILEGED
      value: "false"
    - name: ACCEPT_NVIDIA_VISIBLE_DEVICES_AS_VOLUME_MOUNTS
      value: "true"
