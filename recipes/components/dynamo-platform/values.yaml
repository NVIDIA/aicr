# Dynamo Platform Helm values (v1.4.2)
# NVIDIA Dynamo inference serving platform operator.
# Provides OpenAI-compatible endpoints, KV-cache-aware routing,
# disaggregated prefill/decode, and SLA-driven autoscaling.
# Grove is installed as a separate AICR component (see recipes/components/grove/).

# --- Global subchart controls ---
global:
  # Kubernetes-native discovery replaces etcd for AICR Dynamo workloads.
  etcd:
    install: false
  # Dynamo 1.4+ defaults the request plane to TCP and the KV event plane to
  # ZMQ, so the bundled NATS chart is no longer needed for AICR's defaults.
  # global.nats.install is intentionally left unset (chart default: false).
  # Re-enable only if a workload explicitly opts into a NATS-based transport
  # (legacy DYN_REQUEST_PLANE=nats, DYN_EVENT_PLANE=nats, or a NATS
  # request-trace sink), via global.nats.install: true.
  #
  # Upgrade note: on an in-place `helm upgrade` of a standing cluster,
  # accepting this default removes bundled NATS and drops NATS_SERVER from
  # operator-managed workload specs, which triggers rolling restarts. Fresh
  # bundle installs are unaffected. To opt out and avoid the restart: the
  # generated install.sh does NOT forward extra flags (no --set passthrough)
  # -- edit this component's rendered values.yaml (or cluster-values.yaml)
  # in the bundle directly, setting global.nats.install: true, before
  # re-running install.sh.
  #
  # AICR no longer targets NATS with --system-node-selector/--storage-class
  # at bundle-generation time (the registry's nodeSelectorPaths/
  # tolerationPaths/storageClassPaths for nats.* were removed along with
  # bundled-by-default NATS). If you opt back in on a tainted system
  # nodegroup or a cluster with no default StorageClass, also set
  # nats.podTemplate.merge.spec.nodeSelector/tolerations and
  # nats.config.jetstream.fileStore.pvc.storageClassName by hand in the
  # same values.yaml edit, or the NATS pod/PVC can stay Pending.
  #
  # Disabling NATS removes its StatefulSet but does not delete its PVC.
  # Inspect `kubectl get pvc -n dynamo-system -l app.kubernetes.io/name=nats`
  # before deciding whether to retain or delete it.
  # Disable kai-scheduler sub-chart install — managed as a separate AICR component.
  # Keep enabled: true so the Dynamo operator detects and uses the external scheduler.
  kai-scheduler:
    install: false
    enabled: true
  # Disable grove sub-chart install — installed as a separate AICR component.
  # Keep enabled: true so the Dynamo operator detects the external grove.
  grove:
    install: false
    enabled: true

dynamo-operator:
  # Upgrade CRDs via the platform chart (no separate dynamo-crds 1.0 chart)
  upgradeCRD: true

  # Use Kubernetes-native service discovery.
  discoveryBackend: "kubernetes"

  # Point Dynamo to the existing kube-prometheus-stack for metrics collection.
  # PodMonitor CRs are auto-created by the operator for metric discovery.
  dynamo:
    metrics:
      prometheusEndpoint: "http://kube-prometheus-prometheus.monitoring.svc.cluster.local:9090"
