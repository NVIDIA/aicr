dynamo-operator:
  discoveryBackend: kubernetes
  upgradeCRD: true
  dynamo:
    metrics:
      prometheusEndpoint: ""
global:
  etcd:
    install: false
  grove:
    enabled: true
    install: false
  kai-scheduler:
    enabled: true
    install: false
  nats:
    install: true
nats:
  config:
    jetstream:
      fileStore:
        pvc:
          enabled: true
          size: 10Gi
          storageClassName: compute-csi-default-sc
prometheus:
  enabled: false
