# Images this component deploys that no rendered `image:` field names. See
# "Declared Images" in docs/contributor/component.md.
component: dynamo-platform
charts:
  - repository: https://helm.ngc.nvidia.com/nvidia/ai-dynamo
    chart: dynamo-platform
    sourceVersion: 1.6.2
    images:
      - image: nats:2.10.21-alpine
        enabledBy: global.nats.install
        source: NATS StatefulSet of the bundled nats subchart.
      - image: natsio/nats-server-config-reloader:0.16.0
        enabledBy: global.nats.install
        source: Config reloader sidecar of the bundled nats subchart.
