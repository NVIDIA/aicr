apiVersion: aicr.run/v1beta1
kind: ComponentUpgrades
component: dynamo-platform
transitions:
  - from: ">=1.4.2 <1.5.0"
    to: "=1.5.0"
    verdict: manual
    summary: >-
      1.5.0 migrates CRD storage to v1beta1, removes v1alpha1 admission
      endpoints and DynamoCheckpoint, and moves checkpointing to the standalone
      Snapshot operator. Bundled NATS is disabled by default; accepting that
      default removes NATS and rolls managed workloads without NATS_SERVER.
    precondition: >-
      This guidance starts at the AICR 1.4.2 baseline. Earlier sources are
      outside the assessed migration range.
    stepsByDeployer:
      - steps:
          - id: preserve-event-plane
            description: >-
              Export release values and Dynamo custom resources. Check for
              DYN_EVENT_PLANE=nats, DYN_REQUEST_PLANE=nats and NATS request
              tracing. If these are in use, explicitly retain global.nats.install
              or configure an external server through dynamo-operator.natsAddr
              before applying the new bundle.
            reason: >-
              The new NATS default can remove a dependency of existing workloads.
          - id: migrate-checkpointing
            description: >-
              If checkpointing is used, install the standalone Snapshot operator
              and its CRDs first, enable checkpoint.enabled, and migrate saved
              DynamoCheckpoint definitions to PodSnapshot before removing old
              resources. Update checkpointRef references to PodSnapshot.
            reason: >-
              The Dynamo operator no longer reconciles DynamoCheckpoint.
          - id: migrate-epp
            description: >-
              If using the Go endpoint picker, migrate its deployment and
              configuration to the Rust endpoint picker before upgrading.
            reason: >-
              1.5.0 removes the Go EPP implementation.
          - id: reconcile-api-and-runtime
            description: >-
              Update externally managed admission webhook paths and apiVersions
              to v1beta1. Apply the bundle with its CRDs and let the built-in
              storage migrator convert existing objects. Verify storedVersions,
              webhook readiness and reconciliation of existing deployments.
              Supply a main-component image; for non-semver image tags or
              digests, set runtimeVersionOverride to the actual runtime version.
            reason: >-
              Removed admission endpoints break requests, and runtime feature
              defaults depend on the workload image rather than operator version.
    references:
      - https://github.com/ai-dynamo/dynamo/releases/tag/v1.5.0
      - https://github.com/ai-dynamo/dynamo/blob/v1.5.0/deploy/helm/charts/platform/README.md
