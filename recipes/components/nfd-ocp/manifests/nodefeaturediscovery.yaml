{{- $v := index .Values "nfd-ocp" }}
apiVersion: nfd.openshift.io/v1
kind: NodeFeatureDiscovery
metadata:
  name: {{ $v.name }}
  namespace: {{ $v.namespace }}
  annotations:
    # Deliberately NOT a Helm hook: this CR owns the NFD operands and must
    # be updated in place — hook-delete-policy would remove them on every
    # upgrade and drop node feature labels until the replacement reconciles.
    # CRD-before-CR ordering comes from component sequencing: this
    # manifest-only component is ordered after nfd-ocp-olm, whose
    # Subscription installs the operator and its CRDs.
    aicr/skip-hook-validation: "true"
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  instance: {{ $v.instance | quote }}
  operand:
    servicePort: {{ $v.operand.servicePort }}
  prunerOnDelete: {{ $v.prunerOnDelete }}
  topologyUpdater: {{ $v.topologyUpdater }}
  workerConfig:
    configData: {{ $v.workerConfig.configData | quote }}
