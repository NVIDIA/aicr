# NVIDIA container toolkit device-isolation hardening for every OKE GPU node.
#
# OKE's node bootstrap runs the node image's NVIDIA container toolkit for
# every container through an always-on CRI-O OCI hook, and the toolkit's
# upstream default trusts NVIDIA_VISIBLE_DEVICES from unprivileged
# containers: a pod whose image sets NVIDIA_VISIBLE_DEVICES=all (every CUDA
# base image) would be handed all host GPUs with no Kubernetes allocation.
# The nvidia-setup oci-any combination runs only the configure_container_toolkit
# step, which sets in /etc/nvidia-container-runtime/config.toml:
#   accept-nvidia-visible-devices-envvar-when-unprivileged = false
#   accept-nvidia-visible-devices-as-volume-mounts         = true
# With those keys set, a device plugin must hand GPUs to containers through
# CDI or volume mounts: OKE's NvidiaGpuPlugin add-on must run with
# deviceListStrategy=volume-mounts, which the gpuStack=oci-managed profile
# requires. The toolkit re-reads its config at every container start, so the
# package declares no interrupt (no cordon, drain, reboot or service
# restart). On a node without a host toolkit config the step does nothing;
# under gpuStack=operator-managed the GPU Operator's own toolkit is hardened
# via its toolkit.env (oke-ol.yaml).
#
# runtimeRequired with autoTaintNewNodes taints a new GPU node until the keys
# are set (NVIDIA/nodewright#901).
#
# Node scope is fixed rather than driven by --accelerated-node-selector and
# --accelerated-node-toleration: the hardening covers every GPU node the
# toolkit runs on, whatever subset the tuning packages target.
{{- $cust := index .Values "nodewright-customizations" }}
{{- if ne (toString (index $cust "enabled")) "false" }}
---
apiVersion: nodewright.nvidia.com/v1alpha1
kind: NodeWright
metadata:
  annotations:
    # No Helm hooks: release-managed so that disabling the component retracts
    # the CR (see tuning.yaml). CRD ordering comes from the component
    # dependency on nodewright-operator.
    aicr/skip-hook-validation: "true"
  labels:
    app.kubernetes.io/part-of: skyhook-operator
    app.kubernetes.io/created-by: aicr
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" | trunc 63 | trimSuffix "-" }}
  name: toolkit-hardening
  namespace: {{ .Release.Namespace }}
spec:
  # Ahead of the default-priority tuning CR, so a stuck host-prep package on a
  # node never holds back the hardening.
  priority: 100
  runtimeRequired: true
  # Default: true. Disable with --set nodewrightcustomizations:autoTaintNewNodes=false
  {{- /* Sprig-safe: a "| default true" here would swallow an explicit false under --deployer flux. */}}
  autoTaintNewNodes: {{ ne (toString (index $cust "autoTaintNewNodes")) "false" }}
  # Every GPU node regardless of its pool taints. The wildcard is safe here:
  # the toleration deadlock (NVIDIA/nodewright#296) only affects packages
  # that declare an interrupt, and this one declares none.
  additionalTolerations:
    - operator: Exists
  # Set by OKE's node bootstrap through kubelet --node-labels on GPU shapes,
  # so it is present when the node registers. GPU Operator and NFD labels
  # appear only after their operands roll out, too late to gate a new node.
  nodeSelectors:
    matchLabels:
      nvidia.com/gpu: "true"
  packages:
    nvidia-setup-toolkit:
      image: ghcr.io/nvidia/nodewright-packages/nvidia-setup
      version: "0.10.0"
      containerSHA: sha256:090b17713059b9d2a96a6eecb7540c98ec7f4603eaa9f9f3d5514b87b7c13e0d
      configMap:
        service: oci
        accelerator: any
      {{- /* Until nodewright >= v0.18 resources that get reduced to whole numbers should be expressed */}}
      {{- /* as such or deployers like Argo that continuously sync the resources will result in a */}}
      {{- /* broken deployment. See https://github.com/NVIDIA/nodewright/pull/450 */}}
      resources:
        # The package pod runs on an undrained node, bound to it by nodeName,
        # and a node without the request free rejects it, so request less than
        # the nodewright LimitRange default (500m / 512Mi).
        cpuLimit: 1
        cpuRequest: 100m
        memoryLimit: 1Gi
        memoryRequest: 256Mi
{{- end }}
