# Nodewright GPU customization that runs nvidia-tuned with the rke2 service
# profile (no nvidia-setup), plus the optional rdma-netns-exclusive package
# described at its declaration below.
#
# Used by bare-metal RKE2 leaves whose accelerator profile carries a
# [bootloader] stanza that has to reach the host kernel command line. Where
# service=bcm re-roots the accelerator onto a bootloader-free base so nothing
# needs a reboot, service=rke2 is the opposite trade: it ships no profile
# overrides at all, so each accelerator falls through to its own workload
# profile with the [bootloader] stanza intact (vr200: iommu.passthrough=1,
# init_on_alloc=0, numa_balancing=disable, hugepages, earlycon) and the node
# reboots to pick it up.
#
# Keeping the stanza is not enough on its own: tuned rewrites
# /etc/default/grub, but Ubuntu assembles GRUB_CMDLINE_LINUX_DEFAULT from
# /etc/default/grub.d/ instead, so nvidia-tuned's configure-bootloader step
# writes a drop-in there and regenerates grub, appending rather than replacing
# so the platform's own arguments (serial console) survive. After the reboot,
# post-interrupt-bootloader-check asserts every argument in
# /etc/tuned/bootcmdline reached /proc/cmdline, which is the check worth
# having: grub quietly failing to pick the drop-in up is invisible from the
# config stage.
#
# Scope: the bootloader step is Debian-family only (grub.d sourcing is a
# Debian/Ubuntu patch to grub-mkconfig) and the vr200 profiles are Ubuntu
# 26.04 only. nvidia-setup is deliberately absent — its kernel-headers
# aliasing is a bcm-path concern, and the RKE2 reference image provisions its
# own kernel.
#
# Minimal templating - only tolerations/nodeSelectors are dynamic for CLI flag support.
{{- $cust := index .Values "nodewright-customizations" }}
{{- /* tuningEnabled (default true) disables node tuning uniformly across the */}}
{{- /* nodewright tuning manifests (cf. tuning.yaml); here it gates only the */}}
{{- /* nvidia-tuned package. rdmaNetnsExclusive (default false) gates the RDMA */}}
{{- /* package. The CR renders only when at least one package does. */}}
{{- /* Sprig-safe: compare toString output so an explicit false still reads as */}}
{{- /* false under --deployer flux; a "| default true" would swallow it. */}}
{{- $tuning := ne (toString (index $cust "tuningEnabled")) "false" }}
{{- $rdma := eq (toString (index $cust "rdmaNetnsExclusive")) "true" }}
{{- if and (ne (toString (index $cust "enabled")) "false") (or $tuning $rdma) }}
---
apiVersion: nodewright.nvidia.com/v1alpha1
kind: NodeWright
metadata:
  annotations:
    # No Helm hooks: this NodeWright CR is release-managed so that disabling
    # both packages actually retracts it. As a hook it would be
    # orphaned under Flux on a true->false flip (before-hook-creation never
    # fires once the CR leaves the render). Ordering after the NodeWright CRD
    # is handled by the component dependency on nodewright-operator, not an
    # intra-release hook; helm/argo already strip these hooks at bundle time.
    aicr/skip-hook-validation: "true"
  labels:
    app.kubernetes.io/part-of: skyhook-operator
    app.kubernetes.io/created-by: aicr
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" | trunc 63 | trimSuffix "-" }}
  name: tuning
  namespace: {{ .Release.Namespace }}
spec:
  runtimeRequired: true
  # Serialize this CR's reboots to one node at a time. An omitted budget
  # defaults to 100% (createLegacyDefaultCompartment), i.e. every matched
  # node rebooting together. Unconditional rather than flag-gated: the safe
  # value must not depend on the caller passing an optional flag. One CR
  # carries both rebooting packages so this budget bounds all of them — a
  # second CR's budget would not compose with this one (#2572).
  #
  # SCALE LIMITATION: count: 1 costs N x (reboot time) to converge, which
  # is fine for the small NVL72 clusters VR200 Preview targets and for
  # rolling out gradually on a cluster already running work, but does not
  # scale to hundreds of nodes. The nodewright maintainer's guidance for
  # that case is a ramping deployment policy with a failure threshold
  # rather than a fixed count — noting that runtimeRequired: true means
  # workloads stay blocked on the last node for the whole rollout, so a
  # ramp trades convergence time against how long that blocking lasts.
  # Revisit if VR200 deployments grow past a rack.
  interruptionBudget:
    count: 1
  # Default: true. Disable with --set nodewrightcustomizations:autoTaintNewNodes=false
  {{- /* Sprig-safe: a "| default true" here would swallow an explicit false under --deployer flux. */}}
  autoTaintNewNodes: {{ ne (toString (index $cust "autoTaintNewNodes")) "false" }}
  # Dynamic: Supports --accelerated-node-toleration CLI flag
  additionalTolerations:
    {{- if $cust.acceleratedTolerations }}
    {{- toYaml $cust.acceleratedTolerations | nindent 4 }}
    {{- else }}
    # Tolerate-all default, matching ParseTolerations()/DefaultTolerations()
    # (operator Exists, no key). Only reached if no acceleratedTolerations are
    # injected from scheduling defaults/flags.
    - operator: Exists
    {{- end }}
  # Dynamic: Supports --accelerated-node-selector CLI flag.
  # An ABSENT selector matches every node in nodewright, so omitting the block
  # entirely would let a reboot-carrying CR target control-plane nodes on a
  # stock bundle — generation only warns when the flag is unset, it does not
  # fail. Fall back to the GPU-node label instead; an explicit
  # --accelerated-node-selector still overrides it.
  nodeSelectors:
    matchLabels:
      {{- if $cust.acceleratedNodeSelector }}
      {{- toYaml $cust.acceleratedNodeSelector | nindent 6 }}
      {{- else }}
      nvidia.com/gpu.present: "true"
      {{- end }}
  # Dynamic: Supports --workload-selector CLI flag
  {{- if $cust.workloadSelector }}
  podNonInterruptLabels:
    matchLabels:
      {{- toYaml $cust.workloadSelector | nindent 6 }}
  {{- end }}
  # Neither package dependsOn the other, so both are runnable in the same
  # operator pass and nodewright coalesces their reboots into one per node.
  # The coalesced reboot is issued by the first package in name order;
  # nvidia-tuned must stay first because it is the slower package, and the
  # reboot fires as soon as no package Job is running on the node.
  packages:
    {{- if $tuning }}
    nvidia-tuned:
      image: ghcr.io/nvidia/nodewright-packages/nvidia-tuned
      version: "0.10.0"
      containerSHA: sha256:124f3bdedbb651125cec1bf20d3e2f7fcbbe10588c44f36d8e5680b38b9ef8f6
      # Required by the rke2 service: the accelerator's [bootloader] stanza is
      # written during config and none of it is live until the node reboots.
      interrupt:
        type: reboot
      # The cmdline is resolved from (accelerator, intent, service), so a change
      # to any of them needs another reboot to take effect.
      configInterrupts:
        accelerator:
          type: reboot
        intent:
          type: reboot
        service:
          type: reboot
      env:
        # Lets config-check tolerate the `tuned-adm verify` failures that only a
        # reboot can resolve; post-interrupt-check still enforces them after it.
        - name: INTERRUPT
          value: "true"
      configMap:
        {{- if $cust.intent }}
        intent: {{ $cust.intent }}
        {{- end }}
        accelerator: {{ $cust.accelerator }}
        {{- if $cust.service }}
        service: {{ $cust.service }}
        {{- end }}
    {{- end }}
    {{- if $rdma }}
    # Host RDMA "exclusive" network-namespace mode, paired with dranet so each
    # pod sees only its DRA-allocated HCA(s) in /sys/class/infiniband — in the
    # default shared mode sysfs is not namespaced and NCCL auto-detect trips
    # on HCAs the pod cannot open. The mode is the ib_core module parameter
    # netns_mode (0=exclusive, 1=shared default). It cannot change live: the
    # sysfs param is read-only, `rdma system set netns exclusive` returns
    # EBUSY while any non-init netns exists, and ib_core cannot be unloaded
    # under the mlx5 stack. So it is persisted via modprobe.d and applied by
    # the reboot (ib_core loads post-root on the VR200 reference image, so
    # modprobe.d rather than initramfs/GRUB is sufficient). Host-wide: every
    # RDMA user on the node sees the change.
    rdma-netns-exclusive:
      image: ghcr.io/nvidia/skyhook-packages/shellscript
      version: "1.1.1"
      containerSHA: sha256:5414b06e52c090d0842704f2580798064362d771f12421ccc8888186b5f5a3cf
      interrupt:
        type: reboot
      configMap:
        apply.sh: |-
          #!/bin/bash
          set -euo pipefail
          # 0 = exclusive (per-netns RDMA isolation), 1 = shared (kernel default)
          printf 'options ib_core netns_mode=0\n' > /etc/modprobe.d/dranet-rdma-netns-exclusive.conf
        apply_check.sh: |-
          #!/bin/bash
          set -euo pipefail
          grep -qx 'options ib_core netns_mode=0' /etc/modprobe.d/dranet-rdma-netns-exclusive.conf
    {{- end }}
{{- end }}
