# Nodewright GB300 GPU customization for bare metal: nvidia-tuned only, no
# nvidia-setup.
#
# Used by gb300-generic-ubuntu-training. The EKS gb300 leaves use the shared
# tuning.yaml instead, since nvidia-setup 0.8.0 added the eks-gb300 combination.
# There is no equivalent for bare metal: nvidia-setup dispatches on
# `<service>-<accelerator>` and ships no `generic-*` config at all, so
# tuning.yaml would fail on this leaf. A bare-metal GB300 node therefore takes
# its kernel and EFA from the host image.
#
# That leaves the host kernel's page granule as a performance variable here,
# where on EKS nvidia-setup-kernel pins it. nvidia-gb300-performance sizes its
# pools for a 64k-page ARM64 kernel (2M + 512M, no 1G: a 64k granule has no PUD
# level). A 4k-granule kernel still boots and runs the node — Linux rejects the
# hugepagesz=512M clause and silently drops the hugepages= count paired with it
# — it just comes up without the pool the profile intended. So 64k is the
# recommended host image, not a hard requirement: CheckGB300HostKernelGranule
# warns at bundle time (severity: info, registry.yaml) and
# docs/integrator/components/nodewright.md carries the user-facing statement.
#
# The gb300 profiles arrived in nvidia-tuned 0.10.0. `inference` and
# `multiNodeTraining` are shims that resolve to nvidia-gb300-performance and add
# nothing — no gb300-specific inference or training deltas have been measured
# yet — so all three intents land on the same tuning. Before 0.10.0 the package
# exited non-zero on those intents rather than falling back.
#
# service is deliberately optional and unset by the bare-metal leaf: nvidia-tuned
# exits non-zero on a service directory it does not ship, and there is no
# `generic` service.
#
# Minimal templating - only tolerations/nodeSelectors are dynamic for CLI flag support.
{{- $cust := index .Values "nodewright-customizations" }}
{{- /* tuningEnabled (default true) disables node tuning uniformly across the */}}
{{- /* nodewright tuning manifests (cf. tuning.yaml). Here nvidia-tuned is the */}}
{{- /* CR's only package, so the gate suppresses the whole Skyhook CR. */}}
{{- /* Sprig-safe: only an explicit false disables (absent/true render); a */}}
{{- /* "| default true" would swallow an explicit false under --deployer flux. */}}
{{- if and (ne (toString (index $cust "enabled")) "false") (ne (toString (index $cust "tuningEnabled")) "false") }}
---
apiVersion: skyhook.nvidia.com/v1alpha1
kind: Skyhook
metadata:
  annotations:
    # No Helm hooks: this Skyhook CR is release-managed so that disabling tuning
    # (tuningEnabled=false) actually retracts it. As a hook it would be orphaned
    # under Flux on a true->false flip (before-hook-creation never fires once the
    # CR leaves the render). Ordering after the Skyhook CRD is handled by the
    # component dependency on nodewright-operator, not an intra-release hook;
    # helm/argo already strip these hooks at bundle time.
    aicr/skip-hook-validation: "true"
  labels:
    app.kubernetes.io/part-of: skyhook-operator
    app.kubernetes.io/created-by: aicr
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" | trunc 63 | trimSuffix "-" }}
  name: tuning
  namespace: {{ .Release.Namespace }}
spec:
  runtimeRequired: true
  # Serialize this CR's reboots to one node at a time. nvidia-tuned carries
  # `interrupt: reboot` for its [bootloader] section.
  # An omitted budget is not "unset": createLegacyDefaultCompartment
  # substitutes percent: 100, so every matched node reboots together.
  #
  # BRINGUP ESCAPE HATCH: on an initial cluster build, before any workload has
  # landed, serializing buys nothing and costs N x (reboot time). Delete this
  # block or set `percent: 100` — its exact equivalent — to converge in one
  # batch. count and percent are mutually exclusive.
  interruptionBudget:
    count: 1
  # Default: true. Disable with --set nodewrightcustomizations:autoTaintNewNodes=false
  {{- /* Sprig-safe: a "| default true" here would swallow an explicit false under --deployer flux. */}}
  autoTaintNewNodes: {{ ne (toString (index $cust "autoTaintNewNodes")) "false" }}
  # Dynamic: Supports --accelerated-node-toleration CLI flag
  additionalTolerations:
    {{- if $cust.acceleratedTolerations }}
    {{- toYaml $cust.acceleratedTolerations | nindent 4 }}
    {{- else }}
    # Tolerate-all default, matching ParseTolerations()/DefaultTolerations()
    # (operator Exists, no key). Only reached if no acceleratedTolerations are
    # injected from scheduling defaults/flags.
    - operator: Exists
    {{- end }}
  # Dynamic: Supports --accelerated-node-selector CLI flag.
  # No nvidia.com/gpu.present fallback here, unlike tuning-rke2.yaml: that label
  # is emitted by GFD, which ships inside gpu-operator, and gpu-operator lists
  # nodewright-customizations in its dependencyRefs — so this CR is applied
  # BEFORE the label can exist on a greenfield cluster. Selecting on it would
  # match zero nodes at bringup and only start matching after the GPU driver
  # stack is already up, inverting the tune-then-driver ordering that
  # runtimeRequired and the provisioner's runtime-required pre-taint exist to
  # enforce. tuning-rke2.yaml is safe because VR200 is a deliberate day-2 flow
  # on an already-labeled cluster (docs/integrator/rke2-vr200-setup.md).
  {{- if $cust.acceleratedNodeSelector }}
  nodeSelectors:
    matchLabels:
      {{- toYaml $cust.acceleratedNodeSelector | nindent 6 }}
  {{- end }}
  # Dynamic: Supports --workload-selector CLI flag
  {{- if $cust.workloadSelector }}
  podNonInterruptLabels:
    matchLabels:
      {{- toYaml $cust.workloadSelector | nindent 6 }}
  {{- end }}
  # Tuning: nvidia-tuned gb300 profile only (no nvidia-setup).
  packages:
    nvidia-tuned:
      image: ghcr.io/nvidia/nodewright-packages/nvidia-tuned
      version: "0.10.0"
      containerSHA: sha256:124f3bdedbb651125cec1bf20d3e2f7fcbbe10588c44f36d8e5680b38b9ef8f6
      # nvidia-gb300-performance carries a [bootloader] section (iommu.passthrough,
      # hugepages, numa_balancing, earlycon), which takes effect only on reboot.
      interrupt:
        type: reboot
      env:
        - name: INTERRUPT
          value: "true"
      configMap:
        {{- if $cust.intent }}
        intent: {{ $cust.intent }}
        {{- end }}
        accelerator: {{ $cust.accelerator }}
        {{- if $cust.service }}
        service: {{ $cust.service }}
        {{- end }}
{{- end }}
