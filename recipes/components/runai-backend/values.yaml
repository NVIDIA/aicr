# Run:ai Control Plane Helm values
#
# Chart: runai/control-plane (private — runai.jfrog.io/.../cp-charts-prod)
# Namespace: runai-backend
#
# Values left empty are intentionally deferred to deploy-time `--set` or
# overlay-level overrides because they are environment-specific:
#   --set runaicp:global.domain=<fqdn>
#   --set runaicp:global.config.kubernetesDistribution=openshift   (OCP)
#   --set runaicp:global.customCA.enabled=true                     (custom CA)
#
# The chart already sets `fullnameOverride: runai-backend`, so resource
# names match the upstream installer without further opinions here.
#
# Pre-created secrets the chart consumes (must exist before deploy in ns
# runai-backend; AICR does not currently render Secret manifests):
#   runai-reg-creds         dockerconfigjson  NGC pull credentials
#   runai-backend-tls       tls               cert + key for global.domain
#   runai-ca-cert           Opaque/runai-ca.pem  optional custom CA chain
#
# Auto-generated by the chart's secret-generator hook (no action needed):
#   runai-backend-gen-postgresql, -keycloakx, -cache-pubsub, -tenants-manager.

global:
  # Default ingressClass matches the installer's default. Override per-env
  # if a different controller is in use (e.g. haproxy on bare-metal OCP).
  ingress:
    ingressClass: nginx
