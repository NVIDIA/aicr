# k8s-aibom entered the registry pinned at v1.3.0 (see "k8s-aibom Runtime
# Inventory" in docs/user/component-catalog.md), then moved to v1.5.1, v1.6.1
# and v1.6.2. The lowest from starts at v1.3.0 rather than reaching for a wider
# floor: charts v1.0.0 through v1.2.0 all declared v1alpha1 as the storage
# version, so a jump from one of them crosses the v1alpha1-to-v1beta1 storage
# boundary the v1.2.0-to-v1.3.0 move already made, a different mechanism this
# record has not examined and does not vouch for.
#
# The transitions chain rather than overlap. A jump from v1.3.0 straight to
# v1.6.1 crosses both boundaries, and pkg/upgrade blocks any jump that crosses
# two records at the lower one, so that operator is told to stop at v1.5.1
# first whatever the second record's from says.
#
# The first two verdicts are manual rather than safe, and stay there even
# though a live cluster has exercised each transition. safe must not carry
# steps, and both transitions have real ones on the deployers that never update
# CRDs: across 1.5.1, enabling config.verification aborts the release; across
# 1.6.1, CRDs still left over from 1.3.0 leave the controller Degraded, and
# config.discovery.workloadKinds needs the new schema. Evidence does not
# retire either, because both failures are properties of the cluster's CRDs
# and configuration, not of how well the upgrade has been tested.
#
# v1.6.2 ships v1.6.1's CRDs byte for byte, so it is not a new boundary for
# them. The 1.6.1 record's ceiling reaches 1.6.2 for that reason: every AICR
# v1.x release so far pins 1.5.1, so moving off one is a 1.5.1 to 1.6.2 jump,
# and it has to land on that record's steps rather than stop at a version no
# release pinned. The safe record after it covers only a cluster
# already on 1.6.1.
apiVersion: aicr.run/v1beta1
kind: ComponentUpgrades
component: k8s-aibom
transitions:
  - from: ">=1.3.0 <1.5.1"
    to: "1.5.1"
    verdict: manual
    verifiedBy: >-
      CRD schema diff (helm show crds
      oci://ghcr.io/googlecloudplatform/charts/k8s-aibom --version 1.3.0 vs
      --version 1.5.1): 188 lines added, 0 removed, all confined to the
      optional verification block. Served/storage version
      configuration (v1alpha1 served, v1beta1 served and storage) is
      identical in both charts. Live GKE run on 2026-09-28 against
      v1.35.6-gke.1250000 executed the boundary end to end: install 1.3.0,
      then helm upgrade to 1.5.1 with default values against the stale
      v1.3.0 CRDs, which reported deployed with the controller 1/1 Ready on
      sha256:7b027315; the same upgrade with config.verification set failed
      with ".spec.verification: field not declared in schema" after the
      Deployment had already advanced; applying the v1.5.1 CRDs by hand and
      rerunning it succeeded with the field stored. The component health
      check under recipes/checks/k8s-aibom passes against the upgraded
      cluster. Upstream measured the reverse on 2026-09-29 against
      v1.35.8 regional GKE at 1,002 workloads (evidence in references): helm
      rollback from 1.5.1 to 1.3.0 reached Ready in 17s on the stale v1.3.0
      CRDs and 19s on the v1.5.1 CRDs, and in the second case every AIBOM
      kept its inputHash and bomHash across the round trip.
    summary: >-
      The CRD change is additive only, and with the verification block unset
      (the value AICR ships) a plain chart bump against stale v1.3.0 CRDs
      upgrades cleanly on every deployer, helmfile, terraform and fleet
      included. Setting config.verification is what breaks the upgrade: the
      field does not exist in the v1.3.0 schema, so helm fails while building
      the server-side-apply patch for the AIBOMControllerConfig and aborts the
      release. The value is not silently pruned, but the abort lands after the
      Deployment has already rolled to the v1.5.1 image, leaving a release
      marked failed partway through. helmfile, terraform and fleet have no
      automated CRD-update path, so on those three the CRDs have to be applied
      by hand first. The chart's rendered AIBOMControllerConfig CR also moves
      from v1alpha1 to v1beta1, but both stay served, so that is a template
      change rather than an API break.
    reversible: false
    affectedResources:
      - group: aibom.k8saibom.dev
        kinds:
          - AIBOMControllerConfig
    stepsByDeployer:
      - deployers: [helmfile, terraform, fleet]
        steps:
          - id: apply-new-crds
            description: >-
              Needed only when this upgrade also sets config.verification;
              a default-values bump does not require it. Before upgrading
              the release, apply the v1.5.1 CRDs directly using the
              CRD-apply command under "Upgrade, uninstall, and
              troubleshooting" in docs/user/component-catalog.md, with
              CHART=oci://ghcr.io/googlecloudplatform/charts/k8s-aibom,
              VERSION=1.5.1 and MANAGER=helm under helmfile,
              MANAGER=terraform-provider-helm under terraform, and under
              fleet the manager that section's managed-fields check reports
              for the installed CRDs.
            reason: >-
              helmfile, terraform and fleet have no automated equivalent
              for ownsCRDs components; they are the deployers that never
              update them for you (Fleet's Helm upgrade skips crds/, like
              plain Helm).
              Measured on GKE: against stale v1.3.0 CRDs, setting
              config.verification aborts the release with
              ".spec.verification: field not declared in schema" once the
              Deployment has already moved to the v1.5.1 image, so the
              operator is left mid-rollout on a failed revision. Applying
              the v1.5.1 CRDs first makes the identical upgrade succeed and
              store the field.
          - id: verify-crd-update
            description: >-
              After the manual apply, confirm the new schema actually landed
              by looking for the field the v1.5.1 CRDs add: kubectl get crd
              aibomcontrollerconfigs.aibom.k8saibom.dev -o
              jsonpath='{.spec.versions[?(@.name=="v1beta1")].schema.openAPIV3Schema.properties.spec.properties.verification.type}'
              and expect "object". An empty result means the v1.3.0 schema
              is still in place.
            reason: >-
              Storage version and health are both useless as signals here:
              v1beta1 was already the storage version at v1.3.0, and a
              cluster stranded on the v1.3.0 CRDs reports the release
              deployed and the controller Ready on the v1.5.1 image. Only
              the schema itself distinguishes the two.
          - id: verify-reconcile
            description: >-
              kubectl get aibomcontrollerconfig default -o yaml and confirm
              status.conditions reports Ready=True at the object's current
              observedGeneration. Do not also check apiVersion here: kubectl
              resolves the CRD's preferred version, which is v1beta1 on the
              v1.3.0 and v1.5.1 CRDs alike, so that clause reads the same on a
              cluster still stranded on the old schema.
            reason: >-
              Confirms the controller actually adopted the new generation
              rather than holding last-known-good. AICR sets
              readiness.strictConfig: true in the component's values.yaml, so
              on an AICR install an invalid config does fail the readiness
              probe -- but the chart default is false, and a recipe that
              overrides that value back to the default gets a controller that
              stays Ready while ignoring the config. Read the CR's conditions
              rather than inferring acceptance from pod health.
      - steps:
          - id: verify-crd-update
            description: >-
              After the automated CRD update (flux's spec.upgrade.crds
              CreateReplace, helm's generated apply-crds.sh, or Argo CD
              applying the chart's crds/ as ordinary manifests each sync),
              confirm the new schema actually landed by looking for the
              field the v1.5.1 CRDs add: kubectl get crd
              aibomcontrollerconfigs.aibom.k8saibom.dev -o
              jsonpath='{.spec.versions[?(@.name=="v1beta1")].schema.openAPIV3Schema.properties.spec.properties.verification.type}'
              and expect "object". An empty result means the v1.3.0 schema
              is still in place.
            reason: >-
              Storage version and health are both useless as signals here.
              v1beta1 was already the storage version at v1.3.0, and a
              cluster stranded on the v1.3.0 CRDs after a default-values
              bump was measured on GKE reporting the release deployed, the
              controller 1/1 Ready on the v1.5.1 image, and storedVersions
              v1beta1 on both CRDs -- entirely green with the new schema
              absent. Only the schema itself distinguishes the two.
          - id: verify-reconcile
            description: >-
              kubectl get aibomcontrollerconfig default -o yaml and confirm
              status.conditions reports Ready=True at the object's current
              observedGeneration. Do not also check apiVersion here: kubectl
              resolves the CRD's preferred version, which is v1beta1 on the
              v1.3.0 and v1.5.1 CRDs alike, so that clause reads the same on a
              cluster still stranded on the old schema.
            reason: >-
              Confirms the controller actually adopted the new generation
              rather than holding last-known-good. AICR sets
              readiness.strictConfig: true in the component's values.yaml, so
              on an AICR install an invalid config does fail the readiness
              probe -- but the chart default is false, and a recipe that
              overrides that value back to the default gets a controller that
              stays Ready while ignoring the config. Read the CR's conditions
              rather than inferring acceptance from pod health.
    references:
      - https://github.com/NVIDIA/aicr/blob/main/docs/user/component-catalog.md#k8s-aibom-runtime-inventory
      - https://github.com/GoogleCloudPlatform/k8s-aibom/releases
      - https://github.com/GoogleCloudPlatform/k8s-aibom/blob/main/docs/compatibility.md
      - https://github.com/GoogleCloudPlatform/k8s-aibom/blob/c08e9ac2fda11a339865abdf2a7339a5a34c59e2/docs/evidence/v1.5.1-gke-upgrade-rollback-apiserver.md
  - from: ">=1.5.1 <1.6.1"
    to: ">=1.6.1 <=1.6.2"
    verdict: manual
    verifiedBy: >-
      CRD schema diff (helm show crds
      oci://ghcr.io/googlecloudplatform/charts/k8s-aibom --version 1.5.1 vs
      --version 1.6.1; 1.6.0 ships the same CRDs): one field added,
      spec.discovery.workloadKinds on AIBOMControllerConfig, plus the
      controller-gen version annotation. No conversion stanza on either chart,
      and the served/storage configuration (v1alpha1 served, v1beta1 served
      and storage) is identical. Rendered chart diff with AICR's values: no
      new image, no Service (metrics stays off), and ClusterRole additions
      that are all get/list/watch, or get/list for the grove.io kinds, plus
      get on the /openapi/v3 nonResourceURL. The schema-skew check in the
      1.6.x controller (internal/controller/schema_skew.go) compares only
      top-level spec fields against the served schema; the Degraded claim
      for CRDs left over from 1.3.0 is read from that source, since the run
      below started from the 1.5.1 CRDs. Upstream then ran the
      transition on GKE on 2026-10-21 with AICR's values (evidence in
      references): install 1.5.1, helm upgrade to 1.6.1 with the 1.5.1 CRDs
      left in place, which deployed in 24s with the controller Ready and no
      SchemaPredatesController condition; the forced CRD apply afterwards
      changed nothing for the running controller; helm rollback to 1.5.1
      with the 1.6.1 CRDs left in place reached Ready in 18s, and the one
      AIBOM regenerated once in each direction. The ceiling reaches 1.6.2
      because its CRDs are byte-identical to 1.6.1's (helm show crds diff)
      and its rendered chart with AICR's values differs only in version
      labels and the image digest. AICR ran 1.5.1 to 1.6.2 on Kind
      (Kubernetes v1.37.0) on 2026-10-25 with AICR's values: with the 1.5.1
      CRDs left in place the upgrade deployed in 16s with the pod Ready and
      the k8s-aibom health check passing, and AIBOMControllerConfig reported
      Degraded=True (SchemaPredatesController) naming discovery.workloadKinds,
      which applying the 1.6.2 CRDs and restarting cleared; with the 1.6.2
      CRDs applied first it deployed in 17s, Ready and not Degraded, the
      health check passed, and helm rollback to 1.5.1 with those CRDs left in
      place reached Ready in 13s with the fixture AIBOM back on its 1.5.1
      input hash.
    summary: >-
      On helmfile, terraform and fleet, CRDs left over from 1.3.0 make the
      1.6 controller report Degraded=True (SchemaPredatesController), and
      config.discovery.workloadKinds needs the 1.6 schema; 1.6.2 also reports
      that condition on CRDs left over from 1.5.1, which 1.6.1 does not
      detect. The condition never fails readiness. On every deployer,
      ownership roll-up deletes the AIBOMs of workloads owned by another
      tracked kind (a LeaderWorkerSet's
      StatefulSets, a CronJob's Jobs, the Dynamo and NIM chains) and reports
      them in the owner's AIBOM, so anything reading those AIBOMs by name
      must move to the owner's.
    reversible: true
    reversibleNotes: >-
      helm rollback to 1.5.1 with the newer CRDs left in place was measured
      from 1.6.1 on GKE (Ready in 18s) and from 1.6.2 on Kind (Ready in 13s),
      and in both the one Deployment-backed AIBOM regenerated back to its
      1.5.1 input hash. Leave the newer CRDs in place; 1.5.1 runs on them.
      What 1.5.1 does with AIBOMs that 1.6.x rolled up or created for kinds
      1.5.1 does not know was not measured.
    affectedResources:
      - group: aibom.k8saibom.dev
        kinds:
          - AIBOMControllerConfig
    stepsByDeployer:
      - deployers: [helmfile, terraform, fleet]
        steps:
          - id: apply-new-crds
            description: >-
              Before upgrading the release, apply the target version's CRDs
              directly using the CRD-apply command under "Upgrade, uninstall,
              and troubleshooting" in docs/user/component-catalog.md, with
              CHART=oci://ghcr.io/googlecloudplatform/charts/k8s-aibom,
              VERSION set to the version you are upgrading to (1.6.1 and
              1.6.2 ship identical CRDs), and MANAGER=helm under helmfile,
              MANAGER=terraform-provider-helm under terraform, and under
              fleet the manager that section's managed-fields check reports
              for the installed CRDs.
            reason: >-
              helmfile, terraform and fleet never update ownsCRDs CRDs for
              you. Unlike the 1.5.1 transition this is not conditional on
              config.verification: a cluster that took that transition with
              default values may still serve the 1.3.0 schema, and the 1.6
              controller reports Degraded against it until the CRDs move.
          - id: verify-crd-update
            description: >-
              After the manual apply, confirm the new schema landed by
              looking for the field the v1.6 CRDs add: kubectl get crd
              aibomcontrollerconfigs.aibom.k8saibom.dev -o
              jsonpath='{.spec.versions[?(@.name=="v1beta1")].schema.openAPIV3Schema.properties.spec.properties.discovery.properties.workloadKinds.type}'
              and expect "array". An empty result means an older schema is
              still in place.
            reason: >-
              Storage version and health do not distinguish the schemas:
              v1beta1 has been the storage version since 1.3.0, and the
              controller stays Ready on an older schema. Only the schema
              itself does.
          - id: verify-reconcile
            description: >-
              kubectl get aibomcontrollerconfig default -o yaml and confirm
              status.conditions reports Ready=True at the object's current
              observedGeneration, and no Degraded=True condition with reason
              SchemaPredatesController.
            reason: >-
              SchemaPredatesController never fails readiness, so a stale
              schema leaves the controller Ready and the AICR health check
              passing; the condition is the only place it shows. Degraded
              can also be True for other reasons (RunningOnDefaults,
              RunningOnLastKnownGood, ThirdPartyWatchUnhealthy), which this
              step does not ask you to clear.
      - steps:
          - id: verify-crd-update
            description: >-
              After the automated CRD update (flux's spec.upgrade.crds
              CreateReplace, helm's generated apply-crds.sh, or Argo CD
              applying the chart's crds/ as ordinary manifests each sync),
              confirm the new schema landed: kubectl get crd
              aibomcontrollerconfigs.aibom.k8saibom.dev -o
              jsonpath='{.spec.versions[?(@.name=="v1beta1")].schema.openAPIV3Schema.properties.spec.properties.discovery.properties.workloadKinds.type}'
              and expect "array".
            reason: >-
              Storage version and health do not distinguish the schemas:
              v1beta1 has been the storage version since 1.3.0, and the
              controller stays Ready on an older schema. Only the schema
              itself does.
          - id: verify-reconcile
            description: >-
              kubectl get aibomcontrollerconfig default -o yaml and confirm
              status.conditions reports Ready=True at the object's current
              observedGeneration, and no Degraded=True condition with reason
              SchemaPredatesController.
            reason: >-
              SchemaPredatesController never fails readiness, so a stale
              schema leaves the controller Ready and the AICR health check
              passing; the condition is the only place it shows.
    references:
      - https://github.com/NVIDIA/aicr/blob/main/docs/user/component-catalog.md#k8s-aibom-runtime-inventory
      - https://github.com/GoogleCloudPlatform/k8s-aibom/releases/tag/v1.6.1
      - https://github.com/GoogleCloudPlatform/k8s-aibom/releases/tag/v1.6.2
      - https://github.com/GoogleCloudPlatform/k8s-aibom/blob/v1.6.2/CHANGELOG.md
      - https://github.com/GoogleCloudPlatform/k8s-aibom/blob/v1.6.2/docs/migration-v1beta1.md
      - https://github.com/GoogleCloudPlatform/k8s-aibom/blob/v1.6.2/charts/k8s-aibom-crds/README.md
      - https://github.com/GoogleCloudPlatform/k8s-aibom/blob/d2b5b683d58ee9e71cc95bd4d7272676c4b54d11/docs/evidence/v1.6.1-gke-adr019-dynamo.md
  - from: ">=1.6.1 <1.6.2"
    to: "=1.6.2"
    verdict: safe
    verifiedBy: >-
      helm show crds oci://ghcr.io/googlecloudplatform/charts/k8s-aibom
      --version 1.6.1 vs --version 1.6.2: identical. Rendered chart diff with
      AICR's values: version labels and the image digest only, no RBAC
      change. Upstream v1.6.2 release note: the CRDs, RBAC and document shape
      are those of 1.6.0. AICR ran it on Kind (Kubernetes v1.37.0) on
      2026-10-25 with AICR's values: helm upgrade from 1.6.1 took 16s, the
      controller came back Ready and not Degraded, the fixture AIBOM kept its
      input and BOM hashes, and the k8s-aibom health check passed before and
      after.
    summary: >-
      Patch release on the 1.6.1 CRDs and RBAC. The controller now reports
      Degraded=True while a watched kind's conversion webhook is down, such as
      the Dynamo operator's, and its schema-skew check covers nested fields.
    reversible: true
    reversibleNotes: >-
      helm rollback to 1.6.1 was measured on Kind: Ready in 11s, not Degraded,
      and the fixture AIBOM kept its input and BOM hashes. The CRDs do not
      change, so there is nothing to restore.
    references:
      - https://github.com/GoogleCloudPlatform/k8s-aibom/releases/tag/v1.6.2
      - https://github.com/GoogleCloudPlatform/k8s-aibom/blob/v1.6.2/CHANGELOG.md
