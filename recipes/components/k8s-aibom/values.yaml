# k8s-aibom Helm values
# Optional runtime AI-workload inventory. One stock recipe selects it,
# h100-gke-cos-inference (ADR-019 stock-adoption amendment); its only
# descendant, h100-gke-cos-inference-dynamo, declines it.
#
# The digest and defaults below were qualified as one coherent v1.3.0 artifact
# set under ADR-019, re-pinned from v1.2.0 when upstream graduated CRD storage
# to v1beta1. Both v1alpha1 and v1beta1 remain served, and the chart still
# renders AIBOMControllerConfig at v1alpha1.

image:
  repository: ghcr.io/googlecloudplatform/k8s-aibom
  tag: ""
  digest: sha256:f8e48d4edc44e6ee8e40a2ac6c5f60b190aa18d411a75702dc5798a77a039e8d

# Make pod readiness reflect the current AIBOMControllerConfig status rather
# than process liveness alone. Invalid current configuration must fail closed.
readiness:
  strictConfig: true

# The empty discovery map retains upstream's label-gated namespace selector:
# only namespaces labeled aibom.k8saibom.dev/enabled=true emit AIBOMs.
# No external sink or credentials are configured by default.
config:
  discovery: {}
  bomGeneration:
    inlineThresholdBytes: 262144
    staleThresholdReconciles: 3
  sinks: []
  logging:
    level: info
    format: json

rbac:
  sinkSecretAccess: false

podSecurityContext:
  fsGroup: 2000
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  allowPrivilegeEscalation: false

# Envelope measured on GKE with the qualified v1.3.0 image (#2310), at 0, 251,
# and 1,001 workloads, each a Deployment with replicas set to zero. At 1,001
# workloads memory reached 67-69MiB and steady-state CPU was 1-2m, both well
# inside the requests below. Convergence completed within 10s.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 256Mi
# System scheduling paths are declared in recipes/registry.yaml and injected
# here by the bundler when the corresponding CLI flags are used.
nodeSelector: {}
tolerations: []
