# network-operator Helm values for bare-metal GB300 InfiniBand.

# The NicClusterPolicy CR comes from the recipe's manifest, not the chart.
deployCR: false
nvIpam:
  enabled: false
secondaryNetwork:
  deploy: false
# The GPU Operator's NFD is used. deployNodeFeatureRules must stay at the
# chart default (true): the chart's NodeFeatureRule supplies the RDMA
# readiness gate's node cohort label (enforced by
# TestNetworkOperatorKeepsChartNodeFeatureRule).
nfd:
  enabled: false
# Required by nicConfigurationOperator, which prepares a node through the
# maintenance operator before applying NIC configuration. OFED upgrades use
# ofedDriver.upgradePolicy in the NicClusterPolicy, not this operator.
maintenanceOperator:
  enabled: true
maintenance-operator-chart:
  operator:
    # The subchart's 128Mi default limit is below the operator's working set,
    # which scales with node count (about 5.1Gi peak at 2500 nodes, #3148).
    # The limit covers that; the request stays sized for small clusters.
    resources:
      limits:
        cpu: 500m
        memory: 12Gi
      requests:
        cpu: 10m
        memory: 256Mi
# Operator placement comes from the bundler's system-node scheduling
# injection (registry nodeScheduling) — no hardcoded affinity here.
#
# The working set grows with node count (about 7.9Gi peak at 2500 nodes,
# #3148). The limit covers that; the request stays sized for small clusters.
operator:
  resources:
    limits:
      cpu: "1"
      memory: 12Gi
    requests:
      cpu: 500m
      memory: 2Gi
