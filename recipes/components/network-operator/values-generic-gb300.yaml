# network-operator Helm values for bare-metal GB300 InfiniBand.

# The NicClusterPolicy CR comes from the recipe's manifest, not the chart.
deployCR: false
nvIpam:
  enabled: false
secondaryNetwork:
  deploy: false
# The GPU Operator's NFD is used. deployNodeFeatureRules must stay at the
# chart default (true): the chart's NodeFeatureRule supplies the RDMA
# readiness gate's node cohort label (enforced by
# TestOKENetworkOperatorKeepsChartNodeFeatureRule).
nfd:
  enabled: false
# Coordinated OFED driver upgrades on bare metal.
maintenanceOperator:
  enabled: true
# Operator placement comes from the bundler's system-node scheduling
# injection (registry nodeScheduling) — no hardcoded affinity here.
operator:
  resources:
    limits:
      cpu: "1"
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 2Gi
