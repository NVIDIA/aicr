# NicClusterPolicy for GB300 NVKE — host-driver InfiniBand, shared HCA.
#
# No ofedDriver: the host's Mellanox driver carries OVN-Kubernetes on the
# BlueField-3, so it must never be replaced (see values-nvke-gb300.yaml). No
# nicConfigurationOperator: NIC firmware is a host prerequisite on NVKE. No
# secondaryNetwork.multus or cniPlugins: NVKE preinstalls multus and the
# reference CNI plugins, and a second multus would rewrite the host's multus
# config. RDMA is exposed through rdmaSharedDevicePlugin (shared HCA, resource
# rdma/ib) over the InfiniBand ConnectX rails only: vendor 15b3 = Mellanox;
# deviceID 1021 = ConnectX-7, 1023 = ConnectX-8. The BlueField-3 (a2dc) is
# not an IB rail and is left out.
apiVersion: mellanox.com/v1alpha1
kind: NicClusterPolicy
metadata:
  name: nic-cluster-policy
  annotations:
    # Deliberately NOT a Helm hook: this CR is long-lived cluster networking
    # and must be updated in place — hook-delete-policy would delete the live
    # policy on every upgrade, tearing down the RDMA pods before the
    # replacement reconciles. CRD-before-CR ordering is provided by the
    # bundler's post-bundle sequencing (this manifest ships in the
    # network-operator-post bundle, after the operator's CRDs).
    aicr/skip-hook-validation: "true"
    aicr/disable-wait: "true"
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" | trunc 63 | trimSuffix "-" }}
spec:
  # Fabric DaemonSets run only on Mellanox-NIC nodes (labeled pci-15b3.present
  # by the nfd-worker rule in components/nfd/values-nvidia-nics.yaml) that are
  # not control-plane nodes: on NVKE the control plane also carries a
  # BlueField-3 and so the label, without any IB rail for the plugin to serve.
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: feature.node.kubernetes.io/pci-15b3.present
              operator: In
              values:
                - "true"
            - key: node-role.kubernetes.io/control-plane
              operator: DoesNotExist
  deploymentTolerations:
    - key: CriticalAddonsOnly
      operator: Exists
  # Shared-HCA RDMA (not SR-IOV VFs). Advertises node resource rdma/ib.
  rdmaSharedDevicePlugin:
    image: k8s-rdma-shared-dev-plugin
    repository: nvcr.io/nvidia/mellanox
    version: network-operator-v26.7.0
    imagePullSecrets: []
    config: |
      {
        "configList": [
          {
            "resourceName": "ib",
            "rdmaHcaMax": 64,
            "selectors": {
              "linkTypes": ["infiniband"],
              "vendors": ["15b3"],
              "deviceIDs": ["1021", "1023"]
            }
          }
        ]
      }
  # Fabric DaemonSets must land on tainted GPU nodes.
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
    - key: CriticalAddonsOnly
      operator: Exists
