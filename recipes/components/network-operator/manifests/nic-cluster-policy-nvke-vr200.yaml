# Minimal NicClusterPolicy for NVKE VR200: nicConfigurationOperator ONLY.
#
# Its one job is to stand up the nic-configuration-daemon, without which
# `aicr snapshot --discover-network` returns NOT_FOUND and emits no
# NetworkTopology. Nothing here claims a fabric topology — wire the rails from
# a real discovery result, not by copying another platform's.
#
# Deliberately absent:
#   ofedDriver            NVKE runs the host's inbox mlx5_core. The NVKE setup
#                         doc has a section headed "Never install DOCA-OFED on
#                         these nodes". generic-gb300's policy carries it, which
#                         is why that pair cannot be reused here.
#   rdmaSharedDevicePlugin  The rails expose VFs through the SR-IOV device
#                         plugin, not a shared HCA.
#   sriov                 VR200 is ConnectX-9 and this cluster's rail
#                         layout is unmeasured.
apiVersion: mellanox.com/v1alpha1
kind: NicClusterPolicy
metadata:
  name: nic-cluster-policy
  annotations:
    # Long-lived cluster networking, updated in place: a Helm hook would delete
    # the live policy on every upgrade.
    aicr/skip-hook-validation: "true"
    aicr/disable-wait: "true"
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" | trunc 63 | trimSuffix "-" }}
spec:
  # Only Mellanox-NIC nodes, labelled by the nfd-worker rule in
  # components/nfd/values-nvidia-nics.yaml.
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: feature.node.kubernetes.io/pci-15b3.present
              operator: In
              values:
                - "true"
  # operator.image must be set or the CRD rejects the whole policy (NKX-14991).
  #
  # NOT ghcr.io/mellanox v1.3.1, which the other in-tree policies pin. That tag
  # is from 2026-02 and predates Mellanox c27f7ae ("fall back to sysfs for
  # firmware discovery", #499/#533) by 180 commits. Without that commit the
  # daemon treats a flint failure as fatal, and flint cannot read ConnectX-9
  # here -- `flint -d <pci> q` returns MFE_NO_FLASH_DETECTED -- so discovery
  # dies with "failed to discover NIC devices". Measured on both images:
  # network-operator-v26.7.0 fails exactly that way, v26.7.1 logs "flint
  # failed, falling back to sysfs" and discovers every port. ConnectX-7/8
  # platforms never hit it because flint works there.
  nicConfigurationOperator:
    logLevel: info
    operator:
      image: nic-configuration-operator
      repository: nvcr.io/nvidia/mellanox
      # renovate: datasource=docker depName=nvcr.io/nvidia/mellanox/nic-configuration-operator tag=network-operator-v26.7.1
      version: sha256:3f2d82afbe9e850ff0ace3d1ebff43cef70f83256a6c9632640c7c2f7e7840a8
    configurationDaemon:
      image: nic-configuration-operator-daemon
      repository: nvcr.io/nvidia/mellanox
      # renovate: datasource=docker depName=nvcr.io/nvidia/mellanox/nic-configuration-operator-daemon tag=network-operator-v26.7.1
      version: sha256:908d278e140b1276b978acf26c3f8d4a1bbc22c7085cc86bda94644987d3d74b
      imagePullSecrets: []
      # Unset by default, so the operator applies its own default
      # (manifests/state-nic-configuration-operator/070-config-daemon.yaml).
      # Each daemon caches every NicDevice in the cluster; 2Gi is OOM-killed
      # at 2000 GPU nodes (#3698). The operator fills in no field of a partial
      # override, so one must set both memory values.
      {{- with (index .Values "network-operator").nicConfigurationOperator }}
      {{- with .configurationDaemon }}
      {{- with .resources }}
      {{- if not (and .requests .requests.memory .limits .limits.memory) }}
      {{- fail "nicConfigurationOperator.configurationDaemon.resources must set both requests.memory and limits.memory: the Network Operator applies no per-field default once resources are set" }}
      {{- end }}
      containerResources:
        - name: nic-configuration-daemon
          {{- toYaml . | nindent 10 }}
      {{- end }}
      {{- end }}
      {{- end }}
  # Addressing for the RoCE rails' IPPools. Added with
  # manifests/nvke-vr200.yaml in sriov-ib-networks; without it the SriovNetwork
  # ipam block names a pool nothing serves.
  nvIpam:
    image: nvidia-k8s-ipam
    repository: nvcr.io/nvidia/mellanox
    # renovate: datasource=docker depName=nvcr.io/nvidia/mellanox/nvidia-k8s-ipam tag=network-operator-v26.7.1
    version: sha256:f4012b9c5ee18603def8e842c58861b2524c8da5a946ec9c3e5957de7395a22c
    enableWebhook: false
  # Required for the rails: a SriovNetwork renders a NetworkAttachmentDefinition
  # and multus is what attaches it to a pod.
  #
  # CAUTION, measured on this platform: removing a NicClusterPolicy that
  # carries this section deletes multus's DaemonSet and RBAC but leaves
  # /etc/cni/net.d/00-multus.conflist on every node. That file sorts ahead of
  # 10-ovn-kubernetes.conf, so the next pod on the node gets multus with no
  # controller behind it and fails to create with Unauthorized -- cluster-wide,
  # including the control plane. If this section is ever dropped, remove the
  # conflist from every node in the same change.
  secondaryNetwork:
    cniPlugins:
      image: plugins
      repository: nvcr.io/nvidia/mellanox
      # renovate: datasource=docker depName=nvcr.io/nvidia/mellanox/plugins tag=network-operator-v26.7.1
      version: sha256:9758670f426e238805aba61a1c83a96ae10506dd973845b60477230672c06163
    multus:
      image: multus-cni
      repository: nvcr.io/nvidia/mellanox
      # renovate: datasource=docker depName=nvcr.io/nvidia/mellanox/multus-cni tag=network-operator-v26.7.1
      version: sha256:19279347b71a1077eaed8479f8fff491fd9a578bc0ff8efcf13ea08270574fd0
  tolerations:
    - key: dedicated
      operator: Exists
    - key: components.gke.io/gke-managed-components
      operator: Exists
    - key: CriticalAddonsOnly
      operator: Exists
    - key: nvidia.com/gpu
      operator: Exists
    - key: node.lepton.ai/dedicated-node-group-id
      operator: Exists
      effect: NoExecute
    - key: node.lepton.ai/dedicated-node-group-id
      operator: Exists
      effect: NoSchedule
    - key: node.lepton.ai/unregistered
      operator: Exists
      effect: NoSchedule
    - key: node.lepton.ai/unregistered
      operator: Exists
      effect: NoExecute
    - key: node.lepton.ai/initialized
      operator: Exists
      effect: NoSchedule
    - key: node.lepton.ai/acceptance-verifying
      operator: Exists
      effect: NoSchedule
    - key: node.lepton.ai/impending-disruption
      operator: Exists
      effect: NoSchedule
    - key: node.lepton.ai/disrupted
      operator: Exists
      effect: NoSchedule
    - key: lepton.ai/resource-provider
      operator: Exists
      effect: NoExecute
