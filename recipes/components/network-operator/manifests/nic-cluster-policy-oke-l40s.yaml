# NicClusterPolicy for L40S OKE (OCI) SR-IOV RoCE.
#
# The network-operator Helm chart installs the operator + CRD but does not template
# a NicClusterPolicy CR (values-oke-l40s.yaml sets deployCR: false). This manifest
# creates it so the operator reconciles the RoCE fabric stack. Hand-rendered from
# AOR's network-operator/nicclusterpolicy.yaml.tmpl (provider: oci branch, with
# network.type == roce → nvIpam + secondaryNetwork included).
#
# OCI specifics (vs Forge IB): NO ofedDriver — OCI nodes carry host MOFED, consumed
# by the GPU Operator driver via driver.rdma.useHostMofed (l40s-oke-ubuntu leaf). One
# sriovDevicePlugin resource, nvidia.com/mlnxnics, selecting the OCI ConnectX VF
# device IDs (101a = ConnectX-5 Ex VF, 101e = mlx5Gen VF). RoCE also needs nv-ipam
# (VF IP allocation) + secondaryNetwork/multus (attach the VF into workload pods).
# vendor 15b3 = Mellanox.
apiVersion: mellanox.com/v1alpha1
kind: NicClusterPolicy
metadata:
  name: nic-cluster-policy
  annotations:
    # Deliberately NOT a Helm hook: this CR is long-lived cluster networking
    # and must be updated in place — hook-delete-policy would delete the live
    # policy on every upgrade, tearing down OFED/RDMA pods before the
    # replacement reconciles. CRD-before-CR ordering is provided by the
    # bundler's post-bundle sequencing (this manifest ships in the
    # network-operator-post bundle, after the operator's CRDs).
    aicr/skip-hook-validation: "true"
    # Flux does not wait for this CR: the operator holds it at Ready=False
    # until OFED is built, past helm-controller's timeout (NVIDIA/aicr#2585).
    aicr/disable-wait: "true"
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" | trunc 63 | trimSuffix "-" }}
spec:
  # RoCE: allocate IPs for the RDMA VFs and wire them into pods via multus.
  nvIpam:
    image: nvidia-k8s-ipam
    repository: ghcr.io/mellanox
    # renovate: datasource=docker depName=ghcr.io/mellanox/nvidia-k8s-ipam tag=v0.2.0
    version: sha256:47e1bb84ac97f9af49f97b49c2de44b4ba82b890b487880edc5c9adf86a176f7
    enableWebhook: false
    containerResources:
      - name: nv-ipam-node
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: "1"
          memory: 2Gi
  secondaryNetwork:
    cniPlugins:
      image: plugins
      repository: ghcr.io/k8snetworkplumbingwg
      # renovate: datasource=docker depName=ghcr.io/k8snetworkplumbingwg/plugins tag=v1.6.2-update.1
      version: sha256:fd99966bdb5e7e7dc674aba612cecd224fffb8a4b37c0c384b7a60cb804023f4
    multus:
      image: multus-cni
      repository: ghcr.io/k8snetworkplumbingwg
      # renovate: datasource=docker depName=ghcr.io/k8snetworkplumbingwg/multus-cni tag=v4.2.1
      version: sha256:6bebbda31416810875367484b8125026b2816885b79c89c2df863a6ed77dd4a6
  sriovDevicePlugin:
    image: sriov-network-device-plugin
    repository: ghcr.io/k8snetworkplumbingwg
    # renovate: datasource=docker depName=ghcr.io/k8snetworkplumbingwg/sriov-network-device-plugin tag=v3.9.0
    version: sha256:cabce074d10a0f1d62135e2cc5442d65b49094b95b8297fdd024a1a5f461319f
    config: |
      {
        "resourceList": [
          {
            "resourcePrefix": "nvidia.com",
            "resourceName": "mlnxnics",
            "selectors": {"isRdma":true,"vendors":["15b3"],"devices":["101a","101e"]}
          }
        ]
      }
  # Operator DaemonSet placement: system/monitoring nodes only (matches AOR).
  deploymentTolerations:
    - key: CriticalAddonsOnly
      operator: Exists
  tolerations:
    # RDMA DaemonSets must land on tainted GPU nodes.
    - key: nvidia.com/gpu
      operator: Exists
    - key: CriticalAddonsOnly
      operator: Exists
