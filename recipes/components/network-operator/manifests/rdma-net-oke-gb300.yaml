# Secondary network that attaches one GB300 RDMA VF to a pod. A workload
# requests nvidia.com/mlnxnics and annotates
# k8s.v1.cni.cncf.io/networks: <release-namespace>/rdma-net; Multus reads the
# resourceName annotation below to hand host-device the PCI address of the VF
# the device plugin allocated. The CRD ships in the network-operator chart's
# crds/, so it exists before this -post manifest is applied. The name says
# what the network is for, not which CNI attaches it, so workloads keep
# working if the attachment mechanism changes.
#
# host-device, not sriov: see nic-cluster-policy-oke-gb300.yaml for the
# switchdev representor problem. Empty IPAM because the VF takes its address
# from OCI's IPv6 SLAAC fabric once it is in the pod's namespace.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: rdma-net
  namespace: {{ .Release.Namespace }}
  annotations:
    # Deliberately NOT a Helm hook, for the same reason as the
    # NicClusterPolicy: hook-delete-policy would delete the live network on
    # every upgrade, breaking attachments for pods starting meanwhile.
    aicr/skip-hook-validation: "true"
    k8s.v1.cni.cncf.io/resourceName: nvidia.com/mlnxnics
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" | trunc 63 | trimSuffix "-" }}
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "rdma-net",
      "plugins": [
        {
          "type": "host-device",
          "ipam": {}
        }
      ]
    }
