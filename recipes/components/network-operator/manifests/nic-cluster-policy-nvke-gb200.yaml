# NicClusterPolicy for GB200 NVKE — rdmaSharedDevicePlugin over InfiniBand.
#
# No ofedDriver: the host's inbox mlx5_core carries OVN-Kubernetes on the
# BlueField-3, so it must never be replaced (see values-nvke-gb200.yaml).
#
# The four ConnectX-7 rails (PCI device 1021) run IB without IPoIB, so they
# have RDMA devices but no netdevs; the plugin therefore selects by
# vendor/deviceID, not ifNames or linkTypes. deviceID 1021 also excludes the
# BlueField-3 (same vendor, Ethernet, OVN's uplink). One shared resource,
# nvidia.com/mlnxnics, matches the OKE GB200 IB path so the same NCCL
# benchmark runtime applies. k8s-launch-kit's ipoib-rdma-shared profile
# instead emits one rdma_shared_resource_rail_<n> per rail keyed on IPoIB
# ifNames; that per-rail form is the SR-IOV/IPoIB follow-up.
# periodicUpdateInterval: the plugin exposes 0 devices until rdma_ucm and ib_umad are loaded
# (the rdma-modules component loads it after this DaemonSet may have started).
apiVersion: mellanox.com/v1alpha1
kind: NicClusterPolicy
metadata:
  name: nic-cluster-policy
  annotations:
    # Deliberately NOT a Helm hook: this CR is long-lived cluster networking
    # and must be updated in place — hook-delete-policy would delete the live
    # policy on every upgrade, tearing down the RDMA pods before the
    # replacement reconciles. CRD-before-CR ordering is provided by the
    # bundler's post-bundle sequencing (this manifest ships in the
    # network-operator-post bundle, after the operator's CRDs).
    aicr/skip-hook-validation: "true"
    aicr/disable-wait: "true"
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" | trunc 63 | trimSuffix "-" }}
spec:
  # Fabric DaemonSets run only on Mellanox-NIC nodes (labeled pci-15b3.present
  # by the nfd-worker rule in components/nfd/values-nvidia-nics.yaml).
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: feature.node.kubernetes.io/pci-15b3.present
              operator: In
              values:
                - "true"
  rdmaSharedDevicePlugin:
    image: k8s-rdma-shared-dev-plugin
    repository: nvcr.io/nvidia/mellanox
    version: network-operator-v26.7.0
    config: |
      {
        "periodicUpdateInterval": 60,
        "configList": [
          {
            "resourcePrefix": "nvidia.com",
            "resourceName": "mlnxnics",
            "rdmaHcaMax": 63,
            "selectors": {
              "vendors": ["15b3"],
              "deviceIDs": ["1021"]
            }
          }
        ]
      }
  deploymentTolerations:
    - key: CriticalAddonsOnly
      operator: Exists
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
    - key: CriticalAddonsOnly
      operator: Exists
