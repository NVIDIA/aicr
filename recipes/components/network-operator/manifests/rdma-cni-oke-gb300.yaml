# Installs the rdma CNI plugin that the rdma-net attachment chains after
# host-device (rdma-net-oke-gb300.yaml). NicClusterPolicy has no rdma-cni
# field, so this is a plain DaemonSet. The image is the one network-operator
# 26.7.0 pins for its SR-IOV operator; its entrypoint copies the plugin into
# /host/opt/cni/bin and sleeps. Rendered only when rdmaCni.enabled is true
# (exclusive RDMA network namespace mode; see rdma-net-oke-gb300.yaml).
{{- $rdmaCni := false }}
{{- with index (index .Values "network-operator") "rdmaCni" }}
{{- if eq (toString (index . "enabled")) "true" }}{{ $rdmaCni = true }}{{ end }}
{{- end }}
{{- if $rdmaCni }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: rdma-cni
  namespace: {{ .Release.Namespace }}
  annotations:
    aicr/skip-hook-validation: "true"
  labels:
    app.kubernetes.io/name: rdma-cni
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" | trunc 63 | trimSuffix "-" }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: rdma-cni
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rdma-cni
    spec:
      hostNetwork: true
      # Same node cohort as the NicClusterPolicy DaemonSets.
      nodeSelector:
        feature.node.kubernetes.io/pci-15b3.present: "true"
      # Tolerate every taint, like the NicClusterPolicy DaemonSets: the plugin
      # must be in place before the Nodewright gate lifts.
      tolerations:
        - operator: Exists
      containers:
        - name: rdma-cni
          image: nvcr.io/nvidia/mellanox/rdma-cni:network-operator-v26.7.0@sha256:d3235d1f7be1fe825f23feddd714bc44acd0bad305ca598b365cd134f14ae28e
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 50Mi
          volumeMounts:
            - name: cnibin
              mountPath: /host/opt/cni/bin
      volumes:
        - name: cnibin
          hostPath:
            path: /opt/cni/bin
            type: Directory
{{- end }}
