# nvidia-peermem reloader for GPUDirect RDMA on AKS.
#
# GPUDirect RDMA requires the nvidia-peermem kernel module. Under the
# AKS driver-only default (driver.enabled=false) no GPU Operator driver
# DaemonSet exists to load it, and the AKS-managed driver install does
# NOT load it automatically — Azure's RDMA guidance requires a reloader
# in that mode. The retry loop keeps re-asserting the module so it is
# loaded once the NVIDIA driver and the OFED ib_core stack are both
# present (boot ordering) and re-loaded if a driver update unloads it —
# which is why a static modules-load.d entry (nodewright) is not enough.
#
# Deliberately NO readiness/startup probe: the pod reports Ready
# immediately and the module load is retried in-loop. Deployers helm-wait
# on the network-operator-post wrapper BEFORE gpu-operator installs, so a
# readiness gate tied to modprobe would deadlock the documented
# GPU-Operator-managed fallback profile (--gpu-driver none + the override
# tuple), where no driver exists until the gpu-operator driver DaemonSet
# — which deploys later — provides it. Under that profile the driver pod
# loads nvidia-peermem itself (driver.rdma.enabled=true) and this loop
# simply confirms the already-loaded module.
#
# modprobe runs via chroot into the host root so the NODE's own kmod
# loads the module (handles Ubuntu's zstd-compressed .ko.zst and needs no
# package installation at runtime — the image is a digest-pinned busybox,
# mirrorable for air-gapped installs like every other pinned image).
#
# nodeAffinity targets IB-capable nodes (labeled by the nfd-network-rule
# manifest), the same scoping as nic-cluster-policy-aks.yaml — GPUDirect
# RDMA is only meaningful where GPU and IB coexist.
#
# Reference: https://github.com/Azure/aks-rdma-infiniband/blob/main/configs/nvidia-peermem-reloader/ds.yaml
# Guidance:  https://azure.github.io/aks-rdma-infiniband/configurations/gpu-drivers
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-peermem-reloader
  namespace: nvidia-network-operator
  labels:
    app.kubernetes.io/name: nvidia-peermem-reloader
    app.kubernetes.io/managed-by: aicr
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nvidia-peermem-reloader
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nvidia-peermem-reloader
    spec:
      tolerations:
        # Tolerate everything, like the network-operator-managed DaemonSets
        # (OFED, rdma-shared-dev-plugin) this reloader accompanies — the
        # module must load on every IB node regardless of the pool's taint
        # scheme (sku=gpu, nvidia.com/gpu, or custom), or GPUDirect RDMA is
        # silently absent there. The AKS wildcard-toleration hazard
        # (nodewright#296, admission-collapsed tolerations defeating drain
        # exemptions) does not apply: DaemonSet pods are exempt from drain
        # eviction. In-repo precedent: gke-nccl-tcpxo installer DaemonSet.
        - operator: Exists
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: feature.node.kubernetes.io/pci-15b3.present
                    operator: In
                    values:
                      - "true"
      priorityClassName: system-node-critical
      containers:
        - name: nvidia-peermem-reloader
          image: docker.io/library/busybox:1.38.0@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
          command:
            - /bin/sh
            - -c
            - |
              prev=""
              while true; do
                if chroot /host /usr/sbin/modprobe nvidia-peermem 2>/dev/null; then
                  cur=loaded
                else
                  cur=unavailable
                fi
                if [ "$cur" != "$prev" ]; then
                  if [ "$cur" = "loaded" ]; then
                    echo "nvidia-peermem loaded"
                  else
                    echo "nvidia-peermem not loadable yet (NVIDIA driver or ib_core absent); retrying every 30s"
                  fi
                  prev=$cur
                fi
                sleep 30
              done
          securityContext:
            privileged: true
          # Modest bounds for a busybox modprobe re-assert loop (see the
          # matching block in nvidia-toolkit-hardening-aks.yaml).
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          volumeMounts:
            - name: host-root
              mountPath: /host
              readOnly: true
      volumes:
        - name: host-root
          hostPath:
            path: /
            type: Directory
