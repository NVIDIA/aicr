# Network Operator Helm values
# Base configuration for all deployments

# Override release name prefix to avoid aicr-stack- prefix in resource names
operator:
  fullnameOverride: network-operator
  tolerations:
    - operator: Exists

deployCR: true

nfd:
  enabled: false
  # For one release both the chart's nvidia-nics-rules and the nfd-worker rule
  # (components/nfd/values-nvidia-nics*.yaml) produce pci-15b3.present, so the
  # label is never missing while nfd-worker rolls. Once a node's worker strips
  # pci.*, the chart rule matches nothing. Remove it in the contract change
  # (#3038); a cluster must take this release first, or finish the nfd-worker
  # rollout before network-operator syncs, or unrestarted nodes lose the label.
  deployNodeFeatureRules: true

sriovNetworkOperator:
  enabled: false

nvIpam:
  enabled: true

secondaryNetwork:
  deploy: true

nicClusterPolicy:
  enabled: true
