# Images this component deploys that no rendered `image:` field names. See
# "Declared Images" in docs/contributor/component.md.
component: network-operator
charts:
  - repository: https://helm.ngc.nvidia.com/nvidia
    chart: network-operator
    sourceVersion: 26.10.0
    images:
      - image: nvcr.io/nvidia/mellanox/network-operator-init-container:network-operator-v26.10.0
        source: >-
          OFED_INIT_CONTAINER_IMAGE env of the operator, from
          operator.ofedDriver.initContainer. Init container of the OFED driver
          DaemonSet a NicClusterPolicy with ofedDriver creates.
      - image: nvcr.io/nvidia/mellanox/maintenance-operator:network-operator-v26.10.0
        enabledBy: maintenanceOperator.enabled
        source: Deployment of the maintenance-operator-chart subchart.
      - image: nvcr.io/nvidia/mellanox/sriov-network-operator:network-operator-v26.10.0
        enabledBy: sriovNetworkOperator.enabled
        source: Deployment of the sriov-network-operator subchart.
      - image: nvcr.io/nvidia/mellanox/sriov-network-operator-config-daemon:network-operator-v26.10.0
        enabledBy: sriovNetworkOperator.enabled
        source: SRIOV_NETWORK_CONFIG_DAEMON_IMAGE env of the sriov-network-operator.
      - image: nvcr.io/nvidia/mellanox/sriov-network-operator-webhook:network-operator-v26.10.0
        enabledBy: sriovNetworkOperator.enabled
        source: SRIOV_NETWORK_WEBHOOK_IMAGE env of the sriov-network-operator.
      - image: nvcr.io/nvidia/mellanox/sriov-network-device-plugin:network-operator-v26.10.0
        enabledBy: sriovNetworkOperator.enabled
        source: SRIOV_DEVICE_PLUGIN_IMAGE env of the sriov-network-operator.
      - image: nvcr.io/nvidia/mellanox/sriov-cni:network-operator-v26.10.0
        enabledBy: sriovNetworkOperator.enabled
        source: SRIOV_CNI_IMAGE env of the sriov-network-operator.
      - image: nvcr.io/nvidia/mellanox/ib-sriov-cni:network-operator-v26.10.0
        enabledBy: sriovNetworkOperator.enabled
        source: SRIOV_INFINIBAND_CNI_IMAGE env of the sriov-network-operator.
      - image: nvcr.io/nvidia/mellanox/ovs-cni-plugin:network-operator-v26.10.0
        enabledBy: sriovNetworkOperator.enabled
        source: OVS_CNI_IMAGE env of the sriov-network-operator.
      - image: nvcr.io/nvidia/mellanox/rdma-cni:network-operator-v26.10.0
        enabledBy: sriovNetworkOperator.enabled
        source: RDMA_CNI_IMAGE env of the sriov-network-operator.
      - image: ghcr.io/k8snetworkplumbingwg/network-resources-injector:v1.10.0
        enabledBy: sriovNetworkOperator.enabled
        source: NETWORK_RESOURCES_INJECTOR_IMAGE env of the sriov-network-operator.
