# network-operator Helm values for GB300 NVKE RoCE (shared HCA).
#
# NO ofedDriver: DOCA-OFED is a host prerequisite the NVKE vendor installs in
# the node image, as on OKE. The recipe must not install it either way:
# OVN-Kubernetes (the primary CNI, on BlueField-3) is bound to the host's
# mlx5_core, so a DOCA driver container replacing that module takes the node's
# primary address with it (observed on Firmus GB300 with recipes that carried
# an ofedDriver), and a one-node tenant cannot be drained for a driver
# rollout at all.
#
# Shared HCA, not SR-IOV: the ConnectX-8 firmware on these trays exposes one
# VF per PF (sriov_totalvfs 1) and NIC firmware is a host prerequisite on NVKE,
# so no nicConfigurationOperator (and no Maintenance Operator, which only it
# needs) and no SR-IOV Network Operator. This keeps the Network Operator to
# nv-ipam and the rdma-shared-device-plugin DaemonSet.
#
# nvIpam and secondaryNetwork are off in the chart because the post-install
# NicClusterPolicy manifest carries nvIpam (deployCR off so that manifest is
# authoritative). No multus or cniPlugins anywhere: NVKE preinstalls multus
# and the reference CNI plugins on every node. The chart's NFD stays off: the
# standalone nfd component labels Mellanox nodes pci-15b3.present through
# components/nfd/values-nvidia-nics.yaml.
deployCR: false
nvIpam:
  enabled: false
secondaryNetwork:
  deploy: false
nfd:
  enabled: false
operator:
  resources:
    limits:
      cpu: "1"
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 2Gi
