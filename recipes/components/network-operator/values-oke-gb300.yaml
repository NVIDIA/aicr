# network-operator Helm values for GB300 OKE (OCI) RoCE.
#
# OCI GB300 model (vs GB200 IB / L40S RoCE): NO ofedDriver — nodes carry host
# DOCA — and no nv-ipam: the RDMA VFs take their addresses from OCI's IPv6
# SLAAC fabric, so they attach with empty IPAM. East-west is RoCE over SR-IOV
# VFs, served by sriovDevicePlugin + Multus from the post-install
# NicClusterPolicy manifest, NOT the chart. deployCR off so that manifest CR is
# authoritative.
# nfd.enabled: false: the standalone nfd component is used. Its worker labels
# Mellanox nodes pci-15b3.present (the RDMA readiness gate's node cohort)
# through components/nfd/values-nvidia-nics.yaml, wired in by this recipe's
# overlay. For one release the chart's NodeFeatureRule
# (nfd.deployNodeFeatureRules in values.yaml) produces the same label beside it.
deployCR: false
nvIpam:
  enabled: false
secondaryNetwork:
  deploy: false
nfd:
  enabled: false
# Operator placement comes from the bundler's system-node scheduling
# injection (registry nodeScheduling: operator.nodeSelector /
# operator.tolerations) — no hardcoded affinity here.
operator:
  resources:
    limits:
      cpu: "1"
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 2Gi
