# network-operator Helm values for DGX Spark (GB10) on NVKE.
#
# The chart templates no NicClusterPolicy: the only policy is
# manifests/nic-cluster-policy-nvke-gb10.yaml, and it runs only the RDMA
# shared device plugin. It sets no ofedDriver, because DGX OS runs RoCE on the
# inbox mlx5_core, and no nvIpam or secondaryNetwork, because pods keep
# OVN-Kubernetes as their only network. The standalone nfd component labels
# ConnectX-7 nodes (components/nfd/values-nvidia-nics.yaml).
deployCR: false
nvIpam:
  enabled: false
secondaryNetwork:
  deploy: false
nfd:
  enabled: false
