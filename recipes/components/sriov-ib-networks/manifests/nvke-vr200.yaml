# SR-IOV RoCE rails for VR200 NVKE: per rail one nv-ipam IPPool, one
# SriovNetworkNodePolicy and one SriovNetwork. Modelled on nvke-gb200.yaml in
# this directory, which is the only east-west shape NVKE can carry -- SR-IOV
# on the host's inbox mlx5_core. vr200-rke2's DraNet is not an option here: it
# relies on host DOCA-OFED, which docs/integrator/nvke-gb200-setup.md forbids
# on NVKE nodes because the DOCA container unloads mlx5_core and takes the
# node's primary address with it.
#
# DEPLOYED AND ATTACHED, BUT NO TRAFFIC HAS CROSSED THEM. Exercised on the
# reference cluster: the SR-IOV operator created one VF per port on both
# workers and advertised all eight as allocatable, nv-ipam assigned an address
# per rail from the pools below, multus attached net1..net8 to a pod, and every
# VF came up with its own RDMA device and a RoCE v2 GID. What has NOT been
# shown is a packet between nodes -- the spare ConnectX-9 ports have no path
# between workers (address one on each and ping: ARP FAILED), because the
# BlueField DPU bridges only the port carrying the node address. Bridging the
# rest is DPU-side work outside the tenant cluster.
#
# Differences from the GB200 file, all forced by the hardware:
#
#   SriovNetwork, not SriovIBNetwork. Measured on both workers, all twelve
#   mlx5 ports report link_layer Ethernet with RoCE v2 GIDs and not one
#   reports InfiniBand, so linkType IB and the SriovIBNetwork kind do not
#   apply.
#
#   numVfs 1, not 16. The ConnectX-9 firmware on these trays reports
#   sriov_totalvfs 1 per port; 16 is the CX-7 ceiling on GB200 trays. This is
#   a firmware limit, not a tuning choice: eight ports give eight VFs in
#   total, one per rail, so a second pod per node cannot take a rail.
#
#   No ib_ipoib, and no rdma-modules dependency. GB200's VF netdevs are IPoIB
#   children; RoCE VF netdevs are plain Ethernet.
#
#   NO VF attributes at all -- no linkState, no trust, no spoofChk. GB200 sets
#   linkState: enable; it cannot be used here. Measured: the PF driver refuses
#   every one of them, and sriov-cni fails the attachment with "operation not
#   permitted" on whichever is set first (spoofchk, then trust, then link
#   state). The PF is owned by the BlueField DPU, so the host cannot
#   administer VF attributes even though it can create the VFs. With all three
#   removed the attachment succeeds.
#
# Shared with the GB200 file, and load-bearing:
#
#   The IPPool subnets sit in 10.255.0.0/16, NOT the k8s-launch-kit default
#   192.168.<4n>.0/22. NVKE's OVN-Kubernetes pod network is 192.168.0.0/16,
#   and a pool inside it installs a more specific route than the pod network's
#   in every attached pod, sending other nodes' pod traffic out the VF.
#
#   Node selection is rdma.available, not pci-15b3.present: NVKE control
#   planes carry a BlueField without any ConnectX-9, and a selected node with
#   no root devices gets a device-plugin pod that waits forever.
#
#   Pools and node policies live in the Network Operator namespace; the
#   networks render their NetworkAttachmentDefinitions into `default`, where
#   workloads reference them as default/roce-network-rail-<n>.
#
# This file lives under sriov-ib-networks because that component is the
# SR-IOV network bundle -- its health check asserts the IPPool CRD is
# Established and every SriovNetworkNodeState syncs, neither of which is
# link-type specific. The directory name predates RoCE support.
#
# Spelled out per rail: the manifest renderer has no range/list functions.
{{- $sriov := index .Values "sriov-ib-networks" }}
{{- if ne (toString (index $sriov "enabled")) "false" }}
---
apiVersion: nv-ipam.nvidia.com/v1alpha1
kind: IPPool
metadata:
  name: nv-ipam-pool-rail-0
  namespace: {{ .Release.Namespace }}
  annotations:
    aicr/skip-hook-validation: "true"
    aicr/disable-wait: "true"
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" | trunc 63 | trimSuffix "-" }}
spec:
  subnet: 10.255.0.0/22
  perNodeBlockSize: 10
  gateway: 10.255.0.1
  nodeSelector:
    nodeSelectorTerms:
      - matchExpressions:
          - key: feature.node.kubernetes.io/rdma.available
            operator: In
            values:
              - "true"
---
apiVersion: sriovnetwork.openshift.io/v1
kind: SriovNetworkNodePolicy
metadata:
  name: roce-sriov-rail-0
  namespace: {{ .Release.Namespace }}
  annotations:
    aicr/skip-hook-validation: "true"
    aicr/disable-wait: "true"
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" | trunc 63 | trimSuffix "-" }}
spec:
  deviceType: netdevice
  # 9000 is the usual RoCE jumbo frame. Unverified on this fabric: nothing has
  # carried a packet across these rails, and an MTU above what the switch
  # accepts fails as silent packet loss rather than a config error.
  mtu: 9000
  nodeSelector:
    feature.node.kubernetes.io/rdma.available: "true"
  nicSelector:
    vendor: "15b3"
    rootDevices:
      - "0001:03:00.0"
  linkType: eth
  isRdma: true
  # sriov_totalvfs on these ConnectX-9 ports. Raising it is rejected by the
  # firmware, not by the operator.
  numVfs: 1
  priority: 90
  resourceName: sriov_resource_rail_0
---
apiVersion: sriovnetwork.openshift.io/v1
kind: SriovNetwork
metadata:
  name: roce-network-rail-0
  namespace: {{ .Release.Namespace }}
  annotations:
    aicr/skip-hook-validation: "true"
    aicr/disable-wait: "true"
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" | trunc 63 | trimSuffix "-" }}
spec:
  ipam: |
    {
      "type": "nv-ipam",
      "poolName": "nv-ipam-pool-rail-0"
    }
  resourceName: sriov_resource_rail_0
  networkNamespace: default
---
