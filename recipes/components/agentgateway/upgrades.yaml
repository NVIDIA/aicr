apiVersion: aicr.run/v1beta1
kind: ComponentUpgrades
component: agentgateway
transitions:
  # from starts at 1.5.0, the release AICR pinned before 1.7.0 and the only
  # one assessed here; an origin below it resolves to blocked.
  - from: ">=1.5.0 <1.7.0"
    to: "1.7.0"
    verdict: manual
    summary: >-
      1.6 and 1.7 change how configured LLM backends and policies behave.
      An explicit provider base URL without a path now means /, where 1.5
      appended /v1 for custom and Ollama providers. Prompt guards other than
      webhooks now also inspect tool outputs, which can reject or mask
      requests that passed before. Dynamic backends refuse loopback and
      link-local destinations. A built-in model catalog now prices requests,
      so USD budgets and cost-based limits start counting. Anthropic Messages
      requests prefer the OpenAI Responses format, failover evicts failing
      targets by default, external authorization calls time out after 2
      seconds and rate limit or processing calls after 10, and the LLM
      request buffer grows from 2 MiB to 32 MiB. The controller also turns on
      the AgentgatewayModel API. AICR configures no LLM backend, policy or
      guard, so a default install needs only the apply.
    precondition: >-
      Know whether your AgentgatewayBackend objects set a provider base URL,
      whether any policy configures prompt guards, and whether a dynamic
      backend targets a loopback or link-local address. If none does, only
      the apply step applies.
    stepsByDeployer:
      - steps:
          - id: add-base-url-paths
            description: >-
              Only if a provider base URL has no path: add the provider API
              path, for example https://api.openai.com/v1 instead of
              https://api.openai.com, before applying.
            reason: >-
              From 1.6 the configured URL is the complete base path, so a URL
              without one sends requests to / and the provider rejects them.
          - id: keep-guard-scope
            description: >-
              Only if prompt guards must not inspect tool outputs: set each
              guard's scope to [SystemPrompt, Messages] before applying.
            reason: >-
              1.7 adds ToolOutput to the default scope, which can reject or
              mask requests and sends more content to vendor guardrail APIs.
          - id: allow-dynamic-loopback
            description: >-
              Only if a dynamic backend must reach a loopback or link-local
              address: set config.backend.allowDynamicLoopback to true in the
              proxy configuration.
            reason: >-
              1.7 rejects those destinations by default, including cloud
              metadata servers.
          - id: apply
            description: >-
              Apply the regenerated bundle with your deployer.
            reason: Moves agentgateway to 1.7.0.
    references:
      - https://github.com/agentgateway/agentgateway/releases/tag/v1.6.0
      - https://github.com/agentgateway/agentgateway/releases/tag/v1.7.0
