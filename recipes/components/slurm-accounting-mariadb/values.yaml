# AICR deployment gate; consumed before Helm rendering.
install: false

fullnameOverride: mariadb
namespaceOverride: slurm

mariadb:
  rootPasswordSecretKeyRef:
    name: mariadb-root-password
    key: root
    generate: true
  username: slurm
  database: slurm_acct_db
  passwordSecretKeyRef:
    name: mariadb-password
    key: password
    generate: true
  cleanupPolicy: Skip
  storage:
    size: 20Gi
  replicas: 1
  galera:
    enabled: false
  myCnf: |
    [mariadb]
    innodb_buffer_pool_size=4096M
    innodb_log_file_size=1024M
    innodb_lock_wait_timeout=900
    max_allowed_packet=16M
  resources:
    requests:
      cpu: 1
      memory: 6Gi
    limits:
      cpu: 2
      memory: 8Gi

users: []
databases: []
grants: []
