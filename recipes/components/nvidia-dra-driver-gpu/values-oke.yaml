# NVIDIA DRA Driver GPU Helm values
# OKE configuration overrides
#
# The driver root follows the selected gpuStack value (see oke-ol.yaml):
# `/` where the image supplies the driver, `/run/nvidia/driver` where the
# GPU Operator installs it.
# Reference: https://github.com/oracle-quickstart/oci-hpc-oke/blob/grace-blackwell/manifests/dra/values.yaml
#
# GPU allocation defaults are inherited from values.yaml (this file is merged
# on top of it): full-GPU DRA advertisement off, chart-guard waiver off, and
# computeDomains pinned on — the production-default tuple. See the guidance
# in values.yaml (issue #1327). Compute domains stay enabled for multi-node
# training coordination.

# See values.yaml for why both nameOverride and fullnameOverride are pinned.
nameOverride: nvidia-dra-driver-gpu
fullnameOverride: nvidia-dra-driver-gpu

# nvidiaDriverRoot is profile-owned (gpuStack on oke-ol.yaml): / for the
# image-supplied driver values, /run/nvidia/driver under operator-managed
# (TestDriverRootLockstep, issue #1087). Deliberately absent here.

controller:
  priorityClassName: ""
kubeletPlugin:
  priorityClassName: ""
