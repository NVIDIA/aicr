apiVersion: aicr.run/v1beta1
kind: ComponentUpgrades
component: kueue
transitions:
  # from starts at 0.19.3, the release AICR pinned before 0.19.6 and the only
  # origin assessed. Earlier 0.19.x releases still face the 0.19.1 and 0.19.3
  # action-required items (LWSImmutableGroupSize, stricter Workload slice-size
  # validation, the reserved pods resource name), which these steps do not
  # cover, and 0.18.x has its own catalog note; all of those resolve to
  # blocked. From 0.19.3 none of the three changes at 0.19.6: their gates
  # (LWSImmutableGroupSize, TASValidateWorkloadSliceSize,
  # ReservedResourceNameValidation) have the same defaults at both releases.
  #
  # verdict is manual even though a default install needs nothing: a
  # verdict cannot depend on values, and a cluster whose override disables
  # topology-aware scheduling crash-loops at 0.19.6 without the step below.
  # No UAT lane or KWOK run has exercised this transition, so there is no
  # verifiedBy.
  - from: ">=0.19.3 <0.19.6"
    to: "0.19.6"
    verdict: manual
    summary: >-
      0.19.6 adds the TASPartialSlices feature gate, on by default, which
      requires TopologyAwareScheduling. A cluster whose kueue override sets
      TopologyAwareScheduling=false therefore fails kueue's feature-gate
      validation at startup and the controller crash-loops, unless the
      override also sets TASPartialSlices=false. Releases before 0.19.6
      reject that gate name, so it has to land in the same change as the
      bump. AICR sets no kueue feature gates, so a default install needs
      nothing.
    precondition: >-
      Know whether your kueue override disables topology-aware scheduling.
      Check both places it can live:
      `kubectl get deploy kueue-controller-manager -n kueue-system -o jsonpath='{.spec.template.spec.containers[?(@.name=="manager")].args}'`
      for --feature-gates, and
      `kubectl get configmap kueue-manager-config -n kueue-system -o jsonpath='{.data.controller_manager_config\.yaml}'`
      for a featureGates block. If neither sets TopologyAwareScheduling to
      false, the disable-tas-subgates step does not apply.
    stepsByDeployer:
      - deployers: [helm, helmfile, terraform]
        steps:
          - id: disable-tas-subgates
            description: >-
              Only if the override sets TopologyAwareScheduling=false: make
              the same list, in controllerManager.featureGates or the
              featureGates block of managerConfig.controllerManagerConfigYaml,
              set all nine of TASHandleOverlappingFlavors,
              TASFailedNodeReplacement, TASFailedNodeReplacementFailFast,
              TASReplaceNodeOnPodTermination, TASReplaceNodeOnNodeTaints,
              TASMultiLayerTopology,
              TASRecomputeAssignmentWithinSchedulingCycle, TASProfileMixed and
              TASPartialSlices to false, and regenerate the 0.19.6 bundle
              with it.
            reason: >-
              Each of the nine defaults on and requires topology-aware
              scheduling, so leaving any one on fails kueue's feature-gate
              validation at startup. TASPartialSlices is the one 0.19.6 adds;
              a bundle before 0.19.6 rejects it as an unrecognized feature
              gate.
          - id: apply
            description: >-
              Re-run install.sh (helm), helmfile apply (helmfile), or
              terraform apply on the regenerated bundle (terraform).
            reason: >-
              Moves kueue to 0.19.6 with the gate list it validates at
              startup.
      - steps:
          - id: disable-tas-subgates
            description: >-
              Only if the override sets TopologyAwareScheduling=false: make
              the same list, in controllerManager.featureGates or the
              featureGates block of managerConfig.controllerManagerConfigYaml,
              set all nine of TASHandleOverlappingFlavors,
              TASFailedNodeReplacement, TASFailedNodeReplacementFailFast,
              TASReplaceNodeOnPodTermination, TASReplaceNodeOnNodeTaints,
              TASMultiLayerTopology,
              TASRecomputeAssignmentWithinSchedulingCycle, TASProfileMixed and
              TASPartialSlices to false, in the same commit that moves the
              kueue release to 0.19.6.
            reason: >-
              Each of the nine defaults on and requires topology-aware
              scheduling, so leaving any one on fails kueue's feature-gate
              validation at startup. TASPartialSlices is the one 0.19.6 adds;
              committed ahead of the bump, a 0.19.x controller rejects it as
              an unrecognized feature gate.
          - id: apply
            description: >-
              Sync or reconcile the kueue release.
            reason: >-
              Moves kueue to 0.19.6 with the gate list it validates at
              startup.
    references:
      - https://github.com/NVIDIA/aicr/blob/main/docs/user/component-catalog.md#kueue-018x-to-019x
      - https://github.com/kubernetes-sigs/kueue/releases/tag/v0.19.6
      - https://github.com/kubernetes-sigs/kueue/releases/tag/v0.19.5
      - https://github.com/kubernetes-sigs/kueue/releases/tag/v0.19.4
  - from: ">=0.19.6 <0.19.13"
    to: "0.19.13"
    verdict: manual
    summary: >-
      From 0.19.9 kueue rejects an invalid
      metrics.localQueueMetrics.localQueueSelector at startup, so a cluster
      whose override enables LocalQueue metrics with a selector that does not
      parse crash-loops after the upgrade; before 0.19.9 the invalid
      selector was ignored and every LocalQueue was reported. AICR enables
      neither, so a default install needs nothing.
    precondition: >-
      Know whether your kueue override enables LocalQueue metrics. Check
      `kubectl get configmap kueue-manager-config -n kueue-system -o jsonpath='{.data.controller_manager_config\.yaml}'`
      for metrics.localQueueMetrics.enable: true with a localQueueSelector.
      If it is absent or false, the fix-selector step does not apply.
    stepsByDeployer:
      - deployers: [helm, helmfile, terraform]
        steps:
          - id: fix-selector
            description: >-
              Only if the override enables metrics.localQueueMetrics: make
              its localQueueSelector a valid label selector, or remove it,
              in managerConfig.controllerManagerConfigYaml, and regenerate
              the 0.19.13 bundle with it.
            reason: >-
              0.19.9 and later validate the selector at startup and refuse to
              start on an invalid one.
          - id: apply
            description: >-
              Re-run install.sh (helm), helmfile apply (helmfile), or
              terraform apply on the regenerated bundle (terraform).
            reason: Moves kueue to 0.19.13.
      - steps:
          - id: fix-selector
            description: >-
              Only if the override enables metrics.localQueueMetrics: make
              its localQueueSelector a valid label selector, or remove it,
              in managerConfig.controllerManagerConfigYaml, in the same
              commit that moves the kueue release to 0.19.13.
            reason: >-
              0.19.9 and later validate the selector at startup and refuse to
              start on an invalid one.
          - id: apply
            description: >-
              Sync or reconcile the kueue release.
            reason: Moves kueue to 0.19.13.
    references:
      - https://github.com/kubernetes-sigs/kueue/releases/tag/v0.19.9
      - https://github.com/kubernetes-sigs/kueue/releases/tag/v0.19.12
      - https://github.com/kubernetes-sigs/kueue/releases/tag/v0.19.13
  - from: ">=0.19.13 <0.19.14"
    to: "0.19.14"
    verdict: manual
    summary: >-
      0.19.14 enables the Beta feature gate WorkloadPriorityClassWatchesWorkloads
      by default, so a priority set directly on a Workload that references a
      WorkloadPriorityClass is put back to the class value, where 0.19.13
      kept it; that can change preemption order. Admission also tightens: a
      Workload whose Pods' summed limits exceed a type Pod LimitRange max is
      held inadmissible instead of admitted, and a ResourceFlavor nodeLabels
      entry with an empty value matches only nodes that carry the label. AICR
      sets no kueue feature gate and its flavors use no empty label value, so
      a default install needs only the apply.
    precondition: >-
      Know whether anything on the cluster patches spec.priority on Workloads
      directly and relies on it sticking, whether a type Pod LimitRange max
      applies in namespaces that submit to kueue, and whether a ResourceFlavor
      you created has a nodeLabels entry with an empty value. If none holds,
      the keep-direct-priority step does not apply.
    stepsByDeployer:
      - deployers: [helm, helmfile, terraform]
        steps:
          - id: keep-direct-priority
            description: >-
              Only if Workload priorities are set directly and must be kept:
              add {name: WorkloadPriorityClassWatchesWorkloads, enabled: false}
              to controllerManager.featureGates in your kueue values override
              before applying.
            reason: >-
              With the gate on, kueue resets such a priority to the
              WorkloadPriorityClass value on its next reconcile.
          - id: apply
            description: >-
              Re-run install.sh (helm), helmfile apply (helmfile), or
              terraform apply on the regenerated bundle (terraform).
            reason: Moves kueue to 0.19.14.
      - steps:
          - id: keep-direct-priority
            description: >-
              Only if Workload priorities are set directly and must be kept:
              add {name: WorkloadPriorityClassWatchesWorkloads, enabled: false}
              to controllerManager.featureGates in your kueue values override,
              in the same commit that moves the kueue release to 0.19.14.
            reason: >-
              With the gate on, kueue resets such a priority to the
              WorkloadPriorityClass value on its next reconcile.
          - id: apply
            description: >-
              Sync or reconcile the kueue release.
            reason: Moves kueue to 0.19.14.
    references:
      - https://github.com/kubernetes-sigs/kueue/releases/tag/v0.19.14
