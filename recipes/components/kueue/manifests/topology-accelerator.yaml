# Kueue Topology for an accelerator-domain-only Topograph (Kind: the dra
# provider reads the existing nvidia.com/gpu.clique labels and the k8s engine
# publishes them as accelerator.topograph.run/domain; there is no switch
# fabric to express). Levels are node label keys, widest first, ending in the
# per-node hostname. See topology-tiers-3.yaml for why the level list is
# per-leaf. Nodes without a clique label (the Kind control plane) are not
# usable by TAS.
apiVersion: kueue.x-k8s.io/v1beta2
kind: Topology
metadata:
  name: tas-topology
  annotations:
    # Post-install hook required for custom apiVersions (see resource-flavor
    # .yaml). Weight 0: applied before tas-flavor (weight 1), which
    # references this Topology by name via spec.topologyName.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  levels:
    - nodeLabel: accelerator.topograph.run/domain
    - nodeLabel: kubernetes.io/hostname
