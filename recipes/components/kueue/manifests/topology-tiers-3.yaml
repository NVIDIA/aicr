# Kueue Topology for a three-tier Topograph fabric (EKS aws provider, GKE gcp
# provider). Levels are node label keys, widest domain first, ending in the
# per-node hostname. A Topology has a fixed level list while Topograph's
# fabric depth varies per cluster, so each leaf ships the one matching its
# provider; a node missing any level label is not usable by TAS (see
# topology-accelerator.yaml for the Kind shape).
apiVersion: kueue.x-k8s.io/v1beta2
kind: Topology
metadata:
  name: tas-topology
  annotations:
    # Post-install hook required for custom apiVersions (see resource-flavor
    # .yaml). Weight 0: applied before tas-flavor (weight 1), which
    # references this Topology by name via spec.topologyName.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  levels:
    - nodeLabel: fabric.topograph.run/tier-2
    - nodeLabel: fabric.topograph.run/tier-1
    - nodeLabel: fabric.topograph.run/tier-0
    - nodeLabel: kubernetes.io/hostname
