# Topology-aware ResourceFlavor for the AICR kueue component. default-flavor
# stays topology-free so recipes that do not opt in are unchanged; leaves
# that opt in ship this flavor instead, with a ClusterQueue that references
# it (cluster-queue-tas.yaml).
#
# nodeLabels restricts the flavor to GPU nodes. The toleration is REQUIRED
# for the same reason as in default-flavor: Kueue injects flavor tolerations
# into admitted workloads and TAS does not see webhook-injected tolerations.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: tas-flavor
  annotations:
    # Post-install hook required for custom apiVersions (see resource-flavor
    # .yaml). Weight 1: after the Topology (weight 0) it names, before the
    # ClusterQueue (weight 5) that references this flavor.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  topologyName: tas-topology
  nodeLabels:
    nvidia.com/gpu.present: "true"
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
