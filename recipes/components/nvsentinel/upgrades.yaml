# The first transition was written for the v1.22.0 to v1.25.0 pin move. AICR
# never shipped v1.23.0 or v1.24.0, so it records the one hop AICR made: from
# starts at the previous pin rather than reaching lower, because nothing below
# v1.22.0 was assessed, and the changes v1.23.0 through v1.25.0 introduced are
# described together at the v1.25.0 boundary. Its verdict is manual rather than
# safe: the host-port check is real work on clusters that already bind 2112,
# and safe may not carry steps. The second records the v1.26.0 pin move,
# which changes no value or default AICR's recipes rely on.
apiVersion: aicr.run/v1beta1
kind: ComponentUpgrades
component: nvsentinel
transitions:
  - from: ">=1.22.0 <1.25.0"
    to: "1.25.0"
    verdict: manual
    verifiedBy: >-
      Kind run with nvml-mock on 2026-09-30, v1.25.0 from an AICR
      h100-kind-training bundle: the nvsentinel health check passes;
      metadata-collector binds host port 2112; with 2112 already held on
      the node it logged "Metrics endpoint stopped; continuing without it
      ... bind: address already in use", stayed Running with no restarts,
      and the health check still passed; an injected XID 48 raised
      SysLogsXIDError with the GPU UUID; gpu-health-monitor tried the new
      nvidia-dcgm-dra candidate, connected to nvidia-dcgm, and an injected
      double-bit ECC error raised GpuMemWatch with the GPU UUID.
    summary: >-
      From v1.23.0 metadata-collector, which runs with hostNetwork, serves
      Prometheus metrics on port 2112 of every GPU node. A node process that
      already holds 2112, such as kube-vip's metrics endpoint, keeps the port:
      at v1.25.0 the collector logs "Metrics endpoint stopped; continuing
      without it" and runs on without metrics, so nothing but that log line
      shows they are gone. v1.24.0 also dropped preflight.qps and
      preflight.burst; an override of either still renders and is silently
      ignored.
    precondition: >-
      Nothing listens on host port 2112 on any GPU node, or the recipe moves
      the endpoint first.
    reversible: true
    reversibleNotes: >-
      helm rollback to the v1.22.0 revision restores the previous workloads.
      The v1.25.0 CRDs stay applied; their changes are cosmetic, so v1.22.0
      runs against them unchanged. This rests on the CRD diff and on the
      v1.22.0 bundle running no NVSentinel datastore (the remediation steps
      first ship with the v1.26.0 pin); the rollback itself was not exercised.
    stepsByDeployer:
      - deployers: [helmfile, fleet]
        steps:
          - id: check-host-port
            description: >-
              On every GPU node (kubectl get nodes -l
              nvidia.com/gpu.present=true), check for a listener on port 2112,
              for example kubectl debug node/<gpu-node> -it
              --image=busybox:1.38.0 -- netstat -ltn. If any node has one, set
              nv-sentinel:metadata-collector.metrics.port to a port free on
              every GPU node, or
              nv-sentinel:metadata-collector.metrics.enabled=false, and
              regenerate the bundle.
            reason: >-
              The collector keeps running when the bind fails, so a
              collision costs that node's metrics without failing any health
              check, and a clean node says nothing about the others.
          - id: drop-preflight-rate-limits
            description: >-
              If the recipe or a --set sets preflight.qps or preflight.burst,
              remove it. v1.24.0 removed client-side rate limiting from the
              preflight controller with no replacement; to limit its API
              load, use API Priority and Fairness on the API server.
            reason: >-
              The chart no longer reads either value, so an override renders
              and silently stops throttling. Upstream removed the limit
              because preflight sits on the pod admission path, where
              throttling pushed gang admission past the webhook timeout.
          - id: apply-new-crds
            description: >-
              Apply the v1.25.0 CRDs using the CRD-apply command under
              "Upgrading components that own CRDs" in
              docs/user/component-catalog.md, with
              CHART=oci://ghcr.io/nvidia/nvsentinel, VERSION=v1.25.0 and
              EXCLUDE_SUBCHARTS=mongodb-store, so the Percona CRDs
              psmdb-operator owns are left alone.
            reason: >-
              helmfile and fleet never update CRDs for ownsCRDs components
              (Fleet's Helm upgrade skips crds/). The
              v1.25.0 changes are cosmetic (a description and a vr shortName
              on ValidationRequest), so skipping this leaves the v1.22.0
              schema text in place rather than breaking anything.
          - id: apply
            description: >-
              Run helmfile apply from a bundle generated at the new pin
              (helmfile), or push the regenerated bundle (fleet GitRepo
              mode) or apply the regenerated helmops.yaml (fleet HelmOp
              mode) and let Fleet reconcile it.
            reason: >-
              Rolls the DaemonSets and Deployments to v1.25.0.
          - id: verify
            description: >-
              kubectl -n nvsentinel rollout status daemonset/metadata-collector,
              then check every collector pod's logs for "Metrics endpoint
              stopped": kubectl -n nvsentinel logs -l
              app.kubernetes.io/name=metadata-collector --prefix --tail=-1.
            reason: >-
              A rolled-out DaemonSet alone does not prove the metrics endpoint
              bound, and logs of the DaemonSet name show only one pod.
      - deployers: [terraform]
        steps:
          - id: check-host-port
            description: >-
              On every GPU node (kubectl get nodes -l
              nvidia.com/gpu.present=true), check for a listener on port 2112,
              for example kubectl debug node/<gpu-node> -it
              --image=busybox:1.38.0 -- netstat -ltn. If any node has one, set
              nv-sentinel:metadata-collector.metrics.port to a port free on
              every GPU node, or
              nv-sentinel:metadata-collector.metrics.enabled=false, and
              regenerate the bundle.
            reason: >-
              The collector keeps running when the bind fails, so a
              collision costs that node's metrics without failing any health
              check, and a clean node says nothing about the others.
          - id: drop-preflight-rate-limits
            description: >-
              If the recipe or a --set sets preflight.qps or preflight.burst,
              remove it. v1.24.0 removed client-side rate limiting from the
              preflight controller with no replacement; to limit its API
              load, use API Priority and Fairness on the API server.
            reason: >-
              The chart no longer reads either value, so an override renders
              and silently stops throttling. Upstream removed the limit
              because preflight sits on the pod admission path, where
              throttling pushed gang admission past the webhook timeout.
          - id: apply-new-crds
            description: >-
              Apply the v1.25.0 CRDs using the CRD-apply command under
              "Upgrading components that own CRDs" in
              docs/user/component-catalog.md, with
              CHART=oci://ghcr.io/nvidia/nvsentinel, VERSION=v1.25.0,
              MANAGER=terraform-provider-helm and
              EXCLUDE_SUBCHARTS=mongodb-store, so the Percona CRDs
              psmdb-operator owns are left alone.
            reason: >-
              terraform never updates CRDs for ownsCRDs components: helm_release
              upgrades through Helm, which never applies a changed crds/. The
              v1.25.0 changes are cosmetic (a description and a vr shortName
              on ValidationRequest), so skipping this leaves the v1.22.0
              schema text in place rather than breaking anything.
          - id: apply
            description: >-
              Regenerate the bundle at the new pin and run terraform apply.
            reason: >-
              Rolls the DaemonSets and Deployments to v1.25.0.
          - id: verify
            description: >-
              kubectl -n nvsentinel rollout status daemonset/metadata-collector,
              then check every collector pod's logs for "Metrics endpoint
              stopped": kubectl -n nvsentinel logs -l
              app.kubernetes.io/name=metadata-collector --prefix --tail=-1.
            reason: >-
              A rolled-out DaemonSet alone does not prove the metrics endpoint
              bound, and logs of the DaemonSet name show only one pod.
      - steps:
          - id: check-host-port
            description: >-
              On every GPU node (kubectl get nodes -l
              nvidia.com/gpu.present=true), check for a listener on port 2112,
              for example kubectl debug node/<gpu-node> -it
              --image=busybox:1.38.0 -- netstat -ltn. If any node has one, set
              nv-sentinel:metadata-collector.metrics.port to a port free on
              every GPU node, or
              nv-sentinel:metadata-collector.metrics.enabled=false, and
              regenerate the bundle.
            reason: >-
              The collector keeps running when the bind fails, so a
              collision costs that node's metrics without failing any health
              check, and a clean node says nothing about the others.
          - id: drop-preflight-rate-limits
            description: >-
              If the recipe or a --set sets preflight.qps or preflight.burst,
              remove it. v1.24.0 removed client-side rate limiting from the
              preflight controller with no replacement; to limit its API
              load, use API Priority and Fairness on the API server.
            reason: >-
              The chart no longer reads either value, so an override renders
              and silently stops throttling. Upstream removed the limit
              because preflight sits on the pod admission path, where
              throttling pushed gang admission past the webhook timeout.
          - id: apply
            description: >-
              Re-run install.sh (helm), or commit the regenerated bundle and
              reconcile or sync it (flux, argocd, argocd-helm).
            reason: >-
              These deployers apply the chart's CRDs themselves, then roll the
              DaemonSets and Deployments to v1.25.0.
          - id: verify
            description: >-
              kubectl -n nvsentinel rollout status daemonset/metadata-collector,
              then check every collector pod's logs for "Metrics endpoint
              stopped": kubectl -n nvsentinel logs -l
              app.kubernetes.io/name=metadata-collector --prefix --tail=-1.
            reason: >-
              A rolled-out DaemonSet alone does not prove the metrics endpoint
              bound, and logs of the DaemonSet name show only one pod.
    references:
      - https://github.com/NVIDIA/NVSentinel/releases/tag/v1.23.0
      - https://github.com/NVIDIA/NVSentinel/releases/tag/v1.24.0
      - https://github.com/NVIDIA/NVSentinel/releases/tag/v1.25.0
      - https://github.com/NVIDIA/NVSentinel/blob/v1.25.0/metadata-collector/main.go
      - https://github.com/NVIDIA/NVSentinel/pull/1849
  - from: ">=1.25.0 <1.26.0"
    to: "1.26.0"
    verdict: safe
    verifiedBy: >-
      Upstream v1.26.0 release notes, and helm template of v1.25.0 and v1.26.0
      with AICR's nvsentinel values, alone and with each nvsentinel mixin's
      overrides, on 2026-10-08: without a remediation step the renders differ
      only in image tags, an explicit --metrics-addr 0.0.0.0 (the previous
      bind address) on gpu-health-monitor, and a quoted hostPath; every CRD
      file is byte-identical.
    summary: >-
      Images move to v1.26.0; no CRD, no value AICR sets, and no chart default
      AICR relies on changed. The external MongoDB setup Job stops being a Helm
      hook, but it renders only with global.datastore set, which no AICR
      release has deployed.
    reversible: true
    reversibleNotes: >-
      helm rollback to the v1.25.0 revision restores the previous workloads;
      the CRDs are identical across the two versions. This rests on the chart
      diff; the rollback itself was not exercised.
    references:
      - https://github.com/NVIDIA/NVSentinel/releases/tag/v1.26.0
  - from: ">=1.25.0 <1.28.0"
    to: "1.28.0"
    verdict: manual
    verifiedBy: >-
      Upstream v1.27.0 and v1.28.0 release notes and commit lists, and helm
      template of v1.26.0, v1.27.0 and v1.28.0 on
      2026-10-19: images move to v1.28.0 with no third-party image change,
      no values key AICR sets moved, and the only CRD change is v1.27.0's
      status.managedServices on gpuresets.janitor.dgxc.nvidia.com, which the
      v1.26.0 schema does not declare and does not preserve unknown fields
      under. janitor (pkg/controller/gpureset_controller.go,
      ensureManagedServicesRecord) re-records a missing managedServices and
      requeues before tearing services down. From v1.25.0 the jump also
      crosses v1.26.0, the safe record above, whose CRDs are byte-identical
      to v1.25.0's, so these steps hold from either starting version.
    summary: >-
      From v1.27.0 janitor records in GPUReset status.managedServices which GPU
      Operator services it stopped before a reset, and restores only those.
      The v1.26.0 GPUReset CRD does not declare the field, so the API server
      prunes it; janitor then rewrites the record every second and the reset
      never reaches its Job, leaving the node cordoned. It matters only where
      janitor runs, which is the nvsentinel-remediation step. On the observe
      step, the quarantine annotations v1.26.0 wrote carry no dry-run marker,
      so the new release reads each once as a manual uncordon and cancels the
      faults observed before the upgrade; and v1.26.0's dry run fed the
      circuit breaker, so a trip it persisted halts fault-quarantine once the
      cluster moves to a live step.
    precondition: >-
      Where janitor runs (kubectl -n nvsentinel get deployment janitor finds
      it, as on the nvsentinel-remediation step), no GPUReset is in progress:
      kubectl get gpuresets.janitor.dgxc.nvidia.com -o
      jsonpath='{range .items[*]}{.metadata.name}{" "}{.status.conditions[?(@.type=="Complete")].status}{"\n"}{end}'
      prints True for every GPUReset.
    reversible: true
    reversibleNotes: >-
      helm rollback to the previous revision restores the previous workloads.
      The newer GPUReset CRD stays applied; it only adds an optional status
      field, which earlier janitor versions do not read. First remove the
      dry-run marker from every node (kubectl annotate nodes --all
      quarantineHealthEventDryRun-): earlier versions leave it in place, so a real
      quarantine it makes would carry the marker, and the next upgrade would
      discard that quarantine as a dry run and leave the node cordoned with
      no record. This rests on the CRD diff and upstream's notes; the
      rollback itself was not exercised.
    stepsByDeployer:
      - deployers: [helmfile, fleet]
        steps:
          - id: apply-new-crds
            description: >-
              Apply the v1.28.0 CRDs using the CRD-apply command under
              "Upgrading components that own CRDs" in
              docs/user/component-catalog.md, with
              CHART=oci://ghcr.io/nvidia/nvsentinel, VERSION=v1.28.0 and
              EXCLUDE_SUBCHARTS=mongodb-store, so the Percona CRDs
              psmdb-operator owns are left alone.
            reason: >-
              helmfile and fleet never update CRDs for ownsCRDs components
              (Fleet's Helm upgrade skips crds/). Without a GPUReset CRD
              from v1.27.0 or later, the API server prunes
              status.managedServices and every GPU reset stalls before its
              Job.
          - id: apply
            description: >-
              Run helmfile apply from a bundle generated at the new pin
              (helmfile), or push the regenerated bundle (fleet GitRepo
              mode) or apply the regenerated helmops.yaml (fleet HelmOp
              mode) and let Fleet reconcile it.
            reason: >-
              Rolls the DaemonSets and Deployments to v1.28.0.
          - id: reset-breaker
            description: >-
              If the cluster ran the observe step before v1.27.0 and this
              bundle moves it to a live step (quarantine or remediation),
              check kubectl get cm circuit-breaker -n nvsentinel -o
              jsonpath='{.data.status}'. If it prints TRIPPED, reset it with
              upstream's circuit-breaker runbook
              (docs/runbooks/circuit-breaker.md at v1.28.0), which patches
              the ConfigMap to CLOSED and restarts fault-quarantine.
            reason: >-
              v1.26.0's dry run fed the breaker, and a trip it persisted
              halts fault-quarantine at its first live start, so no fault is
              quarantined or released until the breaker is reset.
          - id: verify
            description: >-
              If janitor runs (kubectl -n nvsentinel get deployment
              janitor), kubectl get crd gpuresets.janitor.dgxc.nvidia.com -o
              jsonpath='{.spec.versions[0].schema.openAPIV3Schema.properties.status.properties.managedServices.type}'
              prints object. Without janitor the chart renders no GPUReset
              CRD and there is nothing to check.
            reason: >-
              A rolled-out janitor says nothing about the CRD, and the stall
              shows only when a reset runs.
      - deployers: [terraform]
        steps:
          - id: apply-new-crds
            description: >-
              Apply the v1.28.0 CRDs using the CRD-apply command under
              "Upgrading components that own CRDs" in
              docs/user/component-catalog.md, with
              CHART=oci://ghcr.io/nvidia/nvsentinel, VERSION=v1.28.0,
              MANAGER=terraform-provider-helm and
              EXCLUDE_SUBCHARTS=mongodb-store, so the Percona CRDs
              psmdb-operator owns are left alone.
            reason: >-
              terraform never updates CRDs for ownsCRDs components: helm_release
              upgrades through Helm, which never applies a changed crds/.
              Without a GPUReset CRD from v1.27.0 or later, the API server prunes
              status.managedServices and every GPU reset stalls before its
              Job.
          - id: apply
            description: >-
              Regenerate the bundle at the new pin and run terraform apply.
            reason: >-
              Rolls the DaemonSets and Deployments to v1.28.0.
          - id: reset-breaker
            description: >-
              If the cluster ran the observe step before v1.27.0 and this
              bundle moves it to a live step (quarantine or remediation),
              check kubectl get cm circuit-breaker -n nvsentinel -o
              jsonpath='{.data.status}'. If it prints TRIPPED, reset it with
              upstream's circuit-breaker runbook
              (docs/runbooks/circuit-breaker.md at v1.28.0), which patches
              the ConfigMap to CLOSED and restarts fault-quarantine.
            reason: >-
              v1.26.0's dry run fed the breaker, and a trip it persisted
              halts fault-quarantine at its first live start, so no fault is
              quarantined or released until the breaker is reset.
          - id: verify
            description: >-
              If janitor runs (kubectl -n nvsentinel get deployment
              janitor), kubectl get crd gpuresets.janitor.dgxc.nvidia.com -o
              jsonpath='{.spec.versions[0].schema.openAPIV3Schema.properties.status.properties.managedServices.type}'
              prints object. Without janitor the chart renders no GPUReset
              CRD and there is nothing to check.
            reason: >-
              A rolled-out janitor says nothing about the CRD, and the stall
              shows only when a reset runs.
      - steps:
          - id: apply
            description: >-
              Re-run install.sh (helm), or commit the regenerated bundle and
              reconcile or sync it (flux, argocd, argocd-helm).
            reason: >-
              These deployers apply the chart's CRDs themselves, then roll the
              DaemonSets and Deployments to v1.28.0.
          - id: reset-breaker
            description: >-
              If the cluster ran the observe step before v1.27.0 and this
              bundle moves it to a live step (quarantine or remediation),
              check kubectl get cm circuit-breaker -n nvsentinel -o
              jsonpath='{.data.status}'. If it prints TRIPPED, reset it with
              upstream's circuit-breaker runbook
              (docs/runbooks/circuit-breaker.md at v1.28.0), which patches
              the ConfigMap to CLOSED and restarts fault-quarantine.
            reason: >-
              v1.26.0's dry run fed the breaker, and a trip it persisted
              halts fault-quarantine at its first live start, so no fault is
              quarantined or released until the breaker is reset.
          - id: verify
            description: >-
              If janitor runs (kubectl -n nvsentinel get deployment
              janitor), kubectl get crd gpuresets.janitor.dgxc.nvidia.com -o
              jsonpath='{.spec.versions[0].schema.openAPIV3Schema.properties.status.properties.managedServices.type}'
              prints object. Without janitor the chart renders no GPUReset
              CRD and there is nothing to check.
            reason: >-
              Confirms the deployer applied the new CRD; the stall shows only
              when a reset runs.
    references:
      - https://github.com/NVIDIA/NVSentinel/releases/tag/v1.27.0
      - https://github.com/NVIDIA/NVSentinel/releases/tag/v1.28.0
      - https://github.com/NVIDIA/NVSentinel/pull/1989
      - https://github.com/NVIDIA/NVSentinel/blob/v1.28.0/docs/configuration/fault-quarantine.md
  - from: ">=1.28.0 <1.31.0"
    to: "1.31.0"
    verdict: manual
    verifiedBy: >-
      Upstream v1.29.0, v1.30.0 and v1.31.0 release notes, the v1.28.0 to
      v1.31.0 source compare, and helm template of the v1.30.0 and v1.31.0
      charts on 2026-11-10 with the nvsentinel values AICR hydrates for the
      base chain, for each nvsentinel mixin alone and for the remediation
      compositions: the renders differ only in image tags, the new default
      fault-quarantine rule set for health-events-analyzer events, the XID 74
      rules in the analyzer, a get on daemonsets for janitor and on nodes/pods
      for metadata-collector, and the removal of the
      MONGODB_PING_TIMEOUT_TOTAL_SECONDS pin; the rendered image set is
      unchanged apart from the tag. The v1.28.0 to v1.30.0 renders were
      compared on 2026-11-02 with the same method: image tags, a LOG_LEVEL env
      var, the XID 45 exclusion, and metadata-collector's
      --pod-mapper-enabled=true (its previous behavior). The chart's default
      labeler GPU class reads gpu.nvidia.com ResourceSlices, which makes the
      labeler wait on a resource.k8s.io/v1 informer that Kubernetes 1.32 and
      1.33 never serve and skip every node reconcile, so the recipe pins
      v1.28.0's classes; on Kind 1.33.1 the chart's default labeler failed to
      list ResourceSlices and the pinned classes restored driver-label
      recovery and NIC tracking. Live on 2026-11-10 against the v1.31.0
      chart: six nvsentinel Kind e2e lanes (post-remediation-validation,
      external-remediation, maintenance-request, remediation, object-monitor,
      health-events-analyzer) and two KWOK recipes passed, the pinned
      labeler classes passed on Kubernetes 1.32 through 1.36, and the
      simulated-GPU UAT lane installed the h100-training-slurm bundle with all
      four gpu-health-monitor-dcgm-4.x pods connected to DCGM with 8 GPUs each
      while the dcgm-3.x monitor stayed inactive.
    summary: >-
      From v1.31.0 the chart's default fault-quarantine rule set cordons and
      drains a node for a fatal health-events-analyzer event
      (MultipleRemediations, repeated XID 74), where v1.28.0 set only a node
      condition. It applies where the analyzer's effective processingStrategy
      is EXECUTE_REMEDIATION and fault-quarantine.ruleSets keeps that rule
      set; the nvsentinel-health-events-analyzer mixin's STORE_ONLY default is
      unaffected. Where the remediation step is composed and nodes run R610 or
      later drivers, XID 154 recovery actions now reset the GPU or reboot the
      node, which v1.28.0 reported as CONTACT_SUPPORT.
    precondition: >-
      Where health-events-analyzer is deployed, its module-level
      processingStrategy and the processing_strategy of every enabled rule are
      neither EXECUTE_REMEDIATION nor UNSPECIFIED (an absent module value is
      the chart default, EXECUTE_REMEDIATION, and platform-connectors converts
      UNSPECIFIED to it), or fault-quarantine.ruleSets is set without the
      "Health events analyzer fatal error ruleset", or you accept that fatal
      analyzer events cordon and drain nodes from v1.31.0. Where the remediation step is composed and
      nodes run R610 or later drivers, you accept that an XID 154 recovery
      action resets the GPU or reboots the node, or you keep
      syslog-health-monitor events out of remediation.
    reversible: true
    reversibleNotes: >-
      helm rollback to the previous revision restores the previous workloads;
      the HealthEvent CRD only gains optional status fields, and the other
      CRDs differ only in an annotation. A cordon that the new rule set
      created survives the rollback: release it with kubectl uncordon once the
      node is safe to return. The rollback itself was not exercised in this
      record's lanes.
    stepsByDeployer:
      - deployers: [helmfile, fleet]
        steps:
          - id: check-analyzer-strategy
            description: >-
              Where health-events-analyzer is deployed, read the effective
              strategies from the nv-sentinel values in the bundle: the
              module-level processingStrategy, and the processing_strategy of
              each enabled rule in health-events-analyzer.config, which
              replaces the module value for that rule when it is set. An absent
              module value is the chart default, EXECUTE_REMEDIATION, not
              STORE_ONLY: only the nvsentinel-health-events-analyzer mixin sets
              STORE_ONLY. UNSPECIFIED counts as EXECUTE_REMEDIATION too,
              because platform-connectors converts it. Also read
              fault-quarantine.ruleSets: when set, it replaces the chart's
              list, and the v1.31.0 rule set that cordons for a fatal analyzer
              event applies only while the effective list still contains
              "Health events analyzer fatal error ruleset". If a strategy
              above is EXECUTE_REMEDIATION and that rule set is present, a
              fatal analyzer event cordons and drains its node: accept that,
              or keep the v1.28.0 condition-only behavior by setting
              fault-quarantine.ruleSets to the chart's v1.31.0 default list
              without that rule set (carry every other rule set, since the
              list replaces the default). Setting STORE_ONLY instead also
              removes the node condition and the Kubernetes Event that
              EXECUTE_REMEDIATION set, so alerts that read them stop; set it
