# NVIDIA Cluster Readiness Engine (NVCRE) Helm values.
#
# Upstream: https://github.com/NVIDIA/cluster-readiness-engine
# Chart:    oci://ghcr.io/nvidia/cluster-readiness-engine
#
# Chart and controller image are public on GHCR and both pull anonymously:
# `helm pull oci://ghcr.io/nvidia/cluster-readiness-engine --version v0.2.0`
# succeeds with an empty registry config, so no pull secret is required.
#
# This file applies only when a componentRef names it explicitly as
# `valuesFile: components/nvcre/values.yaml`. Component values are not
# auto-discovered from the component name, so a ref that omits it renders
# the chart defaults instead — including the ServiceMonitor and the
# release-prefixed resource names the health check cannot match.
#
# Only deliberate differences from the chart defaults are set here; everything
# else (replicas, reconcile concurrency, resources, metrics port) is left at
# upstream values so a chart bump carries its own tuning.

# Override the release-name prefix so resource names are nvcre-* rather than
# aicr-stack-*. The health check asserts the Deployment by name, so this has to
# stay in sync with checks/nvcre/health-check.yaml.
fullnameOverride: nvcre

manager:
  image:
    # Digest of the v0.2.0 multi-arch index, so the qualified bytes are the
    # installed bytes even if the tag is repointed. The chart also exposes a
    # `manager.image.digest` field, but that branch renders repository@digest
    # and drops the version; the tag@digest form used here matches how every
    # other pinned image in recipes/components/ is written and keeps v0.2.0
    # legible in the BOM. Re-resolve on a defaultVersion bump:
    #   crane digest ghcr.io/nvidia/cluster-readiness-engine/manager:<version>
    tag: v0.2.0@sha256:b7f7a71a75353f6b87eccd21cf6ae75963b82939956d5c037f0a1da944b1a4ee

# Chart default is true and requires prometheus-operator CRDs. NVCRE is not
# on any shipped overlay, so keep the monitor off until a recipe that already
# installs those CRDs opts in with --set cre:metrics.serviceMonitor.enabled=true.
metrics:
  serviceMonitor:
    enabled: false
