# Images this component deploys that no rendered template shows. See
# "Declared Images" in docs/contributor/component.md.
component: kube-prometheus-stack
charts:
  - repository: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    sourceVersion: 88.6.5
    images:
      - image: quay.io/prometheus-operator/prometheus-config-reloader:v0.93.1
        source: >-
          --prometheus-config-reloader flag of prometheus-operator, tagged with
          the chart appVersion. The operator adds it to every Prometheus pod.
