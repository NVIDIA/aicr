# Images this component deploys that no rendered `image:` field names. See
# "Declared Images" in docs/contributor/component.md.
component: runai-cluster
charts:
  - repository: https://helm.ngc.nvidia.com/nvidia/runai-oss
    chart: runai-cluster
    sourceVersion: 3.0.26
    images:
      - image: nvcr.io/nvidia/runai-oss/accessrule-controller:3.0.26
        source: Operand of runai-operator, at IMG_DEFAULT_REGISTRY and IMG_DEFAULT_VERSION.
