apiVersion: aicr.run/v1beta1
kind: ComponentUpgrades
component: slinky-slurm
transitions:
  # from starts at 1.2.0, the release AICR pinned before 1.2.2 and the only
  # one assessed here; an origin below it resolves to blocked.
  - from: ">=1.2.0 <1.2.2"
    to: "1.2.2"
    verdict: safe
    verifiedBy: >-
      Upstream changelog CHANGELOG-1.2.md (SlinkyProject/slurm-operator) at
      v1.2.2, whose v1.2.1 and v1.2.2 entries change the operator and its
      chart, not the slurm cluster chart. The slurm chart at 1.2.2 differs
      from 1.2.0 only in its chart version and README badge (diff -r of the
      two pulled charts); its appVersion stays 26.05, so the Slurm images are
      unchanged.
    summary: >-
      Chart version bump only; the rendered Slurm cluster is unchanged apart
      from the chart label. Nothing to change on upgrade.
    references:
      - https://github.com/SlinkyProject/slurm-operator/blob/v1.2.2/CHANGELOG/CHANGELOG-1.2.md
  - from: ">=1.2.2 <1.2.4"
    to: "1.2.4"
    verdict: safe
    verifiedBy: >-
      Upstream changelog CHANGELOG-1.2.md (SlinkyProject/slurm-operator) at
      v1.2.4. helm template of the slurm chart at 1.2.2 and 1.2.4 with
      AICR's values differs only in the chart label, the partition config
      string now being quoted (same value), and an empty lifecycle: {} on
      the NodeSet's slurmd, which the operator treats as unset.
    summary: >-
      Chart patch releases; the rendered resources are unchanged in effect.
      Nothing to change on upgrade.
    references:
      - https://github.com/SlinkyProject/slurm-operator/blob/v1.2.4/CHANGELOG/CHANGELOG-1.2.md
  - from: ">=1.2.4 <1.2.5"
    to: "1.2.5"
    verdict: safe
    verifiedBy: >-
      Upstream changelog CHANGELOG-1.2.md (SlinkyProject/slurm-operator) at
      v1.2.5: fixes only, including the restapi PodDisruptionBudget no longer
      setting both maxUnavailable and minAvailable, which AICR's values do
      not enable. helm template of 1.2.4 and 1.2.5 with AICR's values renders
      the same 8 objects, differing only in the version labels and the JWT
      and slurm keys the chart generates afresh on every render.
    summary: >-
      Patch release of fixes. Nothing to change on upgrade.
    references:
      - https://github.com/SlinkyProject/slurm-operator/blob/v1.2.5/CHANGELOG/CHANGELOG-1.2.md
