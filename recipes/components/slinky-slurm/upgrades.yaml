apiVersion: aicr.run/v1beta1
kind: ComponentUpgrades
component: slinky-slurm
transitions:
  # from starts at 1.2.0, the release AICR pinned before 1.2.2 and the only
  # one assessed here; an origin below it resolves to blocked.
  - from: ">=1.2.0 <1.2.2"
    to: "1.2.2"
    verdict: safe
    verifiedBy: >-
      Upstream changelog CHANGELOG-1.2.md (SlinkyProject/slurm-operator) at
      v1.2.2, whose v1.2.1 and v1.2.2 entries change the operator and its
      chart, not the slurm cluster chart. The slurm chart at 1.2.2 differs
      from 1.2.0 only in its chart version and README badge (diff -r of the
      two pulled charts); its appVersion stays 26.05, so the Slurm images are
      unchanged.
    summary: >-
      Chart version bump only; the rendered Slurm cluster is unchanged apart
      from the chart label. Nothing to change on upgrade.
    references:
      - https://github.com/SlinkyProject/slurm-operator/blob/v1.2.2/CHANGELOG/CHANGELOG-1.2.md
