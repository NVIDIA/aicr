{{- $component := index .Values "slinky-slurm" -}}
{{- with (index $component "storage") }}
{{- if (index . "enabled") }}
{{- range $key, $pvc := . }}
{{- if ne $key "enabled" }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ index $pvc "name" | quote }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    helm.sh/resource-policy: "keep"
    argocd.argoproj.io/sync-options: "Delete=false,Prune=false"
  labels:
    app.kubernetes.io/name: slinky-slurm
    app.kubernetes.io/component: shared-storage
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: {{ index $pvc "size" | quote }}
  storageClassName: {{ index $pvc "storageClassName" | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
