# These defaults must stay aligned with the Slinky NodeSet in the GB200 Slurm
# overlay. If a customer overrides the claim name or ResourceClaimTemplate name
# and introduces a mismatch, Slurm node pods can remain Pending.
---
apiVersion: resource.nvidia.com/v1beta1
kind: ComputeDomain
metadata:
  annotations:
    # preManifestFiles and dependencyRefs provide ordering for this CR.
    aicr/skip-hook-validation: "true"
  labels:
    app.kubernetes.io/created-by: aicr
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" | trunc 63 | trimSuffix "-" }}
  name: slinky-slurm-imex
  namespace: {{ .Release.Namespace }}
spec:
  # Pinned explicitly rather than relying on the CRD default. GPU Operator
  # v26.7.0 ships its own copy of resource.nvidia.com_computedomains.yaml in
  # crds/, and that copy is a stale snapshot: it lists numNodes as REQUIRED
  # and carries no `default: 0`, where the DRA driver chart's copy makes it
  # optional with a default. Helm installs crds/ only when the CRD is absent
  # and never upgrades it, and gpu-operator is ordered before
  # nvidia-dra-driver-gpu, so on a fresh cluster the operator's stricter copy
  # wins and a CR omitting numNodes is rejected with "spec.numNodes: Required
  # value". Setting it here is valid under both copies.
  #
  # 0 is the correct value, not merely a placeholder: with
  # IMEXDaemonsWithDNSNames=true (the DRA driver default) each IMEX daemon
  # starts immediately instead of waiting for a quorum. Matches
  # buildComputeDomain() in validators/performance/nccl_all_reduce_bw_constraint.go.
  numNodes: 0
  channel:
    allocationMode: All
    resourceClaimTemplate:
      name: slinky-slurm-imex-channels
