# Loads the in-tree RDMA ULP modules rdma_ucm (pulls in rdma_cm), ib_umad and
# ib_ipoib on Mellanox-NIC nodes and persists them via modules-load.d. Needed
# where the RDMA stack is the inbox kernel driver with no OFED: nothing else
# loads them (the GPU Operator only sets nvidia module parameters, the Network
# Operator only loads modules through ofedDriver). ib_ipoib creates the IPoIB
# netdevs that SR-IOV IB VFs (deviceType netdevice) and the ib-sriov CNI
# operate on; rdma_ucm and ib_umad create the /dev/infiniband/rdma_cm and umad
# nodes RDMA device plugins pass through to pods. This is rdma-core's
# infiniband.conf/rdma.conf set without the iSER/NFS ULPs.
# The modules load live, so the package has no interrupt and the CR no
# interruptionBudget; runtimeRequired still taint-gates GPU nodes until they
# are present so the SR-IOV config daemon and workloads do not start against
# an incomplete /dev/infiniband. The checks also require a umad device node:
# ib_umad loaded on a host whose HCAs have not registered yet would otherwise
# clear the taint before /dev/infiniband is complete. Host images that ship
# rdma-core or this conf make the package a no-op.
#
# Minimal templating - only tolerations/nodeSelectors are dynamic for CLI flag support.
{{- $rdma := index .Values "rdma-modules" }}
{{- if ne (toString (index $rdma "enabled")) "false" }}
---
apiVersion: nodewright.nvidia.com/v1alpha1
kind: NodeWright
metadata:
  annotations:
    # No Helm hooks: release-managed so that disabling the component retracts
    # the CR (see tuning-rke2.yaml). CRD ordering comes from the component
    # dependency on nodewright-operator.
    aicr/skip-hook-validation: "true"
  labels:
    app.kubernetes.io/part-of: skyhook-operator
    app.kubernetes.io/created-by: aicr
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" | trunc 63 | trimSuffix "-" }}
  name: rdma-modules
  namespace: {{ .Release.Namespace }}
spec:
  runtimeRequired: true
  # Default: true. Disable with --set rdmamodules:autoTaintNewNodes=false
  {{- /* Sprig-safe: a "| default true" here would swallow an explicit false under --deployer flux. */}}
  autoTaintNewNodes: {{ ne (toString (index $rdma "autoTaintNewNodes")) "false" }}
  # Dynamic: Supports --accelerated-node-toleration CLI flag
  additionalTolerations:
    {{- if $rdma.acceleratedTolerations }}
    {{- toYaml $rdma.acceleratedTolerations | nindent 4 }}
    {{- else }}
    - operator: Exists
    {{- end }}
  # Dynamic: Supports --accelerated-node-selector CLI flag. The fallback is the
  # Mellanox-NIC cohort the NicClusterPolicy DaemonSets use (nfd-worker rule in
  # components/nfd/values-nvidia-nics.yaml); nfd is ordered before this
  # component through the network-operator dependency chain.
  nodeSelectors:
    matchLabels:
      {{- if $rdma.acceleratedNodeSelector }}
      {{- toYaml $rdma.acceleratedNodeSelector | nindent 6 }}
      {{- else }}
      feature.node.kubernetes.io/pci-15b3.present: "true"
      {{- end }}
    # Control-plane nodes are excluded even when the selector matches them
    # (NVKE control planes carry a BlueField-3, so pci-15b3.present is true):
    # the runtime-required auto-taint is applied to every selected node, but
    # the package pods do not tolerate the control-plane taint, so the node
    # is skipped as TaintNotTolerable and its auto-taint is never cleared.
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist
  packages:
    rdma-ulp:
      image: ghcr.io/nvidia/skyhook-packages/shellscript
      version: "1.1.1"
      containerSHA: sha256:5414b06e52c090d0842704f2580798064362d771f12421ccc8888186b5f5a3cf
      # config.sh repeats apply.sh: Skyhook runs apply once per node and only
      # the config stage on a configMap edit, so a module-list change would
      # otherwise never reach nodes already marked complete.
      configMap:
        apply.sh: |-
          #!/bin/bash
          set -euo pipefail
          printf 'rdma_ucm\nib_umad\nib_ipoib\n' > /etc/modules-load.d/aicr-rdma-ulp.conf
          modprobe rdma_ucm
          modprobe ib_umad
          modprobe ib_ipoib
        apply_check.sh: |-
          #!/bin/bash
          set -euo pipefail
          grep -qx 'rdma_ucm' /etc/modules-load.d/aicr-rdma-ulp.conf
          grep -qx 'ib_umad' /etc/modules-load.d/aicr-rdma-ulp.conf
          grep -qx 'ib_ipoib' /etc/modules-load.d/aicr-rdma-ulp.conf
          grep -q '^rdma_ucm ' /proc/modules
          grep -q '^ib_umad ' /proc/modules
          grep -q '^ib_ipoib ' /proc/modules
          test -c /dev/infiniband/rdma_cm
          ls /dev/infiniband/umad* > /dev/null
        config.sh: |-
          #!/bin/bash
          set -euo pipefail
          printf 'rdma_ucm\nib_umad\nib_ipoib\n' > /etc/modules-load.d/aicr-rdma-ulp.conf
          modprobe rdma_ucm
          modprobe ib_umad
          modprobe ib_ipoib
        config_check.sh: |-
          #!/bin/bash
          set -euo pipefail
          grep -qx 'rdma_ucm' /etc/modules-load.d/aicr-rdma-ulp.conf
          grep -qx 'ib_umad' /etc/modules-load.d/aicr-rdma-ulp.conf
          grep -qx 'ib_ipoib' /etc/modules-load.d/aicr-rdma-ulp.conf
          grep -q '^rdma_ucm ' /proc/modules
          grep -q '^ib_umad ' /proc/modules
          grep -q '^ib_ipoib ' /proc/modules
          test -c /dev/infiniband/rdma_cm
          ls /dev/infiniband/umad* > /dev/null
{{- end }}
