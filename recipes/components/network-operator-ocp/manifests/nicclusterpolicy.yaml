{{- $v := index .Values "network-operator-ocp" }}
apiVersion: mellanox.com/v1alpha1
kind: NicClusterPolicy
metadata:
  name: {{ $v.name }}
  annotations:
    # Deliberately NOT a Helm hook: this CR is long-lived cluster networking
    # (it also installs ofedDriver) and must be updated in place —
    # hook-delete-policy would delete the live policy on every upgrade,
    # tearing down OFED/RDMA pods before the replacement reconciles.
    # CRD-before-CR ordering comes from component sequencing: this
    # manifest-only component is ordered after network-operator-ocp-olm,
    # whose Subscription installs the operator and its CRDs.
    aicr/skip-hook-validation: "true"
    # Flux does not wait for this CR: from network-operator v26.7.0 the
    # operator holds it at Ready=False until OFED is built, past
    # helm-controller's timeout (NVIDIA/aicr#2585).
    aicr/disable-wait: "true"
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  ofedDriver:
    image: {{ $v.ofedDriver.image }}
    repository: {{ $v.ofedDriver.repository }}
    version: {{ $v.ofedDriver.version }}
    upgradePolicy: {{ $v.ofedDriver.upgradePolicy | toYaml | nindent 6 }}
    startupProbe: {{ $v.ofedDriver.startupProbe | toYaml | nindent 6 }}
    livenessProbe: {{ $v.ofedDriver.livenessProbe | toYaml | nindent 6 }}
    readinessProbe: {{ $v.ofedDriver.readinessProbe | toYaml | nindent 6 }}
  rdmaSharedDevicePlugin:
    image: {{ $v.rdmaSharedDevicePlugin.image }}
    repository: {{ $v.rdmaSharedDevicePlugin.repository }}
    version: {{ $v.rdmaSharedDevicePlugin.version }}
    config: {{ $v.rdmaSharedDevicePlugin.config | quote }}
  nvIpam:
    image: {{ $v.nvIpam.image }}
    repository: {{ $v.nvIpam.repository }}
    version: {{ $v.nvIpam.version }}
    enableWebhook: {{ $v.nvIpam.enableWebhook }}
