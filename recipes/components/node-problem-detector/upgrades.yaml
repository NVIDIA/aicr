apiVersion: aicr.run/v1beta1
kind: ComponentUpgrades
component: node-problem-detector
transitions:
  # from starts at 2.4.1, the release AICR pinned before 2.4.2 and the only
  # one assessed here; an origin below it resolves to blocked.
  - from: ">=2.4.1 <2.4.2"
    to: "2.4.2"
    verdict: safe
    verifiedBy: >-
      Chart 2.4.2 in deliveryhero/helm-charts (stable/node-problem-detector,
      commit 7e0af1d3f4, PR 810; the repo publishes no per-chart release):
      it adds optional livenessProbe and readinessProbe values that default
      to empty and keeps appVersion v1.35.1. helm template of 2.4.1 and 2.4.2
      with AICR's values renders the same 7 objects, differing only in the
      chart label and the config checksum annotation that hashes it.
    summary: >-
      Chart-only release. The DaemonSet's config checksum changes with the
      chart label, so its pods restart once on upgrade; nothing to change.
    references:
      - https://github.com/deliveryhero/helm-charts/commit/7e0af1d3f4
