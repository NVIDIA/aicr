# node-problem-detector Helm values

fullnameOverride: node-problem-detector

# The chart's default ([{effect: NoSchedule, operator: Exists}]) does not
# tolerate NoExecute, so NPD would miss nodes tainted that way. Matches
# nvsentinel's wildcard.
tolerations:
  - operator: Exists

# settings.log_monitors is left at the chart default: it already loads
# kernel-monitor.json and readonly-monitor.json, which publish the three
# conditions the KOM policies consume. Verified against the pinned image
# (registry.k8s.io/node-problem-detector/node-problem-detector:v1.35.1).
