# GPUDirect RDMA over RoCE configuration for NVIDIA GPUs on GKE.
# Derived dynamically from authoritative GKE Version Vector compatibility matrices and GCE SoT.

image:
  repository: gcr.io/gke-release/nccl-roce-installer
  tag: "v2.28.9-arm64"
  pullPolicy: IfNotPresent

gibPlugin:
  repository: gcr.io/gke-release/gib-plugin
  tag: "v1.1.2-arm64"
  enabled: true

nodeSelector:
  provider: gke
  accelerator: gb300
  kubernetes.io/arch: arm64

tolerations:
  - key: "nvidia.com/gpu"
    operator: "Exists"
    effect: "NoSchedule"

cdmm:
  enabled: true
  numaExposure: true
