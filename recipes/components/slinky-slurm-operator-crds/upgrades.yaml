apiVersion: aicr.run/v1beta1
kind: ComponentUpgrades
component: slinky-slurm-operator-crds
transitions:
  # from starts at 1.2.0, the release AICR pinned before 1.2.2 and the only
  # one assessed here; an origin below it resolves to blocked.
  - from: ">=1.2.0 <1.2.2"
    to: "1.2.2"
    verdict: safe
    verifiedBy: >-
      Upstream changelog CHANGELOG-1.2.md (SlinkyProject/slurm-operator) at
      v1.2.2, whose v1.2.1 and v1.2.2 entries list no CRD or API change. The
      slurm-operator-crds chart at 1.2.2 differs from 1.2.0 only in its chart
      version and README badge (diff -r of the two pulled charts), so every
      CRD it applies is byte-identical.
    summary: >-
      Chart version bump only; the CRDs are unchanged. Nothing to change on
      upgrade.
    references:
      - https://github.com/SlinkyProject/slurm-operator/blob/v1.2.2/CHANGELOG/CHANGELOG-1.2.md
  - from: ">=1.2.2 <1.2.4"
    to: "1.2.4"
    verdict: safe
    verifiedBy: >-
      Upstream changelog CHANGELOG-1.2.md (SlinkyProject/slurm-operator) at
      v1.2.4, whose v1.2.3 and v1.2.4 entries list no CRD or API change. The
      slurm-operator-crds chart at 1.2.4 differs from 1.2.2 only in its chart
      version and README (diff -r of the two pulled charts), so every CRD it
      applies is byte-identical.
    summary: >-
      Chart version bump only; the CRDs are unchanged. Nothing to change on
      upgrade.
    references:
      - https://github.com/SlinkyProject/slurm-operator/blob/v1.2.4/CHANGELOG/CHANGELOG-1.2.md
  - from: ">=1.2.4 <1.2.5"
    to: "1.2.5"
    verdict: safe
    verifiedBy: >-
      Upstream changelog CHANGELOG-1.2.md (SlinkyProject/slurm-operator) at
      v1.2.5: the entries are fixes and Go CVE updates with no CRD change.
      helm template of 1.2.4 and 1.2.5 with AICR's values renders the same
      6 CRDs byte for byte.
    summary: >-
      No CRD change. Nothing to change on upgrade.
    references:
      - https://github.com/SlinkyProject/slurm-operator/blob/v1.2.5/CHANGELOG/CHANGELOG-1.2.md
