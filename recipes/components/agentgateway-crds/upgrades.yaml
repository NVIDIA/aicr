apiVersion: aicr.run/v1beta1
kind: ComponentUpgrades
component: agentgateway-crds
transitions:
  # from starts at 1.5.0, the release AICR pinned before 1.7.0 and the only
  # one assessed here; an origin below it resolves to blocked.
  - from: ">=1.5.0 <1.7.0"
    to: "1.7.0"
    verdict: manual
    summary: >-
      The four agentgateway.dev CRDs keep v1alpha1. The AI transformations
      and finalTransformations lists become maps keyed by field, so an
      AgentgatewayPolicy (spec.backend.ai) or AgentgatewayBackend
      (spec.policies.ai, and each provider's policies.ai under
      spec.ai.groups) that repeats a field value is rejected on create and on
      server-side apply. The other validation rules change only in ways an object valid
      at 1.5.0 still passes, or test fields 1.7.0 adds. The schemas also stop
      persisting default values such as action Allow; the controller applies
      the same defaults at runtime. The chart ships the CRDs as templates, so
      helm upgrade and a GitOps sync both apply them. AICR creates no
      AgentgatewayPolicy or AgentgatewayBackend, so a default install needs
      only the apply.
    precondition: >-
      Know whether any AgentgatewayPolicy or AgentgatewayBackend repeats a
      field value in an ai.transformations or ai.finalTransformations list.
      If none does, the dedupe-transformations step does not apply.
    stepsByDeployer:
      - steps:
          - id: dedupe-transformations
            description: >-
              Only if an AgentgatewayPolicy or AgentgatewayBackend repeats a
              field value in an ai.transformations or ai.finalTransformations
              list: keep one entry per field, the one you want applied, in
              the source you apply it from, before applying.
            reason: >-
              The 1.7.0 schema rejects the duplicate, so the object can no
              longer be updated until it is fixed.
          - id: apply
            description: >-
              Apply the regenerated bundle with your deployer.
            reason: Moves agentgateway-crds to 1.7.0.
    references:
      - https://github.com/agentgateway/agentgateway/releases/tag/v1.6.0
      - https://github.com/agentgateway/agentgateway/releases/tag/v1.7.0
