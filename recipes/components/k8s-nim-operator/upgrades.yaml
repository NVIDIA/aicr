apiVersion: aicr.run/v1beta1
kind: ComponentUpgrades
component: k8s-nim-operator
transitions:
  # from starts at 3.1.0, the release AICR pinned before 3.1.4 and the only
  # one assessed here; an origin below it resolves to blocked.
  - from: ">=3.1.0 <3.1.4"
    to: "3.1.4"
    verdict: manual
    summary: >-
      From 3.1.3 the NIM CRDs require value on every DRA attributeSelectors
      item, allow at most five autoscaling metrics, and accept minReplicas 0
      only with an External or Object metric, so a NIMService or NIMPipeline
      outside those rules is rejected on its next update. The operator's OpenShift RBAC also
      renders only when openshift.enabled is true; it defaults to false,
      which drops grants that were unused off OpenShift.
    precondition: >-
      Know whether any NIMService or NIMPipeline uses DRA claim creation with
      attributeSelectors, or autoscaling with more than five metrics. AICR ships
      none, so a default install needs only the bundle apply. The apply
      step relies on the chart default operator.upgradeCRD: true, which AICR
      does not override; if your values set it false, apply the 3.1.4 CRDs
      yourself first.
    stepsByDeployer:
      - steps:
          - id: add-selector-values
            description: >-
              Only if a NIMService sets
              spec.draResources[].claimCreationSpec.devices[].attributeSelectors,
              or a NIMPipeline sets it under spec.services[].spec: give every
              selector item a value before upgrading.
            reason: >-
              The 3.1.4 CRDs require value on each item, so a resource that
              omits it is rejected the next time it is updated, including by
              your own deployer.
          - id: fit-autoscaling-rules
            description: >-
              Only if a NIMService sets spec.scale.hpa, or a NIMPipeline sets
              it under spec.services[].spec: keep metrics to five entries or
              fewer, and set minReplicas to 0 only alongside an External or
              Object metric.
            reason: >-
              The 3.1.4 CRDs enforce both, so a resource outside them is
              rejected the next time it is updated.
          - id: apply
            description: >-
              Apply the regenerated bundle with your deployer. The chart's
              pre-upgrade hook (operator.upgradeCRD, on by default) updates
              the CRDs before the operator rolls.
            reason: >-
              Moves the operator to 3.1.4; the hook's CRD path flag is fixed
              in 3.1.1, so the 3.1.4 hook applies the new CRDs.
    references:
      - https://docs.nvidia.com/nim-operator/latest/release-notes.html
      - https://github.com/NVIDIA/k8s-nim-operator/releases/tag/v3.1.3
