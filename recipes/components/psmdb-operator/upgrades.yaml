# Both transitions start from 1.23.0 because AICR has shipped no earlier
# Percona release. stepLimit is Percona's rule that the operator moves to the
# nearest major.minor at most, with patch versions not counting.
apiVersion: aicr.run/v1beta1
kind: ComponentUpgrades
component: psmdb-operator
stepLimit: minor
transitions:
  # A patch boundary that still changes the CRDs. Manual rather than safe
  # because helmfile, terraform and fleet never apply a changed crds/
  # directory.
  - from: ">=1.23.0 <1.23.2"
    to: "=1.23.2"
    verdict: manual
    summary: >-
      Chart 1.23.2 moves the operator from 1.23.0 to 1.23.1 and changes its
      CRDs, which Percona applies before the operator. The nvsentinel-mongodb
      members then restart one at a time, because their init container and
      mongodb_exporter sidecar images change in the same bundle. crVersion
      stays at 1.23.0. The MongoDB server image is pinned separately in
      nvsentinel-mongodb, so a bundle generated after it moved to 8.0.32-14
      also rolls mongod in that pass: a same-major patch with no FCV change.
    precondition: >-
      The nvsentinel-mongodb cluster is healthy. Check with `kubectl get
      perconaservermongodb nvsentinel-mongodb -n nvsentinel`; STATUS must be
      ready.
    reversible: false
    affectedResources:
      - group: psmdb.percona.com
        kinds:
          - PerconaServerMongoDB
    stepsByDeployer:
      - deployers: [helmfile]
        steps:
          - id: apply-new-crds
            description: >-
              helm show crds psmdb-operator --repo
              https://percona.github.io/percona-helm-charts/ --version 1.23.2 |
              kubectl apply --server-side --force-conflicts -f -
            reason: >-
              helmfile upgrades through Helm, which never applies a changed
              crds/ directory, and Percona requires the new CRDs before the new
              operator.
          - id: apply-bundle
            description: >-
              Run helmfile apply from a bundle generated at the new pins.
            reason: >-
              The bundle orders psmdb-operator before nvsentinel-mongodb, so
              the operator is upgraded before the cluster's images move.
          - id: verify
            description: >-
              kubectl get perconaservermongodb nvsentinel-mongodb -n
              nvsentinel reports ready.
            reason: >-
              The members restart one at a time; ready means all three rejoined
              on the new images.
      - deployers: [terraform]
        steps:
          - id: apply-new-crds
            description: >-
              Before applying the regenerated bundle, apply the new CRDs using
              the CRD-apply command under "Upgrading components that own CRDs"
              in docs/user/component-catalog.md, with CHART=psmdb-operator,
              REPO=https://percona.github.io/percona-helm-charts/,
              VERSION=1.23.2 and MANAGER=terraform-provider-helm.
            reason: >-
              helm_release upgrades through Helm, which never applies a changed
              crds/ directory, and Percona requires the new CRDs before the new
              operator.
          - id: apply-bundle
            description: >-
              Regenerate the bundle at the new pins and run terraform apply.
            reason: >-
              The module graph orders psmdb-operator before nvsentinel-mongodb,
              so the operator is upgraded before the cluster's images move.
          - id: verify
            description: >-
              kubectl get perconaservermongodb nvsentinel-mongodb -n
              nvsentinel reports ready.
            reason: >-
              The members restart one at a time; ready means all three rejoined
              on the new images.
      - deployers: [fleet]
        steps:
          - id: apply-new-crds
            description: >-
              Before applying the regenerated bundle, apply the new CRDs to
              every downstream cluster the bundle targets, using the
              CRD-apply command under "Upgrading components that own CRDs" in
              docs/user/component-catalog.md, with CHART=psmdb-operator,
              REPO=https://percona.github.io/percona-helm-charts/,
              VERSION=1.23.2 and MANAGER set to the manager that section's
              managed-fields check reports for the installed CRDs.
            reason: >-
              Fleet's Helm upgrade skips crds/, so Fleet never applies a
              changed crds/ directory, and Percona requires the new CRDs
              before the new operator.
          - id: apply-bundle
            description: >-
              Push the regenerated bundle (GitRepo mode) or apply the
              regenerated helmops.yaml (HelmOp mode) and let Fleet reconcile
              it.
            reason: >-
              Each Fleet bundle dependsOn the one before it, so psmdb-operator
              is upgraded before nvsentinel-mongodb's images move.
          - id: verify
            description: >-
              kubectl get perconaservermongodb nvsentinel-mongodb -n
              nvsentinel reports ready.
            reason: >-
              The members restart one at a time; ready means all three rejoined
              on the new images.
      - deployers: [helm]
        steps:
          - id: apply-bundle
            description: >-
              Run install.sh from a bundle generated at the new pins.
            reason: >-
              The bundle's apply-crds.sh applies the new CRDs before the
              operator is upgraded, and psmdb-operator is installed before
              nvsentinel-mongodb.
          - id: verify
            description: >-
              kubectl get perconaservermongodb nvsentinel-mongodb -n
              nvsentinel reports ready.
            reason: >-
              The members restart one at a time; ready means all three rejoined
              on the new images.
      - steps:
          - id: reconcile
            description: >-
              Commit a bundle generated at the new pins, then reconcile or sync
              it.
            reason: >-
              Flux and Argo CD apply the new CRDs themselves, and the bundle's
              ordering upgrades psmdb-operator before nvsentinel-mongodb.
          - id: verify
            description: >-
              kubectl get perconaservermongodb nvsentinel-mongodb -n
              nvsentinel reports ready.
            reason: >-
              The members restart one at a time; ready means all three rejoined
              on the new images.
    references:
      - https://github.com/percona/percona-server-mongodb-operator/releases/tag/v1.23.1
      - https://github.com/percona/k8spsmdb-docs/blob/main/docs/update-operator.md
      - https://github.com/NVIDIA/aicr/blob/main/docs/user/component-catalog.md#graded-remediation
  # Written at chart pin 1.23.1 (operator 1.23.0), describing the next minor
  # above it. stepLimit ends its to at 1.25.0, so a jump over two minors is
  # reported blocked. It lists the 1.23.2 patch boundary because Percona
  # upgrades past patch versions in one step. 1.24 is unreleased. The steps are
  # transcribed from Percona's upgrade docs, which remain the authoritative
  # account, and are re-read against the 1.24 release notes before the bump.
  - from: ">=1.23.0 <1.24.0"
    to: ">=1.24.0"
    skips: ["1.23.2"]
    verdict: manual
    summary: >-
      Percona moves the operator one minor at a time, CRDs before the operator.
      The nvsentinel-mongodb cluster then rolls its members one at a time when
      its crVersion and images move to the same minor, which AICR requires
      (CheckNVSentinelMongoDBCoherent), so both components move in one bundle.
    precondition: >-
      The nvsentinel-mongodb cluster is healthy. Check with `kubectl get
      perconaservermongodb nvsentinel-mongodb -n nvsentinel`; STATUS must be
      ready.
    reversible: false
    affectedResources:
      - group: psmdb.percona.com
        kinds:
          - PerconaServerMongoDB
    stepsByDeployer:
      - deployers: [helmfile]
        steps:
          - id: apply-new-crds
            description: >-
              helm show crds psmdb-operator --repo
              https://percona.github.io/percona-helm-charts/ --version <new> |
              kubectl apply --server-side --force-conflicts -f -
            reason: >-
              helmfile upgrades through Helm, which never applies a changed
              crds/ directory, and Percona requires the new CRDs before the new
              operator.
          - id: apply-bundle
