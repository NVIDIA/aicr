      - deployers: [fleet]
        steps:
          - id: apply-new-crds
            description: >-
              Before applying the regenerated bundle, apply the new CRDs to
              every downstream cluster the bundle targets, using the
              CRD-apply command under "Upgrading components that own CRDs" in
              docs/user/component-catalog.md, with CHART=psmdb-operator,
              REPO=https://percona.github.io/percona-helm-charts/,
              VERSION=<new> and MANAGER set to the manager that section's
              managed-fields check reports for the installed CRDs.
            reason: >-
              Fleet's Helm upgrade skips crds/, so Fleet never applies a
              changed crds/ directory, and Percona requires the new CRDs
              before the new operator.
          - id: apply-bundle
            description: >-
              Push the regenerated bundle (GitRepo mode) or apply the
              regenerated helmops.yaml (HelmOp mode) and let Fleet reconcile
              it.
            reason: >-
              Each Fleet bundle dependsOn the one before it, so psmdb-operator
              is upgraded before nvsentinel-mongodb's crVersion moves.
          - id: verify
            description: >-
              kubectl get perconaservermongodb nvsentinel-mongodb -n
              nvsentinel reports ready.
            reason: >-
              The members restart one at a time; ready means all three rejoined
              on the new images.
      - deployers: [helm]
        steps:
          - id: apply-bundle
            description: >-
              Run install.sh from a bundle generated at the new pins.
            reason: >-
              The bundle's apply-crds.sh applies the new CRDs before the
              operator is upgraded, and psmdb-operator is installed before
              nvsentinel-mongodb.
          - id: verify
            description: >-
