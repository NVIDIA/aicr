              Before applying the regenerated bundle, apply the new CRDs using
              the CRD-apply command under "Upgrading components that own CRDs"
              in docs/user/component-catalog.md, with CHART=psmdb-operator,
              REPO=https://percona.github.io/percona-helm-charts/,
              VERSION=<new> and MANAGER=terraform-provider-helm.
            reason: >-
              helm_release upgrades through Helm, which never applies a changed
              crds/ directory, and Percona requires the new CRDs before the new
              operator.
          - id: apply-bundle
            description: >-
              Regenerate the bundle at the new pins and run terraform apply.
            reason: >-
              The module graph orders psmdb-operator before nvsentinel-mongodb,
              so the operator is upgraded before the cluster's crVersion moves.
          - id: verify
            description: >-
