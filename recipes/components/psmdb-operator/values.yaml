# Percona Operator for MongoDB, installed for NVSentinel's datastore by the
# remediation step mixins. Namespaced: it watches only its release namespace,
# where nvsentinel-mongodb runs.
image:
  repository: docker.io/percona/percona-server-mongodb-operator
  tag: "1.23.1@sha256:78c87b933e184b9af36dbb0078751862c75934c1521c33d3be4d0a38aa58dd0a"
  pullPolicy: IfNotPresent
watchAllNamespaces: false
disableTelemetry: true
