# Knative Operator Helm values (chart v1.23.1)
# Installs the operator that reconciles the KnativeServing resource shipped
# by the knative-serving component. Opt-in: no stock recipe references it.
#
# Chart defaults stand. The chart's top-level key is knative_operator, with
# one block per Deployment (knative-operator and operator-webhook); the
# health check asserts both names.

# No tolerations, unlike most system controllers, and no registry
# nodeScheduling paths. The chart renders no nodeSelector for either
# Deployment, so --system-node-selector cannot pin them, and a toleration of
# every taint would let them land on tainted GPU nodes (seen on a GKE UAT
# cluster). With none, taints keep them off. For a tainted system pool, or
# to pin the Deployments to a pool, override tolerations or affinity for
# each block on the componentRef.
knative_operator:
  knative_operator:
    tolerations: []
  operator_webhook:
    tolerations: []
