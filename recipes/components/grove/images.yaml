# Images this component deploys that no rendered template shows. See
# "Declared Images" in docs/contributor/component.md.
component: grove
charts:
  - repository: oci://ghcr.io/ai-dynamo/grove
    chart: grove-charts
    sourceVersion: v0.1.0-alpha.14
    images:
      - image: ghcr.io/ai-dynamo/grove/grove-initc:v0.1.0-alpha.14
        source: >-
          Init container the operator injects into PodClique pods.
          GROVE_INIT_CONTAINER_IMAGE names the repository and the operator
          appends its own build version as the tag.
