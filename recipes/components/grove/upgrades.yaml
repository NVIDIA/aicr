# Transcribed from "Upgrade Notes" > grove in docs/user/component-catalog.md,
# which remains the prose form of the same migration. This file asserts nothing
# that entry does not already state.
apiVersion: aicr.run/v1beta1
kind: ComponentUpgrades
component: grove
transitions:
  # to is the pin itself rather than a range opening at the release that
  # actually dropped the CRD: AICR only ever pinned alpha.8 and alpha.12, so
  # alpha.12 is the only arrival anyone reached through AICR, and naming a
  # floor below it would claim knowledge of intermediate releases nobody ran.
  - from: "<0.1.0-alpha.12"
    to: "0.1.0-alpha.12"
    verdict: manual
    verifiedBy: >-
      Live end-to-end run on an EKS cluster, 2026-09-02: dynamo-operator,
      grove-operator and kai-scheduler gang scheduling all confirmed healthy
      together after the migration.
    summary: >-
      alpha.12 drops the clustertopologies.grove.io CRD (kind ClusterTopology)
      in favor of clustertopologybindings.grove.io, which reuses the shortname
      ct. helm upgrade never applies changed crds/, so a plain chart bump
      installs neither CRD and the operator crash-loops on no matches for kind
      "ClusterTopologyBinding" regardless of deployer.
    precondition: >-
      No ClusterTopology objects exist in the cluster. Check with
      `kubectl get clustertopologies.grove.io -A`; if any are returned, stop
      and perform an explicit data migration before touching CRDs.
    reversible: false
    affectedResources:
      - group: grove.io
        kinds:
          - ClusterTopology
    stepsByDeployer:
      - deployers: [helm, helmfile]
        steps:
          - id: delete-legacy-crd
            description: >-
              kubectl delete crd clustertopologies.grove.io
            reason: >-
              The new CRD reuses shortname ct, so applying it while the
              obsolete one still exists blocks it from ever reaching
              Established.
          - id: apply-new-crds
            description: >-
              helm show crds oci://ghcr.io/ai-dynamo/grove/grove-charts
              --version v0.1.0-alpha.12 | sed -n '/^---$/,$p' |
              kubectl apply --server-side --force-conflicts -f -
            reason: >-
              Reads the CRDs straight from the chart, so it needs no local
              checkout and runs from any directory.
          - id: rerun-installer
            description: >-
              Re-run install.sh (helm) or helmfile apply (helmfile).
            reason: >-
              AICR's generated install.sh already passes --force-conflicts on
              Helm 4.
      - steps:
          - id: delete-legacy-crd
            description: >-
              kubectl delete crd clustertopologies.grove.io
            reason: >-
              The new CRD reuses shortname ct, so applying it while the
              obsolete one still exists blocks it from ever reaching
              Established.
          - id: apply-new-crds
            description: >-
              helm show crds oci://ghcr.io/ai-dynamo/grove/grove-charts
              --version v0.1.0-alpha.12 | sed -n '/^---$/,$p' |
              kubectl apply --server-side --force-conflicts -f -
            reason: >-
              Neither Flux nor Argo CD applies a changed crds/ directory on
              upgrade, so the CRDs are installed out of band here too.
          - id: reconcile
            description: >-
              Reconcile or sync the affected releases as usual.
            reason: >-
              The deployer picks the new chart up once the CRDs are
              Established.
    references:
      - https://github.com/NVIDIA/aicr/blob/main/docs/user/component-catalog.md#grove-v010-alpha8-or-earlier-to-v010-alpha12
      - https://github.com/ai-dynamo/grove
