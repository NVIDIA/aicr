# Transcribed from "Upgrade Notes" > grove in docs/user/component-catalog.md,
# which remains the prose form of the same migration. This file asserts nothing
# that entry does not already state.
apiVersion: aicr.run/v1beta1
kind: ComponentUpgrades
component: grove
transitions:
  # to is the pin itself rather than a range opening at the release that
  # actually dropped the CRD: AICR only ever pinned alpha.8 and alpha.12, so
  # alpha.12 is the only arrival anyone reached through AICR, and naming a
  # floor below it would claim knowledge of intermediate releases nobody ran.
  - from: "<0.1.0-alpha.12"
    to: "0.1.0-alpha.12"
    verdict: manual
    verifiedBy: >-
      Live end-to-end run on an EKS cluster, 2026-09-02: dynamo-operator,
      grove-operator and kai-scheduler gang scheduling all confirmed healthy
      together after the migration.
    summary: >-
      alpha.12 drops the clustertopologies.grove.io CRD (kind ClusterTopology)
      in favor of clustertopologybindings.grove.io, which reuses the shortname
      ct. helm upgrade never applies changed crds/, so a plain chart bump
      installs neither CRD and the operator crash-loops on no matches for kind
      "ClusterTopologyBinding" regardless of deployer.
    precondition: >-
      No ClusterTopology objects exist in the cluster. Check with
      `kubectl get clustertopologies.grove.io -A`; if any are returned, stop
      and perform an explicit data migration before touching CRDs.
    reversible: false
    affectedResources:
      - group: grove.io
        kinds:
          - ClusterTopology
    stepsByDeployer:
      - deployers: [helm, helmfile]
        steps:
          - id: delete-legacy-crd
            description: >-
              kubectl delete crd clustertopologies.grove.io
            reason: >-
              The new CRD reuses shortname ct, so applying it while the
              obsolete one still exists blocks it from ever reaching
              Established.
          - id: apply-new-crds
            description: >-
              helm show crds oci://ghcr.io/ai-dynamo/grove/grove-charts
              --version v0.1.0-alpha.12 | sed -n '/^---$/,$p' |
              kubectl apply --server-side --force-conflicts -f -
            reason: >-
              Reads the CRDs straight from the chart, so it needs no local
              checkout and runs from any directory.
          - id: apply
            description: >-
              Re-run install.sh (helm) or helmfile apply (helmfile).
            reason: >-
              AICR's generated install.sh already passes --force-conflicts on
              Helm 4.
      - deployers: [terraform]
        steps:
          - id: delete-legacy-crd
            description: >-
              kubectl delete crd clustertopologies.grove.io
            reason: >-
              The new CRD reuses shortname ct, so applying it while the
              obsolete one still exists blocks it from ever reaching
              Established.
          - id: apply-new-crds
            description: >-
              Apply the alpha.12 CRDs with the CRD-apply command under
              "Upgrading components that own CRDs" in
              docs/user/component-catalog.md, with
              CHART=oci://ghcr.io/ai-dynamo/grove/grove-charts,
              VERSION=v0.1.0-alpha.12 and MANAGER=terraform-provider-helm.
            reason: >-
              helm_release upgrades through Helm, which never applies a
              changed crds/ directory. The command reads the CRDs from the
              chart archive rather than filtering helm show crds output,
              whose document separators differ between Helm 3 and 4, and
              applies them as manager terraform-provider-helm, the manager
              the provider installed them under.
          - id: apply
            description: >-
              Regenerate the bundle at the new pin and run terraform apply.
            reason: >-
              The release picks the new chart up once the CRDs are
              Established.
      - steps:
          - id: delete-legacy-crd
            description: >-
              kubectl delete crd clustertopologies.grove.io
            reason: >-
              The new CRD reuses shortname ct, so applying it while the
              obsolete one still exists blocks it from ever reaching
              Established.
          - id: apply-new-crds
            description: >-
              helm show crds oci://ghcr.io/ai-dynamo/grove/grove-charts
              --version v0.1.0-alpha.12 | sed -n '/^---$/,$p' |
              kubectl apply --server-side --force-conflicts -f -
            reason: >-
              Neither Flux, Argo CD, nor Fleet applies a changed crds/
              directory on upgrade, so the CRDs are installed out of band
              here too.
          - id: apply
            description: >-
              Reconcile or sync the affected releases as usual.
            reason: >-
              The deployer picks the new chart up once the CRDs are
              Established.
    references:
      - https://github.com/NVIDIA/aicr/blob/main/docs/user/component-catalog.md#grove-v010-alpha8-or-earlier-to-v010-alpha12
      - https://github.com/ai-dynamo/grove
  - from: ">=0.1.0-alpha.12 <0.1.0-alpha.13"
    to: "0.1.0-alpha.13"
    verdict: manual
    verifiedBy: >-
      Live upgrade on an EKS GB300 cluster, 2026-09-28, following the helm
      steps below: the CRDs applied and the operator rolled out, a serving
      Dynamo DGD kept its pods (same UIDs, no restarts), a PodCliqueSet wedged
      by a 1 -> 0 -> 1 scale on alpha.12 recovered on its own, and a fresh
      1 -> 0 -> 1 scale recovered in about 13s. Upstream
      Test_VUPG1_UpgradeFromLatestGitHubRelease asserts the same pod survival.
    summary: >-
      alpha.13 adds status.lastScheduled to the podcliques.grove.io CRD, which
      its PodGang recovery logic reads, and renames the
      clustertopologybindings.grove.io short name from ct to ctb. helm upgrade
      never applies changed crds/, and the alpha.12 PodClique status schema is
      structural, so a plain chart bump keeps the old CRD and the API server
      silently prunes lastScheduled from every status write.
    stepsByDeployer:
      - deployers: [helm, helmfile]
        steps:
          - id: apply-new-crds
            description: >-
              helm show crds oci://ghcr.io/ai-dynamo/grove/grove-charts
              --version v0.1.0-alpha.13 | sed -n '/^---$/,$p' |
              kubectl apply --server-side --force-conflicts -f -
            reason: >-
              Installs the alpha.13 CRDs before the operator that writes
              the new status field starts.
          - id: apply
            description: >-
              Re-run install.sh (helm) or helmfile apply (helmfile).
            reason: >-
              AICR's generated install.sh already passes --force-conflicts on
              Helm 4.
      - deployers: [terraform]
        steps:
          - id: apply-new-crds
            description: >-
              Apply the alpha.13 CRDs with the CRD-apply command under
              "Upgrading components that own CRDs" in
              docs/user/component-catalog.md, with
              CHART=oci://ghcr.io/ai-dynamo/grove/grove-charts,
              VERSION=v0.1.0-alpha.13 and MANAGER=terraform-provider-helm.
            reason: >-
              Installs the alpha.13 CRDs before the operator that writes
              the new status field starts. The command reads the CRDs from
              the chart archive rather than filtering helm show crds output,
              whose document separators differ between Helm 3 and 4, and
              applies them as manager terraform-provider-helm, the manager
              the provider installed them under.
          - id: apply
            description: >-
              Regenerate the bundle at the new pin and run terraform apply.
            reason: >-
              The release picks the new chart up once the CRDs are
              Established.
      - steps:
          - id: apply-new-crds
            description: >-
              helm show crds oci://ghcr.io/ai-dynamo/grove/grove-charts
              --version v0.1.0-alpha.13 | sed -n '/^---$/,$p' |
              kubectl apply --server-side --force-conflicts -f -
            reason: >-
              Neither Flux, Argo CD, nor Fleet applies a changed crds/
              directory on upgrade, so the CRDs are installed out of band
              here too.
          - id: apply
            description: >-
              Reconcile or sync the affected releases as usual.
            reason: >-
              The deployer picks the new chart up once the CRDs are
              Established.
    references:
      - https://github.com/NVIDIA/aicr/blob/main/docs/user/component-catalog.md#grove-v010-alpha12-to-v010-alpha13
      - https://github.com/ai-dynamo/grove/releases/tag/v0.1.0-alpha.13
      - https://github.com/ai-dynamo/grove/issues/809
  - from: ">=0.1.0-alpha.13 <0.1.0-alpha.14"
    to: "0.1.0-alpha.14"
    verdict: manual
    summary: >-
      alpha.14 drops anchorIndex from podgangmaps entries, and with it the
      alpha.13 CRD's CEL rule that every Anchor entry carry one. helm upgrade
      never applies changed crds/, so a plain chart bump keeps that rule, the
      API server rejects every Anchor-entry PodGangMap write from the alpha.14
      operator, and PodCliqueSets stop progressing. The same skipped apply
      silently prunes the new status fields alpha.14 writes on podcliques,
      podcliquescalinggroups and podcliquesets. dynamo-platform 1.6 refuses to
      install or upgrade until a grove-operator image at alpha.14 or later has
      finished rolling out.
    stepsByDeployer:
      - deployers: [helm, helmfile]
        steps:
          - id: apply-new-crds
            description: >-
              helm show crds oci://ghcr.io/ai-dynamo/grove/grove-charts
              --version v0.1.0-alpha.14 | sed -n '/^---$/,$p' |
              kubectl apply --server-side --force-conflicts -f -
            reason: >-
              Installs the alpha.14 CRDs before the operator that writes the
              new status fields starts.
          - id: apply
            description: >-
              Re-run deploy.sh (helm) or helmfile apply (helmfile). If you
              re-run per-component install.sh scripts by hand instead, run
              grove's, wait for the grove-operator rollout to finish, then run
              dynamo-platform's.
            reason: >-
              AICR's generated install.sh already passes --force-conflicts on
              Helm 4. deploy.sh waits for grove's release (helm --wait) before
              installing dynamo-platform, unless run with --no-wait, so the
              rollout completes before dynamo-platform's preflight checks it.
              A per-component install.sh installs only its own release, and
              waits only when deploy.sh asks it to.
      - deployers: [terraform]
        steps:
          - id: apply-new-crds
            description: >-
              Apply the alpha.14 CRDs with the CRD-apply command under
              "Upgrading components that own CRDs" in
              docs/user/component-catalog.md, with
              CHART=oci://ghcr.io/ai-dynamo/grove/grove-charts,
              VERSION=v0.1.0-alpha.14 and MANAGER=terraform-provider-helm.
            reason: >-
              Installs the alpha.14 CRDs before the operator that writes the
              new status fields starts. The command reads the CRDs from the
              chart archive rather than filtering helm show crds output, whose
              document separators differ between Helm 3 and 4, and applies
              them as manager terraform-provider-helm, the manager the
              provider installed them under.
          - id: apply
            description: >-
              Regenerate the bundle at the new pin and run terraform apply.
            reason: >-
              The release picks the new chart up once the CRDs are
              Established.
      - steps:
          - id: apply-new-crds
            description: >-
              helm show crds oci://ghcr.io/ai-dynamo/grove/grove-charts
              --version v0.1.0-alpha.14 | sed -n '/^---$/,$p' |
              kubectl apply --server-side --force-conflicts -f -
            reason: >-
              Neither Flux, Argo CD, nor Fleet applies a changed crds/
              directory on upgrade, so the CRDs are installed out of band
              here too.
          - id: apply
            description: >-
              Reconcile or sync grove and wait for the grove-operator rollout
              to finish before reconciling dynamo-platform.
            reason: >-
              dynamo-platform 1.6's pre-upgrade check fails while grove is
              still rolling out.
    references:
      - https://github.com/NVIDIA/aicr/blob/main/docs/user/component-catalog.md#grove-v010-alpha13-to-v010-alpha14
      - https://github.com/ai-dynamo/grove/releases/tag/v0.1.0-alpha.14
  - from: ">=0.1.0-alpha.14 <0.1.0-alpha.17"
    to: "0.1.0-alpha.17"
    verdict: manual
    summary: >-
      alpha.17 adds status.scalingProgress to the podcliquesets CRD, where
      the operator records which replica indices a scale-in or scale-out has
      selected. helm upgrade never applies changed crds/, so a plain chart
      bump leaves the alpha.14 schema in place and the API server silently
      prunes that field: availability-aware scale-in then loses its persisted
      selection and can reuse a replica index before its resources are gone.
      The 6 CRDs keep v1alpha1 and gain nothing else. A PodCliqueSet
      scheduled through grove's kueue backend must now carry
      kueue.x-k8s.io/queue-name and cannot change it; without the label it
      already failed to sync. alpha.17 is the last alpha: v0.2.0-beta1 moves
      CRD storage to grove.io/v1beta1.
    stepsByDeployer:
      - deployers: [helm, helmfile]
        steps:
          - id: apply-new-crds
            description: >-
              helm show crds oci://ghcr.io/ai-dynamo/grove/grove-charts
              --version v0.1.0-alpha.17 | sed -n '/^---$/,$p' |
              kubectl apply --server-side --force-conflicts -f -
            reason: >-
              Installs the alpha.17 CRDs before the operator that writes
              status.scalingProgress starts.
          - id: apply
            description: >-
              Re-run deploy.sh (helm) or helmfile apply (helmfile). If you
              re-run per-component install.sh scripts by hand instead, run
              grove's and wait for the grove-operator rollout to finish before
              dynamo-platform's.
            reason: >-
              Moves grove to alpha.17 once the new CRDs are Established.
      - deployers: [terraform]
        steps:
          - id: apply-new-crds
            description: >-
              Apply the alpha.17 CRDs with the CRD-apply command under
              "Upgrading components that own CRDs" in
              docs/user/component-catalog.md, with
              CHART=oci://ghcr.io/ai-dynamo/grove/grove-charts,
              VERSION=v0.1.0-alpha.17 and MANAGER=terraform-provider-helm.
            reason: >-
              Installs the alpha.17 CRDs before the operator that writes
              status.scalingProgress starts, as the manager the provider
              installed them under.
          - id: apply
            description: >-
              Regenerate the bundle at the new pin and run terraform apply.
            reason: >-
              The release picks the new chart up once the CRDs are
              Established.
      - steps:
          - id: apply-new-crds
            description: >-
              helm show crds oci://ghcr.io/ai-dynamo/grove/grove-charts
              --version v0.1.0-alpha.17 | sed -n '/^---$/,$p' |
              kubectl apply --server-side --force-conflicts -f -
            reason: >-
              Neither Flux, Argo CD, nor Fleet applies a changed crds/
              directory on upgrade, so the CRDs are installed out of band
              here too.
          - id: apply
            description: >-
              Reconcile or sync grove and wait for the grove-operator rollout
              to finish before reconciling dynamo-platform.
            reason: >-
              Moves grove to alpha.17 once the new CRDs are Established.
    references:
      - https://github.com/ai-dynamo/grove/releases/tag/v0.1.0-alpha.15
      - https://github.com/ai-dynamo/grove/releases/tag/v0.1.0-alpha.16
      - https://github.com/ai-dynamo/grove/releases/tag/v0.1.0-alpha.17
      - https://github.com/ai-dynamo/grove/pull/896
