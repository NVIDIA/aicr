# The connection URI NVSentinel reads through global.datastore.credentialsFromSecret.
# It carries no credentials: NVSentinel authenticates with the x509 client
# certificate and adds TLS and MONGODB-X509 auth itself.
apiVersion: v1
kind: Secret
metadata:
  name: nvsentinel-mongodb-uri
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  MONGODB_URI: "mongodb://nvsentinel-mongodb-rs0.{{ .Release.Namespace }}.svc.cluster.local:27017/?replicaSet=rs0"
