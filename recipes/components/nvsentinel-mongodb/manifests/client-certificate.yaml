# NVSentinel's x509 client identity. The subject must match the $external
# user in this component's values.yaml, and the Issuer is the one
# psmdb-operator creates for the cluster resource (<name>-psmdb-issuer), as
# NVSentinel's embedded Percona path does. cert-manager retries until the
# operator has created it.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nvsentinel-mongodb-app-client
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  secretName: nvsentinel-mongodb-app-client
  duration: 8760h
  renewBefore: 360h
  commonName: mongo-user-client
  subject:
    organizations:
      - Nvidia
    organizationalUnits:
      - DGXC
    localities:
      - SantaClara
    provinces:
      - California
    countries:
      - US
  usages:
    - client auth
    - digital signature
    - key encipherment
  issuerRef:
    name: nvsentinel-mongodb-psmdb-issuer
    kind: Issuer
    group: cert-manager.io
