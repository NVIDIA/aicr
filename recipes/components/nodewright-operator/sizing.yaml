# Node-count memory tiers (ADR-030), per manager replica. Derivation rules
# and how to refine a tier: docs/contributor/component-sizing.md.
#
# The manager's working set tracks pods and retained Jobs as much as GPU
# nodes: every tier's limit comes from a 670-node, 21.7k-pod reading, so a
# cluster with more total nodes or pods than that should override.
apiVersion: aicr.run/v1beta1
kind: ComponentSizing
basis: gpuNodes
resources:
  - path: controllerManager.manager.resources
    tiers:
      - maxNodes: 250
        requests: {memory: 2000Mi}
        limits: {memory: 3Gi}
        measurements:
          - sets: []
            kind: windowed
            window: 24h
            gpuNodes: 244
            nodes: 249
            pods: 11029
            max: 1024Mi
            date: 2026-10-14
            ref: https://github.com/NVIDIA/aicr/issues/3214#issuecomment-6172508390
          - sets: [requests]
            kind: instantaneous
            gpuNodes: 118
            nodes: 436
            pods: 18156
            max: 1859Mi
            truncatedAt: 2Gi
            date: 2026-10-13
            ref: https://github.com/NVIDIA/aicr/issues/3214#issuecomment-6159722344
          - sets: [limits]
            kind: windowed
            window: 24h
            gpuNodes: 656
            nodes: 670
            pods: 21700
            p90: 2163Mi
            max: 2287Mi
            date: 2026-11-04
            ref: https://github.com/NVIDIA/aicr/issues/3214#issuecomment-6645492766
      - maxNodes: 450
        requests: {memory: 2000Mi}
        limits: {memory: 3Gi}
        measurements:
          - sets: []
            kind: windowed
            window: 24h
            gpuNodes: 407
            nodes: 417
            pods: 13800
            p90: 1377Mi
            max: 1536Mi
            date: 2026-11-04
            ref: https://github.com/NVIDIA/aicr/issues/3214#issuecomment-6645492766
          - sets: [requests]
            kind: windowed
            window: 24h
            gpuNodes: 447
            nodes: 453
            pods: 18245
            max: 1868Mi
            truncatedAt: 2Gi
            date: 2026-10-14
            ref: https://github.com/NVIDIA/aicr/issues/3214#issuecomment-6172508390
          - sets: [limits]
            kind: windowed
            window: 24h
            gpuNodes: 656
            nodes: 670
            pods: 21700
            p90: 2163Mi
            max: 2287Mi
            date: 2026-11-04
            ref: https://github.com/NVIDIA/aicr/issues/3214#issuecomment-6645492766
      - maxNodes: 700
        requests: {memory: 2000Mi}
        limits: {memory: 3Gi}
        measurements:
          - sets: [requests, limits]
            kind: windowed
            window: 24h
            gpuNodes: 656
            nodes: 670
            pods: 21700
            p90: 2163Mi
            max: 2287Mi
            date: 2026-11-04
            ref: https://github.com/NVIDIA/aicr/issues/3214#issuecomment-6645492766
      - maxNodes: 2000
