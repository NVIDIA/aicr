# The template node-drainer renders into a DrainRequest for each quarantined
# node: NVSentinel v1.26.0's
# plugins/slinky-drainer/config/drain-template/drain-template-configmap.yaml,
# key drain-template.yaml, byte for byte (commit a5b9e90f).
#
# Stored as binaryData because the template is itself a Go template, full of
# template actions: AICR renders manifests at bundle time and most deployers then render
# the result again through Helm, so no single escaping survives every deployer.
# The kubelet mounts the decoded bytes. TestSlinkyDrainTemplateMatchesUpstream
# pins the decoded content, and TestSlinkyDrainTemplateParsesFaultMessages
# renders and parses it the way node-drainer does.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: slinky-drain-template
  namespace: {{ .Release.Namespace }}
  labels:
    app: slinky-drainer
    app.kubernetes.io/name: slinky-drainer
    app.kubernetes.io/component: drain-template
binaryData:
  drain-template.yaml: 
