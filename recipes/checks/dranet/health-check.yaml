# DraNet DRA network driver health check.
#
# Validates that DraNet is running and healthy in kube-system and has published
# its DeviceClass. The DaemonSet must roll out fully — numberReady ==
# desiredNumberScheduled (with desiredNumberScheduled > 0 to guard against a
# vacuous pass on a 0-node selector). Container-state errors are label-scoped
# because kube-system is a shared namespace.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: dranet-health-check
spec:
  timeouts:
    assert: 5m
  steps:
    - name: validate-daemonset-fully-rolled-out
      try:
        - assert:
            resource:
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: dranet
                namespace: kube-system
              status:
                (desiredNumberScheduled > `0`): true
                (numberReady == desiredNumberScheduled): true
    - name: validate-deviceclass-exists
      try:
        - assert:
            resource:
              apiVersion: resource.k8s.io/v1
              kind: DeviceClass
              metadata:
                name: mlnx-cx9
    - name: validate-all-pods-healthy
      try:
        - error:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                namespace: kube-system
                labels:
                  app.kubernetes.io/name: dranet
              status:
                phase: Pending
        - error:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                namespace: kube-system
                labels:
                  app.kubernetes.io/name: dranet
              status:
                phase: Failed
        - error:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                namespace: kube-system
                labels:
                  app.kubernetes.io/name: dranet
              status:
                phase: Unknown
        - error:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                namespace: kube-system
                labels:
                  app.kubernetes.io/name: dranet
              status:
                ((containerStatuses || `[]`)[?state.waiting.reason == 'CrashLoopBackOff' || state.waiting.reason == 'ImagePullBackOff' || state.waiting.reason == 'ErrImagePull' || state.waiting.reason == 'CreateContainerConfigError'] | length(@) > `0`): true
        - error:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                namespace: kube-system
                labels:
                  app.kubernetes.io/name: dranet
              status:
                ((initContainerStatuses || `[]`)[?state.waiting.reason == 'CrashLoopBackOff' || state.waiting.reason == 'ImagePullBackOff' || state.waiting.reason == 'ErrImagePull' || state.waiting.reason == 'CreateContainerConfigError'] | length(@) > `0`): true
