# k8s-aibom Health Check
#
# Validates the controller and its cluster-scoped configuration. AIBOM
# resources are deliberately not required: a healthy label-gated installation
# legitimately observes zero workloads until a namespace opts in.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: k8s-aibom-health-check
spec:
  timeouts:
    assert: 2m
  steps:
    - name: validate-controller-deployment
      try:
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: k8s-aibom
                namespace: k8s-aibom-system
              # Four independent root-level expressions rather than one
              # conjunction: each failure names the specific condition that
              # was not met. Every status field read here is `omitempty` and
              # therefore absent on a freshly created Deployment, so each
              # defaults to zero — absence must fail, not compare as null.
              #
              # These mirror Kubernetes' own DeploymentComplete predicate
              # (updatedReplicas, replicas, availableReplicas, and
              # observedGeneration all agreeing with spec.replicas), plus a
              # desired-count floor so a scaled-to-zero Deployment cannot
              # satisfy the check by having nothing to run.
              #
              # Each term is load-bearing and none subsumes another:
              #
              #   availableReplicas alone is not a rollout gate — mid-upgrade
              #   it can equal spec.replicas while the OLD ReplicaSet still
              #   owns every available pod.
              #
              #   updatedReplicas counts pods the NEW ReplicaSet created, not
              #   pods that became ready, so it does not close that gap on its
              #   own. With spec.replicas: 1 the default 25% maxUnavailable
              #   rounds to 0, so a stalled upgrade holds the old pod alive and
              #   reaches updatedReplicas=1, availableReplicas=1 (the old pod),
              #   and a current observedGeneration — every other term passing.
              #
              #   status.replicas counts pods across EVERY ReplicaSet, so it is
              #   the only term that sees the leftover second pod (2 != 1) and
              #   fails that stall.
              ((spec.replicas || `0`) > `0`): true
              ((status.replicas || `0`) == spec.replicas): true
              ((status.availableReplicas || `0`) == spec.replicas): true
              ((status.updatedReplicas || `0`) == spec.replicas): true
              ((status.observedGeneration || `0`) == metadata.generation): true
    - name: validate-current-controller-configuration
      try:
        - assert:
            resource:
              apiVersion: aibom.k8saibom.dev/v1alpha1
              kind: AIBOMControllerConfig
              metadata:
                name: default
              # Both the top-level status and the Ready condition must refer
              # to this exact generation. `contains` is a projection over all
              # conditions, so additional condition types cannot disarm it.
              (status.observedGeneration == metadata.generation): true
              (contains((status.conditions || `[]`)[?type == 'Ready' && status == 'True'].observedGeneration, metadata.generation)): true
