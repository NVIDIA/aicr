# The slinky-drainer plugin and what node-drainer needs from it. The component
# exists only where the nvsentinel-slinky-drainer mixin adds it, so these are
# positive asserts: a missing piece fails. node-drainer exits at startup
# without the CRD or the template ConfigMap, and with no plugin running every
# DrainRequest waits forever.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: slinky-drainer-health
spec:
  timeouts:
    assert: 5m
  steps:
    - name: validate-drain-contract
      try:
        - assert:
            resource:
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: drainrequests.nvsentinel.nvidia.com
              status:
                (conditions[?type == 'Established' && status == 'True'] | length(@) > `0`): true
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: slinky-drain-template
                namespace: nvsentinel
              (binaryData."drain-template.yaml" != null): true
    - name: validate-slinky-drainer-rollout
      try:
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: slinky-drainer
                namespace: nvsentinel
              status:
                (availableReplicas > `0`): true
        # Stale-rollout guards, as in the nvsentinel-slurm-drain-monitor check:
        # compared against spec.replicas, which status.replicas lags.
        - error:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: slinky-drainer
                namespace: nvsentinel
              ((status.updatedReplicas || `0`) < (spec.replicas || `1`)): true
        - error:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: slinky-drainer
                namespace: nvsentinel
              ((status.availableReplicas || `0`) < (spec.replicas || `1`)): true
        # Old pods can still be ready while new ones are stuck.
        - error:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: slinky-drainer
                namespace: nvsentinel
              ((status.replicas || `0`) > (status.updatedReplicas || `0`)): true
        - error:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: slinky-drainer
                namespace: nvsentinel
              ((status.observedGeneration || `0`) < metadata.generation): true
