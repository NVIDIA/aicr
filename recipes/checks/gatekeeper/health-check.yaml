# Gatekeeper Health Check
#
# Validates that gatekeeper-controller-manager and gatekeeper-audit are
# running and healthy in the gatekeeper-system namespace. Also asserts
# the two CRDs the chart installs unconditionally in crds/ —
# constrainttemplates.templates.gatekeeper.sh and
# configs.config.gatekeeper.sh — are Established=True (verified against
# chart 3.22.2; re-verify on defaultVersion bump). Guards against
# vacuous pass on empty namespace by asserting both Deployments exist
# with at least one available replica, then asserts no pods are stuck
# in Pending, Failed, or Unknown phases.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: gatekeeper-health-check
spec:
  timeouts:
    assert: 5m
  steps:
    - name: validate-crds-established
      # Verified against chart 3.22.2 (recipes/registry.yaml): rendered
      # `helm template gatekeeper/gatekeeper --version 3.22.2 --include-crds`
      # and confirmed both constrainttemplates.templates.gatekeeper.sh and
      # configs.config.gatekeeper.sh are present (17 CRDs total; the
      # feature-conditional mutation/expansion/external-data CRDs also
      # render under default values, confirming these two unconditional
      # core CRDs are the correct minimal assertion set). Re-verify on
      # defaultVersion bump — tracked systemically in #1948.
      try:
        - assert:
            resource:
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: constrainttemplates.templates.gatekeeper.sh
              status:
                (conditions[?type == 'Established']):
                  - status: "True"
        - assert:
            resource:
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: configs.config.gatekeeper.sh
              status:
                (conditions[?type == 'Established']):
                  - status: "True"
    - name: validate-controller-manager-deployment
      try:
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: gatekeeper-controller-manager
                namespace: gatekeeper-system
              status:
                (availableReplicas > `0`): true
    - name: validate-audit-deployment
      try:
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: gatekeeper-audit
                namespace: gatekeeper-system
              status:
                (availableReplicas > `0`): true
    - name: validate-all-pods-healthy
      try:
        # Assert no pods are in unhealthy phases (Pending / Failed /
        # Unknown) or stuck in Running phase with a known-bad
        # container-waiting reason (CrashLoopBackOff,
        # ImagePullBackOff, ErrImagePull, CreateContainerConfigError).
        # Phase-only filtering misses CrashLoopBackOff because such
        # pods typically remain in Running phase with an unhealthy
        # container.
        - error:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                namespace: gatekeeper-system
              status:
                phase: Pending
        - error:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                namespace: gatekeeper-system
              status:
                phase: Failed
        - error:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                namespace: gatekeeper-system
              status:
                phase: Unknown
        # JMESPath projection (not single-element match): kyverno-json's
        # sliceNode.Assert gates on exact slice length before per-element
        # comparison, so a `containerStatuses: - state: ...` shape only
        # matches single-container pods and silently passes sidecars. Use
        # `containerStatuses[?...] | length(@) > 0` to fire on any
        # container at any index. Parallel initContainerStatuses block
        # below catches init-container failures (invisible to
        # containerStatuses). Per PR #1245 review (@ArangoGutierrez).
        - error:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                namespace: gatekeeper-system
              status:
                ((containerStatuses || `[]`)[?state.waiting.reason == 'CrashLoopBackOff' || state.waiting.reason == 'ImagePullBackOff' || state.waiting.reason == 'ErrImagePull' || state.waiting.reason == 'CreateContainerConfigError'] | length(@) > `0`): true
        - error:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                namespace: gatekeeper-system
              status:
                ((initContainerStatuses || `[]`)[?state.waiting.reason == 'CrashLoopBackOff' || state.waiting.reason == 'ImagePullBackOff' || state.waiting.reason == 'ErrImagePull' || state.waiting.reason == 'CreateContainerConfigError'] | length(@) > `0`): true
