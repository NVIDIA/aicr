# Prometheus Adapter OCP Health Check
#
# Mirrors checks/prometheus-adapter/health-check.yaml. Pod assertions use
# the chart's app.kubernetes.io/name label (stable regardless of release
# name), but the Deployment name below assumes the chart's default
# fullname resolves to "prometheus-adapter-ocp" from the release name —
# confirm against `helm template` output on first deploy and adjust the
# name if the chart's naming helper produces something else.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: prometheus-adapter-ocp-health-check
spec:
  timeouts:
    assert: 5m
  steps:
    - name: validate-deployment-exists
      try:
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: prometheus-adapter-ocp
                namespace: monitoring
              status:
                (availableReplicas > `0`): true
    - name: validate-all-pods-healthy
      try:
        - error:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                namespace: monitoring
                labels:
                  app.kubernetes.io/name: prometheus-adapter
              status:
                phase: Pending
        - error:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                namespace: monitoring
                labels:
                  app.kubernetes.io/name: prometheus-adapter
              status:
                phase: Failed
        - error:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                namespace: monitoring
                labels:
                  app.kubernetes.io/name: prometheus-adapter
              status:
                phase: Unknown
        - error:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                namespace: monitoring
                labels:
                  app.kubernetes.io/name: prometheus-adapter
              status:
                ((containerStatuses || `[]`)[?state.waiting.reason == 'CrashLoopBackOff' || state.waiting.reason == 'ImagePullBackOff' || state.waiting.reason == 'ErrImagePull' || state.waiting.reason == 'CreateContainerConfigError'] | length(@) > `0`): true
