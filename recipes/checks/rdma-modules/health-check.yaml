# rdma-modules Health Check
#
# Asserts the rdma-modules NodeWright CR reports status.status "complete", i.e.
# rdma_ucm and ib_umad are loaded on every matching node. Named, unlike the
# nodewright-customizations check: this component renders exactly one CR.
# Suppressed by the deployment validator when the component's values render
# no CR (`--set rdmamodules:enabled=false`), same mechanism as
# nodewright-customizations (nodewrightHealthCheckSuppressed).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: rdma-modules-health-check
spec:
  timeouts:
    assert: 5m
  steps:
    - name: validate-rdma-modules-complete
      try:
        - assert:
            resource:
              apiVersion: nodewright.nvidia.com/v1alpha1
              kind: NodeWright
              metadata:
                name: rdma-modules
              status:
                status: complete
