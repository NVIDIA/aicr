# sriov-ib-networks Health Check
#
# Asserts every SriovNetworkNodeState reports syncStatus "Succeeded": the
# config daemon has created the VFs each SriovNetworkNodePolicy asks for and
# the node is back in service. Unnamed, like the NicClusterPolicy readiness
# gate: one state per selected node, and all of them must have converged.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: sriov-ib-networks-health-check
spec:
  timeouts:
    assert: 10m
  steps:
    - name: validate-sriov-node-states-succeeded
      try:
        - assert:
            resource:
              apiVersion: sriovnetwork.openshift.io/v1
              kind: SriovNetworkNodeState
              status:
                syncStatus: Succeeded
        - error:
            resource:
              apiVersion: sriovnetwork.openshift.io/v1
              kind: SriovNetworkNodeState
              (status.syncStatus != 'Succeeded'): true
