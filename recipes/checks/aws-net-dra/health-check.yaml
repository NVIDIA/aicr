# AWS networking device DRA plugin (RoCE) Health Check
#
# Validates that the AWS networking DRA plugin is running and healthy in the
# kube-system namespace, and that it has published the RoCE DeviceClass. The
# DaemonSet must roll out fully — numberReady == desiredNumberScheduled (with
# desiredNumberScheduled > 0 as a guard against vacuous pass on a 0-node
# selector). Container-state errors (CrashLoopBackOff, ImagePullBackOff,
# ErrImagePull, CreateContainerConfigError) are label-scoped because
# kube-system is a shared namespace. Mirrors recipes/checks/aws-efa.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: aws-net-dra-health-check
spec:
  timeouts:
    assert: 5m
  steps:
    - name: validate-daemonset-fully-rolled-out
      try:
        - assert:
            resource:
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: aws-net-k8s-dra-plugin
                namespace: kube-system
              status:
                (desiredNumberScheduled > `0`): true
                (numberReady == desiredNumberScheduled): true
    - name: validate-roce-deviceclass-exists
      try:
        - assert:
            resource:
              apiVersion: resource.k8s.io/v1
              kind: DeviceClass
              metadata:
                name: roce.networking.k8s.aws
    - name: validate-all-pods-healthy
      try:
        - error:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                namespace: kube-system
                labels:
                  app.kubernetes.io/name: aws-net-k8s-dra-plugin
              status:
                phase: Pending
        - error:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                namespace: kube-system
                labels:
                  app.kubernetes.io/name: aws-net-k8s-dra-plugin
              status:
                phase: Failed
        - error:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                namespace: kube-system
                labels:
                  app.kubernetes.io/name: aws-net-k8s-dra-plugin
              status:
                phase: Unknown
        - error:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                namespace: kube-system
                labels:
                  app.kubernetes.io/name: aws-net-k8s-dra-plugin
              status:
                ((containerStatuses || `[]`)[?state.waiting.reason == 'CrashLoopBackOff' || state.waiting.reason == 'ImagePullBackOff' || state.waiting.reason == 'ErrImagePull' || state.waiting.reason == 'CreateContainerConfigError'] | length(@) > `0`): true
        - error:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                namespace: kube-system
                labels:
                  app.kubernetes.io/name: aws-net-k8s-dra-plugin
              status:
                ((initContainerStatuses || `[]`)[?state.waiting.reason == 'CrashLoopBackOff' || state.waiting.reason == 'ImagePullBackOff' || state.waiting.reason == 'ErrImagePull' || state.waiting.reason == 'CreateContainerConfigError'] | length(@) > `0`): true
