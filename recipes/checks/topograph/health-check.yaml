# topograph Health Check
#
# Validates the Kubernetes-scoped Topograph (k8s engine): the API and
# node-observer Deployments are available and no pod in the topograph
# namespace is failed or stuck. The node-data-broker DaemonSet is not
# asserted because the Kind leaf disables it (dra provider); read-only
# allowlist checks cannot skip a step conditionally.
#
# Node labels are deliberately NOT asserted. Topograph labels nodes
# asynchronously after install, and an unconfigured cloud provider (missing
# IAM) would otherwise fail every dependent component's rollout. The kueue
# health check likewise does not assume labels exist. Deployment names are
# stabilized via fullnameOverride in components/topograph/values.yaml.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: topograph-health-check
spec:
  timeouts:
    assert: 5m
  steps:
    - name: validate-topograph-deployment
      try:
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: topograph
                namespace: topograph
              status:
                (availableReplicas > `0`): true
    - name: validate-node-observer-deployment
      try:
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: topograph-node-observer
                namespace: topograph
              status:
                (availableReplicas > `0`): true
    - name: validate-all-pods-healthy
      try:
        # Assert no pods are in unhealthy phases (Pending / Failed /
        # Unknown) or stuck in Running phase with a known-bad
        # container-waiting reason (CrashLoopBackOff,
        # ImagePullBackOff, ErrImagePull, CreateContainerConfigError).
        # Phase-only filtering misses CrashLoopBackOff because such
        # pods typically remain in Running phase with an unhealthy
        # container.
        - error:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                namespace: topograph
              status:
                phase: Pending
        - error:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                namespace: topograph
              status:
                phase: Failed
        - error:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                namespace: topograph
              status:
                phase: Unknown
        # JMESPath projection (not single-element match): kyverno-json's
        # sliceNode.Assert gates on exact slice length before per-element
        # comparison, so a `containerStatuses: - state: ...` shape only
        # matches single-container pods and silently passes sidecars. Use
        # `containerStatuses[?...] | length(@) > 0` to fire on any
        # container at any index. Parallel initContainerStatuses block
        # below catches init-container failures (invisible to
        # containerStatuses). Per PR #1245 review (@ArangoGutierrez).
        - error:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                namespace: topograph
              status:
                ((containerStatuses || `[]`)[?state.waiting.reason == 'CrashLoopBackOff' || state.waiting.reason == 'ImagePullBackOff' || state.waiting.reason == 'ErrImagePull' || state.waiting.reason == 'CreateContainerConfigError'] | length(@) > `0`): true
        - error:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                namespace: topograph
              status:
                ((initContainerStatuses || `[]`)[?state.waiting.reason == 'CrashLoopBackOff' || state.waiting.reason == 'ImagePullBackOff' || state.waiting.reason == 'ErrImagePull' || state.waiting.reason == 'CreateContainerConfigError'] | length(@) > `0`): true
