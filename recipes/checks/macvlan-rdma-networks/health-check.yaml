# macvlan-rdma-networks Health Check
#
# Asserts every MacvlanNetwork reports state "ready": the Network Operator
# has rendered its NetworkAttachmentDefinition into the network namespace.
# Unnamed, like the NicClusterPolicy readiness gate: one object per rail, and
# all of them must have converged.
# The first step asserts the nv-ipam IPPool CRD is Established: the operator
# creates it while reconciling the NicClusterPolicy, and the pools in this
# component cannot have applied without it.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: macvlan-rdma-networks-health-check
spec:
  timeouts:
    assert: 10m
  steps:
    - name: validate-ippool-crd-established
      try:
        - assert:
            resource:
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: ippools.nv-ipam.nvidia.com
              status:
                (conditions[?type == 'Established' && status == 'True'] | length(@) > `0`): true
    - name: validate-macvlan-networks-ready
      try:
        - assert:
            resource:
              apiVersion: mellanox.com/v1alpha1
              kind: MacvlanNetwork
              status:
                state: ready
        - error:
            resource:
              apiVersion: mellanox.com/v1alpha1
              kind: MacvlanNetwork
              (status.state != 'ready'): true
