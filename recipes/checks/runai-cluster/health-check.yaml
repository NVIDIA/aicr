# Run:ai Cluster Health Check
#
# Validates that the cluster agent stack is running in the runai namespace.
# runai-operator is the top-level controller deployment created by the
# runai-cluster chart's templates/deployment.yaml — its name is fixed,
# not derived from the release name, so it is stable across deployments.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: runai-cluster-health-check
spec:
  timeouts:
    assert: 10m
  steps:
    - name: validate-deployment-exists
      try:
        # Guard against vacuous pass on empty namespace: verify the
        # runai-operator deployment exists and has at least one ready replica.
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: runai-operator
                namespace: runai
              status:
                (availableReplicas > `0`): true
    - name: validate-all-pods-healthy
      try:
        # Assert no pods are in unhealthy phases.
        # Pods must be Running (long-lived) or Succeeded (completed jobs).
        # This catches Pending (init containers, scheduling), Failed, and Unknown.
        - error:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                namespace: runai
              status:
                phase: Pending
        - error:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                namespace: runai
              status:
                phase: Failed
        - error:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                namespace: runai
              status:
                phase: Unknown
