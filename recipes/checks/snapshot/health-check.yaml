# Snapshot Health Check
#
# Validates that Snapshot (GPU checkpoint/restore) is running and healthy in the
# snapshot namespace. Asserts that podsnapshots, podsnapshotcontents and
# snapshotjobs.nvidia.com are Established=True, that the snapshot-operator
# Deployment has every replica available, that the snapshot-agent DaemonSet has
# a ready pod on every node it is scheduled to, and that no pod in the namespace
# is stuck. The names are those chart 0.2.0 renders for a release called
# snapshot; re-verify them on a defaultVersion bump.
#
# Read-only: it does not create a PodSnapshot, so it shows that Snapshot is
# running, not that a checkpoint restores. That proof is a separate validator.
#
# The agent targets GPU nodes only. On a cluster with none, the DaemonSet
# schedules no pods and its assertion passes with none ready; the operator
# Deployment assertion keeps an empty namespace from passing vacuously.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: snapshot-health-check
spec:
  timeouts:
    assert: 5m
  steps:
    - name: validate-crds-established
      try:
        - assert:
            resource:
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: podsnapshots.nvidia.com
              status:
                (conditions[?type == 'Established'] | [0].status): "True"
        - assert:
            resource:
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: podsnapshotcontents.nvidia.com
              status:
                (conditions[?type == 'Established'] | [0].status): "True"
        - assert:
            resource:
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: snapshotjobs.nvidia.com
              status:
                (conditions[?type == 'Established'] | [0].status): "True"

    - name: validate-operator-deployment-ready
      try:
        # Asserting the named Deployment guards against a vacuous pass on an
        # empty namespace, where the pod checks below find nothing.
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: snapshot-operator
                namespace: snapshot
              ((spec.replicas || `0`) > `0`): true
              ((status.availableReplicas || `0`) == spec.replicas): true
              ((status.updatedReplicas || `0`) == spec.replicas): true
              ((status.observedGeneration || `0`) == metadata.generation): true

    - name: validate-agent-daemonset-ready
      try:
        # observedGeneration guards against reading a status the controller has
        # not yet written for this spec: until then desiredNumberScheduled is
        # absent, and the comparison below would pass on a cluster that does
        # have GPU nodes.
        #
        # updatedNumberScheduled is omitted from the status while it is zero,
        # so the fallback literal `0` is compared with an integer field. `==`
        # between that float literal and the integer fails even for 0 and 0, so
        # the update check uses `>=`, which compares numbers whatever their
        # type. Verified on a Kind cluster with no GPU node, where the
        # DaemonSet has no pods to schedule.
        - assert:
            resource:
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: snapshot-agent
                namespace: snapshot
              ((status.observedGeneration || `0`) == metadata.generation): true
              ((status.desiredNumberScheduled || `0`) == (status.numberReady || `0`)): true
              ((status.updatedNumberScheduled || `0`) >= (status.desiredNumberScheduled || `0`)): true
              ((status.numberUnavailable || `0`) == `0`): true

    - name: validate-all-pods-healthy
      try:
        # No pod in an unhealthy phase, and none stuck in Running with a
        # known-bad container-waiting reason: phase-only filtering misses
        # CrashLoopBackOff, which keeps the pod in Running. JMESPath
        # projections, not single-element matches, so a pod with sidecars or
        # init containers (the operator's crd-installer) is covered too.
        - error:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                namespace: snapshot
              status:
                phase: Pending
        - error:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                namespace: snapshot
              status:
                phase: Failed
        - error:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                namespace: snapshot
              status:
                phase: Unknown
        - error:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                namespace: snapshot
              status:
                ((containerStatuses || `[]`)[?state.waiting.reason == 'CrashLoopBackOff' || state.waiting.reason == 'ImagePullBackOff' || state.waiting.reason == 'ErrImagePull' || state.waiting.reason == 'CreateContainerConfigError'] | length(@) > `0`): true
        - error:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                namespace: snapshot
              status:
                ((initContainerStatuses || `[]`)[?state.waiting.reason == 'CrashLoopBackOff' || state.waiting.reason == 'ImagePullBackOff' || state.waiting.reason == 'ErrImagePull' || state.waiting.reason == 'CreateContainerConfigError'] | length(@) > `0`): true
