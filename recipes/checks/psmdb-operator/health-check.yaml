# Percona Operator for MongoDB: the operator is up and its CRDs are served.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: psmdb-operator-health
spec:
  timeouts:
    assert: 5m
  steps:
    - try:
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: psmdb-operator
                namespace: nvsentinel
              status:
                (availableReplicas > `0`): true
        - assert:
            resource:
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: perconaservermongodbs.psmdb.percona.com
              status:
                (conditions[?type == 'Established' && status == 'True'] | length(@) > `0`): true
