apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: slurm-accounting-mariadb-health
spec:
  timeouts:
    assert: 5m
  steps:
    - try:
        - assert:
            resource:
              apiVersion: k8s.mariadb.com/v1alpha1
              kind: MariaDB
              metadata:
                name: mariadb
                namespace: slurm
              spec:
                database: slurm_acct_db
                username: slurm
                passwordSecretKeyRef:
                  name: mariadb-password
                  key: password
                  generate: true
                cleanupPolicy: Skip
              status:
                (conditions[?type == 'Ready' && status == 'True'] | length(@) > `0`): true
        - assert:
            resource:
              apiVersion: k8s.mariadb.com/v1alpha1
              kind: User
              metadata:
                name: mariadb-user
                namespace: slurm
              status:
                (conditions[?type == 'Ready' && status == 'True'] | length(@) > `0`): true
        - assert:
            resource:
              apiVersion: k8s.mariadb.com/v1alpha1
              kind: Database
              metadata:
                name: mariadb-database
                namespace: slurm
              status:
                (conditions[?type == 'Ready' && status == 'True'] | length(@) > `0`): true
        - assert:
            resource:
              apiVersion: k8s.mariadb.com/v1alpha1
              kind: Grant
              metadata:
                name: mariadb-user-all
                namespace: slurm
              status:
                (conditions[?type == 'Ready' && status == 'True'] | length(@) > `0`): true
        - assert:
            resource:
              apiVersion: v1
              kind: Secret
              metadata:
                name: mariadb-password
                namespace: slurm
              (keys(data)[?@ == 'password'] | length(@) == `1`): true
        - assert:
            resource:
              apiVersion: v1
              kind: Service
              metadata:
                name: mariadb
                namespace: slurm
