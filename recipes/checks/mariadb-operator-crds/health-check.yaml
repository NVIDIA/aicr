apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: mariadb-operator-crds-health
spec:
  timeouts:
    assert: 5m
  steps:
    - name: validate-mariadb-crd-established
      try:
        - assert:
            resource:
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: mariadbs.k8s.mariadb.com
              status:
                (conditions[?type == 'Established' && status == 'True'] | length(@) > `0`): true
        - assert:
            resource:
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: users.k8s.mariadb.com
              status:
                (conditions[?type == 'Established' && status == 'True'] | length(@) > `0`): true
        - assert:
            resource:
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: databases.k8s.mariadb.com
              status:
                (conditions[?type == 'Established' && status == 'True'] | length(@) > `0`): true
        - assert:
            resource:
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: grants.k8s.mariadb.com
              status:
                (conditions[?type == 'Established' && status == 'True'] | length(@) > `0`): true
