# Cluster Readiness Engine health check.
#
# Asserts the Certification CRD is Established and the manager Deployment
# has an available replica. Chart v0.1.0 renders Deployment nvcre-manager
# in namespace nvcre (nameOverride: nvcre). Re-verify names on defaultVersion bump.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: nvcre-health-check
spec:
  timeouts:
    assert: 5m
  steps:
    - name: validate-certification-crd-established
      try:
        - assert:
            resource:
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: certifications.nvcre.nvidia.com
              status:
                (conditions[?type == 'Established']):
                  - status: "True"
    - name: validate-manager-deployment
      try:
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: nvcre-manager
                namespace: nvcre
              status:
                (availableReplicas > `0`): true
    - name: validate-all-pods-healthy
      try:
        - error:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                namespace: nvcre
              status:
                phase: Pending
        - error:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                namespace: nvcre
              status:
                phase: Failed
        - error:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                namespace: nvcre
              status:
                phase: Unknown
