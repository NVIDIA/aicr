# Fake GPU Operator Health Check
#
# Validates that the fake-gpu-operator stack is running in the gpu-operator
# namespace. The chart deploys to the same namespace as the real GPU
# Operator (they are mutually exclusive). Pods include the device-plugin,
# status-updater, and topology-server.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: fake-gpu-operator-health-check
spec:
  timeouts:
    assert: 5m
  steps:
    - name: validate-all-pods-healthy
      try:
        # Assert no pods are in unhealthy phases.
        # Pods must be Running (long-lived) or Succeeded (completed jobs).
        # This catches Pending (init containers, scheduling), Failed, and Unknown.
        - error:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                namespace: gpu-operator
              status:
                phase: Pending
        - error:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                namespace: gpu-operator
              status:
                phase: Failed
        - error:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                namespace: gpu-operator
              status:
                phase: Unknown
