apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: al2023-toolkit-hardening-health-check
spec:
  timeouts:
    assert: 5m
  steps:
    - name: validate-al2023-toolkit-hardening-complete
      try:
        - assert:
            resource:
              apiVersion: nodewright.nvidia.com/v1alpha1
              kind: NodeWright
              metadata:
                name: toolkit-hardening-al2023
              status:
                status: complete