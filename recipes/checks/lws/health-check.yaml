# LeaderWorkerSet Health Check
#
# Validates that the LWS controller is running and healthy in the
# lws-system namespace. Asserts leaderworkersets.leaderworkerset.x-k8s.io
# is Established=True (verified against chart 0.10.0; re-verify on
# defaultVersion bump), that the lws-controller-manager Deployment has
# every replica available, and that no pod in the namespace is stuck.
#
# Read-only: it does not create a LeaderWorkerSet. ADR-024 puts that
# functional proof in the UAT lane of the first recipe that adopts lws.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: lws-health-check
spec:
  timeouts:
    assert: 5m
  steps:
    - name: validate-crd-established
      try:
        - assert:
            resource:
              apiVersion: apiextensions.k8s.io/v1
              kind: CustomResourceDefinition
              metadata:
                name: leaderworkersets.leaderworkerset.x-k8s.io
              status:
                (conditions[?type == 'Established'] | [0].status): "True"

    - name: validate-controller-deployment-ready
      try:
        # Asserting the named Deployment guards against a vacuous pass on
        # an empty namespace, where the pod checks below find nothing.
        - assert:
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: lws-controller-manager
                namespace: lws-system
              # status.replicas counts old pods too. Requiring it to equal
              # spec.replicas rejects a rollout whose old pod is still serving
              # while its replacement is unready.
              ((spec.replicas || `0`) > `0`): true
              ((status.replicas || `0`) == spec.replicas): true
              ((status.availableReplicas || `0`) == spec.replicas): true
              ((status.updatedReplicas || `0`) == spec.replicas): true
              ((status.observedGeneration || `0`) == metadata.generation): true

    - name: validate-all-pods-healthy
      try:
        - error:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                namespace: lws-system
              status:
                phase: Pending
        - error:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                namespace: lws-system
              status:
                phase: Failed
        - error:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                namespace: lws-system
              status:
                phase: Unknown
        # JMESPath projections, not single-element slice matches: a slice
        # literal matches only pods with exactly that many containers.
        - error:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                namespace: lws-system
              status:
                ((containerStatuses || `[]`)[?state.waiting.reason == 'CrashLoopBackOff' || state.waiting.reason == 'ImagePullBackOff' || state.waiting.reason == 'ErrImagePull' || state.waiting.reason == 'CreateContainerConfigError'] | length(@) > `0`): true
        - error:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                namespace: lws-system
              status:
                ((initContainerStatuses || `[]`)[?state.waiting.reason == 'CrashLoopBackOff' || state.waiting.reason == 'ImagePullBackOff' || state.waiting.reason == 'ErrImagePull' || state.waiting.reason == 'CreateContainerConfigError'] | length(@) > `0`): true
