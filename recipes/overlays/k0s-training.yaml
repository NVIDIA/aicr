kind: RecipeMetadata
apiVersion: aicr.run/v1alpha2
metadata:
  name: k0s-training

spec:
  # Inherits from k0s recipe (k0s-specific settings)
  base: k0s

  # No training-specific component overrides yet.
  # The eks-training layer swaps in a training-optimized gpu-operator values
  # file (values-eks-training.yaml); a k0s equivalent can be added here once
  # training-specific tuning for bare-metal k0s is baselined.
  criteria:
    service: k0s
    intent: training
