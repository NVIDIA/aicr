# Automatically generated directly into source by GKE Version Vector Export Engine.
# Authoritative single source of truth resides in GKE Version Vector registry and GCE SoT.

kind: RecipeMetadata
apiVersion: aicr.run/v1beta1
metadata:
  name: gb200-gke-cos-training-kubeflow

spec:
  # Inherits from gb200-gke-cos-training recipe and layers Kubeflow Training Operator
  base: gb200-gke-cos-training

  criteria:
    service: gke
    accelerator: gb200
    os: cos
    intent: training
    platform: kubeflow

  # DRA floor: multi-node NVLink gets its IMEX channels from an NVIDIA DRA ComputeDomain, and GKE
  # serves the DRA API by default only from 1.34 (1.32 and 1.33 need beta APIs enabled on the
  # cluster). Of the GKE versions the GKE Version Vector registry admits for this platform, the
  # recipe therefore keeps only 1.34 and later:
  #   >= 1.32.8-gke.1108000 < 1.33 || >= 1.33.4-gke.1036000
  # AICR compares the -gke.N build suffix numerically, and ranks "X-gke.N" above bare "X", so an
  # exclusive upper bound at a minor excludes that whole GKE track. Per-branch minimums are
  # expressed as "||" alternatives. Note a compound value cannot participate in profile
  # constraint tightening (it is reported incomparable), so do not add a profile-level
  # K8s.server.version on top of one.
  constraints:
    - name: K8s.server.version
      value: ">= 1.34"

  componentRefs:
    # Kubeflow Training Operator (kubeflow-trainer) for TrainJob support, plus the
    # torch-distributed ClusterTrainingRuntime for PyTorch TrainJobs.
    - name: kubeflow-trainer
      type: Helm
      valuesFile: components/kubeflow-trainer/values.yaml
      manifestFiles:
        - components/kubeflow-trainer/manifests/torch-distributed-cluster-training-runtime.yaml
        # torch-distributed-rdma ships pre-wired for GPUDirect-RDMA over the
        # gvnic-1/rdma-0..3 Network objects. Those names are fixed on every
        # GB200/GKE cluster, so no recipe-recorded interface mapping is
        # required to render it.
        - components/kubeflow-trainer/manifests/torch-distributed-rdma-cluster-training-runtime.yaml
      dependencyRefs:
        - cert-manager
        - kube-prometheus-stack
        - gpu-operator

  validation:
    conformance:
      # Union-merged onto the checks inherited from the training base. robust-controller validates
      # the Kubeflow Trainer only on recipes that resolve kubeflow-trainer, so it is declared here.
      checks:
        - robust-controller
