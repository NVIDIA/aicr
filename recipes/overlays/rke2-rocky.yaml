kind: RecipeMetadata
apiVersion: aicr.run/v1beta1
metadata:
  name: rke2-rocky

spec:
  base: rke2

  # RKE2 on Rocky Linux. The GPU Operator's stock driver container works
  # here: it tags Rocky driver images by major version (rocky9, rocky10),
  # and nvcr.io publishes both for the pinned driver.
  criteria:
    service: rke2
    os: rocky

  mixins:
    - os-rocky

  componentRefs:
    # Toolkit path: the non-NRI path, as in rke2-sles. NVIDIA documents the
    # CDI NRI plugin as experimental, and the rke2 root turns it on only
    # because its leaves so far are Preview. The toolkit registers the
    # nvidia runtime through RKE2's containerd socket (CONTAINERD_SOCKET,
    # never CONTAINERD_CONFIG=config.toml.tmpl, which breaks RKE2 on
    # reboot: NVIDIA/gpu-operator#992). The toolkit's containerd reload
    # restarts the RKE2 agent once at install.
    - name: gpu-operator
      type: Helm
      overrides:
        cdi:
          enabled: true
          nriPluginEnabled: false
        toolkit:
          env:
            - name: CONTAINERD_SOCKET
              value: /run/k3s/containerd/containerd.sock

    # NRI is off on this path, so metadata-collector must not use the NRI
    # plugin mode the rke2 root turns on. It takes the `nvidia` RuntimeClass
    # the toolkit registers instead.
    - name: nvsentinel
      type: Helm
      overrides:
        metadata-collector:
          nriPlugin:
            enabled: false
