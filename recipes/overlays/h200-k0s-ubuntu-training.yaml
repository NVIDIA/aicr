kind: RecipeMetadata
apiVersion: aicr.run/v1beta1
metadata:
  name: h200-k0s-ubuntu-training

spec:
  base: k0s-training

  criteria:
    service: k0s
    accelerator: h200
    os: ubuntu
    intent: training

  constraints:
    - name: K8s.server.version
      value: ">= 1.34"
    - name: OS.release.ID
      value: ubuntu
    - name: OS.release.VERSION_ID
      value: "24.04"

  componentRefs:
    # Host-provided driver posture, validated on a single-node k0s
    # v1.36.3+k0s.0 cluster: 2x H200 NVL attached via PCIe passthrough
    # (KubeVirt guest, Ubuntu 24.04, driver 610.57.04). The posture is
    # identical on physical hosts — the node owns the full device and
    # driver either way. The three settings below move together; AICR's
    # driver-ownership coherence checks fail closed if only one side is
    # set. Same pattern as the vr200-rke2-ubuntu leaves.
    - name: gpu-operator
      type: Helm
      overrides:
        driver:
          enabled: false
        migManager:
          # MIG (re)configuration is disruptive to running workloads and
          # can require draining a node, so it is an explicit opt-in
          # rather than a default this leaf forces on every k0s+H200
          # cluster. Matches the validated reference-cluster state.
          enabled: false

    - name: nvidia-dra-driver-gpu
      type: Helm
      overrides:
        # Host-installed driver userspace lives at the host root — the
        # required counterpart to driver.enabled=false above.
        nvidiaDriverRoot: /

    - name: nvsentinel
      type: Helm
      overrides:
        labeler:
          # With a host-provided driver there is no driver pod for the
          # NVSentinel labeler to observe; without this, several
          # NVSentinel DaemonSets come up with 0 desired pods while the
          # rest of the stack looks healthy.
          assumeDriverInstalled: true
        global:
          metadataCollector:
            # The collector's node selector requires a driver-installed
            # label that never materializes with a host-provided driver,
            # leaving a permanently 0-desired DaemonSet that the
            # expected-resources validator rejects as a forbidden shape
            # (observed on the reference cluster). Same pairing as the
            # vr200-rke2-ubuntu leaves.
            enabled: false

  validation:
    deployment:
      checks:
        - operator-health
        - expected-resources
        - gpu-operator-version
        - check-nvidia-smi
