kind: RecipeMetadata
apiVersion: aicr.run/v1alpha2
metadata:
  name: gb300-eks-ubuntu-inference

spec:
  # Inherits from gb300-eks-inference recipe (GB300 + EKS + inference settings)
  # This overlay adds Ubuntu-specific configurations
  base: gb300-eks-inference

  criteria:
    service: eks
    accelerator: gb300
    os: ubuntu
    intent: inference

  # Ubuntu OS constraints via mixin (defined once in recipes/mixins/os-ubuntu.yaml)
  mixins:
    - os-ubuntu

  # GB300 + EKS specific constraints (not covered by mixin)
  constraints:
    # Multi-node inference across the NVL72 IMEX domain needs the GA
    # resource.k8s.io/v1 DRA API; keep aligned with gb300-eks-inference.
    - name: K8s.server.version
      value: ">= 1.34"

  componentRefs: []

  # Validation is inherited from gb300-eks-inference (not OS-specific)
