# vr200-nvke-ubuntu-training plus Kubeflow Trainer, so this coordinate has a
# leaf that can establish robust_controller.
#
# robust_controller is a v1.36 MUST, and robust_controller_check.go takes its
# subject from the recipe -- kubeflow-trainer, else dynamo-platform, else skip.
# The plain training leaf declares no AI operator, so the check is never
# scheduled and the requirement renders as "not tested", which never
# establishes it. Follows gb200-nvke-ubuntu-training-kubeflow.
kind: RecipeMetadata
apiVersion: aicr.run/v1beta1
metadata:
  name: vr200-nvke-ubuntu-training-kubeflow

spec:
  base: vr200-nvke-ubuntu-training

  criteria:
    service: nvke
    accelerator: vr200
    os: ubuntu
    intent: training
    platform: kubeflow

  # The os-ubuntu mixin is deliberately NOT used, matching the base and
  # vr200-rke2-ubuntu-training-kubeflow: it pins Ubuntu 24.04 / kernel >= 6.8,
  # while VR200 runs Ubuntu 26.04 on the 7.0 arm64 64k-page kernel.
  mixins:
    - platform-kubeflow

  # Restated from the base: snapshot resolution checks a leaf's own
  # constraints. The kernel floor is load-bearing on VR200 -- the generic
  # nvidia-64k kernel brings no GPU up at all.
  constraints:
    - name: K8s.server.version
      value: ">= 1.34"
    - name: OS.release.ID
      value: ubuntu
    - name: OS.release.VERSION_ID
      value: "26.04"
    - name: OS.sysctl./proc/sys/kernel/osrelease
      value: ">= 7.0"

  componentRefs: []

  validation:
    conformance:
      # Union-merged onto the checks the base declares.
      checks:
        - robust-controller
