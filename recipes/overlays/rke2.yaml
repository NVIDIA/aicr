kind: RecipeMetadata
apiVersion: aicr.run/v1beta1
metadata:
  name: rke2

spec:
  # Inherits from base (implicit when spec.base is empty).
  # RKE2 (Rancher Kubernetes Engine 2) provisions only the base platform —
  # Kubernetes control plane, containerd, a bundled CNI (Canal by default;
  # Calico/Cilium/Flannel selectable), CoreDNS, an ingress controller
  # (rke2-ingress-nginx through v1.35; Traefik is the default for new
  # v1.36+ clusters), and metrics-server. The NVIDIA runtime stack
  # (GPU Operator, NFD, cert-manager, Prometheus, DRA driver, etc.) is
  # delivered by AICR via base.yaml, mirroring the `bcm` bare-metal
  # service root.
  #
  # Storage note: RKE2 ships NO StorageClass (unlike k3s, local-path is not
  # bundled). The base kube-prometheus-stack uses emptyDir storage, so
  # nothing here requires a StorageClass.

  criteria:
    service: rke2

  # RKE2-specific constraints
  # Constraint names use fully qualified measurement paths: {type}.{subtype}.{key}
  constraints:
    # >= 1.34.1: first 1.34-line RKE2 release that ships containerd 2.1,
    # required by the GPU Operator CDI/NRI plugin path configured below.
    - name: K8s.server.version
      value: ">= 1.34.1"

  componentRefs:
    # GPU Operator on RKE2 uses CDI with the NRI plugin — current RKE2
    # guidance for gpu-operator (rancher/rke2-docs
    # docs/add-ons/gpu_operators.md): device injection happens over the NRI
    # socket, so the toolkit never rewrites RKE2's containerd
    # config.toml.tmpl and workloads don't need runtimeClassName: nvidia.
    # The legacy toolkit-env path (CONTAINERD_CONFIG=
    # /var/lib/rancher/rke2/agent/etc/containerd/config.toml.tmpl) is known
    # to break RKE2 clusters on reboot (NVIDIA/gpu-operator#992) and forces
    # a containerd SIGHUP that restarts RKE2. NRI needs containerd 2.1
    # (v1.34.1+rke2r1 and later) — enforced by the K8s.server.version floor
    # above. If NRI must be disabled, set nriPluginEnabled: false, add
    # CONTAINERD_SOCKET=/run/k3s/containerd/containerd.sock to the toolkit
    # env, and set nvsentinel's metadata-collector.nriPlugin.enabled: false
    # (the two NRI settings below are paired).
    #
    # Production support boundary: NVIDIA documents CDI+NRI as an
    # experimental GPU Operator feature (not GA, "not recommended for
    # production use"). RKE2's own docs describe it as an available path
    # for gpu-operator on RKE2 (v1.31.13+/v1.32.9+/v1.33.5+/v1.34.1+rke2r1
    # provide the required containerd support) rather than unconditional
    # current guidance — both the NRI and non-NRI (legacy toolkit-env)
    # wirings are documented options. Setting it at this root, rather than
    # per-leaf, is safe today only because every rke2-derived leaf so far
    # is itself Preview (vr200) — if a future accelerator on rke2 needs a
    # validated, non-experimental toolkit path before NRI reaches GA,
    # override nriPluginEnabled: false on that leaf rather than assuming
    # the root default is production-validated for it.
    - name: gpu-operator
      type: Helm
      overrides:
        cdi:
          enabled: true
          nriPluginEnabled: true
        # The NRI plugin injects management CDI devices only into pods in
        # the operator's namespace unless their namespace is listed here.
        # nvsentinel's metadata-collector requests one (below); without
        # this entry the toolkit skips it silently and the collector
        # crash-loops with NVML ERROR_LIBRARY_NOT_FOUND (#3041). The entry
        # lets any pod in that namespace request every GPU on the node, so a
        # bundle that drops nvsentinel (--set nv-sentinel:enabled=false)
        # should drop it too: --set-json 'gpuoperator:toolkit.env=[]'.
        toolkit:
          env:
            - name: NRI_MANAGEMENT_CDI_DEVICE_NAMESPACES
              value: nvsentinel

    # janitor's GPU reset Job requests no RuntimeClass: NRI registers no
    # runtime handler, and the Job sets NVIDIA_VISIBLE_DEVICES=void, so it
    # needs no runtime injection. Inert unless the nvsentinel-remediation
    # mixin enables janitor.
    #
    # metadata-collector gets the driver through the GPU Operator's
    # management CDI device instead of the `nvidia` RuntimeClass, which NRI
    # mode never creates (NVIDIA/NVSentinel#1949, v1.26.0). This works with
    # both a host-installed driver and the operator's driver container. It
    # is paired with the toolkit env above and with nriPluginEnabled: a leaf
    # that turns NRI off must turn this off too.
    - name: nvsentinel
      type: Helm
      overrides:
        metadata-collector:
          nriPlugin:
            enabled: true
        janitor:
          config:
            controllers:
              gpuReset:
                resetJob:
                  runtimeClassName: ""

  # Baseline conformance floor for any recipe resolved at the rke2 service
  # root (mirrors the bcm.yaml bare-metal service root). Leaves extend this
  # with accelerator-specific deployment checks and constraints.
  validation:
    conformance:
      checks:
        - platform-health
        - gpu-operator-health
        - accelerator-metrics
        - ai-service-metrics
