kind: RecipeMetadata
apiVersion: aicr.run/v1alpha2
metadata:
  name: vr200-rke2-ubuntu-training-kubeflow

spec:
  # Inherits every VR200-specific setting from vr200-rke2-ubuntu-training
  # and adds the Kubeflow Trainer platform (TrainJob distributed training)
  # via the platform-kubeflow mixin — mirroring
  # gb200-eks-ubuntu-training-kubeflow. The os-ubuntu mixin is NOT used for
  # the same reason as the base leaf (it pins 24.04; the VR200 reference
  # image runs 26.04 with the Grace/Vera 64k-page kernel).
  base: vr200-rke2-ubuntu-training

  criteria:
    service: rke2
    accelerator: vr200
    os: ubuntu
    intent: training
    platform: kubeflow

  mixins:
    - platform-kubeflow

  componentRefs: []
