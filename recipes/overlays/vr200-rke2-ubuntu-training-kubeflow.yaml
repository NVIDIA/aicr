kind: RecipeMetadata
apiVersion: aicr.run/v1beta1
metadata:
  name: vr200-rke2-ubuntu-training-kubeflow

spec:
  # PREVIEW: inherits the Preview status of vr200-rke2-ubuntu-training — see
  # that overlay for the VR200 caveats (SKU auto-detection, host IMEX
  # conflict, Skyhook reboot sequencing). The Kubeflow path on VR hardware is
  # confirmed by resolution only; kubeflow-trainer has not been exercised on a
  # VR reference cluster.
  #
  # Inherits from vr200-rke2-ubuntu-training recipe (VR200 + RKE2 + Ubuntu + training settings)
  # This overlay adds Kubeflow Trainer for distributed training with TrainJob
  base: vr200-rke2-ubuntu-training

  criteria:
    service: rke2
    accelerator: vr200
    os: ubuntu
    intent: training
    platform: kubeflow

  # The os-ubuntu mixin is deliberately NOT used, for the same reason as the
  # base: it pins Ubuntu 24.04 / kernel >= 6.8, while the Vera Rubin reference
  # image ships Ubuntu 26.04 on the 7.0 arm64 64k-page kernel.
  mixins:
    - platform-kubeflow

  # Kept aligned with vr200-rke2-ubuntu-training so this leaf never weakens
  # the NVL72 DRA/containerd floor.
  constraints:
    - name: K8s.server.version
      value: ">= 1.34.1"

  componentRefs: []

  validation:
    conformance:
      # Union-merged onto the checks inherited from vr200-rke2-ubuntu-training.
      # robust-controller routes to checkRobustKubeflowTrainer only on leaves
      # that resolve kubeflow-trainer, so it is declared here rather than on
      # the plain training base (where it would skip for want of an AI operator).
      checks:
        - robust-controller
