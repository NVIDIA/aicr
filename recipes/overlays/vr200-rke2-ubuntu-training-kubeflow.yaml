kind: RecipeMetadata
apiVersion: aicr.run/v1alpha2
metadata:
  name: vr200-rke2-ubuntu-training-kubeflow

spec:
  # Inherits every VR200-specific setting from vr200-rke2-ubuntu-training and
  # adds the Kubeflow Trainer platform (TrainJob distributed training) via the
  # platform-kubeflow mixin — mirroring gb300-eks-ubuntu-training-kubeflow.
  # The os-ubuntu mixin is deliberately NOT used, for the same reason as the
  # base leaf: it pins VERSION_ID 24.04, while the VR200 reference image runs
  # Ubuntu 26.04 with the Vera arm64 64k-page kernel.
  base: vr200-rke2-ubuntu-training

  criteria:
    service: rke2
    accelerator: vr200
    os: ubuntu
    intent: training
    platform: kubeflow

  mixins:
    - platform-kubeflow

  componentRefs: []

  # robust-controller is scoped to the leaves that actually ship an AI
  # operator. This leaf resolves kubeflow-trainer via the platform mixin, so
  # the check routes to checkRobustKubeflowTrainer and validates the
  # controller Deployment, its validating webhook, the TrainJob CRD, and
  # webhook rejection of an invalid TrainJob. On the plain training and
  # inference leaves it would return Skip ("no supported AI operator found in
  # recipe"), which is why it is declared here and on the inference-dynamo
  # leaf rather than on the shared base.
  #
  # NOT YET EXERCISED ON VR HARDWARE: the routing and the kubeflow namespace
  # agreement are confirmed statically, but nobody has installed
  # kubeflow-trainer into the reference cluster's kubeflow namespace, so the
  # runtime assertions (webhook reachability, TrainJob rejection) are
  # unverified on VR200. Every other check here is inherited from the base
  # leaf and validated there.
  validation:
    conformance:
      checks:
        - robust-controller
