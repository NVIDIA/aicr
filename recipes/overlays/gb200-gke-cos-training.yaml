# Automatically generated directly into source by GKE Version Vector Export Engine.
# Authoritative single source of truth resides in GKE Version Vector registry.

kind: RecipeMetadata
apiVersion: aicr.run/v1beta1
metadata:
  name: gb200-gke-cos-training

spec:
  base: gke-cos-training

  criteria:
    service: gke
    accelerator: gb200
    os: cos
    intent: training

  # DRA floor: multi-node NVLink gets its IMEX channels from an NVIDIA DRA ComputeDomain, and GKE
  # serves the DRA API by default only from 1.34 (1.32 and 1.33 need beta APIs enabled on the
  # cluster). Of the GKE versions the GKE Version Vector registry admits for this platform, the
  # recipe therefore keeps only 1.34 and later:
  #   >= 1.32.8-gke.1108000 < 1.33 || >= 1.33.4-gke.1036000
  # AICR compares the -gke.N build suffix numerically, and ranks "X-gke.N" above bare "X", so an
  # exclusive upper bound at a minor excludes that whole GKE track. Per-branch minimums are
  # expressed as "||" alternatives. Note a compound value cannot participate in profile
  # constraint tightening (it is reported incomparable), so do not add a profile-level
  # K8s.server.version on top of one.
  constraints:
    - name: K8s.server.version
      value: ">= 1.34"

  componentRefs:
    # GKE COS Driver Host Mapping & GPU Operator Alignment:
    # On Container-Optimized OS (COS), NVIDIA GPU drivers are natively host-managed
    # at /home/kubernetes/bin/nvidia (driver.enabled: false and cdi.enabled: true
    # are inherited from base gke-cos).
    - name: gpu-operator
      type: Helm
      dependencyRefs:
        - nfd
        - cert-manager
        - kube-prometheus-stack
        - nodewright-customizations

    # Grace (arm64) partition-gpus image:
    # The gcp-driver-installer default partition-gpus init container image is amd64-only and fails
    # with "exec format error" on arm64 nodes. On arm64, recipes therefore pin the multi-arch image
    # that GKE's own GPU device plugin uses on the highest GKE minor named in the constraint above.
    # Only takes effect under --profile gpuStack=bundle-installer (installer.enabled); a no-op under
    # the gke-default profile.
    - name: gcp-driver-installer
      type: Helm
      overrides:
        partitionGpuImage: "gcr.io/gke-release/nvidia-partition-gpu:v1.34.14-gke.15@sha256:93170563f654ed2a5206c441c0b836a0b73af3beda5dd57c47d6f7128941fdea"

    # GKE A4X (GB200) Multi-NIC RDMA Installer:
    # On GKE A4X (a4x-highgpu-4g), inter-node GPU communication uses GKE multi-networking
    # (gvnic-1 in NetDevice mode plus four ConnectX-7 RoCE NICs rdma-0..rdma-3 in RDMA mode
    # provisioned via Network and GKENetworkParamSet CRs). gke-gb200-rdma deploys the
    # nccl-rdma-installer DaemonSet onto nvidia-gb200 COS nodes to install the arm64
    # NCCL/gIB RDMA plugin into /home/kubernetes/bin/gib and /home/kubernetes/bin/nvidia/lib64.
    # See docs/integrator/gke-gb200-networking.md for cluster networking prerequisites.
    - name: gke-gb200-rdma
      type: Helm
      manifestFiles:
        - components/gke-gb200-rdma/manifests/nccl-gib-installer-arm64.yaml

    # GKE A4X (GB200) MNNVL & NodeWright Tuning:
    # The AICR recipe deploys nvidia-dra-driver-gpu with ComputeDomains enabled (validated via
    # dra-support conformance check) for Multi-Node NVLink (MNNVL) IMEX channels, while
    # NodeWright applies Grace-Blackwell (gb200) host kernel tuning and NFD topologyUpdater
    # exposes NUMA/PCIe topology for multi-NIC RDMA scheduling.
    - name: nodewright-customizations
      type: Helm
      manifestFiles:
        - components/nodewright-customizations/manifests/tuning-gke.yaml
      overrides:
        accelerator: gb200
        intent: multiNodeTraining
      dependencyRefs:
        - nodewright-operator

    - name: nfd
      type: Helm
      overrides:
        topologyUpdater:
          enable: true

  validation:
    deployment:
      checks:
        - operator-health
        - expected-resources
        - gpu-operator-version
        - check-nvidia-smi
      constraints:
        - name: Deployment.gpu-operator.version
          value: ">= v25.10.0"
        # Host driver floor. On COS the GPU driver is installed outside the GPU Operator, by GKE
        # under gpuStack=gke-default or by the bundle's gcp-driver-installer under bundle-installer,
        # so the operator version cannot gate it. check-nvidia-smi compares this with the
        # nvidia-smi banner on each GPU node, and fails rather than skips when no node can be
        # measured (busy or cordoned). The value is the lowest GPU driver minimum the GKE Version
        # Vector registry declares for this platform; the workload leaves inherit it.
        - name: Deployment.gpu-driver.version
          value: ">= 580"
    performance:
      checks:
        - nccl-all-reduce-bw-nvls
      constraints:
        - name: nccl-all-reduce-bw-nvls
          value: ">= 250"
    conformance:
      # robust-controller is declared by the workload leaves, which carry the operator it
      # validates (dynamo-platform or kubeflow-trainer). On this shared base it would only skip.
      checks:
        - platform-health
        - gpu-operator-health
        - dra-support
        - accelerator-metrics
        - ai-service-metrics
        - gang-scheduling
        - pod-autoscaling
        - cluster-autoscaling
        - secure-accelerator-access
