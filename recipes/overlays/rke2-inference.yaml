kind: RecipeMetadata
apiVersion: aicr.run/v1alpha2
metadata:
  name: rke2-inference

spec:
  # Inherits from rke2 recipe (RKE2-specific settings)
  base: rke2

  criteria:
    service: rke2
    intent: inference

  # RKE2's default packaged ingress switches from rke2-ingress-nginx to
  # Traefik at v1.36 ("Ingress NGINX went End-of-Life in March 2026.
  # Starting with v1.36, Traefik will be the default for new clusters." —
  # docs.rke2.io/add-ons/helm). Traefik's own rke2-traefik-crd release
  # owns the Gateway API CRD names this leaf installs below, so a v1.36+
  # default cluster hits the same helm-ownership collision documented on
  # those componentRefs. There is no way to install CRDs conditionally
  # from a static recipe (manifestFiles merge additively and --set cannot
  # remove a componentRef), so for v1 this leaf is capped below the
  # Traefik-default transition rather than silently breaking on it.
  # Revisit once a real conditional/splittable CRD mechanism exists, or
  # once this leaf can assume the operator has disabled RKE2's bundled
  # Traefik release.
  constraints:
    - name: K8s.server.version
      value: ">= 1.34.1 < 1.36.0"

  # Inference gateway components are inlined from the platform-inference
  # mixin rather than referenced, because rke2 additionally needs the
  # TLSRoute experimental-channel CRD the mixin doesn't carry, and an
  # RKE2-specific health-check step. Keep versions in lockstep with
  # recipes/mixins/platform-inference.yaml when bumping.
  #
  # NOTE: RKE2 provisions no LoadBalancer controller, and the
  # inference-gateway Service is type LoadBalancer — a bare-metal LB
  # implementation (e.g. MetalLB or kube-vip) is a cluster prerequisite,
  # the same documented expectation as bcm-inference. Until one exists the
  # gateway is reachable via its NodePort/ClusterIP.
  componentRefs:
    - name: agentgateway-crds
      type: Helm
      source: oci://cr.agentgateway.dev/charts
      version: v2.2.1
      valuesFile: components/agentgateway-crds/values.yaml
      # RKE2-scoped health check: declared INLINE so the TLSRoute v1alpha2
      # served-version gate applies only to rke2 recipes. A
      # checks/agentgateway-crds/health-check.yaml file in this repo would
      # replace the embedded check by path for EVERY recipe using the
      # component (e.g. gb300-eks inference), and non-RKE2 bundles install
      # the standard Gateway API manifest, which has no TLSRoute CRD at
      # all — their validation would fail. Content = the embedded OSS
      # check (CRDs Established) plus the RKE2-specific step asserting
      # tlsroutes exists, is Established, and SERVES v1alpha2 (agentgateway
      # v2.2.1's compiled watch requirement, satisfied by the vendored
      # tlsroute-crd.yaml manifest below on the supported < 1.36 default;
      # a cluster that instead runs RKE2's bundled Traefik hits the
      # documented CRD-ownership conflict, not a served-version gap).
      # DRIFT NOTE: everything above the tlsroute step is a copy of this
      # repo's embedded checks/agentgateway-crds/health-check.yaml. When
      # bumping agentgateway versions, re-diff this whole block against the
      # embedded check (not just the version pins) — otherwise
      # added/removed CRD assertions silently diverge and the rke2 gate
      # weakens without signal.
      healthCheckAsserts: |
        apiVersion: chainsaw.kyverno.io/v1alpha1
        kind: Test
        metadata:
          name: agentgateway-crds-health-check
        spec:
          timeouts:
            assert: 5m
          steps:
            - name: validate-gateway-api-crds-established
              # Standard Gateway API CRDs vendored under
              # manifests/gateway-api-crds.yaml. Verified against the in-tree
              # manifest content.
              try:
                - assert:
                    resource:
                      apiVersion: apiextensions.k8s.io/v1
                      kind: CustomResourceDefinition
                      metadata:
                        name: gatewayclasses.gateway.networking.k8s.io
                      status:
                        (conditions[?type == 'Established']):
                          - status: "True"
                - assert:
                    resource:
                      apiVersion: apiextensions.k8s.io/v1
                      kind: CustomResourceDefinition
                      metadata:
                        name: gateways.gateway.networking.k8s.io
                      status:
                        (conditions[?type == 'Established']):
                          - status: "True"
                - assert:
                    resource:
                      apiVersion: apiextensions.k8s.io/v1
                      kind: CustomResourceDefinition
                      metadata:
                        name: grpcroutes.gateway.networking.k8s.io
                      status:
                        (conditions[?type == 'Established']):
                          - status: "True"
                - assert:
                    resource:
                      apiVersion: apiextensions.k8s.io/v1
                      kind: CustomResourceDefinition
                      metadata:
                        name: httproutes.gateway.networking.k8s.io
                      status:
                        (conditions[?type == 'Established']):
                          - status: "True"
                - assert:
                    resource:
                      apiVersion: apiextensions.k8s.io/v1
                      kind: CustomResourceDefinition
                      metadata:
                        name: referencegrants.gateway.networking.k8s.io
                      status:
                        (conditions[?type == 'Established']):
                          - status: "True"
            - name: validate-agentgateway-crds-established
              # agentgateway.dev/v1alpha1 CRDs installed by the
              # agentgateway-crds Helm chart itself (not RKE2-specific —
              # carried over unchanged from the embedded check).
              try:
                - assert:
                    resource:
                      apiVersion: apiextensions.k8s.io/v1
                      kind: CustomResourceDefinition
                      metadata:
                        name: agentgatewaybackends.agentgateway.dev
                      status:
                        (conditions[?type == 'Established']):
                          - status: "True"
                - assert:
                    resource:
                      apiVersion: apiextensions.k8s.io/v1
                      kind: CustomResourceDefinition
                      metadata:
                        name: agentgatewayparameters.agentgateway.dev
                      status:
                        (conditions[?type == 'Established']):
                          - status: "True"
                - assert:
                    resource:
                      apiVersion: apiextensions.k8s.io/v1
                      kind: CustomResourceDefinition
                      metadata:
                        name: agentgatewaypolicies.agentgateway.dev
                      status:
                        (conditions[?type == 'Established']):
                          - status: "True"
            - name: validate-inference-extension-crds-established
              # Gateway API Inference Extension CRDs vendored under
              # manifests/inference-extension-crds.yaml.
              try:
                - assert:
                    resource:
                      apiVersion: apiextensions.k8s.io/v1
                      kind: CustomResourceDefinition
                      metadata:
                        name: inferencemodelrewrites.inference.networking.x-k8s.io
                      status:
                        (conditions[?type == 'Established']):
                          - status: "True"
                - assert:
                    resource:
                      apiVersion: apiextensions.k8s.io/v1
                      kind: CustomResourceDefinition
                      metadata:
                        name: inferenceobjectives.inference.networking.x-k8s.io
                      status:
                        (conditions[?type == 'Established']):
                          - status: "True"
                - assert:
                    resource:
                      apiVersion: apiextensions.k8s.io/v1
                      kind: CustomResourceDefinition
                      metadata:
                        name: inferencepoolimports.inference.networking.x-k8s.io
                      status:
                        (conditions[?type == 'Established']):
                          - status: "True"
                - assert:
                    resource:
                      apiVersion: apiextensions.k8s.io/v1
                      kind: CustomResourceDefinition
                      metadata:
                        name: inferencepools.inference.networking.k8s.io
                      status:
                        (conditions[?type == 'Established']):
                          - status: "True"
                - assert:
                    resource:
                      apiVersion: apiextensions.k8s.io/v1
                      kind: CustomResourceDefinition
                      metadata:
                        name: inferencepools.inference.networking.x-k8s.io
                      status:
                        (conditions[?type == 'Established']):
                          - status: "True"
            - name: validate-tlsroute-v1alpha2-served
              # agentgateway v2.2.1 (Gateway API v1.2.x client) watches TLSRoute
              # v1alpha2. The CRD must exist AND serve v1alpha2 (projection must
              # match exactly one served entry).
              try:
                - assert:
                    resource:
                      apiVersion: apiextensions.k8s.io/v1
                      kind: CustomResourceDefinition
                      metadata:
                        name: tlsroutes.gateway.networking.k8s.io
                      spec:
                        (versions[?name == 'v1alpha2' && served]):
                          - name: v1alpha2
                      status:
                        (conditions[?type == 'Established']):
                          - status: "True"
      manifestFiles:
        # gateway-api-crds.yaml (standard channel: GatewayClass, Gateway,
        # GRPCRoute, HTTPRoute, ReferenceGrant) and tlsroute-crd.yaml (the
        # single TLSRoute CRD from the experimental channel, which the
        # standard bundle omits) are both installed here — RKE2's default
        # packaged ingress is rke2-ingress-nginx (through the rke2 root's
        # K8s.server.version >= 1.34.1 floor; Traefik becomes default only
        # at RKE2 v1.36+), so nothing else on a default cluster provides
        # any of these CRDs. agentgateway v2.2.1 compiles its watch against
        # Gateway API v1.2.x and additionally needs TLSRoute served at
        # v1alpha2, which tlsroute-crd.yaml provides directly rather than
        # depending on a bundled Traefik release for it.
        #
        # KNOWN CONFLICT: if the cluster instead runs RKE2's bundled
        # rke2-traefik-crd Helm release (opt-in before v1.36, default at
        # v1.36+ — see the K8s.server.version constraint above, which
        # caps this leaf below that transition for exactly this reason),
        # it already owns these CRD names and installing AICR's copies
        # fails helm ownership validation ("invalid ownership metadata
        # ... current value is rke2-traefik-crd"). manifestFiles merge
        # additively and cannot be subtracted by an overlay or --set, so
        # there is no supported way to opt out of these two manifests on
        # a Traefik-default cluster today — the version constraint is
        # what prevents reaching that state, not a runtime toggle.
        - components/agentgateway-crds/manifests/gateway-api-crds.yaml
        - components/agentgateway-crds/manifests/tlsroute-crd.yaml
        - components/agentgateway-crds/manifests/inference-extension-crds.yaml

    - name: agentgateway
      type: Helm
      source: oci://cr.agentgateway.dev/charts
      version: v2.2.1
      valuesFile: components/agentgateway/values.yaml
      manifestFiles:
        - components/agentgateway/manifests/inference-gateway.yaml
      dependencyRefs:
        - agentgateway-crds
        - cert-manager
