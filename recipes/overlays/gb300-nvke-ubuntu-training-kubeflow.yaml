# gb300-nvke-ubuntu-training plus Kubeflow Trainer: the leaf that carries an AI
# operator, so robust-controller has a subject. Follows
# vr200-nvke-ubuntu-training-kubeflow.
kind: RecipeMetadata
apiVersion: aicr.run/v1beta1
metadata:
  name: gb300-nvke-ubuntu-training-kubeflow

spec:
  base: gb300-nvke-ubuntu-training

  criteria:
    service: nvke
    accelerator: gb300
    os: ubuntu
    intent: training
    platform: kubeflow

  # The os-ubuntu mixin is deliberately NOT used, matching the base: it pins
  # Ubuntu 24.04 / kernel >= 6.8, while GB300 on NVKE runs Ubuntu 26.04 on the
  # 7.0 arm64 64k-page kernel.
  mixins:
    - platform-kubeflow

  # Restated from the base: snapshot resolution checks a leaf's own
  # constraints.
  constraints:
    - name: K8s.server.version
      value: ">= 1.34"
    - name: OS.release.ID
      value: ubuntu
    - name: OS.release.VERSION_ID
      value: "26.04"
    - name: OS.sysctl./proc/sys/kernel/osrelease
      value: ">= 7.0"

  componentRefs: []

  validation:
    conformance:
      # Union-merged onto the checks the base declares.
      checks:
        - robust-controller
