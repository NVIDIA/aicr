# Run:ai Control Plane on Kind with the fake GPU Operator.
#
# Minimal-delta leaf overlay used for local development:
#   * Inherits everything from `kind` (which inherits `base`)
#   * Swaps the real gpu-operator out for the fake-gpu-operator
#   * Adds runai-control-plane on top
#   * Disables base components that assume real GPU hardware or conflict
#     with the Run:ai stack (kai-scheduler conflicts with Run:ai's own
#     scheduler; nvsentinel/nodewright/dra-driver/network-operator all
#     target real GPU nodes that do not exist on Kind in fake mode).
#
# Selection: `aicr recipe --service kind --platform runai`.
#
# NGINX Ingress is assumed to be pre-installed on the cluster — the
# CP chart's ingress objects expect a controller already reconciling.

kind: RecipeMetadata
apiVersion: aicr.nvidia.com/v1alpha1
metadata:
  name: kind-runai

spec:
  base: kind

  criteria:
    service: kind
    platform: runai

  componentRefs:
    # Disable real gpu-operator — fake-gpu-operator owns the gpu-operator
    # namespace exclusively in this overlay.
    - name: gpu-operator
      type: Helm
      overrides:
        enabled: false

    # Disable components that require real GPU nodes / real OS access:
    - name: nfd
      type: Helm
      overrides:
        enabled: false

    - name: nvsentinel
      type: Helm
      overrides:
        enabled: false

    - name: nodewright-operator
      type: Helm
      overrides:
        enabled: false

    - name: nvidia-dra-driver-gpu
      type: Helm
      overrides:
        enabled: false

    - name: network-operator
      type: Helm
      overrides:
        enabled: false

    # Conflicts with Run:ai's own scheduler bundled in the cluster chart;
    # turn it off whenever the Run:ai platform is in play.
    - name: kai-scheduler
      type: Helm
      overrides:
        enabled: false

    # Run:ai expects a fake-GPU advertisement on each worker. The chart
    # is mutually exclusive with gpu-operator (same namespace).
    # Pre-deploy step: label nodes once before sync —
    #   kubectl label nodes -l '!node-role.kubernetes.io/control-plane' \
    #     run.ai/simulated-gpu-node-pool=default --overwrite
    - name: fake-gpu-operator
      type: Helm
      valuesFile: components/fake-gpu-operator/values.yaml

    # Run:ai Control Plane. Cluster-side runai-cluster chart is
    # intentionally NOT included here — bring it in via a follow-up
    # overlay once the CP is reachable and you have a clientSecret.
    - name: runai-control-plane
      type: Helm
      valuesFile: components/runai-control-plane/values.yaml
      dependencyRefs:
        - cert-manager
        - kube-prometheus-stack
