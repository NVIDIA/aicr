# Cross-cutting overlay applied via criteria-wildcard matching.
#
# Carries the deployment-phase floor (the 4 standard checks plus the
# gpu-operator version pin) and applies to every GB300 query regardless of
# intent, so both training and inference recipes (e.g.,
# gb300-eks-ubuntu-training-kubeflow, gb300-eks-ubuntu-inference-dynamo)
# inherit the version pin.
#
# Per-field union merge (see pkg/recipe/metadata.go) means concrete leaves
# that declare their own `deployment:` block add to or override this floor
# without dropping its inherited checks — same-name constraints from the
# leaf win, additional checks are appended.
#
# See docs/contributor/recipe.md#criteria-wildcard-overlays for details.

kind: RecipeMetadata
apiVersion: aicr.run/v1alpha2
metadata:
  name: gb300-any

spec:
  base: base

  criteria:
    service: any
    accelerator: gb300

  validation:
    deployment:
      checks:
        - operator-health
        - expected-resources
        - gpu-operator-version
        - check-nvidia-smi
      constraints:
        # GB300 support shipped in gpu-operator v25.10, the same release that
        # stabilized GB200. Concrete leaves can tighten if they pin to a later
        # working version.
        - name: Deployment.gpu-operator.version
          value: ">= v25.10.0"
