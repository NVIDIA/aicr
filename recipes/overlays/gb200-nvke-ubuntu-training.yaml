kind: RecipeMetadata
apiVersion: aicr.run/v1beta1
metadata:
  name: gb200-nvke-ubuntu-training

spec:
  # Bare-metal GB200 NVL trays on NVKE: nothing GPU- or fabric-related is
  # pre-installed. The host keeps the inbox mlx5_core (OVN-Kubernetes runs on
  # it via BlueField-3), so the Network Operator ships no ofedDriver and
  # GPUDirect RDMA is DMA-BUF only. Not chained under gb200-oke-training: that
  # chain assumes an OCI-managed driver and OKE add-ons.
  base: nvke

  criteria:
    service: nvke
    accelerator: gb200
    os: ubuntu
    intent: training

  mixins:
    - os-ubuntu

  constraints:
    # Restated from nvke: snapshot resolution checks a leaf's own constraints.
    # Keeps the GA DRA API (resource.k8s.io/v1, Kubernetes 1.34+) for the
    # ComputeDomain/IMEX path.
    - name: K8s.server.version
      value: ">= 1.34"

  componentRefs:
    # No driver.rdma: GPUDirect RDMA attaches over DMA-BUF. nvidia-peermem has
    # no build for the 64k-page Grace kernel and needs OFED symbols the inbox
    # driver does not export. The NVreg_GrdmaPciTopoCheckOverride ConfigMap is
    # what lets dma-buf attach across the PCIe topology to the IB rails.
    - name: gpu-operator
      type: Helm
      preManifestFiles:
        - components/gpu-operator/manifests/kernel-module-params.yaml
      # rdma-modules first: its NodeWright taint-gates the GPU nodes until the
      # RDMA ULP modules are loaded, which only works if the CR precedes the
      # operators.
      dependencyRefs:
        - nfd
        - cert-manager
        - prometheus-operator-crds
        - rdma-modules
      overrides:
        gdrcopy:
          enabled: true
        driver:
          enabled: true
          kernelModuleConfig:
            name: nvidia-kernel-module-params
        toolkit:
          enabled: true
          # NVKE ships containerd 2.3 with a version 3 config.toml. The
          # toolkit's default config source is `containerd config dump`, which
          # on 2.3 reports the migrated version 4, so the drop-in it writes is
          # rejected by the version 3 root and containerd crash-loops (same
          # defect as #1688 on AKS, where the root is version 2).
          env:
            - name: RUNTIME_CONFIG_SOURCE
              value: file
            # Only a GPU allocation (device plugin or DRA) or a privileged
            # management pod may reach the GPUs. Without this an unprivileged
            # pod naming the nvidia RuntimeClass gets every GPU on the node
            # from NVIDIA_VISIBLE_DEVICES=all, which every CUDA image sets.
            # ACCEPT_NVIDIA_VISIBLE_DEVICES_AS_VOLUME_MOUNTS stays at its
            # default (false): the device plugin still emits the volume-mount
            # list beside CDI and the toolkit ignores it; CDI injects here.
            - name: ACCEPT_NVIDIA_VISIBLE_DEVICES_ENVVAR_WHEN_UNPRIVILEGED
              value: "false"
        devicePlugin:
          enabled: true
          # Helm replaces lists: the first two entries restate the component
          # base values.yaml; this override exists to pin MOFED_ENABLED off so
          # only pods requesting an SR-IOV rail VF receive /dev/infiniband.
          env:
            - name: DP_DISABLE_HEALTHCHECKS
              value: "109"
            - name: DEVICE_LIST_STRATEGY
              value: cdi-cri,cdi-annotations,volume-mounts
            - name: MOFED_ENABLED
              value: "false"

    - name: nfd
      type: Helm
      valuesFile: components/nfd/values-nvidia-nics.yaml
      overrides:
        topologyUpdater:
          enable: true

    # InfiniBand east-west fabric: four ConnectX-7 rails per tray, each exposed
    # as 16 IB VFs (nvidia.com/sriov_resource_rail_<n>) with an IPoIB address
    # from nv-ipam, on the inbox driver. NicClusterPolicy is manifest-supplied
    # (chart deployCR off); the per-rail SR-IOV objects follow in
    # sriov-ib-networks.
    - name: network-operator
      type: Helm
      valuesFile: components/network-operator/values-nvke-gb200.yaml
      manifestFiles:
        - components/network-operator/manifests/nic-cluster-policy-nvke-gb200.yaml
      dependencyRefs:
        - nfd
        - cert-manager
        - rdma-modules

    # The IPPool CRD ahead of the pools: the operator creates it only while
    # reconciling the NicClusterPolicy, after the pools' release would already
    # have been validated and applied.
    - name: nv-ipam-crds
      type: Helm

    - name: sriov-ib-networks
      type: Helm
      manifestFiles:
        - components/sriov-ib-networks/manifests/nvke-gb200.yaml
      dependencyRefs:
        - network-operator
        - nv-ipam-crds

    # rdma_ucm, ib_umad and ib_ipoib are not loaded by the NVKE image and no
    # operator loads them without OFED; without ib_ipoib the IB VFs have no
    # netdev for the SR-IOV CNI to hand to pods. Ordered before
    # network-operator and gpu-operator through their dependencyRefs.
    - name: rdma-modules
      type: Helm
      manifestFiles:
        - components/rdma-modules/manifests/rdma-ulp.yaml
      dependencyRefs:
        - nodewright-operator

  # Deployment checks come from the gb200-any criteria-wildcard overlay.
  validation:
    performance:
      checks:
        - nccl-all-reduce-bw-net
        - nccl-all-reduce-bw-nvls
      constraints:
        # Placeholder: the gb200/oke runtime requests nvidia.com/mlnxnics,
        # which this leaf no longer exposes, so the performance phase cannot
        # schedule until a gb200/nvke runtime requesting the per-rail
        # sriov_resource_rail_<n> VFs and the SriovIBNetwork attachments lands.
        - name: nccl-benchmark-profile
          value: gb200/oke
        # Thresholds copied from gb200-oke-training until a measured NVKE
        # baseline exists.
        - name: nccl-all-reduce-bw-net
          value: ">= 40"
        - name: nccl-all-reduce-bw-nvls
          value: ">= 500"
    conformance:
      checks:
        - platform-health
        - gpu-operator-health
        - dra-support
        - accelerator-metrics
        - ai-service-metrics
