kind: RecipeMetadata
apiVersion: aicr.run/v1beta1
metadata:
  name: gb300-eks-amazonlinux-inference

spec:
  # Inherits from gb300-eks-inference (GB300 + EKS + inference).
  # This overlay adds AL2023-specific OS constraints and the preinstalled-driver
  # overrides required by the NVIDIA AL2023 AMI family (AL2023 ARM NVIDIA) used
  # by P6e-GB300 UltraServer instances.
  base: gb300-eks-inference

  criteria:
    service: eks
    accelerator: gb300
    os: amazonlinux
    intent: inference

  mixins:
    - os-amazonlinux

  constraints:
    # Keep in sync with gb300-eks-ubuntu-inference: GA DRA API needs 1.34
    - name: K8s.server.version
      value: ">= 1.34"

  componentRefs:
    # Assumes the NVIDIA AL2023 AMI family (AL2023_x86_64_NVIDIA / AL2023 ARM
    # NVIDIA): the AMI preinstalls driver and toolkit at the host root. A
    # snapshot cannot establish which AMI a node runs or who owns the driver
    # (GPU.hardware.driver-loaded only detects an unloaded driver), so this
    # leaf is unprofiled; a driverless AMI gets no GPU driver.
    - name: gpu-operator
      type: Helm
      overrides:
        driver: {enabled: false}
        toolkit: {enabled: false}
    - name: nvidia-dra-driver-gpu
      type: Helm
      overrides:
        nvidiaDriverRoot: /
    - name: nvsentinel
      type: Helm
      overrides:
        labeler: {assumeDriverInstalled: true}
        janitor:
          config:
            controllers:
              gpuReset:
                resetJob: {hostDriverRootPath: /}
    # nvidia-setup is Debian/Ubuntu-only. manifestFiles merge additively, so the
    # inherited tuning.yaml cannot be cleared; disabling the component keeps
    # nvidia-setup off AL2023 nodes.
    - name: nodewright-customizations
      type: Helm
      overrides:
        enabled: false
