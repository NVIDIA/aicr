kind: RecipeMetadata
apiVersion: aicr.run/v1beta2
metadata:
  name: cks

spec:
  base: base
  criteria:
    service: cks

  profile:
    name: gpuStack
    description: CoreWeave manages the GPU stack and advertises nvidia.com/gpu.
    default: coreweave
    values:
      coreweave:
        advertiser: external
        constraints:
          - name: GPU.hardware.driver-loaded
            value: "true"
          - name: K8s.policy.devicePlugin.enabled
            value: "true"

  componentRefs:
    # CoreWeave owns these controllers and their operands.
    - name: gpu-operator
      type: Helm
      overrides:
        enabled: false
    - name: nfd
      type: Helm
      overrides:
        enabled: false
    - name: nvidia-dra-driver-gpu
      type: Helm
      overrides:
        enabled: false
    - name: dra-node-labeler
      type: Helm
      overrides:
        enabled: false
    - name: kube-prometheus-stack
      type: Helm
      overrides:
        # CoreWeave's exporter already binds host port 9100 (#2342).
        nodeExporter:
          enabled: false
    - name: nvsentinel
      type: Helm
      overrides:
        # Provider runtime/driver integration has not been qualified on CKS.
        enabled: false
    - name: prometheus-adapter
      type: Helm
      overrides:
        # GPU HPA needs a qualified scrape of CoreWeave's DCGM exporter.
        enabled: false

  validation:
    # Accelerator wildcards assume an AICR-managed GPU Operator. Clear their
    # deployment checks and version floor; CKS leaves add the applicable checks.
    deployment:
      checks: []
      constraints: []
    conformance:
      checks:
        - platform-health
