kind: RecipeMetadata
apiVersion: aicr.run/v1beta1
metadata:
  name: gb200-eks-ubuntu-training-kubeflow

spec:
  # Inherits from gb200-eks-ubuntu-training recipe (GB200 + EKS + Ubuntu + training settings)
  # This overlay adds Kubeflow Training Operator for distributed training with TrainJob
  base: gb200-eks-ubuntu-training

  criteria:
    service: eks
    accelerator: gb200
    os: ubuntu
    intent: training
    platform: kubeflow

  # Ubuntu OS constraints + Kubeflow platform via mixins
  mixins:
    - os-ubuntu
    - platform-kubeflow

  # GB200 + EKS specific constraints (not covered by mixin)
  constraints:
    # GB200 NVLS performance validation needs the GA resource.k8s.io/v1 DRA
    # API (Kubernetes 1.34+); keep this leaf aligned with gb200-eks-training.
    - name: K8s.server.version
      value: ">= 1.34"

  componentRefs: []

  validation:
    conformance:
      # Union-merged onto the checks inherited from gb200-eks-ubuntu-training. Declared on
      # the kubeflow leaf, not the shared training base, for two reasons:
      # robust-controller routes to checkRobustKubeflowTrainer only on leaves
      # that resolve kubeflow-trainer (it would skip on the plain base), and
      # secure-accelerator-access launches a Kubernetes pod requesting one
      # nvidia.com/gpu, which the sibling Slinky Slurm leaf cannot honor (its
      # slurmd pod reserves every GPU on the node) and would not attest the
      # Slurm GRES/cgroup access path even if it could. Placing both here
      # keeps the Slurm leaves out of their inheritance.
      checks:
        - robust-controller
        - secure-accelerator-access
