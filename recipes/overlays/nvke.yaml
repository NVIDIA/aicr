# NVKE (NVIDIA Kubernetes Engine): bare-metal Grace-Blackwell trays provisioned
# by Forge/NICo, Ubuntu with NVIDIA's -nvidia-64k kernel, OVN-Kubernetes as the
# primary CNI on BlueField-3, and east-west InfiniBand on ConnectX-7. Nodes
# carry providerID nico://<uuid>, which the fingerprint maps to nvke.
kind: RecipeMetadata
apiVersion: aicr.run/v1beta1
metadata:
  name: nvke
spec:
  base: base
  criteria:
    service: nvke
  # Every NVKE tray exposes ConnectX-7 rails, so NIC health monitoring is
  # meaningful on every leaf.
  mixins:
    - nvsentinel-nic-health-monitor
  constraints:
    - name: K8s.server.version
      value: ">= 1.34"
  componentRefs:
    # nktp: NVKE workload clusters ship no resource metrics API.
    - name: nktp
      type: Helm
      overrides:
        metrics-server:
          enabled: true
  validation:
    conformance:
      checks:
        - platform-health
        - gpu-operator-health
        - dra-support
