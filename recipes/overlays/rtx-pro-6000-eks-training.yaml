kind: RecipeMetadata
apiVersion: aicr.run/v1alpha2
metadata:
  name: rtx-pro-6000-eks-training

spec:
  # Inherits from eks-training recipe (EKS + training settings)
  base: eks-training

  criteria:
    service: eks
    accelerator: rtx-pro-6000
    intent: training

  # Specific constraints for RTX PRO 6000 on EKS training workloads.
  # Matches the floor already used by rtx-pro-6000-eks-inference (same
  # service+accelerator pair) and h100-eks-training.
  constraints:
    - name: K8s.server.version
      value: ">= 1.32.4"

  componentRefs:
    # RTX PRO 6000 GPU Operator dependencies (inherits valuesFile from
    # eks-training). No cdi/gdrcopy overrides: mirrors the existing
    # rtx-pro-6000-eks-inference baseline for this accelerator+service pair
    # rather than importing the H100/GB200 multi-node-NVLink overrides.
    - name: gpu-operator
      type: Helm
      dependencyRefs:
        - nfd
        - cert-manager
        - kube-prometheus-stack
        - nodewright-customizations

    # Node tuning uses the nodewright "generic" nvidia-tuned profile, same as
    # rtx-pro-6000-eks-inference: tuning.yaml also renders nvidia-setup, which
    # only ships eks-h100/eks-gb200 configs and fails on any other target.
    # The generic profile omits the NVLink/InfiniBand/hugepage/CPU-isolation
    # settings the h100/gb200 profiles carry — those don't apply to these
    # PCIe RTX PRO 6000 nodes (no NVLink fabric).
    - name: nodewright-customizations
      type: Helm
      manifestFiles:
        - components/nodewright-customizations/manifests/tuning-generic.yaml
      overrides:
        service: eks
        # No rtx-pro-6000 profile exists in nvidia-tuned (only h100/gb200/
        # generic); generic is the supported baseline profile for this target.
        accelerator: generic
        intent: multiNodeTraining
      dependencyRefs:
        - nodewright-operator

    - name: nfd
      type: Helm
      overrides:
        topologyUpdater:
          enable: true

  # Validation checks for RTX PRO 6000 on EKS training workloads.
  # Defined at the intent layer (not OS-specific) so all OS variants inherit them.
  # The deployment-phase floor (4 standard checks + Deployment.gpu-operator.version
  # >= v25.10.0) is contributed by the rtx-pro-6000-any.yaml wildcard overlay via
  # criteria-wildcard match and is not duplicated here, matching the
  # rtx-pro-6000-eks-inference pattern.
  #
  # Performance gating (NCCL all-reduce) is intentionally omitted — not because
  # this accelerator lacks NVLink (g7e nodes run 8x RTX PRO 6000 with an
  # inter-node fabric, which is exactly what this check targets), but because
  # rtx-pro-6000 has no entry in the compiled supportedNCCLCombinations matrix
  # (validators/performance/nccl_all_reduce_bw_constraint.go), no testdata
  # runtime template, and no empirically-calibrated bandwidth floor. Enabling
  # the check today would false-fail rather than validate anything real.
  # Tracked for follow-up: hardware calibration + matrix/testdata support for
  # rtx-pro-6000 on EKS.
  validation:
    deployment:
      constraints:
        # Host GPU driver floor for RTX PRO 6000 Blackwell Server Edition.
        #
        # NVIDIA GPU Operator platform support, "NVIDIA RTX PRO 6000 Blackwell
        # Server Edition notes": "Driver versions 575.57.08 or later is
        # required."
        # https://docs.nvidia.com/datacenter/cloud-native/gpu-operator/latest/platform-support.html
        #
        # AWS documents G7e as using RTX PRO 6000 Blackwell Server Edition:
        # https://aws.amazon.com/ec2/instance-types/g7e/
        # The Server Edition minimum therefore holds for every deeper OS and
        # platform leaf in this EKS chain. It is deliberately NOT keyed to
        # whatever driver the GPU Operator currently pins or to a version
        # observed passing a test run: a shipped version proves sufficiency,
        # not minimality.
        #
        # Placement (issue #2438): deployment constraints merge last-wins by
        # name with no max comparison, and the accelerator wildcard
        # rtx-pro-6000-any is applied BEFORE the service overlays it composes
        # with, so a floor declared there could be silently downgraded by any
        # same-name constraint added later in the chain.
        # This service x intent overlay is the last applied for its own query
        # and sits in the chain of every deeper OS/platform leaf, so the floor
        # reaches them all and cannot be overwritten from above. See
        # TestGPUDriverFloorEffectiveValue and
        # TestGPUDriverFloorPlacementInvariant in pkg/recipe.
        #
        # The check-nvidia-smi check that evaluates this is inherited from
        # rtx-pro-6000-any; declaring the constraint here unions into that
        # phase without dropping the inherited checks.
        - name: Deployment.gpu-driver.version
          value: ">= 575.57.08"
    conformance:
      checks:
        - platform-health
        - gpu-operator-health
        - dra-support
        - accelerator-metrics
        - ai-service-metrics
        - gang-scheduling
        - pod-autoscaling
        - cluster-autoscaling
