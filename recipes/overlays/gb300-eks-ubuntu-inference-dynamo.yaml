kind: RecipeMetadata
apiVersion: aicr.run/v1alpha2
metadata:
  name: gb300-eks-ubuntu-inference-dynamo

spec:
  # Inherits from gb300-eks-ubuntu-inference (GB300 + Ubuntu inference settings)
  # Adds Dynamo inference platform components.
  base: gb300-eks-ubuntu-inference

  criteria:
    service: eks
    accelerator: gb300
    os: ubuntu
    intent: inference
    platform: dynamo

  # DRA requires Kubernetes 1.34+ (GA)
  constraints:
    - name: K8s.server.version
      value: ">= 1.34"

  componentRefs:
    - name: grove
      type: Helm
      source: oci://ghcr.io/ai-dynamo/grove
      valuesFile: components/grove/values.yaml

    - name: dynamo-platform
      type: Helm
      source: https://helm.ngc.nvidia.com/nvidia/ai-dynamo
      valuesFile: components/dynamo-platform/values.yaml
      dependencyRefs:
        - grove
        - cert-manager
        - kube-prometheus-stack
        - gpu-operator
        - kai-scheduler

  # Performance validation (inference-perf) deferred — blocked on the serving
  # runtime, not on AICR. Measured 2026-08-25 on nhensley-gb300
  # (2x p6e-gb300r.36xlarge, 4 GPUs/worker set, Qwen/Qwen3-8B, concurrency
  # 1024): throughput 20,769 tok/s and TTFT p99 33,320 ms, against a GB200
  # reference of ~65,952 tok/s and ~1,240 ms on the same configuration.
  #
  # The pinned Dynamo worker image (nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.2.1)
  # ships CUDA 12.9, which is not sm_103-optimized for GB300 (Blackwell Ultra).
  # Plain CUDA kernels forward-compat via PTX JIT, but the runtime kernel
  # compiler needs explicit arch support, so the workers serve from
  # JIT-compiled kernels — which is what destroys first-token latency. The
  # numbers therefore measure the CUDA 12 image, not GB300, and must not be
  # used to set floors: doing so would enshrine a degraded configuration as
  # the GB300 baseline and permanently mask the real gap.
  #
  # Same class of gap as VR200/sm_107a, where the workers crash-loop outright
  # rather than degrade. Re-attempt when an sm_103-capable (CUDA 13) vLLM /
  # Dynamo runtime image ships, then measure and set throughput/TTFT floors
  # from that run. Tracked in https://github.com/NVIDIA/aicr/issues/2385.
  #
  # Deployment and conformance are unaffected and still gate this leaf
  # (validated 4/4 and 10/10 on the same cluster).
  validation:
    conformance:
      checks:
        - platform-health
        - gpu-operator-health
        - dra-support
        - accelerator-metrics
        - ai-service-metrics
        - inference-gateway
        - robust-controller
        - secure-accelerator-access
        - pod-autoscaling
        - cluster-autoscaling
