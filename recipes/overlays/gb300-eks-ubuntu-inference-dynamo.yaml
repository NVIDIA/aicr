kind: RecipeMetadata
apiVersion: aicr.run/v1alpha2
metadata:
  name: gb300-eks-ubuntu-inference-dynamo

spec:
  # Inherits from gb300-eks-ubuntu-inference (GB300 + Ubuntu inference settings)
  # Adds Dynamo inference platform components.
  base: gb300-eks-ubuntu-inference

  criteria:
    service: eks
    accelerator: gb300
    os: ubuntu
    intent: inference
    platform: dynamo

  # DRA requires Kubernetes 1.34+ (GA)
  constraints:
    - name: K8s.server.version
      value: ">= 1.34"

  componentRefs:
    - name: grove
      type: Helm
      source: oci://ghcr.io/ai-dynamo/grove
      valuesFile: components/grove/values.yaml

    - name: dynamo-platform
      type: Helm
      source: https://helm.ngc.nvidia.com/nvidia/ai-dynamo
      valuesFile: components/dynamo-platform/values.yaml
      dependencyRefs:
        - grove
        - cert-manager
        - kube-prometheus-stack
        - gpu-operator
        - kai-scheduler

  # Performance validation (inference-perf) deferred — the GB300 numbers are
  # far below the GB200 reference and the cause is NOT yet understood, so no
  # floor set from them would be meaningful.
  #
  # Measured 2026-08-25 on nhensley-gb300 (p6e-gb300r.36xlarge, 4 GPU workers,
  # Qwen/Qwen3-8B, concurrency 1024, dynamo-router/least-loaded):
  #
  #   vllm-runtime:1.2.1        (CUDA 12.9)  20,769 tok/s   TTFT p99 33,320 ms
  #   vllm-runtime:1.2.1-cuda13 (CUDA 13.0)  21,100 tok/s   TTFT p99 33,362 ms
  #   GB200 reference, same config          ~65,952 tok/s   TTFT p99  ~1,240 ms
  #
  # A CUDA 12 / sm_103 kernel mismatch was the leading hypothesis and was
  # tested directly: rebuilding the worker on the CUDA 13.0.2 image of the
  # same Dynamo version moved throughput by 1.6% and latency by 0.1%. That
  # rules CUDA out as the cause. The cluster side is not implicated either —
  # driver 580.173.02 reports CUDA 13.0 and compute capability 10.3.
  #
  # What is known: the benchmark completes (no crash-loop, unlike VR200 on
  # sm_107a), the endpoint serves, and the ~112s run at concurrency 1024
  # leaves most requests queued — which accounts for the TTFT but not for
  # serving roughly a third of GB200's tokens/sec on identical settings.
  #
  # Enabling this check with the GB200 floors would fail; setting floors from
  # the observed numbers would encode an unexplained deficit as the GB300
  # baseline. Deferred until the cause is identified.
  # Tracked in https://github.com/NVIDIA/aicr/issues/2385.
  #
  # Deployment and conformance are unaffected and still gate this leaf
  # (validated 4/4 and 10/10 on this cluster).
  validation:
    conformance:
      checks:
        - platform-health
        - gpu-operator-health
        - dra-support
        - accelerator-metrics
        - ai-service-metrics
        - inference-gateway
        - robust-controller
        - secure-accelerator-access
        - pod-autoscaling
        - cluster-autoscaling
