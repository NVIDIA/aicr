# Automatically generated directly into source by GKE Version Vector Export Engine.
# Authoritative single source of truth resides in GKE Version Vector registry.

kind: RecipeMetadata
apiVersion: aicr.run/v1beta1
metadata:
  name: gb300-gke-cos-training

spec:
  base: gke-cos-training

  criteria:
    service: gke
    accelerator: gb300
    os: cos
    intent: training

  # AICR compares the -gke.N build suffix numerically, and ranks "X-gke.N" above bare "X", so an
  # exclusive upper bound at a minor excludes that whole GKE track. Per-branch minimums are
  # expressed as "||" alternatives. Note a compound value cannot participate in profile
  # constraint tightening (it is reported incomparable), so do not add a profile-level
  # K8s.server.version on top of one.
  constraints:
    - name: K8s.server.version
      value: ">= 1.34.3-gke.1318000 < 1.35 || >= 1.35.0-gke.2745000"

  componentRefs:
    # GKE COS Driver Host Mapping & GPU Operator Alignment:
    # On Container-Optimized OS (COS), NVIDIA GPU drivers are natively host-managed
    # at /home/kubernetes/bin/nvidia (driver.enabled: false and cdi.enabled: true
    # are inherited from base gke-cos).
    - name: gpu-operator
      type: Helm
      dependencyRefs:
        - nfd
        - cert-manager
        - kube-prometheus-stack
        - nodewright-customizations

    # Grace (arm64) partition-gpus image:
    # The gcp-driver-installer default partition-gpus init container image is amd64-only and fails
    # with "exec format error" on arm64 nodes. On arm64, recipes therefore pin the multi-arch image
    # that GKE's own GPU device plugin uses on the highest GKE minor named in the constraint above.
    # Only takes effect under --profile gpuStack=bundle-installer (installer.enabled); a no-op under
    # the gke-default profile.
    - name: gcp-driver-installer
      type: Helm
      overrides:
        partitionGpuImage: "gcr.io/gke-release/nvidia-partition-gpu:v1.35.5-gke.3@sha256:73234730e47ffc8b3511a766b7a32ec9f01490052f5534a6d041fdab805b6d65"

    # GKE A4X Max (GB300) Networking & NodeWright Tuning:
    # High-bandwidth inter-node communication on A4X Max relies on cluster-level external
    # provisioning prerequisites: asapd-lite DaemonSet (creating child interfaces so DRANET
    # does not filter out RDMA NICs), Managed DRANET with ResourceClaimTemplates against
    # deviceClassName mrdma.google.com, and workload ComputeDomain/DRA channel setup for MNNVL.
    # The AICR recipe deploys nvidia-dra-driver-gpu with ComputeDomains enabled (validated via
    # dra-support conformance check), while NodeWright applies Grace-Blackwell host kernel tuning.
    # See docs/integrator/gke-a4x-max-networking.md for infrastructure setup details.
    - name: nodewright-customizations
      type: Helm
      manifestFiles:
        - components/nodewright-customizations/manifests/tuning-gke.yaml
      overrides:
        # Note: GB300 intentionally references the gb200 tuning profile in nvidia-tuning-gke:0.1.2
        # (shares the Grace-Blackwell host architecture). Revisit when a dedicated gb300 profile is available and present.
        accelerator: gb200
        intent: multiNodeTraining
      dependencyRefs:
        - nodewright-operator

    - name: nfd
      type: Helm
      overrides:
        topologyUpdater:
          enable: true

  validation:
    deployment:
      checks:
        - operator-health
        - expected-resources
        - gpu-operator-version
        - check-nvidia-smi
      constraints:
        - name: Deployment.gpu-operator.version
          value: ">= v25.10.0"
        # Host driver floor. On COS, GKE installs the GPU driver and the GPU Operator's driver is
        # disabled, so the operator version cannot gate it. check-nvidia-smi compares this with the
        # nvidia-smi banner on each GPU node, and fails rather than skips when no node can be
        # measured (busy or cordoned). The value is the lowest GPU driver minimum the GKE Version
        # Vector registry declares for this platform; the workload leaves inherit it.
        - name: Deployment.gpu-driver.version
          value: ">= 580.95.05"
    performance:
      # No performance check on GKE A4X Max (GB300) yet: AICR's NCCL validator has no GKE GB300
      # runtime, so any declared nccl-all-reduce-bw variant would only be skipped, which never
      # fails aicr validate. Add one with a calibrated threshold once such a runtime exists.
      checks: []
    conformance:
      # robust-controller is declared by the workload leaves, which carry the operator it
      # validates (dynamo-platform or kubeflow-trainer). On this shared base it would only skip.
      checks:
        - platform-health
        - gpu-operator-health
        - dra-support
        - accelerator-metrics
        - ai-service-metrics
        - gang-scheduling
        - pod-autoscaling
        - cluster-autoscaling
        - secure-accelerator-access
