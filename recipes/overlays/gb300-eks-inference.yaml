kind: RecipeMetadata
apiVersion: aicr.run/v1alpha2
metadata:
  name: gb300-eks-inference

spec:
  # Inherits from eks-inference recipe (EKS + inference settings)
  base: eks-inference

  criteria:
    service: eks
    accelerator: gb300
    intent: inference

  # Targets p6e-gb300r.36xlarge (GB300 NVL72, 4 GPUs per node, Grace ARM64
  # host) on the EFA scale-out fabric.
  #
  # Verified on the reference cluster: each GPU node presents 2x Amazon ENA
  # plus 1x Amazon EFA on the PCI bus and advertises vpc.amazonaws.com/efa: 1.
  # That is the layout AWS recommends — a primary ENA on network card 0
  # device 0, one EFA-only interface on card 0 device 1, and one EFA per
  # additional network card
  # (https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/efa-acc-inst-types.html).
  # This shape has no additional usable cards: the
  # instance reports 9 network cards, but cards 1-8 have
  # MaximumNetworkInterfaces: 0, so nothing can attach to them. A single EFA
  # interface is therefore the correct and maximal EFA configuration here,
  # not an under-provisioned one.
  #
  # Fabric selection is not modelled in the recipe criteria today — this
  # overlay targets EFA because that is what the reference cluster presents
  # and what public AICR builds for (#1410).
  #
  # Specific constraints for GB300 on EKS inference workloads.
  # Constraint names use fully qualified measurement paths: {type}.{subtype}.{key}
  constraints:
    # Multi-node inference on GB300 crosses the NVL72 IMEX domain via DRA,
    # which needs the GA resource.k8s.io/v1 API (Kubernetes 1.34+). Tighter
    # than the eks-inference base's >= 1.32.4.
    - name: K8s.server.version
      value: ">= 1.34"

  componentRefs:
    # GB300+EKS GPU Operator prerequisites. Keep in sync with the same block
    # in gb300-eks-training.yaml. The NVreg flag and cdi+gdrcopy are needed
    # for multi-node inference that crosses EFA — tensor-parallel serving
    # over the network has the same dma-buf attach requirement as training
    # all-reduce. The mixin system can't extend componentRefs already
    # declared in the inheritance chain, so this lives per-leaf for now.
    - name: gpu-operator
      type: Helm
      preManifestFiles:
        # Pre-install: ClusterPolicy reconcile reads this ConfigMap during
        # `helm install --wait`. See gb300-eks-training.yaml for full context (#859).
        - components/gpu-operator/manifests/kernel-module-params.yaml
      dependencyRefs:
        - nfd
        - cert-manager
        - kube-prometheus-stack
        - nodewright-customizations
      overrides:
        cdi:
          enabled: true
        gdrcopy:
          enabled: true
        driver:
          kernelModuleConfig:
            name: nvidia-kernel-module-params

    # GB300 node tuning is deferred — the documented no-op placeholder, kept in
    # sync with gb300-eks-training.yaml; see that file for the rationale and
    # what enabling real tuning later requires.
    - name: nodewright-customizations
      type: Helm
      manifestFiles:
        - components/nodewright-customizations/manifests/no-op.yaml
      dependencyRefs:
        - nodewright-operator

    - name: nfd
      type: Helm
      overrides:
        topologyUpdater:
          enable: true

  # Validation checks for GB300 on EKS inference workloads.
  # Defined at the intent layer (not OS-specific) so all OS variants inherit them.
  validation:
    deployment:
      checks:
        - operator-health
        - expected-resources
        - gpu-operator-version
        - check-nvidia-smi
      constraints:
        # GB300 support shipped in gpu-operator v25.10 (same release as GB200).
        - name: Deployment.gpu-operator.version
          value: ">= v25.10.0"
