kind: RecipeMetadata
apiVersion: aicr.run/v1beta1
metadata:
  name: h100-kind-training-slurm

spec:
  # H100 + Kind + training with the Slinky operator and a Slinky-managed
  # Slurm cluster. Kind has no GPUs, so the NodeSet runs CPU-only (no
  # GRES, no nvidia.com/gpu, no DCGM); useful for no-GPU CI end-to-end.
  base: h100-kind-training

  criteria:
    service: kind
    accelerator: h100
    intent: training
    platform: slurm

  # DRA (GA in K8s 1.34) — restated from the parent for clarity.
  constraints:
    - name: K8s.server.version
      value: ">= 1.34"

  # The Slinky operator (CRDs + operator + cluster instance) is declared
  # inline per slurm leaf, mirroring the dynamo-platform pattern in
  # h100-*-inference-dynamo leaves. Inlining lets each leaf carry its
  # own GPU/GRES tuning (Kind = CPU-only; H100 leaves = `Gres=gpu:h100:8`
  # + `nvidia.com/gpu: 8`) without fighting the mixin-vs-leaf
  # identity-field guard in mixinComponentRefSafeForMerge
  # (pkg/recipe/metadata_store.go), and keeps base.yaml free of
  # platform-specific components.
  #
  # Kind has no GPUs, so the NodeSet runs CPU-only: no `extraConfMap.Gres`,
  # no `slurmd.resources.limits.nvidia.com/gpu`, no DCGM. This makes the
  # leaf usable as a no-GPU CI smoke test for the operator + chart wiring.
  componentRefs:
    - name: mariadb-operator-crds
      type: Helm
      valuesFile: components/mariadb-operator-crds/values.yaml

    - name: mariadb-operator
      type: Helm
      valuesFile: components/mariadb-operator/values.yaml
      dependencyRefs:
        - mariadb-operator-crds

    - name: slurm-accounting-mariadb
      type: Helm
      valuesFile: components/slurm-accounting-mariadb/values.yaml
      dependencyRefs:
        - mariadb-operator
        - mariadb-operator-crds
      overrides:
        # Kind is a single node with no distinct system/accelerated pools to
        # select between (see the matching slinky-slurm override below).
        mariadb:
          nodeSelector: {}

    - name: slinky-slurm-operator-crds
      type: Helm
      valuesFile: components/slinky-slurm-operator-crds/values.yaml

    - name: slinky-slurm-operator
      type: Helm
      valuesFile: components/slinky-slurm-operator/values.yaml
      dependencyRefs:
        - cert-manager
        - slinky-slurm-operator-crds

    - name: slinky-topograph
      type: Helm
      valuesFile: components/slinky-topograph/values.yaml
      dependencyRefs:
        - slinky-slurm-operator
        - slinky-slurm-operator-crds
        - slinky-slurm
      overrides:
        # The `test` provider hands the engine a ready-made instance map, and
        # the engine uses a non-empty map as-is rather than resolving pod and
        # node names, so no real name was ever looked up and the leaf only
        # asserted an embedded fixture's own shape. `dra` derives the topology
        # from live Node labels instead, which makes the slinky engine resolve
        # the actual slurmd pods.
        provider:
          name: dra
          params:
            accelerator:
              source: kubernetes-label
              kubernetesLabel:
                key: nvidia.com/gpu.clique
        engine:
          name: slinky
          params:
            # Block, not tree: the clique label yields flat accelerator
            # domains with no switch hierarchy to express. `TopologyPlugin`
            # on slinky-slurm below moves with this, because slurmctld fatals
            # with "unrecognized key" when the plugin and the topology.conf
            # body disagree.
            plugin: topology/block
            # A block holds two Slurm nodes. Slurm nodes are slurmd pods, NOT
            # the Kubernetes nodes underneath them, and this leaf ships
            # nodesets.slinky.replicas: 1 (components/slinky-slurm/
            # values.yaml), so as shipped there is one pod, one domain, and no
            # block can be filled. A consumer that wants the two-clique
            # topology has to raise the replica count itself. This value
            # describes that intended configuration, not the leaf's own
            # default.
            blockSizes: [2]
            # The engine reads its own key here rather than reusing
            # provider.accelerator: the chart schema gives it no default, and
            # slinky drops label-less nodes from the block domains and fails
            # once none remain.
            acceleratorDomainSourceLabel: nvidia.com/gpu.clique
        # Disable the node-data-broker in the kind environment. nodeObserver
        # automatically skips waiting on it when nodeDataBroker.enabled is false.
        nodeDataBroker:
          enabled: false
        # Deliberate, not leftover debugging: one level above the chart
        # default of 3. This leaf exists for CI, a CI run gets a single pass
        # at an ephemeral cluster's logs, and the per-node domain assignment
        # is what tells you why a topology failed to resolve. It renders only
        # as -v=4 on the container args and cannot affect resolution.
        verbosity: 4
      # Inline override of the registry assertFile (checks/slinky-topograph/
      # health-check.yaml): this leaf disables node-data-broker, so the
      # DaemonSet step must not run, and it runs the topology/block plugin,
      # so the registry check's SwitchName assertion does not describe it.
      healthCheckAsserts: |
        apiVersion: chainsaw.kyverno.io/v1alpha1
        kind: Test
        metadata:
          name: slinky-topograph-health-check-kind
        spec:
          timeouts:
            assert: 5m
          steps:
            - name: validate-topograph-deployment
              try:
                - assert:
                    resource:
                      apiVersion: apps/v1
                      kind: Deployment
                      metadata:
                        name: slinky-topograph
                        namespace: topograph
                      status:
                        (availableReplicas > `0`): true
            - name: validate-node-observer-deployment
              try:
                - assert:
                    resource:
                      apiVersion: apps/v1
                      kind: Deployment
                      metadata:
                        name: slinky-topograph-node-observer
                        namespace: topograph
                      status:
                        (availableReplicas > `0`): true
            - name: validate-all-pods-healthy
              try:
                # Assert no pods are in unhealthy phases (Pending / Failed /
                # Unknown) or stuck in Running phase with a known-bad
                # container-waiting reason (CrashLoopBackOff,
                # ImagePullBackOff, ErrImagePull, CreateContainerConfigError).
                # Phase-only filtering misses CrashLoopBackOff because such
                # pods typically remain in Running phase with an unhealthy
                # container.
                - error:
                    resource:
                      apiVersion: v1
                      kind: Pod
                      metadata:
                        namespace: topograph
                      status:
                        phase: Pending
                - error:
                    resource:
                      apiVersion: v1
                      kind: Pod
                      metadata:
                        namespace: topograph
                      status:
                        phase: Failed
                - error:
                    resource:
                      apiVersion: v1
                      kind: Pod
                      metadata:
                        namespace: topograph
                      status:
                        phase: Unknown
                # JMESPath projection (not single-element match): kyverno-json's
                # sliceNode.Assert gates on exact slice length before per-element
                # comparison, so a `containerStatuses: - state: ...` shape only
                # matches single-container pods and silently passes sidecars. Use
                # `containerStatuses[?...] | length(@) > 0` to fire on any
                # container at any index. Parallel initContainerStatuses block
                # below catches init-container failures (invisible to
                # containerStatuses). Per PR #1245 review (@ArangoGutierrez).
                - error:
                    resource:
                      apiVersion: v1
                      kind: Pod
                      metadata:
                        namespace: topograph
                      status:
                        ((containerStatuses || `[]`)[?state.waiting.reason == 'CrashLoopBackOff' || state.waiting.reason == 'ImagePullBackOff' || state.waiting.reason == 'ErrImagePull' || state.waiting.reason == 'CreateContainerConfigError'] | length(@) > `0`): true
                - error:
                    resource:
                      apiVersion: v1
                      kind: Pod
                      metadata:
                        namespace: topograph
                      status:
                        ((initContainerStatuses || `[]`)[?state.waiting.reason == 'CrashLoopBackOff' || state.waiting.reason == 'ImagePullBackOff' || state.waiting.reason == 'ErrImagePull' || state.waiting.reason == 'CreateContainerConfigError'] | length(@) > `0`): true
            - name: validate-topology-configmap
              # THE ACCEPTANCE ASSERTION (#2358), and the reason the one it
              # replaces could not fail for the right reason. That one pinned
              # the exact content of topograph's own embedded small-tree.yaml
              # fixture -- the node names I21, I22, I25 and I34-I36 are that
              # fixture's instance IDs, and they name a node on no cluster.
              # PR #2254 deleted this leaf's topology fixture while bumping
              # topograph and nothing noticed, because an assertion tied to
              # the tool's own sample answer passes whatever the tool emits.
              #
              # What is asserted instead is the SHAPE topograph must produce
              # for this leaf, against the key it patches after every
              # successful sync:
              #
              #   (# <block>=<domain>
              #    BlockName=<block> Nodes=slinky-<hostlist>)+
              #   BlockSizes=<n>
              #
              # Every clause carries weight:
              #
              #   Nodes=slinky-       the Slurm nodes are this leaf's own
              #                       slurmd pods. A Slurm node is a NodeSet
              #                       pod's HOSTNAME (slinky-0), not its pod
              #                       name (slinky-slurm-slinky-0) and not the
              #                       Kubernetes node under it. This is the
              #                       clause the fixture-ID assertion could
              #                       never make.
              #   BlockName, and no   the PLUGIN COUPLING. `plugin:
              #   SwitchName          topology/block` on the topograph engine
              #                       above and `TopologyPlugin:
              #                       topology/block` on slinky-slurm below
              #                       must agree. Flipping ONE fatals
              #                       slurmctld on an unrecognized key, so it
              #                       cannot ship silently. Flipping BOTH back
              #                       to tree leaves the file internally
              #                       consistent, slurmctld starts, nothing
              #                       errors -- and topograph writes SwitchName
              #                       lines, which this pattern rejects.
              #   # <block>=<domain>  every block is attributed to an
              #                       accelerator domain. Without that comment
              #                       a topology can only be compared as an
              #                       unordered partition, and a partition
              #                       cannot show two blocks swapped between
              #                       domains.
              #   anchored whole-key  nothing else may be in the file, so the
              #                       'aicr-preseed' seed this leaf ships in
              #                       configFiles below cannot satisfy it: the
              #                       step fails closed (5m assert retry) until
              #                       a real sync lands.
              #
              # WHAT IT DELIBERATELY DOES NOT ASSERT: how many blocks there
              # are, or how many nodes are in each. Both follow the replica
              # count, and this leaf SHIPS nodesets.slinky.replicas: 1 -- one
              # slurmd pod, one domain, one block. Pinning "two blocks of two"
              # here would fail the recipe as shipped and hold only for a
              # consumer who raised the count. That check belongs where the
              # count is chosen: tests/uat/kind/verify-topology.sh recomputes
              # the expected membership from the live pod-to-node mapping and
              # each node's nvidia.com/gpu.clique label, and the UAT lane runs
              # it.
              try:
                - assert:
                    resource:
                      apiVersion: v1
                      kind: ConfigMap
                      metadata:
                        name: slinky-slurm-config-extra
                        namespace: slurm
                      # `|| ''` because an absent key yields null, and
                      # regex_match(null) is an engine error rather than a
                      # failed assertion -- which reports as "assertion engine
                      # error" instead of "topograph has not synced".
                      (regex_match('\A(# [A-Za-z0-9_.-]+=[A-Za-z0-9_.-]+\nBlockName=[A-Za-z0-9_.-]+ Nodes=slinky-[0-9\[\],-]+\n)+BlockSizes=[0-9]+\n?\z', data."topology.conf" || '')): true

    - name: slinky-slurm
      type: Helm
      valuesFile: components/slinky-slurm/values.yaml
      preManifestFiles:
        - components/slinky-slurm/manifests/enroot-config.yaml
      dependencyRefs:
        - slurm-accounting-mariadb
        - slinky-slurm-operator
        - slinky-slurm-operator-crds
      overrides:
        configFiles:
          # Seed so topology.conf exists in slinky-slurm-config-extra (and is
          # mounted at /etc/slurm) from first boot. Topograph overwrites this
          # key after each successful topology sync. NOTE: helm upgrade resets
          # the key to this seed until the next Topograph sync.
          # The seed is a syntactically VALID one-block placeholder, not
          # comment-only: with controller.inplaceReconfigure below, slurmctld
          # re-reads /etc/slurm on every projected change, so the seed is
          # reachable via a helm-upgrade seed restore or a controller restart.
          # It must match TopologyPlugin below. Verified against
          # slurmctld 26.05.4: under topology/block a SwitchName seed dies with
          # "_parse_next_key: Parsing error at unrecognized key: SwitchName"
          # followed by "fatal: something wrong with opening/reading
          # topology.conf", whereas this BlockName seed only warns
          # ("Invalid hostnames in block configuration") and reaches "Running
          # as primary controller". Unknown node names stay a warning
          # (node_conf.c), so the placeholder is safe in every reachable state.
          # Fail-closed lives in the health check: it requires topology content
          # WITHOUT the aicr-preseed marker, so an unconfigured provider still
          # cannot pass vacuously.
          topology.conf: |
            # Managed by NVIDIA Topograph (engine: slinky). Pre-sync placeholder.
            BlockName=aicr-preseed Nodes=aicr-preseed-node
            BlockSizes=1
        controller:
          extraConfMap:
            # Moves with the topograph engine's `plugin` above: topograph
            # writes BlockName/BlockSizes into topology.conf, which the
            # topology/tree parser rejects outright.
            TopologyPlugin: "topology/block"
          # Reload path (review: PR #1737): the reconfigure sidecar (slurm
          # chart v1.2.0, controller.inplaceReconfigure) runs scontrol
          # reconfigure when any file under /etc/slurm changes. Without it the
          # controller rollout hash excludes configFileRefs ConfigMaps, so
          # Topograph's topology.conf updates never reach the running
          # slurmctld and topology-aware placement stays inactive.
          inplaceReconfigure: true
          # Kind is a single node with no distinct system/accelerated pools
          # to select between, so registry.yaml's requireNodeSelector guard
          # (added for real multi-zone clouds) would otherwise force
          # --system-node-selector/--accelerated-node-selector on a bundle
          # where neither can mean anything. Opt out per component/
          # bundler.go's classifySchedulingPaths: an explicit empty override
          # on every declared nodeScheduling path (system below, accelerated
          # via nodesets.slinky further down) is treated as "no selector
          # needed here", not "forgot one".
          podSpec:
            nodeSelector: {}
        restapi:
          podSpec:
            nodeSelector: {}
        loginsets:
          slinky:
            podSpec:
              nodeSelector: {}
        accounting:
          podSpec:
            nodeSelector: {}
        nodesets:
          slinky:
            podSpec:
              nodeSelector: {}

  validation:
    conformance:
      checks:
        - slinky-slurm-health
