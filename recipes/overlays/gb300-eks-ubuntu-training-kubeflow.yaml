kind: RecipeMetadata
apiVersion: aicr.run/v1beta1
metadata:
  name: gb300-eks-ubuntu-training-kubeflow

spec:
  # Inherits from gb300-eks-ubuntu-training recipe (GB300 + EKS + Ubuntu + training settings)
  # This overlay adds Kubeflow Training Operator for distributed training with TrainJob
  base: gb300-eks-ubuntu-training

  criteria:
    service: eks
    accelerator: gb300
    os: ubuntu
    intent: training
    platform: kubeflow

  # Ubuntu OS constraints via mixin. Not platform-kubeflow: holding the Trainer
  # version means declaring kubeflow-trainer here, and the mixin's own ref for
  # it sets type and valuesFile, which a mixin may not set on a component the
  # overlay already declares, so the two cannot be combined.
  mixins:
    - os-ubuntu

  # GB300 + EKS specific constraints (not covered by mixin)
  constraints:
    # GB300 NVLS performance validation needs the GA resource.k8s.io/v1 DRA
    # API (Kubernetes 1.34+); keep this leaf aligned with gb300-eks-training.
    - name: K8s.server.version
      value: ">= 1.34"

  componentRefs:
    # recipes/mixins/platform-kubeflow.yaml's ref, held at 2.2.1 because NVCRE
    # v0.12.0 supports no other Trainer version. Return to the mixin once NVCRE
    # supports the registry pin (#3949). TestNVCRELeafTrainerRefMatchesMixin
    # keeps this copy in step with the mixin's.
    - name: kubeflow-trainer
      type: Helm
      version: 2.2.1
      valuesFile: components/kubeflow-trainer/values.yaml
      manifestFiles:
        - components/kubeflow-trainer/manifests/torch-distributed-cluster-training-runtime.yaml
      dependencyRefs:
        - cert-manager
        - prometheus-operator-crds
        - gpu-operator

    # Drives the performance check below.
    - name: nvcre
      type: Helm
      valuesFile: components/nvcre/values.yaml
      dependencyRefs:
        - kubeflow-trainer

  validation:
    performance:
      # Replaces the inherited TrainJob nccl-all-reduce-bw-nvls check. An overlay
      # cannot drop an inherited check (a non-empty checks list is unioned with
      # the parent's), so that check stays listed and the validator skips it as
      # superseded-by-cre while this check is declared and qualified for the
      # combination. CRE reports one peak bus bandwidth, which on this
      # NVL72 fabric is the NVLS path: 841 GB/s on CRE v0.12.0 against 841.17
      # from the TrainJob check on the same nodes. The floor equals the
      # inherited nvls floor and passes at 90% of it like the TrainJob check,
      # so the same figure means the same under either.
      #
      # nccl-cre-all-reduce-bw-net replaces the inherited nccl-all-reduce-bw-net
      # the same way, with NVLS and MNNVL disabled so the peak is the EFA path.
      # The new nccl-tests image (NCCL 2.31.2, aws-ofi-nccl 1.21.1) measures
      # about 31 GB/s there, against about 45 on the 2.27.7 and 1.16.3 image the
      # TrainJob check uses; the NVCRE team treats it as a regression to fix and
      # asked to stay on the new image. The floor is 30, below the 40 TrainJob
      # holds, and passes at 90% of it. Raise it back once the regression is
      # fixed.
      checks:
        - nccl-cre-all-reduce-bw
        - nccl-cre-all-reduce-bw-net
      constraints:
        - name: nccl-cre-all-reduce-bw
          value: ">= 700"
        - name: nccl-cre-all-reduce-bw-net
          # TODO(#3911): raise back to ">= 40" once the EFA regression is fixed.
          value: ">= 30"
    conformance:
      checks:
        - robust-controller
