# GB200 NVL72 trays on NVKE, at intent inference: gb200-nvke-ubuntu-training's
# GPU stack without its east-west fabric.
#
# SCOPE: the Gateway API inference surface, not model serving. Like every other
# AICR `-inference` recipe this declares agentgateway and nothing that serves a
# model; serving is gb200-nvke-ubuntu-inference-dynamo.
#
# NO east-west stack. The training leaf's network-operator, sriov-ib-networks,
# rdma-modules and kernel-module-params exist for NCCL over the InfiniBand
# rails. Serving through the Gateway API needs none of them, and the vr200-nvke
# and gb300-nvke inference leaves leave them out for the same reason.
#
# No performance block: an all-reduce floor is a training claim, and nothing
# has measured serving throughput on this coordinate.
kind: RecipeMetadata
apiVersion: aicr.run/v1beta1
metadata:
  name: gb200-nvke-ubuntu-inference

spec:
  base: nvke

  criteria:
    service: nvke
    accelerator: gb200
    os: ubuntu
    intent: inference

  mixins:
    - os-ubuntu

  constraints:
    # Restated from nvke: snapshot resolution checks a leaf's own constraints.
    # Keeps the GA DRA API (resource.k8s.io/v1, Kubernetes 1.34+).
    - name: K8s.server.version
      value: ">= 1.34"

  componentRefs:
    # The training leaf's GPU Operator settings without its GPUDirect pieces:
    # no kernel-module-params ConfigMap and no rdma-modules dependency.
    - name: gpu-operator
      type: Helm
      dependencyRefs:
        - nfd
        - cert-manager
        - prometheus-operator-crds
      overrides:
        gdrcopy:
          enabled: true
        driver:
          enabled: true
        toolkit:
          enabled: true
          # NVKE ships containerd 2.3 with a version 3 config.toml, while the
          # toolkit's default source (`containerd config dump`) reports the
          # migrated version 4; the drop-in is then rejected and containerd
          # crash-loops (#1688).
          env:
            - name: RUNTIME_CONFIG_SOURCE
              value: file
            - name: ACCEPT_NVIDIA_VISIBLE_DEVICES_ENVVAR_WHEN_UNPRIVILEGED
              value: "false"
        devicePlugin:
          enabled: true
          # Helm replaces lists: the first two entries restate the component
          # base. MOFED_ENABLED off because this leaf wires no RDMA path, so
          # mounting /dev/infiniband into every GPU pod would grant devices
          # nothing uses.
          env:
            - name: DP_DISABLE_HEALTHCHECKS
              value: "109"
            - name: DEVICE_LIST_STRATEGY
              value: cdi-cri,cdi-annotations,volume-mounts
            - name: MOFED_ENABLED
              value: "false"

    # No values-nvidia-nics.yaml: its rule is for recipes that ship
    # network-operator.
    - name: nfd
      type: Helm
      overrides:
        topologyUpdater:
          enable: true

    # The Gateway API surface, in the shape vr200-nvke-ubuntu-inference
    # declares it. aicr credits only a Gateway the recipe declares, so these
    # must be declared here and not merely installed on the cluster.
    #
    # NVKE provisions no LoadBalancer controller. Without a bare-metal LB, build
    # the bundle with `--set agentgateway:serviceType=ClusterIP`; otherwise the
    # Service sits at EXTERNAL-IP <pending>. Reachability only: the
    # inference-gateway check gates on ready endpoints, not an external address.
    - name: agentgateway-crds
      type: Helm
      source: oci://cr.agentgateway.dev/charts
      valuesFile: components/agentgateway-crds/values.yaml
      manifestFiles:
        - components/agentgateway-crds/manifests/gateway-api-crds.yaml
        - components/agentgateway-crds/manifests/inference-extension-crds.yaml

    - name: agentgateway
      type: Helm
      source: oci://cr.agentgateway.dev/charts
      valuesFile: components/agentgateway/values.yaml
      manifestFiles:
        - components/agentgateway/manifests/inference-gateway.yaml
      dependencyRefs:
        - agentgateway-crds
        - cert-manager
        - prometheus-operator-crds

  # Deployment checks come from the gb200-any criteria-wildcard overlay.
  validation:
    conformance:
      # gang-scheduling is a v1.36 MUST and KAI comes from the nvke base; an
      # undeclared check renders as "not tested".
      checks:
        - platform-health
        - gpu-operator-health
        - dra-support
        - accelerator-metrics
        - ai-service-metrics
        - gang-scheduling
        - inference-gateway
        - pod-autoscaling
        - secure-accelerator-access
        - driver-runtime-management
