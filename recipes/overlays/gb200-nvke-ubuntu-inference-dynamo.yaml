# gb200-nvke-ubuntu-inference plus the Dynamo serving platform: the leaf that
# serves a model, and the one that declares robust-controller.
# robust_controller_check.go takes its subject from the recipe
# (kubeflow-trainer, else dynamo-platform, else skip), so the plain inference
# leaf cannot establish that MUST. Follows gb300-nvke-ubuntu-inference-dynamo.
#
# No performance block. gb200-eks-ubuntu-inference-dynamo gates inference-perf
# on floors measured on EKS; nothing has measured Dynamo serving on NVKE, and a
# floor from another service would be a claim about a platform this leaf has
# never run on.
kind: RecipeMetadata
apiVersion: aicr.run/v1beta1
metadata:
  name: gb200-nvke-ubuntu-inference-dynamo

spec:
  base: gb200-nvke-ubuntu-inference

  criteria:
    service: nvke
    accelerator: gb200
    os: ubuntu
    intent: inference
    platform: dynamo

  mixins:
    - os-ubuntu

  # Restated from the base: snapshot resolution checks a leaf's own
  # constraints.
  constraints:
    - name: K8s.server.version
      value: ">= 1.34"

  componentRefs:
    - name: grove
      type: Helm
      valuesFile: components/grove/values.yaml
      dependencyRefs:
        - prometheus-operator-crds
    - name: dynamo-platform
      type: Helm
      valuesFile: components/dynamo-platform/values.yaml
      dependencyRefs:
        - grove
        - cert-manager
        - prometheus-operator-crds
        - gpu-operator
        - kai-scheduler

  validation:
    conformance:
      # Union-merged onto the base's checks.
      checks:
        - robust-controller
