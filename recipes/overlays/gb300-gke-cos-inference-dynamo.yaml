# Automatically generated directly into source by GKE Version Vector Export Engine.
# Authoritative single source of truth resides in GKE Version Vector registry and GCE SoT.

kind: RecipeMetadata
apiVersion: aicr.run/v1beta1
metadata:
  name: gb300-gke-cos-inference-dynamo

spec:
  # Inherits from gb300-gke-cos-inference recipe and layers Dynamo AI inference platform
  base: gb300-gke-cos-inference

  criteria:
    service: gke
    accelerator: gb300
    os: cos
    intent: inference
    platform: dynamo

  # Dynamic Resource Allocation (DRA) on GKE requires Kubernetes server version >= 1.34
  # AICR compares the -gke.N build suffix numerically, and ranks "X-gke.N" above bare "X", so an
  # exclusive upper bound at a minor excludes that whole GKE track. Per-branch minimums are
  # expressed as "||" alternatives. Note a compound value cannot participate in profile
  # constraint tightening (it is reported incomparable), so do not add a profile-level
  # K8s.server.version on top of one.
  constraints:
    - name: K8s.server.version
      value: ">= 1.34.3-gke.1318000 < 1.35 || >= 1.35.0-gke.2745000"

  componentRefs:
    # GKE AI Inference Runtime & OCI Chart Registration:
    # Deploys Dynamo inference platform orchestrating through Grove and KAI Scheduler.
    # Note: GB300 model-serving workloads must use CUDA 13 runtime variants (e.g.,
    # vllm-runtime:1.2.1-cuda13 published multi-arch on NGC) in DynamoGraphDeployments.
    - name: grove
      type: Helm
      source: oci://ghcr.io/ai-dynamo/grove
      valuesFile: components/grove/values.yaml

    - name: gpu-operator
      type: Helm
      valuesFile: components/gpu-operator/values-gke-cos.yaml
      overrides:
        driver:
          version: 580.95.05

    - name: dynamo-platform
      type: Helm
      source: https://helm.ngc.nvidia.com/nvidia/ai-dynamo
      valuesFile: components/dynamo-platform/values.yaml
      dependencyRefs:
        - grove
        - cert-manager
        - kube-prometheus-stack
        - gpu-operator
        - kai-scheduler

  validation:
    deployment:
      checks:
        - operator-health
        - expected-resources
        - gpu-operator-version
        - check-nvidia-smi
      constraints:
        - name: Deployment.gpu-operator.version
          value: ">= v25.10.0"
    performance:
      checks: []
    conformance:
      checks:
        - platform-health
        - gpu-operator-health
        - dra-support
        - accelerator-metrics
        - ai-service-metrics
        - inference-gateway
        - gang-scheduling
        - pod-autoscaling
        - cluster-autoscaling
        - robust-controller
        - secure-accelerator-access
