# Automatically generated directly into source by GKE Version Vector Export Engine.
# Authoritative single source of truth resides in GKE Version Vector registry and GCE SoT.

kind: RecipeMetadata
apiVersion: aicr.run/v1alpha2
metadata:
  name: gb300-gke-cos-inference-dynamo

spec:
  # Inherits from gb300-gke-cos-inference recipe and layers Dynamo AI inference platform
  base: gb300-gke-cos-inference

  criteria:
    service: gke
    accelerator: gb300
    os: cos
    intent: inference
    platform: dynamo

  # Dynamic Resource Allocation (DRA) on GKE requires Kubernetes server version >= 1.34
  constraints:
    - name: K8s.server.version
      value: ">= 1.34.3-gke.1318000"

  componentRefs:
    # GKE AI Inference Runtime & OCI Chart Registration:
    # Deploys Dynamo engine architectures parameterically matched to host CPU architecture
    # and Version Vector CUDA baseline, orchestrating through Grove and KAI Scheduler.
    - name: grove
      type: Helm
      source: oci://ghcr.io/ai-dynamo/grove
      valuesFile: components/grove/values.yaml

    - name: gpu-operator
      type: Helm
      valuesFile: components/gpu-operator/values-gke-cos.yaml
      overrides:
        driver:
          version: 580.95.05

    - name: dynamo-platform
      type: Helm
      source: https://helm.ngc.nvidia.com/nvidia/ai-dynamo
      valuesFile: components/dynamo-platform/values.yaml
      dependencyRefs:
        - grove
        - cert-manager
        - kube-prometheus-stack
        - gpu-operator
        - kai-scheduler
      overrides:
        engine:
          cudaVersion: "13.0"
          arch: "arm64"

  validation:
    deployment:
      checks:
        - operator-health
        - expected-resources
        - gpu-operator-version
        - check-nvidia-smi
      constraints:
        - name: Deployment.gpu-operator.version
          value: ">= v24.6.0"
    performance:
      checks: []
    conformance:
      checks:
        - platform-health
        - gpu-operator-health
        - dra-support
        - accelerator-metrics
        - ai-service-metrics
        - inference-gateway
        - gang-scheduling
        - pod-autoscaling
        - cluster-autoscaling
        - robust-controller
        - secure-accelerator-access
