kind: RecipeMetadata
apiVersion: aicr.run/v1alpha2
metadata:
  name: oke-ol

spec:
  criteria:
    service: oke
    os: ol

  # OKE-specific constraints
  # Constraint names use fully qualified measurement paths: {type}.{subtype}.{key}
  constraints:
    - name: K8s.server.version
      value: ">= 1.28"

  # OKE-specific components
  componentRefs:
    # No CSI driver component needed.
    # OCI Block Volume CSI driver is a built-in OKE addon (enabled by default).

    # OKE-specific GPU Operator overrides
    # OKE pre-installs NVIDIA drivers and container toolkit on GPU shapes
    # (BM.GPU.B200, BM.GPU.H100, etc.). Disable both to avoid conflicts.
    - name: gpu-operator
      type: Helm
      valuesFile: components/gpu-operator/values-oke.yaml

    # Prometheus persistent storage (provide --storage-class at bundle time, e.g. oci-bv)
    - name: kube-prometheus-stack
      type: Helm
      overrides:
        prometheus:
          prometheusSpec:
            storageSpec:
              emptyDir: null
              volumeClaimTemplate:
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 50Gi
    # NVSentinel on OKE: the node image supplies the driver, so no driver pod
    # exists for the labeler to watch. Without assumeDriverInstalled the
    # nvsentinel.dgxc.nvidia.com/driver.installed label is never applied and
    # metadata-collector plus both syslog-health-monitor DaemonSets sit at zero
    # desired pods — silently, with no error and no event (#2175).
    #
    # OKE has no gpuStack profile, so this value is overlay-level and is NOT
    # profile-owned: it does not receive the generated install-time profile
    # lock that protects the equivalent AKS and GKE-COS values. The NVSentinel
    # driver-label bundle gate still rejects bundle-time and declared-dynamic
    # changes that would recreate #2175, but a manual post-generation edit to
    # the rendered Helm values is outside that guarantee.
    - name: nvsentinel
      type: Helm
      overrides:
        labeler:
          assumeDriverInstalled: true

    # OKE DRA driver: host-installed driver root, compute domains enabled
    - name: nvidia-dra-driver-gpu
      type: Helm
      valuesFile: components/nvidia-dra-driver-gpu/values-oke.yaml
      overrides:
        controller:
          affinity:
            nodeAffinity: null

  validation:
    conformance:
      checks:
        - platform-health
        - gpu-operator-health
        - dra-support
        - accelerator-metrics
        - ai-service-metrics
