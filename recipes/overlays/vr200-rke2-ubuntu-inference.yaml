kind: RecipeMetadata
apiVersion: aicr.run/v1alpha2
metadata:
  name: vr200-rke2-ubuntu-inference

spec:
  # Platform-neutral VR200 inference base: carries every VR200-specific
  # safety override so that resolving rke2/vr200 inference WITHOUT
  # --platform can never fall through to generic rke2-inference with the
  # driver container enabled. The dynamo leaf inherits from here.
  base: rke2-inference

  criteria:
    service: rke2
    accelerator: vr200
    os: ubuntu
    intent: inference

  # Same VR200 NVL72 platform constraints as vr200-rke2-ubuntu-training —
  # see that leaf for the full rationale (Ubuntu 26.04 reference image,
  # Vera arm64 64k-page kernel, K8s floor aligned with the rke2
  # root's CDI/NRI containerd 2.1 requirement). The 615-branch host-driver
  # floor is enforced out-of-band (no driver-version measurement exists in
  # snapshots today).
  #
  # The upper bound (< 1.36.0) is inference-specific — see the same
  # constraint on rke2-inference.yaml for why (RKE2's default packaged
  # ingress becomes Traefik at v1.36, which conflicts with this leaf's
  # own Gateway API CRD installs). Restated here, not just on
  # rke2-inference.yaml, because constraint merging is same-name-wins
  # per layer: without restating it, this leaf's own >= 1.34.1 (with no
  # upper bound) would silently win over the intermediate layer's
  # tightened range.
  constraints:
    - name: K8s.server.version
      value: ">= 1.34.1 < 1.36.0"
    - name: OS.release.ID
      value: ubuntu
    - name: OS.release.VERSION_ID
      value: "26.04"
    - name: OS.sysctl./proc/sys/kernel/osrelease
      value: ">= 7.0"

  componentRefs:
    # Host-managed 615-branch driver (reference image), operator-managed
    # toolkit over the rke2 root's CDI/NRI path — identical to the
    # training leaf; see vr200-rke2-ubuntu-training for the full VR200
    # driver strategy.
    - name: gpu-operator
      type: Helm
      dependencyRefs:
        - nfd
        - cert-manager
        - kube-prometheus-stack
        - nodewright-customizations
      overrides:
        driver:
          enabled: false

    # See vr200-rke2-ubuntu-training for the host-managed-driver /
    # NVSentinel labeler rationale.
    - name: nvsentinel
      type: Helm
      overrides:
        labeler:
          assumeDriverInstalled: true
        # See vr200-rke2-ubuntu-training for why metadata-collector is
        # disabled rather than patched (NVIDIA/nvsentinel#1717).
        global:
          metadataCollector:
            enabled: false

    # See vr200-rke2-ubuntu-training for the host-managed-driver root
    # rationale and the host nvidia-imex/ComputeDomain conflict note.
    - name: nvidia-dra-driver-gpu
      type: Helm
      overrides:
        nvidiaDriverRoot: /

    # See vr200-rke2-ubuntu-training for the nodewright-operator naming-drift
    # rationale (NVIDIA/aicr#1828).
    - name: nodewright-operator
      type: Helm
      healthCheckAsserts: |
        apiVersion: chainsaw.kyverno.io/v1alpha1
        kind: Test
        metadata:
          name: nodewright-operator-health-check
        spec:
          timeouts:
            assert: 5m
          steps:
            - name: validate-skyhook-crd-established
              try:
                - assert:
                    resource:
                      apiVersion: apiextensions.k8s.io/v1
                      kind: CustomResourceDefinition
                      metadata:
                        name: skyhooks.skyhook.nvidia.com
                      status:
                        (conditions[?type == 'Established']):
                          - status: "True"
            - name: validate-deployment-exists
              try:
                - assert:
                    resource:
                      apiVersion: apps/v1
                      kind: Deployment
                      metadata:
                        name: nodewright-controller-manager
                        namespace: skyhook
                      status:
                        (availableReplicas > `0`): true
            - name: validate-all-pods-healthy
              try:
                - error:
                    resource:
                      apiVersion: v1
                      kind: Pod
                      metadata:
                        namespace: skyhook
                      status:
                        phase: Pending
                - error:
                    resource:
                      apiVersion: v1
                      kind: Pod
                      metadata:
                        namespace: skyhook
                      status:
                        phase: Failed
                - error:
                    resource:
                      apiVersion: v1
                      kind: Pod
                      metadata:
                        namespace: skyhook
                      status:
                        phase: Unknown
                - error:
                    resource:
                      apiVersion: v1
                      kind: Pod
                      metadata:
                        namespace: skyhook
                      status:
                        ((containerStatuses || `[]`)[?state.waiting.reason == 'CrashLoopBackOff' || state.waiting.reason == 'ImagePullBackOff' || state.waiting.reason == 'ErrImagePull' || state.waiting.reason == 'CreateContainerConfigError'] | length(@) > `0`): true
                - error:
                    resource:
                      apiVersion: v1
                      kind: Pod
                      metadata:
                        namespace: skyhook
                      status:
                        ((initContainerStatuses || `[]`)[?state.waiting.reason == 'CrashLoopBackOff' || state.waiting.reason == 'ImagePullBackOff' || state.waiting.reason == 'ErrImagePull' || state.waiting.reason == 'CreateContainerConfigError'] | length(@) > `0`): true

    # VR200 node tuning is applied out-of-band today — same no-op scaffold
    # as the training leaf; see vr200-rke2-ubuntu-training for the
    # enable-later steps.
    # Same bcm-profile stopgap as vr200-rke2-ubuntu-training (kernel-headers
    # aliasing only, accelerator-agnostic, no reboot) — the recipe catalog
    # requires every leaf sharing (service, accelerator) to carry the same
    # tuning configuration, so this base leaf (and its inference-dynamo
    # child) must match the training leaf's choice. See
    # vr200-rke2-ubuntu-training for the full rationale.
    - name: nodewright-customizations
      type: Helm
      manifestFiles:
        - components/nodewright-customizations/manifests/bcm-setup.yaml
      overrides:
        service: bcm
        accelerator: h100
      dependencyRefs:
        - nodewright-operator

    - name: nfd
      type: Helm
      overrides:
        topologyUpdater:
          enable: true
          # The chart's default TU memory limit (60Mi) OOM-kills the
          # topology updater on large-memory NVL72 workers (exit-137 crash
          # loops on multi-TiB nodes; working set scales with node
          # inventory). Leaf-scoped so no other platform is affected.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi

    # DraNet + RDMA netns-exclusive tuning — same rationale as the training
    # leaf, restated here because clean multi-node GPUDirect/RDMA access over
    # the ConnectX-9 fabric is a property of the NVL72 hardware, not of the
    # training workload specifically. Any inference deployment that spans
    # nodes over that fabric (e.g. Dynamo disaggregated prefill/decode with
    # cross-node KV-cache transfer) needs it the same way training does; a
    # purely single-node inference deployment doesn't exercise it either way.
    # See vr200-rke2-ubuntu-training for the full mechanism and reboot
    # rationale.
    - name: dranet
      type: Helm
      manifestFiles:
        - components/dranet/manifests/dranet.yaml

    - name: rdma-netns-exclusive
      type: Helm
      manifestFiles:
        - components/rdma-netns-exclusive/manifests/skyhook.yaml
      dependencyRefs:
        - nodewright-operator

  # pod-autoscaling / cluster-autoscaling conformance omitted: bare-metal
  # RKE2 has no cluster autoscaler.
  validation:
    deployment:
      checks:
        - operator-health
        - expected-resources
        - gpu-operator-version
        - check-nvidia-smi
      constraints:
        # See vr200-rke2-ubuntu-training for why this does NOT actually
        # gate nvidia-dra-driver-gpu's deployed version — it only covers
        # what a freshly generated bundle would pull.
        - name: Deployment.gpu-operator.version
          value: ">= v26.7.0"
    conformance:
      checks:
        - platform-health
        - gpu-operator-health
        - dra-support
        - accelerator-metrics
        - ai-service-metrics
        - inference-gateway
