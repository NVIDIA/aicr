kind: RecipeMetadata
apiVersion: aicr.run/v1beta1
metadata:
  name: gb300-nvke-ubuntu-training

spec:
  # Bare-metal GB300 NVL trays on NVKE. Same component shape as
  # gb300-generic-ubuntu-training (shared-HCA RDMA, nvidia-tuned only) except
  # that the Network Operator ships no ofedDriver: the host image already
  # carries the Mellanox driver stack and OVN-Kubernetes (the primary CNI, on
  # BlueField-3) is bound to it, so a DOCA driver container replacing it takes
  # the node's primary address with it (docs/integrator/nvke-gb300-setup.md).
  base: nvke

  criteria:
    service: nvke
    accelerator: gb300
    os: ubuntu
    intent: training

  mixins:
    - os-ubuntu

  constraints:
    # Restated from nvke: snapshot resolution checks a leaf's own constraints.
    # Keeps the GA DRA API (resource.k8s.io/v1, Kubernetes 1.34+) available
    # for the NVLS/IMEX performance check.
    - name: K8s.server.version
      value: ">= 1.34"

  componentRefs:
    # GPUDirect RDMA runs over DMA-BUF: no driver.rdma/nvidia-peermem (no
    # build exists for the 64k-page Grace kernel) and no NVreg
    # kernel-module-params ConfigMap (a GB200-on-EFA requirement only).
    - name: gpu-operator
      type: Helm
      dependencyRefs:
        - nfd
        - cert-manager
        - kube-prometheus-stack
        - nodewright-customizations
      overrides:
        gdrcopy:
          enabled: true
        driver:
          enabled: true
        toolkit:
          enabled: true
        devicePlugin:
          enabled: true
          # Helm replaces lists: the first two entries restate the component
          # base values.yaml; this override exists to pin MOFED_ENABLED off.
          # The fabric's device plugin owns RDMA injection; an omitted key is
          # inferred true when GDS enablement loads nvidia_fs.
          env:
            - name: DP_DISABLE_HEALTHCHECKS
              value: "109"
            - name: DEVICE_LIST_STRATEGY
              value: cdi-cri,cdi-annotations,volume-mounts
            - name: MOFED_ENABLED
              value: "false"

    # GB300 node tuning: nvidia-tuned alone, as on gb300-generic. nvidia-setup
    # dispatches on `<service>-<accelerator>` and ships no `nvke-*` config, and
    # the NVKE image already provides the -nvidia-64k kernel the gb300 profile
    # sizes its hugepage pools for (see the tuning-gb300.yaml header).
    #
    # service is deliberately omitted: nvidia-tuned ships no `nvke` service
    # profile and exits non-zero on a service directory it does not have, so
    # the node lands on the unlayered nvidia-gb300-multiNodeTraining profile.
    - name: nodewright-customizations
      type: Helm
      manifestFiles:
        - components/nodewright-customizations/manifests/tuning-gb300.yaml
      overrides:
        accelerator: gb300
        intent: multiNodeTraining
      dependencyRefs:
        - nodewright-operator

    - name: nfd
      type: Helm
      valuesFile: components/nfd/values-nvidia-nics.yaml
      overrides:
        topologyUpdater:
          enable: true

    # InfiniBand east-west fabric on the host driver: shared-HCA RDMA
    # (rdmaSharedDevicePlugin, pooled rdma/ib over the ConnectX PFs), no
    # ofedDriver and no nicConfigurationOperator (NIC firmware is a host
    # prerequisite on NVKE; the trays reject operator-driven firmware resets).
    - name: network-operator
      type: Helm
      valuesFile: components/network-operator/values-nvke-gb300.yaml
      manifestFiles:
        - components/network-operator/manifests/nic-cluster-policy-nvke-gb300.yaml
      dependencyRefs:
        - nfd
        - cert-manager

  # Deployment checks come from the gb300-any criteria-wildcard overlay.
  validation:
    performance:
      checks:
        - nccl-all-reduce-bw-nvls
      constraints:
        # Threshold copied from gb300-generic-ubuntu-training (895 GB/s
        # busbw baseline at the 16 GiB message size, 4 GPUs per node) until
        # an NVKE GB300 baseline is measured.
        - name: nccl-all-reduce-bw-nvls
          value: ">= 823"
    conformance:
      checks:
        - platform-health
        - gpu-operator-health
        - dra-support
        - accelerator-metrics
        - ai-service-metrics
