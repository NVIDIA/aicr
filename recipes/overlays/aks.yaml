kind: RecipeMetadata
apiVersion: aicr.run/v1alpha2
metadata:
  name: aks

spec:
  # Inherits from base (implicit when spec.base is empty)
  # This recipe contains AKS-specific settings shared by all AKS deployments

  criteria:
    service: aks

  # AKS-specific constraints
  # Constraint names use fully qualified measurement paths: {type}.{subtype}.{key}
  # DRA (Dynamic Resource Allocation) is included in all AKS recipes via base.yaml
  # (nvidia-dra-driver-gpu component). DRA graduated to GA in Kubernetes 1.34 —
  # the resource.k8s.io APIs are stable v1 and enabled by default, no AKS feature flag needed.
  constraints:
    - name: K8s.server.version
      value: ">= 1.34"

  # AKS-specific components
  componentRefs:
    # No aws-ebs-csi-driver equivalent needed.
    # Azure Disk CSI is a built-in AKS addon (enabled by default since AKS 1.21).

    # AKS-specific GPU Operator overrides
    # AKS driver-only mode (the Azure default): the AKS node image
    # preinstalls the driver and container toolkit; the operator owns
    # the rest of the GPU stack (device plugin, DCGM, GFD, ...)
    # (see docs/integrator/aks-gpu-setup.md)
    - name: gpu-operator
      type: Helm
      valuesFile: components/gpu-operator/values-aks.yaml
      # Device-isolation hardening for the driver-only profile: with
      # driver.enabled=false there is no gpu-operator toolkit DaemonSet to
      # write the hardened /etc/nvidia-container-runtime/config.toml keys, so
      # the AKS node image's permissive toolkit defaults would let any
      # unprivileged pod with NVIDIA_VISIBLE_DEVICES=all grab all GPUs
      # unallocated (secure-accelerator-access conformance failure). This
      # DaemonSet re-asserts the hardened keys. See the manifest header and
      # docs/integrator/aks-gpu-setup.md.
      manifestFiles:
        - components/gpu-operator/manifests/nvidia-toolkit-hardening-aks.yaml
      dependencyRefs:
        - network-operator

    # NVIDIA Network Operator for InfiniBand RDMA on AKS ND-series.
    # Manifests deliver the full RDMA stack that the Helm chart does not template:
    #   - NicClusterPolicy: MOFED driver, RDMA shared device plugin, DOCA telemetry
    #   - NFD NodeFeatureRule: labels IB-capable nodes (pci-15b3.present=true)
    #   - nvidia-peermem reloader: loads nvidia-peermem for GPUDirect RDMA —
    #     required under the AKS driver-only default, where no GPU Operator
    #     driver DaemonSet exists to load it and the Azure-managed driver
    #     does not load it automatically
    # Host MEMLOCK limits and IB module loading moved to nodewright
    # (nvidia-setup aks-h100 via the nodewright-customizations tuning manifest,
    # wired in the accelerator overlays), replacing the privileged
    # ib-node-config DaemonSet.
    # Reference: https://azure.github.io/aks-rdma-infiniband/configurations/network-operator
    #
    # RDMA is enabled by default. To opt out at bundle time:
    #   --set networkoperator:enabled=false \
    #   --set gpuoperator:driver.rdma.useHostMofed=false \
    #   --set nodewrightcustomizations:enabled=false
    - name: network-operator
      type: Helm
      source: https://helm.ngc.nvidia.com/nvidia
      valuesFile: components/network-operator/values-aks.yaml
      manifestFiles:
        - components/network-operator/manifests/nfd-network-rule.yaml
        - components/network-operator/manifests/nic-cluster-policy-aks.yaml
        - components/network-operator/manifests/nvidia-peermem-reloader.yaml
      dependencyRefs:
        - nfd
        - cert-manager

    # Prometheus persistent storage (provide --storage-class at bundle time, e.g. managed-csi)
    - name: kube-prometheus-stack
      type: Helm
      version: "83.7.0"
      overrides:
        prometheus:
          prometheusSpec:
            storageSpec:
              emptyDir: null
              volumeClaimTemplate:
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 50Gi
    # AKS has no control-plane nodes — remove the default nodeAffinity
    # that requires node-role.kubernetes.io/control-plane.
    # nvidiaDriverRoot: the AKS driver-only profile preinstalls the NVIDIA
    # driver on the node image at the host root (gpu-operator
    # driver.enabled=false, so nothing populates the base default
    # /run/nvidia/driver). Same pattern as OKE (values-oke.yaml) and
    # kind; GKE-COS uses its own host path.
    - name: nvidia-dra-driver-gpu
      type: Helm
      overrides:
        nvidiaDriverRoot: "/"
        controller:
          affinity:
            nodeAffinity: null

  validation:
    conformance:
      checks:
        - platform-health
        - gpu-operator-health
        - dra-support
        - accelerator-metrics
        - ai-service-metrics
