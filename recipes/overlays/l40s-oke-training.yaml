kind: RecipeMetadata
apiVersion: aicr.run/v1alpha2
metadata:
  name: l40s-oke-training

spec:
  # Inherits from oke-ol-training recipe (OKE + OL + training settings)
  base: oke-ol-training

  criteria:
    service: oke
    os: ol
    accelerator: l40s
    intent: training

  # Specific constraints for L40S on OKE training workloads.
  # L40S is Ada Lovelace (not Hopper/Blackwell) — no IMEX/NVLink ComputeDomain
  # requirement, so the recipe keeps the OKE training baseline K8s floor.
  constraints:
    - name: K8s.server.version
      value: ">= 1.32"

  componentRefs:
    # L40S-specific GPU Operator overrides (inherits valuesFile from oke-training).
    # Nodewright tuning is omitted: the nodewright-customizations packages do
    # not target service: oke.
    - name: gpu-operator
      type: Helm
      dependencyRefs:
        - nfd
        - cert-manager
        - kube-prometheus-stack
      overrides:
        gdrcopy:
          enabled: true

    - name: nfd
      type: Helm
      overrides:
        topologyUpdater:
          enable: true

    # RDMA fabric (RoCE over SR-IOV VFs). Every L40S OCI cluster runs RoCE;
    # the SR-IOV VF device plugin advertises nvidia.com/mlnxnics RDMA VFs,
    # with nv-ipam + multus attaching the VFs into workload pods. The
    # NicClusterPolicy is supplied by the manifest (the chart's deployCR is
    # off — the manifest is the only place the OCI VF selectors 101a/101e
    # can be expressed). OCI nodes carry host MOFED, so there is no
    # ofedDriver in any configuration. GPUDirect RDMA works via DMA-BUF;
    # nvidia-peermem stays off (base default) — inert on this topology.
    # Present in every gpuStack value: the fabric is orthogonal to GPU
    # driver/plugin ownership. Incompatible with Oracle's opt-in
    # NvidiaNetworkOperator add-on (two lifecycle managers, one release).
    - name: network-operator
      type: Helm
      valuesFile: components/network-operator/values-oke-l40s.yaml
      manifestFiles:
        - components/network-operator/manifests/nic-cluster-policy-oke-l40s.yaml
      dependencyRefs:
        - nfd
        - cert-manager

  # Validation checks for L40S on OKE training workloads.
  # Defined at the intent layer (not OS-specific) so all OS variants inherit them.
  #
  # The deployment-phase floor (4 standard checks + gpu-operator version pin)
  # is contributed by the l40s-any cross-cutting overlay and is not duplicated
  # here, matching the a100-oke-training pattern.
  #
  # Performance gating is intentionally omitted until an empirical L40S-on-OCI
  # NCCL baseline is established, matching the a100-oke-training rationale.
  validation:
    conformance:
      checks:
        - platform-health
        - gpu-operator-health
        - dra-support
        - accelerator-metrics
        - ai-service-metrics
        - gang-scheduling
        - pod-autoscaling
        - cluster-autoscaling
