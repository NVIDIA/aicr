kind: RecipeMetadata
apiVersion: aicr.run/v1beta1
metadata:
  name: gb200-nvke-ubuntu-training-kubeflow

spec:
  # Inherits from gb200-nvke-ubuntu-training (GB200 + NVKE + Ubuntu + training
  # settings) and adds Kubeflow Trainer for distributed training with TrainJob.
  base: gb200-nvke-ubuntu-training

  criteria:
    service: nvke
    accelerator: gb200
    os: ubuntu
    intent: training
    platform: kubeflow

  mixins:
    - os-ubuntu
    - platform-kubeflow

  constraints:
    # Restated from nvke: snapshot resolution checks a leaf's own constraints.
    - name: K8s.server.version
      value: ">= 1.34"

  componentRefs: []

  validation:
    conformance:
      checks:
        - robust-controller
