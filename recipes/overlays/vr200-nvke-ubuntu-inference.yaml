# Vera Rubin (VR200) NVL72 trays on NVKE. AICR ships vr200 only on rke2 and
# nvke only on gb200, so `--service nvke --accelerator vr200` has no leaf
# today. This is that pairing: the nvke root's platform handling with the
# VR200 node facts from vr200-rke2.
#
# SCOPE: the Gateway API inference surface, not model serving. Like every other
# AICR `-inference` recipe this declares agentgateway and nothing that serves a
# model; actual serving is the separate `-inference-dynamo` family.
#
# No performance block. The collective data path is the same MNNVL fabric the
# training leaf measures at 996 GB/s across two trays, but an all-reduce floor
# is a training claim, and vr200-rke2-ubuntu-inference carries none either.
#
# NO AI OPERATOR IS DECLARED, matching vr200-rke2-ubuntu-inference, which
# declares none. robust_controller_check.go takes its subject from the recipe
# -- kubeflow-trainer, else dynamo-platform, else skip -- so robust_controller
# skips for this leaf ("no supported AI operator found in recipe"), and the
# conformance list below does not schedule it. That is the honest result for a
# leaf that installs no operator; declaring one to turn the skip into a pass
# would claim a component this recipe does not ship.
#
# NO east-west stack. vr200-rke2-ubuntu-inference declares neither
# network-operator nor sriov-ib-networks, and this leaf follows it: serving
# through the Gateway API needs no RoCE rails. The training leaf ships eight,
# and even there the path is unqualified because no packet has crossed between
# nodes. Keeping them out is also what makes this leaf standalone -- the rails
# are the only thing that would tie it to the training leaf's manifests.
#
# It diverges from vr200-rke2 on the driver. That leaf sets driver.enabled
# false because the VR NVL72 reference image pre-bakes a 615-branch driver;
# NVKE's node image does not, and does not need to. What VR200 actually needs
# is the nvidia-bos kernel line: on the generic nvidia-64k kernel no driver
# brings the GPUs up at all (PRI reads return 0xbadf5720, FSP and GSP never
# hand off, every GPU fails probe with -EIO), while on nvidia-bos-64k the
# stock driver container works. Measured on a VR200 tray with 610.57.04,
# 615.71.09 and 615.78.08.
kind: RecipeMetadata
apiVersion: aicr.run/v1beta1
metadata:
  name: vr200-nvke-ubuntu-inference

spec:
  base: nvke

  criteria:
    service: nvke
    accelerator: vr200
    os: ubuntu
    intent: inference

  # No os-ubuntu mixin: it pins VERSION_ID 24.04 / kernel >= 6.8, while VR200
  # on NVKE runs Ubuntu 26.04 on a 7.0.0-*-nvidia-bos-64k arm64 kernel. The
  # osrelease constraint is written on the version, not the flavour, so it
  # matches both the -nvidia-bos-64k and -nvidia-64k spellings.
  constraints:
    # Restated from nvke: snapshot resolution checks a leaf's own constraints.
    # >= 1.34 keeps the GA DRA API (resource.k8s.io/v1) that ComputeDomain and
    # IMEX need. Observed in practice: 1.36.3.
    - name: K8s.server.version
      value: ">= 1.34"
    - name: OS.release.ID
      value: ubuntu
    - name: OS.release.VERSION_ID
      value: "26.04"
    - name: OS.sysctl./proc/sys/kernel/osrelease
      value: ">= 7.0"
  # NOT expressed as a constraint: the kernel must be the nvidia-bos flavour
  # rather than generic nvidia-64k. The constraint grammar has only >=, <=, >,
  # <, == and != with exact match -- no substring or regex -- and a version
  # range cannot separate the two series because pkg/version.Compare drops every
  # build suffix except -gke.N, so 7.0.0-1018-nvidia-64k and
  # 7.0.0-2022-nvidia-bos-64k both compare as 7.0.0 (verified: ">= 7.0.0-2000"
  # accepts the 1018 build). An exact == would pin one build. Enforce it
  # out-of-band until a kernel-flavour measurement exists -- the same posture
  # vr200-rke2 takes for its 615 host-driver floor.

  componentRefs:
    # NVKE's node image ships no pre-installed driver, so GPU Operator
    # installs it. 615.71.09 is the only 615 build published as a driver
    # container (615.78.08 exists only as a .run; nvcr.io/nvidia/driver:
    # 615.78.08-* is NotFound). Verified on hardware: all four GPUs per tray
    # enumerate with no host driver present.
    - name: gpu-operator
      type: Helm
      dependencyRefs:
        - nfd
        - cert-manager
        - prometheus-operator-crds
      overrides:
        gdrcopy:
          enabled: true
        driver:
          enabled: true
          version: 615.71.09
        toolkit:
          enabled: true
          # NVKE ships containerd 2.3 with a version 3 config.toml, while the
          # toolkit's default source (`containerd config dump`) reports the
          # migrated version 4 -- the drop-in is then rejected and containerd
          # crash-loops. Same defect as #1688 on AKS. Inherited reasoning from
          # gb200-nvke; this is NVKE platform behaviour, not GB200-specific.
          env:
            - name: RUNTIME_CONFIG_SOURCE
              value: file
            - name: ACCEPT_NVIDIA_VISIBLE_DEVICES_ENVVAR_WHEN_UNPRIVILEGED
              value: "false"
        devicePlugin:
          enabled: true
          # Helm replaces lists: the first two entries restate the component
          # base. MOFED_ENABLED off because this leaf wires no RDMA path at
          # all -- no rail VFs exist for a pod to request, so mounting
          # /dev/infiniband into every GPU pod would grant devices nothing
          # uses.
          env:
            - name: DP_DISABLE_HEALTHCHECKS
              value: "109"
            - name: DEVICE_LIST_STRATEGY
              value: cdi-cri,cdi-annotations,volume-mounts
            - name: MOFED_ENABLED
              value: "false"

    # components/nvidia-dra-driver-gpu/values.yaml already sets nvidiaDriverRoot
    # to /run/nvidia/driver, which is where gpu-operator puts the driver, so this
    # repeats that value rather than correcting it. Kept as an explicit pin: the
    # kubelet-plugin finding the driver is what makes a ComputeDomain usable, and
    # without that multi-node NVLink silently does not work. gb200-nvke omits it
    # and is not affected.
    - name: nvidia-dra-driver-gpu
      type: Helm
      overrides:
        nvidiaDriverRoot: /run/nvidia/driver

    - name: nfd
      type: Helm
      overrides:
        topologyUpdater:
          enable: true
          # The chart's 60Mi default OOM-kills the topology updater on
          # multi-TiB nodes (exit 137). Taken from vr200-rke2, and it applies
          # for the same reason: these trays report 1.4 TiB.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi

    # Scaffolded off. vr200-rke2 ships a Skyhook tuning CR that REBOOTS EVERY
    # GPU NODE it touches, and nodewright-packages has no vr200/nvke profile --
    # its vr200 profiles are service-specific (bcm, rke2). Enabling this with
    # another service's profile would apply that platform's tuning and reboot
    # the trays for it. Same posture as gb200-nvke; enabling later is a
    # one-line change.
    - name: nodewright-customizations
      type: Helm
      overrides:
        enabled: false
      dependencyRefs:
        - nodewright-operator

    # The Gateway API surface. aicr refuses to credit a Gateway the recipe does
    # not declare -- "a Gateway left over from another install is not evidence
    # for this recipe" -- so ai_inference evidence needs these declared here and
    # not merely installed on the cluster. Same two components rke2-inference
    # declares, in the shape the platform-inference mixin uses.
    #
    # EXTERNAL ADDRESS: NVKE provisions no LoadBalancer controller, and the
    # Service the controller generates for this Gateway is type LoadBalancer.
    # A bare-metal LB (e.g. MetalLB or kube-vip) is what gives it an external
    # address; without one the Service stays at EXTERNAL-IP <pending> and the
    # gateway is reachable only in-cluster or via NodePort.
    #
    # That is a reachability limit, not a conformance one. agentgateway v1.5.0
    # reports Programmed=True when no negative condition is present, regardless
    # of address allocation, and inference_gateway_check.go gates readiness on
    # ready endpoints rather than an external address -- its LoadBalancer
    # handling checks spec.loadBalancerSourceRanges for internet exposure and
    # records "No LoadBalancer Service" as an observation. The v1.36 evidence
    # set records Programmed=True and PASS on this cluster with no LoadBalancer.
    - name: agentgateway-crds
      type: Helm
      source: oci://cr.agentgateway.dev/charts
      valuesFile: components/agentgateway-crds/values.yaml
      manifestFiles:
        - components/agentgateway-crds/manifests/gateway-api-crds.yaml
        - components/agentgateway-crds/manifests/inference-extension-crds.yaml

    - name: agentgateway
      type: Helm
      source: oci://cr.agentgateway.dev/charts
      valuesFile: components/agentgateway/values.yaml
      manifestFiles:
        - components/agentgateway/manifests/inference-gateway.yaml
      dependencyRefs:
        - agentgateway-crds
        - cert-manager
        - prometheus-operator-crds

  validation:
    deployment:
      checks:
        - operator-health
        - expected-resources
        - gpu-operator-version
        - check-nvidia-smi
      constraints:
        # Gates gpu-operator only. No per-component deployment version check
        # exists for nvidia-dra-driver-gpu, so its version is not asserted.
        - name: Deployment.gpu-operator.version
          value: ">= v26.7.0"
    conformance:
      # inference-gateway is the one this leaf exists for: a leaf that ships
      # agentgateway and does not name the check leaves its own capability
      # unvalidated.
      #
      # gang-scheduling is a v1.36 MUST and KAI comes from the nvke base. An
      # undeclared check renders as "not tested", which never establishes a
      # requirement, so omitting it makes every submission from this leaf
      # incomplete.
      checks:
        - platform-health
        - gpu-operator-health
        - dra-support
        - accelerator-metrics
        - ai-service-metrics
        - gang-scheduling
        - inference-gateway
        - pod-autoscaling
        - secure-accelerator-access
