kind: RecipeMetadata
apiVersion: aicr.run/v1beta1
metadata:
  name: h100-kind-training-kueue

spec:
  # H100 + Kind + training with Kueue topology-aware scheduling (TAS).
  # Kind has no cloud topology API, so Topograph runs the `dra` provider,
  # which reads each node's existing nvidia.com/gpu.clique label (set by
  # tests/uat/kind/setup-gpu-sim.sh on the simulated-GPU cluster); the k8s
  # engine publishes it as accelerator.topograph.run/domain. A stock Kind
  # cluster has no clique labels, so nodes get none and TAS admits nothing.
  # The chart's `test` provider is not usable here: v1.0.0 accepts only a
  # bare fixture name, so it cannot name real Kind nodes.
  base: h100-kind-training

  criteria:
    service: kind
    accelerator: h100
    intent: training
    platform: kueue

  constraints:
    - name: K8s.server.version
      value: ">= 1.34"

  # Opt-in: only recipes with platform=kueue install Kueue and Topograph, so
  # every other recipe renders as before. Topograph is a dependency of kueue
  # but labels nodes asynchronously, so the kueue health check below asserts
  # no node labels.
  componentRefs:
    - name: topograph
      type: Helm
      valuesFile: components/topograph/values.yaml
      overrides:
        provider:
          name: dra
          params:
            accelerator:
              source: kubernetes-label
              kubernetesLabel:
                key: nvidia.com/gpu.clique
        nodeDataBroker:
          enabled: false

    - name: kueue
      type: Helm
      valuesFile: components/kueue/values.yaml
      dependencyRefs:
        - topograph
      manifestFiles:
        - components/kueue/manifests/topology-accelerator.yaml
        - components/kueue/manifests/tas-flavor.yaml
        - components/kueue/manifests/cluster-queue-tas.yaml
        - components/kueue/manifests/local-queue.yaml
      # Inline override of the registry assertFile: that check pins
      # default-flavor, which this leaf does not ship.
      healthCheckAsserts: |
        apiVersion: chainsaw.kyverno.io/v1alpha1
        kind: Test
        metadata:
          name: kueue-health-check-kind
        spec:
          timeouts:
            assert: 5m
          steps:
            - name: validate-crds-established
              try:
                - assert:
                    resource:
                      apiVersion: apiextensions.k8s.io/v1
                      kind: CustomResourceDefinition
                      metadata:
                        name: topologies.kueue.x-k8s.io
                      status:
                        (conditions[?type == 'Established']):
                          - status: "True"
                - assert:
                    resource:
                      apiVersion: apiextensions.k8s.io/v1
                      kind: CustomResourceDefinition
                      metadata:
                        name: resourceflavors.kueue.x-k8s.io
                      status:
                        (conditions[?type == 'Established']):
                          - status: "True"
                - assert:
                    resource:
                      apiVersion: apiextensions.k8s.io/v1
                      kind: CustomResourceDefinition
                      metadata:
                        name: clusterqueues.kueue.x-k8s.io
                      status:
                        (conditions[?type == 'Established']):
                          - status: "True"
                - assert:
                    resource:
                      apiVersion: apiextensions.k8s.io/v1
                      kind: CustomResourceDefinition
                      metadata:
                        name: localqueues.kueue.x-k8s.io
                      status:
                        (conditions[?type == 'Established']):
                          - status: "True"
            - name: validate-deployment-exists
              try:
                - assert:
                    resource:
                      apiVersion: apps/v1
                      kind: Deployment
                      metadata:
                        name: kueue-controller-manager
                        namespace: kueue-system
                      status:
                        (availableReplicas > `0`): true
            - name: validate-tas-crs
              try:
                # Existence plus ClusterQueue Active only: Topograph labels
                # nodes asynchronously, so node labels are not asserted here.
                - assert:
                    resource:
                      apiVersion: kueue.x-k8s.io/v1beta2
                      kind: Topology
                      metadata:
                        name: tas-topology
                - assert:
                    resource:
                      apiVersion: kueue.x-k8s.io/v1beta2
                      kind: ResourceFlavor
                      metadata:
                        name: tas-flavor
                - assert:
                    resource:
                      apiVersion: kueue.x-k8s.io/v1beta2
                      kind: ClusterQueue
                      metadata:
                        name: cluster-queue
                      status:
                        ((conditions || `[]`)[?type == 'Active' && status == 'True'] | length(@) > `0`): true
