# gb10-nvke-ubuntu-inference plus the Dynamo serving platform, and the leaf
# that declares robust-controller. robust_controller_check.go takes its subject
# from the recipe (kubeflow-trainer, else dynamo-platform, else skip), so the
# plain inference leaf cannot establish that MUST. Follows
# gb200-nvke-ubuntu-inference-dynamo.
#
# Operators only: no model has been served through them on a Spark, and a
# model's runtime image must support arm64 and GB10.
kind: RecipeMetadata
apiVersion: aicr.run/v1beta1
metadata:
  name: gb10-nvke-ubuntu-inference-dynamo

spec:
  base: gb10-nvke-ubuntu-inference

  criteria:
    service: nvke
    accelerator: gb10
    os: ubuntu
    intent: inference
    platform: dynamo

  mixins:
    - os-ubuntu

  # Restated from the base: snapshot resolution checks a leaf's own
  # constraints.
  constraints:
    - name: K8s.server.version
      value: ">= 1.34"

  componentRefs:
    # Grove's kai-scheduler backend owns PodGroup termination timing, so KAI's
    # own stale-PodGroup eviction is disabled (Dynamo platform chart README,
    # v1.5.0 upgrade notes). Recipes without Grove keep KAI's default cleanup.
    - name: kai-scheduler
      type: Helm
      overrides:
        scheduler:
          args:
            default-staleness-grace-period: "-1s"

    - name: grove
      type: Helm
      valuesFile: components/grove/values.yaml
      dependencyRefs:
        - prometheus-operator-crds
    - name: dynamo-platform
      type: Helm
      valuesFile: components/dynamo-platform/values.yaml
      dependencyRefs:
        - grove
        - cert-manager
        - prometheus-operator-crds
        - gpu-operator
        - kai-scheduler

  validation:
    # TODO: no performance phase yet. inference-perf needs a measured
    # throughput and TTFT floor; add it once one is measured on a Spark.
    conformance:
      # Union-merged onto the base's checks.
      checks:
        - robust-controller
