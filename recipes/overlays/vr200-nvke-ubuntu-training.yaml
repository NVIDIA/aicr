# Vera Rubin (VR200) NVL72 trays on NVKE. AICR ships vr200 only on rke2 and
# nvke only on gb200, so `--service nvke --accelerator vr200` has no leaf
# today. This is that pairing: the nvke root's platform handling with the
# VR200 node facts from vr200-rke2.
#
# SCOPE: training inside a single NVLink domain. The collective data path is
# MNNVL, measured at 996 GB/s across two trays.
#
# The leaf does ship an east-west stack: eight ConnectX-9 RoCE rails, deployed
# and attachable -- on the reference cluster the VFs were advertised, addressed
# by nv-ipam and attached as net1..net8 on both workers. But the NIC east-west
# path is NOT qualified, because no packet has crossed between nodes: the
# BlueField DPU bridges only the port carrying the node address, and bridging
# the spare ports is DPU-side work outside the tenant cluster. Every mlx5 port
# reports link_layer Ethernet with RoCE v2 GIDs -- there is no InfiniBand link
# layer -- and no RDMA transport number has been measured on it. The node image
# installs DOCA OVS and the DOCA-repo ibverbs userspace, but the kernel driver
# is the distro's inbox mlx5_core, not DOCA-OFED, so feature parity with
# DOCA-OFED is not claimed. Multi-domain training over the NIC fabric needs
# that path bridged and measured first.
#
# It diverges from vr200-rke2 on the driver. That leaf sets driver.enabled
# false because the VR NVL72 reference image pre-bakes a 615-branch driver;
# NVKE's node image does not, and does not need to. What VR200 actually needs
# is the nvidia-bos kernel line: on the generic nvidia-64k kernel no driver
# brings the GPUs up at all (PRI reads return 0xbadf5720, FSP and GSP never
# hand off, every GPU fails probe with -EIO), while on nvidia-bos-64k the
# stock driver container works. Measured on a VR200 tray with 610.57.04,
# 615.71.09 and 615.78.08.
kind: RecipeMetadata
apiVersion: aicr.run/v1beta1
metadata:
  name: vr200-nvke-ubuntu-training

spec:
  base: nvke

  criteria:
    service: nvke
    accelerator: vr200
    os: ubuntu
    intent: training

  # No os-ubuntu mixin: it pins VERSION_ID 24.04 / kernel >= 6.8, while VR200
  # on NVKE runs Ubuntu 26.04 on a 7.0.0-*-nvidia-bos-64k arm64 kernel. The
  # osrelease constraint is written on the version, not the flavour, so it
  # matches both the -nvidia-bos-64k and -nvidia-64k spellings.
  constraints:
    # Restated from nvke: snapshot resolution checks a leaf's own constraints.
    # >= 1.34 keeps the GA DRA API (resource.k8s.io/v1) that ComputeDomain and
    # IMEX need. Observed in practice: 1.36.3.
    - name: K8s.server.version
      value: ">= 1.34"
    - name: OS.release.ID
      value: ubuntu
    - name: OS.release.VERSION_ID
      value: "26.04"
    - name: OS.sysctl./proc/sys/kernel/osrelease
      value: ">= 7.0"
  # NOT expressed as a constraint: the kernel must be the nvidia-bos flavour
  # rather than generic nvidia-64k. The constraint grammar has only >=, <=, >,
  # <, == and != with exact match -- no substring or regex -- and a version
  # range cannot separate the two series because pkg/version.Compare drops every
  # build suffix except -gke.N, so 7.0.0-1018-nvidia-64k and
  # 7.0.0-2022-nvidia-bos-64k both compare as 7.0.0 (verified: ">= 7.0.0-2000"
  # accepts the 1018 build). An exact == would pin one build. Enforce it
  # out-of-band until a kernel-flavour measurement exists -- the same posture
  # vr200-rke2 takes for its 615 host-driver floor.

  componentRefs:
    # NVKE's node image ships no pre-installed driver, so GPU Operator
    # installs it. 615.71.09 is the only 615 build published as a driver
    # container (615.78.08 exists only as a .run; nvcr.io/nvidia/driver:
    # 615.78.08-* is NotFound). Verified on hardware: all four GPUs per tray
    # enumerate with no host driver present.
    - name: gpu-operator
      type: Helm
      dependencyRefs:
        - nfd
        - cert-manager
        - prometheus-operator-crds
      overrides:
        gdrcopy:
          enabled: true
        driver:
          enabled: true
          version: 615.71.09
        toolkit:
          enabled: true
          # NVKE ships containerd 2.3 with a version 3 config.toml, while the
          # toolkit's default source (`containerd config dump`) reports the
          # migrated version 4 -- the drop-in is then rejected and containerd
          # crash-loops. Same defect as #1688 on AKS. Inherited reasoning from
          # gb200-nvke; this is NVKE platform behaviour, not GB200-specific.
          env:
            - name: RUNTIME_CONFIG_SOURCE
              value: file
            - name: ACCEPT_NVIDIA_VISIBLE_DEVICES_ENVVAR_WHEN_UNPRIVILEGED
              value: "false"
        devicePlugin:
          enabled: true
          # Helm replaces lists: the first two entries restate the component
          # base. MOFED_ENABLED off because it would mount /dev/infiniband
          # into every GPU pod. The rails below do exist, but only a pod that
          # requests a rail VF should receive the RDMA devices.
          env:
            - name: DP_DISABLE_HEALTHCHECKS
              value: "109"
            - name: DEVICE_LIST_STRATEGY
              value: cdi-cri,cdi-annotations,volume-mounts
            - name: MOFED_ENABLED
              value: "false"

    # components/nvidia-dra-driver-gpu/values.yaml already sets nvidiaDriverRoot
    # to /run/nvidia/driver, which is where gpu-operator puts the driver, so this
    # repeats that value rather than correcting it. Kept as an explicit pin: the
    # kubelet-plugin finding the driver is what makes a ComputeDomain usable, and
    # without that multi-node NVLink silently does not work. gb200-nvke omits it
    # and is not affected.
    - name: nvidia-dra-driver-gpu
      type: Helm
      overrides:
        nvidiaDriverRoot: /run/nvidia/driver

    - name: nfd
      type: Helm
      valuesFile: components/nfd/values-nvidia-nics.yaml
      overrides:
        topologyUpdater:
          enable: true
          # The chart's 60Mi default OOM-kills the topology updater on
          # multi-TiB nodes (exit 137). Taken from vr200-rke2, and it applies
          # for the same reason: these trays report 1.4 TiB.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi

    # Carries a NicClusterPolicy with nicConfigurationOperator, nvIpam and
    # secondaryNetwork. The first stands up the nic-configuration-daemon that
    # `aicr snapshot --discover-network` needs; the other two supply the
    # addressing and the multus attachment the RoCE rails below depend on. No
    # ofedDriver: NVKE runs the host's inbox mlx5_core, and DOCA-OFED must not
    # be installed on these nodes.
    #
    # Pinned to chart 26.7.1 rather than the registry default of 26.7.0. The
    # daemon in 26.7.0 has no firmware-discovery fallback, so a flint failure
    # is fatal, and flint cannot read ConnectX-9 here. Measured on a VR200
    # worker: 26.7.0 dies with "failed to discover NIC devices", 26.7.1 logs
    # "flint failed, falling back to sysfs" and discovers every port. The
    # manifest pins the matching daemon image and says why.
    #
    # The rails below are RoCE, not IB. gb200-nvke's policy and its
    # sriov-ib-networks pair hardcode four ConnectX-7 IB rails per tray, and
    # that shape does not fit here: measured on both workers, all twelve mlx5
    # ports report link_layer Ethernet with RoCE v2 GIDs and not one reports
    # InfiniBand, so linkType IB and SriovIBNetwork do not apply. The two NIC
    # families also differ in VF ceiling: the eight ConnectX-9 ports (dev
    # 0x1025, 200 Gb/s) report sriov_totalvfs 1, while the four 400 Gb/s ports
    # (dev 0xa2df) report 46. The rails take the eight ConnectX-9 ports -- one
    # 0xa2df port is enslaved to the DOCA OVS bridge carrying the node address
    # and the default route, so it cannot be carved.
    - name: network-operator
      type: Helm
      version: "26.7.1"
      valuesFile: components/network-operator/values-nvke-gb200.yaml
      manifestFiles:
        - components/network-operator/manifests/nic-cluster-policy-nvke-vr200.yaml
      dependencyRefs:
        - nfd
        - cert-manager
      overrides:
        # The RoCE rails in sriov-ib-networks are SriovNetworkNodePolicy and
        # SriovNetwork objects, which only the SR-IOV operator reconciles. The
        # maintenance operator has work of its own -- nicConfigurationOperator
        # prepares each node through it before applying NIC configuration.
        sriovNetworkOperator:
          enabled: true
        maintenanceOperator:
          enabled: true

    # Eight ConnectX-9 RoCE rails: per rail an nv-ipam IPPool, a
    # SriovNetworkNodePolicy and a SriovNetwork. The component directory says
    # "ib" because GB200's rails are InfiniBand; its health check asserts the
    # IPPool CRD is Established and every SriovNetworkNodeState syncs, neither
    # of which is link-type specific.
    #
    # NOT VALIDATED: no packet has crossed these rails on the reference
    # cluster, because the spare ConnectX-9 ports have no path between nodes
    # until the DPU bridges them. The manifest header says so in full.
    - name: sriov-ib-networks
      type: Helm
      manifestFiles:
        - components/sriov-ib-networks/manifests/nvke-vr200.yaml
      dependencyRefs:
        - network-operator

    # Scaffolded off. vr200-rke2 ships a Skyhook tuning CR that REBOOTS EVERY
    # GPU NODE it touches, and nodewright-packages has no vr200/nvke profile --
    # its vr200 profiles are service-specific (bcm, rke2). Enabling this with
    # another service's profile would apply that platform's tuning and reboot
    # the trays for it. Same posture as gb200-nvke; enabling later is a
    # one-line change.
    - name: nodewright-customizations
      type: Helm
      overrides:
        enabled: false
      dependencyRefs:
        - nodewright-operator

  validation:
    performance:
      # Measured 2026-11-03 on a 2-node NVKE tenant cluster (2 x 4 VR200,
      # operator driver 615.71.09, nvidia-dra-driver-gpu 25.8.1):
      # all_reduce_perf 1 GiB..16 GiB over MNNVL averaged 996.5 and 996.1 GB/s
      # across two runs, 1040 GB/s peak at 16 GiB, zero mismatches at every
      # size. NCCL logged `NVLS comm ... nvlsRanks 8`, so one NVLS
      # communicator spanned both trays.
      #
      # The floor is the established NVL72 one rather than the measured value,
      # so a different tray pairing does not fail spuriously. It still
      # discriminates what matters: the inter-node Ethernet path here is
      # 400 GbE, a 50 GB/s ceiling, so anything that fell off NVLink could not
      # reach this floor.
      #
      # The -net check is declared, and its floor is a placeholder: nothing
      # has measured RoCE traffic on this platform. A tenant whose DPU does
      # not bridge the spare ConnectX-9 ports has no path for the check to
      # use, and should withhold it for that run with
      # `--skip-check nccl-all-reduce-bw-net` rather than dropping it here.
      #
      # No nccl-benchmark-profile constraint is needed -- this pairing is in
      # the compiled matrix (supportedNCCLCombinations[variantNVLS][nvke]) with
      # its own template at testdata/vr200/nvke/runtime-nvls.yaml.
      checks:
        - nccl-all-reduce-bw-nvls
        - nccl-all-reduce-bw-net
      constraints:
        - name: nccl-all-reduce-bw-nvls
          value: ">= 600"
        # A floor, not a measurement: nothing has run this check. Eight
        # ConnectX-9 ports at 200 Gb/s is 200 GB/s of line rate; 50 is a
        # quarter of that, low enough that a fabric carrying real traffic
        # clears it and high enough that a single-rail or pod-network
        # fallback does not. Replace it with a measured value on the first
        # green run.
        - name: nccl-all-reduce-bw-net
          value: ">= 50"
    deployment:
      checks:
        - operator-health
        - expected-resources
        - gpu-operator-version
        - check-nvidia-smi
      constraints:
        # Gates gpu-operator only. No per-component deployment version check
        # exists for nvidia-dra-driver-gpu, so its version is not asserted.
        - name: Deployment.gpu-operator.version
          value: ">= v26.7.0"
    conformance:
      # gang-scheduling is a v1.36 MUST and KAI comes from the nvke base. An
      # undeclared check renders as "not tested", which never establishes a
      # requirement. vr200-rke2-ubuntu-training declares it too.
      checks:
        - platform-health
        - gpu-operator-health
        - dra-support
        - gang-scheduling
