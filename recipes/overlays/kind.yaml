kind: RecipeMetadata
apiVersion: aicr.run/v1beta2
metadata:
  name: kind

spec:
  # Inherits from base (implicit when spec.base is empty)
  # This recipe contains kind-specific settings for local development/testing

  criteria:
    service: kind

  # Kind-specific constraints
  constraints:
    - name: K8s.server.version
      value: ">= 1.32"

  # gpuStack: where the GPU driver userspace the operands read comes from.
  #
  # Unlike the AKS, GKE-COS and OKE declarations, neither value here carries a
  # distinguishing constraint. ADR-015 asks for one, and those three families
  # can supply it because a cloud control plane labels GPU nodes before
  # anything is deployed (AKS reads the pool's gpu-driver setting, GKE an
  # accelerator label, OKE an addon state). Kind has no control plane to do
  # that: on a fresh cluster no node carries any GPU-identifying label until
  # NFD and the operands themselves run, which is after the point a profile
  # constraint is evaluated. Measured, not assumed: with nvml-mock installed
  # and NFD absent, a Kind node carries no nvidia.com/* or
  # feature.node.kubernetes.io/* GPU label at all.
  #
  # The value is therefore chosen explicitly with --profile gpuStack=<value>,
  # and snapshot-driven generation never infers it. That path is unaffected:
  # BuildRecipeResultWithProfile passes a nil evaluator, so the default value
  # is selected and its constraints, of which there are none, are never
  # evaluated. Recorded here rather than worked around so the asymmetry with
  # the other three families is visible to the next reader.
  profile:
    name: gpuStack
    description: Where the GPU driver userspace the operands read comes from.
    default: nvkind-host
    values:
      # nvkind on a GPU host: the NVIDIA driver and container runtime are
      # installed on the host, and every operand reads them from the host
      # root. These are the values this overlay has always produced; they are
      # stated explicitly rather than left unset so that both profile values
      # assign the same leaf paths, which ADR-015 union totality requires.
      nvkind-host:
        componentRefs:
          - name: gpu-operator
            overrides:
              devicePlugin:
                env: []
              gfd:
                env: []
              dcgmExporter:
                env: []
              validator:
                driver:
                  env:
                    # Real GPUs, real kernel module: the validator can create
                    # the /dev/char symlinks that gpu-operator#430 needs.
                    - name: DISABLE_DEV_CHAR_SYMLINK_CREATION
                      value: "false"
                cuda:
                  env:
                    # Real silicon executes CUDA, so the validator workload runs.
                    - name: WITH_WORKLOAD
                      value: "true"
          - name: nvidia-dra-driver-gpu
            overrides:
              nvidiaDriverRoot: "/"
      # Mokka (NVIDIA/k8s-test-infra) stages a mock libnvidia-ml.so from a
      # DaemonSet, so there is no host driver, no kernel module and no GPU.
      # Each operand is pointed at that staged root instead of the host root.
      # Verified on Kind with ghcr.io/nvidia/mokka-kind-node: every operand
      # reaches 1/1 including nvidia-operator-validator, both nodes advertise
      # nvidia.com/gpu=8, GFD derives the H100 product labels from the mocked
      # NVML, and a pod requesting 9 GPUs stays Pending on
      # "Insufficient nvidia.com/gpu".
      mokka-mock:
        componentRefs:
          - name: gpu-operator
            overrides:
              devicePlugin:
                env:
                  - name: NVIDIA_DRIVER_ROOT
                    value: /var/lib/nvml-mock/driver
              gfd:
                env:
                  - name: NVIDIA_DRIVER_ROOT
                    value: /var/lib/nvml-mock/driver
              dcgmExporter:
                env:
                  - name: NVIDIA_DRIVER_ROOT
                    value: /var/lib/nvml-mock/driver
              validator:
                driver:
                  env:
                    # No kernel module exists to load, so symlink creation
                    # aborts driver-validation with "failed to load module
                    # nvidia: chroot: can't execute '/sbin/modprobe'".
                    # gpu-operator names this exact opt-out in that error.
                    - name: DISABLE_DEV_CHAR_SYMLINK_CREATION
                      value: "true"
                cuda:
                  env:
                    # Mokka simulates the NVML contract, not CUDA execution.
                    # Left on, the validator's vectorAdd fails with "CUDA
                    # driver version is insufficient for CUDA runtime version"
                    # and holds operator-validator at Init:2/4. This is the
                    # boundary of what a mocked lane can claim: scheduling and
                    # discovery are exercised, kernel execution is not.
                    - name: WITH_WORKLOAD
                      value: "false"
          - name: nvidia-dra-driver-gpu
            overrides:
              nvidiaDriverRoot: /var/lib/nvml-mock/driver

  # Kind-specific component overrides
  componentRefs:
    # gpu-operator: configure for kind with GPU passthrough (nvkind)
    # Assumes host has NVIDIA drivers and container toolkit pre-configured
    - name: gpu-operator
      type: Helm
      overrides:
        # hostPaths.driverInstallDir is intentionally NOT overridden here: it
        # inherits the gpu-operator base default /run/nvidia/driver. This is
        # the host path the operator-validator bind-mounts as the
        # driver-validation container's rootfs target — setting it to "/"
        # makes runc reject the mount ("mountpoint is on the top of rootfs"),
        # crash-looping nvidia-operator-validator and stalling ClusterPolicy.
        # nvidia-dra-driver-gpu.nvidiaDriverRoot stays "/" (host-installed
        # driver userspace lives at the host root); the two fields are
        # independent here because gpu-operator manages no driver
        # (driver.enabled: false below). See TestDriverRootLockstep (#1087).
        driver:
          # Disable driver installation - use pre-installed host drivers
          enabled: false
          rdma:
            # Disable RDMA - requires driver kernel modules not available in kind
            enabled: false
        toolkit:
          # Disable toolkit - nvkind pre-configures the host container runtime
          enabled: false
        gdrcopy:
          # Disable GDR copy - requires driver kernel modules not available in kind
          enabled: false
        migManager:
          # Disable MIG manager - requires driver not available in kind
          enabled: false
        dcgm:
          # Disable standalone DCGM hostengine in kind - use embedded exporter
          enabled: false
        # Use the exporter's built-in default metrics in kind — the custom
        # metrics list targets real datacenter GPUs (NVLink/profiling/etc.),
        # most of which are unavailable on the simulated devices kind uses.
        dcgmExporter:
          config:
            create: false
            name: ""
            data: ""
        # Keep GPU Operator operand DaemonSets off kind control-plane nodes.
        # The chart default `daemonsets.tolerations: [{operator: Exists}]`
        # tolerates the control-plane `NoSchedule` taint; combined with NFD
        # labeling the control-plane (shared host kernel exposes the NVIDIA
        # PCI device) and GPU Operator setting `nvidia.com/gpu.deploy.*=true`,
        # operand DaemonSets schedule onto the control-plane where they hang
        # because there's no real device access, keeping ClusterPolicy
        # notReady. Removing the catchall toleration restores the
        # NoSchedule taint as the real exclusion mechanism.
        # Note: per-operand `affinity` (dcgmExporter/devicePlugin/gfd/validator)
        # is not exposed by ClusterPolicy and is silently dropped by the chart,
        # so it cannot be used here.
        daemonsets:
          tolerations: []
        # Reduce resource requests for local development
        operator:
          resources:
            requests:
              cpu: 100m
              memory: 200Mi
            limits:
              cpu: 500m
              memory: 500Mi

    # kube-prometheus-stack: use emptyDir storage (default), reduce resources
    - name: kube-prometheus-stack
      type: Helm
      overrides:
        # CI only needs component health, not the full upstream alerting rule
        # set. Skipping default rules reduces PrometheusRule churn during
        # install on small kind control planes.
        defaultRules:
          create: false
        prometheus:
          prometheusSpec:
            # Smaller storage for local testing
            storageSpec:
              emptyDir:
                medium: ""
                sizeLimit: 5Gi
            # Reduced resources for local development
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                cpu: 1
                memory: 1Gi
            # Shorter retention for local testing
            retention: 7d
        prometheusOperator:
          # Keep operator-owned monitoring custom resources in the monitoring
          # namespace for kind. Do not scope ServiceMonitor discovery here;
          # GPU, Kubeflow, and Dynamo monitors may live in their own namespaces.
          alertmanagerInstanceNamespaces:
            - monitoring
          alertmanagerConfigNamespaces:
            - monitoring
          prometheusInstanceNamespaces:
            - monitoring
          thanosRulerInstanceNamespaces:
            - monitoring
          # CI kind control planes can be slow under image pulls and controller
          # startup. Avoid restarting the operator on short health probe stalls.
          livenessProbe:
            timeoutSeconds: 10
            failureThreshold: 10
          readinessProbe:
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
        grafana:
          enabled: false
        alertmanager:
          alertmanagerSpec:
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 250m
                memory: 256Mi

    # nvsentinel: reduce resources for local development, and assume the
    # host-installed driver.
    #
    # nvkind preinstalls the driver on the host (gpu-operator driver.enabled
    # is false above), so there is no driver pod for the NVSentinel labeler
    # to watch. Without assumeDriverInstalled the
    # nvsentinel.dgxc.nvidia.com/driver.installed label is never applied and
    # metadata-collector plus both syslog-health-monitor DaemonSets sit at
    # zero desired pods — silently, with no error and no event (#2175).
    #
    # Kind's gpuStack profile does not own this path: both of its values
    # assume a driver is already present (host-installed under nvkind, staged
    # by the mock under Mokka), so the value does not vary between them and
    # stays overlay-level. The NVSentinel
    # driver-label bundle gate still rejects bundle-time and declared-dynamic
    # changes that would recreate #2175, but a manual post-generation edit to
    # the rendered Helm values is outside that guarantee.
    - name: nvsentinel
      type: Helm
      overrides:
        labeler:
          assumeDriverInstalled: true
        platformConnector:
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 200m
              memory: 512Mi

    # nodewright-operator: reduce resources for local development
    - name: nodewright-operator
      type: Helm
      overrides:
        controllerManager:
          manager:
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                cpu: 500m
                memory: 1Gi

    # nvidia-dra-driver-gpu: driver root is profile-owned (gpuStack), because
    # it is "/" for a host-installed driver and the staged mock root under
    # Mokka. See spec.profile above.
    - name: nvidia-dra-driver-gpu
      type: Helm

    # network-operator: NVIDIA Network Operator for high-performance networking
    - name: network-operator
      type: Helm
      source: https://helm.ngc.nvidia.com/nvidia
      valuesFile: components/network-operator/values.yaml
      dependencyRefs:
        - nfd
        - cert-manager

  validation:
    conformance:
      checks:
        - platform-health
        - gpu-operator-health
        - dra-support
        - accelerator-metrics
        - ai-service-metrics
