# Automatically generated directly into source by GKE Version Vector Export Engine.
# Authoritative single source of truth resides in GKE Version Vector registry and GCE SoT.

kind: RecipeMetadata
apiVersion: aicr.run/v1alpha2
metadata:
  name: gb300-gke-cos-training-kubeflow

spec:
  # Inherits from gb300-gke-cos-training recipe and layers Kubeflow Training Operator
  base: gb300-gke-cos-training

  criteria:
    service: gke
    accelerator: gb300
    os: cos
    intent: training
    platform: kubeflow

  constraints:
    - name: K8s.server.version
      value: ">= 1.34.3-gke.1318000"

  componentRefs:
    # GKE Distributed Training & RoCE Network Tuning:
    # Configures PyTorch distributed runtime with NCCL debug instrumentation and GDRCopy
    # Level 5 acceleration, leveraging GPUDirect RDMA over RoCE across GKE optical rails.
    - name: kubeflow-trainer
      type: Helm
      valuesFile: components/kubeflow-trainer/values.yaml
      manifestFiles:
        - components/kubeflow-trainer/manifests/torch-distributed-cluster-training-runtime.yaml
      dependencyRefs:
        - cert-manager
        - kube-prometheus-stack
        - gpu-operator
      overrides:
        runtime:
          image: "nvcr.io/nvidia/pytorch:25.01-py3-arm64"
          env:
            - name: NCCL_DEBUG
              value: "INFO"
            - name: NCCL_NET_GDR_LEVEL
              value: "5"
