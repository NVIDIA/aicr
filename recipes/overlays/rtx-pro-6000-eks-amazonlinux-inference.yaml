kind: RecipeMetadata
apiVersion: aicr.run/v1beta1
metadata:
  name: rtx-pro-6000-eks-amazonlinux-inference

spec:
  # Inherits from rtx-pro-6000-eks-inference (RTX PRO 6000 + EKS + inference).
  # This overlay adds AL2023-specific OS constraints and the preinstalled-driver
  # overrides required by the NVIDIA AL2023 AMI family (AL2023_x86_64_NVIDIA).
  base: rtx-pro-6000-eks-inference

  criteria:
    service: eks
    accelerator: rtx-pro-6000
    os: amazonlinux
    intent: inference

  mixins:
    - os-amazonlinux

  constraints:
    - name: K8s.server.version
      value: ">= 1.32.4"

  componentRefs:
    # Assumes the NVIDIA AL2023 AMI family (AL2023_x86_64_NVIDIA / AL2023 ARM
    # NVIDIA): the AMI preinstalls driver and toolkit at the host root. A
    # snapshot cannot establish which AMI a node runs or who owns the driver
    # (GPU.hardware.driver-loaded only detects an unloaded driver), so this
    # leaf is unprofiled; a driverless AMI gets no GPU driver.
    - name: gpu-operator
      type: Helm
      overrides:
        driver: {enabled: false}
        toolkit: {enabled: false}
    - name: nvidia-dra-driver-gpu
      type: Helm
      overrides:
        nvidiaDriverRoot: /
    - name: nvsentinel
      type: Helm
      overrides:
        labeler: {assumeDriverInstalled: true}
        janitor:
          config:
            controllers:
              gpuReset:
                resetJob: {hostDriverRootPath: /}
    # The base wires tuning-generic.yaml (nvidia-tuned only; no nvidia-setup).
    # manifestFiles merge additively, so it cannot be cleared. nvidia-tuned is
    # not validated on AL2023, so the component is disabled and host tuning
    # must come from the AMI.
    - name: nodewright-customizations
      type: Helm
      overrides:
        enabled: false
