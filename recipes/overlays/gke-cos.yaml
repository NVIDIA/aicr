kind: RecipeMetadata
apiVersion: aicr.run/v1alpha3
metadata:
  name: gke-cos

spec:
  # Inherits from base (implicit when spec.base is empty)
  # This recipe contains GKE-COS-specific settings shared by all GKE-COS deployments

  criteria:
    service: gke
    os: cos

  # GKE-specific constraints
  constraints:
    - name: K8s.server.version
      value: ">= 1.28"

  # The GPU stack shape is a configuration profile (ADR-015, issue
  # #1761): one qualified GKE cluster state per value — how the driver is
  # installed and which device plugin advertises nvidia.com/gpu — selected
  # at recipe generation (--profile gpuStack=<value>), recorded in
  # metadata.selectedProfile, and locked at every output boundary. In BOTH
  # values the driver is Google-supplied: the GPU Operator installs no
  # driver on COS (an operator-installed driver is the deferred
  # operator-selfdriver value, issue #1716). This
  # replaces nothing pre-existing — GKE had no qualified alternative before
  # — but the gke-default value makes the previously unsupported
  # "GKE's managed plugin owns nvidia.com/gpu" state declarable, verifiable
  # (issue #1755's node-set constraint form), and coherent with the #1327
  # allocation-policy contract (advertiser: external counts as THE
  # advertiser; the recomputed policy closure locks devicePlugin/DRA
  # selector paths against bundle- and install-time drift).
  #
  # gke-default is the DEFAULT because it is the only value a
  # default-provisioned GKE cluster satisfies with zero setup: GKE's managed
  # driver install (gpu-driver-version=default) is finalized by an init
  # container of the SAME kube-system DaemonSet that the
  # gke-no-default-nvidia-gpu-device-plugin=true label disables, so a fresh
  # labeled pool comes up driverless — "GKE-installed driver + operator
  # plugin" is not a reachable state. The driver-installer value — named
  # after Google's standalone nvidia-driver-installer DaemonSet that
  # supplies the driver under it — therefore requires the label AND that
  # DaemonSet on pools created with gpu-driver-version=disabled; the GPU
  # Operator's device plugin is the sole advertiser.
  #
  # Every leaf GKE-COS overlay inherits this declaration unchanged. The
  # third ADR value (operator-selfdriver, the AICR-owned GKE
  # driver-installer component of issue #1716 — distinct from Google's
  # DaemonSet the driver-installer value is named after) is deliberately
  # NOT declared: it lands together with its
  # durable distinguishing signal (ADR-015 Deferred Decision 5).
  profile:
    name: gpuStack
    description: >-
      GPU stack shape for GKE GPU node pools — how the driver is installed
      and which device plugin advertises nvidia.com/gpu. The driver is
      Google-supplied in both values; the GPU Operator installs no driver
      on COS. "gke-default" (the default) is the default-provisioned
      cluster: GKE's bundled driver install plus GKE's managed device
      plugin as the advertiser (opt-out label absent everywhere), with the
      operator's plugin disabled. "driver-installer" runs the GPU
      Operator's device plugin as the sole advertiser; its verified
      generation-time constraint is that every GPU node carries
      gke-no-default-nvidia-gpu-device-plugin=true (the only durable
      distinguishing signal — ADR-015 DD5). Google's standalone
      nvidia-driver-installer DaemonSet on pools created with
      gpu-driver-version=disabled is the documented operational
      prerequisite that supplies the driver under this value; its
      presence is not qualified at generation — driver presence is
      observed by the deployment-phase validation.
    default: gke-default
    values:
      driver-installer:
        componentRefs:
          - name: gpu-operator
            overrides:
              devicePlugin:
                enabled: true
        constraints:
          - name: NodeTopology.gpu-nodes.label
            value: gke-no-default-nvidia-gpu-device-plugin=true
            remediation: >-
              The driver-installer profile requires the GPU Operator's device
              plugin to be the sole nvidia.com/gpu advertiser, so every GPU
              node pool must carry gke-no-default-nvidia-gpu-device-plugin=true
              at creation (gcloud container node-pools create ...
              --node-labels=gke-no-default-nvidia-gpu-device-plugin=true)
              PLUS Google's standalone nvidia-driver-installer DaemonSet,
              with the pools created gpu-driver-version=disabled. The label
              forfeits GKE's managed driver install — the installer rides
              the same kube-system DaemonSet the label disables — so it
              must NOT be paired with gpu-driver-version=default (labeled
              pools come up driverless). This constraint verifies the
              label only; the installer DaemonSet is an operational
              prerequisite whose effect (a present driver) is observed by
              the deployment-phase validation. See the GKE GPU Setup
              integrator guide (docs/integrator/gke-gpu-setup.md) for the
              full procedure. To use a default-provisioned GKE cluster instead,
              regenerate with the default (--profile gpuStack=gke-default).
      # GKE-installed driver AND GKE's managed device plugin — a
      # default-provisioned GKE cluster (no node label required). The
      # external advertiser is counted as THE nvidia.com/gpu advertiser in
      # the #1327 exactly-one invariant; the resolved policy value stays
      # device-plugin-extended-resource (the policy names the request
      # mechanism, not provider ownership).
      gke-default:
        advertiser: external
        componentRefs:
          - name: gpu-operator
            overrides:
              devicePlugin:
                enabled: false
        constraints:
          - name: NodeTopology.gpu-nodes.label
            value: "!gke-no-default-nvidia-gpu-device-plugin"
            remediation: >-
              The gke-default profile (the default) requires GKE's managed
              device plugin to be the sole nvidia.com/gpu advertiser, so NO
              GPU node may carry the opt-out label
              gke-no-default-nvidia-gpu-device-plugin — the default GKE
              cluster shape, needing zero setup. Remove the label from the
              labeled pools (gcloud container node-pools update ...
              --node-labels=... passing the pool's full label set with the
              label omitted; --node-labels REPLACES the full set), or
              regenerate with --profile gpuStack=driver-installer.

  componentRefs:
    # GKE-COS-specific GPU Operator overrides
    # GKE preinstalls NVIDIA drivers on COS; disable driver installation.
    # The GKE ResourceQuota that admits system-*-critical pods is synthesized
    # by the bundler from registry.yaml (gkeCriticalPriority: true); no
    # manifestFiles entry needed here. Issue #915.
    - name: gpu-operator
      type: Helm
      valuesFile: components/gpu-operator/values-gke-cos.yaml

    # Enable Prometheus persistent storage for GKE (GKE PD CSI is built-in)
    - name: kube-prometheus-stack
      type: Helm
      overrides:
        prometheus:
          prometheusSpec:
            storageSpec:
              emptyDir: null
              volumeClaimTemplate:
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 50Gi

    # GKE has no user-accessible control-plane nodes — remove the default
    # nodeAffinity that requires node-role.kubernetes.io/control-plane
    - name: nvidia-dra-driver-gpu
      type: Helm
      overrides:
        nvidiaDriverRoot: /home/kubernetes/bin/nvidia
        controller:
          affinity:
            nodeAffinity: null

    - name: nodewright-operator
      type: Helm
      overrides:
        controllerManager:
          manager:
            env:
              # GKE COS has a read-only rootfs, so we need to use a different directory
              # /etc is stateless so better represents the flag and history on reboot
              copyDirRoot: /etc/nodewright
              # Because what nodewright does is generally on /etc we need to reapply on reboot
              reapplyOnReboot: "true"

  validation:
    # The #1755 device-plugin ownership gate lives in the gpuStack profile
    # values above (as forecast when it landed here as a readiness
    # constraint): profile constraints join the artifact's constraint set,
    # are verified against the snapshot at generation (snapshot-based
    # generation only; criteria-only generation defers entirely to the
    # pre-flight), and are re-evaluated by the `aicr validate` readiness
    # pre-flight — same fail-closed exit,
    # now symmetric per selected value (positive form for driver-installer,
    # negated for gke-default).
    conformance:
      checks:
        - platform-health
        - gpu-operator-health
        - dra-support
        - accelerator-metrics
        - ai-service-metrics
