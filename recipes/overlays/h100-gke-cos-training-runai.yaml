kind: RecipeMetadata
apiVersion: aicr.run/v1beta1
metadata:
  name: h100-gke-cos-training-runai

spec:
  # PREVIEW: resolves and bundles, and its health check is written, but no
  # live run has produced evidence yet. Qualification on hardware is tracked
  # in NVIDIA/aicr#3302 (Phase 1).
  #
  # Inherits from h100-gke-cos-training (H100 + GKE COS + training settings,
  # qualified on a3-megagpu-8g; see that overlay for the machine-type caveat)
  # and adds the Run:ai cluster side, registered against a control plane the
  # user already runs. The control plane is not installed here.
  # Validation (deployment, performance, conformance) is inherited from
  # h100-gke-cos-training.
  base: h100-gke-cos-training

  criteria:
    service: gke
    accelerator: h100
    os: cos
    intent: training
    platform: runai

  # Run:ai 3.0's support matrix covers upstream Kubernetes 1.35 through 1.37,
  # with GKE following upstream. Tighter than the parent's 1.32 floor.
  # Full precision deliberately: the gpuStack dra value's own ">= 1.35.0"
  # floor intersects this one (#2643), and same-direction bounds at
  # different precisions do not order — ">= 1.35" would reject the dra
  # selection as a precision mismatch. Evaluation is unchanged (versions
  # compare at the lower precision, so 1.35 and 1.35.0 admit the same
  # actuals).
  constraints:
    - name: K8s.server.version
      value: ">= 1.35.0"

  componentRefs:
    # runai-cluster bundles KAI Scheduler 0.18 through its
    # kai-resource-management subchart and its operator owns the scheduler's
    # configuration. It ships the same CRDs and PriorityClasses as AICR's
    # kai-scheduler, so the two cannot coexist (same shape as ocp.yaml).
    # The gang-scheduling conformance check follows the recipe: with
    # runai-cluster declared it exercises runai-scheduler in the runai
    # namespace and runs its test pods in the Run:ai Project namespace named
    # by AICR_RUNAI_PROJECT_NAMESPACE (docs/contributor/validator.md).
    - name: kai-scheduler
      type: Helm
      overrides:
        enabled: false

    # Per-cluster inputs: the control plane URL and cluster UID are --set at
    # bundle time; the bootstrap token is declared with --dynamic and written
    # into cluster-values.yaml at install time. See
    # components/runai-cluster/values.yaml.
    - name: runai-cluster
      type: Helm
      valuesFile: components/runai-cluster/values.yaml
      dependencyRefs:
        - gpu-operator
        - kube-prometheus-stack
        - prometheus-operator-crds
        - cert-manager
