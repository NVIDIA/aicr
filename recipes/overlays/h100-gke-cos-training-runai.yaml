kind: RecipeMetadata
apiVersion: aicr.run/v1beta1
metadata:
  name: h100-gke-cos-training-runai

spec:
  # PREVIEW: resolves and bundles, and its health check is written, but no
  # live run has produced evidence yet. Qualification on hardware is tracked
  # in NVIDIA/aicr#3302 (Phase 1).
  #
  # Inherits from h100-gke-cos-training (H100 + GKE COS + training settings,
  # qualified on a3-megagpu-8g; see that overlay for the machine-type caveat)
  # and adds the Run:ai cluster side, registered against a control plane the
  # user already runs. The control plane is not installed here.
  # Validation (deployment, performance, conformance) is inherited from
  # h100-gke-cos-training.
  base: h100-gke-cos-training

  criteria:
    service: gke
    accelerator: h100
    os: cos
    intent: training
    platform: runai

  # Run:ai 3.0's support matrix covers upstream Kubernetes 1.35 through 1.37,
  # with GKE following upstream. Tighter than the parent's 1.32 floor.
  # Full precision deliberately: the gpuStack dra value's own ">= 1.35.0"
  # floor intersects this one (#2643), and same-direction bounds at
  # different precisions do not order — ">= 1.35" would reject the dra
  # selection as a precision mismatch. Evaluation is unchanged (versions
  # compare at the lower precision, so 1.35 and 1.35.0 admit the same
  # actuals).
  constraints:
    - name: K8s.server.version
      value: ">= 1.35.0"

  componentRefs:
    # runai-cluster bundles KAI Scheduler 0.18 through its
    # kai-resource-management subchart and its operator owns the scheduler's
    # configuration. It ships the same CRDs and PriorityClasses as AICR's
    # kai-scheduler, so the two cannot coexist (same shape as ocp.yaml).
    # The gang-scheduling conformance check follows the recipe: with
    # runai-cluster declared it exercises runai-scheduler in the runai
    # namespace and runs its test pods in the Run:ai Project namespace named
    # by AICR_RUNAI_PROJECT_NAMESPACE (docs/contributor/validator.md).
    - name: kai-scheduler
      type: Helm
      overrides:
        enabled: false

    # Run:ai submits distributed training as kubeflow.org/v1 jobs, so the
    # cluster needs the v1 Training Operator (not Kubeflow Trainer v2, which
    # Run:ai does not speak). Vendored manifests, namespace and Deployment name
    # fixed by what the Run:ai operator looks up; the operator's image tag is
    # mapped to its version in components/runai-cluster/values.yaml. Phase 1.3
    # of #3302.
    - name: kubeflow-training-operator
      type: Helm
      source: ""
      valuesFile: components/kubeflow-training-operator/values.yaml

    # Per-cluster inputs: the control plane URL and cluster UID are --set at
    # bundle time; the bootstrap token is declared with --dynamic and written
    # into cluster-values.yaml at install time. See
    # components/runai-cluster/values.yaml. Ordered after the training
    # operator so the Run:ai operator finds it on its first reconcile instead
    # of reporting the frameworks unavailable until the next one.
    - name: runai-cluster
      type: Helm
      valuesFile: components/runai-cluster/values.yaml
      dependencyRefs:
        - gpu-operator
        - kube-prometheus-stack
        - prometheus-operator-crds
        - cert-manager
        - kubeflow-training-operator

    # NVSentinel quarantine lines up with Run:ai's faulty-GPU-node taint
    # (#3302, Phase 3). Run:ai reports its GPU stack unavailable while a
    # gpu-fractioning daemon (fractiond, mpsd) is expected on a node and not
    # ready there, and a cordon does not take a node out of a DaemonSet. Those
    # daemons tolerate only nvidia.com/gpu (components/runai-cluster/values.yaml),
    # so runai/gpu-fault=true:NoSchedule, the taint Run:ai documents for this
    # case, does. fault-quarantine lifts it together with the cordon once every
    # fault on the node has recovered.
    #
    # Inert as shipped: fault-quarantine renders only once nvsentinel-quarantine
    # or nvsentinel-remediation is composed, and applies no taint in
    # nvsentinel-observe's dry run.
    #
    # Helm replaces lists, so this restates the chart's whole default list
    # (NVSentinel v1.32.0) and adds the taint to each rule set that cordons.
    # The NVCRE rule set does not cordon and keeps its own taint.
    # TestNVSentinelRunaiQuarantineTaintChartRender diffs the list against the
    # chart's.
    #
    # Not yet with nvsentinel-remediation's post-reboot validation, which hands
    # the taint to lifecycle-manager: the taint would have to be listed under
    # lifecycle-manager.config.schedulingGate.taints, and the chart's test Job
    # template writes each listed value unquoted, so "true" reaches the API
    # server as a boolean. CheckNVSentinelPostRemediationValidationCoherent
    # refuses that bundle.
    - name: nvsentinel
      type: Helm
      overrides:
        fault-quarantine:
          ruleSets:
            - enabled: true
              version: "1"
              name: "GPU fatal error ruleset"
              match:
                all:
                  - kind: "HealthEvent"
                    expression: "event.agent == 'gpu-health-monitor' && event.componentClass == 'GPU' && event.isFatal == true"
                  - kind: "Node"
                    expression: >-
                      !('k8saas.nvidia.com/ManagedByNVSentinel' in node.metadata.labels && node.metadata.labels['k8saas.nvidia.com/ManagedByNVSentinel'] == "false") &&
                      !('nvsentinel.dgxc.nvidia.com/managed' in node.metadata.labels && node.metadata.labels['nvsentinel.dgxc.nvidia.com/managed'] == "false")
              cordon:
                shouldCordon: true
              taint:
                key: runai/gpu-fault
                value: "true"
                effect: NoSchedule
            - enabled: true
              version: "1"
              name: "CSP health monitor fatal error ruleset"
              match:
                all:
                  - kind: "HealthEvent"
                    expression: "event.agent == 'csp-health-monitor' && event.checkName == 'CSPMaintenance' && event.isFatal == true"
                  - kind: "Node"
                    expression: >-
                      !('k8saas.nvidia.com/ManagedByNVSentinel' in node.metadata.labels && node.metadata.labels['k8saas.nvidia.com/ManagedByNVSentinel'] == "false") &&
                      !('nvsentinel.dgxc.nvidia.com/managed' in node.metadata.labels && node.metadata.labels['nvsentinel.dgxc.nvidia.com/managed'] == "false")
              cordon:
                shouldCordon: true
              taint:
                key: runai/gpu-fault
                value: "true"
                effect: NoSchedule
            - enabled: true
              version: "1"
              name: "Syslog fatal error ruleset"
              match:
                all:
                  - kind: "HealthEvent"
                    expression: "event.agent == 'syslog-health-monitor' && (event.componentClass == 'GPU' || event.componentClass == 'NIC') && event.isFatal == true"
                  - kind: "Node"
                    expression: >-
                      !('k8saas.nvidia.com/ManagedByNVSentinel' in node.metadata.labels && node.metadata.labels['k8saas.nvidia.com/ManagedByNVSentinel'] == "false") &&
                      !('nvsentinel.dgxc.nvidia.com/managed' in node.metadata.labels && node.metadata.labels['nvsentinel.dgxc.nvidia.com/managed'] == "false")
              cordon:
                shouldCordon: true
              taint:
                key: runai/gpu-fault
                value: "true"
                effect: NoSchedule
            - enabled: true
              version: "1"
              name: "NIC health monitor fatal error ruleset"
              match:
                all:
                  - kind: "HealthEvent"
                    expression: "event.agent == 'nic-health-monitor' && event.isFatal == true"
                  - kind: "Node"
                    expression: >-
                      !('k8saas.nvidia.com/ManagedByNVSentinel' in node.metadata.labels && node.metadata.labels['k8saas.nvidia.com/ManagedByNVSentinel'] == "false") &&
                      !('nvsentinel.dgxc.nvidia.com/managed' in node.metadata.labels && node.metadata.labels['nvsentinel.dgxc.nvidia.com/managed'] == "false")
              cordon:
                shouldCordon: true
              taint:
                key: runai/gpu-fault
                value: "true"
                effect: NoSchedule
            - enabled: true
              version: "1"
              name: "Kubernetes object monitor fatal error ruleset"
              match:
                all:
                  - kind: "HealthEvent"
                    expression: "event.agent == 'kubernetes-object-monitor' && event.isFatal == true"
                  - kind: "Node"
                    expression: >-
                      !('k8saas.nvidia.com/ManagedByNVSentinel' in node.metadata.labels && node.metadata.labels['k8saas.nvidia.com/ManagedByNVSentinel'] == "false") &&
                      !('nvsentinel.dgxc.nvidia.com/managed' in node.metadata.labels && node.metadata.labels['nvsentinel.dgxc.nvidia.com/managed'] == "false")
              cordon:
                shouldCordon: true
              taint:
                key: runai/gpu-fault
                value: "true"
                effect: NoSchedule
            - enabled: true
              version: "1"
              name: "NVCRE certification monitor failure ruleset"
              match:
                all:
                  - kind: "HealthEvent"
                    expression: "event.agent == 'nvcre-certification-monitor' && event.checkName == 'NVCRECertFailed' && event.isFatal == true"
                  - kind: "Node"
                    expression: >-
                      !('k8saas.nvidia.com/ManagedByNVSentinel' in node.metadata.labels && node.metadata.labels['k8saas.nvidia.com/ManagedByNVSentinel'] == "false") &&
                      !('nvsentinel.dgxc.nvidia.com/managed' in node.metadata.labels && node.metadata.labels['nvsentinel.dgxc.nvidia.com/managed'] == "false")
              cordon:
                shouldCordon: false
              taint:
                key: "nvsentinel.dgxc.nvidia.com/nvcre-cert-failed"
                value: "true"
                effect: "NoSchedule"
            - enabled: true
              version: "1"
              name: "Preflight check fatal error ruleset"
              match:
                all:
                  - kind: "HealthEvent"
                    expression: "event.agent.startsWith('preflight-') && event.isFatal == true"
                  - kind: "Node"
                    expression: >-
                      !('k8saas.nvidia.com/ManagedByNVSentinel' in node.metadata.labels && node.metadata.labels['k8saas.nvidia.com/ManagedByNVSentinel'] == "false") &&
                      !('nvsentinel.dgxc.nvidia.com/managed' in node.metadata.labels && node.metadata.labels['nvsentinel.dgxc.nvidia.com/managed'] == "false")
              cordon:
                shouldCordon: true
              taint:
                key: runai/gpu-fault
                value: "true"
                effect: NoSchedule
            - enabled: true
              version: "1"
              name: "Health events analyzer fatal error ruleset"
              match:
                all:
                  - kind: "HealthEvent"
                    expression: "event.agent == 'health-events-analyzer' && event.isFatal == true"
                  - kind: "Node"
                    expression: >-
                      !('k8saas.nvidia.com/ManagedByNVSentinel' in node.metadata.labels && node.metadata.labels['k8saas.nvidia.com/ManagedByNVSentinel'] == "false") &&
                      !('nvsentinel.dgxc.nvidia.com/managed' in node.metadata.labels && node.metadata.labels['nvsentinel.dgxc.nvidia.com/managed'] == "false")
              cordon:
                shouldCordon: true
              taint:
                key: runai/gpu-fault
                value: "true"
                effect: NoSchedule
            - enabled: true
              version: "1"
              name: "MaintenanceRequest ruleset"
              match:
                all:
                  - kind: "HealthEvent"
                    expression: "event.agent == 'lifecycle-manager' && event.metadata != null && 'maintenanceRequestName' in event.metadata"
                  - kind: "Node"
                    expression: >-
                      !('k8saas.nvidia.com/ManagedByNVSentinel' in node.metadata.labels && node.metadata.labels['k8saas.nvidia.com/ManagedByNVSentinel'] == "false") &&
                      !('nvsentinel.dgxc.nvidia.com/managed' in node.metadata.labels && node.metadata.labels['nvsentinel.dgxc.nvidia.com/managed'] == "false")
              cordon:
                shouldCordon: true
              taint:
                key: runai/gpu-fault
                value: "true"
                effect: NoSchedule

    # The GPU Operator's operands tolerate that taint: one that does not is
    # left misscheduled on the node, and the operator's upgrade controller then
    # aborts every driver upgrade in the cluster (#3357). The other two entries
    # restate base.yaml's list, which a list set here replaces.
    - name: gpu-operator
      type: Helm
      overrides:
        daemonsets:
          tolerations:
            - key: runai/gpu-fault
              operator: Exists
              effect: NoSchedule
            - key: nvsentinel.dgxc.nvidia.com/external-remediation
              operator: Exists
              effect: NoSchedule
            - key: nvidia.com/gpu
              operator: Exists
              effect: NoSchedule
