kind: RecipeMetadata
apiVersion: aicr.nvidia.com/v1alpha1
metadata:
  name: lke

spec:
  # Inherits from base (implicit when spec.base is empty)
  # This recipe contains LKE-specific settings shared by all LKE deployments

  criteria:
    service: lke

  # LKE-specific constraints
  # Constraint names use fully qualified measurement paths: {type}.{subtype}.{key}
  constraints:
    - name: K8s.server.version
      value: ">= 1.31"

  # LKE-specific components
  componentRefs:
    # cert-manager: required by gpu-operator and nvsentinel.
    # Not pre-installed on LKE.
    - name: cert-manager
      type: Helm
      source: https://charts.jetstack.io
      version: v1.20.2
      valuesFile: components/cert-manager/values.yaml

    # Restore cert-manager as a dependency for gpu-operator and nvsentinel
    # (removed from base since OKE pre-installs it).
    - name: gpu-operator
      type: Helm
      dependencyRefs:
        - cert-manager

    - name: nvsentinel
      type: Helm
      dependencyRefs:
        - cert-manager

  validation:
    conformance:
      checks:
        - platform-health
        - gpu-operator-health
        - dra-support
        - accelerator-metrics
        - ai-service-metrics
