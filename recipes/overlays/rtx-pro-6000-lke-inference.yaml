kind: RecipeMetadata
apiVersion: aicr.run/v1alpha2
metadata:
  name: rtx-pro-6000-lke-inference

spec:
  # Inherits from lke-inference recipe (LKE + inference settings)
  base: lke-inference

  criteria:
    service: lke
    accelerator: rtx-pro-6000
    intent: inference

  # Specific constraints for RTX PRO 6000 on LKE inference workloads
  # Constraint names use fully qualified measurement paths: {type}.{subtype}.{key}
  constraints:
    - name: K8s.server.version
      value: ">= 1.32"

  componentRefs:
    # RTX PRO 6000 GPU Operator dependencies
    - name: gpu-operator
      type: Helm
      dependencyRefs:
        - nfd
        - cert-manager
        - kube-prometheus-stack

    - name: nfd
      type: Helm
      overrides:
        topologyUpdater:
          enable: true

  validation:
    deployment:
      constraints:
        # Host GPU driver floor for RTX PRO 6000 Blackwell Server Edition.
        #
        # NVIDIA GPU Operator platform support, "NVIDIA RTX PRO 6000 Blackwell
        # Server Edition notes": "Driver versions 575.57.08 or later is
        # required."
        # https://docs.nvidia.com/datacenter/cloud-native/gpu-operator/latest/platform-support.html
        #
        # Akamai documents that its LKE GPU Linodes use RTX PRO 6000 Blackwell
        # Server Edition:
        # https://techdocs.akamai.com/cloud-computing/docs/gpus-on-lke
        # The Server Edition minimum therefore holds for every deeper OS leaf
        # in this LKE chain. It is deliberately NOT keyed to whatever driver
        # the GPU Operator currently pins or to a version observed passing a
        # test run: a shipped version proves sufficiency, not minimality.
        #
        # Placement (issue #2438): deployment constraints merge last-wins by
        # name with no max comparison, and the accelerator wildcard
        # rtx-pro-6000-any is applied BEFORE the service overlays it composes
        # with, so a floor declared there could be silently downgraded by any
        # same-name constraint added later in the chain.
        # This service x intent overlay is the last applied for its own query
        # and sits in the chain of every deeper OS/platform leaf, so the floor
        # reaches them all and cannot be overwritten from above. See
        # TestGPUDriverFloorEffectiveValue and
        # TestGPUDriverFloorPlacementInvariant in pkg/recipe.
        #
        # The check-nvidia-smi check that evaluates this is inherited from
        # rtx-pro-6000-any; declaring the constraint here unions into that
        # phase without dropping the inherited checks.
        - name: Deployment.gpu-driver.version
          value: ">= 575.57.08"
    conformance:
      checks:
        - platform-health
        - gpu-operator-health
        - dra-support
        - accelerator-metrics
        - ai-service-metrics
        - inference-gateway
        - pod-autoscaling
        - cluster-autoscaling
