kind: RecipeMetadata
apiVersion: aicr.run/v1beta1
metadata:
  name: rke2-sles

spec:
  base: rke2

  # RKE2 on SUSE Linux Enterprise Server. Follows the GPU Operator manifest
  # in the RKE2 documentation (docs.rke2.io/add-ons/gpu_operators, default
  # tab), which SUSE documents for SLES: the non-NRI toolkit path and SUSE's
  # signed, precompiled driver containers.
  criteria:
    service: rke2
    os: sles

  mixins:
    - os-sles

  componentRefs:
    # Toolkit path: the rke2 root enables the CDI NRI plugin, which NVIDIA
    # documents as experimental and which deletes the `nvidia` RuntimeClass
    # RKE2 ships. SLES uses the documented non-NRI path instead: the toolkit
    # registers the nvidia runtime through RKE2's containerd socket
    # (CONTAINERD_SOCKET, never CONTAINERD_CONFIG=config.toml.tmpl, which
    # breaks RKE2 on reboot: NVIDIA/gpu-operator#992), so the `nvidia`
    # RuntimeClass stays available to components that request it. The
    # toolkit's containerd reload restarts the RKE2 agent once at install.
    #
    # Driver: SUSE's precompiled containers, selected per node by running
    # kernel (<branch>-<uname -r>-sles<version>). `version` is the driver
    # branch, not a full version; 595 is published for SLES 15 SP7 and
    # SLES 16 on x86_64 and arm64 (default and 64kb kernels). Choose the
    # branch your GPU generation requires. Nodes need the full kernel-default
    # (or kernel-default-64kb) package; kernel-default-base lacks modules the
    # driver container needs. With Secure Boot enabled, set
    # kernelModuleType: open.
    - name: gpu-operator
      type: Helm
      dependencyRefs:
        - nfd
        - cert-manager
        - kube-prometheus-stack
        - nodewright-customizations
      overrides:
        cdi:
          enabled: true
          nriPluginEnabled: false
        toolkit:
          env:
            - name: CONTAINERD_SOCKET
              value: /run/k3s/containerd/containerd.sock
        driver:
          repository: registry.suse.com/third-party/nvidia
          usePrecompiled: true
          version: "595"
        # GPU Operator rejects GDRCopy with precompiled drivers and then
        # creates no driver DaemonSet, so turn off the gdrcopy.enabled: true
        # that components/gpu-operator/values.yaml sets.
        gdrcopy:
          enabled: false

    # NRI is off on this path, so metadata-collector must not use the NRI
    # plugin mode the rke2 root turns on: no NRI plugin injects its management
    # device here. It takes the `nvidia` RuntimeClass the toolkit registers
    # instead, the pairing recipes/overlays/rke2.yaml documents.
    - name: nvsentinel
      type: Helm
      overrides:
        metadata-collector:
          nriPlugin:
            enabled: false

    # Node tuning: the nvidia-tuned "generic" profile (CPU governor and
    # sysctls), the baseline for a coordinate that pins no accelerator.
    # tuned 1.4.0 (nvidia-tuned 0.10.1+) is the first release that installs
    # on SLES. No service is set: service=rke2 enables nvidia-tuned's
    # bootloader step, which supports only Debian-family GRUB, and the
    # generic profile carries no [bootloader] settings to apply.
    # tuning-generic.yaml selects nodes only through
    # --accelerated-node-selector. RKE2 server (etcd) nodes are cluster
    # nodes, so without that flag they are tuned and rebooted too.
    - name: nodewright-customizations
      type: Helm
      manifestFiles:
        - components/nodewright-customizations/manifests/tuning-generic.yaml
      overrides:
        accelerator: generic
      dependencyRefs:
        - nodewright-operator
