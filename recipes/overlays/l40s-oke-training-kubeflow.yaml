kind: RecipeMetadata
apiVersion: aicr.run/v1beta1
metadata:
  name: l40s-oke-training-kubeflow

spec:
  # Inherits from l40s-oke-training recipe (L40S + OKE + Oracle Linux + training settings)
  # This overlay adds Kubeflow Trainer for distributed training with TrainJob
  base: l40s-oke-training

  criteria:
    service: oke
    accelerator: l40s
    os: ol
    intent: training
    platform: kubeflow

  # No OS mixin: the OKE Oracle Linux constraints come from the oke-ol root,
  # and there is no os-ol mixin.
  mixins:
    - platform-kubeflow

  # L40S + OKE specific constraints; kept aligned with l40s-oke-training.
  constraints:
    - name: K8s.server.version
      value: ">= 1.32"
    # Snapshot resolution checks only a leaf's own constraints, so this leaf
    # declares the add-on gate itself.
    - name: K8s.oke-addons.nvidia-network-operator
      value: absent
      remediation: >-
        Oracle's NvidiaNetworkOperator cluster add-on is present on this
        cluster, but this recipe deploys AICR's network-operator component,
        and two controllers would reconcile the same NicClusterPolicy. Remove
        the add-on with `oci ce cluster disable-addon --cluster-id
        <cluster-ocid> --addon-name NvidiaNetworkOperator
        --is-remove-existing-add-on true`, then recapture the snapshot with
        aicr snapshot --oke-addons <path to `oci ce cluster list-addons
        --cluster-id <cluster-ocid> --all --output json` dump>.

  componentRefs: []

  validation:
    conformance:
      checks:
        - robust-controller
        - secure-accelerator-access
