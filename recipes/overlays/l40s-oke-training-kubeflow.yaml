kind: RecipeMetadata
apiVersion: aicr.run/v1beta1
metadata:
  name: l40s-oke-training-kubeflow

spec:
  # Inherits from l40s-oke-training recipe (L40S + OKE + Oracle Linux + training settings)
  # This overlay adds Kubeflow Trainer for distributed training with TrainJob
  base: l40s-oke-training

  criteria:
    service: oke
    accelerator: l40s
    os: ol
    intent: training
    platform: kubeflow

  # No OS mixin: the OKE Oracle Linux constraints come from the oke-ol root,
  # and there is no os-ol mixin.
  mixins:
    - platform-kubeflow

  # L40S + OKE specific constraints; kept aligned with l40s-oke-training.
  constraints:
    - name: K8s.server.version
      value: ">= 1.32"

  componentRefs: []

  validation:
    conformance:
      # Union-merged onto the checks inherited from l40s-oke-training.
      # robust-controller routes to checkRobustKubeflowTrainer only on leaves
      # that resolve kubeflow-trainer, so it is declared here rather than on
      # the plain training base (where it would skip for want of an AI operator).
      checks:
        - robust-controller
