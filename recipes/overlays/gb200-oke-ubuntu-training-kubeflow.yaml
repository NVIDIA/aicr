kind: RecipeMetadata
apiVersion: aicr.run/v1beta1
metadata:
  name: gb200-oke-ubuntu-training-kubeflow

spec:
  # Inherits from gb200-oke-ubuntu-training recipe (GB200 + OKE + Ubuntu + training settings)
  # This overlay adds Kubeflow Training Operator for distributed training with TrainJob
  base: gb200-oke-ubuntu-training

  criteria:
    service: oke
    accelerator: gb200
    os: ubuntu
    intent: training
    platform: kubeflow

  # Ubuntu OS constraints + Kubeflow trainer via mixins
  mixins:
    - os-ubuntu
    - platform-kubeflow

  # Constraints for GB200 on OKE with Ubuntu for Kubeflow training workloads
  constraints:
    # GB200 NVLS performance validation needs the GA resource.k8s.io/v1 DRA
    # API (Kubernetes 1.34+); keep this leaf aligned with gb200-oke-training.
    - name: K8s.server.version
      value: ">= 1.34"
    # Snapshot resolution checks only a leaf's own constraints, so this leaf
    # declares the add-on gate itself.
    - name: K8s.oke-addons.nvidia-network-operator
      value: absent
      remediation: >-
        Oracle's NvidiaNetworkOperator cluster add-on is present on this
        cluster, but this recipe deploys AICR's network-operator component,
        and two controllers would reconcile the same NicClusterPolicy. If the
        reading is addon-deleting, a removal is already in progress, so wait
        for it to finish. Otherwise, remove the add-on with `oci ce cluster
        disable-addon --cluster-id <cluster-ocid> --addon-name
        NvidiaNetworkOperator --is-remove-existing-add-on true`. Once the
        removal finishes, recapture the snapshot with aicr snapshot
        --oke-addons <path to `oci ce cluster list-addons --cluster-id
        <cluster-ocid> --all --output json` dump>.

  componentRefs: []

  validation:
    conformance:
      checks:
        - robust-controller
