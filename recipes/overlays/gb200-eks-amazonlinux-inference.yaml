kind: RecipeMetadata
apiVersion: aicr.run/v1beta2
metadata:
  name: gb200-eks-amazonlinux-inference

spec:
  # Inherits from gb200-eks-inference recipe (GB200 + EKS + inference settings).
  # This overlay adds AL2023-specific OS constraints and the preinstalled-driver
  # profile required by the NVIDIA AL2023 AMI family (AL2023 ARM NVIDIA) used
  # by P6e-GB200 UltraServer instances.
  base: gb200-eks-inference

  criteria:
    service: eks
    accelerator: gb200
    os: amazonlinux
    intent: inference

  mixins:
    - os-amazonlinux

  constraints:
    # AWS does not support P6e-GB200 UltraServer instances on EKS versions
    # before 1.33; this floor is higher than the base chain's 1.32.4.
    - name: K8s.server.version
      value: ">= 1.33"

  # See h100-eks-amazonlinux-inference.yaml for the full profile rationale.
  profile:
    name: gpuStack
    description: >-
      Who installs the GPU driver and container toolkit on EKS AL2023 GPU
      nodes. "ami-preinstalled" (the default) is the NVIDIA AL2023 AMI
      family (AL2023 ARM NVIDIA) used by P6e-GB200: the AMI pre-installs
      driver and toolkit at the host root; the GPU Operator installs neither.
      "operator-managed" is a BYO driverless AMI: the GPU Operator installs
      driver and toolkit, and the DRA driver reads the operator install path.
    default: ami-preinstalled
    values:
      ami-preinstalled:
        componentRefs:
          - name: gpu-operator
            overrides:
              driver: {enabled: false}
              toolkit: {enabled: false}
          - name: nvidia-dra-driver-gpu
            overrides:
              nvidiaDriverRoot: /
          - name: nvsentinel
            overrides:
              labeler: {assumeDriverInstalled: true}
      operator-managed:
        componentRefs:
          - name: gpu-operator
            overrides:
              driver: {enabled: true}
              toolkit: {enabled: true}
          - name: nvidia-dra-driver-gpu
            overrides:
              nvidiaDriverRoot: /run/nvidia/driver
          - name: nvsentinel
            overrides:
              labeler: {assumeDriverInstalled: false}

  componentRefs:
    - name: nvsentinel
      type: Helm

    # AL2023 is not a Debian/Ubuntu OS — nvidia-setup does not support it.
    # Override the nodewright-customizations inherited from the base chain
    # (which would apply tuning.yaml and run nvidia-setup-kernel and
    # nvidia-setup-full) with no-op.yaml so no nvidia-setup packages run.
    # nvidia-tuned support for AL2023 is not yet validated; no tuning manifest
    # is applied until OS coverage is confirmed.
    - name: nodewright-customizations
      type: Helm
      manifestFiles:
        - components/nodewright-customizations/manifests/no-op.yaml
      dependencyRefs:
        - nodewright-operator
