# DGX Spark (one GB10 GPU) on NVKE, at intent inference: the GPU stack of
# gb10-nvke-ubuntu-training plus the Gateway API surface. DGX OS is Ubuntu
# 24.04 with the NVIDIA driver pre-installed.
#
# SCOPE: the Gateway API inference surface, not model serving. Like every other
# AICR `-inference` recipe this declares agentgateway and nothing that serves a
# model; serving is gb10-nvke-ubuntu-inference-dynamo.
#
# DCGM does not support GB10: DCGM, dcgm-exporter and NVSentinel's GPU health
# monitor are off, and no declared check reads DCGM. No performance block:
# nothing has measured serving throughput on this coordinate.
kind: RecipeMetadata
apiVersion: aicr.run/v1beta1
metadata:
  name: gb10-nvke-ubuntu-inference

spec:
  base: nvke

  criteria:
    service: nvke
    accelerator: gb10
    os: ubuntu
    intent: inference

  mixins:
    - os-ubuntu

  constraints:
    # Restated from nvke: snapshot resolution checks a leaf's own constraints.
    - name: K8s.server.version
      value: ">= 1.34"

  componentRefs:
    # gpu-operator, nvidia-dra-driver-gpu and nvsentinel repeat
    # gb10-nvke-ubuntu-training; change them together.
    - name: gpu-operator
      type: Helm
      overrides:
        # GPUDirect RDMA and GDRCopy are not supported on DGX Spark.
        gdrcopy:
          enabled: false
        driver:
          enabled: false
        toolkit:
          enabled: true
          # Operator-managed, as in gb200-nvke: NVKE's containerd needs the
          # file config source, and only GPU allocations may reach the GPU.
          env:
            - name: RUNTIME_CONFIG_SOURCE
              value: file
            - name: ACCEPT_NVIDIA_VISIBLE_DEVICES_ENVVAR_WHEN_UNPRIVILEGED
              value: "false"
        devicePlugin:
          enabled: true
          # Helm replaces lists: the first two entries restate the component
          # base. No RDMA path, so no /dev/infiniband in GPU pods.
          env:
            - name: DP_DISABLE_HEALTHCHECKS
              value: "109"
            - name: DEVICE_LIST_STRATEGY
              value: cdi-cri,cdi-annotations,volume-mounts
            - name: MOFED_ENABLED
              value: "false"
        dcgm:
          enabled: false
        dcgmExporter:
          enabled: false

    # The driver lives on the host, not under /run/nvidia/driver.
    - name: nvidia-dra-driver-gpu
      type: Helm
      overrides:
        nvidiaDriverRoot: /

    # No driver pod for the labeler to watch, and the GPU health monitor
    # needs DCGM.
    - name: nvsentinel
      type: Helm
      overrides:
        labeler:
          assumeDriverInstalled: true
        global:
          gpuHealthMonitor:
            enabled: false
        # Inert unless nvsentinel-remediation enables janitor. The reset Job
        # reads the host driver, and waits only for operands this leaf runs.
        janitor:
          config:
            controllers:
              gpuReset:
                resetJob:
                  hostDriverRootPath: /
                serviceManager:
                  name: gpu-operator
                  spec:
                    namespace: gpu-operator
                    teardownTimeout: 5m
                    restoreTimeout: 10m
                    apps:
                      - appSelector: {app: nvidia-device-plugin-daemonset}
                        nodeLabel: nvidia.com/gpu.deploy.device-plugin
                        enabledValue: "true"
                        disabledValue: "false"
                      - appSelector: {app: gpu-feature-discovery}
                        nodeLabel: nvidia.com/gpu.deploy.gpu-feature-discovery
                        enabledValue: "true"
                        disabledValue: "false"

    # The Gateway API surface, in the shape vr200-nvke-ubuntu-inference
    # declares it. aicr credits only a Gateway the recipe declares, so these
    # must be declared here and not merely installed on the cluster.
    #
    # NVKE provisions no LoadBalancer controller. Without a bare-metal LB, build
    # the bundle with `--set agentgateway:serviceType=ClusterIP`; otherwise the
    # Service sits at EXTERNAL-IP <pending>. Reachability only: the
    # inference-gateway check gates on ready endpoints, not an external address.
    - name: agentgateway-crds
      type: Helm
      source: oci://cr.agentgateway.dev/charts
      valuesFile: components/agentgateway-crds/values.yaml
      manifestFiles:
        - components/agentgateway-crds/manifests/gateway-api-crds.yaml
        - components/agentgateway-crds/manifests/inference-extension-crds.yaml

    - name: agentgateway
      type: Helm
      source: oci://cr.agentgateway.dev/charts
      valuesFile: components/agentgateway/values.yaml
      manifestFiles:
        - components/agentgateway/manifests/inference-gateway.yaml
      dependencyRefs:
        - agentgateway-crds
        - cert-manager
        - prometheus-operator-crds

  validation:
    deployment:
      checks:
        - operator-health
        - expected-resources
        - gpu-operator-version
        - check-nvidia-smi
      constraints:
        # Bundles device plugin v0.18.0, which ignores GB10's unsupported
        # NVML memory query.
        - name: Deployment.gpu-operator.version
          value: ">= v25.10.0"
    conformance:
      # No gpu-operator-health or accelerator-metrics: both need DCGM. No
      # pod-autoscaling: it scales a one-GPU pod to two replicas, and a Spark
      # has one GPU.
      checks:
        - platform-health
        - dra-support
        - ai-service-metrics
        - gang-scheduling
        - inference-gateway
        - secure-accelerator-access
        - driver-runtime-management
