kind: RecipeMetadata
apiVersion: aicr.run/v1beta1
metadata:
  name: rtx-pro-6000-lke-ubuntu-training-kubeflow

spec:
  # Inherits from rtx-pro-6000-lke-ubuntu-training recipe (RTX PRO 6000 + LKE + Ubuntu + training settings)
  # This overlay adds Kubeflow Trainer for distributed training with TrainJob
  base: rtx-pro-6000-lke-ubuntu-training

  criteria:
    service: lke
    accelerator: rtx-pro-6000
    os: ubuntu
    intent: training
    platform: kubeflow

  # Ubuntu OS constraints + Kubeflow platform via mixins
  mixins:
    - os-ubuntu
    - platform-kubeflow

  # RTX PRO 6000 + LKE specific constraints (not covered by mixin)
  constraints:
    - name: K8s.server.version
      value: ">= 1.32"

  componentRefs: []

  validation:
    conformance:
      # Union-merged onto the checks inherited from rtx-pro-6000-lke-training.
      # robust-controller routes to checkRobustKubeflowTrainer only on leaves
      # that resolve kubeflow-trainer, so it is declared here rather than on
      # the plain training base (where it would skip for want of an AI operator).
      checks:
        - robust-controller
