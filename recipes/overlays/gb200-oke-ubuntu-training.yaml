kind: RecipeMetadata
apiVersion: aicr.run/v1beta1
metadata:
  name: gb200-oke-ubuntu-training

spec:
  # Inherits from gb200-oke-training recipe (GB200 + OKE + training settings)
  # This overlay adds Ubuntu-specific configurations
  base: gb200-oke-training

  criteria:
    service: oke
    accelerator: gb200
    os: ubuntu
    intent: training

  # Ubuntu OS constraints via mixin
  mixins:
    - os-ubuntu

  # Constraints for GB200 on OKE with Ubuntu for training workloads
  constraints:
    # This leaf redeploys the OKE fabric inherited from gb200-oke-training;
    # restate its ownership tripwire because snapshot qualification evaluates
    # the selected maximal leaf's own constraints.
    - name: K8s.oke-addons.nvidia-network-operator
      value: absent
      remediation: >-
        Oracle's NvidiaNetworkOperator add-on is enabled on this OKE cluster,
        but this recipe deploys AICR's network-operator. Remove the add-on and
        recapture the OKE add-on projection before qualifying the recipe.
    # GB200 NVLS performance validation needs the GA resource.k8s.io/v1 DRA
    # API (Kubernetes 1.34+); keep this leaf aligned with gb200-oke-training.
    - name: K8s.server.version
      value: ">= 1.34"

  componentRefs: []

  validation:
    conformance:
      checks:
        - secure-accelerator-access
