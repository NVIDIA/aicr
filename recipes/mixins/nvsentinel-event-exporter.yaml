# Turns on NVSentinel's Event Exporter, which watches the datastore and posts
# each health event to an external HTTP endpoint as a CloudEvent, with an
# OIDC client-credentials token. Delivery is at-least-once: the receiver must
# tolerate duplicates. See docs/user/component-catalog.md#health-event-export.
#
# Needs the datastore, so compose it with nvsentinel-observe, -quarantine or
# -remediation. No overlay composes it: the sink, the identity provider and
# the cluster's identity are per deployment, so they come from the bundle
# command:
#
#   --set nv-sentinel:event-exporter.exporter.sink.endpoint=<https URL>
#   --set nv-sentinel:event-exporter.exporter.oidc.tokenUrl=<https URL>
#   --set nv-sentinel:event-exporter.exporter.oidc.clientId=<client>
#   --set nv-sentinel:event-exporter.exporter.oidc.scope=<scope>
#   --set nv-sentinel:event-exporter.exporter.metadata.cluster=<cluster>
#   --set nv-sentinel:event-exporter.exporter.metadata.environment=<environment>
#
# The client secret is not a value: create the Secret named by oidcSecretName,
# with key oidc-client-secret, in the nvsentinel namespace before deploying.
# CheckNVSentinelEventExporterCoherent rejects a bundle missing any of these
# values, and CheckNVSentinelRemediationPipelineCoherent one without a
# datastore.

kind: RecipeMixin
apiVersion: aicr.run/v1beta1
metadata:
  name: nvsentinel-event-exporter
spec:
  componentRefs:
    - name: nvsentinel
      overrides:
        global:
          eventExporter:
            enabled: true
        event-exporter:
          # The Secret the operator creates before deploying; the chart only
          # mounts it.
          oidcSecretName: event-exporter-oidc-secret
          exporter:
            sink:
              insecureSkipVerify: false
            oidc:
              insecureSkipVerify: false
            # Actionable faults and recoveries. Drops unhealthy events that
            # recommend no action, which are most of the stream; recoveries
            # also recommend NONE, so they are kept by isHealthy.
            filter:
              expression: "event.recommendedAction != 'NONE' || event.isHealthy == true"
