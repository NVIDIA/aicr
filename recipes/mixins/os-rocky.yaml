# os-rocky mixin: OS constraints for Rocky Linux GPU nodes.
#
# The floor is Rocky Linux 9; Rocky 8 left active support in May 2024. The
# GPU Operator tags Rocky driver images by major version (rocky9, rocky10),
# and nvcr.io/nvidia/driver publishes both for the pinned driver, so no
# driver override is needed.
#
# Component overrides live in the service+os overlay (e.g. rke2-rocky), not
# here: mixins may only set registry-allowlisted override paths.

kind: RecipeMixin
apiVersion: aicr.run/v1beta1
metadata:
  name: os-rocky

spec:
  constraints:
    - name: OS.release.ID
      value: rocky
    - name: OS.release.VERSION_ID
      value: ">= 9.0"
