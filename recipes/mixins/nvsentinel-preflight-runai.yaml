# Opt-in companion of nvsentinel-preflight for a leaf that declares
# runai-cluster: compose both. The preflight controller resolves the PodGroup
# CRD at startup and exits without it, and on a Run:ai leaf runai-cluster
# installs that CRD while kai-scheduler is declared disabled, which prunes the
# kai-scheduler edge nvsentinel-preflight adds. This mixin adds the edge that
# orders nvsentinel after runai-cluster instead.
#
# It is separate because a dependency on an undeclared component fails recipe
# resolution, so the edge cannot live in nvsentinel-preflight, which composes
# onto leaves without runai-cluster. The edge runs from core to ops, as the
# kai-scheduler one does, so a recipe that composes it cannot use --split
# (ADR-018). CheckNVSentinelPreflightGangSchedulerRequired blocks a Run:ai
# bundle that enables preflight without it.

kind: RecipeMixin
apiVersion: aicr.run/v1beta1
metadata:
  name: nvsentinel-preflight-runai
spec:
  componentRefs:
    - name: nvsentinel
      dependencyRefs:
        - runai-cluster
