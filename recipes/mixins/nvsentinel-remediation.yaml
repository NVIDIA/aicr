# Opt-in mixin, step 3 of 3 of NVSentinel remediation: after cordon and
# drain, the node is repaired. The drain evicts nothing, as in
# nvsentinel-quarantine, so repair waits for the node's user pods to finish.
# A recoverable GPU fault (COMPONENT_RESET) resets that GPU in place;
# RESTART_VM and RESTART_BM reboot the node through a privileged Job running
# `chroot /host reboot` (janitor-provider's generic provider, whose image
# this mixin pins). REPLACE_VM needs a CSP provider and is not
# covered. No shipped recipe composes it. See
# docs/user/component-catalog.md#graded-remediation.
#
# Mutually exclusive with nvsentinel-observe and nvsentinel-quarantine.
# Adds the same Percona datastore as nvsentinel-observe, with the same
# prerequisites, and needs metadata-collector for the GPU UUID a reset is
# scoped to (CheckNVSentinelRemediationPipelineCoherent).

kind: RecipeMixin
apiVersion: aicr.run/v1beta1
metadata:
  name: nvsentinel-remediation
spec:
  componentRefs:
    - name: nvsentinel
      dependencyRefs:
        - nvsentinel-mongodb
      overrides:
        # The GPU and syslog monitors are the event sources this step acts
        # on. Pinned rather than left to the chart default, so a chart bump
        # cannot silently stop or start node-mutating events.
        gpu-health-monitor:
          processingStrategy: EXECUTE_REMEDIATION
        syslog-health-monitor:
          processingStrategy: EXECUTE_REMEDIATION
        global:
          dryRun: false
          # NVSentinel's datastore is the separately bundled Percona cluster
          # below (nvsentinel-mongodb), reached as an external datastore with
          # x509 client auth. The ops DN equals the app DN so the setup Job's
          # user lookup finds the user the operator created.
          certificateRotationEnabled: true
          datastore:
            provider: mongodb
            credentialsFromSecret:
              name: nvsentinel-mongodb-uri
            connection:
              database: HealthEventsDatabase
            tls:
              enabled: true
            auth:
              mechanism: x509
              clientCertSecretName: nvsentinel-mongodb-app-client
              x509ApplicationUserDN: "CN=mongo-user-client,OU=DGXC,O=Nvidia,L=SantaClara,ST=California,C=US"
              x509DgxcopsUserDN: "CN=mongo-user-client,OU=DGXC,O=Nvidia,L=SantaClara,ST=California,C=US"
            setupJob:
              image:
                repository: docker.io/percona/percona-server-mongodb
                tag: "8.0.26-11@sha256:53f89c001997627554e6afc0feb5906209ba109f4f98c62f2ca8456c214af60c"
          faultQuarantine:
            enabled: true
          nodeDrainer:
            enabled: true
          faultRemediation:
            enabled: true
          janitor:
            enabled: true
          janitorProvider:
            enabled: true
        # The chart maps COMPONENT_RESET to RebootNode, rebooting the whole
        # node for a fault a GPU reset clears. This resets just that GPU, as
        # upstream's values-remediation.yaml does; the template key drops the
        # .yaml suffix because mixin keys may not contain a dot. The {{ }}
        # placeholders are filled in by fault-remediation, not Helm.
        #
        # The chart default 0 retries a failing repair without limit, which
        # upstream reserves for clusters that watch remediation-failed by other
        # means; AICR ships no such watch. 3 is upstream's documented example.
        fault-remediation:
          maxRemediationAttempts: 3
          maintenance:
            actions:
              COMPONENT_RESET:
                apiGroup: "janitor.dgxc.nvidia.com"
                version: "v1alpha1"
                kind: "GPUReset"
                scope: "Cluster"
                completeConditionType: "Complete"
                templateFileName: "gpureset"
                equivalenceGroup: "reset"
                impactedEntityScope: "GPU_UUID"
                supersedingEquivalenceGroups: ["restart"]
            templates:
              gpureset: |
                apiVersion: {{ .ApiGroup }}/{{ .Version }}
                kind: GPUReset
                metadata:
                  name: maintenance-{{ .HealthEvent.NodeName }}-{{ .HealthEventID }}
                spec:
                  nodeName: {{ .HealthEvent.NodeName }}
                  selector:
                    uuids:
                      - {{ .ImpactedEntityScopeValue }}
        # The chart's reboot Job image is tag-only busybox 1.37.0; this is the
        # digest-pinned busybox AICR already ships. It reaches janitor-provider
        # as an env var, which `aicr mirror` cannot discover.
        janitor-provider:
          csp:
            generic:
              rebootImage: "docker.io/library/busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e"
    - name: psmdb-operator
      type: Helm
      valuesFile: components/psmdb-operator/values.yaml
    - name: nvsentinel-mongodb
      type: Helm
      valuesFile: components/nvsentinel-mongodb/values.yaml
      dependencyRefs:
        - psmdb-operator
        - cert-manager
      # The registry check plus every Deployment this step enables, all
      # positive, so aicr validate fails when one is missing.
      healthCheckAsserts: |
        apiVersion: chainsaw.kyverno.io/v1alpha1
        kind: Test
        metadata:
          name: nvsentinel-mongodb-remediation-health
        spec:
          timeouts:
            assert: 5m
          steps:
            - try:
                - assert:
                    resource:
                      apiVersion: psmdb.percona.com/v1
                      kind: PerconaServerMongoDB
                      metadata:
                        name: nvsentinel-mongodb
                        namespace: nvsentinel
                      status:
                        state: ready
                # readyReplicas is omitempty, hence the null-coalescing.
                - assert:
                    resource:
                      apiVersion: apps/v1
                      kind: StatefulSet
                      metadata:
                        name: nvsentinel-mongodb-rs0
                        namespace: nvsentinel
                      (spec.replicas > `0` && (status.readyReplicas || `0`) == spec.replicas): true
                - assert:
                    resource:
                      apiVersion: cert-manager.io/v1
                      kind: Certificate
                      metadata:
                        name: nvsentinel-mongodb-app-client
                        namespace: nvsentinel
                      status:
                        (conditions[?type == 'Ready' && status == 'True'] | length(@) > `0`): true
                - assert:
                    resource:
                      apiVersion: v1
                      kind: Secret
                      metadata:
                        name: nvsentinel-mongodb-uri
                        namespace: nvsentinel
                      (keys(data)[?@ == 'MONGODB_URI'] | length(@) == `1`): true
                - assert:
                    resource:
                      apiVersion: apps/v1
                      kind: Deployment
                      metadata:
                        name: fault-quarantine
                        namespace: nvsentinel
                      status:
                        (availableReplicas > `0`): true
                - assert:
                    resource:
                      apiVersion: apps/v1
                      kind: Deployment
                      metadata:
                        name: node-drainer
                        namespace: nvsentinel
                      status:
                        (availableReplicas > `0`): true
                - assert:
                    resource:
                      apiVersion: apps/v1
                      kind: Deployment
                      metadata:
                        name: fault-remediation
                        namespace: nvsentinel
                      status:
                        (availableReplicas > `0`): true
                - assert:
                    resource:
                      apiVersion: apps/v1
                      kind: Deployment
                      metadata:
                        name: janitor
                        namespace: nvsentinel
                      status:
                        (availableReplicas > `0`): true
                - assert:
                    resource:
                      apiVersion: apps/v1
                      kind: Deployment
                      metadata:
                        name: janitor-provider
                        namespace: nvsentinel
                      status:
                        (availableReplicas > `0`): true
