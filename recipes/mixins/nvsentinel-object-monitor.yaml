# Opt-in mixin: turns on NVSentinel's Kubernetes Object Monitor with the two
# policies from NVSentinel's docs/monitoring-critical-operators.md that watch
# GPU Operator and Network Operator DaemonSet pods. Off by default in every
# shipped recipe. See docs/user/component-catalog.md#kubernetes-object-monitor.
#
# NAMESPACES DIFFER FROM UPSTREAM. Each policy matches two, because this
# repo deploys these components to two different namespaces depending on the
# OS mixin: `gpu-operator`/`network-operator` normally (the latter as
# `nvidia-network-operator`, not upstream's hardcoded `network-operator`),
# and `privileged-`-prefixed variants under os-talos. A policy naming only
# one would silently never fire on the other -- the failure this mixin
# exists to avoid. The namespace tests read both the registry and os-talos
# so a rename in either fails them rather than going quiet.
#
# Consequently `resource.namespace` is NOT set (it takes a single namespace),
# so the informer watches Pods cluster-wide, as upstream's own policies do.
#
# OPERATOR IDENTITY IS REQUIRED, AND IT DIFFERS BETWEEN THE TWO. Namespace plus
# "owned by some DaemonSet" is not enough: any unrelated DaemonSet an admin runs
# in these namespaces would, once unhealthy for 30m, raise a fatal event blaming
# the operator. Each policy therefore also requires a label that only that
# operator's own operands carry. They are not the same label, and neither was
# guessable -- both were read off live deployments at the versions this repo
# pins:
#
#   gpu-operator v26.7.0      app.kubernetes.io/managed-by = gpu-operator
#                             Confirmed on a live EKS H100 cluster: all 9 operand
#                             DaemonSets including driver, toolkit and dcgm, and
#                             the running Pods inherit it. The bundled NFD
#                             subchart does not carry it and is out of scope.
#   network-operator 26.4.1   ds-owner = NicClusterPolicy
#                             Kind-only, and the label is per-operand rather than
#                             universal: mofed + rdma-shared-dp carry it,
#                             nv-ipam-node does not. So coverage depends on which
#                             NicClusterPolicy a recipe ships -- the oke-l40s one
#                             enables none of the verified operands. Under-match,
#                             the safe direction, but weaker than the GPU side.
#                             See docs/user/component-catalog.md for the table.
#
# A bump that changes either label makes the policy match nothing, and nothing
# here can observe that -- the labels come from the operators' controllers, not
# from a chart AICR renders. So each label is bound to the version it was read
# at: TestObjectMonitorOperandIdentityPinnedToVerifiedVersion fails when either
# component is bumped in recipes/registry.yaml, forcing revalidation first.
#
# isFatal: true is deliberate, not inherited. With no quarantine component
# enabled in this repo it only produces a node condition today; once
# remediation lands (#1014) these policies would drive a real cordon/drain,
# correct for a node that can no longer run GPU or RDMA workloads.
# quarantineOverrides/drainOverrides are left unset so that behavior follows
# whatever mode the recipe's remediation config picks.
#
# The chart ships a third default policy, node-not-ready. Setting `policies`
# replaces the list wholesale (Helm does not merge lists), so it is dropped
# here on purpose: a general node-readiness signal outside this mixin's scope.

kind: RecipeMixin
apiVersion: aicr.run/v1beta1
metadata:
  name: nvsentinel-object-monitor
spec:
  componentRefs:
    - name: nvsentinel
      overrides:
        global:
          kubernetesObjectMonitor:
            enabled: true
        kubernetes-object-monitor:
          policies:
            - name: gpu-operator-pods-health
              enabled: true
              resource:
                group: ""
                version: v1
                kind: Pod
              predicate:
                expression: |
                  (resource.metadata.namespace == 'gpu-operator' ||
                   resource.metadata.namespace == 'privileged-gpu-operator') &&
                  has(resource.metadata.ownerReferences) &&
                  resource.metadata.ownerReferences.exists(r, r.kind == 'DaemonSet') &&
                  has(resource.metadata.labels) &&
                  'app.kubernetes.io/managed-by' in resource.metadata.labels &&
                  resource.metadata.labels['app.kubernetes.io/managed-by'] == 'gpu-operator' &&
                  has(resource.spec.nodeName) && resource.spec.nodeName != "" &&
                  has(resource.status.startTime) &&
                  now - timestamp(resource.status.startTime) > duration('30m') &&
                  (
                    (resource.status.phase != 'Running' && resource.status.phase != 'Succeeded') ||
                    (
                      has(resource.status.containerStatuses) &&
                      resource.status.containerStatuses.exists(cs,
                        has(cs.state.waiting) &&
                        has(cs.state.waiting.reason) &&
                        cs.state.waiting.reason == 'CrashLoopBackOff'
                      )
                    )
                  )
              nodeAssociation:
                expression: resource.spec.nodeName
              healthEvent:
                componentClass: Software
                isFatal: true
                message: "GPU Operator DaemonSet pod is not healthy"
                recommendedAction: CONTACT_SUPPORT
                errorCode:
                  - GPU_OPERATOR_POD_UNHEALTHY
            - name: network-operator-pod-health
              enabled: true
              resource:
                group: ""
                version: v1
                kind: Pod
              predicate:
                expression: |
                  (resource.metadata.namespace == 'nvidia-network-operator' ||
                   resource.metadata.namespace == 'privileged-network-operator') &&
                  has(resource.metadata.ownerReferences) &&
                  resource.metadata.ownerReferences.exists(r, r.kind == 'DaemonSet') &&
                  has(resource.metadata.labels) &&
                  'ds-owner' in resource.metadata.labels &&
                  resource.metadata.labels['ds-owner'] == 'NicClusterPolicy' &&
                  has(resource.spec.nodeName) && resource.spec.nodeName != "" &&
                  has(resource.status.startTime) &&
                  now - timestamp(resource.status.startTime) > duration('30m') &&
                  (
                    (resource.status.phase != 'Running' && resource.status.phase != 'Succeeded') ||
                    (
                      has(resource.status.containerStatuses) &&
                      resource.status.containerStatuses.exists(cs,
                        has(cs.state.waiting) &&
                        has(cs.state.waiting.reason) &&
                        cs.state.waiting.reason == 'CrashLoopBackOff'
                      )
                    )
                  )
              nodeAssociation:
                expression: resource.spec.nodeName
              healthEvent:
                componentClass: Software
                isFatal: true
                message: "Network Operator DaemonSet pod is not healthy"
                recommendedAction: CONTACT_SUPPORT
                errorCode:
                  - NETWORK_OPERATOR_POD_UNHEALTHY
            # NPD policies (#2614). These read Node Conditions published by
            # node-problem-detector, not pods, so they fire only where NPD
            # runs: GKE and AKS run their own, elsewhere the npd mixin
            # installs it. Condition type/status/reason triples verified
            # against the pinned image's own config/kernel-monitor.json and
            # config/readonly-monitor.json
            # (registry.k8s.io/node-problem-detector:v1.35.1).
            #
            # processingStrategy: STORE_ONLY on all three, deliberately and
            # unlike the operator policies above: upstream recommends
            # REPLACE_VM, the most destructive action in the pipeline, and
            # that stays unvalidated until these have run on real clusters.
            # STORE_ONLY records the event without acting on it. Note two
            # upstream caveats that make early validation important: a
            # SystemLogMonitor permanent condition latches after the fault is
            # repaired, and restarting NPD resets conditions, which a
            # consumer can read as recovery.
            - name: NPDXfsShutdown
              enabled: true
              resource:
                group: ""
                version: v1
                kind: Node
              predicate:
                expression: |
                  has(resource.status) && has(resource.status.conditions) &&
                  resource.status.conditions.exists(c,
                    c.type == 'XfsShutdown' &&
                    c.status == 'True' &&
                    has(c.reason) && c.reason == 'XfsHasShutdown'
                  )
              nodeAssociation:
                expression: resource.metadata.name
              healthEvent:
                componentClass: Node
                isFatal: true
                message: "Node Problem Detector reported an XFS filesystem shutdown"
                recommendedAction: REPLACE_VM
                errorCode:
                  - NPD_XFS_SHUTDOWN
                processingStrategy: STORE_ONLY
            - name: NPDCperHardwareErrorFatal
              enabled: true
              resource:
                group: ""
                version: v1
                kind: Node
              predicate:
                expression: |
                  has(resource.status) && has(resource.status.conditions) &&
                  resource.status.conditions.exists(c,
                    c.type == 'CperHardwareErrorFatal' &&
                    c.status == 'True' &&
                    has(c.reason) && c.reason == 'CperHardwareErrorFatal'
                  )
              nodeAssociation:
                expression: resource.metadata.name
              healthEvent:
                componentClass: Node
                isFatal: true
                message: "Node Problem Detector reported a fatal UEFI CPER hardware error"
                recommendedAction: REPLACE_VM
                errorCode:
                  - NPD_CPER_HARDWARE_ERROR_FATAL
                processingStrategy: STORE_ONLY
            - name: NPDReadonlyFilesystem
              enabled: true
              resource:
                group: ""
                version: v1
                kind: Node
              predicate:
                expression: |
                  has(resource.status) && has(resource.status.conditions) &&
                  resource.status.conditions.exists(c,
                    c.type == 'ReadonlyFilesystem' &&
                    c.status == 'True' &&
                    has(c.reason) && c.reason == 'FilesystemIsReadOnly'
                  )
              nodeAssociation:
                expression: resource.metadata.name
              healthEvent:
                componentClass: Node
                isFatal: true
                message: "Node Problem Detector reported a read-only root filesystem"
                recommendedAction: REPLACE_VM
                errorCode:
                  - NPD_READONLY_FILESYSTEM
                processingStrategy: STORE_ONLY
