# nvsentinel-observability mixin: turns on NVSentinel's audit logging and
# distributed tracing, off by default in every shipped recipe. Every path
# here is allowlisted by nvsentinel's registry entry
# (mixinSafeOverridePaths, recipes/registry.yaml); see
# docs/contributor/recipe.md#mixin-composition for the enforcement
# mechanism.
#
# global.tracing.endpoint is deliberately absent -- not on the allowlist --
# so the operator must supply it via
# --set nv-sentinel:global.tracing.endpoint=<host:port>. A recipe composing
# this mixin with no endpoint still resolves fine; the bundle fails at
# `aicr bundle` time instead (CheckNVSentinelTracingEndpointRequired).
#
# See docs/user/component-catalog.md#audit-logging-and-tracing for what
# each value below means and how to adopt this mixin.

kind: RecipeMixin
apiVersion: aicr.run/v1beta1
metadata:
  name: nvsentinel-observability
spec:
  componentRefs:
    - name: nvsentinel
      overrides:
        global:
          auditLogging:
            enabled: true
            logRequestBody: false
            maxSizeMB: 100
            maxBackups: 7
            maxAgeDays: 30
            compress: true
          tracing:
            enabled: true
            insecure: false
