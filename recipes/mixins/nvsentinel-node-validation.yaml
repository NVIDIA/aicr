# Turns on NVSentinel's lifecycle-manager, which runs a DCGM diagnostic on a
# new, cordoned GPU node before it takes work. A node that passes is
# uncordoned; one that fails stays cordoned. Needs no datastore. See
# docs/user/component-catalog.md#node-validation.
#
# The controller never cordons a node itself, so a new node is validated only
# if something cordons it within 10 minutes of its creation, behind a scheduling
# barrier from registration: the 600-second batch and the reconcile that
# creates its request, up to about five minutes later, must finish inside the
# 30-minute recently-joined window, with margin.
# The cordoned criterion is pinned so a schedulable node is never selected,
# and not-under-quarantine so fault-quarantine's cordon does not select one.
# CheckNVSentinelNodeValidationCoherent holds the rules.

kind: RecipeMixin
apiVersion: aicr.run/v1beta1
metadata:
  name: nvsentinel-node-validation
spec:
  componentRefs:
    - name: nvsentinel
      overrides:
        global:
          lifecycleManager:
            enabled: true
        lifecycle-manager:
          controllers:
            validationRequest:
              enabled: true
            maintenanceRequest:
              enabled: false
          config:
            schedulingGate:
              cordon:
                remove: true
                labelPrefix: "k8saas.nvidia.com/"
            newNodeValidation:
              criteria:
                - name: recently-joined
                  expression: >-
                    has(node.metadata.creationTimestamp) &&
                    now() - timestamp(node.metadata.creationTimestamp) < duration("30m")
                - name: gpu-present
                  expression: >-
                    has(node.metadata.labels) && "nvidia.com/gpu.present" in node.metadata.labels &&
                    node.metadata.labels["nvidia.com/gpu.present"] == "true"
                - name: cordoned
                  expression: >-
                    has(node.spec.unschedulable) && node.spec.unschedulable
                - name: not-under-quarantine
                  expression: >-
                    !(has(node.metadata.annotations) &&
                    "quarantineHealthEvent" in node.metadata.annotations)
              newNodeTests:
                - dcgm-diag-test
