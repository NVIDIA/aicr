# Turns on lifecycle-manager's MaintenanceRequest controller, so an external
# system or an operator can put a node into maintenance by creating a
# MaintenanceRequest: NVSentinel cordons and drains the node through its
# normal pipeline, and deleting the request uncordons it. See
# docs/user/component-catalog.md#maintenance-requests.
#
# It sets only the controller toggle. lifecycle-manager itself is turned on by
# nvsentinel-node-validation, its sole owner, and the cordon and drain come
# from a quarantine or remediation step; the chart's fault-quarantine rule
# sets already match the events a request publishes.
# CheckNVSentinelMaintenanceRequestCoherent holds the rules.

kind: RecipeMixin
apiVersion: aicr.run/v1beta1
metadata:
  name: nvsentinel-maintenance-request
spec:
  componentRefs:
    - name: nvsentinel
      overrides:
        lifecycle-manager:
          controllers:
            maintenanceRequest:
              enabled: true
