# Opt-in mixin: installs the upstream node-problem-detector DaemonSet, whose
# Node Conditions the nvsentinel-object-monitor mixin's NPD policies consume.
# Off by default in every shipped recipe.
#
# Do NOT adopt on GKE or AKS -- both already run their own NPD, and a second
# instance competes for ownership of the same Node Conditions.
# CheckNPDNotDuplicatingProviderNPD blocks that at bundle time.
#
# node-problem-detector is a new component name, absent from every base chain,
# so this mixin carries a full componentRefs entry rather than an overrides
# allowlist path.

kind: RecipeMixin
apiVersion: aicr.run/v1beta1
metadata:
  name: npd
spec:
  componentRefs:
    - name: node-problem-detector
      type: Helm
      valuesFile: components/node-problem-detector/values.yaml
