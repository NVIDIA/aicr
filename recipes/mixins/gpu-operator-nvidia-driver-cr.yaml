# Opt-in manifest wiring for deployments that move driver lifecycle ownership
# from ClusterPolicy.spec.driver to a separately managed NVIDIADriver CR. The
# consuming overlay owns the policy decision and must enable
# driver.nvidiaDriverCRD, disable deployDefaultCR, clear the legacy driver
# identity/upgradePolicy, and provide the nvidiaDriver values consumed by the
# manifest. Keeping those values out of this mixin avoids imposing one fleet's
# driver version and rollout policy on every AICR consumer.
kind: RecipeMixin
apiVersion: aicr.run/v1beta1
metadata:
  name: gpu-operator-nvidia-driver-cr
spec:
  componentRefs:
    - name: gpu-operator
      manifestFiles:
        - components/gpu-operator/manifests/nvidia-driver.yaml
