# os-sles mixin: OS constraints for SUSE Linux Enterprise Server GPU nodes.
#
# The floor is SLES 15 SP7: SUSE publishes precompiled NVIDIA driver
# containers for SLES 15 SP7 and SLES 16 (registry.suse.com/third-party/nvidia,
# tags <branch>-<uname -r>-sles<version>). No kernel version is constrained:
# the GPU Operator selects the driver image matching the node's running
# kernel, so any kernel SUSE ships a precompiled image for is valid.
#
# Component overrides live in the service+os overlay (e.g. rke2-sles), not
# here: mixins may only set registry-allowlisted override paths.

kind: RecipeMixin
apiVersion: aicr.run/v1beta1
metadata:
  name: os-sles

spec:
  constraints:
    - name: OS.release.ID
      value: sles
    - name: OS.release.VERSION_ID
      value: ">= 15.7"
