# Assert kind monitoring stack components required by H100 CI are healthy.

# Prometheus Operator - manages the Prometheus CR
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-prometheus-operator
  namespace: monitoring
status:
  (conditions[?type == 'Available']):
    - status: "True"
---
# Prometheus StatefulSet - serves PromQL to prometheus-adapter and Dynamo
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus-kube-prometheus-prometheus
  namespace: monitoring
status:
  (readyReplicas > `0`): true
---
# k8s-ephemeral-storage-metrics - ephemeral storage usage metrics
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-ephemeral-storage-metrics
  namespace: monitoring
status:
  (conditions[?type == 'Available']):
    - status: "True"
---
# Prometheus Adapter - custom metrics API for HPA
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-adapter
  namespace: monitoring
status:
  (conditions[?type == 'Available']):
    - status: "True"
