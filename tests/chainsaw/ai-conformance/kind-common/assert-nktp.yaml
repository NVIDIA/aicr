# Assert the NKTP telemetry pipeline on a kind lane: the operator, one
# gateway, the node collector, the evaluation backend, and the resource
# metrics API that kind.yaml turns on. recipes/checks/nktp/health-check.yaml
# covers every workload.

# OpenTelemetry Operator, which reconciles every collector
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nktp-operator
  namespace: nktp
status:
  (conditions[?type == 'Available']):
    - status: "True"
---
# Metrics gateway, one replica on kind
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nktp-gateway-metrics-collector
  namespace: nktp
status:
  (readyReplicas > `0`): true
---
# Node collector on every node
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nktp-daemonset-collector
  namespace: nktp
status:
  (numberReady == desiredNumberScheduled && desiredNumberScheduled > `0`): true
---
# otel-lgtm, the evaluation backend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lgtm
  namespace: nktp
status:
  (conditions[?type == 'Available']):
    - status: "True"
---
# Served by NKTP's metrics-server, which kind.yaml enables
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1beta1.metrics.k8s.io
status:
  (conditions[?type == 'Available']):
    - status: "True"
