# Assert NVSentinel workloads on a kind lane. Reduced compared to the cluster
# profile, which asserts all seven.
#
# Five DaemonSets are not asserted here, for two different reasons.
#
# Three never schedule on a kind lane, because the node label each one selects
# on is never written:
#
#   gpu-health-monitor-dcgm-3.x      nvsentinel.dgxc.nvidia.com/dcgm.version=3.x
#   gpu-health-monitor-dcgm-4.x      nvsentinel.dgxc.nvidia.com/dcgm.version=4.x
#   syslog-health-monitor-kata       nvsentinel.dgxc.nvidia.com/kata.enabled=true
#
# dcgm.version is written by the NVSentinel labeler from the image tag of a
# Ready pod labelled app=nvidia-dcgm. recipes/overlays/kind.yaml disables the
# standalone DCGM host engine (gpu-operator dcgm.enabled: false), so no such
# pod runs and the label is never written. The dcgm-exporter that replaces it
# does not substitute: the labeler matches the tag `dcgm:<major>.`, and the
# exporter image is `dcgm-exporter:<version>`. Supplying a DCGM host engine is
# therefore sufficient to schedule the GPU health monitors here. kata.enabled
# is true only on a Kata node, and a kind cluster has none.
#
# The other two do schedule on the nvkind H100 lanes, and run Ready there:
#
#   metadata-collector               nvidia.com/gpu.present=true
#                                    + nvsentinel.dgxc.nvidia.com/driver.installed=true
#   syslog-health-monitor-regular    driver.installed=true, kata.enabled=false
#
# No driver pod writes driver.installed on kind: the host supplies the driver
# on nvkind, so the same overlay sets driver.enabled: false. The labeler
# assumes it instead, because the overlay also sets
# labeler.assumeDriverInstalled: true. The component health check
# (recipes/checks/nvsentinel/health-check.yaml) asserts the rollout of both,
# so this file does not repeat it.
#
# Both gpu-health-monitor variants and both syslog-health-monitor variants are
# mutually exclusive pairs: the labeler stamps exactly one dcgm.version, and a
# node is either kata-enabled or not. At most one member of each pair can
# schedule, so asserting both would fail by construction.

# NVSentinel controller — manages network policies and platform configuration
apiVersion: apps/v1
kind: Deployment
metadata:
  name: labeler
  namespace: nvsentinel
status:
  (conditions[?type == 'Available']):
    - status: "True"
---
# NVSentinel platform connector — DaemonSet on all nodes for platform telemetry
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: platform-connectors
  namespace: nvsentinel
status:
  (numberReady > `0`): true
  (desiredNumberScheduled > `0`): true
