apiVersion: helm/v1
kind: Values
storage:
  enabled: true
  home:
    storageClassName: efs-sc
  data:
    storageClassName: efs-sc
loginsets:
  slinky:
    login:
      (volumeMounts[?name == 'shared-home' && mountPath == '/home'] | length(@) == `1`): true
      (volumeMounts[?name == 'shared-data' && mountPath == '/scratch/fsw'] | length(@) == `1`): true
    podSpec:
      (volumes[?name == 'shared-home' && persistentVolumeClaim.claimName == 'shared-home'] | length(@) == `1`): true
      (volumes[?name == 'shared-data' && persistentVolumeClaim.claimName == 'shared-data'] | length(@) == `1`): true
  secondary:
    enabled: false
    login:
      (volumeMounts[?name == 'shared-home' && mountPath == '/home'] | length(@) == `1`): true
      (volumeMounts[?name == 'shared-data' && mountPath == '/scratch/fsw'] | length(@) == `1`): true
    podSpec:
      (volumes[?name == 'shared-home' && persistentVolumeClaim.claimName == 'shared-home'] | length(@) == `1`): true
      (volumes[?name == 'shared-data' && persistentVolumeClaim.claimName == 'shared-data'] | length(@) == `1`): true
nodesets:
  slinky:
    slurmd:
      (volumeMounts[?name == 'shared-home' && mountPath == '/home'] | length(@) == `1`): true
      (volumeMounts[?name == 'shared-data' && mountPath == '/scratch/fsw'] | length(@) == `1`): true
    podSpec:
      (volumes[?name == 'shared-home' && persistentVolumeClaim.claimName == 'shared-home'] | length(@) == `1`): true
      (volumes[?name == 'shared-data' && persistentVolumeClaim.claimName == 'shared-data'] | length(@) == `1`): true
  secondary:
    enabled: false
    slurmd:
      (volumeMounts[?name == 'shared-home' && mountPath == '/home'] | length(@) == `1`): true
      (volumeMounts[?name == 'shared-data' && mountPath == '/scratch/fsw'] | length(@) == `1`): true
    podSpec:
      (volumes[?name == 'shared-home' && persistentVolumeClaim.claimName == 'shared-home'] | length(@) == `1`): true
      (volumes[?name == 'shared-data' && persistentVolumeClaim.claimName == 'shared-data'] | length(@) == `1`): true
