# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cli-evidence-publish
  labels:
    requires: docker # throwaway registry:2; tools/e2e drops requires=docker when no Docker daemon is reachable
spec:
  description: |
    CLI-boundary coverage for the standalone `aicr evidence publish` verb
    (#1806). Publishes a committed, unsigned summary bundle
    (testdata/summary-bundle, regenerated by gen.go) to a local registry:2
    over plain HTTP with --no-sign, asserts the pointer it writes, and
    closes the loop with `aicr evidence verify` against that pointer.
    No cluster, no Sigstore, no network beyond 127.0.0.1. Runs in both cli-e2e
    lanes (fork and same-repo). Uses a fixed container name and work dir, so
    two concurrent local invocations would trample each other; run it once.
    Run with: AICR_BIN=$(pwd)/dist/e2e/aicr chainsaw test --no-cluster --test-dir tests/chainsaw/cli/evidence-publish
  timeouts:
    exec: 90s
  steps:
    - name: setup-registry-and-bundle
      description: Start registry:2 on an ephemeral 127.0.0.1 port and stage a copy of the fixture bundle.
      try:
        - script:
            content: |
              set -eu
              WORK="/tmp/chainsaw-evidence-publish"
              NAME="chainsaw-evidence-registry"
              rm -rf "${WORK}" && mkdir -p "${WORK}/bundle"
              # publish writes pointer.yaml beside summary-bundle/, so never run it
              # against the checked-in fixture.
              cp -R ./testdata/summary-bundle "${WORK}/bundle/summary-bundle"
              docker rm -f "${NAME}" >/dev/null 2>&1 || true
              docker run -d --name "${NAME}" -p 127.0.0.1::5000 registry:2 >/dev/null
              PORT="$(docker port "${NAME}" 5000/tcp | head -n1 | sed 's/.*://')"
              [ -n "${PORT}" ] || { echo "could not resolve the registry host port"; exit 1; }
              i=0
              until curl -fsS "http://127.0.0.1:${PORT}/v2/" >/dev/null 2>&1; do
                i=$((i + 1))
                [ "${i}" -lt 60 ] || { echo "registry did not become ready on port ${PORT}"; docker logs "${NAME}"; exit 1; }
                sleep 1
              done
              printf '%s' "${PORT}" > "${WORK}/port"
              echo "registry ready on 127.0.0.1:${PORT}"
            check:
              ($error == null): true
      cleanup:
        - script:
            content: |
              docker rm -f chainsaw-evidence-registry >/dev/null 2>&1 || true
              rm -rf /tmp/chainsaw-evidence-publish

    - name: publish-unsigned-plain-http
      description: The standalone verb pushes the bundle and writes pointer.yaml with an empty signer block.
      try:
        - script:
            content: |
              set -eu
              AICR_BIN="${AICR_BIN:?Set AICR_BIN to the path of the aicr binary}"
              WORK="/tmp/chainsaw-evidence-publish"
              PORT="$(cat "${WORK}/port")"
              "${AICR_BIN}" evidence publish "${WORK}/bundle" \
                --push "127.0.0.1:${PORT}/aicr-evidence/cli-test:offline" \
                --no-sign --plain-http
              test -f "${WORK}/bundle/pointer.yaml"
              cat "${WORK}/bundle/pointer.yaml"
            check:
              ($error == null): true
              (parse_yaml($stdout).recipe): h100-eks-ubuntu-training
              (length(parse_yaml($stdout).attestations)): 1
              (parse_yaml($stdout).attestations[0].signer == null): true
              (contains(parse_yaml($stdout).attestations[0].bundle.oci, '/aicr-evidence/cli-test')): true
              (starts_with(parse_yaml($stdout).attestations[0].bundle.digest, 'sha256:')): true

    - name: artifact-is-in-registry
      description: The registry now lists the pushed tag.
      try:
        - script:
            content: |
              set -eu
              WORK="/tmp/chainsaw-evidence-publish"
              PORT="$(cat "${WORK}/port")"
              curl -fsS "http://127.0.0.1:${PORT}/v2/aicr-evidence/cli-test/tags/list"
            check:
              ($error == null): true
              (contains(json_parse($stdout).tags, 'offline')): true

    - name: verify-round-trip
      description: evidence verify pulls the pushed bundle through the pointer and reaches a verdict of 0.
      try:
        - script:
            content: |
              AICR_BIN="${AICR_BIN:?Set AICR_BIN to the path of the aicr binary}"
              WORK="/tmp/chainsaw-evidence-publish"
              "${AICR_BIN}" evidence verify "${WORK}/bundle/pointer.yaml" \
                --registry-plain-http --format json
            check:
              ($error == null): true
              (json_parse($stdout).exit): 0

    - name: missing-push-is-invalid-request
      description: --push is required for the standalone verb.
      try:
        - script:
            content: |
              AICR_BIN="${AICR_BIN:?Set AICR_BIN to the path of the aicr binary}"
              WORK="/tmp/chainsaw-evidence-publish"
              "${AICR_BIN}" evidence publish "${WORK}/bundle" --no-sign
              echo "exit=$?"
            check:
              ($stdout): "exit=2\n"
              (contains($stderr, '--push')): true

    - name: non-bundle-dir-is-invalid-request
      description: A directory without recipe.yaml and manifest.json is rejected before any push.
      try:
        - script:
            content: |
              AICR_BIN="${AICR_BIN:?Set AICR_BIN to the path of the aicr binary}"
              WORK="/tmp/chainsaw-evidence-publish"
              PORT="$(cat "${WORK}/port")"
              mkdir -p "${WORK}/not-a-bundle"
              "${AICR_BIN}" evidence publish "${WORK}/not-a-bundle" \
                --push "127.0.0.1:${PORT}/aicr-evidence/cli-test:never" --no-sign --plain-http
              echo "exit=$?"
            check:
              ($stdout): "exit=2\n"
              (contains($stderr, 'does not look like a summary bundle')): true
