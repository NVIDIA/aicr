# Assert that nfd values.yaml carries the union of system and accelerated
# tolerations on worker.tolerations (#3135).
#
# When `aicr bundle` is run with:
#   --system-node-toleration CriticalAddonsOnly:NoSchedule
#   --accelerated-node-toleration nvidia.com/gpu=present:NoSchedule
#
# worker.tolerations is registered under both tiers, so it gets both entries,
# system first; master.tolerations is system-only and gets just the first.
# Array assertions match length and order.
#
# NOTE: apiVersion/kind are prepended by the test script; they are not part of
# the actual values.
apiVersion: helm/v1
kind: Values

worker:
  (nodeSelector == null): true  # NFD worker runs on all nodes
  tolerations:
    - effect: NoSchedule
      key: CriticalAddonsOnly
      operator: Exists
    - effect: NoSchedule
      key: nvidia.com/gpu
      operator: Equal
      value: present

master:
  tolerations:
    - effect: NoSchedule
      key: CriticalAddonsOnly
      operator: Exists
