# AICRConfig consumed by `aicr {snapshot,recipe,bundle,validate} --config`.
#
# ArgoCD deployer variant of h100-training-config.yaml. The only functional
# difference is `spec.bundle.deployment.deployer: argocd` — every other field
# (recipe criteria, scheduling, snapshot/validate agent) is identical to the
# helmfile sibling so a green run here is direct evidence the `--deployer
# argocd` GitOps path works on the same recipe the helmfile lane validates.
#
# See ../../lib/phases.sh (install_argocd) for the install-phase flow:
# `aicr bundle` pushes the same content to ghcr.io/nvidia/aicr-bundle-scratch
# and Argo CD's repo-server pulls from that OCI ref via a prefix-matched
# repo-creds Secret provisioned in-cluster from the workflow's GITHUB_TOKEN.
#
# Manual dispatch only for now (issue #2194): enroll in the nightly batch as
# a separate follow-up after a green manual run mirrors the azure-h100 /
# kind onboarding pattern (PRs #1722, #1843).
#
# Evidence push target is deliberately shared with the helmfile config: the
# recipe (and therefore the evidence coordinate) is identical, and RUN_ID
# tag isolation prevents same-recipe cross-run collisions. If the dashboard
# grows a deployer facet later, tag the run there — not by forking the OCI
# repo per deployer.
kind: AICRConfig
apiVersion: aicr.run/v1alpha2
metadata:
  name: eks-h100-training-uat-argocd

spec:
  snapshot:
    output:
      path: snapshot.yaml
    agent:
      namespace: aicr-validation
      nodeSelector:
        nodeGroup: gpu-worker
      tolerations:
        - dedicated=worker-workload:NoSchedule
        - dedicated=worker-workload:NoExecute
        - nvidia.com/gpu=present:NoSchedule
        # The GPU pool carries skyhook.nvidia.com=runtime-required:NoSchedule
        # (cluster-config.yaml) until NodeWright finishes tuning + reboot. The
        # snapshot runs pre-deployment, so this taint is still present and the
        # agent — pinned to the GPU pool above — must tolerate it to schedule.
        - skyhook.nvidia.com=runtime-required:NoSchedule

  recipe:
    criteria:
      service: eks
      accelerator: h100
      os: ubuntu
      intent: training
      platform: kubeflow
    output:
      path: recipe.yaml

  bundle:
    input:
      recipe: recipe.yaml
    output:
      # phase_prep overrides --output at CLI time with an oci:// target
      # (ARGOCD_OCI_PREFIX in lib/phases.sh + a run-scoped tag). The local
      # ./bundle directory still receives app-of-apps.yaml so `kubectl apply`
      # has a manifest to consume.
      target: ./bundle
    deployment:
      deployer: argocd
    scheduling:
      acceleratedNodeSelector:
        nodeGroup: gpu-worker
      acceleratedNodeTolerations:
        - dedicated=worker-workload:NoSchedule
        - dedicated=worker-workload:NoExecute
        - nvidia.com/gpu=present:NoSchedule
      systemNodeSelector:
        nodeGroup: system-worker
      systemNodeTolerations:
        - dedicated=system-workload:NoSchedule
        - dedicated=system-workload:NoExecute
      # Consume the cluster's default StorageClass rather than hardcoding a
      # name. The aws-ebs-csi-driver component provisions a gp3-backed default
      # named "ebs-csi-default-sc" (annotated is-default-class=true), so an
      # empty value binds PVCs to it automatically. Pinning a literal "gp3"
      # only works on clusters using the AWS managed EBS CSI addon (which
      # auto-creates a class named "gp3") — not on an aicr-bundle-deployed
      # cluster, where the StatefulSet would otherwise never be created (#1455).
      storageClass: ""

  validate:
    execution:
      # The deployment phase is the readiness barrier (gpu-operator ClusterPolicy
      # reaches state=ready, the DRA kubelet-plugin DaemonSet rolls out, nodewright
      # node tuning completes). failFast stops the run if that phase fails, so the
      # conformance/performance phases are not evaluated against a not-yet-converged
      # cluster — which previously surfaced as misleading accelerator-metrics /
      # ai-service-metrics / pod-autoscaling failures. The `../run` readiness gate
      # gives the operator-driven stack time to converge before validate, so on a
      # healthy cluster the deployment phase passes and all phases still run.
      failFast: true
    input:
      recipe: recipe.yaml
      snapshot: snapshot.yaml
    agent:
      namespace: aicr-validation
      tolerations:
        - dedicated=worker-workload:NoSchedule
        - dedicated=worker-workload:NoExecute
        - nvidia.com/gpu=present:NoSchedule
    evidence:
      attestation:
        # Setting `out` enables emit. The push target below is the stable
        # per-recipe repo; ../run appends a `:run-${RUN_ID}` tag for per-run
        # isolation. Consumers pin immutably via the artifact digest.
        out: ./evidence
        push: ghcr.io/nvidia/aicr-evidence/h100-eks-ubuntu-training-kubeflow
