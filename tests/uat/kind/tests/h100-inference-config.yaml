# AICRConfig consumed by `aicr {snapshot,recipe,bundle,validate} --config`.
#
# Drives the nvkind H100 inference UAT (DC5 #1278) — the `service: kind`
# sibling of tests/uat/aws/tests/h100-inference-config.yaml, run on a
# single-node, single-GPU nvkind cluster provisioned on a self-hosted GPU
# runner (no cloud actuator). Same AICRConfig shape as the cloud lanes; the
# differences are all single-node/nvkind scheduling (see the training sibling).
#
# As on the cloud lanes, the signed evidence bundle is emitted by the
# conformance step (validate --phase all); the served-inference CUJ is not
# executed here (vLLM is excluded from UAT), so evidence covers the deployed
# stack.
kind: AICRConfig
apiVersion: aicr.run/v1alpha2
metadata:
  name: kind-h100-inference-uat

spec:
  snapshot:
    output:
      path: snapshot.yaml
    agent:
      namespace: aicr-validation
      tolerations:
        - "*"

  recipe:
    criteria:
      # No os: the h100-kind-* overlays are os-agnostic (nvkind runs on whatever
      # the runner has), so specifying an os fails resolution. See the training
      # sibling.
      service: kind
      accelerator: h100
      intent: inference
      platform: dynamo
    output:
      path: recipe.yaml

  bundle:
    input:
      recipe: recipe.yaml
    output:
      target: ./bundle
    deployment:
      deployer: helmfile
      # No NVSentinel override: the kind overlay assigns
      # labeler.assumeDriverInstalled itself (#2181), so this lane exercises
      # the recipe supplying the remedy unaided. Kind is host-installed via
      # nvkind (driver.enabled=false), so no driver pod exists for the
      # labeler to observe and the value is required.
    scheduling:
      acceleratedNodeTolerations:
        - nvidia.com/gpu=present:NoSchedule
      storageClass: ""

  validate:
    execution:
      failFast: true
    input:
      recipe: recipe.yaml
      snapshot: snapshot.yaml
    agent:
      namespace: aicr-validation
      tolerations:
        - "*"
    evidence:
      attestation:
        out: ./evidence
        push: ghcr.io/nvidia/aicr-evidence/h100-kind-inference-dynamo
