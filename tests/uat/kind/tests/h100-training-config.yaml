# AICRConfig consumed by `aicr {snapshot,recipe,bundle,validate} --config`.
#
# Drives the nvkind H100 training UAT (DC5 #1278) — the `service: kind`
# sibling of tests/uat/aws/tests/h100-training-config.yaml, run on a
# single-node, single-GPU nvkind cluster provisioned on a self-hosted GPU
# runner (no cloud actuator). Same AICRConfig shape as the cloud lanes; the
# differences are all single-node/nvkind scheduling:
#
#   - The whole cluster is one nvkind node (the GPU is on the control plane),
#     so agents tolerate everything (`*`) and pin no nodeSelector.
#   - The bundle tolerates the accelerated-node taint only (matching the
#     existing nvkind runtime lane's `--accelerated-node-toleration
#     nvidia.com/gpu:NoSchedule`); there is no separate system pool.
#   - storageClass is left empty to bind PVCs to the kind default class.
#
# `spec.validate.evidence.attestation.push` carries the stable per-recipe repo
# only; `../run` appends a `:run-${RUN_ID}` tag at runtime so each UAT
# execution publishes a uniquely traceable, digest-addressed point under one
# stable repo. Consumers pin immutably via `@sha256:…`.
kind: AICRConfig
apiVersion: aicr.run/v1alpha2
metadata:
  name: kind-h100-training-uat

spec:
  snapshot:
    output:
      path: snapshot.yaml
    agent:
      namespace: aicr-validation
      # Single nvkind node — tolerate every taint (the GPU sits on the control
      # plane) and pin no nodeSelector. Mirrors the existing runtime lane's
      # `--toleration '*'`.
      tolerations:
        - "*"

  recipe:
    criteria:
      service: kind
      accelerator: h100
      os: ubuntu
      intent: training
      platform: kubeflow
    output:
      path: recipe.yaml

  bundle:
    input:
      recipe: recipe.yaml
    output:
      target: ./bundle
    deployment:
      deployer: helmfile
    scheduling:
      # No nodeSelector on a single-node kind cluster; tolerate the
      # accelerated-node taint so GPU operands schedule onto the one node.
      acceleratedNodeTolerations:
        - nvidia.com/gpu=present:NoSchedule
      # Bind PVCs to the kind default StorageClass rather than hardcoding a
      # provider-specific name.
      storageClass: ""

  validate:
    execution:
      # failFast stops the run if the deployment (readiness) phase fails, so the
      # conformance/performance phases are not evaluated against a not-yet-
      # converged cluster. The `../run` readiness gate gives the operator stack
      # time to converge before validate.
      failFast: true
    input:
      recipe: recipe.yaml
      snapshot: snapshot.yaml
    agent:
      namespace: aicr-validation
      tolerations:
        - "*"
    evidence:
      attestation:
        # Setting `out` enables emit. The push target is the stable per-recipe
        # repo; ../run appends a `:run-${RUN_ID}` tag for per-run isolation.
        # Must fall under a trusted registry (ghcr.io/nvidia) for ingest.
        out: ./evidence
        push: ghcr.io/nvidia/aicr-evidence/h100-kind-ubuntu-training-kubeflow
