# nvkind cluster descriptor (DC5 #1278) — INFORMATIONAL ONLY.
#
# Unlike tests/uat/{aws,gcp,azure}/cluster-config.yaml (github.com/mchmarny/cluster
# actuator configs consumed by a cloud provisioner), the nvkind lane provisions
# its cluster on the self-hosted GPU runner via the .github/actions/gpu-cluster-setup
# composite action — NOT from this file. It exists to (a) satisfy the reservation
# registry's required cluster-config-path field and (b) document the cluster
# shape the nvkind lane targets. uat-kind.yaml does not feed it to any actuator.
apiVersion: aicr.run/v1alpha1
kind: NvkindClusterDescriptor

# The runner this lane leases (its physical single-GPU capacity is the
# reservation). Mirrors the label the existing nvkind runtime lanes use.
runner: linux-amd64-gpu-h100-latest-1

cluster:
  # Single-node kind cluster: one control-plane node with the host's NVIDIA GPU
  # passed through (nvkind + NVIDIA container toolkit). The GPU sits on the
  # control plane, so UAT agents tolerate every taint (see the test configs).
  nodes: 1
  accelerator: h100
  gpuCount: 1
